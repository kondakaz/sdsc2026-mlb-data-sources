<script>
const DB = [{"id":"2025_mlba_1_44","year":2025,"dept":"MLB部門","dept_detail":"MLB部門","title":"打者と投手タイプの相性分析","members":"村上雅基，尼崎太樹(熊本大学)","first_author":"村上雅基","affiliation":"熊本大学","code":"P3-18","abstract":"Statcastから2017-2019年のMLBデータを抽出し、ガウス混合モデルとLDAで10タイプの投手クラスタを特定した。プラトーンシステムの効果を再確認するとともに、同一利き手内でもシンカー主体の投手が他の利き手の打者にも影響を与えることを統計的に明らかにした。","methods":["クラスタリング","機械学習","統計的検定"],"themes":["投球・配球","打撃","戦術分析","選手評価"],"data":["公式成績データ","外部データ併用"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球における代表的な戦術の一つに,プラトーン・システムがある.これは,右投手に対しては左打者を,左投手に対しては右打者を対戦させるという戦術である.この戦術は,統計的に「打者は自分と逆の利き手の投手と対戦する際,より高い打撃成績を残す」という傾向に基づき,広く採用されている[1].しかし,プラトーン・システムは投手の「利き手」だけに着目しており,個々の投手の特徴までは考慮してない.そこで本研究では,投手の特徴と打者相性の関係性を明らかにすることを目的に行う.本報告書では,以下の手順で分析を進める.まず,投手をStatcast から取得した物理データに基づいてクラスタリングを行う.次に,得られた各投手クラスタに対し,球種割合や平均球速といった観点から各クラスタの特徴を定義する.最後に,導出された投手クラスタと打者の対戦成績を統計的検定を用いて評価する.","excerpt_src":"はじめに"},{"id":"2025_mlba_1_55","year":2025,"dept":"MLB部門","dept_detail":"MLB部門","title":"MLB先発投手の投球特性の可視化と指導支援","members":"加瀬稔弥，山本義郎(東海大学)","first_author":"加瀬稔弥","affiliation":"東海大学","code":"P3-19","abstract":"Baseball SavantとFanGraphsから2022-2025年のMLB先発投手67名のデータを抽出し、k-meansクラスタリングで14タイプを分類した。セイバーメトリクス（FIP、xFIP、WHIP、LOB%）による評価で、シーズン途中6月時点での投手パフォーマンス変化をリアルタイムに把握可能なWebアプリケーション支援システムを構築した。","methods":["クラスタリング","可視化","機械学習"],"themes":["投球・配球","選手評価","育成・指導","試合の流れ"],"data":["公式成績データ","外部データ併用"],"free_tags":["FIP","xFIP"],"awards":[],"text_insufficient":false,"excerpt":"","excerpt_src":null,"note":"本文開始位置の特定不可のため引用不可 (要原稿確認) / 本文開始位置の特定不可のため引用不可 (要原稿確認) / 本文開始位置の特定不可のため引用不可 (要原稿確認) / 本文開始位置の特定不可のため引用不可 (要原稿確認) / 本文開始位置の特定不可のため引用不可 (要原稿確認) / 本文開始位置の特定不可のため引用不可 (要原稿確認)"},{"id":"2025_mlba_1_81","year":2025,"dept":"MLB部門","dept_detail":"MLB部門","title":"MLB各球団にサラリーキャップ制度を導入した場合の変化","members":"猶江健心，山口敦子(東京都市大学)","first_author":"猶江健心","affiliation":"東京都市大学","code":"P3-20","abstract":"架空チームを用いたシミュレーション研究により、280万ドルのサラリーキャップ導入が競争均衡に与える影響を検証した。導入によりビッグマーケットチームの優位性が緩和され、ポストシーズン進出率の市場規模間格差が有意に縮小する可能性を示唆した。","methods":["シミュレーション","統計的検定","確率モデル"],"themes":["経営・制度","チーム評価","勝敗要因"],"data":["公式成績データ"],"free_tags":["Statcast"],"awards":[],"text_insufficient":false,"excerpt":"近年のメジャーリーグベースボール(MLB) では,球団間の資金力や選手に支払われる年俸の総額に差が開いている.資金力を持った球団をビッグマーケットチームとよび,持たない球団をスモールマーケットチームとよぶ.例えば,2024 年のニューヨークメッツの総年俸は約3 億ドルであり[1],ビッグマーケットチームの典型である.一方,アスレチックスの総年俸は約6000 万ドルであり[1],スモールマーケットチームの典型であると言える.また,大型契約をする資金力が無いため,主力の選手を引き留めることができずにビッグマーケットチームに放出してしまうという事態が起こるなど,資金力の差により,競争が不平等となっている.さらに,北米4 大プロスポーツの中で,MLB のみ,給与上限(サラリーキャップ) が各球団に設定されていないため,スモールマーケットチームとビッグマーケットチームの金銭的な競争力の格差は縮まらないままである.","excerpt_src":"はじめに"},{"id":"2025_mlba_1_21","year":2025,"dept":"MLB部門","dept_detail":"MLB部門","title":"Pose-based Action Recognition による MLB ホームランダービー投打映像からの本塁打成否予測","members":"稲福力也，北島栄司，廣瀨颯，宮田龍太(琉球大学)","first_author":"稲福力也","affiliation":"琉球大学","code":"P4-17","abstract":"SAM2によるマスキング、HRNetによる姿勢推定、PoseC3Dによる行動認識の統合フレームワークで、投手と打者の協調動作のみから本塁打成否を約71%の精度で予測可能であることを示した。打者の腕の位置と肩角度が本塁打の重要な特徴であり、ボール情報に依らない動作分析によるパフォーマンス予測が実現された。","methods":["深層学習","画像認識・姿勢推定","ニューラルネットワーク"],"themes":["打撃","選手評価"],"data":["映像データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"ホームランダービーは, MLB オールスターゲームに付随するイベントとして 40 年にわたり開催されており, 強打者たちが 4 分間の制限時間内で放った本塁打の数を競うものである. とくに決勝戦は, 打者の高いスキルと集中力が要求されるがために, 例年大いなる盛り上がりを見せる.通常の試合とは異なり, 投手は打者が本塁打を放ちやすいコースと球速で投球することが前提であるにもかかわらず, 打球が必ずしもホームランに至るとは限らない. 同一セッションであっても,「飛ぶ球」と「飛ばない球」が生じる理由は十分に解明されておらず, 競技パフォーマンスの根幹を理解するうえで興味深い現象である.我々は, この差異を生み出す要因として, ピッチングとスイングが織りなす投手と打者の同調 (coordination), すなわち両者の動作における連携・調和・タイミングに着目した. 近年, 動画から人物の関節座標を推定する姿勢推定モデルと, その情報を基に動作を分類する行動認識モデルが急速に発展しており, 握手やハグといった人間同士の複雑な相互作用の識別においても高い性能を示している. この技術を応用することで, ホームランダービーにおける投手・打者の協調動作を定量的に評価できる可能性がある.そこで本研究では, 投手の投球開始から打者の打撃の瞬間までの約 2 秒間の映像を入力とする行動認識モデルを構築し, 当該スイングがホームランに至ったかどうかを予測する枠組みを提案する.","excerpt_src":"はじめに"},{"id":"2025_mlba_1_49","year":2025,"dept":"MLB部門","dept_detail":"MLB部門","title":"MLB における盗塁の戦術的価値 ―得点期待値・得点効率・打者成績からの検証―","members":"谷川瑞樹，宮本道子(長崎大学)","first_author":"谷川瑞樹","affiliation":"長崎大学","code":"P4-18","abstract":"得点期待値分析、チーム得点効率の重回帰モデル、打者レベルのロジスティック回帰から、2023年ルール改定前後で盗塁の価値構造は大きく変化していないことを示した。盗塁成功のRE利得は+0.21程度で一定だが、長打力と四球がチーム得点を主導し、盗塁は補助的な上乗せ要因に位置付けられる。","methods":["回帰分析","統計的検定","時系列解析"],"themes":["走塁・盗塁","勝敗要因","得点予測","戦術分析"],"data":["公式成績データ","外部データ併用"],"free_tags":["RE24","期待得点"],"awards":[],"text_insufficient":false,"excerpt":"","excerpt_src":null,"note":"図表キャプション混入のため引用不可 (要原稿確認) / 図表キャプション混入のため引用不可 (要原稿確認) / 図表キャプション混入のため引用不可 (要原稿確認) / 図表キャプション混入のため引用不可 (要原稿確認) / 図表キャプション混入のため引用不可 (要原稿確認) / 図表キャプション混入のため引用不可 (要原稿確認)"},{"id":"2025_mlba_1_80","year":2025,"dept":"MLB部門","dept_detail":"MLB部門","title":"野球における新たな勝利貢献指標「xWinShare」の提案　ーXGBoostによるMLBトラッキングデータ分析ー","members":"河地悠馬，渡波正晴，中西凜，リャンジャチー，大浦さやか，新谷幸弘(千葉工業大学)","first_author":"河地悠馬","affiliation":"千葉工業大学","code":"P4-19","abstract":"XGBoostとトラッキングデータを統合し、実績値と期待値ベース指標から選手の勝利への貢献度を客観的に評価する複合指標xWinShareを提案した。打席数が勝利貢献の71.7%を占める最大要因であることを明らかにし、決定係数R²=0.9191で高い予測有効性を実証した。","methods":["機械学習","勾配ブースティング","指標開発"],"themes":["選手評価","得点予測"],"data":["トラッキングデータ","公式成績データ"],"free_tags":["xWinShare","xwOBA","xFIP"],"awards":[],"text_insufficient":false,"excerpt":"現在のプロ野球における選手の評価は打率や打点といった単一の実績指標から、 OPS(On- base Plus Slugging)、wOBA (Weighted On-Base Average)、WAR(Wins Above Replacement )、FIP (Fielding Independent Pitching) といった高度な総合指標へと進化し、選手をより客観的に評価できるようになった。しかし、これらの先進的な指標はいずれも、運の要素や環境バイアス、さらにはモデル依存性を内在させているという根本的な問題を抱えている。たとえば、 打率やwOBA などの実績値は打球の運不運の影響を避けられず、防御率(Earned Run Average ;ERA)は守備力や球場特性に左右されるため、投手の真の能力を正確に反映しない。 また OPS は出塁と長打の価値を単純加算する構造上、実際の得点期待とのズレが生じやすい。さらに FIP は投手の責任範囲を明確にする一方で、打球質や球場の影響を過度に単純化してしまう。加えて WAR の算出における 「打撃」 「投球」 「守備」 (とりわけ捕手)の貢献度への重み付けは、人間が設定した経験則や統計的な手法に依存しており、計算方法も団体ごとに異なることから、守備評価に大きな誤差を含むうえ、勝利への貢献の真の最適解を客観的に提示しているとは言いがたい。したがって、これらの指標は有用ではあるものの、環境差・モデル依存・守備評価の不確実性といった問題点を抱えており、数値を絶対視するのではなく、文脈を踏まえた慎重な解釈が不可欠である。AI (Artificial Intelligence)は大量かつ複雑なデータを高速に処理し、パターン抽出や予測に活用されている。特に機械学習(Machine Learning ; ML) は、金融の不正検出、 医療画像診断、 製造業の異常検知など多様な分野で成果を上げている。従来の統計手法では捉えきれない非線形関係や高次元データにも対応可能であり、意思決定の精度と効率を向上させる。AI の導入により、リアルタイム分析や自動化が進み、ビジネス価値の創出に貢献している。本研究は、既存指標が抱えるこれらの課題を克服し、選手の「真の勝利への貢献度」をより正確かつ客観的に評価する新しい複合指標としてxWinShare(AI-Weighted Expected Win Share)を提案し、その構築と有効性を示すことを目的とする。この新指標の最大の価値は、実績データとトラッキングデータ(打球の質、期待値)を統合し、XGBoost (eXtreme Gradient Boosting) モデルを用いて客観的な最適重み付けを達成する点にある。具体的には、xwOBA (Expected Weighted On-Base Average)や xFIP(Expected Fielding Independent Pitching)といった期待値ベースの指標を基軸とすることで運の要素を可能な限り排除し、打撃、投球、守備、 そして機会(plate appearance ;PA の総量)といった全ての要素に対し、チームの総勝利数 W を予測する際に貢献する最適な重みをデータから自動で決定する。本研究によって確立される xWinShare は、データが示す統計的に裏付けられた係数を用いて貢献度を評価するため、従来の指標よりも透明性が高く、選手のトレードや戦略立案における意思決定に新たな根拠をもたらす価値の高い指標であると考えられる。","excerpt_src":"はじめに"},{"id":"2025_mlba_1_91","year":2025,"dept":"MLB部門","dept_detail":"MLB部門","title":"MLBにおける球場特性の定量評価と変動要因の分析 BPF、HRF、X2Bおよび年次安定性に基づく研究","members":"松島沙季，石田優利亜，高梨春菜，西村凌平，安藤雅和(千葉工業大学)","first_author":"松島沙季","affiliation":"千葉工業大学","code":"P4-20","abstract":"1995年以降のMLBデータを用いて、球場特性を打撃パークファクター・本塁打パークファクター・二塁打から多角的に分析した。クアーズフィールドが打者に極めて有利で年次変動が大きく、サンディエゴが投手有利である特性を定量化し、選手評価における球場補正の重要性を強調した。","methods":["統計的検定","可視化","空間分析"],"themes":["球場要因","選手評価"],"data":["公式成績データ"],"free_tags":["BPF","HRF","パークファクター"],"awards":[],"text_insufficient":false,"excerpt":"プロ野球、特にメジャーリーグベースボール( MLB)における選手評価において、球場が成績に与える影響は看過できない重要な要素である。選手の成績をもとに評価や契約が行われるため、その能力を正しく評価することが非常に重要であるが、野球の成績は選手本人の実力だけで決まるものではなく、試合が行われる環境にも大きく左右される。その中でも特に影響が大きいのが「球場特性(パークファクター)」である。MLB の球場は、それぞれ立地条件や構造が大きく異なっている。外野フェンスまでの距離、壁の高さ、球場の標高、風向き、気温などは球場ごとに違い、これらの要因が得点や本塁打の出やすさに影響を与える。例えば、コロラド・ロッキーズの本拠地であるクアーズ・フィールド( COL)は標高が高く、空気抵抗が小さいため、打球が遠くまで飛びやすく、他の球場と比べて得点や本塁打が多くなる傾向がある。一方で、サンディエゴ・パドレスの本拠地( SDN)は海に近く、湿った空気や広い外野の影響により、投手に有利な球場として知られている。このような球場ごとの違いを考慮せずに、単純に打率や本塁打数だけで選手を比較してしまうと、実力を正しく評価できない可能性がある。従来の指標では、この球場特性による歪みを排除できず、選手の真の実力を正確に評価することが困難であった。そこでセイバーメトリクスでは、ホームとロードの成績を比較することで球場の影響を数値化した「パークファクター(PF)」を用いて球場補正を行う。しかし、これまでの研究の多くはパークファクターの平均値のみを扱っており、年ごとの変化については十分に検討されてこなかった。実際には、気象条件の違いや球場の改修、ボールの仕様変更などにより、同じ球場でも年によって得点環境が変化する可能性がある。もし球場特性が大きく変動している場合、単年の成績を使った評価には大きなリスクが伴う。本研究では、1995 年以降の MLB のデータを多角的に分析し、球場の「静的な特性」と、時間軸における「動的な安定性」の両面から得られた知見をまとめる。","excerpt_src":"はじめに"},{"id":"2025_mlba_1_58","year":2025,"dept":"MLB部門","dept_detail":"MLB部門","title":"ペナルティ型課税と意図せざる影響：MLB贅沢税がもたらす競争構造と市場行動の分析","members":"谷津唯希，周娟(東京都市大学)","first_author":"谷津唯希","affiliation":"東京都市大学","code":"[口頭]MLB1","abstract":"MLBの競争均衡税が競争構造に与えた影響をマクロ・セミマクロ・ミクロの三層から実証分析した。制度導入後、勝率格差と年俸格差は有意に拡大し、チーム内でのスター選手への資源集中が進行している。課税しきい値は球団の予算調整に強い抑制効果を持つ一方、リーグ全体の競争均衡改善には至っていない。","methods":["回帰分析","統計的検定"],"themes":["経営・制度","年俸・契約","チーム評価"],"data":["公式成績データ"],"free_tags":["ジニ係数","ソフトキャップ"],"awards":["MLB部門 入賞"],"text_insufficient":false,"excerpt":"メジャーリーグベースボール( MLB)は高い商業的成功を収める一方、球団間の経済格差が競技成績に影響するリーグとして知られている。そのため、特定球団の支配を防ぎ、競争均衡を維持・向上させることは重要な制度的課題である。競争均衡は観客需要やリーグの経済的持続性とも密接に関連することが先行研究で示されている。MLBの特徴としてハードなサラリーキャップを採用せず、1997年に競争均衡税(Competitive Balance Tax : CBT)を導入した。 CBTは年俸総額の超過球団に課税することで、高額支出を抑制し競争均衡を促進する「ソフトキャップ」型制度である。しかし、CBTが実際に競争均衡を高めたかについては結論が一致しておらず、近年では年俸格差や勝率格差の拡大も指摘されている。したがって、制度が政策目的を達成しているかを再検証する必要がある。1.2 先行研究CBTに関する研究は主にサラリーキャップや収益分配制度が競争均衡に与える影響を中心に分析されており、先行研究ではチーム総年俸と勝率の間に正の相関が存在することを示し、球団の資金力が競技成績を左右することを実証している [1][2]。一方、MLBの贅沢税制度に関する実証研究は限定的であり、贅沢税が短期的な年俸支出抑制効果を持つ可能性を示す一方、長期的な競争均衡の改善については明確な証拠が得られていないと指摘している[3][4]。既存研究の多くは導入前後の単純比較にとどまり、制度が球団行動や選手市場を通じて作用するメカニズムを十分に検証していない。本研究はこの点に着目し、贅沢税制度の効果をマクロ、セミマクロ、ミクロの三層から統合的に分析する。","excerpt_src":"はじめに"},{"id":"2025_mlba_1_84","year":2025,"dept":"MLB部門","dept_detail":"MLB部門","title":"打席内投球系列を考慮した因果推論による捕手の投球戦略評価","members":"三浦拓実，藤井慶輔(名古屋大学)","first_author":"三浦拓実","affiliation":"名古屋大学","code":"[口頭]MLB2","abstract":"G-computationとTransformerベースモデルを組み合わせ、打席内の逐次的な投球系列を考慮した捕手の投球戦略を定量的に評価する手法を提案した。Luis TorrensとFrancisco Alvarezの投球戦略を比較分析し、投球戦略の差異をセイバーメトリクス指標に統合可能であることを示した。","methods":["因果推論","深層学習","ニューラルネットワーク"],"themes":["捕手・バッテリー","投球・配球","選手評価"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["G-computation","Transformer","反実仮想"],"awards":["MLB部門 優秀賞"],"text_insufficient":false,"excerpt":"野球における投球戦略とは,投手が打者を抑えるための,球種や投球コースの組み立てを指す.野球は投手が打者に対して投球することでゲームが進行するという性質上,投球戦略は試合全体の結果を大きく左右する重要な要素である.一般的に,投球戦略は監督・コーチからの大まかな指示に基づき,捕手が具体的な投球戦略を立案し,投手がそれを承認することで決定される.そのため,投球戦略は主に捕手の責任領域とみなされてきた.投球戦略の評価には,慣習的に捕手別防御率や捕手別勝率などの指標が用いられてきた.しかし,これらの指標は出場選手や試合状況によるバイアスを含むことが指摘されており,投球戦略そのものの評価指標としては妥当性に欠けるという見方が強い.また,野球における最も一般的な守備指標であるUZR [1] や,選手の包括的な評価指標であるWAR [2] においても投球戦略に関する評価項目は含まれず,投球戦略が定量的に評価されていないという課題が存在する.その背景には,出場選手や試合状況など,投球戦略以外の様々な構成要素を統制する必要がある点や,打席内の逐次的な投球系列を考慮する必要がある点が挙げられる.この課題は近年のMLB における捕手起用を巡る議論にも表れている.2025 年,ニューヨーク・メッツはLuis Torrens とFrancisco Alvarez の2 人の捕手に同程度の出場機会を与えた.Torrens は堅実な守備に定評のある中堅選手,Alvarez は打撃が強みの若手選手である.Fangraph [3] 上のWAR はそれぞれ1.6,1.8 と拮抗していたが,一部ではAlvarez の投球戦略がTorrens に劣ることを懸念し,Torrens の起用増加を求める声も挙がっていた.このような議論は,既存の統計指標では解決できず,投球戦略の定量的な評価指標が欠如していることを示している.そこで本研究では,投球系列を考慮できる因果推論の枠組みであるG-computation [4] を用いて出場選手や試合状況などを統制し,Transformer ベースモデルを利用すること打席内の逐次的な投球系列を考慮した投球戦略評価手法を提案する.具体的には,メジャーリーグ(MLB) の試合データを用いて,捕手ごとの投球戦略,投球内容,および打席結果の生成過程をモデル化する.次に,打席結果を得点期待値に基づくアウトカムとして定量化し,モンテカルロシミュレーションにより,捕手ごとに反実仮想アウトカムを推定する.これらを基に,捕手間の平均因果効果を算出することで,投球戦略の差異を定量的に比較評価する.また,ケーススタディとして,前述したTorrens とAlvarezの比較評価を行い,推定値の解釈上の注意点やWAR との統合可能性について議論する.因果推論を用いて投手と打者の対決を分析した先行研究には,傾向スコアマッチングを用いた内角・外角のストレートの有効性を比較した研究[5] やG-computation を用いて打者の選球眼と打撃統計の関係を分析した研究[6]などがある.本研究の新規性は,因果推論を用いた打席単位での投球戦略評価を行った点や得点期待値ベースの評価によるWAR などのセイバーメトリクス指標への拡張性がある点などが挙げられる.本研究により,捕手の能力評価をより多面的に行うことが可能となり,選手起用の意思決定などに活用されることが期待される.","excerpt_src":"はじめに"},{"id":"2025_baseballinfo_1_43","year":2025,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(野球)","title":"定石「外角低め」は正しいのか?","members":"早瀬皓介，森裕一(岡山理科大学)","first_author":"早瀬皓介","affiliation":"岡山理科大学","code":"I-01","abstract":"2024年NPBデータをもとに、投球コース別の被打率をバブル図で可視化したインフォグラフィック作品である。「外角低め」という配球の定石が実際に被打率の低いコースなのかを、右打者・左打者別に検証した。","methods":["可視化"],"themes":["投球・配球"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":true,"excerpt":"","excerpt_src":null},{"id":"2025_baseballinfo_1_113","year":2025,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(野球)","title":"目的に応じて楽しめるプロ野球球場","members":"清水和葉，奥山歩，治井真人，松井駿太，小田治輝，山本義郎(東海大学)","first_author":"清水和葉","affiliation":"東海大学","code":"I-02","abstract":"観客のニーズ別（ホームラン観戦、投手戦・打者戦観戦、アグレッシブな試合観戦）に最適なプロ野球球場を提示するガイド。神宮球場でのホームラン数ランキングなど具体的な選手データを示し、各球場の特徴と観客の好みをマッチングさせるインフォグラフィック作品。","methods":["可視化"],"themes":["観客・ファン","球場要因"],"data":["公式成績データ"],"free_tags":[],"awards":["インフォグラフィック部門 奨励賞"],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2025_chikoku_info_yamamoto1","year":2025,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(野球)","title":"打球の方向 - 打者・投手・チームごとのホームラン傾向分析","members":"城間七海，伴実里，松江陽風，山本由和(徳島文理大学)","first_author":"城間七海","affiliation":"徳島文理大学","code":"I-03","abstract":"打者・投手・チームの視点から、ホームラン方向の偏りを可視化したインフォグラフィック作品。岡本選手はレフト方向、佐藤選手はライト方向、楽天はライト方向が多いなど、個人およびチーム別の顕著な方向性を明らかにした。","methods":["可視化"],"themes":["打撃","選手評価"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2025_chikoku_info_yamamoto2","year":2025,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(サッカー)","title":"サッカーにおける効率性と運動量の変化分析","members":"大坂春翔，山本由和(徳島文理大学)","first_author":"大坂春翔","affiliation":"徳島文理大学","code":"I-04","abstract":"2023年から2024年のJリーグシーズンを比較し、ボール移動距離と選手の移動距離の変化を分析したインフォグラフィック作品。リーグ枠拡大に伴う残留争い激化により、全体的な運動量が底上げされた現象を定量化した。","methods":["可視化"],"themes":["チーム評価","戦術分析"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2025_soccerinfo_1_30","year":2025,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(サッカー)","title":"CKにおける得点とボール配給位置の関係","members":"青木輝夜，秋野晴吾，北村優美，徳永謙，中村悠暉，小串典子(明治学院大学)","first_author":"青木輝夜","affiliation":"明治学院大学","code":"I-05","abstract":"2023・2024年度Jリーグのコーナーキックデータを分析し、CKの1タッチ目のボール位置と得点の関係を明らかにした。ゴールエリア付近かつニアサイドへの配給が得点効率を高める傾向を示唆し、CKからの得点とチーム順位の相関性を検証した。","methods":["可視化"],"themes":["セットプレー","得点予測"],"data":["イベントデータ"],"free_tags":["CK","コーナーキック"],"awards":[],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2025_soccerinfo_1_79","year":2025,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(サッカー)","title":"データから観るサッカーチームのタイプ分析～Soccer Team Classification Analysis～","members":"三浦葵衣，村松加奈子，田邊咲絢，寒風澤采佳，林邦好(京都女子大学)","first_author":"三浦葵衣","affiliation":"京都女子大学","code":"I-06","abstract":"MBTI性格分類の枠組みを参照し、Jリーグクラブを国籍・年齢層・身長などの軸で分類し、クラブごとの性格タイプを提案した。性格相性がシュート成功率・パス成功率・得点力・勝率に与える影響を回帰木で分析し、チーム多様性がパフォーマンスに寄与することを示唆した。","methods":["クラスタリング","可視化","回帰分析"],"themes":["チーム評価","フォーメーション","選手起用"],"data":["公式成績データ"],"free_tags":["MBTI","性格分類"],"awards":["インフォグラフィック部門 優秀賞"],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2025_mlbinfo_1_116","year":2025,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(MLB)","title":"投手ごとの\"癖\"が見える ― MLB配球パターン図鑑","members":"川ノ上裕太，髙橋旺伸，中深迫信一(情報科学専門学校)","first_author":"川ノ上裕太","affiliation":"情報科学専門学校","code":"I-07","abstract":"","methods":["可視化"],"themes":["投球・配球"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":true,"excerpt":"","excerpt_src":null},{"id":"2025_soccera_1_4","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"町田ゼルビアにおけるGK起点ビルドアップの戦術分析－奪取フェーズと前進フェーズに着目して－","members":"小島吾，志村隆太，佐藤浩志(明星大学)","first_author":"小島吾","affiliation":"明星大学","code":"P1-01","abstract":"町田ゼルビアの2024年シーズンのイベントデータを用いて、GKを起点としたビルドアップの特徴を分析した。カーネル密度推定、クラスタリング（EMD）により、GKのクロス対応と短距離・長距離フィードの使い分けが攻撃効率に寄与すること、及び同様の傾向を持つリーグ上位チームとの共通点を明らかにした。","methods":["クラスタリング","カーネル密度推定","空間分析"],"themes":["ビルドアップ","ポジショニング","チーム評価","戦術分析"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["EMD"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて攻撃の起点は、パスだけでなく相手からのボール奪取にも依存する。ボール奪取は攻撃開始の契機であり、チームのリズムや攻撃方向を左右する重要な局面である。近年では、ゴールキーパー(以後、GK と示す)が関わる攻守転換の重要性が指摘され、GK は守備者であると同時に攻撃の起点としての役割を担うことが示されている。インタビュー調査によれば、GK にはセービング能力に加え、状況判断やメンタリティ、足下の技術といった攻撃的スキルが求められることが明らかになっている[1]。さらに、ゴールキックに関する分析では、配球先の選択やその後の競り合いが攻撃展開に影響することが報告されており、GK の配球判断が攻撃の成否に直結する戦術要素であることが示されている[2]。これらの研究は、GK が「最後の守備者」であると同時に「最初の攻撃者」として機能することを裏付けている。本研究は、2024 年シーズンの町田ゼルビアにおけるGKのボール奪取とフィードを、GK 起点のビルドアップとして捉え、その特徴を明らかにすることを目的とする。町田ゼルビアのイベントデータを用いて、GK の奪取からフィードまでの一連のプレーを抽出し、時間的・空間的特徴を評価した。また、ゼルビアの特徴をJ1 全体の中で位置づけるため、2024 年シーズンのJ1 各チームのデータを参照し、リーグ平均との比較を行った。さらに、GK 奪取後のフィード距離と時間を特徴量としてクラスタリングを行い、ゼルビアと類似したビルドアップ傾向を持つチームを抽出し、その共通点と相違点を検討した。","excerpt_src":"はじめに"},{"id":"2025_chikoku_soccer_1_takada","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"オフザボールアクションを取り入れたOCEL による攻撃プロセス成功予測","members":"高田悠太，ソンケイガイ，田畑耕治，後藤允(東京理科大学)","first_author":"高田悠太","affiliation":"東京理科大学","code":"P1-02","abstract":"トラッキングデータからオフザボールアクション（オーバーラップ、ラインブレイク等）を抽出し、Object-Centric Event Log（OCEL）を構築した。これをランダムフォレストに適用することで攻撃プロセスの成功予測精度を向上させ、オフザボールアクションの重要性を定量的に検証した。","methods":["機械学習","指標開発","可視化"],"themes":["シュート","ビルドアップ","戦術分析","ポジショニング"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["OCEL"],"awards":[],"text_insufficient":false,"excerpt":"本研究の目的は,サッカーにおいて攻撃が成功するか失敗するかを予測するフレームワークを開発することである.具体的には,ポゼッションをプロセスとして捉え,業務プロセスの可視化・分析ツールであるプロセスマイニングの考え方を利用する.攻撃成功については,シュートまたはペナルティエリアへの侵入とする.プロセスマイニングにおけるプロセス予測の研究としては,Teinemaa et al. [3] がアウトカム指向予測プロセスモニタリングによって進行中の各ケースの最終的な結果を予測している.また,プロセスマイニングを用いてサッカーの試合データを分析した研究としては,Kr ̈ockel and Bodendorf [2] がトレーシング・クラスタリングやソーシャル・ネットワーク分析を含むさまざまな技術が戦術的な洞察を提供できることを示している.サッカーの試合結果を予測した研究としては,Hassard and Kerr [1] が欧州5 大リーグにおけるイベントデータの空間情報を伴うイベント特徴量を使用し,機械学習手法を組み合わせて試合結果を予測している.既存のサッカーのプレイ予測に関する研究では,主にボールアクションの分析に焦点を当てており,現代サッカーの全体像を捉える上で本質的な限界を抱えている.サッカーにおいて1 人の選手がボールに触れている時間は,一般的に3 分程度といわれており,オフザボールの選手のアクションが試合に大きな影響を与えていることは明らかである.そこで本研究では,オフザボールアクションを予測に取り入れるために,複数オブジェクトのプロセスを同時並行的に扱うOCEL (Object-Centric Event Log) を作成する.オフザボールアクションの定義については,J1 クラブ強化部の助言に基づいている.本研究では,Teinemaa et al. [3] の予測手法に対してOCEL を利用することで,攻撃プロセスの成功予測精度を向上させることを目指す.","excerpt_src":"序論"},{"id":"2025_soccera_1_12","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるフォーメーション別勝利要因分析","members":"高澤峻平，齊藤史哲(青山学院大学)","first_author":"高澤峻平","affiliation":"青山学院大学","code":"P1-03","abstract":"本研究はサッカーの3バックと4バックのフォーメーションにおける勝利要因の違いをXGBoostとSHAP解析により明らかにした。3バックではチャンス創出効率、守備効率、サイド攻撃率など攻守にわたる総合的な指標が勝利に強く寄与し、組織的なバランスが重要であることが示された。一方、4バックではこぼれ球奪取、ペナルティ脇侵入など局面依存のアクションが勝利に寄与し、個々の攻撃局面の質が重要であることが明らかになった。","methods":["機械学習","勾配ブースティング","SHAP・説明可能AI","可視化"],"themes":["フォーメーション","勝敗要因","戦術分析","選手起用","チーム評価"],"data":["公式成績データ"],"free_tags":["XGBoost","SHAP","部分依存プロット"],"awards":[],"text_insufficient":false,"excerpt":"近年のサッカー界では,戦術の高度化に伴い,フォーメーション選択が試合結果に与える影響がますます大きくなっている.特に,従来は 4 バックが主流とされてきたものの,近年では戦術的柔軟性や守備の安定性を重視し,3 バックを採用するチームが増加している.日本代表が 3 バックシステムを取り入れていることや,J1 リーグにおいても約半数のクラブが 3 バックを採用していることは,その傾向を象徴している.こうしたフォーメーションの多様化は,攻守のバランス調整やトランジション,ビルドアップ構造に大きな影響を及ぼしており,フォーメーション選択の重要性が一層高まっているといえる.しかし,フォーメーションが試合の勝敗にどのように寄与しているのかについては,従来は指導者や分析者の経験に依存する部分が大きく,データに基づいた体系的な理解は十分に進んでいない.近年ではトラッキングデータやスタッツの整備により,ボールロスト,パス成功率,ペナルティエリア進入回数といった詳細な指標が取得可能になっているが,これらがフォーメーションごとに勝利へどのように影響しているのかを定量的に評価した研究は多くない.また,フォーメーションは単なる選手配置ではなく,攻撃の組み立て,守備ブロックの形成,トランジション局面でのリスク管理など,試合内容の構造全体に関わる.したがって,フォーメーション別に勝利要因を分析することで,チームが採用する戦術と試合結果の関連性をより精緻に把握できると考えられる.そこで本研究では,現代サッカーにおいて採用が増加している 3 バックと,依然として広く用いられる 4バックに着目し,それぞれのフォーメーションにおける勝利寄与要因をデータ分析により抽出することを目的とする.XGBoost と SHAP を用いた解釈可能な機械学習モデルにより,各スタッツがどの程度勝利に影響を与えているのかを定量化し,フォーメーションごとの特徴的な勝利要因の違いを明らかにする.本研究により,戦術選択と試合結果の関係性についてデータに基づく新たな知見を提供し,サッカーにおける戦術理解の深化につながることが期待される.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_19","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"トランジション発生前後のEPPCの変動に基づく守備システムの評価","members":"月本陽菜歩(京都女子大学)，木元篤郎(同志社大学)，土田潤(京都女子大学)","first_author":"月本陽菜歩","affiliation":"京都女子大学","code":"P1-04","abstract":"本研究はExpected Possession Value with Pitch Control（EPPC）を用いて、トランジション前後の守備システムを評価した。Player Congestion Index（PCI）とライン間距離の分析により、守備構造における選手配置の均質性や縦方向の圧縮が、トランジション時のリスク形成に与える影響を明らかにした。失敗例と成功例を比較することで、トランジション時の守備再構築における構造的な特徴を定量化することが可能になった。","methods":["空間分析","指標開発","確率モデル"],"themes":["トランジション","守備","フォーメーション","戦術分析","チーム評価"],"data":["トラッキングデータ"],"free_tags":["EPPC","Pitch Control","Player Congestion Index"],"awards":["ポスター部門 優秀賞"],"text_insufficient":false,"excerpt":"サッカーにおけるフォーメーションとは、選手の位置関係によって定まるチーム全体の構造である。フォーメーションは攻撃と守備の両局面において、選手の役割分担や連携を明確にする。そのため、フォーメーションの選択は試合の戦術的成果を左右する要因の一つである[1]。守備時のフォーメーションは、チーム全体の秩序と統制を保ち、相手の攻撃を制限するための基盤となる。守備フォーメーションに基づいて、選手たちが連動することで、パスコースの遮断、数的優位の形成、および空間の管理を可能にし、結果として失点の抑制やボール奪取につながる。守備フォーメーションとそれに基づいて選手たちが連動することを守備システムという。チームの守備能力を評価するうえでチームの守備システムの評価は必要である。フィールド上でのボールの奪取または喪失によって起こる攻守の入れ替わりであるトランジションは、攻撃時のフォーメーションから守備時のフォーメーションへの変化を引き起こす。トランジション発生時において、フォーメーションの変化の速度と精度が勝利につながることが指摘されている[1, 2]。しかし、フォーメーションに関する研究の多くは選手の位置関係が定まっている状況を対象としており、トランジション発生後のような、選手の位置関係が整っていない場面から整うまでの過程(以下、移行期)を対象としていない。そこで本研究は、トランジション発生前後のフォーメーションの移行期に注目し、トランジション発生前後の選手配置および空間支配の変化とフォーメーション再構築過程に生じる構造的な乱れとの関係性を分析することで、チームの守備システムを評価することを目的とする。具体的には、その場所でボールを保持することの価値を得点につながるかどうかで判断した指標であるExpected Possession Value(EPV)[3] と地点(x, y) を攻撃側チームが支配しているかどうかを表すPitch Control(PPCF)値[4] を用いて、トランジション発生前後の場面を数値化し、その数値の変動によって守備システムを評価する。これにより、フォーメーションの移行期の守備選手の動きとその連動性を評価することが可能となる。さらに、トランジション時における選手の配置の偏りが、コンパクトでも歪んだ密集になっていないかを各選手に対して評価する指標としてPlayer Congestion Index(PCI) を導入する。PCIを導入することで、移行期における選手間の配置を定量的に把握することができる。加えて、ライン間距離や選手間距離をトランジション発生前後の場面で比較し、EPV の変動との関係性を評価する。ライン間距離や選手間距離はコンパクトネスを測る際に用いられることもあり[5]、プレミアリーグを対象とした研究では、チーム全体の縦方向長さが35~45 mに収束することが報告されている[6]。ライン間距離が広がった場合、攻撃側の期待攻撃価値が上昇する[3] ことが指摘されているように、トランジション発生前後の守備システムの評価に関連することが想定される。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_23","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"地点価値と経路遮断を統合したサッカー守備構造の定量的評価","members":"富来創信，横山清子(名古屋市立大学)","first_author":"富来創信","affiliation":"名古屋市立大学","code":"P1-05","abstract":"本研究は地点価値とパスコース遮断を統合したサッカー守備構造評価指標DSS（Defense Structure Score）を提案した。勾配ブースティングを用いて各地点の危険度を算出し、守備者による経路遮断効果を考慮したパス成功確率モデルを構築した。提案指標は30mライン進入数との相関が強く、失点数より守備組織の質を評価できることが示された。","methods":["機械学習","勾配ブースティング","指標開発","確率モデル"],"themes":["守備","ポジショニング","戦術分析","勝敗要因","チーム評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["Defence Structure Score","経路遮断","Route Check"],"awards":[],"text_insufficient":false,"excerpt":"現代サッカーでは戦術が高度化し,選手には緻密なポジショニングが求められている.チームの守備力を正しく評価し,改善点を見つけることは勝敗に直結する重要な課題である.本研究では,データを用いて守備の「構造」と「質」を評価する新しい手法を提案する. 1.1先行研究と課題守備の評価に関する研究は数多く行われている.Taki ら[1] やSpearman[2] は,選手が支配できる空間を可視化する「支配領域」や「ピッチコントロール」を提案した.これらは「どこを守れているか」を見るのには有用だが,その場所が「どれくらい危険か(質)」までは区別できないという課題があった.一方,Decroos ら[3] やToda ら[4] は,プレーの価値(得点への貢献度)を数値化する指標を提案したが,守備者が物理的にパスコースを遮断している効果(Route Check)までは十分にモデル化されていなかった.そこで本研究では,これらの課題を解決するために,(1)ピッチ上の「場所の危険度(価値)」と,(2) 守備者による「パスコースの遮断」を統合した,新しい守備評価モデルを構築した.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_27","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"カーネル密度推定に基づく攻守一体型スペース価値モデルの提案","members":"山田凌大，服部航也，平野翔真，松澤智史，田畑耕治(東京理科大学)","first_author":"山田凌大","affiliation":"東京理科大学","code":"P1-06","abstract":"本研究はカーネル密度推定に基づく攻守一体型のスペース価値モデルを提案した。ボール位置と守備選手の座標から確率密度推定により占有スペースの価値を定量化し、Pitch Controlと組み合わせてSQ値（ポジショニング品質指標）を開発した。クリアなどの守備プレーとの相関分析により、攻守両局面でのオフボール選手の動きを客観的に評価することが可能になった。","methods":["カーネル密度推定","機械学習","指標開発","ニューラルネットワーク"],"themes":["スペース評価","ポジショニング","選手評価","守備"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["SQ値","Pitch Control","カーネル密度推定"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいてボールを自身で保持していない時間(以下,オフボール)こそが最も重要である.ボールを保持する機会を生むこと,空いているスペースを活用すること,相手を引きつけ味方が動きやすくすること,これらはすべてオフボールでの動きから生まれる.つまり,オフボールの状況下にあるほとんどの時間,選手たちはピッチ上の誰かに何らかの影響を与えている.したがって,ゴール数,タックル数,アシスト数,シュート数,パス成功率など,従来の「オンボール」統計は,選手のパフォーマンス全体のごく一部しか捉えていない[1].選手を評価するには,オフボールを考慮するだけでなく,定量化することで客観的に評価する必要がある.オフボールでの動きを定量化するにあたって,Fern ́andez and Bornn [2] は,選手が自ら価値の高い空間を確保する行動「空間の占有(Space Occupation)」,味方のためにディフェンダーを引きつけ、空間を空ける行動「空間の創出(Space Generation)」を考えた.また,運動情報,ボールへの相対距離,および選手位置を取り入れた新しいパラメトリックなPitch control モデルを構築した.Pitch control とは,ある瞬間におけるチームレベルのピッチ上の影響度を指している.さらに,ボールの位置を入力とし,守備チームの影響分布を学習させたニューラルネットワークを用いて,ピッチ上の各地点のスペース重要度を推定した.これらを組み合わせることで,選手ごとの空間占有獲得(Space Occupation Gain)と空間創出獲得(Space Generation Gain)を算出し,オフボールにおける選手の空間的貢献を定量的に評価した.先行研究[1, 2] は,それぞれ守備時および攻撃時のオフボールの動きを評価している.本研究では,ボール位置と守備選手の座標に基づく占有スペースの価値を,カーネル密度推定法を用いて再構築する.J1 リーグのデータから再構築された占有スペース価値は,ポジションによる差異を小さくし,攻守いずれの視点からも活用可能である. Pitch control モデルと新たな占有スペース価値を用いることにより,1 試合を通じたオフボール時の選手の動きを定量的に評価することが可能になる.この成果は,選手の新たなランキングの作成,オフボールプレーの質の評価,印象的なシーンの自動抽出などへの応用が期待される.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_32","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"イベントデータとトラッキングデータを用いたVAEP拡張によるオンザボール・オフザボールの統合評価","members":"松山柚太，酒折文武(中央大学)","first_author":"松山柚太","affiliation":"中央大学","code":"P1-07","abstract":"XGBoostを用いてJ1リーグのトラッキングデータとイベントデータを結合し、パス交換における出し手と受け手の貢献を分離・定量化する手法を提案。シミュレーションにより受け手の動きを静止させた状態の得点期待値差分を算出し、従来のVAEPでは評価できなかったオフザボールの動きを定量化することで、出し手のパスの質と受け手のランニングの質の比較を実現。","methods":["勾配ブースティング","シミュレーション","指標開発"],"themes":["選手評価","パス"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["VAEP"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて得点の多くは、ボール保持者(パスの出し手)の技術だけでなく、パスの受け手(オフザボール)の適切なポジショニングとタイミングの良い動き出しによって生み出される。しかし、既存のVAEP などの指標は、主にボール保持者の評価対象としており、そこに至るまでの「動きの質」を評価することは困難であった。本稿では、サッカーのトラッキングデータとイベントデータを結合し、勾配ブースティングモデル(XGBoost)を用いて、パス交換における出し手と受け手の貢献を分離・定量化する手法を提案する。従来のVAEP では評価できなかったオフザボールの動きを評価するため、受け手の動きを静止させた状態をシミュレーションし、実際のプレーとの得点期待値の差分を算出するフレームワークを構築した。本手法により、出し手のパスの質と受け手のランニングの質の比較ができるようになる。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_34","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"PPDA,BDPにおけるチームのプレス分析から分かる戦術浸透度評価","members":"辻悠吾，浜中勇哉，福田圭祐，渡部克海，畠山友壱，山本知仁(金沢工業大学)","first_author":"辻悠吾","affiliation":"金沢工業大学","code":"P1-08","abstract":"J1リーグ2023・2024年シーズンのイベントデータとトラッキングデータを用いて、PPDA（パス許容度）とBDP（ビルドアップ阻害率）からチームのプレス戦術を定量化。ボール奪取ヒートマップと奪取からの得点率を分析し、高位置でのプレッシング強度と相手ビルドアップ阻害効果の両面から戦術浸透度を評価。プレス指標が平均的でも上位を維持するチームの存在から、多様な勝利要因の重要性を示唆。","methods":["統計的検定","空間分析","可視化"],"themes":["戦術分析","プレッシング","チーム評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["PPDA","BDP"],"awards":[],"text_insufficient":false,"excerpt":"サッカーは,11 人の選手がピッチ上で連携し,戦略的に相手チームの妨害をかわしてゴールを決めるスポーツである.ゴールを決めるためには敵チームからボールを奪っていかに自分のチームの流れにもっていくかが非常に重要である. 2024-25 年チャンピオンズリーグ決勝では,サッカークラブパリサンジェルマンがハイプレス戦術を行い相手のサッカークラブインテルミラノのビルドアップを妨害して 5-0 で圧倒した[1].また、元ドルトムント、 元リヴァプールの監督であるユルゲン・クロップはチーム全体の戦術として「ゲーゲンプレス」(カウンターを基にしたハイプレス戦術)を提唱しチームを上位に導いた[2].このように現代のサッカートレンドとして「プレス戦術」 が非常に大切である.そこで私たちはチームのプレス戦術を分析して数値として出せないか研究しようと考えた. 1.2 先行研究プレス戦術を評価する既存の指標として,タックル成功率,パスカット成功率,ボール奪取率などがある.しかし,これらの指標は個人でありチーム全体の守備の数値化できていないことが分かった.このことからチームとしての指標のであるPPDA,BDP(詳細は2.2 で解説する)を算出してトラッキングデータを踏まえたうえでチーム全体のプレス戦術を算出できるのではないかと考えた[3][4]. 1.3 仮説本研究では,次のような仮説を立てた.仮説は,PPDAと BDP とトラッキングデータから分析されるプレッシング戦術の実現度が高いチームは低いチームと比較して相手に有効なプレスが実現できており,さらにボール奪取,失点率の守備指標やその後のゴール貢献度において優位に優れていることである. 1.4 本研究の目的PPDA と BDP,トラッキングデータを用いてチーム全体のプレス守備戦術を算出し,その戦術が実際に浸透し実現できているかをチームとしての守備指標,ボール奪取からのゴール貢献度から分析する.また,チーム全体の走行距離,どこでボールを奪えているかを算出してチームとしていかに有効なプレスができているかを分析する.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_36","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"ラインブレイクの発生確率とゴール期待値を統合したLineBreak_xGモデルの構築","members":"八木翔摩，益留琢磨，市川淳，一ノ瀬元喜(静岡大学)","first_author":"八木翔摩","affiliation":"静岡大学","code":"P1-09","abstract":"XGBoostによりパスベースのラインブレイク発生確率を予測し、ロジスティック回帰によりシュート位置の距離と角度に基づくxGを算出。両者を統合した「LineBreak xG」を提案し、単なる突破の有無ではなく突破後にどれほど得点機会が生まれるかを定量化。被LineBreak xGと被クロス・被シュート数の間に有意な相関を確認し、従来の被ラインブレイク確率より実際の失点リスクを的確に捉えることを実証。","methods":["勾配ブースティング","ロジスティック回帰","回帰分析"],"themes":["戦術分析","ゴール期待値","得点予測"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["xG","LineBreak xG"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて,相手ディフェンスラインを突破する「ラインブレイク」は,得点機会を創出する上で極めて重要なプレーである.ラインブレイクが成功すると,ゴール前で数的優位を得たり,フリーでクロスを上げる状況を作り出すことができ,得点確率が大きく高まる.しかし,従来の分析では,単なるラインブレイクの発生確率の予測に留まっており[1],突破後の状況がどの程度ゴールに結びつきやすいかは十分に考慮されていない.実際の試合では,同じラインブレイクでも,ペナルティエリア付近で発生した場合とハーフライン付近で発生した場合では,得点に直結する可能性は大きく異なる.したがって,単なるラインブレイクの発生確率だけでなく,「突破後の得点機会」を加味した評価が必要である.一方,そのような得点機会の分析には,シュート位置に基づいて得点確率を推定するゴール期待値(xG: expected goals)[2][3] が広く用いられている.xG はシュート距離や角度などの要素を入力とし,得点となる確率を統計的に推定する指標であり,チームや選手の攻撃力を定量化する有効な手段として知られている.本研究では,このxG の考え方をラインブレイクに応用し,突破後の得点機会を定量的に評価することを目的とする.具体的には,まずXGBoost を用いてパスに基づくラインブレイク発生確率を予測し,次にロジスティック回帰によりシュート位置の距離と角度に基づくxG モデルを構築する.そして,ラインブレイク確率とラインブレイク確率を予測する対象である各パスの直後に発生したイベント(トラップやシュートなど)におけるボールの位置に基づいて算出したxG を組み合わせることで,突破後に得点へとつながる可能性を表す新たな指標「LineBreak xG」を提案する.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_46","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"時系列型経路コストモデルによるドリブル・パスの価値評価手法の構築","members":"桃原大吾，越智咲來，山田健太(琉球大学)","first_author":"桃原大吾","affiliation":"琉球大学","code":"P1-10","abstract":"Pitch Controlに基づく経路コストモデルの時系列特性を分析し、拡散解析により平均回帰性と約16秒での頭打ちを確認することでサッカー攻防の複雑性を定量化。コスト変化量の確率密度分布が正規分布よりラプラス分布に近い特徴を示し、チームごとの尖度と歪度の差からチーム戦術を統計的に評価。個々のプレーとチーム戦術の価値を客観的に測定する枠組みを構築。","methods":["時系列解析","空間分析","統計的検定"],"themes":["戦術分析","パス","ドリブル"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["Pitch Control","経路コスト"],"awards":[],"text_insufficient":false,"excerpt":"サッカーはパスやドリブルなど,そのプレー1 つで戦況が大きく変化するスポーツであり,個々のプレーの戦術的価値を客観的に評価することは指導現場や戦術分析において極めて重要な課題となっている.しかし,走行距離やパス成功率といった従来の統計データは,プレーの質を評価するには不十分であった.例えばPower ら[1] は,パスの成功率だけでなく,そのパスがどの程度のリスクを伴い,かつどの程度得点機会の創出をもたらしたかを客観的に測定する必要性を指摘している.こうした背景から近年,選手やボールの全座標を記録するトラッキングデータを用いた研究が注目されている. Goes ら[2] は,トラッキングデータから抽出した戦術的特徴量を用いることで,従来のイベントデータのみを用いた場合よりも高精度にチームパフォーマンスをモデル化できることを示している.その代表的なアプローチとして, Fernandez ら[3] による,選手の影響範囲からピッチ上の支配率(Pitch Control) を算出する手法や,それに基づきゴールへの最適経路コストを計算する木下ら[4] のモデルは,プレー価値を定量化する枠組みとして提案されている.そこで本研究では,先行研究のモデルをベースに,最適経路コストの時系列変動における分布特性を明らかにし,その分布特性に基づいたチーム戦術の定量評価手法の構築を目指した。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_51","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"予測軌跡に基づくチームクラスタリング","members":"宿谷悠人，大堀祐貴，姫野偉豪，尾崎知伸(日本大学)","first_author":"宿谷悠人","affiliation":"日本大学","code":"P1-11","abstract":"MARTネットワークを用いた軌跡予測モデルで各チームの予測軌跡を生成し、その差異に基づいてチームをクラスタリングする手法を提案した。カウンター攻撃や攻守切り替わりなど特定の戦術文脈を明示的に反映したクラスタリングが可能となり、より精密かつ実用的な戦術分析の実現に寄与する。","methods":["ニューラルネットワーク","深層学習","クラスタリング","次元削減"],"themes":["チーム評価","戦術分析","トランジション"],"data":["トラッキングデータ"],"free_tags":["MART","Transformer"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて,選手軌跡群の類似度に着目したチームクラスタリングは,プレイスタイルの客観的定義を可能にするだけでなく,分析対象とする軌跡の長さやクラスタリング粒度を調整することで,戦術抽出,対戦相手分析,トレンド可視化,パフォーマンス評価の文脈化,戦術シフトの検知など,広範な応用の基盤となる.特に,フリーキックやカウンター攻撃など,特定の局面に限定した軌跡のみを対象とすることは,高度にコンテクスト化された分析の実現に直結する.より柔軟かつ精密な比較・分析を実現するためには,同一条件下での各チームの挙動(軌跡)を直接比較することが望ましいが,実試合において完全な同一シーンは存在せず,直接的な比較には限界がある.そこで本研究では,直接比較の問題を軽減するとともに,より多様な局面に適用可能な手法の実現を目指し,軌跡予測モデルを活用した統制条件下でのチームクラスタリング分析を提案する.詳細は後述するが,提案手法では,まずチーム毎に個別の軌跡予測モデルを構築する.これらのモデルに対し,特定の文脈を持つ共通の入力データ(シーン)を与えることで,得られた予測軌跡に基づきチームのベクトル化と非類似度の算出を行う.これにより,現実には生じ得ない「同一シーンに対する各チームの応答」の比較が可能となる.またこのアプローチにより,分析者の関心を直接的に反映した,より深度の高い戦術分析の実現が期待される.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_60","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"シュート前のパス評価を含んだ有効なシュートエリアの分析","members":"北野孝弘，深山翔太，栗原俊之(山口大学)","first_author":"北野孝弘","affiliation":"山口大学","code":"P1-12","abstract":"立体角を用いてピッチをエリア分割し、シュートとそのシュート前のパスの位置データに重みを付けて分析する手法を提案した。従来の直交座標系による区分に代わり、選手からみたゴール面積の大きさを反映した等立体角曲線によるエリア設定が、選手の感覚に近いことを確認した。","methods":["指標開発","空間分析","可視化"],"themes":["シュート","ゴール期待値"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["立体角","等立体角曲線"],"awards":[],"text_insufficient":false,"excerpt":"サッカーは他の球技スポーツと比べると得点が入りにくいが、得点が大いに期待できるエリアは存在する。それはペナルティーエリアであり、3 大会分のワールドカップ(1982,1986,1990) で放たれた1311 本のシュート位置を分析した先行研究[1] では、得点を挙げたシュートのほとんどはペナルティーエリア内でのシュートであった(約88%)という結果が示されていた。また、その研究によると、ある条件においては、シュートに至る一つ前のプレーとして、スルーパスでディフェンスラインを突破、その後クロスパスからのシュートが最も得点効率が高かったという結果(約21%)も示されていた[1]。このことから、シュートの一つ前のパスも得点期待値の評価に組み込む必要があると考えられる。シュートエリアに関する多くの先行研究はシュートを打った位置とそのシュートが得点に至ったか否か、というデータから統計処理を行ったものが多く、シュートに直結したパスも同時に評価したものは少ない[2,3]。また、サッカーの有効なシュートエリアやパスコースの評価を行う場合、コートをいくつかのエリアに区分している先行研究[1,3] が多くあるが、有効なシュートエリアとして既に示されているペナルティーエリアが四角形であることが影響しているのか、四角形格子での区分で行うケースがほとんどである。しかし、四角形格子による区切り方は必ずしも適切とは限らない。なぜなら、四角形格子による区分ではゴールからの距離と角度が明確に表現できないからである。このことから、エリアの区切り方は四角形格子状ではなく、ゴールを中心とした半円形の格子が適切なのではないかと考えた。本論文の目的は、ハーフコートのエリアの新たな区分方法を提案し、各格子に実際のデータから抽出したシュートの成功・失敗、シュート前のパスを考慮した重みを実際に割り当て、ハーフコートのエリアの重み付けを行うことを目的とする。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_67","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"利き足に注目したシュートデータ・クロスデータに対する捉え方","members":"藤村俊輔，小泉和之(順天堂大学)","first_author":"藤村俊輔","affiliation":"順天堂大学","code":"P1-13","abstract":"ロジスティック回帰とランダムフォレストを用いてシュートとクロスを分析し、利き足配置が攻撃効率に与える影響を定量的に評価した。距離や角度といった基本的要因の重要性を確認する一方、クロスの有効性は利き足配置の工夫で最大化できることを示した。","methods":["ロジスティック回帰","機械学習"],"themes":["シュート","打撃","ドリブル"],"data":["イベントデータ"],"free_tags":["ランダムフォレスト"],"awards":[],"text_insufficient":false,"excerpt":"近年,戦術の高度化が進む一方で,一般化が進んで文脈が読みやすくなった.その解釈を数字でどのように行うことができるのか経験するために分析を進めていく.私は2 年間,大学サッカーの監督を行っていた際に,選手の特徴とプレーエリアによって個人戦術は変わるし,選手たちの組み合わせによってグループ戦術が変わる,そのうえでチームが目指すプレーモデルのもとでチームの戦術を遂行できるように配置を決めないといけないということに頭を悩まされた.もちろん,チームによって考え方は変わるが,一般化されたものとしてピッチの幅を目いっぱい使って攻撃を構築することは共通認識として考えられるだろう.その際,選手の利き足は重要なポイントになってくる.自陣ゴールの近くでプレーする選手は外側に利き足を持つ順足の選手を配置することが多い.これは縦方向へのプレーがメインであるからだ.一方,前線の選手は最終目標である相手ゴール方向にプレーしやすいように利き足を内側の選手を配置をすることが多々ある.幅を活用するためにディフェンダーを前に上げるチームもあれば,ウイングに外側に利き足を持つ選手を置くチームもある.また,左利きの選手の絶対数が少ないことから,選手の構成の影響で両サイド右利きの選手をおかなくてはいけないチームもある.そのような要因から戦術を選択していくのだが,実際どのような形が最も効果的に勝利やゴールに結びつけることができるか,また選択された戦術により,どのような数字が特徴として現れるか,本分析から明らかにしたいと考えた.はじめに,利き足に着目したゴール期待値を調べる.その結果からどのような説明変数を選択してもシュートを打った距離が最も影響を与えていることが判明した.さらに,シュートの強さや前のプレーでクロスやドリブル,スルーパスといったゴール方向へ向かうプレーが起こった後も有効であることが分かった.次に,ゴール前に向かうプレーとしてもっともシンプルな手段で利き足という要因が直接影響を与えると考えられるクロスに着目した.有効に使えばゴールに直結するが,多用してしまうと攻撃が淡白になり,後手に回ってしまう.このプレーに着目して順足と逆足のフォーメーションの組み合わせが試合に与える影響を調べた.その結果,利き足は重要な要因になりうることが示された.最後に,チームの失点傾向や守備方針を探索した.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_72","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"ディフェンスラインの高さとゴール前侵入起点に基づく攻撃成功確率のロジスティック回帰分析","members":"松本海翔，鈴木虎太朗，松本泰知，藤井瑛斗，渡壁京子(大和大学)","first_author":"松本海翔","affiliation":"大和大学","code":"P1-14","abstract":"攻撃側ディフェンスラインの高さがシュート成功確率に与える影響をロジスティック回帰で定量化した。サイド攻撃では高いラインが有効である一方、中央攻撃では低いラインが有効という対照的な戦術構造を統計的に示し、局面に応じた陣形管理の最適解を提示した。","methods":["ロジスティック回帰","統計的検定"],"themes":["チーム評価","戦術分析","守備"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["DF ラインの高さ"],"awards":[],"text_insufficient":false,"excerpt":"近年、サッカーをはじめとするチームスポーツの分析領域では、選手やチームのパフォーマンスを定量的に評価する手法が急速に発展している。トラッキングデータの精度向上により、プレーや配置の客観的検証が可能となり、データ活用の重要性はますます高まっている。特にサッカーにおいては、最終的な得点機会であるシュートが確率的事象であることから、ゴール前への侵入がどれほど効率的にシュートへつながるかを把握することが、戦略上きわめて重要である。これまでの研究は、xG(expected goals)を用いたシュートの質の評価や、ボール前進・選手配置の最適化といった攻撃側のプレーに焦点を当てるものが中心であった。武田ら[1]は、トラッキングデータとロジスティック回帰等を用い、「ボールの総移動距離」と「シュート位置」が得点確率に最も強く寄与することを実証している。後藤ら[2]は J リーグの得点上位選手を身体特徴に基づき類型化し、そのプレー特性を分析した結果、スプリント能力の高い選手群が、相手最終ラインと意図的に距離を置くポジショニングが特徴的であると指摘している。また、松岡ら[3]は J リーグのデータからベイジアンネットワークを用い、プレーの位置や時間、相手 DF ラインの動きなどをモデル化し、アーリークロスが得点機会(シュート等)の創出に有効であることを確認している。この研究から、ボールを短時間でサイドへ展開し、相手 DF ラインを高速で後退させるといった「位置的・時間的優位性」が重要であると結論づけている。これらの研究がある中で、攻撃中の守備配置(攻撃側 DF ラインの高さ)が、ゴール前での攻撃成功に与える影響を扱った研究は十分に行われていない。攻撃側ディフェンスラインの高さは、前線との距離を調整し、人数確保や即時奪回を可能にする一方、被カウンターリスクを左右する重要な要素であり、攻撃効率とリスク管理の両面に関わる戦術的選択である。また、ゴール前侵入後の一連の流れを対象として、ライン位置や侵入起点の違いがシュート到達率にどのような影響を及ぼすのかを体系的に検証した研究も限定的である。多くの研究が単一イベントの分析に留まっており、攻撃側後方の守備配置と攻撃成功を連続的なプレー構造として捉える視点が不足している。本研究では、相手ゴール前エリアへボールが侵入した局面を対象に、どのライン設定や侵入位置が攻撃成功率に寄与するかを明らかにする。本研究の成果は、従来の xG では捉えきれなかった「攻撃側ディフェンスラインの高さ」 「侵入エリア」「攻撃成功」の関係を定量的に示すものであり、チームの攻撃構築・守備リスク管理・戦術設計に関する戦略的示唆の提供につながると期待される。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_88","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"前半戦と後半戦におけるアクション量の変化に関する分析","members":"南川桃映名，石橋陽汰，渡辺康生，安藤雅和(千葉工業大学)","first_author":"南川桃映名","affiliation":"千葉工業大学","code":"P1-15","abstract":"J1 リーグの試合において、前半戦と後半戦でのアクション回数（シュート、キャッチ、ドリブル等）の変化を分析し、試合の進行とともに活動量がどう変化するかを定量的に評価した。170試合の分析では全体で50.59%が後半に増加し、チームごとに大きなばらつきが見られた。名古屋グランパスは平均26.40%増、鹿島アントラーズは平均14.81%減と、チーム固有の特性を明らかにした。","methods":["統計的検定","指標開発","可視化"],"themes":["試合の流れ","チーム評価","選手評価"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーの試合は後半になるにつれ盛り上がる印象があった。本稿では実際に活動量は増加しているのかを客観的に判断するために、 シュートやキャッチなどの試合中のアクションの回数を前半戦と後半戦で比較した。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_93","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"選手間の動的な連携構造に着目したビルドアップの局面遷移予測と要因分析","members":"玉崎伶河，坂本直暉，奥野悠太朗，早野大誠，小松瑞果(神戸大学)","first_author":"玉崎伶河","affiliation":"神戸大学","code":"P1-16","abstract":"トラッキングデータを用いてビルドアップシーケンスを時系列グラフとしてモデル化し、パス成功確率とプレッシャー強度に基づくエッジ重みを定義した。Dynamic GCN-LSTMを用いて局面遷移（失敗・前進・停滞）を予測し、Dynamic GNNExplainerで寄与度の高い連携関係を可視化した。J1リーグデータでF1スコア0.64を達成し、ビルドアップにおける重要な選手と連携パターンを定量的に解明した。","methods":["深層学習","ニューラルネットワーク","ネットワーク分析","時系列解析"],"themes":["ビルドアップ","戦術分析","ポジショニング"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年,選手のトラッキングデータなどを用いたデータ駆動型のサッカー戦術分析が注目されている.中でも,自陣後方からボールを繋ぎ敵陣への侵入を試みる「ビルドアップ」は,試合の勝敗を左右する重要な戦術である.ビルドアップにおける各ポジションの貢献度を定量的に評価できれば,攻撃面では再現性の高いパスルートの設計や,最適な配置の発見が可能となり,守備面では相手の攻撃の起点を封じるプレッシング戦術の構築やスカウティングにおいて多角的なメリットをもたらす.従来,選手間の連携を評価する手法として,パス本数をエッジ重みとしたネットワーク分析が行われてきた.しかし,これらは試合全体や特定のイベントを静的に集約した分析に留まることが多く,刻一刻と変化する時系列的な文脈や,選手配置の動的な構造変化を捉えきれないという課題があった.また,単なるパスの本数だけでは,相手のプレッシャー強度やパスコースの物理的な難易度といったプレーの質が考慮されておらず,戦術的な価値を正確に測るには不十分であった.そこで本研究では,トラッキングデータを用いて,ビルドアップでの前進に寄与したキープレイヤー,及び,重要な連携関係を定量的に評価する新たな分析フレームワークを提案する.本手法では,パス成功確率やプレッシャー強度といった選手間の相互作用をグラフのエッジ重みとして組み込むことでプレーの難易度や価値を反映させ,さらに,フォーメーション上の「役割」に基づいて分析を行うことで,チームとしての普遍的な戦術構造の抽出・分析を可能とした.","excerpt_src":"序論"},{"id":"2025_soccera_1_98","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"パスから見た攻撃構造によるチーム分類とキーパス解析","members":"齋藤耕太朗，若井直太朗，岡田壮一郎，益田航汰，山口敦子(東京都市大学)","first_author":"齋藤耕太朗","affiliation":"東京都市大学","code":"P1-17","abstract":"2024年度のJ1リーグデータを用いてパスの統計量（パス数、成功率、長さなど）に基づいてチームをクラスタリングし、18チームを攻撃スタイルで分類した。k-meansにより安定したクラスタ構造を発見し、ペアワイズアラインメントを用いてシュート直前5パスのパターンを分析した。クラスタごとに異なるキーパスの特徴を明らかにし、攻撃構築における戦術的差異を定量化した。","methods":["クラスタリング","ネットワーク分析","可視化","機械学習"],"themes":["パス","戦術分析","チーム評価","ビルドアップ"],"data":["イベントデータ","トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいてパスは,単なるボール移動の手段ではなく,攻撃構築の根幹を成す戦術的な要素である.パスを通じて相手守備組織を効果的に動かし,数的・位置的な優位性を創出することが現代サッカーの主要なメカニズムとなっている.したがって,各チームがどのようなパスを選択し,どのような軌跡で攻撃を進行させているのかを分析することは,その攻撃スタイルや戦術的特徴を理解するうえで極めて重要である. [2] ではチームごとにパスの抽出を行い,その結果,チーム間でパスの連携パターンに違いが見られる可能性が指摘されている.本研究では,この攻撃構築におけるチーム間の差異を定量的に明らかにし,その特徴を抽出することを目的とする.具体的には,以下の分析を行った1. 攻撃軌跡の可視化と定性的分析 : 攻撃過程におけるパスの軌跡を可視化し,パス攻撃の組み立て方はチームごとに大きく異なることを,定性的に確認した. 2. パス統計量によるクラスタリング: 上記の示唆に基づき,パスの単純な統計量を用いたクラスタリングを実施した.その結果,クラスタ数を変化させても安定して存在する二つの主要な攻撃スタイル (クラスタ A, B)を特定することができた. 3. 軌跡データに基づく詳細分析 : さらに,各チームの攻撃パターンデータ全体を対象に,ペアワイズアライメントに基づく階層クラスタリングを用いた比較分析を行った.これにより,攻撃パターンごとにキーとなるパスの種類や位置が異なることが判明した.本研究は,Decroos らにより提唱された VAEP(Valuing Actions by Estimating Probabilities)フレームワークに着想を得ている [1].VAEP は,機械学習を用いて,試合の文脈(コンテキスト)と長期的な影響を考慮に入れながら,ボールを扱うあらゆるアクション (パス,ドリブル,シュートなど)がチームの得点確率をどれだけ増減させたかに基づいて,客観的な価値を割り当てる手法である.この VAEP の計算方法を参照し,独自のコードを用いて分析対象のデータセットを精査した結果,得点につながる攻撃シーケンスにおいて,シュートから遡って 5 本目までのパスが,その攻撃全体におけるアクションの約 7 割を占めるという重要な知見が得られた.この知見に基づき,本研究の目的は,この高い割合を占めるシュート直前の 5 本のパスに着目し,これらのパスが持つ戦術的価値を定量的に分析・評価することにある.このシュート直前の 5 本のパスが描く軌跡を,攻撃パス軌跡,また,ボール奪取からシュートに至った一連のパスを攻撃パスシーケンスと呼ぶことにする.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_100","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"コーナーキックの得点成功要因分析 ―フリーの度合いとポジショニングの有効性比較―","members":"米田亮吾，吉次晃史，宮本道子(長崎大学)","first_author":"米田亮吾","affiliation":"長崎大学","code":"P1-18","abstract":"J1リーグの95試合808件のコーナーキックデータを用いて得点成功要因を分析した。シュート選手のフリー度合い（マークとの距離）が得点の有無に統計的有意差を示さないことを明らかにした一方、エリア分析では守備戦術に関わらずゴール正面中央（エリア14・15）が重要で、低速での適切な位置への移動が高速走り込みより有効であることが判明した。ロジスティック回帰とXGBoostによる予測分析も実施し、限界を報告した。","methods":["統計的検定","ロジスティック回帰","勾配ブースティング","クラスタリング"],"themes":["セットプレー","ゴール期待値","ポジショニング","得点予測"],"data":["イベントデータ","トラッキングデータ","外部データ併用"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"現代サッカーにおいて、世界のトップレベルではセットプレーに対するアプローチが専門化している。世界最高峰のリーグであるプレミアリーグの多くのクラブがセットプレー専門コーチを導入していることは、この潮流の象徴である。セットプレーからの得点はサッカーの得点の 3 割前後を占めるといわれており(中山,2018)[1]、国内においても、日本代表チームがセットプレー専門コーチを招き、勝機を見出すための重要な戦略としてセットプレーの強化を図っている。","excerpt_src":"研究の背景"},{"id":"2025_soccera_1_105","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"ペナルティエリア内におけるシュートの要因分析","members":"七戸克聡，杉本龍勇(法政大学)","first_author":"七戸克聡","affiliation":"法政大学","code":"P1-19","abstract":"本研究はJ1リーグのペナルティエリア内でのシュート行動に影響する要因をロジスティック回帰分析により明らかにした。攻撃側の位置・速度・守備者との距離・PA内の守備者人数など複数の変数がシュート決定に有意な影響を与えることを示し、戦術的な攻撃設計の指針を提示した。","methods":["ロジスティック回帰","統計的検定"],"themes":["シュート","得点予測"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["シュート期待数"],"awards":[],"text_insufficient":false,"excerpt":"プロスポーツリーグやチームを運営するにあたり、入場者数はクラブの収入に大きく影響する一つの要因である。Jリーグ「J.LEAGUE SEASON REVIEW 2024」によると、2024年シーズンのJリーグ公式試合は年間入場者数が過去最多の12,540,265人を記録した[1]。また、Jリーグはファン層の拡大に向けて、関心の強さや試合観戦経験・認知状況によって分けた「9segs®調査・スタジアム観戦のセグメント定義」を作成し、各セグメントの増減を評価している。ここでは、 「2023年以降にJリーグのスタジアム観戦なし&今後1年以内にJリーグのスタジアム観戦をしたい」層をターゲット層としている。このセグメントは6月期調査・11月期調査ではどちらも横ばいの結果になったが、Jリーグは「スタジアム観戦層・高関心層への転換が進む中で重点セグメントのボリューム維持ができている状態にある。」[1]と評価している。一方で、スポーツ庁「令和6年度『スポーツの実施状況等に関する世論調査』」によると、この1年間に直接現地で観戦しなかった人の割合は73.6%となっている[2]。このことから、現地観戦に対して積極的ではない人が多いと考えられ、依然としてライト層を増やす必要があるとわかる。この課題に対して、様々な施策によって集客や観客満足度を上げる必要がある。佐々木ら(2017)によると、「ゲームの魅力」はライト層の満足度に強く影響を与えているとわかっている[3]。ここでのライト層とは、 「観戦回数が“はじめて”の者」と定義しており、Jリーグがターゲット層としている顧客層である。ここから、ライト層の観客満足度には「ゲームの魅力」が影響を与えており、その「ゲームの魅力」を高める要因の一つにゴールが関係していると推測される。ゴールがない試合よりも、応援しているチームが得点を取り、勝利した試合の方が面白いと感じることは明白である。しかしゴールはサッカーにおいては非常に稀なシーンであるため、本研究ではゴールの一つ前のシーンであるシュートに着目する。また、本研究はシュートを多く打つ戦い方の調査を目的としており、シュートを打つ要因を調べることでシュートの増加の一助となり、観客数増加や収入増加につながる可能性が期待できる。","excerpt_src":"導入"},{"id":"2025_soccera_1_110","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"Expected Looseball の提案","members":"美濃伊沙良，大西諒，亀﨑允啓(東京大学)","first_author":"美濃伊沙良","affiliation":"東京大学","code":"P1-21","abstract":"本研究はゲーム支配の観点からルーズボール回収の期待値指標 xL を新たに提案した。優勢領域とガウス分布を組み合わせた確率モデルにより、各選手がルーズボールを獲得する確率を定量化し、選手評価とトレーニング手法の開発に貢献する指標を構築した。","methods":["確率モデル","最適化","空間分析"],"themes":["スペース評価","戦術分析"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["xL","ルーズボール"],"awards":["ポスター部門 優秀賞"],"text_insufficient":false,"excerpt":"近年のサッカーの定量的分析は計測技術の発展の恩恵を受け、めざましい勢いで発展を遂げている。とりわけExpected Goal(xG) やExpected Threat(xT)[1] のように、従来の指標では具体的な定量化が難しかったサッカーの諸現象を期待値として表現することにより、より適切で実戦的な分析が可能となりコーチングやチーム戦術の意思決定にさらなる寄与が期待されている。現在のところ、これらの指標の多くはxG やxT のように得点への寄与をベースに定量化されていることが多い。しかしながら、サッカーの戦術においてはプレーの評価は攻撃への寄与のみならず、ゲーム支配にどの程度寄与しているのか多角的に評価されるべきである。その中でも、サッカー指導者の間ではゲーム支配の観点において、ルーズボールの回収を重要視することが多い。ルーズボールとは競り合いのこぼれ球や相手のディフレクションによって発生するお互いのチームが予期しないボールのことを指し、主に両者がボールを回収する可能性を有する局面を指す。ルーズボールを多く回収することで、自チームのボール保有時間が増加し、試合を有利に進めることが可能となる、というロジックで説明されるものである。ルーズボールの回収について、定性的な分析を行なった研究は[2] が代表的である程度で依然として検討は十分に進んでおらず、多くの選手は指導者の印象をもとに定性的に回収能力を評価されており、客観的な能力評価とは言い難い。そこで本研究では、サッカーのゲーム支配を多角的に分析をする目的でルーズボールの回収という現象に着目し、どのような選手がより効率的にルーズボールを回収しているかについて新指標「Expected looseball(xL)」について提案を行い、その妥当性を実験した。これにより、従来指導者の感覚によって評価されてきらルーズボール回収の能力を定量化することが可能となり、選手の正しい評価やルーズボール改修に向けてのトレーニング手法の開発にながることが期待される。","excerpt_src":"導入"},{"id":"2025_soccera_1_114","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"統計物理学的手法によるサッカーの集団的振る舞いの分類","members":"杉山弘樹，王方成，染谷大河，亀﨑允啓(東京大学)","first_author":"杉山弘樹","affiliation":"東京大学","code":"P1-22","abstract":"本研究は統計物理学の視点からチームの集団的行動を分析し、複数の階層における特徴量に基づいてチームスタイルを分類した。秩序相と無秩序相の転換点を定量的に推定し、主成分分析とクラスタリングにより攻撃・守備フェーズごとの戦術スタイルの多様性を明らかにした。","methods":["クラスタリング","次元削減","統計的検定"],"themes":["チーム評価","戦術分析","ポジショニング"],"data":["トラッキングデータ"],"free_tags":["秩序変数","von Mises分布"],"awards":[],"text_insufficient":false,"excerpt":"社会物理学は,社会現象を多数の個体が相互作用しながら形成する集団的振る舞いとして捉え,その背後にある統計物理学的特徴を明らかにしようとする試みである。この観点に立てば,複数の選手が相互に影響を及ぼしながら連続的に行動するスポーツも社会物理学の研究対象として位置づけることができる。本研究では,対戦型集団スポーツであるサッカーに着目し,統計物理学の視点から集団の振る舞いを考察する。特に,試合中の選手の移動を詳細に記録したトラッキングデータから得られる統計的な情報を用いて,チームスタイルを分類することを目的とする。","excerpt_src":"序論"},{"id":"2025_soccera_1_5","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"FC町田ゼルビアの試合データを用いたロングスローの戦術的価値の検証","members":"志村隆太，小島吾，佐藤浩志(明星大学)","first_author":"志村隆太","affiliation":"明星大学","code":"P2-01","abstract":"本研究はFC町田ゼルビアの試合データを用いてロングスローの戦術的価値を検証した。町田ゼルビアはJ1リーグ全体と比較してペナルティエリア内に投げ込むロングスローを多用し、速度・飛距離の両面で他クラブより突出していることが明らかになった。ロジスティック回帰分析により、ロングスロー後の得点にはセカンドボール回収が最も重要であること、スローイン開始位置やスローイン角度などの空間的・技術的要因が得点発生を後押しすることが示された。","methods":["ロジスティック回帰","空間分析","可視化"],"themes":["セットプレー","得点予測","ポジショニング","戦術分析","勝敗要因"],"data":["イベントデータ"],"free_tags":["ロングスロー","セカンドボール","ホットスポット分析"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいてスローインは競技規則上の再開方法の一つであり,通常はプレーを継続するための手段として位置づけられてきた。近年,ペナルティエリアへ直接ボールを投げ込むロングスローが一部のクラブで戦術的に活用されるようになっている。ロングスローは空中戦やセカンドボールの争いを誘発し,コーナーキックなどのセットプレーに近い性質を有している。一方で,ロングスローは高校年代では一般的に見られるものの,プロサッカーにおいては必ずしも広く採用されているとは言えず,その評価には肯定・否定の両方が存在しており,ロングスローの戦術的価値は十分に整理されていない1 2。本研究で対象とするFC 町田ゼルビア(以下町田ゼルビア)は,J1 クラブの中でもロングスローを積極的に活用している点で特徴的であり,ロングスローの戦術的有効性を検証する事例として適している。本研究では,町田ゼルビアの試合データを用いてロングスローの発生頻度や使用位置を分析し,その戦術的価値を明らかにすることを目的とする。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_9","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"守備選手の介入可能領域を用いたサッカーにおけるハイプレス連動指数の作成","members":"西山巻介，下玉利頌真，後藤允(東京理科大学)","first_author":"西山巻介","affiliation":"東京理科大学","code":"P2-02","abstract":"本研究は守備選手の介入可能領域を用いた、ハイプレス連動指数を提案した。ハイプレスの成否ではなく、守備者がどの程度連動してプレッシャーをかけているかという過程を定量化する新しい指標である。分析によりハイプレスに積極的なチームとして京都、横浜FM、広島が挙げられ、消極的なチームとしてG大阪、柏、湘南が挙げられた。このハイプレス連動指数により、従来の結果を評価する指標では説明が困難であったチーム間のハイプレス戦術の差異を、より構造的に議論することが可能になった。","methods":["空間分析","確率モデル","指標開発"],"themes":["プレッシング","ポジショニング","トランジション","戦術分析","チーム評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["ハイプレス連動指数","介入可能領域"],"awards":[],"text_insufficient":false,"excerpt":"サッカーでは時代によって様々な戦術の流行が訪れる.近年は,攻撃の際に後方からボールを繋いで前方へ運ぶ,いわゆるビルドアップを重視する傾向にある.これに伴い,守備側はビルドアップを防ぐために前方から積極的にプレスをかける機会が増えている.また,ハイプレスは相手のビルドアップを防ぐだけでなく,相手陣内でのボール奪取を通じて速攻の機会を創出し,得点期待値を高める戦術としても広く用いられている.しかし,ハイプレスの成功に影響する要因や,その成功がチームパフォーマンスに与える効果,チームとしての連動性については,十分に明らかになっていない.これまでの研究は,主として攻撃側のポジショニングやボール保持局面における空間活用に焦点を当ててきた.特に,Fernandez and Bornn [1] は選手の移動速度や到達時間に基づく空間支配モデルを構築し,攻撃側がピッチ上のどの地点をどの程度コントロールしているかを確率的に定量化している.このモデルは攻撃側の選択肢やボール保持者のプレー可能領域を理解する上で大きな貢献を果たしている.一方で,守備選手がポジショニングによって,攻撃側の選択肢を制限しているのかといった視点は,先行研究では十分に扱われていない.サッカーにおけるハイプレスは,個々の選手が孤立して行っても十分な効果を発揮せず,チームとして連動することではじめて意味を持つ.したがって,本研究では,このような「連動したプレス」の程度を定量的に評価可能な指標を構築することを目指す.","excerpt_src":"序論"},{"id":"2025_soccera_1_18","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"相手攻撃シーケンスを単位とした守備ポジショニング評価指標の提案","members":"岩松歩武，吉田海翔，寒水孝司(東京理科大学)","first_author":"岩松歩武","affiliation":"東京理科大学","code":"P2-03","abstract":"本研究は相手攻撃シーケンスを単位とした守備ポジショニング評価指標（DPS）を提案した。xThreat、失点リスク評価、スルーパス遮断確率などを統合することで、従来のスタッツでは捉えきれないオフボール守備行動を定量化した。試合単位での総合指標DPSmatchと勝敗の関係を分析した結果、勝利チームはDPSmatchが高い傾向が見られ、提案指標が守備戦術評価に有用であることが示唆された。","methods":["機械学習","勾配ブースティング","指標開発","確率モデル"],"themes":["守備","ポジショニング","勝敗要因","戦術分析","チーム評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["xThreat","ゴール期待値","スルーパス成功確率"],"awards":["ポスター部門 優秀賞"],"text_insufficient":false,"excerpt":"試合中のプレーの評価は選手の育成や戦術理解において重要である.現在,プレーの評価には1 試合当たりのアクション(シュートやパス,インターセプトなど) の数を表すスタッツが広く用いられている.スタッツは主にボールタッチに基づくアクションで構成されており,ボールに関与しない選手(オフボール選手) の動きや位置情報を十分に捉えることができない.そのため,スタッツのみに依存した手法では,プレーの意図や戦術の文脈を十分に反映できず,選手の能力評価に限界が生じる.選手の位置関係の評価は,特に守備の場面のアクションに表れない失点回避行動を評価する上で有用である. Markou[1] は,守備選手の位置情報を用いて,相手チームのビルドアップに対しボール奪取できたかを評価している.その結果,守備側チームが高いラインを保ち,ボール保持選手や周囲の攻撃選手に対して数的,距離的なプレッシャーをかけている状態が,ビルドアップ中のボール奪取確率を高めることが示された.このように選手間の位置関係を定量的に解析することは守備貢献の定量化において重要な役割を果たすが,その整備は十分ではない.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_22","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるプレッシング強度指標を用いた局面分析に向けて","members":"高橋太杜，黒木進(広島市立大学)","first_author":"高橋太杜","affiliation":"広島市立大学","code":"P2-04","abstract":"本研究は先行研究のインターセプト確率指標を逆説的に応用し、攻撃側の視点から見たボール保持リスク評価手法を提案した。Time to Intercept（TTI）確率を用いてプレッシング強度を可視化し、攻撃側の最適な立ち位置を定量的に評価する方法を検討した。局所的なシーンでTTI確率の分布を可視化することにより、シュートシーンや攻撃局面における戦術的な判断支援が可能になることを示した。","methods":["シミュレーション","空間分析","指標開発"],"themes":["プレッシング","ポジショニング","戦術分析","試合の流れ"],"data":["トラッキングデータ"],"free_tags":["Time to Intercept","TTI確率","プレッシング強度"],"awards":[],"text_insufficient":false,"excerpt":"近年,トラッキング技術の進歩に伴い,サッカー競技における定量的なパフォーマンス評価への取り組みが急速に活発化している.従来のようなボールを中心とした指標に加え,現在では選手の位置情報を活用することで,オフ・ザ・ボールの動きや空間支配といった戦術的な要素を客観的に評価する試みが多くなされている.こうした中,守備戦術の評価に関する先行研究[1]では,守備時のプレスの激しさを表す定量的な指標として 「インターセプト確率」 が提案されている.この指標は,守備側がいかに効果的にボール保持者へ圧力をかけ,パスコースを限定しているかを測る上で有用であり,これまで主に守備側の貢献度や守備の程度の激しさを評価するために用いることができるとされていた.しかし,この指標をボール保持者の視点から捉え直すと,インターセプト確率は 「ボールを失うリスク」 そのものであると解釈できる.すなわち,味方選手へのパスコースにおけるインターセプト確率が低いほど,ボール保持の可能性が高まり,攻撃の継続性が保証されることになる.結果として,不用意なロストを減らすことは,試合における敗北のリスクを低減させることにも繋がると考えられる.そこで本研究では,先行研究において守備の指標として用いられたインターセプト確率を逆説的に応用し,「インターセプト確率が低くなる位置」を攻撃における 「優れた立ち位置」 と定義する.本稿ではこの定義に基づき,実際の試合データを用いて選手のポジショニングを定量的に評価する手法を提案し,その有効性を検証することを目的とする.","excerpt_src":"はじめに"},{"id":"2025_chikoku_soccer_3_nakajima","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"Situtaion Score によるサッカー局面の定量的な評価モデル構築の試み","members":"楠木祥文，日下将志，中島智晴(大阪公立大学)","first_author":"楠木祥文","affiliation":"大阪公立大学","code":"P2-05","abstract":"RoboCupサッカーシミュレーションで検証された2段階モデルを現実サッカーに適用し、Situation Score指標により任意の局面をシュートまでの残り時間で定量評価するモデルを構築した。シュート・得点に接近した局面を体系的に評価する基盤を提供した。","methods":["機械学習","指標開発"],"themes":["戦術分析","試合の流れ"],"data":["トラッキングデータ"],"free_tags":["Situation Score"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて戦術を定量的に評価する方法として, Situation Score(SS)を採用し,SS を評価するモデル構築に取り組む.Situation Score はゴールもしくはシュートまでの残り時間を表す指標である.過去ゲームにおける各時間のSS を活用することにより,ゲーム中の任意の局面におけるSS を予測する機械学習モデルを構築することができる.これまでにRoboCup サッカーシミュレーションにおいては精度の良いSS 評価モデルを構築できることが示されている.本稿では,RoboCup サッカーシミュレーションの経験を踏まえて現実サッカーにおいてSS 予測モデルを構築する.本スポーツデータコンペティションでは,国内プロサッカーの試合から得られた詳細なトラッキングデータが提供されており,実際の選手配置やボール保持の推移に基づいてSS を推定できる点が特徴である.これにより,RoboCup サッカーシミュレーションで検証されてきた局面評価の枠組みを,現実の競技環境にどの程度移植できるかを検証するとともに,将来的にはチーム戦術の振り返りやスカウティングへの応用可能性を探ることを目的とする.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_29","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーの攻撃戦術分析における文脈情報の有効性に関する検討","members":"岡田悠馬，長内周平，平野眞音，市川淳(静岡大学)","first_author":"岡田悠馬","affiliation":"静岡大学","code":"P2-06","abstract":"本研究は静的分析から動的分析へと段階的に手法を拡張し、攻撃戦術分析における文脈情報の有効性を検証した。記述統計、マルコフ連鎖、Transformerの3つの手法を用いてガンバ大阪対アルビレックス新潟の攻撃パターンを分析した。Transformerを用いた時系列分析により、ガンバ大阪のMF活用の高さが対戦相手のポジショニング幅により生じていることを明らかにし、試合文脈を考慮した分析の有効性を示した。","methods":["時系列解析","機械学習","ニューラルネットワーク","深層学習","SHAP・説明可能AI","可視化"],"themes":["戦術分析","試合の流れ","ポジショニング","チーム評価"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["Transformer","マルコフ連鎖","SHAP"],"awards":[],"text_insufficient":false,"excerpt":"近年,スポーツの分野では,試合分析に関するデータドリブンアプローチの重要性が高まっている.従来は,監督やコーチ,選手の豊富な経験に基づく戦術の主観的な判断が重視されてきたが,近年ではデータに基づいた戦術の客観的判断が主流になってきている.サッカーでも,パスなどのアクションや選手の位置といったトラッキングデータなどをもとに,攻撃・守備双方における戦術的特徴を分析することが可能となっている. Stafylidis et al.[1] は,ギリシャのプロサッカーリーグの2020 年から2021 年シーズンにおける91 試合について,ゴール数,シュートなどを含む成果・パフォーマンス指標を用いたロジスティック回帰分析により,チームの勝敗を区別する主要因を特定した. 結果として,枠内シュート,PK といったチームの戦術的な選択の結果を表すアクションが勝利の可能性を大きく高めることを示した. また, Link et al. [2] は,ドイツのプロサッカーリーグの2014年から2015 年シーズンにおける64 試合について,選手とボールの位置情報から選手のポジショニング,ボール保持の安定性などを算出・統合した攻撃の「危険度」という指標を提案した. この指標により,従来のボール保持率やシュート数といったパフォーマンスの指標よりも,チームがどの程度試合を支配していたかを正確に評価できる可能性が示された.このように,サッカーの分析では,ボール保持者によるシュート数やパス成功率といった集計されたパフォーマンス指標を用いた分析(以下,静的分析と呼ぶ)と,ボール非保持者も含めた選手の位置関係や試合展開といった試合における文脈を含んだ分析(以下,動的分析と呼ぶ)に区分される.しかし,動的分析が静的分析と比べてどの程度有用であるのか,すなわち動的分析の有効性そのものに着目した研究は少ない.そこで,筆者らは静的分析から動的分析へと段階的に手法を拡張するアプローチを取り入れる.本研究は,試合分析に文脈情報を取り入れることによる戦術理解への有効性を検証することが目的である.第一に,記述統計に基づくポジション別の攻撃関与頻度のチーム別攻撃傾向分析を行う.第二に,マルコフ連鎖に基づき「どのエリアから」,「どのポジションが」,「どのアクションで」次の状態へ遷移するのかを検証するために状態遷移確率分析を行う.第三に,Transformer によるプレーシーケンスの時系列分類を実施する.これらの分析を比較することで,静的分析では捉えきれない試合展開や選手間の相互作用などの特徴を抽出する.本研究の知見は,現場におけるチーム戦術の理解,対戦相手の攻撃パターン予測,効果的な戦略立案といった実務的な戦術改善のサポートが期待される.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_33","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーのトラッキングデータに基づく戦術クラスタリングとシュート発生確率推定モデル","members":"奥村星哉，川合卓音，岩山幸治(滋賀大学)","first_author":"奥村星哉","affiliation":"滋賀大学","code":"P2-07","abstract":"J1リーグのトラッキングデータを用いて、LDAによるパスパターンの戦術クラスタリングを行い、ポゼッション型・速攻型・カウンター型の3種類に分類。各戦術タイプごとに独立したLSTMモデルを学習し、シュート発生までの過程を時系列的に推定。従来のxGとは異なり攻撃プロセス全体を評価でき、試合特性に起因するスコア偏りをキャリブレーションで緩和。","methods":["深層学習","ニューラルネットワーク","時系列解析","クラスタリング"],"themes":["戦術分析","得点予測","シュート"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["xG"],"awards":[],"text_insufficient":false,"excerpt":"近年、サッカーをはじめとするスポーツ競技において、トラッキングデータを活用した戦術分析やパフォーマンス評価が注目されている[1]。トラッキングデータは、試合中の選手やボールの位置座標を高頻度で計測したものであり、プレー構造を時系列的に解析できる利点がある。これにより、ボール保持率やパスネットワークなどの定量的指標に基づいてチーム戦術を可視化する研究が多く行われてきた。しかし、これらの分析は得点やシュートといった最終成果に直結する「攻撃の文脈」までは十分に考慮していない。文脈的要素を無視すると、プレーの意図や攻撃パターンの変化を捉えにくく、戦術的特徴を正確に評価できないという課題がある。本研究では、J1 リーグのトラッキングデータを用いて、「直後にシュートが発生する確率」を逐次的に推定するモデルの構築を目的とした。これにより、攻撃のどの局面で得点機会が生まれやすいかを定量的に把握し、チーム戦術やプレー構造の評価に応用できる[2]。また、逐次的な確率推定により、試合中の攻撃の危険度をリアルタイムに可視化することも可能となる。従来の得点期待値(xG)がシュート後の得点確率を扱うのに対し、本研究はシュート発生までの過程を対象とする点に特徴があり、攻撃プロセス全体の理解に寄与する。単純な特徴量や静的なモデルでは、チームの戦術的特徴や攻撃パターンの違いを十分に捉えることができない。そこで、チーム戦術を潜在変数として表現するために、イベントデータからLatent Dirichlet Allocation(LDA)[3] による戦術クラスタリングを行い、抽出したトピックをもとにチームを戦術タイプ別に分類した。さらに、このトピック情報に基づいて各戦術タイプに対し個別のLong Short-Term Memory(LSTM)[4] モデルを学習させることで、時系列的なプレーの流れと戦術的文脈の両方を考慮したシュート確率推定を試みた。本稿では、データ構成とモデル設計の概要、および戦術クラスタ別の学習結果について報告する。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_35","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"Wasserstein空間におけるマルコフスイッチング自己回帰モデルによるフォーメーション検知","members":"安藤瞭，藤山拓巳，髙澤祐槻(東京大学)","first_author":"安藤瞭","affiliation":"東京大学","code":"P2-08","abstract":"選手配置をピッチ上の確率分布とみなし、Wasserstein距離に基づくK-meansクラスタリングとマルコフスイッチングモデルを統合。試合中のフォーメーション変化を時間的に安定的に推定することで、独立した各フレームのクラスタリングで生じる揺らぎ問題を解決。D2群対称性を導入してデータ効率を改善し、局所的な位置変動に耐性のあるフォーメーション検出を実現。","methods":["機械学習","深層学習","クラスタリング"],"themes":["戦術分析","フォーメーション","チーム評価"],"data":["トラッキングデータ"],"free_tags":["Wasserstein距離","マルコフスイッチング"],"awards":[],"text_insufficient":false,"excerpt":"フォーメーションは,チーム戦術の基盤となる選手配置を表す概念である.サッカーでは伝統的に,守備・中盤・攻撃の順に各ポジションの人数を並べた数列で表され,例えば「4-4-2」はディフェンダー(DF)/ミッドフィルダー(MF)/フォワード(FW)がそれぞれ4/4/2 人の配置を指す.このような表現は選手の役割や位置取りを共有するための枠組みとして機能し,チームの戦術的ビジョンが現れるため,戦術分析や観戦理解においてフォーメーションの推定は重要である.一方,現代サッカーでは,攻撃/守備の局面,時間帯や点差などに応じてフォーメーションが変更されることが多いため,その変化をデータから安定的に推定することは難しい.このような背景のもと,トラッキングデータに基づいたフォーメーションの自動推定手法が提案されている[e.g. 5, 1, 4].著者らも2022 年度スポーツデータサイエンスコンペティションにおいて,選手配置をピッチ上の確率分布とみなし,Wasserstein 距離に基づくK-means 法により選手配置をクラスタリングすることで,フォーメーションを自動検出する手法を開発した.実験の結果,得られたクラスタのクラスタ中心である代表フォーメーションは,従来用いられてきたフォーメーション表現とよく対応しており,解釈性の高い代表フォーメーションの抽出が可能であることが示された.しかし,各フレームの選手配置を独立観測とみてクラスタリングするアプローチでは,試合中の選手位置の局所的な揺らぎにより,同一の戦術状態であっても推定されたフォーメーションが複数のクラスタへ分散して割り当てられうる.実際に前述のコンペティションにおいても,人間が「最も支配的なフォーメーション」と認識する選手配置と代表フォーメーションの間には一定の相関があった一方で,しかし,各フレームを独立に分類すると最近傍のフォーメーションが時間とともに変動するため,一試合全体としては分類結果が複数のフォーメーションに分散する傾向が見られた.本研究では,フォーメーションの時間的発展を明示的にモデル化し,チームが意図するフォーメーションを安定的に推定することを目指す.各時点の選手配置をピッチ上の確率分布として表現し,代表フォーメーションを潜在状態,その切り替えをマルコフ過程で記述する.さらに,各状態のもとで観測される選手配置の揺らぎをWasserstein 空間上の自己回帰(AR)モデルで表し,フォーメーションの推移と切り替わりを統一的に扱う枠組みを提案する.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_39","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"コーナーキック戦術解析","members":"氏原涼太，尼崎太樹(熊本大学)","first_author":"氏原涼太","affiliation":"熊本大学","code":"P2-09","abstract":"Google DeepMindとLiverpoolの共同開発TacticAIを参考に、GDL（幾何学的深層学習）とGNN、類似戦術検索を統合したコーナーキック解析モデルを構築。ピッチの左右・上下反転対称性を組み込んだD2群に基づく処理を採用。4ビュー一貫性正則化を導入し、限られたデータ環境下でも受け手予測・シュート予測の精度向上を実現し、戦術生成と類似CK検索を統一的に実行。","methods":["深層学習","ニューラルネットワーク","生成モデル"],"themes":["戦術分析","セットプレー","得点予測"],"data":["トラッキングデータ"],"free_tags":["GDL","GNN","CVAE"],"awards":[],"text_insufficient":false,"excerpt":"近年,サッカーをはじめとするチームスポーツでは,トラッキングデータと機械学習を活用した戦術分析が急速に発展している.選手やボールの位置を高頻度で取得できるようになったことで,これまで経験則に依存していた戦術の有効性を定量的に議論できるようになった.しかし,選手同士の相互作用は複雑であり,単純な特徴量設計や個別選手の分析では戦術全体を捉えきれないという課題が残る.こうした課題に対し,Google DeepMind とLiverpool FC が共同で開発したTacticAI[1] は,コーナーキック(以下CK)局面をグラフ構造として扱い,幾何学的深層学習(Geometric Deep Learning; GDL)[2] を用いることで,空間的対称性(左右反転など)を組み込んだ高次の戦術表現を実現した.さらに,GNN による受け手予測・シュート予測だけでなく,条件付き生成モデルによる戦術生成,および潜在空間を用いた類似局面検索までを統合的に行う点で,従来研究を大きく発展させた枠組みとなっている.本研究では,このTacticAI を単に再現するのではなく, TacticAI の構造を踏まえた上で,その一部を改良・拡張することで精度向上や合理性の向上を目指すものである.具体的には,• 幾何学的ビュー間に一貫性を持たせる正則化の導入(GDL の別アプローチとしての新規性),• 類似CK 検索における類似度定義の改善(構造をより反映できる新しい類似度の導入),といった観点から,TacticAI の枠組みを改善する方向を探索している.これらはいずれも,計算量削減やモデル簡略化を目的とするものではなく,最新モデルの合理性・表現力・精度を高めるための改良という位置づけである.本稿では,まず原著論文[1] に基づきTacticAI の枠組みを整理し,そのうえで本研究で提案する拡張手法の実装およびコンペティションデータを用いた評価実験の結果を報告する.具体的には,幾何学的ビュー間の一貫性正則化の導入による予測精度の向上と,類似局面検索の定性的評価を通じて,提案手法の有効性を明らかにする.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_47","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"SHAPを用いたパス特性の重要度分析：チームクラスタリングと得点数の要因比較","members":"鎌倉孝成，篠木大知，高山悠馬，森本康彦(広島大学)","first_author":"鎌倉孝成","affiliation":"広島大学","code":"P2-10","abstract":"サッカーのパス交換データに対してSHAPとLightGBMを適用し、チームスタイル形成に寄与するパスと得点に寄与するパスの関係を比較分析した。クラスタリングSHAPと得点数SHAPの結果から、チームが重視するパスと攻撃成果に直結するパスが異なることを明らかにし、説明可能なAIを用いた新たなサッカー戦術分析の枠組みを提示した。","methods":["機械学習","クラスタリング","SHAP・説明可能AI"],"themes":["チーム評価","戦術分析","パス"],"data":["イベントデータ"],"free_tags":["LightGBM"],"awards":[],"text_insufficient":false,"excerpt":"近年、サッカーの分析においてトラッキングデータやイベントデータの活用が進み、チーム戦術やプレースタイルを客観的に評価する取り組みが増加している。特に、パスネットワークを用いたチーム戦術の可視化や、特徴量としてパス指標を扱う機械学習による勝敗予測モデルが多数報告されている。しかし、これらの研究の多くはパスの「重要度」や「意味づけ」を明示的に解釈できる手法を十分に活用していない。また、チームのプレースタイル(パス構造)と試合結果に直結するパフォーマンス指標(例:得点数)との関係性が、どのパスによって生じているのかを説明可能なかたちで明らかにした研究は限られている。本研究では、(1) パス交換データに基づくチームクラスタリングと(2) 得点数を目的変数としたモデルの双方に対してSHAP(SHapley Additive exPlanations)を適用し、「どのパスがチームスタイル形成に寄与しているのか」「どのパスが攻撃成果(得点数)に寄与しているのか」を比較分析する。これにより、スタイルと成果の違いを生み出すパスの特性を説明可能な形で提示することを目的とする。","excerpt_src":"研究背景"},{"id":"2025_soccera_1_52","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおける守備組織の統計的解析II","members":"礒井庸充，青山和司，湯川諭(大阪大学)","first_author":"礒井庸充","affiliation":"大阪大学","code":"P2-11","abstract":"DF選手間距離をX座標とY座標に分解して分析し、守備時の距離分布がガウス分布と指数分布で特徴づけられることを明らかにした。さらに時間相関関数から守備選手間のカバーリングの時間スケールが3～4秒程度であることを推定し、組織的守備行動の定量的理解を深めた。","methods":["統計的検定","時系列解析","指標開発"],"themes":["守備","ポジショニング","チーム評価"],"data":["トラッキングデータ"],"free_tags":["ガウス分布","指数分布"],"awards":[],"text_insufficient":false,"excerpt":"近代サッカーでは、チームの戦力を最大限活かすために戦術が重要視されている。戦術は、主にフォーメーションを基盤に構成され、選手は戦術に基づいて組織的に行動することが求められている。 2024 年度のスポーツデータサイエンスコンペティションでは、組織的な守備組織に注目し、ディフェンダー (DF) 選手間距離分布がガウス分布と指数分布で特徴付けられることを明らかにした。こうした背景のもと、本研究ではDF 選手間距離を x 座標と y 座標に分解し、更なる洞察を得ることや、 DF 選手間距離についての時間相関関数を計算することで DF 選手間のカバーリングの時間スケールを定義することを目的とした。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_62","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカー戦術検証に向けたシミュレータ分析","members":"中川蓮，安井賢俊，中村友紀，矢野泰樹，中田柊也(神戸大学)","first_author":"中川蓮","affiliation":"神戸大学","code":"P2-12","abstract":"GFootballシミュレータを用い、実データとシミュレーション結果の統計的差異を定量的に評価するフレームワークを提案した。ルールベースAIと強化学習モデル（TiZero）のパラメータ調整と比較を通じて、シミュレーション信頼性向上に向けた課題と改善方法を明らかにした。","methods":["シミュレーション","強化学習","機械学習"],"themes":["戦術分析","パス","シュート"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["GFootball","TiZero"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて戦術は、試合の勝敗を左右する重要な要素である。しかし、その戦術の有効性は、実戦を通じて効果が明らかになるため、戦術の検証には多大な時間と労力を要する。また、実環境では対戦相手や環境要因といった影響が無視できず、戦術のみを評価することが困難である。その点、シミュレーションを用いた戦術検証は条件制御や実験コストの面で実戦での検証より優れており、効率的な戦術検証を可能にする手段として有用であると考えた。しかし、シミュレーションにより得られた結果の信頼性を評価する手法が確立されておらず、シミュレータを用いた戦術検証は今日においても実用化には至っていない。シミュレータによる戦術検証を実現するためには、まずシミュレーションと現実の乖離について、定量的な検証を行うことが不可欠となる。先行研究として、パスネットワークを用いた実データとの比較分析[1] などが行われているが、シミュレーションと現実の差異はまだ十分にはわかっていない。そこで本研究では、シミュレーションと現実の乖離を評価可能なフレームワークを提案する。本研究の主な貢献は以下の3 点である。第一に、シミュレータ生成データと実データの統計的差異を計測する評価フレームワークを提案したこと。第二に、本フレームワークを適用し、選手の特性パラメータや行動規則が生成データと実データの再現度に及ぼす影響を、実データとの比較により定量的に分析したこと。第三に、標準的なルールベースAI に加え、最新の強化学習モデルであるTiZero を用いた比較検証を行い、学習ベースAI と実データとの乖離についても明らかにしたことである。","excerpt_src":"緒言"},{"id":"2025_soccera_1_68","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"トラッキングデータを用いた文脈依存型ゴール期待値予測モデルの構築","members":"田邉翼，秋山仁志，片岡駿太，江頭健斗，山口光，田畑耕治(東京理科大学)","first_author":"田邉翼","affiliation":"東京理科大学","code":"P2-13","abstract":"トラッキングデータからシュート直前のプレー内容、選手利き足、ゴールキーパー位置、守備プレッシャーなど新たな説明変数を抽出し、ロジスティック回帰に導入した。ボール奪取からシュートまでの経過時間を含めた文脈依存的で精密なxG推定を実現し、従来モデルより高い予測精度を達成した。","methods":["ロジスティック回帰","機械学習","指標開発"],"themes":["シュート","ゴール期待値"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["xG"],"awards":[],"text_insufficient":false,"excerpt":"サッカーは得点が極めて少ないスポーツであり,1 得点の試合結果に与える影響は極めて大きい.この特性は,偶発的な得点が試合結果を左右しやすいことを意味し,単純な得点数やシュート数ではチームや選手の実力や戦術的効率性を十分に評価しきれない.従って,各シュートがどれほど得点に結びつくかを定量化する指標は,試合分析・戦術評価・選手評価において重要な指標となり,その代表的な指標がゴール期待値(expected goals: xG)である.xGは,各シュートが得点になる確率を数値化した指標であり,シュートシーンの質を評価可能とする.これは戦術の良否を比較する客観的手段となり得るだけでなく,選手評価にも活用可能である.そして,得点数やシュート数といった表面的な結果ではなく,「難易度の高い状況で得点したか」,「高確率の得点機会にどれだけ関与したか」といった質的な要素を反映することで,フォワードの決定力やポジショニング能力といった選手固有の能力評価が可能である.また,xG は短期的な偶然性を緩和し,長期的なパフォーマンス評価も可能にする.現代サッカーでは,攻守転換が試合の趨勢を左右する重要な局面として位置付けられている.なかでもユルゲン・クロップがドルトムントやリヴァプールで採用したゲーゲンプレスはボールを失った直後に即座に奪い返し,そのまま素早く攻撃へ移行することで得点機会を創出する戦術である.クロップの成功を契機に,プレッシングと高速トランジションを重視する戦術が欧州の多くのクラブに普及し,ボール奪取からシュートまでの時間が得点確率に与える影響が広く注目されるようになった.しかし,リーグによってショートカウンターが最も得点につながりやすく,長いポゼッションからの攻撃が得点につながっていたり逆の傾向を示す場合もある(Cooper and Pulling [1]).このように,ボール保持時間はリーグやチームの戦術に依存しつつも,得点に直接影響を及ぼしている可能性が高い.ゆえに,本研究で導入するtime_since_start(ボール奪取からシュートまでの経過時間)は,こうした即時性を重視した戦術的価値を捉えるための変数である.トランジション速度の違いをxG 推定に組み込むことで,従来モデルよりも文脈依存的で現実に近い得点確率の推定が可能になる.本研究では,片岡ら[2] が提案したxG 予測モデルを改善するため,シュート直前のプレー内容,選手の利き足,ゴールキーパー位置,守備側プレッシャー指標など新たな説明変数を導入する.ロジスティック回帰分析に基づくxG 予測モデルの構築により,選手やGK の位置,試合状況などを一体的に考慮した,より精密かつ実践的なxG 推定を行う.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_83","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"人間的特徴を考慮したフィールド状況の可視化","members":"大平悠介，出口和希，伴地芳啓(早稲田大学)","first_author":"大平悠介","affiliation":"早稲田大学","code":"P2-14","abstract":"従来のピッチコントロールモデルに選手の身体能力や動作特性を反映させた拡張モデルを提案した。ホモグラフィ変換とアフィン変換を用いて、選手の影響範囲を非対称に歪ませ、より人間的な支配度評価を実現した。コーナーキックのファーストタッチ位置でのスペース支配度を検証することで、モデルの妥当性を確認した。","methods":["可視化","空間分析","統計的検定"],"themes":["スペース評価","ポジショニング","セットプレー"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"FIFA ワールドカップは日本国内においても非常に高い視聴率を記録し、サッカーに詳しくない層にまで視聴が浸透する稀有なスポーツイベントである[1]。近年では、スマートフォンやタブレット端末の普及と、インターネット配信やサブスクリプションサービスの拡大により、誰もが気軽にサッカー中継を視聴できる環境が整った。これにより、ルールや戦略に精通していなくても試合を観戦する層が増加していると考えられる。一方で、サッカーは味方・敵合わせて22 名で行われ、ボールアウトやファウルによる中断を除けばプレーが連続的に進行する。その戦術理解には、ボール保持者だけでなく、ボールから離れた位置にいる選手の動きや、フィールド上のスペースの変化を捉える必要がある。例えば「この選手が前方へ走ったことでスペースが生まれる」といった戦術的説明は、サッカー初心者にとって直感的に理解することが難しく、観戦経験の差がそのまま観戦の質の差につながっていると危惧される。この問題に対し、盤面の可視化は観戦支援の手段として有効であり、データアナリティクスの面からも価値が高い。盤面の可視化とは、フィールド状況のモデル化であり、最適パス経路の探索やスペース創出の定量評価など、多様な応用が可能である。従来の代表的手法のひとつとして、図 1 に示すようなV oronoi図を用いたエリア支配モデルがある[2, 3]。しかしながら、V oronoi図は「どの選手がその地点を支配しているか」を二値的に判定するモデルであるため、支配度合いの連続的な評価ができないという限界があった。この課題に対して近年提案されたのが図 2 に示したピッチコントロールモデルである[4]。このモデルは、各選手の影響度を二次元正規分布として表現し、チーム単位での支配度を合算することで任意の地点における「スペース支配確率」を算出するものである。V oronoi 図に比べ、より滑らかで連続的な支配度を求めることが可能となった。しかしながら、ピッチコントロールモデルには依然として課題が残されている。それは、選手個々の身体能力や動作特性といった人間的特徴を十分に反映していない点である。すべての選手を同一の二次元正規分布で扱うため、選手ごとのスプリント力や、パフォーマンスによる影響力の高さといった要素が無視されてしまう。また、二次元正規分布は同心円状に分布が広がっているため、身体が向いている方向によって前後が存在していること、足の可動域、利き足といった人間特有の影響範囲の歪みを表現できていないと考えられる。図 1 V oronoi図図 2 ピッチコントロールモデル本研究ではこの点に着目し、選手個々の人間らしさを反映した拡張ピッチコントロールモデルを提案する。具体的には、従来モデルを基盤としつつ、スプリント力を分散に反映させた二次元ガウス分布を生成し、ホモグラフィ変換を適用して分布形状を非対称に歪ませ、正規化処理を行ったうえで各選手の影響力を統合し、スペース支配度として算出する手法を構築した。さらに提案モデルの妥当性を検証する目的で、コーナーキック時の盤面において、提案したスペース支配度とファーストタッチが味方・敵のいずれであったかとの関係を比較・分析した。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_89","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"シュート直前の行動パターンの分類と得点への影響","members":"柴倉由宇，安藤栄之進，山添礼人，反町凱，古滝健人，安藤雅和(千葉工業大学)","first_author":"柴倉由宇","affiliation":"千葉工業大学","code":"P2-15","abstract":"2023年のJ1リーグ試合データを用いてシュート直前の行動パターンを分析し、得点に与える影響を定量化した。t検定とロジスティック回帰分析の結果、スルーパスのみが統計的に有意な得点促進要因であることが明らかになった。時間帯分析では前半45分付近でゴール率が最も高く、攻撃の「量」ではなく「質」が得点確率を決定することを示唆している。","methods":["統計的検定","ロジスティック回帰","時系列解析"],"themes":["得点予測","シュート","戦術分析"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年、サッカーにおいてはデータ分析の高度化が進み、シュート数や枠内シュート数などを用いてチームや選手のパフォーマンスを評価する手法が一般化している。しかし、多くの指標は「シュートそのものの質」や「シュートが打たれた位置」に注目しており、その直前にどのような動きがあったのかという「シュート前のプロセス」は十分に定量化されていない。本研究では、2023 年のサッカーの試合データを用いて、シュート直前の行動に着目し、その違いが得点にどのような影響を与えるのかを明らかにすることを目指す。現在の分析や指導現場では、「崩し方」や「アイデア」が重要だと口頭では語られる一方で、シュート前の具体的な行動パターン(例:何本パスをつないだのか、どのエリアから侵入したのか、ドリブルを伴ったのか、何人が攻撃に関与したのか)が、実際に得点につながりやすいのかどうかは、経験則に頼って判断されているのが現状である。そこで本研究は、2023 年の試合データを用いてシュート前の行動を類型化し、それぞれが得点に結びつく確率を比較・分析することで、「どのようなシュート前の動きがゴールを生みやすいのか」を客観的に示し、戦術立案やトレーニングへのフィードバックに資する知見を提供することを問題意識として設定する。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_96","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"守備組織の「亀裂」はいつ生じるか？：ニューラル制御微分方程式に基づく守備ライン異常検知","members":"久保幸平，宿久洋(同志社大学)","first_author":"久保幸平","affiliation":"同志社大学","code":"P2-16","abstract":"Neural Controlled Differential Equations（Neural CDE）を用いて守備ラインの動きを連続的な物理システムとしてモデル化し、守備組織の異常（「亀裂」）を検知するフレームワークを提案した。トラッキングデータを相対座標系で処理し、ボールという外部入力による守備4選手の軌道予測を行った。失点関連サンプルでは非失点サンプルの2.8倍の異常検知率を達成し、組織的な守備崩壊を定量化した。","methods":["深層学習","ニューラルネットワーク","時系列解析","確率モデル"],"themes":["守備","ポジショニング","戦術分析"],"data":["トラッキングデータ"],"free_tags":[],"awards":["ポスター部門 最優秀賞"],"text_insufficient":false,"excerpt":"スポーツアナリティクスの分野において,近年の光学トラッキング技術の発展は大きな変化をもたらした.全選手の座標データが高頻度で取得可能になったことで,パスやシュートといった離散的な「イベント」の分析から,選手間の空間的な相互作用や「動きの流れ」の分析へと焦点が移行している.特にサッカーにおいて,守備組織の評価は重要かつ困難な課題である.失点の多くは,シュートが放たれた瞬間に決まるのではない.その数秒から十数秒前,守備組織の要である最終ライン(Defensive Line) に生じた,わずかなポジショニングのズレや判断の遅れこそが失点につながる.しかし,これら守備組織の「亀裂」はデータ上で明示的なイベントとして記録されないため,従来の集計的な手法では捉えきれないのが現状である.こうした潜在的な異常を検知するため,選手の動きを予測モデルで学習し,実際の動きとの乖離を評価する手法が近年提案されている.しかし既存手法の多くは,離散的な時間ステップ上での予測に留まっており,実際の選手の動きや物理的な慣性,そしてボールという連続的な入力に対する守備組織のダイナミクスを十分に表現できていない.そこで本稿では,不規則な時系列データと物理的な連続性を扱うことが可能なニューラル制御微分方程式(Neural Controlled Differential Equations; Neural CDE) [1] を導入し,守備ラインの動きを物理モデルとして学習する枠組みを提案する.本手法では,守備ラインを自律的に動く個体の集合としてではなく,ボールという外部入力によって制御される連続的なシステムとして定式化する.このモデルにより物理的な連動性を学習し,その予測から逸脱した動きを「異常」として検知することで,失点に直結する守備組織の「亀裂」を定量化することを目的とする.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_99","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"J リーグにおけるレヴィウォークの傾向について","members":"島﨑伊武希，篠原修二(東京電機大学)","first_author":"島﨑伊武希","affiliation":"東京電機大学","code":"P2-17","abstract":"生物の探索行動モデルであるレヴィウォークに着目し、2023-24シーズンと2024-25シーズンの計90試合のJ1リーグトラッキングデータを用いて全ポジション542選手の移動パターンを分析した。切断べき分布に基づいてTP群（レヴィウォーク的）とEP群（ブラウンウォーク的）に分類し、ポジション別に異なる移動特性と13項目のパフォーマンス指標の差異を検証した結果、移動の質や行動効率を評価する新たな枠組みを提示した。","methods":["統計的検定","時系列解析","指標開発"],"themes":["選手評価","走塁・盗塁","ポジショニング"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年,サッカーにおけるパフォーマンス分析は,イベントデータに加えてトラッキングデータの活用が進み,選手の試合中の移動や行動を定量的に評価する研究が盛んに行われている.特に,選手がピッチ上でどのように空間を利用し,どのような移動戦略を取っているのかを明らかにすることは,戦術理解や選手評価の高度化において重要な課題である.しかし,従来の走行距離やスプリント回数といった指標では,移動の質や探索行動の特徴を十分に捉えられているとは言い難い.そこで本研究では,生物や人間の探索行動にみられる歩行パターンであるレヴィウォークに着目する.レヴィウォークはランダムウォークの一種であり,直線ステップ長 l の出現頻度がべき分布 p(l)~l−μ, 1 < μ < 3 に従う.レヴィウォークは,短距離移動が多く出現する一方で,時折非常に長い距離の直線移動が観測されるという特徴を持ち,餌や獲物を効率的に探索する生物の行動パターンとして注目されてきた[1, 2].これは同じくランダムウォークの一種であり,ステップ長の出現頻度が指数分布p(l)~e−λlに従うブラウニアンウォークと対照的である.近年では,このような探索行動モデルをスポーツ領域の分析へ応用する試みが行われており,サッカー選手の移動にもレヴィウォーク的特徴が見られる可能性が示唆されている[3].サッカーにおいて選手はボールの有無や戦術的状況に応じて,局所的な移動と広範囲への移動を使い分けており,これは探索行動として捉えることができる.本研究では,23–24 シーズンおよび 24–25 シーズンの計 90 試合のトラッキングデータを用い,全ポジションの選手を対象に走行パターンの観点から分析を行った.具体的には,第一に,各選手を走行パターンによってレヴィウォーク群とブラウンウォーク群に分類し,ポジションごとの割合について分析した.第二に,ドリブル成功率やインターセプト数などの特徴量に関して二群の差異を統計的に検証し,サッカー選手の移動行動を新たな視点から定量的に評価した.","excerpt_src":"序論"},{"id":"2025_soccera_1_104","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるプレスの評価方法に関する研究","members":"渡辺健矢，森田裕之(大阪公立大学)","first_author":"渡辺健矢","affiliation":"大阪公立大学","code":"P2-18","abstract":"本研究はプレス強度の算出方法の妥当性を検証し、複数の選手によるプレスを定量的に評価する手法を提案した。既存の前方距離係数と新たな係数を比較し、判別性能とプレス場面保持のバランスが最適な係数を特定し、さらに守備者が形成する三角形構造に着目してプレスの成否との関係を明らかにした。","methods":["指標開発","統計的検定","可視化"],"themes":["プレッシング","戦術分析","チーム評価"],"data":["トラッキングデータ"],"free_tags":["プレス強度","ピッチコントロール"],"awards":[],"text_insufficient":false,"excerpt":"サッカーには様々な戦術が存在しており,戦術の変遷や流行は時代ごとに変化してきた.中でもチームで目的をもって戦術的に実行するプレスは重要であり,選手の行動データから分析する研究は興味深い 1 つのテーマである.選手の行動データを利用してプレスを解析しようとする研究の主眼は「プレスの定義」と「プレスの評価」の 2 つにあると考えられる.プレスの定義に関しては,ボール保持者に接近してボールを奪おうとする行為自体は試合のあらゆる場面で頻繁に見られるものであるが, 「ボールに対してどの程度の距離に接近した場合にプレスと定義できるのか」というような明確なプレスの定義が存在しないため,それを明確化する必要がある.またプレスの評価に関しては,プレスが直接的なボール奪取に結びつかなかった場合であっても,それが必ずしも失敗とは限らず,その後の相手のプレーに制約を与えている場合や攻撃の方向を限定させるなど,間接的に影響を与えている場面が数多く存在する.そのため,プレスの結果を直接的な成功と失敗で単純に評価するだけでは不十分な場合があり,その効果や意義をどのように評価すべきかが問題である.後述の先行研究では,プレス強度の数値化が行われているがその算出方法の妥当性は全てにおいて必ずしも明確ではない.加えて既存研究では,最も強力と思われる単一の選手がボール保持者に接近した場合のプレスの強度を主として計算しているが,実際には複数の選手がボール保持者に対してプレスをかける場合もあり,そのような場合についても考慮する必要があると考えられる.本研究では,プレス強度の算出方法の妥当性を検証し,複数の選手によるプレスに着目する.","excerpt_src":"はじめに"},{"id":"2025_chikoku_soccer_2_yoshida","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"セカンドボール奪取位置と前後のプレー局面に関する分析","members":"吉田夏碧，木﨑瑠泉，榎屋美帆，安部純奈，鈴木葉南，河合孝純(東京都市大学)","first_author":"吉田夏碧","affiliation":"東京都市大学","code":"P2-19","abstract":"J1リーグ2023シーズンのセカンドボール奪取2984件を多角的に分析し、発生位置、周囲人数、奪取後のプレーを検証した。身体的特徴より位置取りと状況予測が重要であり、周囲人数1人程度の状況で最高のパス成功率が得られることを実証した。","methods":["空間分析","統計的検定","可視化"],"themes":["守備","トランジション","戦術分析","ポジショニング"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおけるセカンドボール(こぼれ球)奪取は,攻撃の起点や守備の継続のみならず,現代サッカーで重要な戦術的優位性を獲得する上でも不可欠である。ロングボールやプレス回避,カウンター抑止など,さまざまな局面で「セカンドボールを制するチームが試合を制す」と言われるほど影響が大きい[1, 3]。先行研究では,Barreira ら[1] がエリートクラブを対象に,どのようなボール奪取パターンが得点機会の創出につながるかを分析し,直接的なボール奪取が攻撃効果を高めることを示した。Fernandes ら[2] は守備側の戦術的文脈に着目し,ゾーンや守備ブロックの高さとボール回収の関係を定量化している。さらに村井ら[3] は,J リーグ公式戦における「チーム最後尾位置」がポゼッション転換の成功率に与える影響を検証し,ボール奪取が個々の競り合いだけでなくチーム全体の構造と密接に結びついた現象であることを示した。一方で,これらの研究では,こぼれ球が「どのようなプレー局面やピッチ位置で生じるのか」,「奪取時に選手の周囲にどの程度の密集があるのか」,「奪取直後の初手パスがどの程度成功しているのか」といった点は十分に定量化されていない。また,身体的特徴や周囲人数とこぼれ球奪取・パス成功の関係を,日本のトップリーグ全体を対象に十分な検証は行われていない。そこで本研究では,J リーグ2023 シーズンの一部節における全試合を対象として,こぼれ球奪取イベントを抽出し,直前のプレー局面・奪取位置・周囲人数・奪取後のプレーを定量的に分析する。これにより,セカンドボール成立の構造とその後の攻撃展開に関する特徴を明らかにし,トレーニングや戦術設計に資する知見を得ることを目的とする。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_109","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"隠れマルコフモデルを用いた試合パターンの分類と分析","members":"前山工(青山学院大学)，王方成，染谷大河，亀﨑允啓(東京大学)","first_author":"前山工","affiliation":"青山学院大学","code":"P2-20","abstract":"本研究はExpected Possession Value の時系列データに隠れマルコフモデルを適用し、サッカーの試合展開を定量的に分類・評価する枠組みを提案した。試合パターンの質的変容を捉え、攻守の流れをより体系的に記述する新たな分析方法を示した。","methods":["隠れマルコフモデル","機械学習","時系列解析"],"themes":["試合の流れ","戦術分析","トランジション"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["EPV","Expected Possession Value"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおける試合展開の分析手法として、隠れマルコフモデル(HMM)を用いてモメンタムを推定する研究が報告されている[3]。これらの研究は、潜在状態の推移からチームの優勢・劣勢を表現しているものの、具体的な価値指標の時系列データを直接扱う枠組みにはなっていない。本研究では、攻撃の価値を定量化するExpected Pos- session Value(EPV)を時系列指標として用い、これにHMM を適用することで、試合の流れをより定量的かつ体系的に評価する手法を提案する。EPV の動態と潜在状態の推移を統合的に解析することで、従来手法では捉えにくかった試合パターンの特徴づけを可能にする点に本研究の意義がある。","excerpt_src":"導入"},{"id":"2025_soccera_1_112","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"予測誤差分散分解を用いたチーム間の構造的優位の定量化","members":"白石雄太郎，大西諒，亀﨑允啓(東京大学)","first_author":"白石雄太郎","affiliation":"東京大学","code":"P2-21","abstract":"本研究はベクトル自己回帰モデルと予測誤差分散分解を組み合わせ、チーム構造が相手チームに与える影響を定量化する新指標 dominance を提案した。ボール保持率とは相補的な情報を提供し、試合の構造的優位性をより多角的に評価する枠組みを構築した。","methods":["因果推論","機械学習"],"themes":["チーム評価","試合の流れ","戦術分析"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["dominance","FEVD"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて試合の流れを把握することは、戦術的判断や試合中のコーチングにおいて極めて重要である。どの時間帯でどちらのチームが優勢であるかを適切に判断することは、リアルタイムでの選手への指示のみならず、選手交代やフォーメーション変更といったピッチサイドでの意思決定に直結する。近年では試合データの高度な分析が進み、このようなリアルタイムで現場のコーチングを支援する分析手法の重要性も高まっている。従来、こうした優位性の判断は、ボール保持率や敵陣地内でのプレー割合といった攻守を判断する指標を中心に行われてきた。これらの指標は直感的で分かりやすく、一般的なスポーツ報道から高度な分析サービスに至るまで広く用いられている。しかし、実際の試合ではボールを保持し、相手陣地に押し込んでいるにもかかわらず、得点期待値の高い攻撃に結びつかない場面が少なくない。逆に、ボール保持率が低くても効果的なカウンターから決定機を多く作るといった試合展開も存在する。つまり、ボール保持量は優勢の十分条件とはいえず、攻守の構造的な優劣を必ずしも正確に反映しないという問題がある。このような背景から、本研究では「相手陣形をどの程度制御できているか」という観点に基づく新たな評価軸を導入する。本研究の目的は、既存のボール保持中心の評価指標を置き換えることではなく、それらに欠けた観点を導入し、補完する指標を構築することにある。選手同士の距離関係や守備網の乱れといった、ボール保持とは独立した位置的・構造的情報を取り入れることで、従来の指標では見落とされてきた優位性の一側面を捉えることを目指す。この観点からの定量的分析は、現場のコーチングや分析の場において必ずしも実践できているとは言い難い。従来のゲーム分析では、ボール保持量やパス数、攻撃回数といったイベントベースの指標が主に用いられており、選手配置に着目して「相手陣形をどの程度制御できているか」を定量化する指標はまだ限られている。学術研究においても、トラッキングデータに基づく流れの定量的評価が近年注目を集めつつあるものの,統一的な評価軸は確立途上であり、実際の試合データを用いた体系的な検証は十分に蓄積されていない。特に、チーム構造やその相互作用を空間的観点から分析する研究は少なく、スモールサイドゲームにおいてピッチサイズが選手間距離や相互作用パターンに影響を与えることを示したFrencken らの研究[1] が代表的である程度である。すなわち、試合全体の流れや優位性を選手配置に基づいて双方向的に定量化する指標は依然として十分に検討されておらず、本研究での提案指標はこのギャップを埋めることを試みる。本研究では、選手の位置情報に基づき、相手チームに対する構造的優位性を計量化する指標としてdominance を新たに提案する。そして、この指標が実際の試合における優勢の評価にどの程度寄与するかを多角的に検証する。具体的には、(1)dominance のシュートイベントへの予測精度を検証し、優位性を代表する指標として整合的であるか確認する。(2)一試合を取り上げ、時間経過とともにdominance がどのように変動するかを可視化し、具体的にどのようなことを明らかにできるのかを把握する。これらの分析を通じて、本指標がボール保持だけでは捉えきれない試合の構造的な優位性を補完的に示すものであることを明らかにすることを目的とする。本研究の成果は、試合後の分析だけでなく、将来的にはリアルタイムのコーチング支援にも応用可能な評価軸を提供するものであり、現場と研究の双方において有用な貢献となることが期待される。","excerpt_src":"導入"},{"id":"2025_soccera_1_117","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"シュート場面における空間支配率と時系列変化:ボロノイ図を用いた可視化と評価","members":"髙山拓己，郡山翔也，和田智仁，今泉拓(鹿屋体育大学)","first_author":"髙山拓己","affiliation":"鹿屋体育大学","code":"P2-22","abstract":"本研究はボロノイ図を応用してシュート場面の攻守の空間支配率を可視化・定量化した。シュート成功と失敗を比較し、特にシュート7秒前の空間支配率の重要性と、シュート直前の支配率変化パターンがゴール達成に与える影響を明らかにした。","methods":["可視化","空間分析"],"themes":["シュート","得点予測"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["ボロノイ図","アタッキングサード"],"awards":[],"text_insufficient":false,"excerpt":"サッカーでは相手より多くの得点を奪い勝利を目指す。そのために、より多くのシュート局面を作り出すことが必要である。シュートの試行回数や成功数(すなわち総得点)、これらの比率といった基本的な統計値はよく目にすることができる。しかしながらこれらの数値からはシュートが起きた状況や背景までは読み取ることができない。それぞれのシュート局面に焦点を当て、攻撃側と守備側の状況が優位・劣勢であったかを可視化し評価することができれば戦術の分析や立案に有益であると考えられる。これらの評価について、近年のサッカーでは xG (ーール期待値 :Expected Goal) という指標が用いられることがある。xG は、シュートが成功する期待値を 0 から 1 の確率で表すものである。企業や媒体によって算出に使用されるデータは異なるものの、概ねシュートした選手の位置や姿勢、守備選手の位置をもとに計算されている。xGは J リーグの中継でも利用されるなど、シュートの有効性を示すうえで有効な指標である。ただし、以下の 2 つの観点から拡張可能性が残されている。1 つはシュートに関わる選手以外を考慮することである。サッカーではボールに関わらない(いわゆるオフザボール)の動きも重要とされており、これらを評価することもシュート評価において重要であると考えられる。2 つ目はシュートの背景、つまりシュートにつながるまでの局面も考慮することである。これらの 2 つの拡張可能性を検討する上で、Liverpool FC (以下、リバプール)で開発された、Pitch Controlという確率モデルが参考になる [1]。 これはボールに最も距離が近い選手がボールをコントロールできるという考え方で、ボロノイ分割を使って戦局を可視化していると伝えられている。しかし、具体的な評価手法が一般に公開されておらず、利用することはできない。 そこで本研究では、シュート局面の空間支配率に関してボロノイ図を用いた可視化と評価手法を開発する。1.2 目的と仮説シュート局面に至るまで、攻撃側と守備側の空間支配の状況は常時変化する。攻撃側はシュートに向けて徐々に空間支配率を大きくし、逆に守備側は敵の攻勢を防げない場合に支配率を小さくしていることが予想される。この根拠として 「幅を取る」 や 「深さを取る」 といったサッカー用語が挙げられる。この用語は攻撃選手が幅(サイド)や深さ(攻撃方向)の空間を支配することの重要性を示唆しており、攻撃側が空間支配率を高めることでシュートが決まりやすい状況につながることが推察される。したがって、シュートの瞬間のみではなく、シュートに至る過程を可視化することで、攻守の評価が可能になるのではないかと考えた。1.3 空間支配率の算出空間支配率は、選手のトラッキングデータを用い、隣り合う 2 選手の距離が等しくなる線で分割するボロノイ図を用いて可視化を行い、その領域の面積から算出する。事前の検証の結果、フィールド全体を対象とした空間支配率では、戦局の評価が難しくなることが予想された。そこで本研究では、シュートを終端とした最終局面が展開されるアタッキングサードに着目し、この領域での空間支配率を分析の対象とする。","excerpt_src":"はじめに"},{"id":"2025_soccera_1_86","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"最終ラインにおける守備選手の意図推定のための方策勾配を用いた逆強化学習","members":"Soujanya Dash，井出憲次朗，梅基陸平(名古屋大学)，染谷大河(東京大学)，川口康平(香港科技大学)，藤井慶輔(名古屋大学)","first_author":"Soujanya Dash","affiliation":"名古屋大学","code":"[口頭]サッカー1","abstract":"サッカーの最終ライン守備における選手の潜在的な評価基準を推定するため、Behavior Cloning と勾配ベースの逆強化学習（GIRL）を組み合わせた手法を提案した。4つの構造的報酬特徴量を定義し、選手が暗黙のうちに最大化している報酬構造を推定することで、従来の結果ベース評価では捉えられない「守備意図」を定量化した。J リーグの実試合データにおいて、チームごとの守備哲学の差異を明らかにした。","methods":["逆強化学習","機械学習","深層学習","統計的検定"],"themes":["守備","ポジショニング","戦術分析","チーム評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":["サッカー部門 入賞"],"text_insufficient":false,"excerpt":"サッカーにおける守備者の微細なポジショニング行動(例えば,最終ラインの守備の連携)の背後にある意図を理解することは,コーチやアナリストにとって重要である。これまで,サッカーのデータ駆動型戦術分析に関する先行研究では,ルールベースの空間指標(ボロノイ図に基づく空間評価,コンパクトネス指標など)[1] や数理モデルに基づくスペース評価による指標[6],機械学習(教師あり分類)に基づく予測ベースの評価指標[5] などが用いられてきた。しかし,これらのアプローチでは,選手がプレー中に暗黙のうちに持っている潜在的な「評価基準」を直接的に表現しているわけではない。深層強化学習[2] は事前に定めた報酬関数(評価基準)を用いて最適な行動を計算できるが,データから報酬関数を推定するためには逆強化学習の枠組みが必要である。そこで本研究では,最終ライン守備の意図推定のための方策勾配を用いた逆強化学習手法を提案する。逆強化学習の中でも,サッカーのような大きな連続状態空間を直接扱える方策勾配を用いた逆強化学習(GIRL: Gradient Inverse Reinforcement Learning)[3] は,観測データから学習したBehavior Cloning モデルに対して,ある報酬の下での方策勾配が0 に近づくような報酬重みの組合せを最適化により探索することで,選手が暗黙のうちに持っている評価基準を推定する手法である。サッカーに勾配ベースの逆強化学習を適用した先行研究[4] は存在するが,この研究ではイベントデータの時系列を用いてチームを1 つのエージェントとモデル化しており,最終ラインの守備連携のような評価が難しい。本研究では,最終ラインの守備選手を複数エージェントとしてモデル化して,先行研究[2] に基づき連続状態を入力して離散行動を出力するBehavior Cloning により方策の勾配を計算する。次に,評価したい守備の観点を表現する報酬特徴を定義し,報酬特徴の重みを少し変えたときに軌道全体の報酬(報酬特徴の線形結合)がどの方向にどれだけ変化するかを表すヤコビアンを計算する。このヤコビアンが0 に近づくような報酬重みベクトルを最適化問題として解くことで,観測された守備行動と最も整合的な報酬特徴の重みを推定する。本研究の貢献は以下の通りである。(1) サッカーにおける選手の動きの意図を推定するためのマルチエージェントのBehavior Cloning と勾配ベース逆強化学習を組み合わせた新しい枠組みを提示した点。(2) 守備連携やラインコントロールなどの守備的観点を表現する報酬特徴の重みを推定し,従来の空間指標だけでは捉えにくかった最終ラインDF の評価を定量的かつ解釈可能な形で行えるようにした点。(3) J リーグのトラッキングデータおよびイベントデータに本手法を適用し,実試合の守備場面を対象とした数値実験を通じてその有用性と妥当性を検証した点である。","excerpt_src":"導入"},{"id":"2025_soccera_1_38","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"特徴量逆生成を用いたLLM説明文の誤り検出と質向上","members":"木山輝，尼崎太樹(熊本大学)","first_author":"木山輝","affiliation":"熊本大学","code":"[口頭]サッカー2","abstract":"スポーツ分析の結果を大規模言語モデル (LLM) で自然言語の説明文として自動生成し、特徴量逆生成により説明文の誤りを検出して質を高める手法を提案した。パスの受け手予測を題材に、数値や図表の羅列にとどまらない現場に伝わる分析説明の実現を目指した。","methods":["LLM活用","自然言語処理","機械学習"],"themes":["戦術分析","パス"],"data":["トラッキングデータ"],"free_tags":[],"awards":["サッカー部門 入賞"],"text_insufficient":true,"note":"PDFフォント破損のため要旨は断片からの再構成 (要原稿確認)","excerpt":"","excerpt_src":null},{"id":"2025_soccera_1_111","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"アクティブマター物理学を用いたハイプレスの連動性の定量化","members":"水上徳啓，王方成，染谷大河，亀﨑允啓(東京大学)","first_author":"水上徳啓","affiliation":"東京大学","code":"[口頭]サッカー3","abstract":"本研究はアクティブマター物理学の知見を応用してハイプレスの選手間連動性を定量化した。秩序パラメータ・占有面積・平均最近傍距離といった複数の指標を導入し、チーム全体の有機的な連動がプレスの効果にいかに寄与するかを明らかにした。","methods":["シミュレーション","指標開発","統計的検定"],"themes":["プレッシング","ポジショニング","チーム評価"],"data":["トラッキングデータ"],"free_tags":["秩序パラメータ","PPDA"],"awards":["サッカー部門 入賞"],"text_insufficient":false,"excerpt":"現代サッカーにおいて、ハイプレスは守備戦術の一つとして多くのチームに採用されている。相手チームのビルドアップを阻害し、アタッキングサードにおいてボールを奪取するためには、高い身体能力に加え、チーム全体が有機的に連動する高度な組織力が不可欠である。従来、このようなハイプレスの評価指標には、ボール奪取回数やPPDA(Passes Allowed per Defensive Action)[1]といった指標が用いられてきた。近年ではトラッキング技術の進展により、全選手の座標や速度ベクトルといった詳細な時空間データが取得可能になっている。しかし、現状では依然としてハイプレスの成否のみに着目した指標に偏重しており、ハイプレスにおいて組織的な連動性がどのようにその結果をもたらしたのかを明らかにする決定的な枠組みは未だ確立されていない。この課題に対し、主に統計物理学の分野で発展してきたアクティブマターの知見は、極めて有効な示唆を与える。アクティブマターとは、鳥の群れや魚群のように、構成要素が自らエネルギーを消費して駆動し、相互作用を通じて大規模な集団運動を創発する系を指す。同様に、ハイプレスの局面における選手たちも、ボール・自チーム・相手チームとの相対的な位置や速度に基づいて判断を下し、集団として自己組織化している系であると見做せる。本研究では、サッカーの試合におけるハイプレスの局面における選手の連動を、相互作用する自己駆動粒子群の集団運動として捉え直す。実際の試合データからハイプレスの成否と組織的な連動性の相関関係を検証する。結論として、本研究で新たに提示する評価指標が、従来の評価指標とは異なる視点から守備戦術を記述する、新たな定量的評価の枠組みとなることを示す。","excerpt_src":"導入"},{"id":"2025_soccera_1_37","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"パスの到着予想時間差とパス速度を用いた攻撃スイッチ検出の構築と評価","members":"益留琢磨，八木翔摩，市川淳，一ノ瀬元喜(静岡大学)","first_author":"益留琢磨","affiliation":"静岡大学","code":"[口頭]サッカー4","abstract":"パスの受け手と守備者のパス位置への到達予想時間差（TTA）とボール速度を統合した「スイッチスコア」を提案。試合中に攻撃が一気に活性化する
