ムの特徴として主力選手が30 代以上のベテランが多く,チームの高齢化が進んでいることが挙げられ,年齢から連戦の疲れが出やすく気温の高い6 月以降に失速するのではないか,という仮説から年齢・気温などの要因からパフォーマンスに影響すると考えられる.また,巨人吉川選手が身体の負担軽減のため高速バスから新幹線へ移動手段を変えるなど,選手間でも移動等でかかる負担がコンディションに影響を及ぼすと考えられていることから,移動に関する要因も選手のパフォーマンスに影響すると考えられる.本研究では以上の要因から機械学習を用いて気象条件や選手の移動,出場状況などコンディションに関する変数を特徴量とした解析を行い,起用法の支援を試みる.","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_17","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"ニューラルネットワークを用いた日本プロ野球の試合における打者と投手の対戦結果予測及び要因分析","members":"中村颯真，福嶋克茂，宮川大樹，一ノ瀬元喜(静岡大学)","first_author":"中村颯真","affiliation":"静岡大学","code":"[口頭]野球4","abstract":"2020-2021年の117,619打席を対象にニューラルネットワークで対戦結果を予測し、SHAP分析で要因を検証した。犠打予測で高精度を実現し、試合戦略の決定支援への活用可能性を示した。","methods":["ニューラルネットワーク","深層学習","SHAP・説明可能AI"],"themes":["得点予測","戦術分析","選手起用"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年の野球界では,データ取得技術の発展によって多くのデータが得られるようになり,データ分析も盛んに行われている.例えばMLB(メジャーリーグ)では,球速・回転量などの投球情報や,打球速度・打球角度などの打球情報といったデータが,1 球あたり約90 種類も測定されている.Silver とHuffman らは,MLB におけるそれらの大量のデータを効果的に利用するために,ニューラルネットワーク(NN)を用いて,打者と投手の対戦結果を予測するモデルを構築し,その有効性を示した[1].また,KBO (韓国プロ野球)においては,Doo とKim らが階層ベイズという手法を用いて,打者と投手の対戦における打者の出塁率を予測する研究を行っている[2].こういった研究が行われているように,打者と投手の対戦結果は,代打や犠打といった野球の試合における戦略の大部分に影響を与えるものであり,戦略の決定においても重要な要因である.しかし,日本プロ野球においては,投球予測[3] や打球予測[4] を行った研究はあるが,打者と投手の対戦結果予測を行う研究はない.そこで,本研究では日本のプロ野球リーグを対象として, NN を用いた打者と投手の対戦結果予測を行い,その他の予測モデルと予測精度を比較する.またShapley 値を用いて,NN による予測の要因についての検証も行う.","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_25","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"野球における投球間隔の有効性に関する研究","members":"松永幸哉，鈴木秀男(慶應義塾大学)","first_author":"松永幸哉","affiliation":"慶應義塾大学","code":"[口頭]野球5","abstract":"傾向スコアによる逆確率加重推定法を用いて、投球間隔を長くすることが打者を抑える効果を検証した。投球間隔を長くすることは打撃成績を低下させるが、ランナー状況によって効果が異なり、特に2.3塁や満塁での有効性が高いことが明らかになった。","methods":["因果推論","ロジスティック回帰","統計的検定"],"themes":["投球・配球","戦術分析","勝敗要因"],"data":["イベントデータ"],"free_tags":[],"awards":["野球部門 学部生奨励賞"],"text_insufficient":false,"excerpt":"野球はしばしば「間のスポーツ」と呼ばれ,投球間隔を制御することは勝負の駆け引きとして重要視されてきた.しかし,投球間隔は投手の感覚や経験に頼ることが多く,明確な根拠もなく制御している現状がある.また,近年は試合時間の短縮化のため,投球間隔を強制的に短くする方向に世論が動いている.投球間隔を制御することによる打撃結果への効果を明らかにすれば,科学的裏付けのある「意味のある投球間隔のとり方」が明らかになる可能性がある.そこで本研究では,投球間隔を長くすることが打者を抑えるために有効であるのか,またランナーをけん制する意味で有効であるのかの分析を傾向スコアによる IPW 推定法を用いて行った.","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_65","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"野球におけるLSTMとLightGBMを用いた時間変化と試合状況に基づく試合時間予測","members":"小森一輝，久保幸平，高井優吾，宿久洋(同志社大学)","first_author":"小森一輝","affiliation":"同志社大学","code":"[口頭]野球6","abstract":"LSTMとLightGBMを組み合わせて試合終了時刻の予測モデルを構築した。イニングごとの経過時間と試合状況から予測したモデルは、全体の70%の試合で誤差20分以内の高精度予測を実現し、観客帰宅や番組編成への応用が期待できる。","methods":["深層学習","ニューラルネットワーク","時系列解析"],"themes":["試合の流れ","勝敗要因","チーム評価"],"data":["イベントデータ"],"free_tags":[],"awards":["野球部門 優秀賞"],"text_insufficient":false,"excerpt":"スポーツは, 試合終了時刻が規定されている時間制スポーツと試合終了時刻が規定されていない非時間制スポーツに分けられる. 時間制スポーツとして, サッカー(90 分),ラグビー(80 分)などが挙げられ, 非時間制スポーツとして, 野球, テニス, ゴルフなどが挙げられる. 試合時間は, 競技の特性を最大限に生かすために設定されているものあり, 両者のどちらが適切であるという訳ではない. その設定された時間内で, 選手は白熱した試合を作り, 観客はその試合を楽しむのである.しかし, 試合後の混雑緩和という観点で両者には大きな差がある. 福間ら(2022) は, スポーツイベントにおける行動分析から帰宅時の観客数は試合終了後の36 分間に7 割以上減少することを明らかにしている. 多くの観客が短時間で帰宅を行う中で, 試合終了時刻が明らかな時間制スポーツであれば, 電車の臨時便を増やすといった対策を講じることが可能である. 一方で, 非時間制スポーツにおいては, 終了時刻を特定できないことから観客帰宅時の対策を講じることは難しい. 新型コロナウイルスの感染拡大に伴い, 三密を避けた行動が求められる中で, 非時間制スポーツの試合後の混雑緩和は重要な課題であるといえる.また, 試合終了時刻を特定できないことは, テレビやラジオなどのメディアにも影響を与える. 2022 年の日本シリーズにおいても試合時間が長引き後続番組の放送時間が大幅に遅れた. 放送時間が遅れたことで目的とする番組の録画ができないといった苦情が殺到する事態となった. しかし,事前に試合終了時刻を推定することができれば, 番組編成を余裕もって修正することができる.そこで本研究では, 試合の時間変化や試合状況に着目し,機械学習を用いて野球における正確な試合終了時刻を予測する.本研究は、以下の流れで行う. 1. 基礎分析により試合終了時刻について基礎集計を行う. 2. 試合の時間変化に基づく試合終了時刻の予測を行う.","excerpt_src":"はじめに"},{"id":"2021_espoa_1_22","year":2021,"dept":"eスポーツ部門","dept_detail":"esports部門","title":"各試合の結果に基づくぷよぷよ選手のクラスタリングに関する検討","members":"樋口恭介，塘由惟(東京大学)","first_author":"樋口恭介","affiliation":"東京大学","code":"P1-19","abstract":"プロぷよぷよ選手の勝敗データを基に階層クラスター分析を行い、4つのクラスターに分類した。連鎖数やスコアはクラスター間で大きな差は見られず、プレイスタイルの異なりより個人の総合的な力量が勝敗に大きく寄与することが示された。","methods":["クラスタリング"],"themes":["選手評価","選手起用","勝敗要因"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"ぷよぷよは,コンパイルにより開発され,現在はセガより発売されている落ち物パズルゲームである.ぷよぷよはe スポーツとしての側面をもち,2021 年11 月現在,プロ選手名鑑には32 人の選手が登録されている[1].近年,プロ選手の特徴を表現する5 次元の量として,スタッツとよばれる指標が開発された.スタッツは,プロ選手同士による2000 ゲーム以上の内容の分析に基づく指標であり,最大火力,見切り力,早期決着力,本線発火率,セカンド効率の項目から成る[2].スタッツでは,各選手ごとの戦い方の特徴が考慮されているものの,選手間の相性に紐づく相対的な特性はほとんど可視化されていない.選手間の相性に基づいた特徴づけを行うことができれば,既存のスタッツで表現される枠組みを越え,とりうる戦略間の相性など,より高度な考察を行うことができるようになると考えられる.そこで本研究では,プロ選手同士によるゲームの勝敗の結果を基に選手のクラスタリングを行い,選手間の相性に基づいた特徴づけができる可能性について検討した.","excerpt_src":"はじめに"},{"id":"2021_espoa_1_30","year":2021,"dept":"eスポーツ部門","dept_detail":"esports部門","title":"時系列クラスタリングを用いた環境戦術考察とメタ戦術の提案","members":"土屋建翔，澤井荘一郎，大平悠介，伴地芳啓，三家礼子(早稲田大学)","first_author":"土屋建翔","affiliation":"早稲田大学","code":"P1-21","abstract":"ぷよぷよプロ選手の盤面状況を時系列データとしてクラスタリングすることで、現在の環境戦術を明らかにした。勝試合では中盤以降に連鎖を発生させているのに対し、負け試合では連鎖が発生していないことから、対抗戦術としてお邪魔ぷよの投入タイミングを提案した。","methods":["時系列解析","クラスタリング","可視化"],"themes":["戦術分析","試合の流れ","勝敗要因"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"e-sportsとは, 電子機器を用いゲームの対戦で競う新たなスポーツである. 従来の身体を用いるようなスポーツとは一線を画しているが, その中でも注目すべき異なる点が1つ存在する. それは, ゲームのルールが細かい頻度で調整され, 調整される度にそのルールに適した強い戦術(以降「環境戦術」と呼ぶ)がうまれることである. また環境戦術に併せて, 環境戦術に対抗するような「メタ戦術」というものがうまれる. このように, 流行りの戦術に対抗する新しい戦術がうまれることで, 様々な戦術がうまれ, 深い読み合いをプレイヤー自身も観戦者も楽しむことができる.本稿では, 「ぷよぷよ」と呼ばれるゲームにおける,現在の環境戦術を, 時系列クラスタリングを用いた盤面遷移状況を分析することで明らかにし, そのメタ戦術を考察することで, ぷよぷよがより戦術の読み合いが必要なゲームになり, プレイヤーも観戦者も楽しめるようなものになることを目的とする.","excerpt_src":"はじめに"},{"id":"2021_espoa_1_62","year":2021,"dept":"eスポーツ部門","dept_detail":"esports部門","title":"各選手のプレースタイルを求める","members":"渡辺大智，市川晴樹，高谷芳樹，中島梢吾，姫野哲人(滋賀大学)","first_author":"渡辺大智","affiliation":"滋賀大学","code":"P1-23","abstract":"ぷよぷよのプロ選手のプレースタイルを定量的に評価するため、初連鎖時間・平均連鎖数・ゲーム終了時間・全消し率・安定度の5つの指標を設定した。主成分分析により、選手を速攻型と大連鎖型に分類し、レーダーチャートで可視化した。この指標により、観戦者が各選手の特徴を簡単に把握できるようになる。","methods":["指標開発","次元削減","可視化"],"themes":["選手評価"],"data":["イベントデータ"],"free_tags":["ぷよぷよ","プレースタイル分類"],"awards":[],"text_insufficient":false,"excerpt":"「ぷよぷよ」は、テトリスと並ぶ知名度を持つ「落ちモノパズルゲーム」の一つであるが、esports としての「ぷよぷよ」の現在の課題は、スポーツ競技としてまだまだマイナーであるという点が挙げられる。このことを踏まえ、本報告の目的はesports としての「ぷよぷよ」を初めて観戦する人が、もっと気軽に興味を持ってくれる方法を提案することである。そして今回、新規の観戦客の獲得を目標として選手1 人 1 人の各種ステータスの可視化を提案した。選手のステータスを確認できるということは、試合観戦における視野が広がり、esports としての「ぷよぷよ」の奥深さや面白さが少しでも伝わり、観戦客の興味へとつながると考えられる。","excerpt_src":"はじめに"},{"id":"2021_espoa_1_3","year":2021,"dept":"eスポーツ部門","dept_detail":"esports部門","title":"ぷよぷよ競技初心者を対象にした積み込み上達支援AIの開発","members":"伊藤大輝，廣澤聖士(慶應義塾大学)","first_author":"伊藤大輝","affiliation":"慶應義塾大学","code":"[口頭]esports1","abstract":"ぷよぷよの競技初心者向け上達支援AIを開発した。複数のプロ選手のプレーデータから学習し、次のぷよの最適な置き場所を提案するシステムを構築した。Top-5精度で64.5%の精度を達成し、プロの個性を反映した積み込みが可能になった。","methods":["深層学習","ニューラルネットワーク","機械学習"],"themes":["育成・指導","選手起用"],"data":["イベントデータ"],"free_tags":[],"awards":["eスポーツ部門 最優秀賞"],"text_insufficient":false,"excerpt":"ぷよぷよは国民的アクションパズルゲームであるが、2018 年にe スポーツ専用タイトルである「ぷよぷよe スポーツ」が発売され、より競技種目としての認知が高まっている。競技者は大きな連鎖を行うための「積み込み」を行いながら、相手の盤面を「凝視」し「発火」のタイミングを伺うなど複合的な要素が絡み合うなかで即座に意思決定を行っている。このような状況の中、競技初心者がプロの試合を見るだけで上達するのは容易ではない。初心者がまず取り組むべきは、連鎖のためのぷよ積み込みを出来るようにすることだと考える。大きな連鎖がつながっていく爽快感はゲームの楽しさに直結し、かつ大連鎖はぷよぷよの上達には欠かせない要素であるためである。しかし、実際のプレーに対してフィードバックをすることで上達を目指す教育コンテンツはそう多くない。1.2目的本研究では実際のプロの試合のデータを用いて、プロらしい積み込みを学ぶことができる教育コンテンツとなる、「ぷよぷよ競技積み込み補助AI」を開発することを目的とした。本AI の最大の特徴は、初心者が尊敬する、参考にしたいプロのプレーを模倣するAI に「次のぷよをどこに置くべきか」を聞くことができる点である。図1 では、プロプレイヤー全体から学習したプロぷよらーAI と飛車ちゅう選手のログからのみ学習したAI の積み込みの例を示した。飛車ちゅう選手は、プロで唯一の階段積みを使いこなす。プロぷよらーAI はGTR という広く用いられる土台を組んでいるのに対し、飛車ちゅうAI では階段積みをしていることから、AI はそのプロのログを参考にした積み込みをしていることがわかる。プレーログから学習することでAI は人間らしい積み込みをし、超人的なプレーをしなくなることが期待される。図1 AI が出力した結果の様子。全プロのデータから学習したAI ではGTR を組んでいる様子が確認された。GTR はぷよぷよの定石の1 つで非常に安定感のある積み方であり、広く使われている。一方で、飛車ちゅう選手はプロでは珍しい階段積みを使いこなす選手である。飛車ちゅうAI では実際に階段積みをしていることが確認できる。1.3関連研究ぷよぷよではゲームに標準実装されているCPU 含めいくつかの種類のAI があるが、上達支援用のAI を作る上で重要なことは実際のプレイログから学習することであると考える。アルゴリズムを人力で組み上げる方法でも一定の強さは実現できるが、その積み込みには人間らしさがなく、初心者がそのプレーを参考にするという目的を果たすのは難しい。プレイログから取り組んだ例として、添島ら[1] は深層学習を用いたぷよぷよAI の開発を行っている。12 ×6 のぷよぷよの盤面の大きさに対応した配列に、盤面の各色の位置、現在・次・次の次に置くぷよ、空白の位置の29 チャネルの特徴量を付与したものをConvolutional Neural Network(CNN) に入力、プレイヤーが取りうる22種類(図3) の置き方の中から上級者が取った行動を予測するモデルを提案している。しかし、ぷよぷよの性質を考慮しきれておらず、以下の問題点があると思われる。図2モデルの全体図。C は入力の次元数を示し、5 色のぷよ+ おじゃま+ 背景でC=7 が基本となる。図3プレイヤーの取りうる行動の選択肢• 盤面と次のぷよを画像的に重ねて入力されているが、重ねるだけでは次のぷよが上から落ちてくることを表現できていない。• 上級者が取った行動のみを正解とし、取らなかった行動を一律不正解としているが一律に不正解かどうかは検討の余地がある。• ゲーム開始10 手までしか扱っておらず、性能として十分ではない。","excerpt_src":"はじめに"},{"id":"2021_espoa_1_67","year":2021,"dept":"eスポーツ部門","dept_detail":"esports部門","title":"選手間の相性差を考慮した勝率予測モデル","members":"田中琉偉，作村建紀(法政大学)","first_author":"田中琉偉","affiliation":"法政大学","code":"[口頭]esports2","abstract":"ぷよぷよの公式大会データをもとに、ベイズ統計を用いて選手の実力を確率分布で表現し、勝率予測モデルを構築した。さらにクラスタリングと主成分分析により、各選手の戦術タイプ（速攻型・カウンター型・トリッキー型・火力重視型）を分類し、戦術相性を反映したモデルの精度向上を実現した。","methods":["ベイズ統計","クラスタリング","次元削減"],"themes":["選手評価","勝敗要因"],"data":["イベントデータ"],"free_tags":["ぷよぷよ","勝率予測","戦術タイプ分類"],"awards":["eスポーツ部門 優秀賞"],"text_insufficient":false,"excerpt":"日本e スポーツプロライセンス認定タイトルである,対戦アクションパズルゲーム「ぷよぷよ」のe スポーツの盛り上がりが様々な業界で活用されていることから年々増している.PRTIMES の記事[1] によると,「ぷよぷよ」というゲームをプレイすると脳の活性化が進むことが紹介されていることやReseEd の記事[2] にある「ぷよぷよプログラミング」教育カリキュラムの実施についても紹介されていることから,子供たちの知育や高齢者の認知機能低下に役立っている.FPS タイトルのゲームとは違い,暴力的な要素もなく子供たちの成長に悪影響がないためこのような盛り上がりが見えていると考えられる.一方,公式大会の試合観戦を行ってもどちらの選手が優位な立場にいるのか,どの選手が実力が高いのかはを初心者が判断することは難しい.あるスタッツ分析[3] がそのようなプロ選手のスタッツを視覚的に分かりやすい五角形のグラフで紹介していることや公式大会での勝率も同時に紹介していることからどの選手のどの能力値が高く,またどれぐらい勝利しているのかなどがわかる.しかし,試合している選手間でどちらが勝ちやすいのかなどの勝敗予測を行うことは難しい.本研究では,全試合の勝敗データをもとに選手の実力を定量的に表現することで,勝敗予測を行うモデルの提案を目的とする.まず,全試合の勝者と敗者の選手情報から,選手の実力を確率分布で表現する.それをもとに,各選手間の勝率予測モデルの考案を行う.次に勝利したときの試合状況から,各選手のプレイスタイルを定義し,対戦相手とのプレイスタイルの相性差を反映した勝率予測モデルの考案を行う.","excerpt_src":"はじめに"},{"id":"2021_espoa_1_76","year":2021,"dept":"eスポーツ部門","dept_detail":"esports部門","title":"ぷよぷよeスポーツにおける先制概念と勝因分析","members":"松谷康平，山元佑京，土居亮介，金子楓果，荒木由布子(静岡大学)","first_author":"松谷康平","affiliation":"静岡大学","code":"[口頭]esports3","abstract":"ぷよぷよeスポーツで初めて69個以上のおじゃまぷよを送る攻撃を「先制」と定義し、勝敗への影響を検証した。ロジスティック回帰分析と決定木分析の結果、ゲーム終盤での先制攻撃が勝利につながることを明らかにした。連鎖数・ゲーム進行度・前置連鎖数が主要な勝敗要因であることが判明した。","methods":["ロジスティック回帰","統計的検定","機械学習"],"themes":["勝敗要因","戦術分析"],"data":["イベントデータ"],"free_tags":["ぷよぷよ","先制戦術"],"awards":[],"text_insufficient":false,"excerpt":"ぷよぷよe スポーツは, 「ぷよぷよ通」というルールのもとで行われる一対一の対戦型esports である. 縦12 ×横6 の72 マスで構成される自分のフィールドの中で, 上から落ちてくる2 個1 組の「ぷよ」を, 移動や回転をすることで同じ色のぷよを4 個以上つなげると消すことが出来る.ぷよの積み方を工夫し, 連続してぷよを消す「連鎖」を発生させると, 相手のフィールドに「おじゃまぷよ」という特殊なぷよを送る攻撃をすることが出来る. 連鎖の数や消した色が多い程, 相手のフィールドに多くのおじゃまぷよを送ることができ, 相手からの攻撃に対しては, 一定の時間内に連鎖を起こすことで「相殺」することが可能である.フィールドの左から3 列目が一番上まで埋まると負けが確定するため, 連鎖を起こしておじゃまぷよを送ることで, 先に相手のフィールドを埋めて勝利を目指す戦略がある.ぷよぷよe スポーツでは現在, 株式会社セガからプロ選手のスタッツが公開されるなど, 昨今のデータ活用を重要視するフィジカルスポーツ業界と同様の動きがある. そこで我々は, フィジカルスポーツで行われたようなデータ分析がぷよぷよe スポーツに対しても行えるのではないかと考えた. 福田(2014)は, 野球において先取得点を挙げる(先制する)と高い割合で勝利に結びつくと報告している.他にも雜賀(2011)を含め, フィジカルスポーツでは, 先制することが勝利に結びつくとの報告が見受けられる.本研究では, ぷよぷよe スポーツにおいても同様に先制することがゲームの勝利に有利に働くのではと考え, 「ぷよぷよにおける先制」を定義し検討したうえで, どのような先制攻撃がゲームの勝利につながるかを明らかにした.","excerpt_src":"はじめに"},{"id":"2021_gatea_1_42","year":2021,"dept":"ゲートボール部門","dept_detail":"ゲートボール部門","title":"ゲートボールにおける「狙い」の分析","members":"桐谷啓介，桃﨑智隆，中川智之(東京理科大学)，小林正弘(東海大学)，松澤智史，田畑耕治(東京理科大学)","first_author":"桐谷啓介","affiliation":"東京理科大学","code":"[口頭]ゲートボール1","abstract":"ゲートボール試合における「狙い」の成功に関わる要因をロジスティック回帰分析と可視化で分析した。距離が短いほど狙いの成功率が高く、勝ちチームは2メートル以下の距離で攻撃を仕掛ける頻度が高いことが示された。","methods":["ロジスティック回帰","カーネル密度推定","可視化"],"themes":["戦術分析","勝敗要因","ポジショニング"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["ゲート通過"],"awards":[],"text_insufficient":false,"excerpt":"ゲートボールは,北海道芽室町に起源をもつ1947 年生まれのスポーツである.現在は,50 以上の国と地域で1,000万人を超える人々に愛されている.栃原ら[6] や多田ら[5]など多くの論文でゲートボールが高齢者の肉体的・精神的な健康維持に良い影響を与えるという研究報告がなされている.Kang et al.[2] が,高齢者のための自宅でも楽しめる感覚的ゲートボールシステムを開発した.また,Arjuna[1]は,ゲートボールが高齢者の健康と体力,自信と精神の維持に役立つことを紹介した.これらの研究は,ゲートボールと高齢者の健康との関係性に注目したものであり,ゲートボールがユニバーサルスポーツであることを示している.その一方で,ゲートボールには戦略型チームスポーツという側面もある.実際に,加藤[3] はゲートボールについて“試合中の一打ごとの駆引としてはビリヤードやカーリングに,試合全体のコントロールとしては囲碁に近い要素がある” と述べている.本研究は,ゲートボールの戦略型スポーツとしての側面に焦点をあてる.図1狙い回数と狙いの距離図1 は,狙い回数と狙いの距離の関係を示した棒グラフである(「狙い」などの用語に関する詳細は,2.1 節を参照).ご提供いただいたデータ(以後,提供データ)中のtarget に狙いが記録されているレコードを抽出し,勝ちチーム(Win)と負けチーム(Lose)別に狙ったオブジェクトまでの直線距離を球座標データを用いて計算し集計したものである.ただし,target が第1 ゲートとなっているものは除いており,通常打撃時とスパーク打撃時における数をカウントした.また,試合終了時に得点が同じであった試合は含まれない.図1 から,勝ちチームは負けチームよりも狙い回数が多いことがわかる.また,狙いの成功率(成功回数を狙い回数で割ったもの)と狙いの距離の関係を示した棒グラフが図2 である.図1 と同様の方法で,通常打撃時とスパーク打撃時における狙いの成功率を求めた.図2 から,Win の方がLose よりも近距離における成功率が高いことがわかる.図2狙いの成功率と狙いの距離ゲートボールは,基本的には1 回ごとに打順が移る.ただし,ゲート通過やスパークが成功した選手は続けて自分のボールを打つことができる.図1 と2 から勝敗に関わる要因の一つとして,狙ったコート上のオブジェクト(味方のボール,相手のボール,各ゲート,ゴールポール)を正確に狙えるかが重要と考えられる.これを「オブジェクトを狙う」と表現することにする.図3 は,全試合における先攻チームの打順1 番目のプレイヤー(プレイヤー1)の1 ターン目終了時のボール位置をコート上にプロットした画像である.図3プレイヤー1 の1 ターン目終了時のボール位置(画像右下にスタートエリアがあり,ゲートやゴールポールは実際より大きく表示している.)図3 から,第1 ゲートを通過した後に多くのボールが第2 ゲート(図3 の赤いゲート)付近かつインサイドライン近くに集中していることがわかる.これは,相手チームのプレイヤーに容易にタッチを成功させないための戦術であると考えられる.先に指摘した「オブジェクトを狙う」ことを攻撃的と解釈すれば,「オブジェクト以外(インサイドライン近くなど)を狙う」ことは防御的と解釈できる可能性がある.以上のことから,本研究では「オブジェクトを狙う」と「オブジェクト以外を狙う」ことに焦点をあて,解析を行う.","excerpt_src":"はじめに"},{"id":"2021_gatea_1_81","year":2021,"dept":"ゲートボール部門","dept_detail":"ゲートボール部門","title":"ゲートボールにおける二重心コンパクトネスを用いたタッチ発生状況の定量化","members":"東海林岳寛，酒井俊樹，小林拓，宿久洋(同志社大学)","first_author":"東海林岳寛","affiliation":"同志社大学","code":"[口頭]ゲートボール2","abstract":"ゲートボールのボール配置の散らばりを定量化する二重心コンパクトネスという新指標を提案した。勝ちチームはコンパクトネスが低い値を示し、タッチ発生時の盤面特徴を定量的に捉えられることが示された。","methods":["クラスタリング","指標開発","統計的検定"],"themes":["戦術分析","勝敗要因","ポジショニング"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["タッチ"],"awards":["ゲートボール部門 優秀賞"],"text_insufficient":false,"excerpt":"日本ゲートボール連合によると,ゲートボールは「タッチ」や「スパーク打撃」を組み合わせながら行うスポーツであり,チームプレーによるボールの連携が勝敗のカギとなる超戦略型のスポーツとされている. タッチとは第1ゲートを通過したあと,打者のボールが他のボールに当たることを指す.スパーク打撃とはタッチしたボールを打者のボールの位置に手で移動させ,その後打者のボールを打つ衝撃でタッチしたボールを弾き飛ばすプレーを指す.通常,ゲートボールでは1 回打つごとに打順が移動するが,タッチが成功した際は打者は変わらず,続けてスパーク打撃を行い,さらにもう1 回自分のボールを打つことができる.タッチしたボールが味方チームの場合,その味方ボールをスパーク打撃することによってゲート通過をすることや味方チームに有利な位置に配置することが可能である.一方,タッチしたボールが相手チームである場合,その相手のボールをコート外に追い出すことで相手チームの妨害が可能である.このようにタッチとスパーク打撃はゲートボールにおいて戦術を立てる軸であり,これらを有効に使うことが勝利において重要である.一般的に,タッチの成功は距離に大きく依存することが知られており,味方ボールは複数のまとまりを作りながら戦うことが有利と考えられている.しかし,実際には勝利とタッチの関係やタッチが発生した場面における味方ボール同士の位置関係は明らかでない.そこで,酒井ら(2017)や伊藤(2012) で言及されおり,スポーツデータの位置関係に着目した分析で多く用いられるコンパクトネス(以下,旧コンパクトネス)という指標を用いる.本研究ではタッチに着目し,特にボールのまとまりの観点から旧コンパクトネスを改良した,コンパクトネスを提案し,それを用いて盤面のボール配置の特徴を捉えることで,勝利との関係及びタッチが発生した状況における味方ボールとの位置関係を明らかにする.本研究は,以下の流れで分析を行う. 1. 基礎分析でタッチと勝敗の関係を明らかにする. 2. 既存のコンパクトネスの問題点を踏まえ,新たなコンパクトネスの提案を行う. 3. 提案する新しいコンパクトネスの有効性の確認を行う. 4. 提案した新しいコンパクトネスを用いてタッチが発生する状況の考察を行う.一般的にタッチを多くすることで試合を有利に進めることができるとされている.そこで1 ではタッチ数と得点,及び勝敗の関係を単純集計から明らかにする.2 以降ではタッチが発生した状況を明らかにすることが共通の目的である.2 では旧コンパクトネスをゲートボールに適用する問題点を踏まえ,新たなコンパクトネスの提案を行う.3では提案したコンパクトネスが想定する状況を適切に評価できていることを確認する.4 では提案したコンパクトネスからタッチが発生した状況の考察を行う.各分析の詳細は各節の冒頭で述べる.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_8","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"フォーメーションを考慮しアウトプレイの原則を用いたパス分類とその特徴の定量化","members":"清水颯希，宿久洋(同志社大学)","first_author":"清水颯希","affiliation":"同志社大学","code":"P1-02","abstract":"J1リーグ2020年度データを用いて、ハンガリアン法を用いた混合ガウスモデルでフォーメーションを特定し、アウトプレイの原則でパスを分類した。スルーパス、サポートパス、バックワードパスの使用パターンとその特徴をフォーメーション別に可視化した。","methods":["機械学習","可視化","クラスタリング"],"themes":["パス","フォーメーション","戦術分析"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年, 様々なスポーツにおいてカメラやGPS 機能を利用して選手の動きをデータとして入手し, 統計的手法を用いて分析することで戦略や選手評価に活用することが一般的になってきている. サッカーの場合, パスやフォーメーションなど様々な観点に着目した分析がこれまでにされてきている. パスに関する研究でアウトプレイの原則というものを利用してパスを分類し, 各パスの特徴を明らかにしているものがある. この研究はフォーメーションなどサッカーにおいて勝敗に影響を与える要因をあまり考慮していない. そこで, フォーメーションを考慮しアウトプレイの原則を用いてパスの特徴を明らかにすることを本研究の目的とする. 特定されたフォーメーションは主に, 4-4-2, 4-2-3-1, 3-4-2-1, 3-3-2-2, 4-1-2-3 であった. 今回の分析では上記5 つのフォーメーションを分析対象として用いた. 1.1サッカーにおけるフォーメーションサッカーでは試合で勝利するためにゴールを決めること,敵チームにゴールを決められないように守備をすることが必要である. 各チームはこれらの目標を達成するために監督の指示のもと, 様々な戦術を用いて試合を行っている.つまり, 戦術はサッカーにおける勝利のためにとても重要な要素であると言える. 戦術には大きく分けて3 つのカテゴリがある[7]. 1 つ目は選手個人ごとのもの, 2 つ目は味方選手複数人ごとのもの, 3 つ目はチーム全体でのものである. フォーメーションは3 つ目のチーム全体での戦術の1 つである. サッカーにおいて, ゴールキーパー以外の選手はディフェンダー, ミッドフィルダー, フォワードの3 つのポジションのいずれかに分類される[4]. この3 つのポジションに分類される選手の組み合わせをフォーメーションと呼ぶ[4]. 例えば, ディフェンダー4 人, ミッドフィルダー3 人, フォワード3 人で構成されるフォーメーションは4-3-3 のように表記する. フォーメーションには4-3-3, 4-4-2, 3-5-2, 3-4-2-1 など様々なものがあり, チームによって用いるフォーメーションに違いがある. フォーメーションの選択は, チームに攻撃的または守備的なプレーをさせる目的で監督が採用する主な戦術の1 つである[4]. また,フォーメーション構造は選手同士が連携して形成しているものであり, チームが勝利するための効果的な攻撃と守備を実現するための戦略を反映しているとも言える[9]. つまり, フォーメーションはサッカーの勝敗に影響を与える重要な要因でありフォーメーションを考慮した研究をすることは必要であると言える. 1.2サッカーにおけるパス要旨で述べた通り, トラッキングデータを入手できるようになったことでパスに関する研究も増えてきている. これまでにされてきているパスに関する研究は総パス回数やパス成功率などの表記上の測定値だけに焦点が当てられているものが多い[8]. しかし, パスは選手の動きやポジショニングなどの空間的な制約に大きく影響される[3]. また,サッカーにおける選手のポジショニングの変化は選手の技術的な制約やチームの戦術的な制約に影響される[3]. さらに, 試合中に選手が取る行動は他の選手との相互作用に影響されるため, 単純な頻度データでは状況を十分に把握できない可能性が高い[1]. つまり, パスについて研究する上で必要なのは単純に総パス回数などの測定値を単体で用いることだけでなく, フォーメーションや味方, 相手選手との相対的な位置関係など様々な要因を考慮するべきであると言える. 相手選手との位置関係を考慮したものにアウトプレイの原則というものがある. アウトプレイの原則に関しては4 章で詳しく説明するが, 本分析ではこの原則を用いてパス分類を行い, 分類した各パスの特徴を明らかにする. 1.3研究目的と研究意義本研究では日本のプロサッカーリーグであるJ1 リーグ(J リーグディビジョン1) に所属する各チームのフォーメーションの組み合わせを考慮した効果的なパスをアウトプレイの原則を用いて特定することによって, 相手チームのフォーメーションに対して推奨されるパス戦術を提案することを目的とする.また本研究の意義は, アウトプレイの原則を用いてパスを分類し, 各パスの効果的な使用場所を明らかにすることで, パス戦術の一助として用いることができるという点である.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_9","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"J1リーグにおける得点状況を考慮した有効なカウンター攻撃方法の提案","members":"青木大河，宿久洋(同志社大学)","first_author":"青木大河","affiliation":"同志社大学","code":"P1-03","abstract":"得点状況を考慮したカウンター攻撃の有効性を、ロジスティック回帰分析で検証した。勝ち状況では少ないパス本数でワイドに攻撃することが、引き分け・負け状況では異なる戦略が有効であることを明らかにした。","methods":["ロジスティック回帰"],"themes":["戦術分析","トランジション"],"data":["トラッキングデータ"],"free_tags":["カウンター攻撃"],"awards":[],"text_insufficient":false,"excerpt":"近年トラッキングシステムの発展により,サッカーにおけるデータ分析の重要性は増しており,チーム競技であるサッカーにおいて,戦術は勝利するための重要な要素である[2].近年では攻撃戦術の一つであるカウンター攻撃が有効であると考えられている.カウンター攻撃に関する攻撃や守備に着目した研究など,試合全体を通してのカウンターの有効な攻撃方法に着目した研究が行われている.また得点状況によって戦術が変化すると述べており,戦術において得点状況は考慮すべき重要な要素である[1].しかしながら,得点状況を考慮したカウンターの有効な攻撃方法に関する研究は行われていない.カウンター攻撃の課題として,カウンター攻撃においてどこでボール奪取し,奪った後にどのように攻撃をするのか明確化できていない点が挙げている[4].本研究では,得点状況を考慮した有効なカウンターの特徴を明らかにし,その特徴を基に有効なカウンター攻撃方法の提案を行う.得点状況を考慮することで,有効な戦術を使い分けることが可能となり,攻撃戦術の発展に貢献できると考えられる.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_16","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"グルーピングを用いたJ1リーグにおけるMFの特徴分析","members":"三谷駿輔，朝日弓未(東京理科大学)","first_author":"三谷駿輔","affiliation":"東京理科大学","code":"P1-04","abstract":"日本のサッカーレベル向上のため、J1リーグのミッドフィールダーの特徴を主成分分析と階層クラスター分析によって定量的に分析した。その結果、MF選手は攻撃的MF、ワイドMF、バランス型MF、守備的MFの4つのタイプに分類でき、チームの戦術特性を反映した多様なポジショニングが確認された。","methods":["クラスタリング","可視化"],"themes":["選手評価","ポジショニング","戦術分析"],"data":["イベントデータ"],"free_tags":["主成分分析"],"awards":[],"text_insufficient":false,"excerpt":"日本のサッカーのレベルは近年上がっている.その要因として挙げられるのは海外で活躍する選手が増加したことである. 2021 年ワールドカップ予選の日本代表メンバーを見てみると, メンバー23 人のうちJ リーグの所属選手は 5 人となっている. またこの 5 人のうち 4 人は 2021 年の夏まで海外クラブに所属していた選手である.このように現在の日本代表はほとんどが海外のクラブに在籍した経歴を持っているが,このままだと再び日本代表は衰退してしまう可能性がある.なぜなら日本人選手の海外のクラブへの移籍のほとんどが国際大会での活躍による功績だからである.つまり現在のように J リーグの選手がほとんど代表に選ばれていない場合,海外のクラブに移籍する選手が減少してしまうのである.サッカーなどの集団競技は選手の能力は監督やコーチの主観に依存することが多いということがわかっている[1].J リーグの監督は世界に比べ戦術レベルが低いことで知られている.つまり選手自身が特徴を出すことができず,関係者が見逃してしまうため代表に選出されていない可能性がある.そのため本稿では J1 リーグにおける MF の特徴を分析し,可視化することを研究目的としている.数あるポジションの中で MF を選択した理由は,攻守の両局面で重要なファクターを担うポジションだからである.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_21","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーの速攻戦術に対する効果的な守備の要因分析","members":"大内一輝，宿久洋(同志社大学)","first_author":"大内一輝","affiliation":"同志社大学","code":"P1-06","abstract":"速攻に対する守備においてどのような要素が必要かを明らかにするため、ロジスティック回帰分析を用いて守備力を定量的に評価した。パスコースと最も近いディフェンダーとの距離が有意な要因となり、ボールマンからのパスの出し先を防ぐことが速攻防止の鍵であることが判明した。","methods":["ロジスティック回帰","統計的検定"],"themes":["守備","戦術分析","トランジション"],"data":["トラッキングデータ"],"free_tags":["速攻防止"],"awards":[],"text_insufficient":false,"excerpt":"成塚ら(2017) では近年,スポーツの試合中に選手やボールの動きを追跡するトラッキング技術が進歩し,より詳細なトラッキングデータを入手することが容易になったと言われている.サッカーの試合を例とし,ここで取得できる情報を挙げると,選手の走行距離,加速度,選手間の距離,ボールの動きなどが挙げられ,ボールに関わっていない選手や時間帯の動きも取得することが出来るようになった.トラッキングデータの活用事例として,走行距離とスプリント回数の比較が挙げられる.比較が可能になったことで,今まで印象でしか分からなかった,選手のフィジカル面でのパフォーマンスやチームのフィジカルの客観的評価・分析の素地となっている.また,比較が可能になった事はサポータやサッカーファン,サッカー関係者に対し大きな反響を生みその結果,サッカーのデータは得点,失点,ファールの数といった「目で追えるもの」から選手の総走行距離やスプリント回数といった「目で追いきれないもの」まで範囲を拡大している(加藤,2016).「目で追いきれないもの」の一つとして守備力が挙げられる.守備で行われる行動は相手からボールを奪うのみではなく,相手の攻撃を遅らせるディレイ,プレー方向を限定させるワンサイドカッティング(山田,2014) などといった行動も存在し,これらの行動は具体的に観測することが難しく,試合のスタッツにも残らないことから数字として表れない守備行動である.また,サッカーにおいて,選手の能力,チーム力は専門家の視認的方法によって質的,主観的に評価される.この評価方法ではゲームを専門的に分析できるものの,分析者の主観性及び恣意性を排除することは出来ないものである(大江ら,2013).また,コーチのゲーム観察の正確性は3 割程度と言われており(Frank & Miller,1986) 主観的評価では正確に測れていないことが伺える.そこで,「目で追えないもの」である守備力に対してデータによる分析を適用させることで,監督やコーチによる主観的評価の手助けができると考え,実際に守備技能の尺度を開発する研究(Koya & Takahiko,2004) や守備技能の因果関係を解明する研究が行われている(山田, 2014).ここで、サッカーの攻撃について述べる.サッカーの攻撃は,短いボールの保持時間で得点やシュート機会に繋げる速攻と,ボールの保持時間を長くし得点やシュート機会につなげるポゼッション攻撃の2 種類に大別することができる(田村ら,2015).どちらの攻撃が有効であるか判断することは難しいが,速攻による得点機会の有効性を示す研究がいくつか報告されている(Lago et al., 2013).また,実際の試合においても,2014 年FIFA ワールドカップブラジル大会ではボール奪取を意図的に仕掛け,そのままの勢いでゴールに迫る攻撃が大会の中で特徴的であったと報告されており(田村ら,2015),2018 年FIFA ワールドカップロシア大会でもボール支配率が40% 未満のチームが高い勝率を残したことが明らかになっている(後藤,2019).以上のことからサッカーの攻撃において,カウンター攻撃をはじめとする速攻は有効な戦術であり,そのためこの速攻をいかに防ぐことができるかが重要になる.しかし,速攻を防ぐという観点に着目した研究は見受けられない.以上から,「目で追えないもの」である守備力の評価に関しては正確に測れておらず,データによる手助けが必要であると考える.また,サッカーにおいて有効な戦術と考えられる速攻戦術を防ぐことに着目した研究は見受けられない.本研究では失点のリスクが高い速攻に対し守備力の評価を行い,速攻に対する守備をする際に重要な要因を明らかにする.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_23","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるゴールキーパーを起点としたビルドアップの定量的評価","members":"中亮介(同志社大学)，原尚幸(京都大学)","first_author":"中亮介","affiliation":"同志社大学","code":"P1-07","abstract":"現代サッカーにおけるGKのビルドアップ能力を定量化するため、類型化されたビルドアップパターンの有効性を分析し、ロジスティック回帰モデルによりGK固有の能力を数値化した。その結果、守備的MFへの縦パスが最も効果的で、ビルドアップ能力の高さがチームの得失点に大きく影響することが示された。","methods":["ロジスティック回帰","統計的検定"],"themes":["選手評価","ビルドアップ","戦術分析"],"data":["イベントデータ","トラッキングデータ"],"free_tags":[],"awards":["ポスター部門 最優秀賞"],"text_insufficient":false,"excerpt":"サッカーにおいてゴールキーパー(以下, GK)は, 全ポジションの中で唯一手でボールを扱うことが許され, 長らくゴールを守るシュートセービング技術が最重要のポジションとされてきた. しかし, 1992 年に「味方の意図的なバックパスをGK は手を使って処理できない」というルール改正がなされたことを契機に, 足でボールを扱う機会が増加し, 後方からパスによって攻撃を組み立てる, ビルドアップの能力も重要視されるようになった. 実際に, GK が行うプレーの7 割が攻撃であり, 使用する技術の6割以上がフィールドプレイヤーと同様の足元の技術であることが報告されている[1]. また, Footballista[2] によると,緻密化する現代サッカーにおいて, GK のビルドアップは,大きく「両サイドに開いたセンターバック(以下, CB)へのパス」「高い位置をとった両サイドバック(以下, SB)へのパス」「守備的ミッドフィルダー(以下, MF)への縦パス」「前線へのロングフィード」の4 パターンに類型化され, これら4 つの作業の繰り返しになると述べられている.このように, 従来はロングキックが主流であったGK ビルドアップの内容も, 近年はシステム化している. GK ビルドアップの重要性に関する文献も多い. COACHUNITED[3] では, GK がビルドアップに参加できることで, 11 対10 の数的有利の状況を創り出すことが可能となり, ビルドアップ能力に長け, 攻撃の起点となり直接的なゴールチャンスをも演出した西川周作選手の存在が, 2012 年, 2013 年のサンフレッチェ広島のJ1 リーグ連覇に不可欠であったと述べられている. また, 監督としてFC バルセロナを欧州CL 優勝に導いた経験もある, 現マンチェスターシティ監督のジョゼップ・グアルディオラも,マンチェスターシティのGK である, エデルソン・モラエスのビルドアップ能力を高く評価し[4], 積極起用に至っている.このように, 現代サッカーにおいてGK ビルドアップの重要性が増し, 能力の高い選手起用も増えてきているにも関わらず, GK に関する研究は, シュートセービング等の守備タスクに焦点を当てたものが多く, GK ビルドアップに関するものは少ない. また, GK ビルドアップ能力を客観的に評価できる指標も未だ存在しない. これらは大きな課題点である.このような背景を踏まえ, 本研究では, 「各類型化GKビルドアップの有効性を明らかにすること」及び「GK のビルドアップ能力を定量化すること」を目的とする.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_25","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおける選手とチームのボール保持時間分布について：理論の提案とデータによる検証","members":"上江洲清哉(琉球大学)，成塚拓真(立正大学)，山崎義弘(早稲田大学)，山本健(琉球大学)","first_author":"上江洲清哉","affiliation":"琉球大学","code":"P1-08","abstract":"選手のボール保持時間分布とチームのボール保持時間分布を統一的に理解するため、ガンマ分布に基づく理論的枠組を提案した。データ検証の結果、選手のボール保持時間がガンマ分布に従うことが確認されたが、チームのボール保持においては選手間の独立性の仮定が成立せず、パス数とボール保持時間に相関があることが明らかになった。","methods":["時系列解析","確率モデル"],"themes":["試合の流れ"],"data":["トラッキングデータ"],"free_tags":["ボール保持"],"awards":[],"text_insufficient":false,"excerpt":"と目的サッカーにおいて,ボールの支配は勝敗に関係する要素の1 つである。2010 年代前半にFC バルセロナやスペイン代表が高いボール支配率で勝利を重ねたことから,支配率が注目されるようになった。ボールをキープし続けられれれば失点することがないことは明らかであるが,高い支配率が勝利に直結するわけではないというのも事実である。支配率と勝利の関係は現在でも研究が進められている[1]。試合全体で測定されるボール支配率は,微視的には1 人の選手がボールを保持するイベントに分解される。Mendes, Malacarne, and Anteneodo [2] は,テレビ放送された試合映像を解析し,1 人の選手がボールを保持する時間がガンマ分布あるいはそれをq-拡張したq-ガンマ分布で表されると述べている。また,Chacoma, Almeria, Peotti, and Billoni [3] では,チームとしてのボール保持時間,つまり,一方のチームがボールを奪ってから相手チームにボールを奪われるまでの時間について分析されている。彼らは,Pappalardo らのデータセット[4] の1826 試合についてボール保持のダイナミクスを解析し,ブラウン運動の初通過時間との比較から,チームのボール保持時間が逆ガウス分布にしたがうと主張している。チームのボール保持時間はチーム内の選手のボール保持時間の合計であり,両者は密接に関係していると考えるのが自然である。ところが,理論的には(q-) ガンマ分布と逆ガウス分布を結びつける単純な関係などは知られていない。そもそも,これら2 つの研究ではモデル化の出発点自体が異なり,互いに相いれないようにみえる。そこで本研究では,選手のボール保持時間とチームのボール保持時間を統一的に理解するための理論的な枠組を提案する。さらに,トラッキングデータとボールタッチデータから得られる情報を理論と比較することにより,理論の妥当性を定量的に検証する。本研究は,ボールの保持や支配という特徴に注目して複雑なサッカーの一端を理解しようとするものである。","excerpt_src":"研究の背景"},{"id":"2021_soccera_1_38","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"隠れマルコフモデルを用いたサッカーにおける5レーン理論攻撃の評価","members":"小林朝陽，宮代隆平(東京農工大学)","first_author":"小林朝陽","affiliation":"東京農工大学","code":"P1-09","abstract":"5レーン攻撃の戦術効果を定量的に分析するため、隠れマルコフモデルを用いてポジショニングパターンを可視化し、有効攻撃と非有効攻撃を比較した。その結果、センターフォワードが中央にポジショニングをとった方が得点機会が増加することが確認され、5レーン攻撃は中央から相手守備を崩すのに有効であることが示された。","methods":["隠れマルコフモデル","ネットワーク分析","可視化"],"themes":["戦術分析","ポジショニング","フォーメーション"],"data":["トラッキングデータ"],"free_tags":["5レーン理論"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて,戦術は勝敗を左右する非常に重要な要素である.特に攻撃の戦術はシュートを決めることに直結するため,分析が盛んに行われている.例えばHughes and Franks [3] は,1990 年に行われたFIFA ワールドカップ決勝のパスの本数と得点を分析し,短距離のパスよりも長距離のパスの方がより多く得点に結びついていることを示している.一方,2010 年のFIFA ワールドカップでは,スペイン代表が「ティキタカ」と呼ばれる戦術を用いて優勝した.この戦術は,短い距離のパスをたくさんつなぎ,ボールを支配しながら攻撃するものである.このように,サッカーの戦術は時代とともに形を変えて発展してきた.現在の攻撃戦術における流行の一つは,5 レーン理論を用いた攻撃(5 レーン攻撃)である.5 レーン攻撃とは,図1 のようにサッカーのピッチを縦に5 分割し,5 つのレーンの適切な位置に選手がポジションをとって行う攻撃戦術である.適切なポジショニングの例として,1 列前・1列後ろの選手と同レーンに並ばないことや,2 列前・2 列後ろの選手と同レーンに並ぶことなどが挙げられる.実際の現場でも,2013–2015 年にFC バイエルン・ミュンヘンの監督であったグアルディオラが,練習場に4 本のラインを引いて練習させているなど,強豪チームもこの戦術を取り入れている.J リーグの公式動画[4] でも,川崎フロンターレの試合を例に5 レーン攻撃についての解説がされている.図1: 5 レーン理論これらの背景をふまえ,本研究では数理的に5 レーン攻撃という戦術を分析することを目的とする.戦術分析は5レーン攻撃において,ポジショニングパターンと選手の動きの良し悪しを定量的に分析することによって行う.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_47","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"スプリントとチームスタイル指標から見たJ1チームの強化のための提案","members":"西口剛大，久野北斗，中馬龍聖，角田有紀，安孫子明以，廣津信義(順天堂大学)","first_author":"西口剛大","affiliation":"順天堂大学","code":"P1-10","abstract":"J1リーグの18チームについて、スプリントデータとチームスタイル指標の関係を分析し、チームの戦術特性と順位の関係を検討した。比較分析の結果、ポゼッションとカウンター戦術の違いがスプリント本数や位置に明確に反映され、これがチームの最終順位に大きく影響していることが明らかになった。","methods":["可視化"],"themes":["チーム評価","戦術分析","勝敗要因"],"data":["トラッキングデータ"],"free_tags":["比較分析"],"awards":[],"text_insufficient":false,"excerpt":"近年、サッカーの試合ではスプリント本数がランキングされ、評価の基準の 1 つになっている。2020 年のJ1 リーグ・スプリントランキング上位を占める多くの選手が FW 等のチームの中で前の方にいる選手だった。溝上ら(2016)は、 得点数とスプリント回数で有意差が認められたと報告している。今回「J1 各チームのコンセプトがどのようにスプリントの傾向として現れているのか」をスプリント場所や本数を提供されたデータから特定する。 さらに、スプリントの傾向やチームスタイル指標が類似しているチーム同士や特徴あるチームを対象として比較した場合にどのような差が最終順位に影響しているかを考察し、改善点を提案することを目的とする。","excerpt_src":"背景と目的"},{"id":"2021_soccera_1_54","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"最適パスコース選択モデルの提案とスルーパスにおける性能評価","members":"幸毛正希，外囿拓郎，安藤宗司(東京理科大学)","first_author":"幸毛正希","affiliation":"東京理科大学","code":"P1-11","abstract":"スルーパスの精度向上を目指し、守備側選手の動きやパス地点での戦術的有位性を考慮した新たなパスコース選択モデルを提案した。このモデルでは、フィールド重み付けとプレッシャー重み付けを組み合わせて最適なパス地点を推定し、指導に有用な定量性と合理性をもたらすことが期待される。","methods":["機械学習","最適化"],"themes":["パス","シュート"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーは, 競技性や面白さの観点から様々なルールの変遷が行われてきた. 特に, オフサイドは, サッカーの面白さを担保しているルールだといえる. オフサイドは, 待ち伏せ禁止のルールであり, ゴール前で待ち伏せし, そこに向かってボールを放り込むだけといった, スポーツの面白みがなくなる戦術を制限するルールとなっている.[1]相手ゴールに迫る戦術としてスルーパスというものがある. スルーパスは, 相手選手の背後に出し, オフサイドを回避しながら前方に出すパスのことを言う. スルーパスが通ると大きいチャンスとなり得る. そのため, 相手選手はスルーパスを通さないように警戒しており, 難易度が高いパスとなっている.図1:スルーパスの具体例(選手A がパスを出した所に選手B が走り込む)黒丸:ボール青丸:攻撃側選手橙丸:守備側選手赤線:オフサイドライン試合中のある瞬間において, パスをどこに出せば良いか推定することを目的とした先行研究として, パスコース選択モデルを提案するものがある.[2] しかし, このパスコース選択モデルでは, 守備側選手の動きや, パス地点での戦術的有位性の評価と実試合内の選手の思考に相違があり,改善の余地がある. 本研究では, これらの課題を解決し, 新たなパスコース選択モデルを提案する. 提案モデルにより選択されたパスコースと実試合で行われたスルーパスの比較により, スルーパス精度向上を目的とした指導に一定の評価基準における定量性や合理性をもたらすことが期待される.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_56","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"連続的な優勢領域に基づくパス技術の定量化と優良パサーの推定","members":"大井陽暉，平山颯太，宮本有輝，大原剛三(青山学院大学)","first_author":"大井陽暉","affiliation":"青山学院大学","code":"P1-12","abstract":"パス軌道下における味方および相手チームの支配領域に着目し、2変量正規分布に基づく優勢領域を用いてパス技術を定量化する手法を提案した。その結果、パス成功率が同じであってもパス難易度には差があり、パス技術を適切に評価するには受け手周辺のみならずパス軌道における敵味方の影響度も反映することが重要であることが明らかになった。","methods":["空間分析","可視化"],"themes":["パス","選手評価"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて,パスは試合結果を左右する重要な要因であり,実際にパス数とゴール数および勝率の間には正の相関があることが報告されている[1, 2].そのため,高いパス技術をもつ選手を獲得することはクラブチームの強化に欠かせない要因の1つである.しかし,パスの難易度や有効性は試合の状況に応じて変化するため,パスの成功率といった表層的な評価指標では難易度の高いパスを出せる選手の発見が困難である.これに対して大森らは,パスの受け手とその付近の敵選手の関係から受け手にかかるプレッシャー度合いを求め,パスの難易度を定量的に評価している[3].しかし,パス技術を適切に評価するためには,受けて周辺の状況のみならず,パスが通過した領域における敵・味方の影響度も反映することが望ましい.そこで本研究では,パスの軌道下における味方および相手チームの支配領域(優勢領域)に着目し,各領域を支配するチームの影響度を積算することでパス技術を定量化する手法を提案する(図1).優勢領域の算出には,選手間の位置関係に基づいてフィールドを排他的に分割するボロノイ領域ではなく,選手間の影響度の重なりも考慮できるFernandez らが提案した2 変量正規分布の確率密度関数に基づく優勢領域[4] を利用する.実際の試合データに対して提案手法を適用した結果,同じようなパス成功率をもつ選手の中から,プレイスタイルやパス技術の違いをもつ選手を発見できることを確認した.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_68","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"ベイジアンネットワークによるサッカーのアーリークロスの達成要因分析","members":"松岡弘樹，高嶋羽也斗，安藤梢，西嶋尚彦(筑波大学)","first_author":"松岡弘樹","affiliation":"筑波大学","code":"P1-14","abstract":"サッカーゲームのアーリークロス達成に関与する潜在要因を明らかにするため、ベイジアンネットワークを用いて因果構造モデルを構築した。その結果、アーリークロスの達成要因はアクション内容ではなくプレーの位置と時間であり、短時間でボールをサイドに移動させることと相手DFラインが高速で下がることが速い攻撃を生み出すプレー要因であることが示された。","methods":["ベイズ統計","因果推論","統計的検定"],"themes":["戦術分析","セットプレー","トランジション"],"data":["イベントデータ","トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーのデータテクノロジーの発展はフットボールアナリティクス(Football Analytics)を促進し, 機械学習を適用したパフォーマンス価値の評価を実現している(Herold et al., 2019).Decroos et al. (2019)はボールイベントデータから選手のアクション価値の評価し,市場価値の高い選手を定量的に分析した.サッカーのコーチングでは,ゲームパフォーマンス改善のためにデータ分析結果が用いられる.サッカーゲームのビッグデータから,シュートなどの攻撃結果に関与するアクション要因とアクションの達成に関与する要因を明らかにすることが必要である.パフォーマンス改善に留まらず,サッカーゲームにおける戦術プレーの発展にはフットボールアナリティクスの知見が必要である.しかし,機械学習を適用した分析モデルでは, プレー内容の説明ができないことが課題であると指摘されている.Herold et al. (2019) は,機械学習を適用して識別精度の高いパスモデルを開発したとしても,どのようなパスが良いパスであるかを示さないため,フィードバックに活用することが困難であることを指摘している.データ主導型コーチングを推進するためには,プレー要因を説明できる分析モデルを創出することが必要である.ベイジアンネットワークは条件付き確率を用いた有向非循環グラフ構造として複数の確率変数間の因果関係を表す確率モデルであり,事象の予測や観測結果からの原因の探索に利用できる(本村,2004).また,ベイジアンネットワークでは観測結果をエビデンスとして設定することで,他の測定項目の事後確率分布を推論できるため,事後確率の変化から従属変数に影響を与える要因が明らかになる.欧州リーグを追従して,J リーグでは攻守のプレーの高速化が進展している.ベイジアンネットワークを適用し,速攻プレーの達成に関与する潜在要因を解明することが必要であると考えらえる.本研究の目的はサッカーゲームのアーリークロスの達成に関与する潜在要因を明らかにすることであり,ボールタッチデータとトラッキングデータから構成したアーリークロスに関連する測定データにベイジアンネットワークを適用した.","excerpt_src":"背景"},{"id":"2021_soccera_1_72","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"有効な直接フリーキックの要因は何か？","members":"金澤亮，市川貴之，角谷慎悟，向本敬洋，安井清一(東京理科大学)","first_author":"金澤亮","affiliation":"東京理科大学","code":"P1-15","abstract":"サッカーの直接フリーキック成功要因をロジスティック回帰分析で調査した。出場時間が短く、相手の壁が高く、ホームゲームの場合に有効な直接フリーキックになりやすいことが明らかになった。","methods":["ロジスティック回帰","統計的検定","回帰分析"],"themes":["戦術分析","勝敗要因","シュート"],"data":["イベントデータ","トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"状況が目まぐるしく変わるサッカーにおいて,直接フリーキック(以下 FK と表す)は絶好の機会である.ゴールキーパー(以下 GK と表す)と壁以外に邪魔するものは無く,求められるのはキックだけである.そのため,通常のプレーで必要な一瞬の判断などは不要であり,システマティックに得点を狙うことが出来る.このことから,直接 FK は不確実性が大きい通常のプレーと比べて,得点しやすい状況であると言える.しかし, 現状では直接 FK の成功率は 5%程度と言われており,殆ど結果に結びついていない.また,どのような FK を蹴ることが有効であるかといった研究も殆ど存在しない.そこで,本研究はどのような直接 FK が有効であるか分析を行った.具体的に選手が何をすべきか,どういった状況で直接 FK を蹴るべきかということに対し科学的な示唆を与えることを目指した.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_77","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"シュート予測のための機械学習アルゴリズムの性能比較に向けて","members":"林拓未，黒木進，百武弘登(広島市立大学)","first_author":"林拓未","affiliation":"広島市立大学","code":"P1-17","abstract":"チームが5プレー以内にシュートに到達する確率を予測するモデルをロジスティック回帰、決定木、ランダムフォレストで構築した。ランダムフォレストが最も良好な性能を示し、プレー位置が予測に最も重要な要因であることが判明した。","methods":["機械学習","ロジスティック回帰"],"themes":["得点予測","戦術分析","シュート"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["決定木"],"awards":[],"text_insufficient":false,"excerpt":"スポーツはIT の進化に伴い,多くのデータを利用することが可能になった.サッカーも現在では,強いチームを作るうえでデータを利用することが必要不可欠となっている.本研究では,データスタジアム社が提供したボールタッチデータを用い,プレーを起こしたチームがその後,5プレー以内にシュートにたどり着くかどうかを予測するためのモデルを構築し,得られた結果から分析・考察を行っていく.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_7","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるパスの有効性の定量化と効果的なパスの種類について","members":"森いづみ，宿久洋(同志社大学)","first_author":"森いづみ","affiliation":"同志社大学","code":"[口頭]サッカー1","abstract":"I-Movとディフェンス破壊スコア（D-Def）を用いて、2020年度J1リーグ5節分のデータからパスの有効性を定量化した。D-Defスコアに加えてパスの回数と成功率もI-Movに影響を与えることを確認し、危険度が高いシーンではバックパスが最も有効であることを示した。","methods":["可視化"],"themes":["パス","スペース評価","ポジショニング"],"data":["トラッキングデータ"],"free_tags":["主成分分析","因子分析"],"awards":[],"text_insufficient":false,"excerpt":"Goes et al. (2019) では,サッカーにおけるパスの評価はかつて前方へ送られるパスを過大に評価する傾向にあったが,直接ゴールに結びついていないパスであったとしても,相手チームの守備を打開するためのパスなのであれば,高く評価されるべきであると述べられている.またFernandez et al. (2018) では,サッカーにおけるパスの重要な目的は相手チームのディフェンスの動きを崩してその間にスペースを生み出すことであると言われている.そこでGoes et al. (2019) ではディフェンスの動きに着目し,前方へのパスが過大評価されないような横へのパスや後方へのパスも均等に評価される指標としてI-Mov (Individual movement) を提案した.I-Mov とは,サッカーの試合中,フィールド上のディフェンス選手の個々の動きを定量化したものであり,I-Mov の値が高いパスは有効であると評価している.またI-Mov で確認した選手の動きがどれだけ守備組織を乱れさせているのかをD-Def (Disruption of the defense) スコアにて示している.D-Def スコアとは守備組織の変化を測定する指標であり,パスによってどれだけ相手チームの守備を打開することができたかを定量的に示しているもので,相手チームの守備が乱れているほど高いスコアを示す.Goes et al. (2019) では,D-Def スコアがI-Mov と強く関連していることを確認しており,I-Mov によってあらゆる方向のパスを評価する手法を提案している.しかし,そこで得られた指標には三つ問題点がある.まず一つ目は,成功したパスのみを対象としているため,選手の能力を正確に測ることができていないこと,二つ目は,D-Def スコアと最終的な成功基準との関係性を明らかにしていないこと,三つ目は,具体的にどのようなパスが有効であるのかを明らかにしていないことである.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_15","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおける選手の視覚情報の推定とパス分析への応用","members":"瀧澤健太，坂本郁也(中央大学)，山崎義弘(早稲田大学)，山本健(琉球大学)，成塚拓真(立正大学)","first_author":"瀧澤健太","affiliation":"中央大学","code":"[口頭]サッカー2","abstract":"トラッキングデータから選手の視覚情報を推定し、リアルタイム分析システムを構築した。視覚情報を考慮したパスの安全度評価を行い、安全なパスは保守的で、安全でないパスは攻撃的な傾向があることを示した。","methods":["画像認識・姿勢推定","可視化"],"themes":["パス","ポジショニング"],"data":["トラッキングデータ"],"free_tags":[],"awards":["サッカー部門 最優秀賞"],"text_insufficient":false,"excerpt":"我々はサッカーの試合をスタジアムやテレビなどで気軽に観戦することができる.そして,観戦中に「あの選手にパスを出していたらチャンスだったのに」,「なぜシュートではなくドリブルをしたのだろう?」など,プレーに対する様々な意見を持つことがある.しかし,俯瞰で試合を見ている観戦者とフィールド上で実際にプレーしている選手とでは視点が全く異なるため,得られる情報には大きな違いがあるはずである.そのため,俯瞰で見ている観戦者側の意見が必ずしも正しいとは限らない.サッカーの分析では映像データやトラッキングデータを用いたものが多い.いずれもフィールド全体の情報を取得できるので,選手の位置や動き,チームの戦術等の特徴量の分析や全体像を把握するのに適している.しかし,これらのデータはサッカーコートの外(または上)から取得する必要があり,選手が得る情報というよりは,観戦者が得る情報に近いと考えられる.そのため,選手のプレーをより詳しく分析するためには,試合中の選手が実際に取得している情報を理解する必要がある.本研究では,以上の理由から,試合中の選手がどのような視覚情報を取得しプレーしているのかを検証する.本レポートの構成は以下の通りである.まず,2 節で使用データについて説明した後,3 節で選手の視覚情報の取得方法,およびその可視化システムについて説明する.また,4 節では選手の視覚情報を踏まえたパスの分析を行う.最後に5 節では,本研究の分析の意義および今後の展望を述べる.","excerpt_src":"はじめに"},{"id":"2021_soccera_1_55","year":2021,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"軌道予測に基づいたオフボールの得点機会を創出する選手の評価","members":"寺西真聖，筒井和詩，武田一哉，藤井慶輔(名古屋大学)","first_author":"寺西真聖","affiliation":"名古屋大学","code":"[口頭]サッカー3","abstract":"オフボール状態の選手が得点機会創出に与える影響を定量的に評価するため、軌道予測により生成した基準となる動きと実際の動きを比較するC-OBSOフレームワークを提案した。グラフ変分再帰型ニューラルネットワークを用いた軌道予測により、選手の実際の動きが予測された動きとどのように異なることで得点機会が創出されたかを評価することが可能になった。","methods":["深層学習","ニューラルネットワーク","因果推論"],"themes":["選手評価","得点予測"],"data":["イベントデータ","トラッキングデータ"],"free_tags":[],"awards":["サッカー部門 優秀賞"],"text_insufficient":false,"excerpt":"計測技術の発展を背景に、様々なスポーツの実際の試合の動きに関するデータが利用可能になり、戦略や評価への活用が期待されている。例えばサッカーにおいては、選手とボールの位置が記録されたトラッキングデータを用いて、走行距離やスプリント回数など、選手個人のコンディショニング指標として、現場では利用されることが一般的である。一方で、サッカー自体は計22 人の選手とボールが複雑に相互作用しながら自チームの得点を狙い(または失点を防ぐ)競技であり、シュートやアシストなどボール周りのスタッツ情報を除いて、一般にチーム戦術や選手の評価を定量的に行うことが難しいと考えられている。サッカーにおける攻撃選手の定量的評価の研究については、大まかにはボール保持状態(オンボール)と非保持状態(オフボール)に分けられる。前者について、ドリブルやパスなどのアクションデータを用いて学習した得点予測器に基づき、得失点の期待値の変化からプレーを評価する方法(例:[2])がある。他にも、シュートに至る過程のパスや有効攻撃などを評価する方法があり、例えば得点期待値や成功難易度との関係によりパスの価値を評価する研究[4] がある。後者の評価については、全選手とボールの位置データから得点に関わるポジショニング自体を評価する方法がある。例えばオフボール得点機会(OBSO)と呼ばれるボールを受け取る選手を評価する研究[5] や、スペースを作る動きの評価[3] の研究が行われている。しかし、これらのアプローチにはそれぞれ課題がある。従来の得点予測に基づく評価手法(例:[2])は、試合全体では希少な事象を予測するため評価が安定しない点[6] や、得失点に至るまでの多様なプレーの評価が困難な点に問題がある。OBSO[5] は、ボールを保持せず、受け取らない(実際は味方のために戦術的に動く)その他の攻撃選手の評価が難しく、得点の評価値に守備者の位置が反映されていない。さらに共通の課題は、典型的な(あるいは予測された)動きと比べて、どのように動いたことが得点機会の創出に寄与するかを明らかにすることが難しい点である。そこで本研究では、軌道予測により生成された基準となる動きを実際の動きと比較することで、オフボールの得点機会を創出する選手を評価するC-OBSO(Creating Off-Ball Scoring Opportunity) を提案する。提案手法ではまず、OBSO の枠組みにある得点予測器を、複数の守備者の位置を混合ガウス分布で考慮したポテンシャル得点モデルに置き換え改善する。次に、正確に選手間の関係性をモデル化し長期軌道予測可能な、グラフ変分再帰型ニューラルネットワーク(GVRNN)[7] を用いて軌道予測を行い、OBSO の評価値の実際の値との差を評価することで、基準となる予測された動きと比べて、どのように動いたことが得点機会の創出に寄与したかを定量的に評価する。本研究の新規性は、(i) 集団スポーツの攻撃におけるオフボール選手が、基準となる予測された動きと比べて、どのように動いたことが得点機会の創出に寄与するかを評価した点、(ii) 得点予測器として、複数の守備者の位置を混合ガウス分布で考慮したポテンシャル得点モデルを提案した点、(iii) GVRNN を用いて予測した軌道を基準となる動きとみなし、実際の評価値との差分で評価を行った点、(iv) 実験において、C-OBSO の評価が全18 チームとの得点との関連やある1 試合の例を用いて、直観に合うことを示した点、の4 点である(i-iii は図1 に対応)。図1本研究の概要。ii とiii の図は[5] と[7] を編集した。","excerpt_src":"はじめに"},{"id":"2021_softtennisa_1_57","year":2021,"dept":"ソフトテニス部門","dept_detail":"ソフトテニス部門","title":"ソフトテニスにおけるポジションごとの失点状況の可視化と分析","members":"薮隆司，⼭本渉太，伊藤正彦(北海道情報大学)","first_author":"薮隆司","affiliation":"北海道情報大学","code":"P1-18","abstract":"シングルスの試合において、得点選手が打った瞬間の失点選手のポジション、ボールのコース、球種の関係を可視化分析した。基本的な待機ポジションはセンターラインで、バックハンド側のコースへの対応が弱点である傾向が明らかになった。","methods":["可視化","ネットワーク分析"],"themes":["守備","ポジショニング","戦術分析"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"ソフトテニスをプレイヤーの視点から見た際、得点を取った選手と失点をした選手でのポジションの違い、あるいは、ポジションとコース、球種との組み合わせが失点に関係している場合があることを理解することが戦略上重要であると考えられる。これらの分析はソフトテニスの戦略に活かせると考えられるため可視化し検証を試みる。本稿では、得点を取った選手(得点選手と呼ぶ) が得点を決めたときのボールのコースと球種、このボールを打たれた瞬間の失点した選手(失点選手と呼ぶ) のポジションに着目して分析を行う。実際に得点選手がボールを打った際に失点選手がいた位置を可視化し考察する。","excerpt_src":"はじめに"},{"id":"2021_softtennisa_1_28","year":2021,"dept":"ソフトテニス部門","dept_detail":"ソフトテニス部門","title":"ソフトテニスにおける選手のプレー範囲と姿勢推定による特徴抽出","members":"榎本賢，塚原帝成，三家礼子(早稲田大学)","first_author":"榎本賢","affiliation":"早稲田大学","code":"[口頭]ソフトテニス1","abstract":"試合映像データを用いて、ソフトテニス選手のプレー範囲と打球時の姿勢情報から選手ごとの特徴を抽出した。カーネル密度推定と主成分分析により、勝率の高い選手はコート前方のプレー範囲が広く、打球時のフットワークにおいて高周波成分を示すことが明らかになった。","methods":["画像認識・姿勢推定","次元削減","カーネル密度推定","可視化"],"themes":["選手評価","ポジショニング","守備"],"data":["映像データ"],"free_tags":[],"awards":["ソフトテニス部門 優秀賞"],"text_insufficient":false,"excerpt":"近年,スポーツにおいて映像分析の需要が大きく拡大している.従来までは感覚や経験に頼るしかなかったスポーツの指導方法だが,映像技術の発達とそれを活用する様々な分析手法の提案により.客観的な指標に基づいた指導が出来るようになった.実際に,野球などをはじめとする多くのプロスポーツチームでは映像分析を専門とするアナリストを雇用し,分析に役立てている.また,スポーツの映像分析は選手やプレーの分析以外にも,ビデオ判定といった審判補助に利用されることも少なくない.今までテニスやソフトテニスの映像分析に関する研究においては,選手の動きやボールの軌跡を自動的に記録する手法の研究や,それらを追跡した上で試合 ・ プレー状況の判別,予測を行うような研究が数多く行われてきた.例えば,安徳ら[1]は選手の追跡を行い,かつ選手領域の画像特徴量からその選手のフォアハンドやバックハンドの判定を行う手法を提案した. また,清水ら[2]は選手の姿勢情報を用いて打球方向を予測することを可能とした.しかし,試合中の選手の動きを比較して選手ごとの特徴を抽出する研究などは十分になされていないことに着目して,本研究では映像分析を用いて,コート上のプレー範囲と打球時の姿勢情報という 2 つの視点から選手ごとの特徴を可視化,抽出することを目的として分析を行った.","excerpt_src":"はじめに"},{"id":"2021_softtennisa_1_51","year":2021,"dept":"ソフトテニス部門","dept_detail":"ソフトテニス部門","title":"ソフトテニス実業団選手の確信度と得点率の関係","members":"藤田崚介，廣津信義(順天堂大学)","first_author":"藤田崚介","affiliation":"順天堂大学","code":"選外","abstract":"ダブルフォワード対ダブルフォワードの試合において、レシーブのコース予測に対する確信度と得点率の関係をロジスティック回帰分析で検証した。確信度が1段階高くなると得点率は1.21倍になることが明らかになった。","methods":["ロジスティック回帰","統計的検定"],"themes":["得点予測","選手評価","戦術分析"],"data":["映像データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"オープンスキルとは、絶えず変化する外的な状況に対応して発揮されるスキルのことである2)。ソフトテニスは、一打ごとに相手やボールの動きに対応しなければならないためオープンスキルが多く発揮されるスポーツ種目である。そのため相手の打つコースを素早く知覚する、といったスキルが求められる。ソフトテニスにはダブルフォワードと呼ばれる陣形が存在する。ダブルフォワードは二人ともネット付近に位置取らなければならないため、相手の返球がこちらに到達するまでの時間が短い。そのため素早い選択反応が求められる陣形といえる。選択反応時間に関連する研究として板谷ら(2020)は、行動選択における確信度がより高ければ、運動プログラムの発射準備を十分にすることができ、これにともないパフォーマンスも向上すると考えられる1)、と述べている。このことからソフトテニスにおけるダブルフォワードにおいても確信度が得点と関係しているか検証することでソフトテニス関係者にとって有益な知見が得られると予想される。","excerpt_src":"はじめに"},{"id":"2021_tta_1_33","year":2021,"dept":"卓球部門","dept_detail":"卓球部門","title":"卓球のラリーの視認性への再生速度の影響について","members":"矢澤明喜子，沼田泰英(信州大学)","first_author":"矢澤明喜子","affiliation":"信州大学","code":"P2-21","abstract":"卓球ラリー動画の再生速度変更が視認性に与える影響を被験者実験で調査した。再生速度が遅いほど誤答率が低い傾向が見られ、スロー再生により観戦者のラリー理解が向上することが示唆された。","methods":["深層学習","ニューラルネットワーク","時系列解析"],"themes":["試合の流れ","ルール変更","育成・指導"],"data":["映像データ"],"free_tags":["視認性"],"awards":["ポスター部門 優秀賞"],"text_insufficient":false,"excerpt":"一般に, あるスポーツを初めて観戦する場合, ルールを詳しく知らない, その試合の展開がわからないため見どころを見失う, その競技の速度に目がついていかないなど, 様々な障壁があり, そのスポーツの面白さを体験するに至らないことがある. このような障壁を取り除き, 普段そのスポーツを観戦しない人にもわかりやすくする工夫が, テレビ中継などではされてきた. 例えば, 伝統的に行われている, ハイライトとなるプレイのリピート再生やスロー再生はその一つであるし, 実況者の他に解説者をおき試合の流れを噛み砕いて説明するというのも工夫の一つであると考えられる. また, 近年では, 試合中に様々なスタッツ(データ) を表示する(例: J リーグ) ことや, ルールが複雑な競技では反則が起こるたびに起こった反則とその後の一般的な戦略などの試合のセオリーを表示する(例: ラグビーWC)ことなど, 様々な工夫がされるようになってきている.卓球は, 中学校の保健体育の指導要領解説でもネット型競技として取り扱うスポーツの一例として取り上げられていることもあり, 卓球自体を多くの人が知っており, そのルールも基本的なものについては説明の必要はないと思われる. しかしながら, 卓球のラリーでは, 選手が非常に短い間隔で球を打ち合っており, また, 一つのラリー内でその間隔は変化する(第2.3 節参照) 卓球の試合での一番の魅力はそのラリーにあると思われるが, その速さ故そのラリーを目で追うのは難しいことも多い. そこで, 本研究では, 試合の映像を素人にも楽しめるようにする工夫のうち, 特に,スロー再生について考察をする.本研究では, 動画をスロー再生した場合にラリーの視認性は上がるのかについて調査をする. そのため以下の様な実験を行った: 1 ラリー毎に切り分けた動画を用意する.これらの動画を被験者に視聴してもらい. どちらがそのラリーで得点したかと思うかについて回答してもらう. 回答を集計し, 誤答率を視聴の難度の指標とする.なお, 貸与されたデータには, 各ラリーの開始時刻と長さを表す項目があり, それに従い動画の切り分けを行った.この方法で切り分けた動画には, 概ね, サービスのモーションからラリーレフェリーが点数をコールするまでの映像が含まれていた. ラリーの勝敗の判別が付きレフェリーが点数をコールするまでの間は, 選手の表情などから勝敗を読み取ることができる可能性があるので, その間は画面全体をマスク(ブラックアウト) 処理を行い音声のみとなるように加工した. 勝敗が決まったタイミングの判定には, 第2節で説明する音声情報を用いた方法で自動的に行った.本稿の構成は以下の通り: 実験に使用する動画を作成するにあたり, 作業を自動化するために, 音声データを用いたデータ解析を行った. 第2 節では, その際行った音声データを用いたデータ解析について述べる. 第3 節では, 動画の再生速度を変更した場合に, 視認のしやすさがどの様に変化するのか考察するために, 行った実験について述べる.謝辞. 本研究は, 『情報· システム研究機構統計数理研究所医療健康データ科学研究センター』,『日本ペイントホールディングス株式会社』の支援を受け行われたものです.","excerpt_src":"はじめに"},{"id":"2021_tta_1_49","year":2021,"dept":"卓球部門","dept_detail":"卓球部門","title":"女子ダブルスにおけるポイント獲得別に見た戦術分析の提案","members":"山内大空，松本侑樹，澤田智紀，梅木隆哉，三井寛斗，廣津信義(順天堂大学)","first_author":"山内大空","affiliation":"順天堂大学","code":"P2-22","abstract":"女子ダブルス試合における得点パターンをコース別に分析した。ラリーミス由来の得点が77%を占め、バックハンド側でのミスが多いこと、深いボールでのラリーが有効であることが示された。","methods":["統計的検定","指標開発","可視化"],"themes":["戦術分析","得点予測","ポジショニング"],"data":["イベントデータ","映像データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年、日本の卓球選手の競技レベルが上がっている。実際に、東京 2020 オリンピック競技大会において女子シングルスで伊藤美誠選手が 3 位、男子団体で 3 位、女子団体で 2 位、 混合ダブルスで水谷隼選手 ・ 伊藤美誠選手ペアが 1 位という結果であった。2017 年には T リーグが始まり、世界でもトップレベルの卓球リーグとなっている。さらに、T リーグという卓球の国内リーグが 2017 年4 月の設立された[1]。T リーグでは 「世界No.1 の卓球リーグを実現する」、 「卓球のスポーツビジネス価値を高める」、 「卓球を通じて人生を豊かにする」 の3 つの理念を掲げている[2]。このように卓球の競技レベル向上を目指すための組織がある。","excerpt_src":"はじめに"},{"id":"2021_tta_1_52","year":2021,"dept":"卓球部門","dept_detail":"卓球部門","title":"利き腕およびサービスの第1・第2 バウンド位置と回転タイプに着目した卓球の得点傾向の可視化","members":"高松直輝，伊藤正彦(北海道情報大学)","first_author":"高松直輝","affiliation":"北海道情報大学","code":"P2-23","abstract":"サンバースト図を用いて卓球サービスの利き腕とバウンド位置、回転タイプごとの得点パターンを可視化した。サービス側がサイドスピンで得点する傾向が強く、バックサイドへのショートサーブが有効であることが示唆された。","methods":["可視化","統計的検定","指標開発"],"themes":["戦術分析","得点予測","ポジショニング"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"卓球をプレイヤー視点から見たときにどのようなサーブをするかが得点を撮るうえでは1 番大事だと考えられる。そこで、卓球のデータを可視化させることによってどのようなことが見えてくるのか検証を試みる。本稿では、サービスの打った種類と得点先に着目することで分析を行う。実際に、サービスとレシーブの利き腕、サーブのバウンド位置別にサービスの種類が何回使われているのか、そしてそのサーブの結果、サービスとレシーブのどちらが得点を取れているのかを可視化し考察する。前年度の第10 回スポーツデータ解析コンペティションでは積み上げ棒グラフを作成し、サービスとレシーブのどちらが得点を取れているのかを可視化し考察した。しかし棒グラフではどちらが多く得点しているのかがわかりにくかった(図1(a))。例えば図1(a) を見ると(Side)(逆サイドスピン)の棒グラフではSV(サービス)が得点した数とRV(レシーブ)が得点した数がほぼ同じに見えてしまいどちらが多く得点しているのかがすぐにはわからない。棒グラフの作成時にサービスとレシーブのどちらがポイントを取得したかの比率をはっきりと見るために縦軸の範囲は統一していなかった。そのため、件数が多いものも少ないものも同じ高さに見えてしまっていた。今回は積み上げ棒グラフではなく円グラフを階層的に用いたサンバースト図を用いて、可視化し考察した(図1(b))。このサンバースト図を用いることで第2 バウンド位置ごとにSV とRV どちらが得点しているか、そしてその得点の中でもどの球種が得点しやすいのかが分かりやすく表示することができる。","excerpt_src":"はじめに"},{"id":"2021_tta_1_66","year":2021,"dept":"卓球部門","dept_detail":"卓球部門","title":"骨格情報を考慮に入れたサーブの有効性に関する階層ベイズモデリング","members":"桃﨑智隆，鈴木海友，齋藤健(東京理科大学)","first_author":"桃﨑智隆","affiliation":"東京理科大学","code":"P2-25","abstract":"骨格推定と階層ベイズロジスティック回帰を用いてサービスの有効性を分析した。バックスピンやショートサーブの得点率が低く、ロングサーブが有効であること、レシーブ打法がサービス成功率に影響することが明らかになった。","methods":["ベイズ統計","階層モデル","画像認識・姿勢推定"],"themes":["選手評価","戦術分析","得点予測"],"data":["映像データ","トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"卓球などのいくつかの球技では,主にサーバーが得点の流れを支配する.よって,強烈なサービスからの3,5 球目まででポイントが決することが多い.事実,今回提供いただいたデータでも5 球までの得点は約8 割にも達する(表1 参照).また,サーバーとレシーバの得点割合5% の差に留まっているが,これをサービスから5 球目以内の得点に限定した場合には,この差が10% 弱程度まで広がる.このことからもサービスからの短いラリーにおいては基本的にはサーバー有利であることが分かる.","excerpt_src":"はじめに"},{"id":"2021_tta_1_19","year":2021,"dept":"卓球部門","dept_detail":"卓球部門","title":"卓球の試合全体に対する3次元座標推定","members":"香川渓一郎(早稲田大学)，成塚拓真(立正大学)，山本健(琉球大学)，山崎義弘(早稲田大学)","first_author":"香川渓一郎","affiliation":"早稲田大学","code":"[口頭]卓球1","abstract":"異なる視点から撮影された卓球試合映像からOpenPoseとDLT法を用いて選手の3次元姿勢座標を推定した。構築した可視化システムにより、選手の運動範囲や卓球台との位置関係を定量的に把握できることが実証された。","methods":["画像認識・姿勢推定","次元削減","シミュレーション"],"themes":["選手評価","戦術分析","ポジショニング"],"data":["映像データ","トラッキングデータ"],"free_tags":[],"awards":["卓球部門 優秀賞"],"text_insufficient":false,"excerpt":"試合における卓球選手の動きの定量的な把握を目的とし、同じ試合に対する2 つの異なる視点から撮影された映像に基づく、選手の3 次元姿勢座標の取得を試みた。まず映像から選手の2 次元姿勢座標を抽出し、2 つの映像に対する同期処理を行った後、DLT(Direct Linear Transformation) 法により選手の3 次元姿勢座標を推定した。そして、この結果を提示するための可視化システムを構築し、3 次元姿勢座標に基づく選手の運動解析を行った。1.2研究背景・研究動機深層学習に基づく、画像に映る人物に対する姿勢抽出技術は近年めまぐるしく進展している。姿勢抽出技術はスポーツデータ解析においても重要である。これまでのスポーツデータ解析コンペティションでは、フェンシングの2 選手が映し出された動画の各フレームに対して2 次元姿勢抽出が行われ、得られた姿勢データに基づいて、選手の攻撃・守備体勢の時間変化が解析されている[1]。また卓球においても、同様の2 次元姿勢抽出データに基づくサーブの分類・球種予測などが行われている[2, 3]。以上のように、これまで報告されている姿勢抽出による解析は2 次元にとどまっている。今回卓球部門で提供された動画の中に、同じ試合を別の視点で撮影したチーム動画とオフィシャル動画の2 種類の動画があったため、これらを用いることで2 次元映像から選手の3 次元姿勢座標を推定することを試みた。近年、BlazePose を始めとする1 つの視点から3 次元姿勢座標を推定する機械学習モデルが開発されているが[4, 5]、本解析では選手だけでなく卓球台も含めた試合全体の3 次元座標の推定を試みる。","excerpt_src":"はじめに"},{"id":"2021_tta_1_44","year":2021,"dept":"卓球部門","dept_detail":"卓球部門","title":"ディープラーニングによる卓球試合動画からのレシーブ打法分類とスイング解析への応用","members":"仲宗根慎太，吉田成帆，北島栄司，宮田龍太(琉球大学)","first_author":"仲宗根慎太","affiliation":"琉球大学","code":"[口頭]卓球2","abstract":"BlazePoseで抽出した卓球選手の関節座標をLSTMで分析し、レシーブ打法を86%の精度で自動分類するシステムを構築した。映像分析の自動タグ付けによる効率化が実現し、スイング軌跡の可視化による選手フォーム改善への応用が可能となった。","methods":["深層学習","ニューラルネットワーク","画像認識・姿勢推定"],"themes":["選手評価","戦術分析","打撃"],"data":["映像データ"],"free_tags":[],"awards":["卓球部門 最優秀賞"],"text_insufficient":false,"excerpt":"日本卓球界では,トップ選手の練習環境に映像分析の導入が進められている.日本ペイントマレッツの池袋晴彦コーチは,試合動画をパソコンの分析ソフトに取り込み,1プレーごとにサーブやレシーブそれぞれの回転やコース,ラリーの連続回数などを細かく記録してプレーの傾向をあぶり出し,選手に自身のプレーを客観視させることで技術習得の効率化を図っている[1, 2].しかし,現在これらの記録はすべて手作業で行われているため労力が大きく,全プレーに対するタグ付けを実現するにはAI· 機械学習による自動化が必須である.実際,第10 および11 回スポーツデータ解析コンペティション卓球部門で提供されたデータでは,サーブ· レシーブに続く第3 球目以降の返球に関する情報は動画のみで,タグ付けはなされていなかった. AI· 機械学習による卓球レシーブ打法タグ付けの先行事例として,台の側面から撮影したラリー練習の動画からいま選手がフォアハンドとバックハンドのどちらを打ったか自動分類するシステム[3] がある.ただし,上記はあくまで練習動画のみに対する簡易的な試みなので,選手の動作が練習よりも格段に速い試合動画には適用困難であると予想されることと,このシステムではドライブやプッシュといった詳細なレシーブ打法までは特定できていないことが課題であった.さらに,今年度提供されたデータはオフィシャル動画· チームカメラ動画いずれも卓球台の後方から撮影された試合動画であるため,普段コーチ陣が見慣れている形式の動画で分析できるシステムが求められる.そこで本研究では,卓球の試合動画に選手が打ったレシーブの種類を自動でタグ付けするシステムを機械学習で構築した.具体的にはまず,動画内に写った人物の肩や肘,手首といった関節の位置を検出する姿勢推定モデルを用いて,試合動画から選手の各関節座標を取得する.次にディープラーニングを用いて,姿勢推定モデルで取得した選手の各関節座標からレシーブの種類を分類する仕様になっている.このシステムを応用すると,試合動画から選手の動作を自動で抽出できるため,例えば選手がドライブを打った際のスイングの軌跡を可視化できる.そこから算出できるスイング長やスイング速度といった特徴の中から得失点と相関のある情報を発見できれば,選手のフォーム改善に繋げられる可能性があると考えている.","excerpt_src":"はじめに"},{"id":"2021_judoa_1_11","year":2021,"dept":"柔道部門","dept_detail":"柔道部門","title":"柔道における日本人選手の戦術タイプ分類と特徴分析","members":"森本直紀，瀬尾隆(東京理科大学)","first_author":"森本直紀","affiliation":"東京理科大学","code":"P2-26","abstract":"柔道の世界大会における日本人選手を対象に、技と指導のタイミング・回数から主導権の指標を設定し、階層的クラスタリングと主成分分析により4つの戦術タイプに分類した。速攻タイプ、惜敗タイプ、粘り勝ちタイプ、試合巧者タイプが抽出された。","methods":["クラスタリング","統計的検定"],"themes":["選手評価","戦術分析","試合の流れ"],"data":["イベントデータ"],"free_tags":["主成分分析"],"awards":[],"text_insufficient":false,"excerpt":"テーマ・目的柔道の世界大会において, 日本人選手はメダルを獲得することが当たり前に思えるほど良い結果を残している. そこで, 日本人選手を抽出して戦い方を分類し, 分類に影響を与える特性と分類ごとの特徴を主成分分析とクラスター分析により分析する.","excerpt_src":"本文冒頭"},{"id":"2021_judoa_1_29","year":2021,"dept":"柔道部門","dept_detail":"柔道部門","title":"物体検出技術YOLOを用いた柔道における固技自動検出システムの作成","members":"鷲見輝久，高木優輝，三家礼子(早稲田大学)","first_author":"鷲見輝久","affiliation":"早稲田大学","code":"[口頭]柔道1","abstract":"物体検出技術Scaled-YOLOv4を用いて、柔道試合映像から固技が自動で検出できるか検証した。モデルの精度はmAP@[0.50:0.95]で0.84を達成し、電光掲示板との時間差を平均1秒以上短縮できることが示された。","methods":["深層学習","ニューラルネットワーク","画像認識・姿勢推定"],"themes":["選手評価","試合の流れ"],"data":["映像データ"],"free_tags":[],"awards":["柔道部門 最優秀賞"],"text_insufficient":false,"excerpt":"柔道には、ポイントを能動的に獲得する手段として多くの技が存在しており、それらは大きく分けて投技と固技の2 種類に分類される。これらのうち、固技のポイント獲得の流れは、1技が決まっているか審判が目視で確認、2決まっていると判定された場合はカウントが始まる、3そのまま押さえ込みが続けばその後の秒数で一本か技ありかが決まる、というものになっている。しかし、実際の試合では技が決まってからカウントが始まるまでに若干のタイムラグが存在しており、これは審判の判定が目視であることと、カウントのスタートが手動によるものであることの 2点に起因していると考えられる。本研究では、このタイムラグが一分一秒を争うアスリートにとって非常に重大なものであると考え、物体検出技術を用いて試合映像から固技が自動で検出できるか検証する。また最終的には、固技が決まった瞬間を自動で判定するシステムの作成を目的とする。","excerpt_src":"はじめに"},{"id":"2021_judoa_1_39","year":2021,"dept":"柔道部門","dept_detail":"柔道部門","title":"柔道の組手と試合結果の関連性","members":"山元玲，川村陸哉，伊藤海央音，山本義郎(東海大学)","first_author":"山元玲","affiliation":"東海大学","code":"[口頭]柔道2","abstract":"世界選手権大会男子100kg級の試合を対象に、組手で掴む場所と試合結果の関連性をロジスティック回帰分析とクラスタリングで検証した。左手で相手の右肩を掴む回数が多いほど勝利に影響し、左肩を掴むことが負けに影響することが明らかになった。","methods":["ロジスティック回帰","クラスタリング"],"themes":["戦術分析","選手評価","勝敗要因"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"1 対1 のスポーツである柔道には組手が存在し,試合時間のなかでこまめに組手が変わる.その組手には何かしら階級や選手ごとに特徴が存在する.対戦相手ごとに組手の特徴を理解していていれば,対策をとることができ,相手の好む組手をさせないことや勝ちに影響している組手をすることができ,そうすることで戦績を向上させることができると考える.データ提供いただいた World Championships Seniors Baku 2018の試合に対して,組手のデータを独自に収集し,組手で掴んでいる場所や時間と勝敗との関係性を明らかにし、組手の傾向を調べることを目的とする.","excerpt_src":"はじめに"},{"id":"2021_judoa_1_43","year":2021,"dept":"柔道部門","dept_detail":"柔道部門","title":"柔道における判定場面の自動抽出及び技の自動分類","members":"曽根侑斗(東京理科大学)，小柴春樹(東海大学)，中川智之(東京理科大学)，小林正弘(東海大学)，田畑耕治，松澤智史(東京理科大学)","first_author":"曽根侑斗","affiliation":"東京理科大学","code":"[口頭]柔道3","abstract":"試合映像から柔道の技の自動分類システムを提案した。骨格推定により審判の判定動作を認識し、YOLOで選手を検出、VGG16の転移学習で投技と固技を分類した。大分類の精度は正解率0.958、F値0.925を達成した。","methods":["深層学習","ニューラルネットワーク","画像認識・姿勢推定"],"themes":["選手評価","試合の流れ"],"data":["映像データ"],"free_tags":[],"awards":["柔道部門 優秀賞"],"text_insufficient":false,"excerpt":"スポーツ分野において,エンターテインメント性の向上,戦略構築,選手のパフォーマンス向上など,データ活用・分析の需要が高まっている.特に柔道においては,「心・技・体」の一つである技が重要な要素の一つになっており,相手の体を不安定にする「崩し」や技を施すのに適切な間隔や姿勢をとる「作り」,作った一瞬に最後の決め手を施す「掛け」など,技だけでも多くの要素を含んでいる.しかし,試合中の技を解析するためには,技をデータとして手動で記録する作業や目視による技の種類の判別が必須であり,時間とコストがかかってしまう.そこで本研究では,試合動画データより技シーンの抽出から技名表示までを全自動化するシステムを提案する.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_1","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"Pacific League において若手野手が頭角を表すまでに必要な打席数とその指標","members":"石井伴直，真田猛，小泉和之(横浜市立大学)","first_author":"石井伴直","affiliation":"横浜市立大学","code":"P2-01","abstract":"2009-2016年にPacific Leagueにドラフト指名された若手野手130選手を対象に、1軍でのBreakout（OPS150が0.700を超えた初期の打席）に必要な打席数と、その直前の2軍成績の特徴を分析した。主成分分析とロジスティック回帰分析により、Breakout直前に2軍で安定して長打を打つことが、1軍でのBreakoutの主要な予測因子であることを明らかにした。","methods":["ロジスティック回帰","統計的検定"],"themes":["選手評価","育成・指導"],"data":["公式成績データ"],"free_tags":["主成分分析"],"awards":[],"text_insufficient":false,"excerpt":"日本プロ野球(NPB) において, ドラフト指名を受けて入団した若手野手は, 通常1 軍で頭角を表すまでに数年を必要とする. 特に, 高卒選手では入団後早期に1 軍に定着するケースは稀であり, 頭角を表すまでの数年間は2 軍での出場を中心に, 1 軍との行き来をしながら選手の育成が行われることがほとんどである.毎年新人選手が入団するチームにとって, それぞれの選手に対してどれだけの打席数を立たせると1 軍定着や選手能力のピークに達することができるのかについては, 関心ごとであると想定される. アメリカではメジャーリーグ(MLB) において, 下部組織であるマイナーリーグでの成績を用いて若手選手の将来を予測する先行研究が存在する(例えば[1]) が, 日本においては同様の研究は報告されていない.そこで, 本研究では年齢やポジションを加味して, 1 軍での頭角までに必要な打席数や, 1 軍に上げるべき判断ができる成長の指標を明らかにする. これにより, 若手選手の汎用的な成長過程を明らかにし, 今後の若手選手の育成計画へ役立てることを目指す.なお, 本研究では若手選手が「頭角を表すこと」を「Break- out」と呼ぶこととする.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_2","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"プロ野球におけるカウント2-0までの配球と3球目見せ球の評価","members":"鈴木翔子，橋本真弥，矢崎友貴乃(横浜市立大学)，岩崎学(統計数理研究所)","first_author":"鈴木翔子","affiliation":"横浜市立大学","code":"P2-02","abstract":"2018-2020年のプロ野球データを用いて、カウント2-0に追い込むための投球戦略と、その後の見せ球の有効性を分析した。傾向スコアマッチングを用いた結果、見せ球を使用しない方が高い確率でアウトにできることが示された。球種とコースごとに見逃し率とスイング率を分析し、有効な投球戦略の指針が明らかになった。","methods":["統計的検定","因果推論"],"themes":["投球・配球","戦術分析"],"data":["イベントデータ"],"free_tags":["見せ球","カウント戦略"],"awards":[],"text_insufficient":false,"excerpt":"プロ野球において,バッテリーは常にカウント状況やイニングあるいは走者状況など,多くの条件が組み合わされた状況で綿密な作戦立てが求められる.カウントに注目すると,例えば,カウント有利では見せ球を使って外したり,カウント不利では思い切って直球勝負をしたりなどの状況選択が存在する.まず,カウント別に各打撃指標の数値がどう変化するか,表1 と表2 に示した.表1カウント(S-B) 別の各打撃指標カウント打率長打率出塁率0 - 0 .334 .548 .347 0 - 1 .346 .587 .349 0 - 2 .363 .655 .365 0 - 3 .421 .759 .926 1 - 0 .315 .476 .325 1 - 1 .330 .515 .335 1 - 2 .338 .554 .340 1 - 3 .368 .670 .731 2 - 0 .147 .194 .153 2 - 1 .170 .232 .176 2 - 2 .189 .271 .195 2 - 3 .217 .329 .468表2カウント状況別の各打席指標カウント打率長打率出塁率S 先行.199 .281 .207平行.268 .415 .276 B 先行.300 .498 .477表1 のカウント別の各打席指標の打率に着目すると,ストライクカウントが2 のとき打率が低く,それ以外は3 割以上の打率となることがわかる.打率以外の長打率,出塁率も同様の傾向にある.そのうち,ボールカウントが0 である2-0 のとき,全指標が最も小さい値をとる.これらから,先に2 ストライクを取ることで得点につながる打席結果を防ぐことができる.本研究では,カウント2-0 に着目し,バッテリーが打者を打ち取るための最適な判断を検討する.第2 節でデータについてまとめ,第3 節でどのように2-0 に追い込むか考え,2-0 に追い込んだ後の効果的な選択を考察する.最後の第4 節でデータ分析に基づく私たちの提案を述べる.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_4","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"打者の身長によるストライクゾーンの変化がもたらす投手への影響","members":"北野雄也，松田眞一(南山大学)","first_author":"北野雄也","affiliation":"南山大学","code":"P2-03","abstract":"2018年のセ・パ両リーグデータを用いて、打者の身長によるストライクゾーン定義の変化が投手に与える影響を調べた。全投手を対象にした回帰分析の結果、相手打者の身長が増すにつれて投球の高さが上昇することが明らかになった。一流投手の個々分析では、ほとんどの投手が身長による影響を受けておらず、ストライクゾーンの変化に対応できていることが示された。","methods":["回帰分析"],"themes":["投手起用","戦術分析"],"data":["イベントデータ"],"free_tags":["ストライクゾーン定義","散布図分析"],"awards":[],"text_insufficient":false,"excerpt":"本研究の目的は打者の身長によって変化するストライクゾーンが,投手に対して影響をもたらしているかを調べることである.その投手への影響が分かれば,選手の強化やチームの戦略に繋がるであろう.私はスコアブックをつけながら試合観戦をするほどの野球の大ファンであるが,野球において身長が何かに影響をもたらしているのではないかと気になった.野球は他のスポーツと比べて,選手の身長の違いが取り上げられていないように思う.当然,身長の低い打者や投手の活躍は注目されているが,サッカーやバスケットボールのようには取り上げられていないであろう.また,これに関する研究も私の知る限りでは行われていない.こうしたことから,本研究を行うことに決めた.冒頭において,ストライクゾーンが打者の身長によって変化すると述べたが,それはストライクゾーンの定義から明らかである.ストライクゾーンの定義は「打者の肩の上部とユニフォームのズボンの上部との中間点に引いた水平のラインを上限とし、膝頭の下部のラインを下限とする本塁上の空間をいう。」とある.(日本プロフェッショナル野球組織・全日本野球協会[1] より)つまり,打者の肩や膝頭がストライクゾーンを決めることから,ストライクゾーンが打者の身長によって変化することがその定義から分かる.打者の身長によるストライクゾーンの変化の影響の対象は打者,投手ともに考えられるが,本研究では投手への影響を調べたい.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_5","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"プロ野球における空振り三振を奪うための配球について","members":"稗田涼真，宿久洋(同志社大学)","first_author":"稗田涼真","affiliation":"同志社大学","code":"P2-04","abstract":"2018-2020年の規定打席到達打者94人を対象に、空振り三振を奪うための配球戦略を分析した。階層的クラスタリングで打者タイプを5分類し、ロジスティック回帰の一般化線形混合モデルを用いた結果、1球前との投球位置変化と球速差、フォークが空振り確率を高める主要因であることを明らかにした。特に1球前で空振りした打者への連投が有効であることが示された。","methods":["クラスタリング","ロジスティック回帰","統計的検定"],"themes":["投球・配球","戦術分析"],"data":["イベントデータ"],"free_tags":["打者タイプ分類"],"awards":[],"text_insufficient":false,"excerpt":"野球において勝利をおさめるためには,失点をしないことが重要であり,そのためには,守備側が攻撃側に進塁を許さず,打者又は走者をアウトに取ることが求められる.打者をアウトにする手段は主に,ゴロアウト,フライアウト,三振の3 つである.中でもゴロやフライによってアウトを成立させるためには,守備力や運が必要となる(Martin, 2019).ゴロやフライによってアウトが成立したとしても「進塁打」や「犠飛」など走者が次の塁に進む可能性があり,失点につながる恐れがある.一方で,三振はゴロアウトやフライアウトに比べて,守備力や運に左右される可能性が低く,走者が進塁する可能性も低い.以上から,三振を奪うための戦略を考えることは打者をアウトにする上で重要と考えられる.打者からアウトを奪う上で重要なことは,投手がどのコースにどのような球種のボールを投げ込むかということである.光廣ら(2012) では,「投球のコースと球種の組からなる一連の流れ」を配球と定義しており,本研究でも同様に定義する.野球は投手の投球によりプレーが再開される特徴があるため,戦況を有利にするために配球を検証することは重要であるとされている(菊地ら, 2010).バッテリーは投球時のイニングやカウント,打者の特徴など様々な要素を考慮し,次に投げる球を決めている.配球に関しての知見は蓄積されている.例えば,アウトなし又は1アウトで走者が1 塁の場合,バッテリーは左打者に対して,ダブルプレーを誘発させるために外角の球を中心に選択し,打者に球を引っ張りにくくさせようとする傾向にあることが明らかになっている(Yoshihara and Takahashi, 2020).このように,試合状況や打者の特性ごとに,投手が投げる球には配球パターンが存在すると考えられる.なお,例えば内角高めの速球を投げた後に,外角低めのスライダーを投げることが効果的な場合があるなど,配球は前に投げられた投球を考慮して組み立てられる必要があると考えられる,しかし,前の球を考慮して配球を分析した研究は少なく,関連研究においても将来的な研究の課題として挙げられている(Yoshihara and Takahashi, 2020).特に,三振はストライクカウントを3 つとる必要があり,打者から三振を奪うには,前後に投げる球を考えながら配球を組み立てる必要がある.しかし,前の投球が考慮された三振を奪うための具体的な配球に関する研究は限られている.三振には見逃し三振と空振り三振の2 種類の手段が存在する.2 ストライク時にストライクゾーンに投げなければ成立しない見逃し三振と違って,空振り三振は,ゾーンを問わずに打者をアウトとすることが可能である.そのため,前に投げられた投球を踏まえると,見逃し三振よりも空振り三振の方が様々な配球が考えられ,その中でも空振り三振をさせやすい配球,逆にさせにくい配球の特徴がわかれば,配球が組み立てやすくなると考えられる.よって,本研究では空振り三振に着目する.以上から本研究では,プロ野球において空振り三振を奪うために必要な配球の組み立てを,1 球前に投げられた投球を考慮して明らかにする.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_10","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"OW推定量を用いたNPBにおけるスクイズ戦術の有効性の検証","members":"一井亮吾，宿久洋(同志社大学)","first_author":"一井亮吾","affiliation":"同志社大学","code":"P2-05","abstract":"2018年のNPBシーズンデータを用いて、スクイズ戦術がランナー3塁の場面での得点確率に与える影響をOW推定量を用いて検証した。傾向スコアによる共変量調整の結果、スクイズを行った場合、行わなかった場合に比べて得点獲得の確率が26.4%高いことが示された。OW推定量はIPW推定量より共変量調整が安定していることが確認された。","methods":["因果推論","統計的検定"],"themes":["戦術分析","打順・采配"],"data":["イベントデータ"],"free_tags":["スクイズ","オーバーラップウェイト","傾向スコア"],"awards":[],"text_insufficient":false,"excerpt":"メジャーリーグでは,1970 年代頃からさまざまなデータを駆使して,野球の采配の妥当性などが議論されるようになった.1990 年代に成績が低迷していたオークランド・アスレチックスがセイバーメトリクスを積極的に採用し,選手の獲得や評価を行い地区優勝3 回,毎年プレーオフに進出するまでにチーム力の強化に成功した(鳥越, 2014).このセイバーメトリクス(SABRmetrics)のセイバー(SABR) とは,Society of American Baseball Research の頭文字をとったもので,打率などの比較的単純な統計に基づいた定性的な方法ではなく,詳細なパフォーマンスデータを用いて野球の試合を分析することである(Beneventano et al., 2012).このセイバーメトリクスを用いることで,OPS (On-base plus slugging) などの選手の能力を適切に評価している新たな指標や,多様な采配や戦術の効果を統計的に評価することが可能になりつつある.本研究では特に野球における戦術や戦略におけるセイバーメトリクスの活用に焦点を当てる.野球の試合において実行される, または考えられる戦術は多種多様である. しかしそれらの戦術のほとんどは選手や監督の経験や知識に基づいて行われ, データに基づいた有効性や妥当性の検証が行われていないことが多い. 実際,野球における有識者の間でもその有効性については必ずしも同じ意見であるとは限らない.このような意見の分かれる戦術の一つに,バントを用いた戦術の有効性が挙げられる.送りバント戦術の有効性について解析している研究には傾向スコアを用いた送りバントの有効性を示した研究(中村et al., 2016)や無死1 塁での送りバントに焦点を当てた研究(Ken et al., 2011)など数多く見られるが,スクイズに焦点を当てた研究はあまり見られない.そこで本研究では,スクイズに焦点を絞り,その有効性について解析していく.ここでの有効性とは,「その戦術をとることで,とらない場合に比べ得点を獲得する確率にプラスの影響を与えているかどうか」である.スクイズに関する先行研究として,Covariate Balancing Propensity Score を用いて有効性を測っている研究(中村et al., 2017)がある.この研究ではCovariate Balancing Propensity Score(Imai et al., 2014)を用いて,野球におけるスクイズという戦術が,得点を獲得する確率にどのような影響があるのかを推定している.単にスクイズ戦術をとった場合ととらない場合の二郡を比較すると,推定された影響に共変量の影響が含まれてしまい,適切な推定が行えないとここでは述べられている.そこで,傾向スコアを用いて共変量調整を行ったうえで推定を実施している.傾向スコアを推定するために,一般的に広く用いられているロジスティック回帰モデルとCovariate Balancing Propensity Score を用いている.その後,IPW 推定量を用いて因果効果を推定し,両者を比較しており,CBPS を用いた推定の方が安定して推定できていることが示されている.また,スクイズは得点確率を上昇させることを明らかにしている.スクイズの判断を支援することを考えた場合,スクイズの判断に迷うケースでスクイズを行うことがどの程度有効なのかが分かることが望ましい.しかし,上記の研究で因果効果を推定する際に用いられているIPW 推定量では,傾向スコアの逆数を重みとして扱うため,極端な傾向スコアが得られるケース(例えばスクイズがまず考えられない,無死2,3 塁で打率3 割を超える打者が打席に立った場合など)が重視されてしまう.そのため,実際に判断が必要な場面において,スクイズが有効かどうかを判断する場合に,IPW 推定量は必ずしも有効とは限らない.そこで本研究では,傾向スコアを用いて共変量調整を行ったうえで因果効果の推定量として,OW 推定量(Li et al., 2018)を用いて,スクイズが,得点を獲得する確率にどのような影響があるのかについての分析を行う.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_12","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"シミュレーションによる選手評価と短期決戦の予測","members":"奥田守，田村彰汰，佐野和幸，入江佳輝(東京理科大学)，土田潤(同志社大学)","first_author":"奥田守","affiliation":"東京理科大学","code":"P2-06","abstract":"打者の役割別評価指標としてOPRを提案し、シミュレーション検証を行った。FIPと投手起用を用いた二項ロジスティック回帰モデルにより、短期決戦の勝敗予測を実施した。投手力のみで勝敗をある程度予測できることが示されたが、打撃力を加えても予測精度の向上は見られなかった。","methods":["シミュレーション","ロジスティック回帰","指標開発"],"themes":["選手評価","チーム評価","勝敗要因"],"data":["公式成績データ"],"free_tags":["OPR指標","FIP","短期決戦"],"awards":[],"text_insufficient":false,"excerpt":"プロ野球における打者の評価では,さまざまな側面からチームの勝利に貢献する選手を評価する指標が存在する.点を獲得するための打者の役割は「出塁能力を求められる打者」と「長打能力が求められる打者」の2 つに大別される.既存の打者を評価する指標の多くは,役割ごとに評価を考えている.これらの役割を1 つの指標で評価することは難しいが,例えば,On-base Plus Slugging(以下, OPS)は,総合的な打撃能力を評価する指標として広く使われている.ところが「長打能力が求められる打者」が高く評価されやすいという欠点がある.他にも2 つの役割を同時に評価する指標として,Weighted On-Base Average (以下,wOBA)やRuns Created(以下,RC)がある.これらの指標は,複数の打撃成績だけでなく,得点期待値や計算が複雑な補正値などを用いており,統計の知識が少ない一般的な野球ファンにとって指標の解釈が困難である.既存の指標には「2 つの役割を同時に評価する点」と「計算が単純で解釈が容易である点」を同時に満たすものが少ない.本研究では,これらを同時に満たす指標を提案する.選手個人の打撃能力評価は,長期戦では有用である.しかし,短期決戦においては,有用であるかはまだ十分にわかっていない.むしろ,投手力のほうが短期決戦を予測する上では重要である.例えば,2018 年から2020年にかけて日本野球機構(Nippon Professional Baseball Organization : NPB) で,3 年連続で日本一に輝いている福岡ソフトバンクホークス(ホークス) は2018 年から2020 年のチーム成績の中で,強みと言えるのは投手成績(防御率や失点,奪三振など) である.特に,2020 年シーズンはチーム投手成績(防御率:1 位,失点数:1 位,奪三振:1位) を収めてリーグ優勝し,短期決戦では一度も敗れることなく日本一に輝いた.また,短期決戦での投手起用は,軽い怪我をしても次のシーズンの成績に影響が少ないことや,中継ぎ投手の休養日を長期戦より確保できることから,怪我のリスクや消耗を恐れず大胆に采配することができる.以上より,チームの投手力によって短期決戦での勝敗予測が可能であるかを検証する.","excerpt_src":"研究背景"},{"id":"2021_baseballa_1_14","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"2020年中日ドラゴンズの投球データから分かる勝敗の決定要因","members":"小林祐人(東京理科大学)，近藤大(東海大学)，三谷駿輔，朝日弓未(東京理科大学)","first_author":"小林祐人","affiliation":"東京理科大学","code":"P2-07","abstract":"2020年シーズンの中日ドラゴンズを対象に、投球データから試合の勝敗を決定づける要因を決定木分析により明らかにした。2019年度と比較して、2020年度ではボールコース数が失点の主要判定基準となっており、ストライク先行の戦略が奏功していることが示された。過密スケジュール下での投手活用の工夫が可視化された。","methods":["機械学習"],"themes":["勝敗要因","投手起用","戦術分析"],"data":["イベントデータ"],"free_tags":["ストライク先行","投手起用戦略","決定木分析"],"awards":[],"text_insufficient":false,"excerpt":"近年のNPBにおいては「セイバーメトリクス」の考えが徐々に浸透している。それにより、2番に強打者を配置する、tRAといった守備陣や球場の広さ等を排除して投手個人の実力を測ろうとする指標を用いるなど、各球団が統計学的観点を重視している傾向が出てきた。 セイバーメトリクスにより、「チーム全体の得点力を上げ、失点を下げる」ことこそ勝利への鍵であると各球団が判断していることの表れであろう。しかし、2020年の中日ドラゴンズはチーム得点がリーグ最下位、チーム失点がリーグ4位という戦績にも関わらず、最終的な順位はリーグ3位と健闘している。これはセイバーメトリクスの観点から述べると矛盾した結果である。","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_17","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"ピッチャーの配球を考慮した部分再帰型ニューラルネットワークに基づくプロ野球打者の初球戦略の最適化モデルの提案","members":"谷畑耀，山下遥(上智大学)","first_author":"谷畑耀","affiliation":"上智大学","code":"P2-08","abstract":"部分再帰型ニューラルネットワークを用いて、投手の配球パターンと試合状況を考慮した打者の初球戦略を最適化するモデルを提案した。西武ライオンズの2018-2019年データで学習し、LightGBMとの比較により、提案モデルがより高い予測精度と戦略的有効性を示すことが明らかになった。","methods":["深層学習","ニューラルネットワーク","機械学習"],"themes":["打撃","戦術分析"],"data":["イベントデータ"],"free_tags":["PRNN","初球戦略"],"awards":["ポスター部門 奨励賞"],"text_insufficient":false,"excerpt":"近年,野球の試合をより有利に進めるため,また,勝利する確率を上げるための打者に対する支援に関して,様々なアプローチが提案されている[1].打者にとって難しい意思決定の1 つとして投手が打者に投じる1 球目(初球)に対して積極的にバットを振っていくべきのなのか,慎重にボールを見極めるべきなのかの戦略が挙げられる.そのため,状況(アウトカウント,イニング,ランナーの有無,相手チームの情報,初球を打ったのか打たなかったのか)の変化を考慮しながら,初球に対して最適な戦略を提示する方法が求められる.また,この方法によりチームに勢いをもたらす,打率や長打率を向上させるといった効果が期待される.これまでの研究で,初球の重要性に関する議論は存在する[2].しかしながら,実際の試合の中で初球に対してどのようなアプローチを取れば試合を有利に進められるのかを明らかにするための数理モデルは提案されていない.そこで本研究では,配球や状況を考慮して打撃結果を予測するモデルを構築し,初球から積極的にバットを振っていくのか,いかないのかを変化させ,打席結果に対して好ましい戦略を決定するモデルを提案する.ここで,打者の意思決定の材料となりうる投手が投げる配球は,前の時点での配球による結果の影響に大きく影響される時系列の構造を有しているものと考えられる.また,状況や前打者までのプレイに依存して試合の流れが大きく変化し,最適なプレイは変化するものと考えられる.よって,これらの要因および初球の戦略を入力として,打席の結果を精度よく推定することができれば,場面場面で初球の対応がわかり,チームの攻撃力アップを期待することができる.本研究では,初球に対して積極的にバットを振るかどうかを決定するために,時系列データを含む複雑な入出力データの関係を精度よく推定するためのモデルを提案し,最適な選択を支援する方法を構築することを目的とする.このような複雑な状況において精度の良い予測を実現するための手法としてニューラルネットワーク(NN[3])が幅広く活用されており,時系列データを分析するための再帰型ニューラルネットワーク(RNN[4])が存在する.また,近年ではNN とRNN を組み合わせた部分再帰型ニューラルネットワーク(PRNN[5])が提案されている.これを組み合わせることで,本研究ではPRNN の枠組みを基礎とした高性能な予測器を構築することができ,さらに投手が打者に投じる1 球目(初球)に対して積極的に打つべきなのかを最適化することが可能となる.本研究では,実際のプロ野球のデータを用いて学習データおよびテストデータに分割したうえで,モデルの精度を確認する.また,提案モデルを活用した場合(初球からバットを振っている場合といない場合の両方の予測値)を算出し,妥当性および有効性をLightGBM と比較し考察する.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_18","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"日本プロ野球における新たな投手評価手法の提案","members":"近藤大(東海大学)，朝日弓未(東京理科大学)","first_author":"近藤大","affiliation":"東海大学","code":"P2-09","abstract":"勝敗記録以外の指標を用いた投手評価手法を提案することを目的に、2020年シーズンのデータを用いて決定木分析と重回帰分析を実施した。フライ数と投球コース別の球数が年俸上昇の主要判定基準であることが示された。ただし重回帰分析の精度は限定的であり、従来の勝敗記録指標との統合が必要であることが示唆された。","methods":["回帰分析","機械学習"],"themes":["選手評価","年俸・契約"],"data":["イベントデータ"],"free_tags":["投手評価指標","決定木分析"],"awards":[],"text_insufficient":false,"excerpt":"2021年度の日本プロ野球では,昨年度に続き,多くの球団で経営が悪化したことが報告されている.2019年度までは,セントラルリーグとパシフィックリーグ共に過去最高の平均観客動員数を記録した.しかし,2020年度では試合数削減,またここ2年間では一部の球団では無観客試合になった期間もあることから,図1より経営面が厳しい状況はしばらく続くと考えられ,選手の年俸や補強などで大きな影響を及ぼすことが考えられる.図1:平均観客動員数推移主にプロ野球では,チケット収入が,主な収益としてもたらしており,その次に放映権収入やスポンサー収入と,売上として計上している.これを本来であれば,選手年俸やチーム運営費,スタッフの給与,施設運営費に活用することとなる.楽天イーグルスが2017年度には138億円の売り上げを記録した際の,観客動員数は177万人であった.ホーム試合は71試合もしくは72試合であるため,大きく減少していることが言える. 楽天をはじめとするプロ野球のみならず,JリーグやBリーグのように,パートナー収入に重きを置くチームも存在するが,これまで観客がいて,成り立っていたものが,2020年度シーズン以降では,通用しなくなっている状況である.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_31","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"盗塁の有効性について","members":"神前虎太郎，山辺優樹，小立竜輝，森裕一(岡山理科大学)","first_author":"神前虎太郎","affiliation":"岡山理科大学","code":"P2-10","abstract":"2018~2020年のデータから盗塁の有効性を検証した。盗塁成功率が高い場合に得点期待値が上昇し、特に打撃力の低いチームにおいて有効な戦術であることが確認された。早い投球数での盗塁がリスク低減に有効であった。","methods":["回帰分析","統計的検定","指標開発"],"themes":["走塁・盗塁","勝敗要因","戦術分析"],"data":["イベントデータ","公式成績データ"],"free_tags":["セイバーメトリクス"],"awards":[],"text_insufficient":false,"excerpt":"近年,セイバーメトリクスの観点より,盗塁はそのリスクの大きさから有効性が疑問視されている (たとえば, 「戦えスポーツ内閣」,2021/01/02)。しかし,たとえば,OPS(長打率と出塁率を足したもので,総合的な打撃力を評価する指標)とチーム順位の関係を見てみると(図1),長打率や出塁率を上げることが順位を上げることにつながる可能性が見て取れる。ここに着目すると,長打が少ないチームにおいては,打撃によらない進塁を考えることが,1つの戦略ととらえることができる。このことから,打撃によらない進塁, すなわち,盗塁で得点圏にランナーを進めることで,弱点である打撃力を補え,打撃力の低い球団は勝ち数増加につながると考えられる。そこで,提供されたデータ(Data Stadium Inc.,2018 ~2020)をもとに,得点期待値,投球数別盗塁成功率,盗塁得点要因の 3 つの観点から,盗塁の有効性について考察を行う。","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_32","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"インコースへの投球の有効性に関する分析","members":"加藤優希，鈴木秀男(慶應義塾大学)","first_author":"加藤優希","affiliation":"慶應義塾大学","code":"P2-11","abstract":"インコース投球の効果を約73万球のデータで検証した。インコース使用時は打率を低下させ三振奪取率が約1割上昇する効果がある一方、四死球が増加するリスクがある。IPW推定量を用いた因果推論により効果を定量化した。","methods":["ロジスティック回帰","因果推論","統計的検定"],"themes":["投球・配球","戦術分析"],"data":["イベントデータ"],"free_tags":["傾向スコア"],"awards":[],"text_insufficient":false,"excerpt":"野球において配球を組み立てる際、アウトコースへの投球が基本とされている。 これは、 打者からの距離が遠く、 コンタクトしにくいため、 打たれる可能性を下げることができるからである。しかし、 アウトコースに投球を続けていると、打者は適応する。そこで有効になるのがインコースへの投球である。インコースに投球することで、打者に踏み込ませないようにしたり、 視点を変えたり、 詰まらせることができる。 しかし、 インコースへの投球は、死球のリスクがあること、 死球を恐れて真ん中付近の投球になり、 長打を浴びるといったリスクが伴う。そこで、 本研究では、 インコースへの投球による有効性や、効果的なインコースへの配球について明らかにしたい。","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_34","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"投手の連投と疲労モデルについて","members":"乕松実，横田大地，林修平，下村真帆，中川満(大阪市立大学)","first_author":"乕松実","affiliation":"大阪市立大学","code":"P2-12","abstract":"救援投手の連投疲労モデルをラッソ回帰で構築した。連投間隔の逆数と投球数の積が球速低下に影響し、特に短期間での連投が平均球速に悪影響を与えることが示唆された。","methods":["機械学習"],"themes":["投手起用","怪我・コンディション"],"data":["イベントデータ"],"free_tags":["疲労モデル","ストレート球速","ラッソ回帰"],"awards":[],"text_insufficient":false,"excerpt":"野球という種目は時代が進むにつれて変化している。それが顕著に見られるのが、投手の分野、救援投手についてである。かつての日本プロ野球では、先発投手が試合の最後まで完投するというスタイルがあったが、JFK をはじめ勝利の方程式という言葉が一般的になってきたように救援投手の重要性は年々増している。チームの勝利に繋げるいわゆる勝ちパターン、先発投手の早期降板後に試合を成立させるいわゆるモップアップ、試合の最後を締めるクローザーと役割も多岐にわたる。試合終盤の花形といっても差し支えないリリーフ投手であるが、毎試合登板することはできない。疲労の問題を考えなければならないからである。プロ野球でも疲労モデルが使われているだろうが、そのデータは当然公開されていない。そこで観戦者や対戦相手の立場で疲労を推定するモデルを観測可能なデータから構築することが必要だと考え、我々は投手の連投と疲労モデルについて研究した。2、分析手法今回は、救援投手についての疲労モデルを作成するために、ラッソ回帰を行い、30 分割の交差検証(CV)において MSE を最小化するモデルを選択した。 なお、ラッソパスにおいて特定の係数の絶対値が大きくなっている場合は、 このような変数を外していった。30 分割したのは、推定値の不安定性が起こる可能性を考慮し、MSE のばらつきをより正確に反映したかったからである。被説明変数として、WHIP や FIP、防御率などの投手の成績を評価するのに代表的な指標を使用することも考えたが、あくまで本分析の目的は救援投手個人のパフォーマンスに対する疲労の影響の分析であるため、各登板時におけるストレートの平均球速を使用した。説明変数の候補としては、まず、1~5 登板前におけるそれぞれの投球数とそのうちの変化球の投球数を用意した。また、各登板からの間隔について、各シーズン初登板等を処理するために逆数として加え、ネイピア数を利用して操作した変数も準備した。登板間隔の逆数と投球数の積も説明変数の候補として加えた。登板数の少ない投手は外れ値として作用する可能性が高いと考え、データ3年分の内30登板以上している選手に対象を絞った。以上のような投手の疲労を考慮するための説明変数に加え、 投手ID、 チームID、相手チーム ID を制御すべき変数として設定した。特に投手 ID について、疲労による球速の変動を観察するためには、各投手の 3 年間の平均的なストレートの球速が必要となるため、制約なしでモデルに組み入れるように設定した。以下、間隔iは i 登板前と当該登板日との日数間隔を表す。","excerpt_src":"本文冒頭"},{"id":"2021_baseballa_1_36","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"日本プロ野球の内野手におけるゴールデングラブ賞の評価特性と多角的検証","members":"飯田陸久，小林航，齋藤岳，白井康之(大東文化大学)","first_author":"飯田陸久","affiliation":"大東文化大学","code":"P2-13","abstract":"GG賞受賞者の要因を守備範囲、ファインプレー頻度、記者評価から多角的に分析した。二塁手と遊撃手ではセンター方向対応が重要だが、一塁手と三塁手では打撃面での活躍も受賞に寄与する可能性が示唆された。","methods":["自然言語処理","空間分析","指標開発"],"themes":["選手評価","守備"],"data":["イベントデータ","外部データ併用"],"free_tags":["ゴールデングラブ賞","形態素解析"],"awards":["ポスター部門 奨励賞"],"text_insufficient":false,"excerpt":"三井ゴールデングラブ賞(以下GG 賞とする)は選手の守備に関する名誉あるステータスとして確立されている。しかしながら、野球における守備の「上手さ」とは非常に抽象的な判断基準であり、様々な観点と野球に対する哲学が存在する中でどのようなプレーを上手いと定義するかは主観的な要素が大きい。 実際、GG賞は選手にとって大きな名誉であるにもかかわらず、受賞者の決定は記者投票によるもので、定量的かつ明確な基準は存在していない。本研究では、このようなGG 賞受賞に関連する要因を究明したいとのモチベーションから、提供されるデータから受賞者が推定可能かどうか検証を行った。守備範囲の分析のほか、ファインプレーの分析と試合での印象の 3 点から検証を行ったところ、守備範囲により受賞が説明可能な選手がいる一方で、守備範囲だけでは説明できない受賞者も見られた。これらの受賞者は、記者の印象に残るファインプレーの多さや、本来GG 賞とは直接的な関係のない打撃面での活躍が受賞に結び付いている可能性があるとの結果を得た。1.はじめに卓越した守備によりチームに貢献した選手に授与される GG 賞は、1972 年よりその前身であるダイヤモンドグラブ賞として始まり、1986 年より現在の名称となっている。GG 賞は新聞社・通信社・テレビ局・ラジオ局の現場取材経験5 年以上のプロ野球担当記者による投票で選定される賞であるため、授与されたプロ野球選手にとって名誉のある賞であり、プロ野球ファンにとっても現場を良く知る記者投票によって決まることから大きな期待がある賞となっている。しかし、現場取材経験が 5 年以上ある記者の鑑識眼は確かであるが、本当に卓越した守備で貢献した選手ばかりであろうか。近年、様々なセンシング技術やセイバーメトリクスと言われる統計解析法手法の発展により、選手の動きに関するデータが大量に蓄積されているため、各選手を様々な観点から評価が可能になったが、筆者らは以前より守備的観点よりGG 賞受賞者には共通点があるのか疑問に感じていた。そこで本研究では、内野手のGG 賞受賞者と候補者を対象としてGG賞を受賞可能とする要因を複数の観点から分析する。","excerpt_src":"概要"},{"id":"2021_baseballa_1_40","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"日本代表選手の選出方法の提案","members":"四條拓哉，山本義郎(東海大学)","first_author":"四條拓哉","affiliation":"東海大学","code":"P2-14","abstract":"セイバーメトリクス指標を用いて日本代表野手の最適な選出方法を提案した。出塁率と長打率に足の速さを組み込んだ回帰モデルの効果が実績を上回った。提案手法の方が約0.6点/試合高い得点期待値が得られた。","methods":["回帰分析","統計的検定"],"themes":["選手起用","チーム評価"],"data":["公式成績データ"],"free_tags":["セイバーメトリクス","変数選択"],"awards":[],"text_insufficient":false,"excerpt":"今年2021 年に東京オリンピックが開催され日本代表が金メダルを獲得したこともあり、日本代表チームには次回のWBC での活躍に大きな期待が寄せられている。招集される選手は代表監督を誰が務めているかで大きく変わり、その動向には各球団のファンが注目する。また、野球においては選手の優劣を判断する方法としてセイバーメトリクスなどの指標が使われているが、選手のタイプや求められる役割によって必要とされる能力は大きく異なるため、どの指標のが良いかについては多くの議論が行われている。本研究では様々な指標を効果的に用いた日本代表選手の野手の選出を目標とした。","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_45","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"先頭打者に対する「四球」の失点に与える影響","members":"池田泰大，五位渕巧，酒折文武(中央大学)","first_author":"池田泰大","affiliation":"中央大学","code":"P2-15","abstract":"ポアソン回帰を用いて先頭打者への四球と単打の失点期待値を比較した。打者タイプや打順を制御しても四球の失点期待値が単打より低いことが確認された。特に4番打者への四球は失点期待値が低い結果が得られた。","methods":["クラスタリング","統計的検定"],"themes":["戦術分析","打撃","勝敗要因"],"data":["イベントデータ"],"free_tags":["セイバーメトリクス","ポアソン回帰"],"awards":[],"text_insufficient":false,"excerpt":"野球のジンクスの1 つに「先頭打者に対する四球」問題がある. プロ野球を見たことがある人のほとんどは,「先頭打者への四球は良くない」という言葉を一度でも聞いたことがあるのではないだろうか.先頭打者への四球と単打を比較したものとして加藤・山崎(2008) がある. イニングの先頭打者に対して四球を出した場合と単打を打たれた場合の当該イニングの失点確率や失点期待値を比較し,単打を打たれた場合のほうが失点につながりやすいことを示している. しかしながら, 加藤・山崎(2008) は単純に確率や期待値を比較したものであり,そのイニングの状況を考慮には入れていない. 例えば, 次打者の状況や打順によりこの結果は異なる可能性がある.そこで本研究では, 投手側の視点から先頭打者に対する四球と単打による失点期待値を推定するとともに, それ以外の要因として何が影響しているかを探る. 本稿の構成は以下の通りである. 2 節では用いるデータと分析手法について, 次に3 節では分析結果について, そして4 節では考察と今後の課題について述べる.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_46","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"打撃結果からみる3-0カウントで有効な投球戦術","members":"久保諒平，佐藤浩志(明星大学)","first_author":"久保諒平","affiliation":"明星大学","code":"P2-16","abstract":"3-0カウント時の得点期待値を分析し、各選手の最適投球戦術を提案した。吉田選手は確実なストライク、鈴木誠也選手には四球が有効である等、選手ごとの最適戦術が異なることが明らかになった。","methods":["統計的検定","指標開発"],"themes":["投球・配球","戦術分析"],"data":["イベントデータ"],"free_tags":["得点期待値","打数クラスター"],"awards":[],"text_insufficient":false,"excerpt":"野球というスポーツはストライク・ボールカウントにより打者・投手の有利不利が変わる。例えば0 ボール2 ストライクではあと1 回ストライクを取ればよいので投手に有利であり、逆に3 ボール0 ストライク(以降3-0 とする) では投手はあと3回ストライクを取る必要があり、また1 つのボールで塁に出られてしまうという打者有利のカウントである。ここで注目したいのは3-0 の時である。野球の試合においてに基本的にスイングする打者は少数である。もちろんすべてのケースでそうしているわけではないだろうが、よく論じられている考えとして、3-0 では1 球見逃すというものがある。ボール球を見逃せば出塁できるという考えから見逃すべきという考えは理解できるが、実際の試合では確実にストライクゾーンに入っている球を見逃しているケースもよく見る。また、メジャーリーグにおいては不文律という形でも存在しておりスイングした打者に批判が及んだこともある。本稿では3-0 においての打者のスイングの有無及びスイングした球についてデータを収集し、投手が取るべき行動について分析を行う。","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_48","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"野球において「低めに集めろ」は正しいのか","members":"瀧柳祐介，小島颯介，高梨清宝，田尻航大，廣津信義(順天堂大学)","first_author":"瀧柳祐介","affiliation":"順天堂大学","code":"P2-17","abstract":"2018-2020年のNPBペナントレース全試合データを用いて、投球コース別の打率、長打率、空振り率などを分析した。ストレート投球では高めの方がカウント有利であり、変化球では低めの方が空振りを奪いやすいことが明らかになった。","methods":["統計的検定","可視化"],"themes":["投球・配球","打撃","勝敗要因"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"アマチュア野球の指導現場でよく 「低めに集めろ」 という指示がバッテリーに対して出されることがある。また、 野手の声掛けでも 「低めOK!」 などといった声掛けが出ることもある。それに対して高めに強いボールが行っても 「抜けている」 と表現されることが数多くある。日本の野球においては高めよりも低めの方が打たれる確率が低いという考え方が根強くある。一方、MLB では 2017 年前後のフライボール革命が確立されて以降、スイングのアッパー局面で低めのボールを狙って打つことがトレンドになりつつある。MLB の考え方が取り入れられつつある今、 「低めに集めろ」 という指導は適切な指示、 作戦と言えるのかということを中心に研究していく。","excerpt_src":"研究目的"},{"id":"2021_baseballa_1_71","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"ハーフスイングが空振り判定となる要件の解明","members":"大森翔貴，柳田幸佳，安井清一(東京理科大学)","first_author":"大森翔貴","affiliation":"東京理科大学","code":"P2-19","abstract":"2018-2020年の日本プロ野球データを用いて、ハーフスイングが空振り判定されるための要因を数量化II類で分析した。投球位置座標のY軸が低いほど、ストライク数が少ないほど、捕手歴が長いほど空振り判定されやすいことが明らかになった。","methods":["統計的検定","指標開発"],"themes":["ルール変更","投球・配球"],"data":["イベントデータ"],"free_tags":["ハーフスイング"],"awards":[],"text_insufficient":false,"excerpt":"近年,野球ではビデオ判定の導入に伴い,審判の判定に疑問の声が上がることが多くなった.2021年の MLB優勝決定シリーズ進出をかけたドジャース-ジャイアンツ戦では,明らかに振っていないと思われたものが空振り判定されファンからは非難が殺到した.ハーフスイングとは,打者がスイングを開始したが,ボール球あるいは打つべき球ではないと判断しスイングを途中で止める行為である.日本の公認野球規則では,ハーフスイングが空振りになるかどうかの基準には明確な定義がなく審判の判断に委ねられている.一方でハーフスイングに関する研究はほとんど存在しない.そこで本研究では,どのような時にハーフスイングが空振りとされるか検証を行った.また,審判によってハーフスイングの空振り判定に特徴があるのかも探った. 1.2研究の有用性空振り判定の要因が分かれば,打者と捕手のそれぞれにメリットが生まれる.例えば打者は,状況に応じて,バットを止めずに振り切るべきか判断できる.一方捕手は,空振り判定されやすい状況を作り出し,カウントを整えることができる.さらに審判においても,傾向をつかむことで打者がスイングを止めずに振り切るべきか,また捕手が判定を積極的に依頼するべきかを判断する手助けとなり得る.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_75","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"共分散構造分析を用いた野球における「勝負強さ」の探索","members":"田邊倭，板東蓉子，荒木由布子(静岡大学)","first_author":"田邊倭","affiliation":"静岡大学","code":"P2-20","abstract":"得点圏での打撃成功を「勝負強さ」と定義し、2018-2020年のNPBデータを用いてロジスティック回帰分析と共分散構造分析を行った。打力、限定打力、外部要因が勝負強さに影響し、特に直球打率と変化球打率の係数が大きいことが示された。","methods":["ロジスティック回帰"],"themes":["選手評価","打撃","勝敗要因"],"data":["公式成績データ"],"free_tags":["共分散構造分析"],"awards":[],"text_insufficient":false,"excerpt":"現在, 日本のプロ野球では, 各球団が優勝を目指しリーグを勝ち抜いていく過程の中で, 勝利に繋がる要因は様々である.勝利に繋がる要因の一つとして, プロ野球界におけるデータ解析が重要度を増してきている. プロ野球界におけるデータ解析の例として, データ解析を駆使して, チームの力を底上げする役目を担っている「ライブリッツ」という組織がある[8]. 導入球団である福岡ソフトバンクホークスは, 2020 年のプロ野球日本シリーズを制し, この球団は2017 年から 2020 年にかけて4年連続の日本一となった. この常勝軍団を支えたのがチームのデータ分析などを行うシステムを担当した「ライブリッツ」である. この組織が行っている内容として, 各選手の日々のスイングなどのフォームチェック, 対戦相手の情報を収集するスコアラー業務, 球団が選手を評価するためのデータ収集など多岐に渡る. 選手は自らの打撃や投球で修正するべき点があれば, iPhone などの電子機器を使用してこれらのデータを確認し, 対戦相手の配球や今の自分のフォームをチェックして実戦に反映できることで, チームの勝利に繋げている. 故に, プロ野球界におけるデータ解析はチームの勝利において, 重要度を増してきていることがわかる.本研究では, プロ野球における打者の 「勝負強さ」 を 「得点圏で打撃結果(単打, 二塁打, 三塁打, 本塁打, 四球)を残す力」と定義し, そして得点圏で打撃結果を残すためにはどのような要因が影響しているのかを明らかにしたいと考えた.プロ野球界において勝負強さを測る指標として, 試合解説や選手起用の判断材料としてよく用いられる得点圏打率がある[4]. 得点圏打率とは, 走者が 2 塁もしくは3 塁にいる時(得点圏) の打率である. ここで, 毎年更新される日刊スポーツ[12]のプロ野球得点圏打率に着目すると, 上位10名が毎年変動していた. それを参考に2019 年と 2020 年の年度別にプロ野球得点圏打率を上位10 名に絞ってランキングを作成した. 表 1.1, 表 1.2に着目すると, 2 年連続でランキング入りしている選手は西川表 1 2019 年度プロ野球得点圏打率ランキング表 2 2020 年度プロ野球得点圏打率ランキング選手と吉田選手の 2 名のみであり, 得点圏打率のみを「勝負強さ」の指標とするのではなく, データから別の指標を示す方法はないのかと考えた.これについての先行研究として, 選手がもたらした勝利確率の変化を集計し,その選手がどれだけチームを勝利に近づけたかを評価することが出来る「勝率付加値」と, あるアウトカウント, 走者状況が発生した後, そのイニングが終了するまでに1 点以上得点できる確率である「得点確率」の二つのセイバー順位選手名球団名得点圏打率1 森友哉西 0.411 2 中村剛也西 0.35 3 荻野貴司ロ 0.347 4 島内宏明楽 0.342 5 西川遥輝日 0.337 6 デスパイネソ 0.309 7 銀次楽 0.307 8 ブラッシュ楽 0.303 9 吉田正尚オ 0.301 10 源田壮亮西 0.297順位選手名球団名得点圏打率1 柳田悠岐ソ 0.369 2 西川遥輝日 0.358 3 吉田正尚オ 0.356 4 近藤健介日 0.352 5 栗原陵矢ソ 0.333 6 栗山巧西 0.33 7 大田泰示日 0.326 8 浅村栄斗楽 0.322 9 中村晃ソ 0.306 10 外崎修汰西 0.303メトリクス指標の相関関係を1969 年の MLB データと1970年の MLB データを用いて分析したCramer(1977) がある. Cramer(1977)は「もし勝負強い打者が本当に存在するのであれば, ある年に勝負強かった打者は次の年も勝負強いはずだ」と考えた. この研究の結果として, ナショナル・リーグの60 人の打者については, 最小二乗法によって推定された線形回帰直線と実データの当てはまりの良さを示す指標である決定係数が0. 038. アメリカン・リーグの62 人の打者については決定係数が 0. 055 となった. ここで, 翌年の勝負強さは前年の勝負強さでは 3. 8~5. 5%しか説明できないことを意味し, 勝負強さが存在するという考えとは矛盾するため, 勝負強さが存在しないのではないかという結論に至った. しかし, イニングや点差に対しての重み付けに加え, 選手個人の能力を示すセイバーメトリクス指標や, 球場の入場者数や相手投手の球速などの打者以外の要因も考慮する必要があるのではないかと考えた. そこで本研究では, プロ野球界における「勝負強さ」について, 得点圏打率だけではなく多視点で捉えるべきではないかと考え, 得点圏での「勝負強さ」に限定し, 新たな観点からこの抽象概念を明らかにしたい.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_27","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"降雨日における戦略と試合開催判断基準の提案","members":"山下璃久，榎本賢，澤井荘一郎，大平悠介，伴地芳啓，三家礼子(早稲田大学)","first_author":"山下璃久","affiliation":"早稲田大学","code":"[口頭]野球1","abstract":"プロ野球における降雨の影響を分析した。降雨中は打者有利となり内野安手が増加する傾向が見られた。また積算雨量3mm程度が試合遂行に影響する閾値であることが推測された。","methods":["統計的検定","時系列解析","可視化"],"themes":["戦術分析","球場要因","勝敗要因"],"data":["イベントデータ","外部データ併用"],"free_tags":["スポーツ気象","降雨影響","決定木"],"awards":["野球部門 最優秀賞"],"text_insufficient":false,"excerpt":"2021年は, 酷暑下で開催され, 競技者の暑熱対策が話題となった東京オリンピックや, 気象予報士に焦点をあてたNHK連続テレビ小説「おかえりモネ」の影響により, スポーツにおける, 選手パフォーマンス最大化や, 戦略・戦術の決定, 大会運営支援などについて, 気象分野からアプローチする「スポーツ気象」が大きな注目を浴びた. 株式会社ウェザーニューズは2015年からスポーツ気象サービスを提供しており, 2016年のリオオリンピックでは, ラグビーの試合において事前に降雨を予測し, チームの戦略を変更させたことで逆転勝利につなげ, 4強入りに導くことができたとされている[1]. 本研究では, プロ野球における「スポーツ気象」の事例として, これまで報告の少ない降雨との関連について検討する. 降雨によるプロ野球への影響は, 「プレーへの影響」と「試合遂行への影響」の大きく2点に分類される. これらの影響を分析し, 降雨日における戦略の提案や, 降雨日における試合開催判断の支援材料の提供を行う. 本研究の目的は, (1)降雨によるプレーへの影響分析を通して, 降雨日の戦略を提案すること, (2)降雨による試合遂行への影響分析を通して, 降雨日の試合開催判断を支援することである. 本研究の構成は以下のとおりである. まず, 第2章で降雨量データの作成方法を述べる. 次に, 第3章で降雨によるプレーへの影響を分析し, 降雨日における戦略を提案する. 次に, 第4章で降雨による試合遂行への影響を分析し, 試合遂行に影響をおよぼす降雨量を推測する. 次に, 第5章で過去に降雨コールド・ノーゲームと判断された試合における審判団の判断基準を可視化し, 将来的な, 降雨日における試合開催判断の支援材料を提供する. 最後に, 第6章で本研究の結論を述べる.","excerpt_src":"序論"},{"id":"2021_baseballa_1_35","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"集団学習モデルを用いた相性と好不調を考慮した投打における対戦成績の解析","members":"関健良，大井裕貴，阿部秀紀，齊藤史哲(千葉工業大学)","first_author":"関健良","affiliation":"千葉工業大学","code":"[口頭]野球2","abstract":"投打の対戦成績を予測する機械学習モデルを構築した。選手をクラスタリングで分類し、好不調を加重移動平均で定量化した。ランダムフォレストとBoruta法により、コンタクト率とボールスイング率が重要要因であることが明らかになった。","methods":["機械学習","クラスタリング","統計的検定"],"themes":["戦術分析","選手起用","選手評価"],"data":["イベントデータ"],"free_tags":["采配支援","SMOTE","主成分分析"],"awards":[],"text_insufficient":false,"excerpt":"昨今,セイバーメトリクスの指標に基づいて,野球における采配を考える研究が盛んに行われている中で,選手の交代のタイミングが采配において重要になりつつある.投手においては,分業制が進み,2010 年代中盤までは毎年30 人ほどいた規定投球回到達者が,2018 年から3 年連続で20 人を割るなど,先発投手だけでなく,中継ぎ投手に適切に交代することの価値が高まっている.野手においては,コロナウイルスの影響により,日本のプロ野球界では全試合9回までのルールと変更になったため,代打の起用が例年より多くなりつつある.代打は,試合結果を左右するイニング終盤の打席に用いられることが多く,その采配が試合の勝敗に大きく影響するため,重要な采配であることが明らかである.このように,昨今重要視されつつある選手の交代には,投打の対戦成績などを用いた対戦相手との相性や,その日や最近の調子の良し悪しなどが参考材料となる.対戦相手との相性において例を挙げると,村田選手(巨)は大野投手(中)を打率.071 と苦手としているが,マギー選手(巨)は打率.484 と得意にしている(2017).また,選手の調子においては,通算打率が3 割の選手でも,週によっては打率が1 割台の週もある.このように,対戦相手との相性や選手の好不調を評価した采配が求められる中で,各選手のその打席での期待度がわかれば,采配の支援ができると考える.そのため,上記の定量化の結果を用いて,予測モデルを構築し,各プレーを評価する.具体的には,特徴量の重要度評価手法として注目されているBoruta アルゴリズムを用いて重要な要因を解析する.最近では,機械学習によって予測モデルを作成しやすくなり,投打の結果を予測してきた研究もおこなわれるようになってきたが,主に投打の結果を用いていることが多い.本研究では,投球内容,打球内容から特徴量を求め,プレーの質的要素から相性,調子を評価した予測を構築し,采配の支援を試みる.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_41","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"プロ野球における投球選択へのマッチング法則の適用","members":"赤木克，桃﨑智隆，中川智之(東京理科大学)，小林正弘(東海大学)，松澤智史，田畑耕治(東京理科大学)","first_author":"赤木克","affiliation":"東京理科大学","code":"[口頭]野球3","abstract":"一般化マッチング方程式を投球選択に適用し投手の球種配分傾向を分析した。菅野選手はマッチング法則に従う一方、メッセンジャー選手はアンダーマッチングを示した。決め球の役割分化によりバイアスが生じることが示唆された。","methods":["因果推論"],"themes":["投球・配球","戦術分析"],"data":["イベントデータ"],"free_tags":["マッチング法則","行動分析","線形回帰"],"awards":[],"text_insufficient":false,"excerpt":"ヒトを含む動物の選択行動において,反応とその結果の間にはマッチング法則が当てはまることが知られている.Vollmer and Bourret (2000) はNational Collegiate Athletic Association Division 1 の98-99 シーズンにおける9 名の男子バスケットボール選手の得点成績に対してマッチング法則を用いて分析した.また,Kangas et al. (2009) はコンピュータとジャンケンをする場合における人の選択行動に対して一般化マッチング法則を適用した.中島(2013) では,実験的行動分析学の立場から選択行動におけるマッチング法則に関する解説がなされており,マッチング法則の様々な応用例がまとめられている.Cox et al. (2017) は,2014 年メジャーリーグにおけるpitch selection(投球選択)に対して一般化マッチング法則を用いて分析した.その結果,投手や捕手,投手コーチなど投球選択に複数の人が関与している可能性があるにも関わらず,一般化マッチング法則は投球選択をうまく表現した.この他にもイニングなどのゲームの状況によって速球を投げることに対する相対的な選択に影響を与えることが分かり,強化子のパラメータが変化している可能性を示唆した.本研究ではマッチング法則を日本のプロ野球の投球選択に適用し,各投手における投球傾向の比較・分析を行う.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_53","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"反実仮想シミュレーションを用いたチーム打撃戦略の効果検証","members":"中原啓，藤井慶輔(名古屋大学)","first_author":"中原啓","affiliation":"名古屋大学","code":"[口頭]野球4","abstract":"反実仮想シミュレーションを用いて、打者が試合状況に応じて打撃戦略を変更した場合の効果を検証した。機械学習による打撃能力ベクトル変換モデルを構築し、チーム打撃によって一定条件下でチームの得点が増加することを示した。","methods":["シミュレーション","機械学習","ニューラルネットワーク"],"themes":["戦術分析","打撃","チーム評価","打順・采配"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年では様々なスポーツの実際の試合のデータが利用可能になり、戦略立案や評価への活用が期待されている。その中でも野球は各場面が離散的であるため、試合中のプレーを記録・集計することが比較的容易であり、統計と相性が良い。その性質ゆえ、選手のパフォーマンスを定量的に評価する指標が数多く提案、活用されてきた。最近では目視の試合記録(例:ストライクやボールなどの投球結果、安打や四死球などの打席結果)だけでなく、打球速度や打球角度といったトラッキングデータに基づいた評価指標が用いられるようになり、チームや個人の戦略に大きな影響を及ぼす知見が得られている(例:フライボール革命)。統計学的観点から野球を分析するセイバーメトリクスでは、各プレーの重要度を勝利(得失点)への貢献度の大きさに基づいて定義する。選手の総合的な評価指標として広く用
