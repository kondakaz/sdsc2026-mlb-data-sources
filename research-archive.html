の判断材料として重要性が高まっている[4].よって,本研究では,勤続疲労や選手の年齢,打者の対策などを考慮した翌シーズンの投球パフォーマンス推移予測を行うことで,翌シーズンの投手のパフォーマンスに影響を与える要因を明らかにする.本研究は,以下の流れで分析を行う. 1. 投手を先発・リリーフの2群に分類する. 2. 投球パフォーマンスを示す指標を段階反応モデルによって抽出し,翌シーズンのパフォーマンス推移を算出する. 3. 先発・リリーフごとに,翌シーズン投球パフォーマンスに影響を与える要因を多項ロジスティク回帰分析を用いて考察する.本研究は,投手のパフォーマンス低下を防ぐための適切な起用法やトレーニング方法の提案に貢献する.また,選手の移籍や契約における意思決定をサポートするデータ基盤を提供することで,NPB 全体の競争力向上にも寄与する.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_21","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"日本プロ野球における球場の特性を考慮した選手の守備に関する評価指標","members":"渡邉啓大，寒水孝司(東京理科大学)","first_author":"渡邉啓大","affiliation":"東京理科大学","code":"[口頭]野球2","abstract":"打球座標と強さを考慮した打席単位での守備パークファクターを提案し、球場の特性を反映した選手評価を実現した結果、球場による補正により外野手の順位が大きく変動する場合があることが明らかになった。","methods":["指標開発","空間分析"],"themes":["守備","球場要因","選手評価"],"data":["イベントデータ","トラッキングデータ"],"free_tags":[],"awards":["野球部門 入賞"],"text_insufficient":false,"excerpt":"セイバーメトリクスの登場以後,プロ野球では,様々な指標を用いて選手の評価が行われている.多様な指標によって多面的に選手を評価することで,従来の経験則に基づく評価に比べて,適切に選手を評価することが期待される.適切な選手評価は,選手個人へのフィードバック利用だけでなく,チーム戦術の精緻化や,移籍市場の活発化などにも利用でき,チームや経営にも良い影響を与えることが期待される.しかし,既存の指標を直接用いると,チームの本拠地球場の影響を受け,選手個人だけでなく,チーム要因まで評価に含めてしまう可能性がある.実際,日本プロ野球におけるペナントレースでは約半数の試合がチームごとの本拠地球場で行わており,球場にはドーム型球場か屋外球場であるかや,人工芝か天然芝かなどの違いがある.これらの球場の特性の違いが,評価指標の値に影響を与えている可能性がある.日本プロ野球2021∼2023 シーズンを対象に,全球団の本拠地球場のポジションごとに守備機会数上位20 名を対象に平均守備率を算出した.ロジット変換した平均守備率を図1 にドットチャートで示す.ここで守備率は式(1)で定義される守備能力を測る指標である.守備機会数とは刺殺,捕殺,失策の機会の合計である.守備機会数−エラー数守備機会数(1)図1 より,平均守備率は球場ごとに異なっており,球場の特性による評価指標への影響が窺える.特に,外野手が球場ごとに異なる値を示している.以上より,球場ごとの特性を考慮しなければ,選手の適切な評価とは言い難いと考える.球場の特性の違いを表す指標として,パークファクター(以下,PF) がある.PF は球場ごとに算出され,注目する現象の起こりやすさを他球場と比較した指標である.しかし,佐治・小中(2023) が指摘するように,打席数が試合によって違うことの影響や,球場の形状の変化に関わらず年ごとに変化するという問題点がある.さらに,PFを算出したところで,直接,選手評価に結び付けること図1: ロジット変換した平均守備率が難しく,球場による影響を排除した選手評価に使用することは困難である.これは,PF が試合をまとめた結果に基づくのに対し,選手評価は打席ごとで算出された結果に基づくためである.この問題を解決するために,佐治・小中(2023) らは,ホームラン数に関するPF で打席単位での打者対(球場+ 投手)というモデルによる方法を提案し,年によるばらつきを小さくしたPF を提案した[3].しかし,この指標は打撃に関するPF であり,守備に関する指標としては適切ではない.そこで本研究では,選手評価の補正に利用できる守備に関するPF を提案する.具体的には,捕球位置や,打球の強さを考慮し打席ごとの結果を累積したPF を提案する.さらに,このPF を用いて,守備指標を補正する方法を提案する.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_91","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"Wasserstein Regression に基づいた打球方向分析","members":"鈴木碧月，阿部正柊，山下燿太郎，王子越，荒木由布子(東北大学)","first_author":"鈴木碧月","affiliation":"東北大学","code":"[口頭]野球3","abstract":"分布間回帰モデルであるWasserstein regressionを用いて、投手の被打球方向分布から打者の打球方向分布を予測するモデルを構築した。方向統計学のVon Mises分布により打球方向の確率分布を定義し、2023年データで実装した。予測分布から各ポジションの捕球可能確率を定量化して守備シフト最適化を実現した。","methods":["機械学習","回帰分析","クラスタリング"],"themes":["打撃","ポジショニング","戦術分析"],"data":["イベントデータ"],"free_tags":["打球方向"],"awards":["野球部門 入賞"],"text_insufficient":false,"excerpt":"野球における打球方向は,守備シフトを最適化し,チームの勝利に貢献するために重要である.また,守備シフトを考える上で,打者の打球方向傾向や投手のタイプ,球種,コースといった投手の情報が影響を及ぼす.例えば,レフト方向への打球が多い右打者であれば,レフト方向へ寄った守備シフトを敷いたり,投手が速球型であれば,打者が振り遅れることを予想し,守備陣は逆方向に寄った守備シフトを敷いたりする.このように,過去の対戦から各投手に対する各打者の打球方向傾向を把握することが重要である.しかし,打者と投手両者の情報を保持する上でデータ数に関する問題点がある.例えば,牧秀悟(打者) は,2023 年シーズンの中で,全打球方向データ数が939 と右打者で最多だったが,各投手ごとの打球方向データ数を調べると表1の通り最大でも38(vs 戸郷翔征(投手))とデータ数が減少する.ここからさらに球種やコース等限定的な試合状況で打球方向データを絞ると,データ数はより減少してしまう.","excerpt_src":"研究背景と目的"},{"id":"2024_baseballa_1_78","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"フロントドア・バックドア投球の判定およびその投球が有効となる特性","members":"三浦拓実，藤井慶輔(名古屋大学)","first_author":"三浦拓実","affiliation":"名古屋大学","code":"[口頭]野球4","abstract":"MLBデータを用いてXGBoostで変化球の横変化量を推定するモデルを構築し、日本プロ野球のドア系投球を判定した。並べ替え検定によってドア系投球と非ドア系投球のRun Valueを比較した結果、特定の投手と球種の組み合わせで有効性の差が確認された。","methods":["機械学習","統計的検定","因果推論"],"themes":["投球・配球","投手起用","戦術分析"],"data":["イベントデータ","外部データ併用"],"free_tags":["ドア系投球"],"awards":["野球部門 優秀賞"],"text_insufficient":false,"excerpt":"野球におけるフロントドア・バックドア(以降,ドア系投球)とは,ストライクゾーンの外側からストライクゾーン内へ変化する変化球のことである.そのうち,打者の内角に投じられたものをフロントドア,外角に投じられたものをバックドアと呼ぶ.投手は,打者がドア系投球をボールゾーンへの投球と誤認し,見逃しや振り遅れによる凡打となることを期待してドア系投球を投球する.その一方で,ドア系投球はコントロールミスによって,ストライクゾーンの中心付近の投球となって強打されたり,ストライクゾーンから大きく離れたボールや死球となったりするリスクがある[1].ドア系投球は一昔前の日本球界にはなじみのない戦術であったが,2013 年WBC のチャイニーズタイペイ戦で先発の王建民投手が,日本の四番の阿部慎之助選手をシンカーのフロントドアで見逃し三振に打ち取るなど6 回無失点の好投を見せたことや,2015 年にヤンキースから広島に復帰した黒田博樹投手がドア系投球を使用したことで話題となった.近年ではドア系投球を狙って投げる投手も増加し,「フロントドア・バックドア」という名称が日本のプロ野球中継でしばしば使用されるほど一般的な用語となった.これまで,野球の投球戦略に関するさまざま研究が行われてきた.外角直球が内角直球よりも効果的であることを明らかにした中原らの研究[2] はその一例である.しかし,ドア系投球の判定や,その有効性を検証する研究はこれまでされてこなかった.これは,ドア系投球の定義に変化球の変化量が必要であること,ドア系投球が意図されたものかを判断するために,投手がどこへ投球しようとしたかを示すデータが必要であること,ドア系投球が頻繁に選択される投球戦略ではないため,統計的な議論が難しいことが原因にあると推察される.そこで本研究では日本プロ野球のデータを利用してドア系投球を判定し,ドア系投球の採用可否の判断基準を明らかにすることを目的とした研究を行う.まず,ドア系投球を判定することが必要であるが,日本プロ野球のデータには変化球の変化量がないため,MLB の公開データを用いて投球の特徴から変化量を推定する機械学習モデルを構築する.次に,その推定された変化量を用いてドア系投球を判定し,前提条件の少ない並べ替え検定を用いてドア系投球と非ドア系投球の有効性の違いを検定する.最後に,ドア系投球と非ドア系投球の間に有効性の差がある例について,制球力やイベント発生率など一般的なスタッツに表れない特性と関連付けて考察する.これによって,ドア系投球を投球戦略として採用するかどうかの判断の基準を明らかにする.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_34","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"MMoE-AKTによる打者の複数能力同時推定","members":"岩本陸，鈴木秀男(慶應義塾大学)","first_author":"岩本陸","affiliation":"慶應義塾大学","code":"[口頭]野球5","abstract":"Knowledge Tracking手法とマルチタスク学習を統合したMMoE-AKTモデルを提案し、打者のコース・球種別能力値を同時に推定する手法を開発した。深層学習により打者の次打席ヒット確率を予測し、投手情報を含めたモデルの有効性を検証した。","methods":["機械学習","ニューラルネットワーク","深層学習"],"themes":["選手評価","打撃","投手起用","勝敗要因"],"data":["イベントデータ"],"free_tags":["Knowledge Tracking","マルチタスク学習"],"awards":["野球部門 最優秀賞"],"text_insufficient":false,"excerpt":"野球の打者のパフォーマンスを評価するためには,さまざまな指標が存在する.しかし,その多くが過去の実績に依存している.例えば,打率やOPSは打者の総合的な能力を評価するのに有効だが,各コースや球種ごとの得意 ・ 不得意を示す指標としては限界がある.さらにコース・球種別の打率は過去の結果の蓄積に過ぎず,次にそのコースに球が来た際の安打確率を保証するものではない. そこで本研究では,教育分野での学習者の能力値推定に使用されるKnowledge Tracing(KT)手法を打者データに適用する.これにより,従来のコース・球種別打者指標を超える新たな打者パフォーマンス評価指標を提案することを目的とする.","excerpt_src":"背景"},{"id":"2023_mlba_1_33","year":2023,"dept":"MLB部門","dept_detail":"MLB部門","title":"MLBのルール改正による攻守への影響 ~シフト禁止によるトレンドの変化~","members":"瀧柳祐介，二ノ宮碧(順天堂大学)，織田大志(富士ソフト株式会社)，廣津信義(順天堂大学)","first_author":"瀧柳祐介","affiliation":"順天堂大学","code":"P1-35","abstract":"2023年のMLBシフト禁止ルール改正の影響を分析した。左打者のゴロ打球成績、二遊間の守備、投手成績を比較したところ、ルール改正により左打者の打率やBABIPが上昇した一方、守備成績はほぼ全体で悪化し、グラウンドボールピッチャーの防御率も悪化した。","methods":["統計的検定","可視化"],"themes":["ルール変更","戦術分析","打撃","守備"],"data":["公式成績データ"],"free_tags":["シフト禁止","左打者"],"awards":[],"text_insufficient":false,"excerpt":"2010 年代中盤以降 MLB では打者の打球傾向に合わせて、野手をポジショニングすることがトレンドになっていた。その結果ゴロ打球でのヒットが生まれにくくなり、 打者はフライを狙って打つようになった。 投手はその対策として高めのコースにフォーシーム、低めにカーブ系のボールを投球し、三振を奪いにいく投球が主流となっていた。それらのトレンドによって本塁打数と三振数が増加し、インプレイの数が減少することになった。MLB 機構はインプレイ数の増加を目的として、2023 年から守備シフトを禁止することを決定した。本研究では守備シフトの影響を特に受けていた左打者のゴロ打球時の成績の変化、二遊間の守備の変化、投手の成績の変化を分析する。","excerpt_src":"研究目的"},{"id":"2023_mlba_1_2","year":2023,"dept":"MLB部門","dept_detail":"MLB部門","title":"先発投手の安定度について","members":"加瀬稔弥，山本義郎(東海大学)","first_author":"加瀬稔弥","affiliation":"東海大学","code":"P2-32","abstract":"2023年シーズンのMLB先発投手15名を対象に、複数試合のイニング数の移動合計に基づいて新たな移動平均手法を提案し、防御率の推移から投手の安定度を可視化した。イニング数を共通条件とした平滑化により、安定度の高い投手と低い投手の特徴抽出が可能となった。","methods":["時系列解析","可視化"],"themes":["選手評価","投手起用"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"2023年度のメジャーリーグベースボール(以下,MLB)は,日本野球と異なり,レギュラーシーズンが162試合あり,過密なスケジュールが組み込まれていて,北アメリカ大陸全域に球団があることにより⻑距離移動をする必要がある.それによって,各選手に身体への負担がかかり,怪我や故障のリスクも伴うのでコンディショニングの調整が重要となる.実際に,MLBの投手は,日本の投手よりトミージョン手術を受けているケースが多い.各球団では,怪我や故障のリスクを減らすために,トレーニングや予防を行なっているが身体全体,特に肘と肩を使ってプレーする投手がそれらを完全に回避することやシーズンを完走することは難しい. 投手には評価される指標として,安定性や実力を評価する防御率がある.防御率とは,投手が投げたイニングに対して,自責点の平均を表している.この数値はシーズンを通して低いほど安定していることがわかる指標である.畠山他(2022)では,投手のコントロールの良さを新たな指標を定義して,そのコントロールに関するスコアと防御率の相関を見ていたが相関関係は見られなかった.そこで,本研究では,先発投手の安定度を各試合の防御率に着目し、移動平均を用いて平滑化させることで,先発投手の調子の推移を見ていく.","excerpt_src":"はじめに"},{"id":"2023_mlba_1_73","year":2023,"dept":"MLB部門","dept_detail":"MLB部門","title":"投手・大谷翔平に対するRun Valueに基づいた打線編成","members":"金田大輝，江頭健斗，松澤智史，田畑耕治(東京理科大学)","first_author":"金田大輝","affiliation":"東京理科大学","code":"[口頭]MLB1","abstract":"大谷翔平投手の奪三振能力が高いという特徴に着目し、Run Valueに基づいて最適な打線編成を検討した。各場面ごとの得点期待値を算出し、大谷に対抗するには2番と4番にOPS高い打者を置くことが最適であることを示した。","methods":["シミュレーション","指標開発"],"themes":["打順・采配","選手評価","得点予測"],"data":["イベントデータ"],"free_tags":["大谷翔平"],"awards":[],"text_insufficient":false,"excerpt":"大谷選手はMLB の中でも屈指の投手であり, 打ち崩すことが難しいとされている. そのためにより効率的な打線を組む必要がある. 最適な打線を組むためには各場面(アウトカウント, ランナーの状況) において各イベント(単打,四球, 本塁打など) がどのような価値を持つのかを知る必要がある. 例えば初回は必ずランナーなしの状況で始まり, 打者は1 番から始まるので自ずと1 番打者にランナーなしの状況が多く回ってくる. つまりランナーなしの状況で得点期待値が高くなるようなイベントが1 番打者にとって必要とされる. このようなことを大谷選手がもつ特徴に焦点を当てながら実際のデータに基づいて数値化し, 1 番打者から9 番打者が各イベントに対してどの程度の価値があるのかを計算する. この際に用いる手法は, Tango et al. [1] と鳥越ら[2] を基にしている.","excerpt_src":"はじめに"},{"id":"2023_mlba_1_101","year":2023,"dept":"MLB部門","dept_detail":"MLB部門","title":"客観的総合指数から見る大谷翔平選手の客観的な凄さ","members":"助田一晟(東京大学)","first_author":"助田一晟","affiliation":"東京大学","code":"[口頭]MLB2","abstract":"客観的総合指数(OGI)という数理的背景に基づく統計指標を用いて大谷翔平選手の総合成績を評価した。2023年度の打撃OGIはリーグ6位、投手OGIは42位であり、OGIによる分析から打率とOPS関連指標が重視される傾向が示唆された。","methods":["機械学習","指標開発"],"themes":["選手評価"],"data":["公式成績データ"],"free_tags":["大谷翔平","客観的総合指数"],"awards":["MLB部門 優秀賞"],"text_insufficient":false,"excerpt":"スポーツの中で野球は特に成績指標が多く, 観戦初心者には理解するハードルが高い. かく言う私も, 大谷翔平選手をきっかけに見始め, 専ら彼の結果に一喜一憂するライト層である. このような初心者の疑問として「結局誰が凄いの?」というものがある. 手軽さを求め1 つの比較軸に落とし込みたいのだから当然情報は欠落してしまう訳だが, 「ホームランだけが正義」なのだろうか. はたまた, 見るべきは打率なのか. OPS なのか. *1そこで, このような状況で適した総合的な統計指標と思われる客観的総合指数(OGI)を利用し分析を行う.","excerpt_src":"背景"},{"id":"2023_baseballinfo_1_86","year":2023,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(野球)","title":"インフォグラフィック作品","members":"橋本晶輝，廣瀬真由子，山本由和(徳島文理大学)","first_author":"橋本晶輝","affiliation":"徳島文理大学","code":"I-01","abstract":"インフォグラフィック部門(野球)の視覚化作品。","methods":["可視化"],"themes":["選手評価"],"data":[],"free_tags":[],"awards":[],"text_insufficient":true,"excerpt":"","excerpt_src":null},{"id":"2023_baseballinfo_1_87","year":2023,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(野球)","title":"インフォグラフィック作品","members":"櫻田廣友美，久保杏実，齊藤瑠奈，石田彩夏，小泉もも，林邦好(京都女子大学)","first_author":"櫻田廣友美","affiliation":"京都女子大学","code":"I-02","abstract":"インフォグラフィック部門(野球)の視覚化作品。","methods":["可視化"],"themes":["選手評価"],"data":[],"free_tags":[],"awards":[],"text_insufficient":true,"excerpt":"","excerpt_src":null},{"id":"2023_baseballinfo_1_99","year":2023,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(野球)","title":"インフォグラフィック作品","members":"関根翼，南牟禮好香，松本陽太郎，松山柚太，青木裕美，酒折文武(中央大学)","first_author":"関根翼","affiliation":"中央大学","code":"I-03","abstract":"インフォグラフィック部門(野球)の視覚化作品。","methods":["可視化"],"themes":["選手評価"],"data":[],"free_tags":[],"awards":[],"text_insufficient":true,"excerpt":"","excerpt_src":null},{"id":"2023_judoinfo_1_6","year":2023,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(柔道)","title":"インフォグラフィック作品","members":"加瀬稔弥，張ミョウシン，矢島和花菜，山本義郎(東海大学)","first_author":"加瀬稔弥","affiliation":"東海大学","code":"I-04","abstract":"インフォグラフィック部門(柔道)の視覚化作品。","methods":["可視化"],"themes":[],"data":[],"free_tags":["指導","柔道"],"awards":["インフォグラフィック部門 最優秀賞"],"text_insufficient":true,"excerpt":"","excerpt_src":null},{"id":"2023_basketinfo_1_95","year":2023,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(バスケットボール)","title":"インフォグラフィック作品","members":"田地美月，廣瀬萌奈，竹内光悦(実践女子大学)","first_author":"田地美月","affiliation":"実践女子大学","code":"I-05","abstract":"インフォグラフィック部門(バスケットボール)の視覚化作品。","methods":["可視化"],"themes":["ポジショニング","選手評価"],"data":[],"free_tags":[],"awards":[],"text_insufficient":true,"excerpt":"","excerpt_src":null},{"id":"2023_basketinfo_1_96","year":2023,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(バスケットボール)","title":"インフォグラフィック作品","members":"中田果歩，鮎川萌梨，竹内光悦(実践女子大学)","first_author":"中田果歩","affiliation":"実践女子大学","code":"I-06","abstract":"インフォグラフィック部門(バスケットボール)の視覚化作品。","methods":["可視化"],"themes":["ポジショニング","選手評価"],"data":[],"free_tags":[],"awards":["インフォグラフィック部門 優秀賞"],"text_insufficient":true,"excerpt":"","excerpt_src":null},{"id":"2023_soccera_1_7","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおける敵陣ゴール前のワンタッチプレーとシュートの関係性の分析","members":"林拓未，黒木進，百武弘登(広島市立大学)","first_author":"林拓未","affiliation":"広島市立大学","code":"P1-14","abstract":"本研究では、J1リーグのボールタッチデータとトラッキングデータを用い、敵陣ゴール前のワンタッチプレーがシュートに与える影響を機械学習により分析した。LightGBMなどを用いたシュート予測モデルの構築により、エリア中央でのワンタッチプレーは高リスク高リターンのプレーであることが確認された。","methods":["機械学習","勾配ブースティング","統計的検定","ネットワーク分析"],"themes":["シュート","ゴール期待値","パス","戦術分析"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"スポーツは IT の発展に伴い, 試合中の選手の動きなどの様々なデータを利用することが可能になり,サッカーにおいてもチーム強化等にデータを利用することが必要不可欠になっている.本研究では, サッカーのボールタッチデータおよびトラッキングデータを用い,プレーしたチームがその後,t秒以内にシュートまでたどりつくかどうかを予測するモデルを構築し, ワンタッチプレーに関する調査・検証を行っていく.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_17","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"得点・失点前後におけるパスネットワークの変動分析","members":"益留琢磨，福嶋克茂，中村颯真，宮川大樹，一ノ瀬元喜(静岡大学)","first_author":"益留琢磨","affiliation":"静岡大学","code":"P1-15","abstract":"本研究は時系列パスネットワークを構築し、得点・失点前後でのネットワーク指標の変化を分析した。得点後はボールを回すなど消極的な傾向が見られ、失点後はパスを減らして得点を狙う攻撃的な傾向が見られた。各チームは試合の均衡が破れた際に戦術を大きく変えている。","methods":["ネットワーク分析","時系列解析","統計的検定"],"themes":["勝敗要因","戦術分析","試合の流れ","パス"],"data":["イベントデータ"],"free_tags":[],"awards":["ポスター部門 優秀賞"],"text_insufficient":false,"excerpt":"サッカーはチームでのスポーツ競技であるが,自チームの11 人と相手チームの11 人のそれぞれで,複雑な相互作用があり,その構造とダイナミクスの分析は複雑システムの研究対象として注目されてきた.特に近年,ネットワーク科学の手法を用いてサッカーの「パスのネットワーク」を分析するアプローチが取られるようになってきた[1].これまでの研究では,複雑ネットワークで用いられる指標を用いて,サッカーのパスネットワークの構造とダイナミクスを理解する試みが行われてきた[2, 3, 4].最近では,パスネットワークが時間的に変動するテンポラル性に焦点が当てられた研究も増えてきている[5].しかし,得点や失点の前後で,パスネットワークがどのように変動するかにはこれまで焦点が当てられていなかった.得点や失点が生じると,「リードしたから守りを固める」など,それまでと異なる戦略を取る可能性があり,それがネットワークの違いとして出てくる可能性が高い.したがって本研究では,提供されたJ1 リーグのデータを基に時間変化するパスネットワークを作成する.特に得点や失点の前後に注目して,パスネットワークの各種の指標を計算することで,それらの前後でパスネットワークが構造としてどのように変化するのかを明らかにする.これにより,サッカーの戦術や戦略の組み立てにおける新たな知見を提供し,より高度なゲーム分析の実現を目指す.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_25","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおける交代枠の増加による影響","members":"川出康介，佐藤慎太朗，白井寛大，新山晃正，廣津信義(順天堂大学)","first_author":"川出康介","affiliation":"順天堂大学","code":"P1-16","abstract":"本研究は、2019年と2022年シーズンの上位3チームを比較し、交代枠が3から5に増加した影響を検証した。2022年シーズンは交代後の得点が全得点の50%以上を占め、交代枠の増加によって交代後得点力が大幅に向上していることが明らかになった。","methods":["統計的検定","指標開発"],"themes":["選手起用","ルール変更"],"data":["公式成績データ"],"free_tags":["得点要因"],"awards":[],"text_insufficient":false,"excerpt":"今回の解析では、貸与されたデータをもとに、サッカーの試合における交代枠使用がチームの得点、勝利にもたらす影響はあるのかについて検討を行った。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_31","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"陣形の優勢評価を用いた試合の流れの分岐点解析","members":"阿部遥真，岡崎鉄平，高沖啓太郎，山口敦子(東京都市大学)","first_author":"阿部遥真","affiliation":"東京都市大学","code":"P1-17","abstract":"本研究は、選手交代と得点を試合の流れを変える分岐点として、陣形をコンパクトさで表現し、k-meansにより分類して攻撃・守備優勢度を定義した。統計的仮説検定により、選手交代は攻撃優勢度と守備優勢度の両方に影響を与え、試合の流れを意図的に変える重要な要因であることが示された。","methods":["クラスタリング","統計的検定","ロジスティック回帰"],"themes":["試合の流れ","戦術分析","フォーメーション","選手起用"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["陣形"],"awards":[],"text_insufficient":false,"excerpt":"サッカーの試合を見ていると,「試合の流れ」が変わる瞬間がいくつもある.それまで長い時間劣勢だったチームが得点を取ることでいきなり優勢になる.戦力的に差があるチームの対戦でも, それぞれ優勢な時間帯が存在する.それまで試合を支配し有利にゲームを進めていたチームが, なにかをきっかけに組織として機能を失い敗北する.数多くの試合で流れが変わる瞬間が存在する.このような試合の流れの分岐点はどこにあるのか.わたしたちは,これまでの試合観戦経験から,流れが変わる時には,得点や選手交代などのイベントにより陣形の変化があり,それが試合の流れに影響しているのではないかと考えた.そこで,以下の仮説をたてた.「イベントにより,いずれかのチームの陣形に変化が起き,陣形が変わることで試合の流れの変化が起きる」それをデータから検証し,読み解くのがこの解析の目的である.本解析では,イベントとは選手交代と得点を指すものとする.本報告は以下のように構成される.まず,陣形を定義する.また,試合の流れを攻撃の優勢度と守備の優勢度を定義することで記述可能とする.さらに,定義した攻撃の優勢度と守備の優勢度が指標として妥当かどうかを検証した上で,イベント前後5 分の陣形の変化があることを確認する.そして,統計的仮説検定を用いて,イベント前後5 分の攻撃の優勢度と守備の優勢度に変化があるかどうかをテストする.最後に,解析結果の考察を行う.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_38","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"ゴールが期待できるシュートにおける重要なエリアと有効なアクションの抽出","members":"大谷亮賀，塚原帝成，伴地芳啓，三家礼子(早稲田大学)","first_author":"大谷亮賀","affiliation":"早稲田大学","code":"P1-19","abstract":"本研究はゴール期待値算出から高品質シュートを選定し、シュート前5秒のアクションを分析した。機械学習によるゴール期待値推定と系列パターンマイニングを用いて、ペナルティエリア内での重要エリア特定と有効アクション抽出を行った。結果からダイレクトシュートの習熟が得点向上に必要であることが示唆された。","methods":["機械学習","因果推論","統計的検定"],"themes":["シュート","ゴール期待値","スペース評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"1990 年代~2000 年代初頭では、ジネディーヌ・ジダンやロナウジーニョなどプレイでファンを魅了するファンタジスタと呼ばれる選手が多く存在していた。しかし近年では、時代を重ねるごとにゲームスピードが上がっており、ファンタジスタと言われる選手は減少傾向[1]にある。主な原因は戦術の高度化である。攻守両面で組織としての戦術が洗練され、全てのポジションで正確な位置取りが求められるようになった。たとえ攻撃側の選手であっても、チームで決められた戦術という厳しい制約の中でボールを持つことを強いられている。それを象徴するのが、昨年の UEFA Champions League で優勝したマンチェスター・シティだ。監督のグアルディオラは、圧倒的な素質を持つ選手たちを戦術という制約の中に当てはめることで、11 人のポジショニングを徹底的に管理し選手独断のプレイを許さなかったのだ。実際にバロンドールにもノミネートされるほどの実力を持つ MF ケビン・デ・ブライネ選手や FW アーリング・ハーランド選手でさえも、チームとしての戦術を守った上でプレイしていた。このようにポジショニングやスペースを第一に考える現代サッカーは、将棋や囲碁のような、ある種「陣取り合戦」[2]と化している。こういった時代の潮流により、純粋なファンタジスタは減少傾向にあり、戦術を守りつつも自身の力を発揮する、盤面上の「駒」として忠実に機能する選手が重宝されるようになった。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_49","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"トラッキングデータによるプレー難易度の推定","members":"橘川和司(横浜市立大学)，小泉和之(順天堂大学)","first_author":"橘川和司","affiliation":"横浜市立大学","code":"P1-20","abstract":"本研究はパスの選択肢とプレッシャーを考慮した新指標「プレー難易度」を提案した。機械学習によるパス値とプレス値の推定から、ボール保持者の状況判断の難しさを数値化した。ロジスティック回帰モデルによる検証からプレー難易度とボールロスト間に有意な負の相関が確認されたため、指標の妥当性が支持された。","methods":["機械学習","ロジスティック回帰","指標開発"],"themes":["選手評価","ポジショニング","戦術分析"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"現在, サッカー界では取得できるデータの数や種類が増加し, 研究や分析も増えている。その研究や分析の多くの目的は「試合の状況を説明すること」にある。選手評価を行うための新しい指標の作成はデータの使用用途の1 つである。例えば, 純粋なパスの成功確率による選手評価はパス時の状況がわからないため, 選手評価として不十分であることが考えられる。選手評価を行うための新しい指標を作成する際にはその選手のおかれていた状況を理解することが重要であり, 実際に過去の研究でも新しい指標を作成する際に言及されている。戦術分析を行うための研究もある。選手がプレーすることの難しさの数値化ではプレッシャーの値を数値化した試みがあり, プレーすることの難しさは様々な状況を考察する際に重要な要素である。実際にプレッシャーの値は他の研究にも使用されており, 状況の1 つとして考慮される場面が多い。しかし, 様々な研究が増えているがプレーすることの難しさを他の要素も考慮に加える取り組みはあまりない。他の使用用途としてパスの研究も盛んである。パスはボールを持っている選手がとることの出来る行動の選択肢の1 つであり,「試合における状況」を理解するためにもパスは非常に重要な要素の1 つである。しかし, 実際にボールを持っている選手がとりうる選択肢としてパスを捉え,「試合における状況」の分析に使用するケースはない。このように,「試合における状況」を理解することがサッカー界におけるデータ活用の注目されているテーマであり, 「試合における状況」の1 つとして選手のプレーすることの難しさは重要だがプレッシャーの値の数値化のみで他の試みが少ない。「試合における状況」を考慮する上でパスはボールを持っている選手が取ることの出来る選択肢として非常に重要な要素の1 つであるが, パスの選択肢がどれくらいあるかという点でパスを評価した研究も見受けられなかった。本研究ではパスの選択肢がどれくらい選手にあるのかを要素の1 つとして設けて, 「試合における状況」の数値化を試合中の実際のデータを用いて試みる。","excerpt_src":"研究の背景"},{"id":"2023_soccera_1_52","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーの試合の勝敗とMFのプレーの関係","members":"奥村優樹，宮本道子(長崎大学)","first_author":"奥村優樹","affiliation":"長崎大学","code":"P1-21","abstract":"本研究は選手間のパスネットワーク分析とグラフ理論の中心性指標を用いて、ミッドフィルダーの役割が試合勝敗に及ぼす影響を検討した。ガンバ大阪対磐田の事例分析から、勝利チームのMFはバランスの取れたパス関与と前方向パスが特徴的であるのに対し、敗北チームは特定MF間での依存性が高いことが示唆された。","methods":["ネットワーク分析","指標開発"],"themes":["選手評価","戦術分析","試合の流れ"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"I. 研究の背景2015年から明治安田生命J1リーグ全試合で,トラッキングシステムが導入され,今までのボールタッチデータに併せて選手のチームへの貢献度を数値化できるようになった.現代サッカーでは,ミッドフィルダー(MF)を中心に攻撃を行うチームが多い.MFとはサッカーフィールドの中間に位置するポジションである.具体的にMFは,ディフェンス(DF)とフォワード(FW)の間に位置し,両者をつなぎつつ攻撃と守備の両方に関わるポジションで,得点をアシストしたり,ボールを運んだり,相手のゲームメイクを阻止する重要な役割を持つ.中間でプレーするからこそ,MFの役割は非常に多岐にわたる.加えて、MFというポジションは「司令塔」という役割を持つことも多い.コートを後ろから見渡せるDFが指示を出すこともあるが,攻守両方に関係し,コートの真ん中に位置するMFが指示を出した方が全体で意思疎通がしやすくなる.攻守の明確な区別がなく,流動的であるサッカーというスポーツにおいて,役割の多いMFというポジションがどれだけ活躍するかは,チームの勝敗に大きく関わってくると言えるだろう.有名なMFと言えば、例えば日本代表で活躍する三笘選手や遠藤選手,バルセロナでのプレー経験を持ち,ヴィッセル神戸にも所属したことがある(2023年7月1日退団),アンドレス・イニエスタ選手が世界的に有名なMFとしてあげられる.本研究では「MF」について焦点を当て,MFの試合の勝敗に,影響のあるプレーを検討していく. II. 先行研究A. サッカーの攻撃に関する研究田村(2018)は世界トップレベルの大会である2012年UEFA EUROを対象に,チームの速攻を可能にする要因とシュートに至るまでの過程を検討し,ボール奪取後の攻撃を「速攻」あるいは「ポゼッション攻撃」に分類する定量的指標を提案した。","excerpt_src":"本文冒頭"},{"id":"2023_soccera_1_54","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"Jリーグにおける選手交代の効果的な時間の分析","members":"後藤大輝，江頭健斗(東京理科大学)，河原弘幸，中川智之(明星大学)，田畑耕治(東京理科大学)","first_author":"後藤大輝","affiliation":"東京理科大学","code":"P1-22","abstract":"本研究は0過剰スケラム分布と階層回帰モデルを用いて選手交代の効果的なタイミングを分析した。交代人数とポジション構成が得失点差に及ぼす影響を試合時間ごとに推定し、ホームチームとアウェイチームで異なる交代効果の時間帯を検出した。結果は従来研究と異なり、選手交代に有効な時間が存在することを示唆した。","methods":["ベイズ統計","階層モデル","確率モデル"],"themes":["選手起用","試合の流れ","勝敗要因"],"data":["公式成績データ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"2022 年カタールW 杯では, 日本代表が強豪であるドイツ代表やスペイン代表を敗るという結果を残した. 日本代表の森保一監督は, ドイツ戦, スペイン戦ともに, 日本代表のエースである三笘薫選手を先発ではなく, あえて交代で起用した. 両試合ともに, 日本代表は, 前半に先制点を許し, 劣勢を強いられていたが, 三笘薫選手が後半に出場してから, 日本のペースとなり, 結果的に逆転することができた. このように, W 杯のみならずJ リーグをはじめとする様々なリーグでも, 選手交代はサッカーの試合において勝敗を左右する重要な要素の1 つとなっている. 現状, 選手交代は, 監督やコーチが今までの経験に頼って決定している. しかしながら, 選手交代の決定において, 必ずしもその監督やコーチの経験が良い方向に働くとは限らない. 経験だけではなく, データを分析した結果から選手交代するタイミングを判断することができれば, より試合の勝率を高められると考えられる. 先行研究であるMyers [1] では, 決定木分析を用いて選手交代の適切な時間に注目し, 負けているチームにとって最適な交代時間に関するルールを提案している.実際に, 負けているチームが提案した交代ルールに従っているとき, 有意に得失点が改善されることが報告されている. しかし, ルールで定めた交代時間でしか交代すべきかどうかを判断できないという実用性がない点で問題があった. Silva and Swartz [2] では, ベイズ・ロジスティック回帰モデルを与えることで, Myers [1] の実用性のなさという問題点が改善された. そして, Silva and Swartz [2] で提案されたモデルでは, チームの強さを考慮したとき, 負けているチームにおける選手交代の効果的な時間はないという結果が報告されている. 本研究では, Silva and Swartz [2] で表せなかった選手交代の時間を, Silva and Swartz [2] とは異なる階層回帰モデルを与えることで, 選手交代の効果的な時間を分析することを目的とする.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_57","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおける選手間距離の統計分析とモデリング","members":"泉朝貴，上江洲伊吹，呉屋耶真斗，知念玲弥，山田健太(琉球大学)","first_author":"泉朝貴","affiliation":"琉球大学","code":"P1-23","abstract":"本研究は選手間距離の時間発展と再帰時間を統計分析した。遷移確率モデルによるランダムウォークシミュレーションから、実データの再帰時間分布が指数分布で特徴付けられ、過去の再帰時間に依存しないランダムな無記憶性を確認した。結果は選手動作の複雑性の中に普遍的なランダム性が存在することを示唆した。","methods":["時系列解析","シミュレーション","統計的検定"],"themes":["ポジショニング","戦術分析"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーは攻撃や守備の移り変わりが激しいスポーツである.例えば,攻撃時にはサイドから攻める,前線に残っている選手にロングパスを出してカウンターを仕掛ける,守備時には前線の選手以外はゴールを取られないように下がって守るなどといったように,フィールドにいる敵味方22 人の動きは戦術や状況によって様々である.このように,ピッチ上の選手が勝利を目指して自由に動いているサッカーにおける経験則を提供していただいたビッグデータから発見し,数理モデルを用いてその経験則を再現することを我々のチームは目標とした.そして,ビッグデータから発見される経験則を積み重ね,その経験則が選手のどのような動きやどのような相互作用によって生まれるかを明らかにすることが,サッカーの本質的な理解や勝利に導くための戦術構築に繋がると考えられる.今回の分析では,2選手間の距離という最も基本的な量の一つに着目し,再帰時間の分析をした.また,選手のトラッキングデータから遷移確率モデルを作成し,そのモデルを用いたシミュレーション結果が再帰時間の統計性を再現できるかを検証した.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_65","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"LightGBMを用いたシュート予測のための特徴量抽出","members":"木山輝，時任穣士，尼崎太樹(熊本大学)","first_author":"木山輝","affiliation":"熊本大学","code":"P1-24","abstract":"LSTM注意機構とLightGBM決定木を組み合わせたシュート予測モデルを提案した。時系列の重要フレームを自動抽出し、可視化可能な特徴量重要度分析により、攻撃シーケンスがシュートに至るために重要な要素を特定することが可能になった。","methods":["深層学習","ニューラルネットワーク","勾配ブースティング","機械学習"],"themes":["シュート","得点予測","戦術分析"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"スポーツ分析はスポーツに関するデータを収集・分析し,選手やチームのために活用することである.サッカーでは,ドイツの代表チームが企業と連携し,データ分析を積極的に活用したという事例がある[1].スポーツ分析には,データとその分析方法が重要な要素となっている.データに関しては,デバイスの性能向上や近年のスポーツデータ分析への関心の高まりにより,大量のデータ収集が行われている[2].サッカーのデータとしては,試合中に起きたアクションと発生時刻,場所をまとめたイベントデータや試合中の選手やボールの位置情報をまとめたトラッキングデータが収集される.分析方法に関しては,大量のデータを処理し,データのルールやパターンを学習することができる機械学習が使用されることが多い.機械学習を用いたスポーツ分析の研究については,機械学習モデルにイベントデータを学習させ,次のアクションが何なのか・どこで起こるのかを予測する研究[3] やトラッキングデータを学習させ,複数選手の将来の軌道を予測する研究[4] などが挙げられる.一方で,スポーツ分析に機械学習の深層学習を用いる場合,分析がブラックボックス化してしまい,予測プロセスを人間が理解できず,分析結果をフィードバックすることが困難になってしまう.その対策としては,比較的明確な予測プロセスを持つ決定木分析や出力結果の判断根拠を人間が理解できるように説明可能な機械学習モデルXAI (Explainable AI)などが挙げられる.サッカーの試合での最終的な目標は試合に勝つことであり,この目的のためチームは得点を目指す.しかし試合におけるどの要素が有効な攻撃に繋がるかは特定することが難しい.そこで本研究では,時系列のトラッキングデータからシュートの予測を行い,どのような要素が予測に影響を与えていたかを決定木分析により特定していく.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_68","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"NMF を用いた二段階クラスタリングによる選手タイプ分類の提案","members":"久保智生，松尾朋響，蓮池隆(早稲田大学)","first_author":"久保智生","affiliation":"早稲田大学","code":"P1-25","abstract":"NMFによる次元削減とk-means法を組み合わせた二段階クラスタリングにより、トラッキングデータとスタッツデータから選手を22タイプに分類した。ポジション別役割を細分化した分類は、選手育成や獲得方針の決定支援に有用である。","methods":["クラスタリング","次元削減","機械学習"],"themes":["選手評価","選手起用","育成・指導"],"data":["トラッキングデータ","公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"様々な戦術が考案されている現代サッカーにおいて,同じ登録ポジションの選手であっても,与えられる役割が大きく異なるケースが増えている. そのため,選手のタイプをより細分化して分類する分析は,選手の育成や獲得の方針を決める手助けとなりチームマネージャーやスカウトにとって有益な情報である.加えて,試合分析や戦術決定をする手助けにもなり,チーム方針と選手特性とのミスマッチを減らすことが期待できる.","excerpt_src":"研究背景"},{"id":"2023_soccera_1_75","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーの攻撃的なパスにおける評価方法の提案","members":"村嶋春希，森田裕之(大阪公立大学)","first_author":"村嶋春希","affiliation":"大阪公立大学","code":"P1-26","abstract":"パッキングレートの計算方法を改善し、通過相手選手数のカウント対象をピッチ分割エリア単位に限定することで、より有効なパスを重視する評価が可能になった。改善版はペナルティエリア進入回数との相関が従来版より高く、得点チャンス創出指標としての有用性が向上した。","methods":["統計的検定","指標開発"],"themes":["パス","戦術分析","得点予測"],"data":["イベントデータ"],"free_tags":[],"awards":["ポスター部門 奨励賞"],"text_insufficient":false,"excerpt":"サッカーでは様々な戦術があり、相手を崩し、得点につなげることを目的としている。中でもパスを効率的に用いて相手を攻略するパスサッカーは現代サッカーにおいて最も主流となっている戦術の一つである。パスには近くの味方へのパスを表すショートパス、相手のディフェンス裏にパスを出すスルーパス、遠くの味方にパスを出すロングパスなど様々な種類のパスが存在する。中でもスルーパスは相手ディフェンスを攻略する非常に効果的なパスである。このスルーパスを重視したのが「パッキング・レート」という新たな指標である。これは 1本のパスで何人の相手選手を通過できたかを計る指標であり[1]、どれだけ効率の良い攻撃をできているか評価することができる。先行研究ではポジション別にパッキング・レートを集計し、パスの出し手と受け手で比較したり、パッキング・レートと試合結果及びボール支配率との関連を分析したりしている。結果として DFが出し手としてのパッキング・レートが高くなる傾向を示している。またパッキング・レートは支配率とは正の有意な相関関係が確認されたものの、試合結果との間には有意な相関関係が確認されなかった。そこでパッキング・レートの評価方法を見直すことで、試合結果などとの間に相関関係を確認できるような改善を試みることを目的とする。","excerpt_src":"背景"},{"id":"2023_soccera_1_85","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"成績向上のための効果的なプレイスタイルと手段について","members":"小野公之，木山丈裕，広岡正太，濱谷勇太，森裕一(岡山理科大学)","first_author":"小野公之","affiliation":"岡山理科大学","code":"P1-27","abstract":"J1リーグの95試合分データを用いて、サッカーのポゼッション型とカウンター型の戦術を4つに分類し、各スタイルの成績を比較分析した。敵陣ポゼッション型が最も成績が優れており、ポゼッション型のチームがゴールキックをショートパスで繋ぐ傾向が確認された。","methods":["クラスタリング","統計的検定","可視化"],"themes":["戦術分析","チーム評価","ポジショニング"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"ボールを保持して,試合の支配を目指す 「ポゼッション」は,2010 年代前半に FC バルセロナやスペイン代表が 「ティキ・タカ」 と称される多くのパス回しを行うポゼッション志向の戦術を採用した (株式会社グラセン,https://tele- saka.com/tiki-taka/)。試合を攻撃的に進めようとするこのスタイルは, 世界に影響を与え, 主流となった。 実際に,ボール保持率を高めることは,チームの得点率を上げることに効果的であることがわかる(図1,株式会社データスタジアム.Football Lab 2021,2022)。 しかし, パスミスや高い位置からの失点のリスクが高いという点も指摘されている。 一方,カウンター型の戦術はボール保持を目的とせず,守備ブロックを固く保ち, 失点を抑え, 速攻で効率的に点を取るスタイルである。いずれも利点, 欠点があるが,ポゼッション型かカウンター型かの違いがどう成績に影響するかを明らかにする図 1 ボール保持率と平均得点の散布図(2021 年の 18 チームと 2022 年の 20 チームを別チームとした計 38 チームの散布図)ことは,戦術立案に役立つことになる。そこで,データスタジアム株式会社より提供を受けた 2021 年と 2022 年の J1 リーグ 95 試合分のデータを基に, 戦術のタイプを分け,その分類から成績や効果的な戦略へつながる要因について考察する。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_93","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"ゴールキーパーの攻撃貢献度に基づく活用方法の提案","members":"袴田悠大，杉原雄大，木ノ下楓空，片岡俊輔，遠藤智哉，安藤雅和(千葉工業大学)","first_author":"袴田悠大","affiliation":"千葉工業大学","code":"P1-28","abstract":"J1リーグの2022年シーズン後半戦データから、ゴールキーパーのロングパス成功率とチーム得点の相関係数を算出した。結果として、相関関係は弱く、キーパーのロングパス成功率より他のフィールドプレイヤーの得点力がチーム成績に大きく影響することが明らかになった。","methods":["統計的検定"],"themes":["選手評価","戦術分析","ポジショニング"],"data":["トラッキングデータ"],"free_tags":["相関分析"],"awards":[],"text_insufficient":false,"excerpt":"通常のサッカーにおいてフィールドプレイヤーとは異なり,ゴールキーパーは守備の要として,ボールをセーブする場面において特に注目される存在である.しかし,近年のサッカーにおけるゴールキーパーの役割は守備専門から攻撃においてもビルドアップに関与させるチームが増えてきた.そのため,彼らのプレーが試合の流れやチームの戦術に与える影響は決して小さくはないことから,現在のサッカー界では, 攻撃時における試合展開が10 人で行われることが珍しくなくなった.このような状況下で,キーパー自身も攻撃に参加することが求められ,数的有利を得るための手段の一つとして位置付けられることがある.この攻撃への積極的な参加が試合の流れを変え,チームにとって有利な展開を生み出す可能性があると考えられている.本研究ではキーパーの攻撃関与に焦点を当て,具体的な手段としてロングキックの有効性に注目した.特に,J リーグにおける各チームのキーパーが展開するロングパスの成功率を評価指標として採用した.この成功率を通じて,キーパーの攻撃的な役割とその効果を客観的かつ定量的に評価することを目指した.研究の主旨は,キーパーのプレーがチームの戦略に与える影響をより理解し,その貢献度を明確にすることである.これにより,自チームや相手チームのキーパーのプレースタイルをより精密に評価し,戦術的な戦略を練ることができるだろう.新しい側面からキーパーの役割を探求することは,サッカー戦術の進化に寄与する可能性がある.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_1","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"国際大会に準ずるスタッツデータを用いた戦術によるチームの特徴分析","members":"与座英之，山本義郎(東海大学)","first_author":"与座英之","affiliation":"東海大学","code":"P2-12","abstract":"FIFA公式データを参考に作成したトラッキングデータとボールタッチデータから因子分析によって5つの戦術因子を抽出した。クラスター分析によってチームを4つの戦術タイプに分類し、複数の機械学習手法から攻撃時の高速移動距離(OF Zone5)が勝敗に最も重要な変数であることを確認した。","methods":["クラスタリング","機械学習"],"themes":["戦術分析","チーム評価","勝敗要因"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["因子分析"],"awards":[],"text_insufficient":false,"excerpt":"現在,サッカー競技では様々なデータを取得することが可能となっている.背景には,映像やGPS の普及が大きい.実際,国際サッカー連盟(以下,FIFA)[1] は,2022年以降の主催大会でおこなわれた各試合のレポートを公開している.このレポートでは,映像を用いた様々な記録がまとめられている.サッカー競技では,様々なデータが記録できる反面,勝敗に直接影響のあるデータを見つけるのは難しい.サッカー競技は大人数で,複合的に競技が行われるため,勝敗に影響する明確な変数を見つけることは難しい.戦術は各チームが得点を取るために作るチーム内のルールである.この戦術は各チームの記録を確認することで,どの様な攻撃方法,守備方法を行っているか確認ができる.本研究では,因子分析を用いて各変数の関係を調べた.因子分析の結果,各チームの特徴をクラスター分析を用いて確認する.そして,様々な予測手法から勝敗への影響を確認することを目標とする.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_5","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"プレーの質を数値化する指標に基づくプレー選択の評価とその活用","members":"福田遥也(横浜市立大学)，小泉和之(順天堂大学)","first_author":"福田遥也","affiliation":"横浜市立大学","code":"P2-13","abstract":"2021～2022年J1リーグのトラッキングデータから、攻撃前進得点(AAS)とパス成功確率(PSP)を算出し、ランダムフォレストでシチュエーションを変数化してプレー選択を評価した。プレーの質を攻撃貢献度と成功確率の両面から評価可能にし、密集での課題は残つつも選手・チーム評価に活用可能な指標を開発した。","methods":["機械学習","指標開発"],"themes":["戦術分析","選手評価","ポジショニング"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["期待値指標"],"awards":["ポスター部門 優秀賞"],"text_insufficient":false,"excerpt":"サッカーの試合中継において,「ゴール期待値」という言葉が用いられるようになったことを皮切りに, サッカー界には期待値指標が広まった. 現在では多くのメディアやデータサイトで, ゴール期待値やアシスト期待値などが当たり前に登場する. これらの期待値指標は, 確率的なアプローチによって算出されており, 値によってプレーの質を評価することを可能にしている. 例えばゴール期待値は,シュートに対して算出され, そのシチュエーションでのシュートがゴールに入る確率を表しており, 作ったチャンスの質を評価することができる.本研究では, 特にパスに着目し, このようなプレーの質を評価する指標やパスの成功確率Pass Success Probability (以下PSP) を用いて, 実際にパサーが選択した選手と他の9 人で比較することでプレー選択の評価を行う.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_8","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"Jリーグデータを用いた選手の思考スピードの分析","members":"戸塚周，小泉和之(順天堂大学)","first_author":"戸塚周","affiliation":"順天堂大学","code":"P2-14","abstract":"本研究は、選手の思考スピードを定量的に評価することを目標として、J1リーグのプレーデータとトラッキングデータを用いて因子分析を実施した。変数作成と因子分析の複数パターンを検討したが、現在の変数では思考スピードを構成する判断速度と予測速度を示す有意な共通因子の抽出には至っていない。","methods":["クラスタリング","統計的検定"],"themes":["選手評価","戦術分析","ポジショニング"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["判断速度","因子分析"],"awards":[],"text_insufficient":false,"excerpt":"サッカーをはじめ, 多くの競技スポーツを観戦すると, 男女それぞれのトップレベルの試合でもスピード感に非常に差があるように感じることは少なくない. その要因としては, 筋力や運動能力など, 肉体的な違いによって生じる物理的なスピードの他に, 判断や予測といった頭の中の思考のスピードに差があるのではないかと考えられる. 前者の物理的スピードの差については, 明らかであるが, 後者のスピードについては比較以前に, 定量的な評価を行うことが難しい. ここから本研究では時間の因子がプレーの結果にどのように影響するのかを評価することを目標とし, 選手のプレイデータとトラッキングデータをもとにプレーの分類を行い, 選手の判断・予測に用いた時間と, プレーにかかった時間を抽出することで推定する. ここでは,J1 リーグのデータを使用するため, 研究目的は定量的な評価にとどまり, 男女等による差については検討しない. 1.2本研究の流れ本研究では, 特定のプレーにおける時間の因子構造を評価することを目指し, データをもとに得られる変数からプレーの分類を行い, その中で時間変数が持つ影響の大きさについて調べる. 第2 章では,本研究テーマに関連する既存の研究に焦点を当て,本研究が先行研究をどのように補完し, 新たな洞察を提供する可能性があるかを明らかにする. 第3 章では, 研究に用いるデータセットと, 分析に必要な変数の抽出及び定義について詳述する. この章は研究の基礎となり, 使用する変数がどのようにデータを通して現象を捉えるかを説明し, 変数の選定根拠とそれぞれの操作的定義に焦点を当てる. 第4 章では, 具体的な分析手法として因子分析, クラスター分析, パス解析を用いる. 各セクションで, これらの手法を用いる目的, 実施方法, そして得られた結果の解釈について詳細に記述する. この章は, 研究の核心部分であり, 理論的洞察と実証的な証拠の両方を提供することを目的としている.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_18","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーの試合中の総走行距離に与える気候の影響に関する考察","members":"筒井友哉，真鍋大樹，米澤弘毅(名城大学)","first_author":"筒井友哉","affiliation":"名城大学","code":"P2-15","abstract":"本研究は、J1リーグにおけるチームの総走行距離に気候が与える影響を回帰分析と勾配ブースティング回帰により分析した。気温と湿度を含む気候要因が、選手の総走行距離に他の要因と比較して最も大きな影響を与えることが確認された。","methods":["回帰分析","勾配ブースティング","統計的検定"],"themes":["怪我・コンディション","試合の流れ","選手評価"],"data":["公式成績データ","外部データ併用"],"free_tags":["因子分析"],"awards":[],"text_insufficient":false,"excerpt":"サッカーは専ら屋外で行われるスポーツであり,気候の影響を受けることが考えられる.屋外スポーツに気候が与える影響に関する研究の例として,昨今の気候変動がオリンピックに与える影響を調査した研究[1, 2] が挙げられる.サッカーの試合中のパフォーマンスに影響があると考えられる要因については,気候の他にもピッチの状態や試合中の得点差といった要因が考えられる.さらにJ リーグのような長期戦においては,特に優勝争いや降格争いなど,試合開始時のリーグ内順位が影響をもたらす可能性があると考えられる.本研究ではサッカーJ リーグの試合における各チームの総走行距離に焦点を当て,気候が各チームの選手の総走行距離にどれだけの影響を及ぼしているかを検討する.様々な要因を踏まえて解析した結果,気候の要因が各チームの選手の総走行距離に大きな影響を与えていることが確認された.また2021 年と2022 年シーズンで気候がチームの総走行距離に与える影響の大きさに差があることが確認できた.","excerpt_src":"本文冒頭"},{"id":"2023_soccera_1_28","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"不快指数と走行距離・スプリント回数の相関から見る試合への影響","members":"中川太翔，白井康之(大東文化大学)","first_author":"中川太翔","affiliation":"大東文化大学","code":"P2-16","abstract":"本研究は、2021-2022シーズンのJ1リーグ一部試合を対象に、不快指数と走行距離・スプリント回数の相関を分析した。不快指数が高いほど走行距離とスプリント回数が減少する傾向が見られたが、チームやスタジアムによる差が大きく、気候は選手のパフォーマンスに影響を与えている。","methods":["統計的検定","指標開発","時系列解析"],"themes":["怪我・コンディション","試合の流れ","選手評価"],"data":["公式成績データ","外部データ併用"],"free_tags":["不快指数"],"awards":[],"text_insufficient":false,"excerpt":"現在、Jリーグにおいて、秋春制へのシーズン移行が議論されており、もし実現すればシーズン開幕が8月からとなる。今まで通りの2月のシーズン開幕と比べると、6月から9月の真夏の試合数が減少し、酷暑の中での試合は減るが、雪国のチームは、積雪などの影響により試合ができない状況なども想定される。 今年も地球温暖化により、危険な暑さが長く続き、試合で飲水タイムを設ける期間を8月以降も延長するなどの措置が取られた。気温や湿度などは、選手のコンディションやパフォーマンスに影響すると考え、今回は気候が選手や試合結果に与える影響について分析した。 試合日の気温や湿度が、試合の走行距離・スプリント回数や勝敗へ影響があるかどうかの分析を、不快指数を用いて行った。不快指数が高ければ高いほど、全体の走行距離やスプリント回数は減り、走行距離やスプリント回数の多いチームが勝っているのではないかという仮説を検証することが、本研究の目的である。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_32","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"J1におけるボールタッチの重要性","members":"西尾育観，山路学(長崎総合科学大学)","first_author":"西尾育観","affiliation":"長崎総合科学大学","code":"P2-17","abstract":"本研究は、J1リーグの全チームを対象に2021-2022年シーズンのボールタッチデータを分析し、ACL出場権獲得チームはボール関与回数が多く、ショートカウンターを用いるJ2昇格チームとは異なるボールタッチパターンを示していることを明らかにした。","methods":["回帰分析","統計的検定"],"themes":["チーム評価","選手評価","パス"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"J1 リーグにおいて、 リーグ優勝やACL 出場権を獲得すること、J2 に降格しないことは結果として重要視される。 結果が物を言うプロサッカーにおいて、結果につながる数字(本研究ではボールタッチ回数とする)は欠かすことのできない要素であると言える。 各チームのプレースタイルは異なるが、ゴールを奪うアクションにおいては必ずボールタッチが大事になる。 本研究では、 試合ごとのボールタッチ回数とパスに着目し、 優勝したチームやACL出場権獲得したチーム、降格圏にいるチームを比較する。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_37","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるフォーメーションの相性","members":"倉上俊輝，関庸一(群馬大学)","first_author":"倉上俊輝","affiliation":"群馬大学","code":"P2-18","abstract":"本研究ではトラッキングデータを用いて、サッカー試合中のフォーメーション推定と相性の分析を行った。複数のテンプレートフォーメーションとマッチングアルゴリズムを用いて、試合中に変化するフォーメーションを検出し、複数試合におけるフォーメーションの特徴を可視化した。結果として解析対象試合ではフォーメーション対による相性は見られず、より多くの試合分析と攻守分けの詳細化が課題として挙げられた。","methods":["ネットワーク分析","最適化","指標開発"],"themes":["フォーメーション","戦術分析","ポジショニング"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーの試合では,後ろから1 列目,2 列目,3 列目, 4 列目のそれぞれの人数を数字で表し,フォーメーションを表現する.このフォーメーションは試合開始時に決められている.しかし,一人一人の選手が状況に応じてポジショニングをするため,フォーメーションは試合の状況によって変化する.それぞれのフォーメーションには特徴があり,空きやすいスペースや目指せる攻撃の形が異なる.このフォーメーションを抽出している研究[1, 2] はあるが,フォーメーション類型を判定している研究は見当たらない.そこで本研究では,フォーメーションの類型をデータから判定し,その相性をデータ分析によって,導き出くことを目的とする.","excerpt_src":"研究目的"},{"id":"2023_soccera_1_48","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおける支配領域の定量化による戦況変化の検出","members":"関崎尚輝，増田亘，齊藤史哲(千葉工業大学)","first_author":"関崎尚輝","affiliation":"千葉工業大学","code":"P2-19","abstract":"本研究は選手の疲労度と能力を考慮したボロノイ図による支配領域分析を提案した。従来手法と異なり選手の年齢・出場時間・速度を反映させて防御円と支配領域を動的に調整し、戦況変化をより詳細に検出した。階層回帰モデルによる評価から提案手法は従来手法よりも多様なイベントを捉えられることが示された。","methods":["空間分析","時系列解析","階層モデル"],"themes":["ポジショニング","スペース評価","試合の流れ"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおける戦況は瞬時に変化し,これに迅速に対応することは監督やコーチにとって難しい課題である.そうした課題に対し,戦況変化の定量化は選手の動きを数値化することで重要な局面を把握でき,指導者の戦術評価だけでなく観戦者の体験の向上に役立つ.しかし,選手の個性や疲労度といったその時点における各選手の状態は十分に考慮されてこなかった. そこで本研究では,守備時の脆弱性に対して選手の疲労度や状態を含めた戦況変化の定量化と,これを検出する新たな方法を提案する.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_50","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"パス成功確率から見る選手評価","members":"岸木昌裕，山口光，鈴木海友(東京理科大学)，河原弘幸(明星大学)，小林正弘(東海大学)，松澤智史(東京理科大学)","first_author":"岸木昌裕","affiliation":"東京理科大学","code":"P2-20","abstract":"本研究は機械学習によるパス成功確率の推定を行い、選手評価手法を提案した。ランダムフォレスト・XGBoost・ロジスティック回帰・LSTMの4モデルを構築し、予測値の順序関係と実際の成功割合の対応を検証した。LIME分析からモデルは選手のボールコントロール能力とプレッシャー対応力を異なる視点から評価することが示された。","methods":["機械学習","因果推論","SHAP・説明可能AI"],"themes":["選手評価","パス","戦術分析"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年,多くのスポーツにおいて,選手の試合でのプレーが数値化されている.サッカーでも試合ごとに選手のプレーに対する総合評価がされているが,総合評価の根拠は明示されていないことが多いため,プレーの良さが伝わりにくいという問題点がある.また,試合後に公開されている情報としては,シュート数,パスの総本数,パス成功率などの試合の結果であり,これらの情報では試合の場面ごとの評価はしていないため,簡単なプレーと難しいプレーの判断をすることができず,選手を正確に評価できないと考える.そこで,本研究ではサッカーの試合で最も多くアクションされるパスに絞り,パスについて難易度を判断できる一つの指標を与える.また,パスが通る確率(パス成功確率) をAnzer らの研究[1] の手法を用いて,試合における選手のパスの評価をする.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_53","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"J1 リーグにおけるビルドアップに基づく攻撃スタイルの分類","members":"太田悠葵，山口光(東京理科大学)，藤澤健吾(山口東京理科大学)，小林正弘(東海大学)，松澤智史，田畑耕治(東京理科大学)","first_author":"太田悠葵","affiliation":"東京理科大学","code":"P2-21","abstract":"本研究は2021年と2022年のJ1リーグデータを対象に、ビルドアップスタイルの主成分分析とクラスタリングにより分類した。ポゼッション型とカウンター型の戦術パターンを特定し、ロジスティック回帰分析から攻撃継続時間が成功要因として重要であることを報告した。分析結果は好成績チームのビルドアップ特性を明らかにした。","methods":["クラスタリング","次元削減","ロジスティック回帰"],"themes":["ビルドアップ","戦術分析","チーム評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて局面を攻撃と守備の2 つに分けた際,攻撃面は相手ゴール付近でのプレーを表すフィニッシュワークと自陣から相手ゴール付近へボールを運ぶプレーを表すビルドアップ, 守備面は相手のビルドアップに対してボールを奪おうとするプレーを表すプレッシングと自陣ゴール付近で相手チームのシュートを防ぐプレーを表すブロックと局面を4 つに分けて考えることもできる. さらにプレッシングを大きく2 つに分けた際, リトリートとハイプレスに分けることができる. リトリートは自陣で数的優位の場面を作り出すことでボールを奪おうとするが, ハイプレスは高い位置から相手選手にプレッシャーをかけることで相手選手に自由を与えず, 相手の意図したプレーをさせずにボールを奪おうとする. 近年のサッカーはプレッシングの際にハイプレスを戦術としているチームが増加しており, Vogelbein et al. [1] では, ドイツブンデスリーガ2010/2011 シーズンにおいて,上位チームほどボールポゼッション回復に要する時間が短いことが報告されるなど,ハイプレス戦術の有用性が示唆されている. ハイプレスは高い位置でのボール奪取が多く, 攻撃チームにとってビルドアップの失敗は失点へと直結する為, 重要度はさらに高くなると考えられる.また, Rein et al. [2] ではブンデスリーガのパスの有効性, Villora et al. [3] では選手の意思決定の戦術的効率が評価されるなどゴールや勝利に対する分析だけでなく, 得点機会の創出に対する分析や選手個人の各プレーに対する分析が, 攻撃パフォーマンスを研究するための新しい指標として提案されている. ビルドアップにおいてパスまたはドリブルで, 保持しているボールを相手ゴール方向へ大幅に前進させることのできる選手は評価されると考えられる.本研究では, J1 リーグの2021 シーズン, 2022 シーズンの2 シーズンに対して各チームのビルドアップスタイルを分類し, 30m ライン侵入をビルドアップの成功とした際に成功しやすいビルドアップの特徴を調査し, 各年における好成績を収めたビルドアップスタイルとその重要な要素に関してまとめる.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_55","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"隠れマルコフモデルを用いたサッカーにおけるボール奪取後の攻撃方法の分析","members":"林大志朗，鈴木秀男(慶應義塾大学)","first_author":"林大志朗","affiliation":"慶應義塾大学","code":"P2-22","abstract":"本研究は隠れマルコフモデルを用いてボール奪取後の有効攻撃パターンを分析した。複数フォーメーションの組み合わせごとに有効攻撃と非有効攻撃のモデルを構築し、選手配置とボール運搬経路の違いを検出した。結果から有効攻撃ではウィングバックの高い位置取りと数的優位の活用が重要な要素であることが示された。","methods":["隠れマルコフモデル","時系列解析"],"themes":["トランジション","ポジショニング","戦術分析"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおける攻撃は大きく 2 つの種類に分けられる。1 つはフリーキックやコーナーキックなど、ボールがピッチの外に出た後に規定の位置からプレーを再開させるセットプレーからの攻撃であり、もう 1 つがピッチ内でボールを相手チームから奪った後にインプレーの状態が続いたまま行う攻撃である。前者は攻撃側のチームが各選手のポジショニングを整えたうえで好きなタイミングで攻撃を開始させることができるため、予め準備しておいた戦術を適用するのが比較的容易でありパターン化しやすいことが特徴として挙げられる。一方で、後者の場合は味方・敵の位置や試合状況が目まぐるしく変化するためパターン化は困難であり、プレーの判断は各選手の感覚や経験に頼る要素が大きい。そこで本研究では、隠れマルコフモデルを用いて、ボール奪取後にどのような攻撃を行うのが有効であるのかをデータに基づき科学的に明らかにする。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_61","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーのゴールキックにおける有効な攻撃のための配球判断に関する研究","members":"佐藤亮士，鈴木秀男(慶應義塾大学)","first_author":"佐藤亮士","affiliation":"慶應義塾大学","code":"P2-23","abstract":"ゴールキックの配球判断が有効な攻撃に繋がる要因を勾配ブースティングにより特定した。相手の守備戦術によって最適な配球戦略が異なり、リトリート対策には「繋ぐ」戦術が、フォアチェック対策には相手プレイヤー密度の高い位置への配球が有効であることを明らかにした。","methods":["勾配ブースティング","クラスタリング","カーネル密度推定"],"themes":["ビルドアップ","セットプレー","戦術分析"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["配球"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおけるゴールキックは、試合の流れを左右する重要な攻撃機会である。 特に、2019年のルール改正によってペナルティエリア内への配球が可能となり、ゴールキックからの攻撃戦術が多様化した。それにより、プレイヤーはゴールキック時に短いパスでビルドアップをする「繋ぐ」戦術と、ロングキックによって大きく前進する「蹴る」戦術の選択を迫れるが、ゴールキックの配球判断は、現状プレイヤーの経験則や直感に基づいて決定されていることが多い。 本研究では、ゴールキックが有効な攻撃に繋がるための要因を分析し、 ゴールキック時の 「繋ぐ」、 「蹴る」の選択の効果性を統計的に探求する。それらの結果に基づき、ゴールキックの配球判断をサポートするための指針を提供する。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_66","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーのトラッキングデータから集団運動を抜き出すために多様体学習を適用する","members":"中村太一，山梨敦士，藤崎弘士(日本医科大学)","first_author":"中村太一","affiliation":"日本医科大学","code":"P2-24","abstract":"拡散マップによる多様体学習をサッカートラッキングデータに適用し、22次元の選手座標データを低次元表現に圧縮した。2次元成分はボール動きと相関し試合の攻防を反映しており、多様体構造の分析によるチーム特性の定量化が可能であることを示した。","methods":["次元削減","時系列解析","機械学習"],"themes":["チーム評価","戦術分析","試合の流れ"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"現在、データは大量に生成、記録されており、それをどのように解析するかということに関してはここ10 年ほどで深層学習を用いた色々な進展があった。画像認識や画像生成に関しては、畳み込みニューラルネットワークや拡散モデルが現在の主流であり、文章の解析や生成に関してはリカレント・ニューラルネットワークやトランスフォーマーがよく用いられる。このようなタスクに関しては十分な量のデータを用いて十分複雑なニューラルネットワーク上で学習を行えば、人間以上のパフォーマンスを示すことがわかっている。ただし、時系列解析に関しては、深層学習でどのような解析をすべきかということに関して定まった議論はないものと思われる。これは時系列の予測が本質的に難しい問題であることや(例えば、Covid-19 の感染者数の予測について考えてみよ)、解析の対象や目的が多種多様であることから来るものと考えられる。ここでは情報・システム研究機構統計数理研究所医療健康データ科学研究センターおよびデータスタジアム株式会社からいただいたサッカーの時系列データ(トラッキングデータ)を用いて、いくつかの解析の試みを行ったので、それについて報告する。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_69","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"ゴール期待値に新たな変数を：ディフェンス情報の追加による予測モデルの改善","members":"岡田和也，林賢一(慶應義塾大学)","first_author":"岡田和也","affiliation":"慶應義塾大学","code":"P2-25","abstract":"ディフェンス情報の変数を既存のゴール期待値モデルに追加することで、モデル精度の改善を実現した。特にシュート時点から0.1秒以内の相手DF情報が予測性能向上に有効であり、既存のxGでは考慮されていない防守要因を定量化した。","methods":["勾配ブースティング","機械学習","ロジスティック回帰"],"themes":["ゴール期待値","シュート","戦術分析"],"data":["イベントデータ","トラッキングデータ"],"free_tags":[],"awards":["ポスター部門 最優秀賞"],"text_insufficient":false,"excerpt":"ゴール期待値とは,「シュート1 本あたりの得点に結びつく確率」を表した指標[1] であり,値が大きいほど得点が決まる可能性が高いシュートとなる.あるシュートに関する入力(特徴量) をx,そのシュートの結果をY とする(Y = 1 でゴール,Y = 0 でノーゴール) と,ゴール期待値は,E[Y |x] = P(Y = 1|x) である.Football LAB によると,J リーグにおいて,ゴール期待値の算出には,機械学習の手法である決定木に基づく勾配ブースティングが用いられている.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_84","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"若手サッカー選手の成長に繋がる適切な出場時間の予測","members":"前川温寛，宿久洋(同志社大学)","first_author":"前川温寛","affiliation":"同志社大学","code":"P2-26","abstract":"若手選手の成長指標を定義し、ポジション別に成長を予測するモデルを構築したうえで、転移学習により各選手の最適出場時間を予測した。FW以外のポジションではフル出場が望ましく、FWは脳疲労の蓄積からより短時間での出場が効果的であることが示唆された。","methods":["機械学習","回帰分析"],"themes":["選手起用","育成・指導"],"data":["公式成績データ"],"free_tags":["コンディション"],"awards":[],"text_insufficient":false,"excerpt":"近年サッカー界では若手選手の需要が著しく高まってきている。現在の市場価値ランキングとしてはトップの10人全てが25 歳以下であり、1 位のErling Haaland は23歳だ[1]。こうした若手選手たちが市場価値を高めているのは、本人たちの実力に加え様々な理由が考えられる。一つは将来性と成長の可能性だ。年齢的にまだまだ経験を積める選手たちは、これからのキャリアの過ごし方によってトッププレイヤーになる可能性がある。このことよりクラブや代表チームにおいて非常に重要になる選手となる可能性が高まり、市場価値も高まる。次に長期にわたる契約の安定性だ。若手選手はベテラン選手と比べてクラブと長期間の契約を締結することが一般的である。若手選手が活躍することができればクラブは将来の投資に成功することができ、他のクラブがその選手を獲得しようとして契約期間が残っていれば違約金を獲得することができるため、クラブは若手選手と契約を結ぶことで大きなメリットが得られる。例えば、Amsterdamsche Football Club Ajax のビジネスモデルにおける顧客はファンやスポンサーに加え「ビッグクラブ」を対象としている[2]。Real Madrid CF のようなビッグクラブのビジネスモデルにはスター選手が欠かせず、そうしたクラブに対しAmsterdamsche Football Club Ajax は若手選手を育成して市場価値を高めたところで売却することで利益を出している。こうした理由から若手選手は重宝され、各クラブは適切な育成を施す必要がある。そして本研究では育成において試合に出場する時間に注目した。サッカーという競技は、ダッシュ,ストップ,キックなどの高強度運動が長時間にわたって断続的に繰り返されるため,結果としてそれらによる疲労が無気力感,集中力の欠如,思考能力の低下などを招く場合がある。サッカーという高度に状況判断能力が要求されるスポーツにおいてこうした中枢疲労が生じた場合,状況判断能力にネガティブな影響を及ぼし,競技パフォーマンスを低下させることは十分考えられる(大森ら,2007)[3]。このことより、若手選手にとって試合に出場することは市場価値を高めるために結果を残すチャンスだが、あまりにも試合出場時間が長いと疲労によりパフォーマンス低下につながり市場価値を落とすことになりかねない。そのため本研究の目的は市場において需要が高まる若手選手に限定し、将来の成長に繋がる適切な出場時間を予測することである。この研究を行うことで、若手選手は自身の市場価値を無駄なく高めることができる。また育成段階の若手選手を保有するクラブは、選手を出場させるうえでの明確な指標ができて移籍する際の利益の最大化を目指すことができる。本稿では現時点の基礎分析結果を示し、それを基に有用なモデル作成に繋がる分析アイディアを提案する。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_89","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカー指導におけるAI支援システムの検討","members":"大輪拓也(九州工業大学)，高木正則(電気通信大学)","first_author":"大輪拓也","affiliation":"九州工業大学","code":"P2-27","abstract":"サッカーの指導者不足や指導品質の問題に対応するため、AIやIT技術を活用した支援システムの可能性について、関連研究を紹介した。姿勢推定や加速度センサを用いた技術評価など、複数の支援手法が検討された。","methods":["可視化"],"themes":["育成・指導"],"data":[],"free_tags":["AI支援"],"awards":[],"text_insufficient":false,"excerpt":"著者は小学生のサッカーチームのコーチを担当しており、日々の指導における課題を科学的に解決したいと考えている。本コンペティションのデータ解析によるアプローチを検討したかったが、残念ながら時間の都合により間に合わなかった。そこで、本稿では解決したい課題と、その解決策を検討するための参考になると考えられる関連研究について紹介する。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_98","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"J リーグにおける5レーン理論を基にした戦術分析: PAに着目して","members":"溝口由人，安藤雅和(千葉工業大学)","first_author":"溝口由人","affiliation":"千葉工業大学","code":"P2-28","abstract":"横浜F・マリノスと川崎フロンターレのポゼッション戦術とサガン鳥栖とサンフレッチェ広島のカウンター戦術を比較し、ペナルティエリア進入の方法と効率性を分析した。ハーフスペースを活用したスルーパス戦術がポゼッション型チームの特徴であることが確認された。","methods":["統計的検定","可視化","空間分析"],"themes":["戦術分析","ポジショニング","フォーメーション"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["5レーン理論","ハーフスペース"],"awards":[],"text_insufficient":false,"excerpt":"現代においてサッカーは多くの戦術があるが、本研究では「5 レーン理論」という戦術を取り上げる。5 レーン理論とは従来センターとアウトサイドの 3 レーン構成で攻撃戦術を考えられたものを、センターとアウトサイドの間にハーフスペースを作り 5 レーンとして攻撃を考える戦術である。この戦術のメリットはペナルティエリア(以下、PA と略す)に進入しやすくなることや、クロスに頼り切らない戦術になるため、攻撃の幅が広がることが挙げられる。また、この戦術は昨年 12 月に行われたクラブワールドカップで優勝したイギリスのチームであるマンチェスター・シティも使用している戦術である。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_59","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"言語モデリングによる行動選択・状態推移確率の推定に基づく選手定量評価指標","members":"染谷大河(東京大学)，川口康平(香港科技大学)，藤井慶輔(名古屋大学)","first_author":"染谷大河","affiliation":"東京大学","code":"[口頭]サッカー1","abstract":"言語モデル(LLM)を用いてトラッキングデータとイベントデータを統合し、選手の行動選択確率と状態遷移確率を推定することで、従来の指標では捉えられない攻撃貢献度を評価する指標を構築した。提案手法により得られたQ値はシーズン総得点と正の相関を示し、言語モデルとゲーム理論の組み合わせによる選手評価フレームワークの妥当性が示唆された。","methods":["LLM活用","機械学習","強化学習","時系列解析"],"themes":["選手評価","ゴール期待値","試合の流れ"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":["サッカー部門 優秀賞"],"text_insufficient":false,"excerpt":"計測技術の発達や分析手法が発展したことなどを背景に、応用的なスポーツ分析が広く行われるようになっている。しかし、サッカーなどのゴール型スポーツにおいては、複数エージェントが絡む連続的な時系列情報を分析する必要があり、その成り行き全体をモデリングすることは難しい。チームスポーツ、特にサッカーにおける定量的な評価指標としては、パスやシュートが起きた時点のボールの位置やボール周辺の情報を入力として、比較的シンプルな機械学習モデルを用いてゴールの期待値や行動の価値などを推定する手法などが提案されているが、ボール非保持者の動きを考慮できていない、パスやシュートなどの特定のプレーに評価対象が限定されているという問題点があった(e.g., [1])。そこで近年では、ピッチ上の各選手とボールの座標や速度を状態とした上で、それを観測し行動を選択するエージェントを強化学習の手法を用いて構築することを通して、特定のプレーに限定されず、またボール非保持時の動きを含めた評価が試みられている[5]。一方、近年自然言語処理の分野ではChatGPT などの台頭を背景に、大規模言語モデル(LLM)がますます注目を浴びている。LLM は、自然言語を処理する能力が非常に高いことで注目されているが、一般の系列予測能力が高く、強化学習やマルチエージェント動作予測など、従来全く別の方法で取り組まれてきた分野でも有用であることが報告されている。実際、近年イベントデータ系列をTransformer を用いてモデリングすることを通してより精緻な評価指標や選手の表現の獲得を試みる研究はあるが(e.g., [7])、トラッキングデータとイベントデータを合わせた上で、トークン化して完全に言語モデルとして定式化した例はない。そこで本研究では、ゴール型チームスポーツ、特にサッカーの試合のモデリングをピッチ上に存在する複数選手の観測する状態と選択した行動をトークン化した系列の予測問題として定式化し、それを予測する言語モデルを構築する。言語モデルを使うことで、事前学習済みモデルを使うことで自然言語による事前学習の恩恵を受けられる可能性があるほか(cf., [3])、従来の強化学習モデルを用いた研究群で行われていた状態(観測)に条件付けられた行動選択確率だけではなく、状態遷移確率までモデリングすることが可能になる。また、これにより得られた行動選択確率や状態遷移確率を用いることで、逆強化学習の枠組みで選手やチームの定量指標の構築が可能になる(cf., [4, 6])。本研究では、行動選択確率を言語モデルで算出し、強化学習の枠組みに基づき状態行動価値(Q 値)を算出する枠組みを初めて提案した。実験の結果、言語モデルが予測するエージェントの行動選択確率は、従来のxG のような指標では必ずしも捉えられない、シュートやボール保持者のアクションではないが、ゴールの期待値を高めるような行動の情報を捉えた指標になっていることが示唆された。さらに、この行動選択確率を元に算出されたQ 値は、シーズンの総得点数と同様の傾向を示すことがわかった。","excerpt_src":"導入"},{"id":"2023_soccera_1_3","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"動的ネットワークマーカーを用いたチャンスの予兆検出","members":"竹内颯汰，大友直史，福崎竜之輔，内藤大貴，佐野幸恵(筑波大学)","first_author":"竹内颯汰","affiliation":"筑波大学","code":"[口頭]サッカー2","abstract":"選手のスピード時系列データからネットワークを構築し、動的ネットワークマーカー(DNM)を用いてサッカーのチャンス予兆を検出した。サブネットワークサイズ3人・時間窓2秒の設定で、チャンス前75秒以内のDNMスコア上位0.05%値から80%以上の確率でチャンスを検出することに成功した。","methods":["ネットワーク分析","時系列解析"],"themes":["戦術分析","試合の流れ","ポジショニング"],"data":["トラッキングデータ"],"free_tags":["動的ネットワークマーカー"],"awards":[],"text_insufficient":false,"excerpt":"様々な要素が相互に影響しあうシステムでは, 予測困難な変化が起こる可能性がある. この変化をとらえるために変数のダイナミックな挙動やネットワーク構造を用いて数学的性質からシステムの状態をとらえようとする手法が提案された[1]. この手法は, 医学的な分野において,「動的ネットワークバイオマーカー(Dynamical Network Biomarker, DNB)」と呼ばれ, 一般のシステムに対しては「動的ネットワークマーカー(Dynamical Network Marker, DNM)」と呼ばれている[2].この手法は主に生体を対象にして実データ解析が行われてきたが, 近年, 医学の分野だけではなく, 金融為替の変動検知[3] や高速道路での渋滞予測[4], インターネットのコンテンツへのアクセス変化予測[5] への適用も行われている.本研究においても,DNM をサッカーの試合における選手の移動軌跡データへ適用させることで,試合状況の変化を検知することを試みる.サッカーの試合状況の予測に関しての先行研究として,成塚ら[6] は, チームのフォーメーションにおける全選手の平均座標や位置情報に基づいたネットワークに着目して,攻撃と守備でのフォーメーションの違いを検証した. 奥富ら[7] は, 各選手の配置から選手間の距離や選手間に生じるスペースに着目して, 守備構造の頑健性について検証した. また, 神谷ら[8] は, 選手のトラッキングデータを用いてサッカーの戦況変化の自動検出を, 選手の守備位置や選手間の距離を用いて行った. このように, 各パラメータの時系列変化を定量化・可視化することで, サッカーにおける戦況変化を検出し, サッカーの戦術分析への活用が進められている.これら, 多くのサッカーに関する研究では選手の位置情報に基づき, 選手間の距離やフォーメーションからチームの守備を評価する研究が一般的になっており, 各選手のスピード(移動速度)に着目した研究はほとんどなされていない. 戦況変化の自動検出に関する研究においても, 選手の位置情報がパラメータとして用いられており, スピードは考慮されていない. 一方でサッカーの試合中は,複数の選手が同時に攻め上がったり,守備に戻ったりする場面は多く見られ,各選手のスピードは戦況と結びついていると考えるのは自然である. このような点を踏まえて,本研究では,選手の位置情報ではなく,スピードに着目してネットワークを構築し,スピードの相関から関係性やつながりを検出し,試合の戦況変化を予兆する.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_92","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"軌道のスコアに基づく逆強化学習を用いたサッカーのプレイにおけるポジショニングの評価","members":"江尻尚馬，髙鍬真輝，福永修一(東京都立産業技術高等専門学校)","first_author":"江尻尚馬","affiliation":"東京都立産業技術高等専門学校","code":"[口頭]サッカー3","abstract":"軌道のスコアに基づく逆強化学習とカーネル関数を用いて、サッカーにおける個人選手のポジショニングを定量的に評価する手法を提案した。J1リーグのトラッキングデータに適用し、フィールド上での位置評価が得点寄与度と関連することを示した。","methods":["逆強化学習","機械学習","カーネル密度推定"],"themes":["選手評価","ポジショニング","戦術分析"],"data":["トラッキングデータ"],"free_tags":[],"awards":["サッカー部門 学部生奨励賞"],"text_insufficient":false,"excerpt":"侵入型ゲームであるサッカーにおける選手のポジショニングの評価は一般的に難しいとされている.その評価されるデータは多様な動きを行うプレイヤーが22 名存在する時系列の多次元データであり,似た動きであっても状況が異なる場合が多い.また,得点に至るまでの様々なプレーを評価するのは困難である.サッカーにおける選手のポジションの定量的評価は戦術による分類や軌道予測,集団の動き,プレーの種類等,様々な観点から評価する研究が行われている.その手法の一つに得点の期待値や難易度からパスの価値を評価する研究が行われている[1].しかし,ポジショニングについては選手やチームの得失点に関連付けして評価するのが難しいとされている.そこでチーム全体のポジショングに注目し,勝敗につながるプレーを評価したValuing Actions by Estimating Probabilities (VAEP) が提案された[2].これは全選手とボールの座標から得点予測を行い,チームのポジショニングについての評価を行う指標を提案した研究である.しかし,チームのディフェンスに対しては評価が難しいという特徴があった.そこでValuing Defense by Estimating Probabilities (VDEP) が提案された[3].この研究ではボールタッチが少なく評価が難しいとされているディフェンスのプレーからプレイングとポジショニングの良し悪しを評価した.しかしながら,この研究ではあくまでチーム全体を評価したものであり,個人のポジショニングを評価するような指標ではなかった.個人のプレーを評価した研究にExpected Contribution to the Outcome of the Match (ECOM) がある[4].これはボールを持っている状態で得点につながりやすいパスやそれに似たパスを行った場合に評価が高くなる指標によって選手がどれだけ試合に貢献したかを評価したものであった.しかし,この研究はボールを持っている状態を評価したものであり,ボールを持っていない状態での選手を評価したものではなかった.強化学習は学習者であるエージェントが目的のタスクに対して試行錯誤を行い,環境からの報酬を最大化するように学習する機械学習の一つの手法である.しかし,複雑なタスクに対してはエージェントが目的を達成するように報酬関数を設計するのは難しいとされている.逆強化学習はある方策に従って最適なタスクを行う熟練者の状態遷移から報酬関数を推定する手法である.この手法によって,複雑なタスクに対しても自動的に報酬関数を設計することが可能になった.そのため,報酬の高い状態が評価の高い状態だと解釈したとき,サッカーのタスクにおいても,選手のポジショニングに対する報酬関数を推定することで,選手の評価の高いポジショニングを推定できると考えられる.逆強化学習と同様に教師データをもとにした機械学習に熟練者の状態遷移から方策を学習する模倣学習がある.そして,サッカーにおいても戦術的に意義のある選手の軌道の生成を目的とした模倣学習の研究が行われている[5].この手法によって評価が難しい守備の選手についての軌道を生成することができた.しかしながら,模倣学習により選手のポジショニングの評価を行う研究はこれまでなされていない.また,一般的な逆強化学習や模倣学習では最適もしくは準最適な軌道を用いて軌道を推定するが,軌道を得る際に熟練者の負担や学習によるコストが必要となる.逆強化学習の一つの手法に軌道のスコアに基づく逆強化学習がある[6].軌道のスコアに基づく逆強化学習では,任意の軌道とその軌道に対する評価者によるスコアのペアによって報酬関数を推定する.そのため,エージェントの軌道と付与されるスコアを用いることで,環境の特徴量に対する評価値となる報酬関数を推定することが可能になった.また,熟練者の最適な軌道だけではなく,最適でない軌道も学習に使えるため,効率的な学習を行うことができる.本研究では,軌道のスコアに基づく逆強化学習を用いてサッカーにおける選手個人のポジショニングを評価する方法を提案する.提案手法は選手の軌道に対してスコアを付与し,軌道とスコアから報酬関数を推定する.推定した報酬関数は選手のポジショニングを評価した関数となっている.J1 リーグのトラッキングデータに提案手法を適用し,推定した報酬関数が選手のポジショニングを評価していることを示す.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_72","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"イベント時空間予測と数理モデルに基づくサッカーの包括的スペース評価指標","members":"太田阿留(京都大学)，藤井慶輔(名古屋大学)，日置尋久(京都大学)","first_author":"太田阿留","affiliation":"京都大学","code":"[口頭]サッカー4","abstract":"イベント時空間予測モデルに選手位置情報を組み込み、PPCF空間評価と組み合わせたHSSスペース活用指標を提案した。チームのスペース有効活用を定量評価でき、2022年度優勝チームで高いHSS値を示すなど、試合結果との相関が確認された。","methods":["ニューラルネットワーク","深層学習","確率モデル","機械学習"],"themes":["スペース評価","チーム評価","戦術分析"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":["サッカー部門 優秀賞"],"text_insufficient":false,"excerpt":"データ解析の進歩と計測技術の進化により、さまざまなスポーツにおいてデータを用いた評価手法にも大きな変化がもたらされている。たとえば近年、球技系チームスポーツにおいては、試合中の選手の動きやボールの位置に関する詳細なデータが収集され、これらの情報は選手やチームのパフォーマンス評価に不可欠な要素となっている。本研究の対象であるサッカーにおいては、選手の走行距離やスプリント回数、あるいはポジショニングの分布などが、収集されたトラッキングデータを用いて可視化され、個々の選手の技術的あるいは戦術的な能力を評価する上で重要な指標とされている。しかし、チームスポーツにおける勝敗は、決してそのような個々の選手の技能のみで決まるわけではなく、選手同士の連携やチームとしての戦術が試合の結果を大きく左右しうるものである。そのようなチームとしてのパフォーマンスを評価するには、ゴールやアシストといった個々人の成果指標を用いるだけでなく、各選手がチーム内でうまく連携をとれているか、チーム戦術にどのように貢献しているのか、あるいはチームの戦術自体は妥当かなどを評価することが必要と考えられる。現状ではこのようなチームのパフォーマンスを定量的に評価することは、ゴールやアシストのように数値データの評価とは異なって困難である。しかしその重要性から、これまでもチームとしてのパフォーマンスの評価の研究は行われてきている。サッカーにおける攻撃戦術の定量的評価の研究には、主に得点やそれにつながる効果的なプレー(シュートやクロスなど)の予測に基づく方法と、選手の空間的配置を数理モデルにより評価する方法が存在する。前者の代表としては、例えばボールの位置から得点確率を予測することにより、得点の期待値を計算する研究や[1]、その得点の期待値とパスを成功させる難易度との関係に基づいてパスの価値を評価した研究[2] がある([3] などでレビューされている)。後者の代表例には、スペースを評価した研究[4] や[5]の研究が存在する。これらのアプローチにはそれぞれ利点とともに限界が存在する。予測に基づくアプローチにおいては、プレーの履歴から高次元の特徴抽出を行うことで明示的なルールを与えることなく将来のプレーが予測できる反面、まさにその理由によってプレイヤーの位置などによって決まる明確なルールや価値を明示的に扱うのが困難である。YeungらのNMSTPP(Neural Marked Spatio-Temporal Point Process)[6] では、シュート、パスなどのプレーをイベントとしてとらえ、時空間点過程モデルによって,イベント予測を行っている。しかしNMSTPP では、イベント予測に用いるのはボールの位置情報のみである。そこで攻撃側、守備側それぞれの選手の空間的位置を明示的に考慮に入れることで、さらなる良い予測が可能になると考えられる。一方で、数理モデルに基づくアプローチでは、モデルによってルールや価値を明示的に扱うことが可能である反面、予測に基づくアプローチのように、プレーから抽出可能な高次元の特徴量を扱うことは難しい。そこで本研究では、チームとしてのスペースの有効活用の良否を評価することを目的として、予測に基づくアプローチと数理モデルに基づくアプローチを組み合わせた指標を提案する。本研究では、その提案する指標をHSS(Holistic Space Score) と呼ぶことにする。HSS ではまず、イベント時空間予測モデルであるNMSTPP モデル[6] を改良し、過去のプレーと選手の位置情報をもとに将来のプレーを点過程におけるイベントとして予測する。次に、予測されたイベントをスペースを評価する数理モデルであるPPCF (Potential Pitch Control Field)[4] を用いて計算された空間的価値で重みづけすることで、チームのプレーにおけるスペースの活用を定量的に評価する。本研究の新規性は主に次の3 点にまとめられる。まず最初に(i) 時空間予測モデルと数理モデルを組み合わせることで解釈性を担保したままチームのスペース活用を定量的に評価したこと、次に(ii) イベント予測モデルのNMSTPP モデルに位置情報を加えて拡張したこと、最後に(iii)2022 年のJ リーグのデータを用いて提案手法が直観に合うことを実証したことである。図1 に本研究で提案するHSS のモデルを示す。","excerpt_src":"はじめに"},{"id":"2023_soccera_1_70","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるスペース評価に基づく攻撃時の選手配置評価","members":"木下慶悟，栗原柾由，島田尚(東京大学)","first_author":"木下慶悟","affiliation":"東京大学","code":"[口頭]サッカー5","abstract":"Pitch Controlモデルに基づく経路コストモデルを提案し、トランジション時の被カウンター阻止観点から攻撃時の選手配置を定量評価した。最短経路の経路コスト最小値がカウンター阻止の結果と相関し、配置の良さを表す指標として有用性が確認された。","methods":["空間分析","最適化","シミュレーション","指標開発"],"themes":["スペース評価","ポジショニング","トランジション"],"data":["トラッキングデータ"],"free_tags":[],"awards":["サッカー部門 最優秀賞"],"text_insufficient":false,"excerpt":"サッカーはボールをゴールに入れるという目的を達成するために,互いのチームの選手11 人がピッチ上を自由に動き回るスポーツである.より複雑性の高い戦争や,より身近で単純なチェスや将棋といったボードゲームなどと同様に,サッカーはピッチ上という空間に選手をどのように配置するかが非常に重要なゲームである.配置が重要なゲームである以上,その配置の良さを定量化し評価することができるようになれば,指導者は選手やチームのパフォーマンスを改善することができる.攻撃時に選手が配置を取る目的の1 つは攻撃の成功である.シュートを打ち,ゴールを奪うために選手は配置をとる.一方で,実際には攻撃の成功だけでなく,もしボールを奪われトランジション(攻守の切り替わり)が発生した際に相手によるカウンター攻撃,すなわち被カウンターを阻止するということもまた,配置を取る目的の1 つに挙げられる.被カウンターを常に想定しながら配置をとることは,攻撃を成功させることと同様に重要である.攻撃を成功させるような選手配置を定量化する先行研究は多数存在する[1][2] ものの,トランジションに着目し,被カウンター阻止という観点から選手配置を定量化する研究はこれまで十分に行われていない.本研究の目的は,攻撃時の選手配置の良さを被カウンター阻止という観点から定量化することである.以下,元々ボールを持って攻撃しており,トランジション後に守備に移行して相手のカウンター攻撃を受けるチームを「被カウンターチーム」,反対に元々守備をしており,トランジション後にカウンター攻撃に移行するチームを「カウンターチーム」と呼ぶこととする.被カウンターチームにとって最も悪い選手配置とは,トランジションの発生位置から自陣ゴールまでを相手に直線的な経路で進まれてしまうような配置であると考えられるため,可能な限り直線的な経路で進ませないような配置が良い配置であるという仮説を立てられる.第2 項では,初めにその仮説を基にどのように選手配置をモデル化,定量化したかを示す.次に,実データにより定量化した指標が妥当であるかどうかを評価する方法を示す.","excerpt_src":"背景"},{"id":"2023_soccera_1_15","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるボール保持選手へのプレッシャーとサポートの評価","members":"坂本郁也(中央大学)，山崎義弘(早稲田大学)，山本健(琉球大学)，成塚拓真(立正大学)","first_author":"坂本郁也","affiliation":"中央大学","code":"[口頭]サッカー6","abstract":"本研究は最小到達時間に基づくスペース評価から、ボール保持選手に対するプレス度合いとサポート度合いを定量化した。ボール保持中にプレス度合いが減少し、プレスをかけられるほどボール保持時間が短くなり、プレス状況では危険なスペースへのパスが増える傾向が明らかになった。","methods":["ネットワーク分析","空間分析","統計的検定","カーネル密度推定"],"themes":["ポジショニング","プレッシング","スペース評価","パス"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["最小到達時間"],"awards":[],"text_insufficient":false,"excerpt":"サッカーでは,ボールの保持によって攻撃側と守備側のチームに分けることができる.攻撃側のチームは,複数の選手を経由してボールを前線に運び得点機会を作る.一方,守備側のチームは選手をうまく配置して,攻撃側の得点を阻止する.攻守いずれの立場でも,チーム全体でいかに価値のあるスペースを支配するかが重要になる.これは,選手個人として見れば,ポジショニングの問題となる.スペースに対して価値を定量化するには様々な方法が考えられるが,我々は最小到達時間に基づくスペース評価に取り組んできた.最小到達時間とは,Taki et al. 1996 で提案された概念であり,「時刻t にチームの中で位置⃗x に最も早く到達できる選手の到達時間」と定義される[1].これまでに,Narizuka et al. 2021 では,攻撃側と守備側の最小到達時間からスペースの安全度と空白度を定義し,スペース評価の基本的な枠組みを構築した[2].また,Narizuka et al. 2023 では,最小到達時間を具体的に計算するためのモデルとして,運動方程式に基づくFujimura-Sugihara モデルが妥当であることを示した[3].さらに,2022 年度コンペティションでは,選手のポジショニングを評価するために,特定の選手の位置に対する最小到達時間を導入しデータ解析を行った.この解析では,時刻t における選手i の位置⃗xi に対し,味方選手からの最小到達時間をτsame(⃗xi, t),相手選手からの最小到達時間をτopp(⃗xi, t) とし(図1),クラスター分析によってポジションごとの特徴を調べた.本研究では,以上の解析をさらに発展させ,τopp を相手選手からのプレスを特徴づける量,τsame を味方選手からのサポートを特徴づける量と解釈して,ボール保持選手のダイナミクスから特徴を抽出する.","excerpt_src":"はじめに"},{"id":"2023_soccera_1_14","year":2023,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"実データを活用した強化学習におけるサッカーエージェントの作成","members":"若林大起，大原剛三(青山学院大学)","first_author":"若林大起","affiliation":"青山学院大学","code":"[口頭]サッカー7","abstract":"本研究は実試合データから逆強化学習により選手のポジションと位置を考慮した報酬関数を推定し、敵対的学習戦略を組み合わせたサッカーエージェントを構築した。提案手法により、学習後のエージェント位置分布が現実の選手のそれに近づき、ミッドフィルダーの位置分布が再現されることが確認された。","methods":["強化学習","逆強化学習","深層学習","シミュレーション"],"themes":["ポジショニング","戦術分析","フォーメーション","選手起用"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"刻々と変化する状況に対応した適切な行動選択が求められるサッカー選手の行動を探索・分析するために,シミュレーション環境[1] を用いた強化学習によるサッカーエージェントの開発が盛んになっている[2, 3].しかし,離散的な報酬値に起因する特定動作への学習の偏り,フォーメーションやポジションの反映の困難さなどにより,現実の選手の動きを再現するサッカーエージェントは実現できていない.これに対し本研究では,実試合データから逆強化学習(IRL: Inverse Reinforcement Learning)[4] を用いて選手のポジションと位置を考慮した報酬関数を推定する.また,推定した報酬関数を用いるサッカーエージェントの強化学習では,オフェンスとディフェンスを交互に学習する敵対的学習戦略を用いる.その結果,オフェンスに関して,より現実に近い動作を実現した.","excerpt_src":"はじめに"},{"id":"2023_basketa_1_21","year":2023,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"Bリーグの試合結果を予測するアプローチの考案","members":"川島京子，小泉和之(順天堂大学)","first_author":"川島京子","affiliation":"順天堂大学","code":"P1-29","abstract":"Bリーグの2021-22および2022-23シーズンのデータから、試合結果を予測するため複数の機械学習モデルを構築・比較した。ロジスティック回帰が最高精度を示し、得点やリバウンドなどの特徴量が試合結果に重要な影響を与えることが明らかになった。","methods":["ロジスティック回帰","勾配ブースティング","機械学習"],"themes":["チーム評価","勝敗要因","得点予測"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年,スポーツデータの統計解析は,注目を集めており,データ分析が行われている[1].特に,詳細なデータがインターネットを通じて容易に入手でき,企業や研究機関だけでなくさまざまな人々がデータへのアクセスが可能となったため,さまざまなアプローチを通じたデータ解析が実現できるようになった[2].スポーツに関して,人々が最も関心を寄せる情報の一つは試合の勝敗結果である.","excerpt_src":"背景"},{"id":"2023_basketa_1_23","year":2023,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"バスケットボール競技における試合ペースとパフォーマンスの関連","members":"番井涼太，山本義郎(東海大学)","first_author":"番井涼太","affiliation":"東海大学","code":"P1-30","abstract":"Bリーグの試合データから、1試合あたりのポゼッション数である試合ペースを算出し、獲得得点、得点効率、ミス数との関係を分析した。試合ペースが速いほど得点量は増えるが、得点効率には影響を与えず、むしろミスが増加することが示唆された。","methods":["時系列解析","可視化"],"themes":["試合の流れ","チーム評価"],"data":["イベントデータ"],"free_tags":["ペース","相関分析"],"awards":[],"text_insufficient":false,"excerpt":"バスケットボール競技は,ボールの所有とシュートの攻防をめぐり,相対する2 チームが,同一コート内で同時に直接相手と対峙しながら一定時間内に得点を争うゲームである(日本バスケットボール協会, 2002) と述べられており, 勝利のためには対戦相手よりも多くの得点を獲得することが必要である. その得点を取る唯一の方法はシュートである. バスケットボール競技は, 限られた時間の中でより効率的に得点を奪い, 相手のシュートを防ぐ競技スポーツである. そのため, バスケットボール競技での攻撃の目的はシュートを放ち, 得点を獲得すること, 守備の目的は相手のシュートを防ぐことである. その方法もチームによって様々であり, スクリーンプレーを効果的に用いることや,ディフェンスの陣形などにも各チームで戦術的特徴が現れる. 本研究では, バスケットボール競技の試合ペースに着目し, チームのパフォーマンスとどのような関連があるかを考察する.","excerpt_src":"はじめに"},{"id":"2023_basketa_1_83","year":2023,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"点差が小さい試合で得点をする選手を見出すための指標考案","members":"小林莉緒，粟國晴楽，朝日弓未(東京理科大学)","first_author":"小林莉緒","affiliation":"東京理科大学","code":"P1-31","abstract":"チャンピオンシップの接戦試合終盤で得点を決める選手を識別するため、TS%に加えてAOP（Aggressive of Offence Point）指標を開発した。相関分析の結果、プレッシャー下での積極性がシーソーゲームでの活躍を評価する際に重要であることが示唆された。","methods":["指標開発","統計的検定"],"themes":["選手評価","得点予測","試合の流れ"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"バスケットボール選手のプレイを客観的に評価する指標について、現在まで多く研究されてきた。その中で、点差が小さい試合の終盤で精度の高いシュートを決め、チームを勝利に導く選手はどういった選手なのか客観的に示す指標として、TS%に注目した。TS%(True Shooting %)とは、2 ポイントシュート決定率、3 ポイントシュート決定率、フリースロー決定率の 3 つのシュートの決定率を一緒に計算することで、その選手の効率性を正確に計算できるスタッツである。TS% = PTS/(2×(FGA+(0.44 ×FTA)))×100 FTA = フリースロー試投数FGA = フィールドゴール試投数PTS= 得点数分母の『0.44×FTA』はフリースローを獲得したシュートの本数を表しており、『2×(FGA+(0.44×FTA))』はすべてのシュートが2 ポイントであった場合の総得点を表している。上記のように、TS%ではショートの質を定量的に表すことができるが、シーソーゲームで活躍する選手を見出すための指標としては、プレッシャーの中での選手の積極性が考慮されていないため、不十分であると考えた。そこで、選手のシュートの質に加えて、積極性を評価する指標である、AOP(Aggressive of Offence Point)を考案した。AOP の計算方法は以下である。'AOP' =( '3P 試投' + '2P 試投' + 'ダンク' + ‘被ファウル’ + '被ブロックショット' )/ 'プレイタイム(秒)' AOP は、試合に出場した秒数当たりの3P、2P の試投数、ダンク数、被ファウル、被ブロックショットの数とした。TS%でシュートの質や1シュート当たりのうまさを評価することを前提とし、選手がいかにゴールに向かったかを評価するために、試投数やダンク数だけでなく、ファウルやブロックショットを被った数も含めた。本研究では上記の二つの指標と、得点差の小さい試合の終盤で得点を決める選手との相関を検証した。","excerpt_src":"はじめに"},{"id":"2023_basketa_1_22","year":2023,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"バスケットボールにおける第一ピリオドの結果と最終的な試合結果の関係: 「流れ」の取得回数の差から考察する","members":"津野裕俊，柳谷ひなこ，伊藤優実，染谷璃央，南沢解，廣津信義(順天堂大学)","first_author":"津野裕俊","affiliation":"順天堂大学","code":"P2-29","abstract":"Bリーグの2021-22および2022-23シーズンのプレイバイプレイデータから、第一ピリオドでの「流れ」の獲得回数を定義し、流れの差とホーム・アウェイの勝率の関係を分析した。流れ取得回数の差が大きいほど、その差を獲得したチームの勝率が向上することが示された。","methods":["時系列解析","統計的検定"],"themes":["試合の流れ","勝敗要因"],"data":["イベントデータ"],"free_tags":["ポゼッション"],"awards":[],"text_insufficient":false,"excerpt":"バスケットボールの指導の中でよく「試合の入りが大事」 という言葉を耳にする。 岸・山崎・堀野(2008)ではサッカーの研究で 「男女に関わらず、 先制チームは、被先制チームに比べて有意に勝率が高いことが分かった」と定義している。そこで、バスケットボールでもこのような声掛けがどれだけ信憑性のあるものなのかということについて、両チームのポゼッションの連続取得回数の差に注目して研究していく。","excerpt_src":"研究目的"},{"id":"2023_basketa_1_45","year":2023,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"チームの勝敗は翌年の観客動員数に関係するか","members":"山本悠太，徐広孝(静岡産業大学)","first_author":"山本悠太","affiliation":"静岡産業大学","code":"P2-30","abstract":"Bリーグの2021-22および2022-23シーズンのデータから、前シーズンのチーム勝敗と翌シーズンの観客動員増加率の相関係数を分析した。勝敗は同シーズンの観客動員数と関連があるが、翌年の観客動員数にはほぼ影響しないことが明らかになった。","methods":["統計的検定"],"themes":["チーム評価","経営・制度","観客・ファン"],"data":["公式成績データ"],"free_tags":["観客動員","相関分析"],"awards":[],"text_insufficient":false,"excerpt":"日本におけるプロバスケットボールリーグ (以下「B リーグ」とする)は 2016 年に発足し、野球、サッカーに続く 3 番目の球技のプロスポーツリーグとして注目を集めた。現在、B リーグは 8 年目のシーズンを迎えており、日本のバスケットボールが国際的に通用するレベルに成長したことに影響を与えていると思われる。しかし、 クラブ経営という観点においては、競技水準の向上(勝利の追求)と同じかそれ以上に観客の動員が重要である。観客によるチケットやグッズの売り上げは、クラブの経営資金にとって大きなウエイトを占めているため、いかに多くの観客を集めるかを念頭に置いたクラブ経営が求められている。一般的に、競技スポーツは「勝つこと」が盛り上がりの主たる要因である。 国際大会においても、 日本代表が勝ちあがることで民法放送が決定したり、ファンの熱い視線を集めたりすることができる。これは B リーグにおいても同じであろう。自分が応援しているチームが勝つことで「次もスタジアムに足を運ぼう」というファンの気持ちを生み出すに違いない。逆に負け続ければ、 「今シーズンはもう諦めた」という気持ちを生むかもしれない。このような「 勝敗」と「観客動員数」 の関係性があるならば、B リーグにおいて勝数の多いチームは、翌シーズンの観客動員数を増やす可能性がある。そこで本研究は、チームの勝敗と翌年の観客動員数の関係性を明らかにすることを目的とした。","excerpt_src":"はじめに"},{"id":"2023_basketa_1_94","year":2023,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"ジャンプボールの公平性について","members":"石内柾翔，三浦友太朗，深谷和泉，山入端涼香，安藤雅和(千葉工業大学)","first_author":"石内柾翔","affiliation":"千葉工業大学","code":"P2-31","abstract":"21-22シーズンのプレイバイプレイデータを用いてジャンプボールの公平性を検証した。ジャンプボール獲得チームが先制点をとる確率は56.66%、試合に勝利する確率は37.45%であり、試合の勝敗に与える影響は限定的で公平性が高いことが判明した。","methods":["統計的検定","可視化"],"themes":["勝敗要因","ルール変更"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"スポーツの団体競技の多くは,試合開始前に先攻後攻を決めてから試合が始まる.サッカーでいえばコイントスを利用したり,バレーボールではじゃんけんで決めたりと,ある程度公平性の高い決め方を採用している.しかし,バスケットボールではジャンプボールという一般的にチームで一番大きい人が中心のサークルに立ち,審判が上に投げたボールをタッチしてそのボールを取ったチームの攻撃で試合が始まる.この場合,背の高い人が先にボールに触れることができることから,そのチームが先に攻撃できるという不公平な状態になってしまうのではないかとも考えられる.ただ,バスケットボールにおいて,公平でないものを長く採用し続けるとは考えにくい.そこで,本研究では,提供データを用いて本当にジャンプボールが公平なのか,また,試合に大きな影響を与えてないかというのを検証していきたい.","excerpt_src":"はじめに"},{"id":"2023_basketa_1_63","year":2023,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"重回帰モデルとk-meansによるクラスター分析による予測勝率と実際の勝率の比較","members":"長坂正一郎，宿久洋(同志社大学)","first_author":"長坂正一郎","affiliation":"同志社大学","code":"[口頭]バスケ1","abstract":"バスケットボール試合の3ポイント成功率とチーム全体のファウル数を説明変数とした重回帰モデルを構築し、k-means法によるクラスター分析で4つのグループを分類した。実際の勝率と予測勝率の比較により、3ポイント成功率が高くファウル数が少ないチームが高い勝率を示すことを確認した。","methods":["回帰分析","クラスタリング","統計的検定","可視化"],"themes":["勝敗要因","チーム評価","選手起用"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"バスケットボールは,基本的に2 ポイントシュート,3ポイントシュート,フリースローによって得点をとり,いかに相手チームよりも得点を多くとるかが鍵となるスポーツである.その中で3 ポイントシュートは現代バスケットボールにおいて極めて価値のある得点源と捉えられている[1].したがって,3 ポイントシュートの成功率をチーム全体で高めることは勝利を獲得するために必須となっている.またバスケットボールは,相手選手への接触による反則の「ファウル」が試合を進めていく中で重要な存在となる.2 ポイントシュートや3 ポイントシュートを打つ際に相手にファウルをされることによって自チームの追加得点を狙うことができる.さらに,ファウルされながら(以下,被ファウル)2 ポイントシュートや3 ポイントシュートを成功させた場合,1 本のフリースローが与えられる.このフリースローは「1. フリースローを決めて1 点を得る」,「2. フリースローをわざと落として2 ポイントシュートを決める」,「3. フリースローをわざと落として3 ポイントシュートを決める」の3 通りのチャンスを状況に応じて作り出せる.逆に自チームまたは自身のファウル数が多くなることで,相手チームに対して得点を与えるチャンスを作り出してしまう.上記の内容から,バスケットボールにおいて3 ポイントシュートの成功率とファウルは,チームを勝利させるための重要な要因であると考えられる.しかし,2 つ変数の関係性から勝率を測られていない.つまり,3 ポイントシュートの成功率が高くともファウル数が多いため試合に敗北し勝率が下がるのか,または3 ポイントシュートの成功率が低くともファウル数が少なければ試合に勝利し勝率が上がるのかという疑問を解決する.本研究では3 ポイントシュートの成功率とチーム全体のファウル数の重回帰モデルを作成する.さらに,k-means 法を用いたクラスター分析を利用することで,クラスター群にどのような特徴がみられるのかを考察する.そこで以下のような流れで分析,考察を進めていく. 1. 基礎分析で1 試合当たりのチームごとのファウル数と3 ポイントの成功率を相関関係を知るために,相関分析を行う.またその結果を散布図で表記する. 2. 1 試合当たりの各チームのファウル数と3 ポイントの成功率を説明変数とし,各チームの勝率を目的変数と置いて重回帰モデルを作成する. 3. 作成した重回帰モデルから,「ファウルが多く成功率が高い」,「ファウルが多く成功率が低い」,「ファウルが少なく成功率が低い」,「ファウルが多く成功率が低い」の4 つのクラスターへの分類を目的としたk-means法によるクラスター分析を行う. 4. 重回帰モデルとクラスター分析から,実際の勝率と予測した勝率の比較とグループ群の比較によりどのような特徴があるのか考察する.一般的にチームファウルが少なく,3 ポイントシュートの成功率が高ければ,得点量は多くなり試合に勝ちやすくなる.そこで1 では,1 試合当たりの各チームのファウル数と3 ポイントシュートの成功率を集計して基礎分析を行う.2 では集計した3 つの変数を利用して重回帰モデルを作成する.3 では作成した重回帰モデルからk-means 法を利用したクラスター分析を行う.4 では重回帰モデルとクラスター分析よりグループ群から得られる考察を行う.","excerpt_src":"はじめに"},{"id":"2023_basketa_1_39","year":2023,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"「今日のあの選手、調子良いな」を探る: EFFを用いた選手の分類に着目して","members":"伊藤真大，伴地芳啓，Andrew Jonathan，三家礼子(早稲田大学)","first_author":"伊藤真大","affiliation":"早稲田大学","code":"[口頭]バスケ2","abstract":"Bリーグの2021-22および2022-23シーズンのデータから、選手の総合効率指標EFFを用いてk-means法による非階層クラスタリングを行い、選手を3つのタイプに分類した。系列パターンマイニングにより、タイプ別に調子の良さに関連するアクションパターンが異なることが明らかになった。","methods":["クラスタリング","機械学習","統計的検定"],"themes":["選手評価","試合の流れ"],"data":["イベントデータ"],"free_tags":["EFF指標","指標開発"],"awards":["バスケットボール部門 優秀賞"],"text_insufficient":false,"excerpt":"スポーツにおいて、調子の良かった試合、悪かった試合での活躍には差が生まれるものである。また、その調子の良し悪しは一般的に個人のそれまでの成績によって相対的に評価される。バスケットボールは非常に展開の早いスポーツであり、一試合の中で行われるアクションの数が多くなるため、プレイデータを確認することでその試合における調子の良さを測ることができると考えられる。例として、この分析の執筆時点に行われている、B リーグシーズン2023-24 にて得点王候補として期待されている、横浜ビー・コルセアーズ所属の河村勇輝選手を挙げると、2023年1 月21 日に行われたレバンガ北海道vs 横浜ビー・コルセアーズの試合では、プレイタイムが30 分を超える長時間で出場し、シーズン2022-23 の個人ベストとなる39 得点を記録し勝利した[1]。この試合は、河村選手の同シーズンの平均得点が19.5 点[2] であることからも、得点に関して調子が良かったことが伺える。対して、同年2 月11 日に行われたファイティングイーグルス名古屋vs 横浜ビー・コルセアーズの試合では、同様に30 分以上出場し勝利したが、河村選手の得点は17 点であった。では、この試合は調子が悪かったのだろうか。バスケットボールは得点が高いチームが勝利するルールであるが、その試合における活躍は得点のみに限られず、リバウンドやスティールといった得点につなげるための重要なアクションが存在し、選手によっても得意な活躍の要素は異なる。そこで本分析では、選手によって適切な視点でその活躍を評価することを目的として、個人の成績から見て、活躍した試合を調子の良かった試合と定義し、その種類をもとに選手のクラスタリングを行った。また、そのクラスタ別に試合で行われたアクションに対し、系列パターンマイニングを行い、ポイントとなるアクションを抽出した。","excerpt_src":"はじめに"},{"id":"2023_judoa_1_24","year":2023,"dept":"柔道部門","dept_detail":"柔道部門","title":"指導に関する分析","members":"窪松大和，加瀬稔弥，与座英之，番井涼太，山本義郎(東海大学)","first_author":"窪松大和","affiliation":"東海大学","code":"P1-32","abstract":"2018年、2019年、2021年の柔道試合データを用いてロジスティック回帰分析とランダムフォレストにより、指導が勝敗に与える影響を分析した。2回目までの指導で2回指導を受けた者が自分か相手かという要因が統計的に有意であり、勝敗に影響を与えることが確認された。","methods":["ロジスティック回帰","機械学習"],"themes":["勝敗要因","ルール変更"],"data":["イベントデータ"],"free_tags":["指導"],"awards":[],"text_insufficient":false,"excerpt":"スポーツ競技においては,ペナルティというルールを違反した者に対して何かしらの罰が与えられる.例えばサッカーなら重大な反則を犯した者に対してイエローカードやレッドカードが与えられる.イエローカードは累積で 2 枚目を受けたとき,レッドカードは 1 枚で退場処分になりチームは数的不利な状況で残りの時間を戦うことになる.しかし不利になるだけでありそこで勝敗が決定するわけではない.一方で柔道には柔道特有のペナルティとして,指導というルールがある.この指導というペナルティは全日本柔道連盟[1]によると重大な違反に対しては「反則負け」というペナルティ,軽微な違反に対する「指導」というペナルティがある. 指導は 3 回累積すると反則負けとなる.つまり柔道における指導は勝敗に直接的に関与するペナルティとなっている.本研究ではその指導が勝敗にどれほど影響があるのかについて調べた.","excerpt_src":"はじめに"},{"id":"2023_judoa_1_74","year":2023,"dept":"柔道部門","dept_detail":"柔道部門","title":"試合開始後初めに指導をとられた選手がその後取るべき戦略についての検討","members":"草刈優，中井陽敬，中島愛，菅原慎矢(東京理科大学)","first_author":"草刈優","affiliation":"東京理科大学","code":"P1-34","abstract":"2018年から2021年の世界選手権データを用いてプロビット分析を実施した。2016年のルール改正により、試合前半で指導をとられた選手の勝利確率が従来より上昇し、その後の技ありまたは指導取得が勝敗に有意に影響することが判明した。","methods":["統計的検定"],"themes":["勝敗要因","ルール変更"],"data":["イベントデータ"],"free_tags":["指導"],"awards":[],"text_insufficient":false,"excerpt":"全日本柔道連盟強化委員会科学研究部員の鈴木利一氏の発言に,「柔道は試合前半に指導をとられたら勝てない, 逆に指導をとったら8 割は勝つ」[1] というものがある. この言葉の通り, 柔道において最初にポイントをとる, そして罰則を極力避けることを重要視する傾向にあるように見受けられる. この発言は2016 年以前のルールに基づいたものであり, この発言の後にルールが改正されている.「有効」が廃止され, 指導による反則負けの回数が4回から3回へと減少し, 指導数の差による決着付けが廃止された.選手は今まで以上に攻撃的な姿勢が求められるようになったが, このルールの改正は実際の試合の傾向にどのような影響を与えているのだろうか. 先に指導をされた選手に着目して実際のデータを分析していくと, どのようなことが見えて来るのか. また, どのような要因が試合の勝敗に影響を与えているのかを検討していく.","excerpt_src":"背景"},{"id":"2023_judoa_1_91","year":2023,"dept":"柔道部門","dept_detail":"柔道部門","title":"行動認識モデルを用いた柔道試合動画からの一本判定","members":"陸煒，盛拓矢，北島栄司，宮田龍太(琉球大学)","first_author":"陸煒","affiliation":"琉球大学","code":"[口頭]柔道1","abstract":"試合終了間際3秒間の動画から内股の一本判定を自動分類するシステムを開発した。審判の映り込み除去、両選手領域の自動追従、姿勢推定を経て行動認識モデルで分類し、内股一本と時間切れの2クラス分類で93.75%の正答率を達成した。","methods":["深層学習","画像認識・姿勢推定"],"themes":["戦術分析"],"data":["映像データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"本研究の大目標は,柔道の試合に使えるvideo assistant referee(V AR)システムを画像認識AIで構築することである.V ARとは,サッカーの試合でフィールドとは別の場所で複数のアングルからの映像を見ながら主審をサポートする審判員を指し,ワールドカップカタール2022での日本対スペイン戦で三笘薫選手が相手ゴール近くのライン際で外に出そうになったボールを中に折り返した場面の判定で用いられ,世に広く知られるようになった(詳細は「三苫の1mm[1]」等を参照). 著者らが上述した大目標を立てたきっかけは,シドニー五輪柔道男子100kg超級決勝で起きた誤審判定問題[2]にある.この問題は日本代表の篠原信一選手とフランスのダビド・ドゥイエ選手との対戦で,ドゥイエ選手の内股を藤原選手が内股すかしで切り返したことでドゥイエ選手は背中から引っくり返ったので,本来であれば篠原選手の一本勝ちとすべきところを主審と2人いる副審のうちの1人がドゥイエ選手の有効と判定し,ドゥイエ選手に加点されてしまったアクシデントを指す.この大会後からビデオ判定導入の機運が高まり,2005年に国際柔道連盟は試合での正式採用を決めた. 以上より,柔道の試合において主審および副審が(選手と同じ目線に立っているからこそ視えるものもあるだろうが当然死角も存在するので)その一瞬の状況をより正確に判断するには,試合場から離れて俯瞰した映像に基づいて判定をサポートする仕組みが必要である. その取っ掛かりとして本研究では,動画から特定の動きを検知するAIである行動認識(action recognition)モデルを柔道の試合終了間際3秒間の動画に適用し,一本(かつそれが内股か背負い投げか)か時間切れかを簡易的に分類する手法を開発した.ここで柔道の「一本」とは,選手のどちらかが“相手を制し”つつその“背中が大きく畳に付く”形で,“強さ”がありかつ“速い”投げを打った場合に評価される技である.ダブルクォーテーションで囲った4つの条件が全て満たされて投げ技に対する 「一本」(かつその時点で勝敗も)決まるが,どれも定性的な表現で,相当な熟練者でないと正確な判断が困難であることは想像にたやすい.そこで我々は挑戦的テーマとして,動画に映る人物の肩や腰といった関節位置情報を動画のみから取り出すAIである姿勢推定(pose estimation)モデルを試合動画に適用し,一本を取られる倒し·倒され方をする際の各関節の一連の大まかな動き(時系列)の特徴を捉え,それを行動認識モデルに入力することで,定量的なデータに基づく審判サポートシステムの実装をめざす.","excerpt_src":"はじめに"},{"id":"2023_judoa_1_46","year":2023,"dept":"柔道部門","dept_detail":"柔道部門","title":"柔道試合中の選手の位置軌跡データの分析に基づく勝敗要因の検討","members":"今井桜，坂本奨馬，廣川加恵，華山宣胤(尚美学園大学)","first_author":"今井桜","affiliation":"尚美学園大学","code":"[口頭]柔道2","abstract":"動画解析ツールKinovea を用いて男子60kg級の一本勝試合における選手の帯位置の軌跡データを取得し、「振り回し/振り回され度」を分析した。2秒単位の長い時間枠では勝者が大きく動き、1/8秒単位の細かい動きでは敗者が振り回されていることが示唆された。","methods":["空間分析","統計的検定"],"themes":["勝敗要因","戦術分析"],"data":["映像データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"筆者らは,スポーツデータサイエンスコンペティション 2022 において,動画の試合場(畳)の上に等間隔のグリッドラインを引き(図1)1秒毎に観測した選手達の足位置から算出した「振り回し/振り回され度」 (図2)の分析を行った. その結果 「試合中の“丁度良い動き方”があり, それ以上動くと“振り回されて敗れ”, 動かないと“反則負け”となる」 ことを示唆する分析結果を得た.図1:動画に引かれたグリッドライン図2: 「振り回し/振り回され度」の考え方しかし,データは人間が目で動画を確認しながら得なければならず1秒毎の観測でも相当な時間が掛かってしまうため,多数の試合を分析することが難しいという問題が残った.また「1秒毎の位置確認が適当であるか?」についても検討を行う必要性を感じた.そこで,本研究では動画から選手の位置を観測するためにフリーの動画解析ツール“Kinovea”[1]を採用した.図1は Kinovea のインターフェースである. Kinovea では,画面上の任意の箇所にポインターを移動させ, 右クリック⇒Track Pathを選択すると,パインターがあった場所 (例えば選手の帯(腰))の動きを,指定した箇所(選手の腰など)をフレーム事(24/秒) 毎にトレースすることができる (図3) .図2:Kinovea のインターフェース図3:Kinovea でのTrack Path の実行本報告では,Kinovea を用いて得られた試合中の選手位置から得られた詳細な「振り回し/振り回され度」データの分析から,柔道試合の勝敗要因となる選手の動き方について議論する.","excerpt_src":"はじめに"},{"id":"2023_judoa_1_30","year":2023,"dept":"柔道部門","dept_detail":"柔道部門","title":"柔道競技における選手の積極性に対する指導の影響","members":"佐野和幸(（非公表）LINE株式会社)","first_author":"佐野和幸","affiliation":"（非公表）LINE株式会社","code":"[口頭]柔道3","abstract":"2018年、2019年、2021年世界選手権の2365試合を対象に、生存時間分析とワイブル回帰モデルを用いて指導が技発生までの時間に与える影響を分析した。累積指導数が増えるほど技が決まるまでの時間が短くなることから、指導が試合の活発さを促進する効果があることが示唆された。","methods":["生存時間解析","ベイズ統計","時系列解析"],"themes":["勝敗要因","ルール変更"],"data":["イベントデータ"],"free_tags":["指導"],"awards":["柔道部門 優秀賞"],"text_insufficient":false,"excerpt":"柔道は,その歴史と伝統を通じて,競技者の間で高い敬意と規律を育むスポーツとして知られている.試合の中での行動は,その精神を具現化し,競技者がルールを遵守し,公正で積極的な試合を行うことを奨励する.この観点から,指導の役割は極めて重要である.指導とは,柔道の試合中に反則行為があった場合に審判が行うペナルティの一種で,ルール違反を防ぎ,公正で活発な試合を促進するための重要な手段である.柔道はルール改正が頻繁に行われる競技であり,2017 年には指導による反則負けまでの回数が4 回から3 回に変更された[1].このようなルール改正は,試合の流れや競技者の行動に影響を与え,結果的に試合の活発さにも影響を与える可能性がある.これまでの研究では,ルール改正が競技内容に与える影響や,指導の判定時間を推定し,それに基づいて試合の優勢度合いを可視化することで,試合の進行や結果に対する指導の影響を評価してきた[2, 3].しかし,そもそも指導が試合の進行にどのように影響を与えるかを定量的に評価した研究はまだ存在しない.本研究では,このギャップを埋めることを目指し,指導が試合中の選手の積極性にどのような影響を与えるかを検証する.積極性を直接測定することは難しい.そこで,本研究では積極性が増すことで技が決まるまでの間隔が短くなると仮定し,技が決まるまでの時間を対象に分析を進める.さらに,この検証により,指導そのものの意義と効果を評価することが可能となる.指導が技の間隔に実際に影響を与えるとすれば,それは指導が試合の流れや競技者の行動に何らかの影響を与えている可能性を示す.逆に,指導が技の間隔にほとんどまたは全く影響を与えない場合,それは指導の効果や必要性を再評価するきっかけとなるだろう.","excerpt_src":"はじめに"},{"id":"2023_judoa_1_41","year":2023,"dept":"柔道部門","dept_detail":"柔道部門","title":"仕掛けの自動記録を目的とした柔道における試合状況判定システムの試作","members":"鷲見輝久，大平悠介，出口和希，金子雄祐，伴地芳啓，三家礼子(早稲田大学)","first_author":"鷲見輝久","affiliation":"早稲田大学","code":"[口頭]柔道4","abstract":"試合映像から仕掛けの発生タイミングと技の詳細を自動抽出するシステムを開発した。画像処理技術と深層学習を組み合わせ、電光掲示板の読み取り、選手間距離算出、姿勢推定を行い、試合状況を高精度でラベリングすることに成功した。","methods":["深層学習","画像認識・姿勢推定","機械学習"],"themes":["戦術分析","選手評価"],"data":["映像データ"],"free_tags":[],"awards":["柔道部門 最優秀賞"],"text_insufficient":false,"excerpt":"対戦形式のスポーツにおいて、相手選手やチームの特徴を事前に把握しておくことは非常に重要である。特に、一本を取られた時点で試合が決まってしまう柔道競技においては、トーナメントの大会が多いことも相まって、相手選手の得意技といった情報の重要性は非常に高い。 現在、全日本柔道連盟ではGOJIRAと呼ばれる専用の分析ソフトを使用し、相手選手の分析を行っている[1]。柔道の試合におけるプレーのフローを図1に示す。柔道ではこのフローに沿ってプレーが進み、審判の「待て」の合図によってスタートに戻る。現在GOJIRAでは主に図1の赤文字で示したプレーの情報を手動で収集しており、この中の一本、技ありのデータから相手選手の得意技を推定している。しかし、一本や技ありといったプレーは、1試合から収集できる量が限られている。2021年度世界選手権大会で一本、技ありが発生した回数は1試合あたり平均約1.2回であった。そのため、選手によってはサンプル数が少なくなり、分析の信頼性が薄れてしまう恐れがある。 そこで、本分析では図1で緑文字として示したポイントなしとなった技に注目する。ポイントが入らなかった技も、得意技を見極めるという点では有用な分析対象となる。以降、ポイントが入らなかった技を仕掛けと呼ぶ。しかし、現状収集している技はそれによって試合時間が止まるものであり、これに加えてさらに仕掛けの記録も手動で行うというのは現実的ではない。そのため、本分析では仕掛けの記録を自動で行うことを試み、分析の信頼度を上げることを目的とする。 また、本分析では⻘、白ユニフォームの選手をそれぞれ⻘選手、白選手と呼ぶ。","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_9","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"プロ野球球場の来場者数予測モデルの構築と施策の考察に関する研究","members":"中井教太郎，山下遥(上智大学)","first_author":"中井教太郎","affiliation":"上智大学","code":"P1-01","abstract":"本研究はプロ野球球場の来場者数予測モデルの構築と施策の考察に関する研究に関する分析である。","methods":["回帰分析","時系列解析","勾配ブースティング","指標開発"],"themes":["観客・ファン","球場要因","選手評価"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"プロ野球は日本において最も人気のあるプロスポーツの 1 つである.プロ野球球団にとって,収入源の 1 つがスタジアムでの観戦料金であり,多くの観戦者を獲得するために各チームは様々な施策を講じている.しかしながら,観客数の推移は各球団によって大きく異なる.よって自球団の観客数がどのような傾向であるのかを適切に分析し,かつ分析結果に基づき,今後の観客数の傾向を見極め自球団の改善点を明確にしていく必要がある.これまで,スポーツの試合において観客数の予測モデルを構築する研究はいくつか存在した.これらの研究では勝率から観客数の予測を行うモデル[1]や,対戦する 2 チームの成績,試合日,距離から観客数の予測を行うモデル[2]というように, チームの強さに着目した分析を行っていた.しかし,チームの強さを変化させることは容易ではない.そこで本研究では,施策のために利用可能な変数を用いて観客数の予測モデルを構築する.さらに推定したモデルを元に解釈を行い,施策を考察する.本研究では,観客数のデータを用い,その試合の日程に関する情報を説明変数とするモデルを構築する.時系列データの動きは,チームによって異なり (表 1 に示す) , また球場の収容人数がチームによって大きく異なるため,チームごとにモデルを構築する.分析モデルは解釈が容易な重回帰分析,精度の良い時系列の予測モデルである Prophet[3] ,精度の良い予測モデルとして知られる LightGBM[4]の 3 手法を比較する.","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_11","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"西武投手におけるラッキーセブンの危険性","members":"小林楓佳，佐藤浩志(明星大学)","first_author":"小林楓佳","affiliation":"明星大学","code":"P1-02","abstract":"野球の試合において、7 イニング目のことを「ラッキー\nセブン」と呼ぶことが多い。これは、1885 年に行われた\n試合が由来となっている。大リーグで行われたペナント\nレースの7 回、フライと思われた球が風に舞い、ホームラ\nンとなった。","methods":["指標開発"],"themes":["投球・配球","選手評価","打撃","守備"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球の試合において、7 イニング目のことを「ラッキーセブン」と呼ぶことが多い。これは、1885 年に行われた試合が由来となっている。大リーグで行われたペナントレースの7 回、フライと思われた球が風に舞い、ホームランとなった。この出来事について、当時の勝利投手であったジョン・クラークソンがインタビューに対し、「lucky seventh」と答えたことから、7 回の場面は幸福のイニングとして、ラッキーセブンと呼ばれるようになったという1)。しかし実際の日本の試合において、投手視点では7 回に失点が最も多く、幸福の7 回とはいえない。2022 年に行われた埼玉西武ライオンズ(以後: 西武)の試合では、7 回の失点数が合計で68 点と、全イニングの中で最も多かった。今回は、ラッキーセブンがいかに危険なイニングであるか、西武のリリーフ投手を対象に、研究を行った。","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_13","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"打球方向ごとの打率に基づく打者の分類","members":"大島遼哉，中条次元，芳賀龍慶，酒折文武(中央大学)","first_author":"大島遼哉","affiliation":"中央大学","code":"P1-03","abstract":"本研究は打球方向ごとの打率に基づく打者の分類に関する分析である。","methods":["クラスタリング","指標開発"],"themes":["打撃","守備","走塁・盗塁","球場要因","選手評価"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"一般に,強打者と言われる選手は引っ張り方向への打球が多く,打率を稼げる打者は逆方向への打球が多いと言われている.例として,2022 年に三冠王となったヤクルトスワローズの村上宗隆選手は引っ張り方向だけでなく逆方向にも強い打球を打つことができることが高く評価されている.このように打球方向やその飛距離は選手の打撃の特徴を表しているといえる.実際,セイバーメトリクスではPull%(引っ張り方向の割合),Cent%(センター方向の割合),Oppo%(逆方向の割合)を算出して各打者の特徴を考察し,それを用いて選手の分類を行うことがある[1].本研究ではPull%,Cent%,Oppo% の3 種類に分けるのではなく,角度としての打球方向を用いて各打者の特徴を捉えることを考える.そして,打球方向ごとの打率を用い,どの方向が安打になりやすいのかにより分類を試みる.分類にはクラスター分析を用い,クラスターごとの打撃の特徴について考察する.本論文の構成は以下のとおりとなっている.2 節では分析方法の概要について述べる.3 節では分析結果とその考察についてまとめる.4 節ではまとめと今後の課題について述べる.","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_20","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"フルカウントにおいて打者有利であるのか","members":"森島薫晃，佐藤大地，小澤祐介，島袋俊輔，廣津信義(順天堂大学)","first_author":"森島薫晃","affiliation":"順天堂大学","code":"P1-04","abstract":"一般的に野球の指導現場ではストライクが先\n行していれば投手が有利、ボールが先行してい\nれば打者が有利いわれ、フルカウント(3 ボー\nル 2 ストライク以下 3-2)時では、投手が精神\n的に追い込まれるため打者が有利であるといわ\nれることが多い。だが本当にそうであるのか、\nという疑問を持った。一般論では上記の理由に\nより打者の方が有利であるといわれることが多\nい。","methods":[],"themes":["打撃","投球・配球","打順・采配","球場要因"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"一般的に野球の指導現場ではストライクが先行していれば投手が有利、ボールが先行していれば打者が有利いわれ、フルカウント(3 ボール 2 ストライク以下 3-2)時では、投手が精神的に追い込まれるため打者が有利であるといわれることが多い。だが本当にそうであるのか、という疑問を持った。一般論では上記の理由により打者の方が有利であるといわれることが多い。だがしかし打者も追い込まれていることにかわりはない。現在大学野球で投手としてプレーしている我々は大いに疑問を持った。それにより今回研究に至った。","excerpt_src":"研究目的"},{"id":"2023_baseballa_1_29","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"NPB 打者の能力値に着目した短期間データに基づく調子の推定","members":"花田唯穂，関口良行(東京海洋大学)","first_author":"花田唯穂","affiliation":"東京海洋大学","code":"P1-05","abstract":"選手の能力値と約1 ヶ月の成績データを用いて続く2\n週間の選手の調子を予測する。OPS と短期間の総得点の\n相関を調べると、期間が1 年の場合は強い相関が見られ\nた。1 ヶ月の場合は1 年の時からは大きく下がるものの十\n分な相関が見られた。","methods":["指標開発","回帰分析","ニューラルネットワーク","クラスタリング"],"themes":["打撃","走塁・盗塁","勝敗要因"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"選手の能力値と約1 ヶ月の成績データを用いて続く2週間の選手の調子を予測する。OPS と短期間の総得点の相関を調べると、期間が1 年の場合は強い相関が見られた。1 ヶ月の場合は1 年の時からは大きく下がるものの十分な相関が見られた。そこで、短期間の得点を予測するためには直前の1 ヶ月の成績データを用いることで予測できると考えた。今回の分析の精度を上げるため、成績データだけではなく、選手の能力値も考慮して予測することにした。選手の能力値は因子分析によってパワー、ミート、走力の3 つの能力値を求め、成績データは長打数、安打数、出塁数、打席数からなる4 桁の数字で表す。続く期間の予測には、系列変換モデルのニューラルネットワークであるTransformer を用いる。その結果、打者のOPS が平均以上となるかを概ね予測することができた。","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_42","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"野球の外野手における打球の落下位置と捕球位置に着目した守備力の視覚的分析","members":"長内雄太朗，伊藤正彦(北海道情報大学)","first_author":"長内雄太朗","affiliation":"北海道情報大学","code":"P1-06","abstract":"外野手の守備力を分析するため、打球の落下位置と捕球位置の可視化を実施した。守備率の高い選手はゴロを前で捕球することが多く、落下位置との距離が短い傾向が見られた。","methods":["可視化","空間分析"],"themes":["守備","選手評価"],"data":["映像データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球において、守備は試合の勝敗につながる大きな要素の1 つである。野球では、守備をする野手の肩力や走力、捕球力などで守備力を測られることが多く、守備力を分析し改善をしていくことは試合に勝つために重要なことである。今回特に、外野手を見た際に成績の良い選手と悪い選手でどういった違いがでるのかに着目した。本稿では、外野の守備において、守備力が高い選手の方が前で捕球するという仮説を立てた。そこで、球が落下した位置と選手が球を捕球した位置の可視化を行い、守備率の良い選手と悪い選手を比較しどういった違いが見られるのかを可視化し分析する。また、打球の落下位置と捕球位置の2 点間の距離を抽出してその違いも分析した。","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_47","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"日本プロ野球における犠打を考慮した最適打順","members":"今紺楓仁，宿久洋(同志社大学)","first_author":"今紺楓仁","affiliation":"同志社大学","code":"P1-07","abstract":"犠打を考慮したシミュレーションにより、セ・リーグの最適打順を分析した。1番に安打や出塁率の高い選手、2〜4番にクリーンナップ、5番に安打の多い選手を配置することで得点が最大化されることを示した。","methods":["シミュレーション","クラスタリング","階層モデル"],"themes":["打順・采配","戦術分析","チーム評価"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球では, 選手の特徴を考慮した打順を組むことが重要である. 実際, 鳥越ら(2011) は効率的に得点することが求められることから, 選手のプレースタイルなどを考慮した打順が必要だと述べている. 打順を変えることで同じ打者数やイニング数でどれだけ得点を得られるかが変化する.少ない打者数やイニング数でより多くの得点を得られる打順を組むことが重要である.最適打順について, 実際の試合のデータを用いて統計的手法によって最適な打順を明らかにする研究が行われている. 木山ら(2015) は, 最適なスターティングメンバーの選出と打順を提案するモデルを構築し, 得点を取るために最も重要なことは打者のつながりであることを明らかにした.一方で, Mongerson(2023) はあるチームの2022 年に最も一般的であった打順の9 番打者に着目したシミュレーションを行っており, その9 番打者は8 番に配置するのが最適であるということを明らかにしている. Rublewski(2023)はコネチカット大学の野球チームのデータを用いて, 仮説検定による最適なスターティングメンバーの選出と最適打順の分析を行っており, 分析結果のほとんどが従来の常識による打順と同じであった.しかし, 先行研究では2 つの課題がある. 1 つ目は, 先行研究で行われたシミュレーションでは犠打を考慮した得点期待値や最適打順が算出されていないという点である. 犠飛や盗塁をシミュレーションに反映した研究はあるが, 犠打を反映した研究はみられない. 犠打は特に長打率の低いチームなどで有効とされている戦術である(中尾, 2008).そのため, 特に打撃能力が低いチームでは犠打を組み入れた方が得点期待値が向上する可能性があると考えられ, またプロ野球の試合においても犠打が多用されている. 2 つ目は, 先行研究では特定のチームに対してのみ分析されている点である. 実際, 鳥越ら(2011) では一般的なチームの分析をする必要性について述べており, 他チームに対して応用させるにはどのようなタイプの選手をどの打順・組み合わせで並べるのが有効かを一般的に考案する必要がある.以上より, 本研究は犠打を考慮して算出した1 試合当たりの平均得点を最大化させるための最適打順を提案し, 一般的にどの打順にどのようなタイプの選手を配置するのが有効かについて考察する.","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_67","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"奪った四球は勝利に関係しているのか？：日本のプロ野球データを用いた検討","members":"廣瀬功季，谷岡亮太，佐藤将太郎，板倉立季，市川淳(静岡大学)","first_author":"廣瀬功季","affiliation":"静岡大学","code":"P1-08","abstract":"日本プロ野球の2022年シーズンデータを用いて、奪った四球数と勝利数の関連を分析した。四球数と勝利に高い正の相関があり、特に中盤以降の四球が勝利に関連することを示した。","methods":["統計的検定"],"themes":["勝敗要因","チーム評価"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球において四球は,相手の投球数を増やしつつ出塁機会を得る手段と考えることができる.この点に関して, 2023 年に
