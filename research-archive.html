いられているWAR (Win Above Replacement) は、投球・打撃・守備・走塁の貢献度を足し合わせて算出され、打撃による貢献はwOBA(weighted On Base Average)と呼ばれる指標を基に算出される[2]。wOBA のような打撃や投球に関わるいくつかの指標では、評価対象のプレーにおける試合状況(走者、アウトカウントなど)を考慮しない。これは、選手がどのような試合状況で打席やマウンドに立つかを選択できないため、試合状況を評価対象にすべきでないという考えに基づく。一方、現場の一般論ではチームが勝利するために投手や打者は試合状況を踏まえた上で投球や打撃を行った方が良いとされている。しかしながら、一般に野球において実データを用いて戦略の効果を推定することは容易ではない。これは、(1) 実際の試合においてチームや個人が取る戦略の観測が困難である点と、(2) 異なる戦略を採用した場合の効果を検証することが難しい点に起因する。そこで本研究では、シミュレーションを用いることで戦略の有無のみによって生じる差を検出する。しかし、異なる戦略を採用した場合、それを実行する選手の結果に、現実的にはトレードオフが存在する(例えば、出塁を重視する打撃戦略を取る場合、たいてい長打の確率は低くなる)。そのためには、現実には存在しない、異なる戦略を実行する選手の能力を何らかの方法で推定する必要がある。この一連の枠組みを本研究では、反実仮想シミュレーションと呼ぶ。本研究では、この例として打撃戦略の変更を考える。打撃戦略は試合状況と打者の出塁に対する態度の違いから3種類に大別できる: (a) 試合状況を考慮せず、wOBA を最大化する打撃戦略、(b) 試合状況を考慮し、走者の進塁に徹する打撃戦略(例:送りバント、進塁打)、(c) 試合状況を考慮しつつ、打者自身の出塁も目指す打撃戦略(例:チャンス時の軽打、二死無塁時の長打)。このうち、a は得点を説明できるようにwOBA を定義した[2] ため自明であり、b の有効性はさほど大きくないことが知られている[4, 2]。一方、c の有効性については不明である。すなわち、チームとしての得点の最大化を考えた時に打者個人のwOBAをどのくらい犠牲にできるかが本研究の興味である。そこで本研究のシミュレーションでは、打者はチームの得点を最大化するために試合状況に応じて(1) 通常、(2)出塁優先、(3) 長打優先の3 つの打撃戦略を使い分ける。各打撃戦略による結果を生成するために、各打席結果が起きる確率(打撃能力ベクトル)を定義する(詳細は方法)。さらに、現実には存在しない出塁優先、長打優先時の打撃能力ベクトルを算出するために、本研究では、実在選手の打撃能力ベクトル同士の関係を教師データとする機械学習を用いて、打撃戦略変換モデルを構築する。これにより、任意の場面で打撃戦略を使い分ける状況を擬似的に再現することが可能となる。本研究の新規性は、(1) 反実仮想シミュレーションを用いてチーム打撃戦略の効果を検証する点、(2) 機械学習を用いて打撃戦略変更時の選手の打撃能力変換手法を開発した点、(3) 出塁/長打優先戦略の使い分けと得点の関係を明らかにした点の3 点である。","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_70","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"Behavioral Bias of Umpires: Evidence from Nippon Professional Baseball","members":"丹治伶峰(大阪大学)","first_author":"丹治伶峰","affiliation":"大阪大学","code":"[口頭]野球5","abstract":"NPBのpitch-by-pitchデータを用いて、審判員の判定におけるバイアスを分析した。在群内バイアスは確認されなかったが、不作為バイアスの存在が支持され、特にハーフスイング判定で顕著であることが示された。","methods":["ロジスティック回帰"],"themes":["ルール変更"],"data":["イベントデータ"],"free_tags":["審判バイアス"],"awards":["野球部門 優秀賞"],"text_insufficient":false,"excerpt":"本研究は、主観的なパフォーマンス評価の文脈に現れる労働経済学・行動経済学的なバイアスの存在、及びその影響を議論するものである。具体的には、日本プロ野球機構(Nippon Professional Baseball) のpitch-by-pitch データを用いて、高度な専門的技術を求められる審判員の判定に、属人的な要素や判定を行う局面の相対的な重要性に基づいた、系統的なバイアスが存在するか否かを定量的に議論している。選手のパフォーマンスが様々な手法で客観的に評価され、それらがしばしば利用可能な形で公開されているというデータの特性から、労働経済学の分野ではスポーツの文脈を用いた実証研究がなされてきた。Becker (1957) によって確立された差別の領域はその中でも多くの実証研究が行われている分野の一つである。また、スポーツが選手・及びマネージャーや審判による連続的な意思決定によって成り立っているという側面から、近年は行動経済学の分野でもスポーツのデータを扱うものが数多く行われている。本研究では、野球のプレーのうち、• 球審が行うピッチコール(ボール、ストライクの判定)• 球審・及び塁審が行うハーフスイング(チェックスイング) の判定の2 つに着目して分析を行う。ピッチコールについては、Literature の項で説明する通り、Major League Baseball (MLB) のトラッキングデータを用いた研究が行われている一方で、日本のデータを用いた研究は筆者の知る限り存在しない。アメリカと比較すると、日本国内における対外国人差別に関する実証研究は希少である。その地理的な特性から民族的なバリエーション、及びそれらの直接的な交流が欧米に比べて限定的であることを鑑みると、差別のパスや、差別の源泉となる個々人の帰属意識(アイデンティティ) には日本に特有の傾向が存在する可能性が高い。また、2 点目のハーフスイングに関する情報を投球ごとに記録したデータセットはMLB を含めても例がなく、ユニークな文脈に着目した分析を行うことを可能としている。これまでの分析では、球審が投手・打者が外国人選手である場合に彼らに不利なピッチコール・チェックスイングの判定を行うin-group bias、及び投球カウントが2 ストライク、あるいは3 ボールである際に、審判が自らの判定で三振もしくは四球として打席結果を確定させることを避ける「不作為バイアス(omission bias) が存在するかに着目した分析を行った。MLB では多くの研究でその存在が確認されているin-group bias がNPB のデータからは確認されなかったのに対し、不作為バイアスについてはその存在を支持する推定結果が得られた。特に、ハーフスイングの判定における不作為バイアス(2 ストライクかつボールカウントが2 ボール未満である時に、ハーフスイングが空振りと判定される確率が有意に減少する) の存在は、先行研究が用いたデータからは確認できない分析結果であり、MLB のデータを利用した分析に対しても示唆を与えるものであると言える。","excerpt_src":"Introduction"},{"id":"2021_baseballa_1_13","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"2018年から2020年における横浜DeNAベイスターズの8番投手が与えた得点への影響について","members":"附田祐也(東京理科大学)，近藤大(東海大学)，三谷駿輔，朝日弓未(東京理科大学)","first_author":"附田祐也","affiliation":"東京理科大学","code":"選外","abstract":"横浜DeNAベイスターズの2018-2020年における8番投手起用の得点への影響をシミュレーション分析した。結果として、9番投手との差は年間0.00284点であり、統計的に有意な違いは見られず、8番投手の采配は有効でも無効でもないという結論が得られた。打順変更自体の影響が限定的であることが示された。","methods":["シミュレーション"],"themes":["打順・采配","投手起用"],"data":["公式成績データ"],"free_tags":["8番投手"],"awards":[],"text_insufficient":false,"excerpt":"現代の日本のプロ野球界において投手の打順は一般的には9 番で起用される.2001 年から2016 年の間で投手が打席に入った12828試合中8 番に投手が入ったのは28 回である[1] .しかし横浜DeNA ベイスターズでは2016 年のから就任したラミレス監督が二年目の際に2018 年 134 試合,2019年 44 試合,2020 年 54試合と多くの試合で8 番に投手を起用し始めた.3 年間で 232 試合の起用と2001 年から2016 年と比較すると圧倒的に8 番投手の起用回数が多いことがわかる.この起用は過去の例を見ると奇策といえる起用法である.しかしこの起用法はセイバーメトリクス上きわめて合理的な起用法である.しかし現代野球において実戦で 8 番に投手を起用する例は上述のように極めて少なかった.つまり統計的,数学的観点から導き出された結論と実戦値のズレの可能性に関する議論はほとんどされてきていないのである.だからこそ2018 年から2020 年の横浜DeNA ベイスターズを事例として本研究においてその比較と検証を行う必要性がある.","excerpt_src":"はじめに"},{"id":"2021_baseballa_1_73","year":2021,"dept":"野球部門","dept_detail":"野球部門","title":"ランダムフォレストを用いた多クラス球種予測","members":"朴太一，森田裕之(大阪府立大学)","first_author":"朴太一","affiliation":"大阪府立大学","code":"選外","abstract":"2018-2020年のNPBデータを用いて、投球直前の情報からランダムフォレストにより球種を予測するモデルを構築した。全体の予測精度は45.2%であり、チェンジアップはRecallが高く、スライダーはPrecisionが高い結果となった。","methods":["機械学習"],"themes":["投球・配球"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年セイバーメトリクスの発展により,さまざまな条件についてシミュレーションで評価することが可能となり,現場での経験則を検証することが可能になりつつある.投球解析の技術が進歩して以降,大量の投球データがインターネットで公開されるようになり,データ分析や機械学習の手法を用いることができるようになった.これを導入して以降,打者の打率の指標を表したBA(Batting Average)が年々減少している.そこで投球以前のデータを用いて球種を予測するモデルの構築を行うことで狙い球を絞ることができ,打率向上へと繋がると考えた. 既存研究 [1]ではSVMを使用し,投手が次に投げる球種を予測しているが, 速球か変化球かの2値予測であり個々の投手によって予測確率が大きく異なる点が問題点と言える.[2]では, 各投手に対して新しい動的な特徴選択アルゴリズムを提案し, 各カウントの各投手に対してより適応的な球種予測となっているが[1]と同様に2値予測となっている.[3]では, 線形カーネル関数を用いたSVMのアプローチを用いて, 投球選択の複雑さを相対的な度合いに応じてランク付けした球種の予測可能性の指標を導入し, その予測可能性を長期的な投手のパフォーマンスと比較することに焦点を当てている. 球種は各投手が最も投げる4つまで予測することができる.これらの球種予測をテーマにした先行研究では速球と変化球の2値のみを予測するモデルが多く,多クラスを予測するモデルも存在するが投手や塁状況などを限定しており汎用性が低い. そこで日本プロ野球のデータを用いて多くの投手を対象とした球種予測モデルを構築する必要があると考える. 提案手法球種予測のモデルとしてランダムフォレストを用いた.理由としては既存研究[4]で用いた手法の中で一番精度が高かったからである.2018年,2019年,2020年の3年分のデータを用いて,3年間で投球数が毎年500以上の投手に限定し,合計40人のユニークな投手を対象とした.投手ごとのデータ数は最大で7459球,平均で4737球,最小で1786球となった.3年間の投球データを用いてデータセットを構築し,球種を予測するデータセットの変数は元々データセットに存在していた「イニング,表裏,プレイ前アウト数,打者打順,打者試合内打席数,得点差,打者打席左右,プレイ前ストライク数,プレイ前ボール数,ランナーF,塁状況,投手試合内投球数」と,データを加工して作成した「前球種,前投球位置区域,前球速,5球前ストライク率,10球前ストライク率,20球前ストライク率」を用いた.各投手の球種が均一になるようにオーバーサンプリングを行った.また,パラメータチューニングとしてグリッドリサーチ法を用いてパラメータをそれぞれの選手に応じて最適な値になるように調節した.計算結果全体のランダムフォレストの予測精度は45.2%となった.球種別に見ると,Precisionはスライダーが一番高く,Recallはチェンジアップが一番高い.F値が高いのは比較的球が遅いチェンジアップやフォーク,シンカーとなり,球が速いスライダーやカットボールは低い値をとなった. ※CT:カットボール, CU:カーブ, SC:シュート, SI:シンカー, FF:ストレート, SL:スライダー, CH:チェンジアップ, SF フォーク表球種ごとの評価値球種 Precision Recall F値 Accuracy CT 40.47 37.07 38.70 45.2 CU 46.82 46.42 46.62 SC 46.12 48.41 47.24 SI 51.58 48.95 50.23 FF 41.85 40.24 41.03 SL 41.30 36.08 38.51 CH 47.06 58.50 52.16 SF 51.39 51.65 51.52 おわりに提案した手法を用いて検証を行い,一部の球種で既存研究のF値を上回ることができたが,ほとんどの球種では上回ることはできなかった.既存研究の正答率やFF等の球種のF値超えることができなかった原因として,打者との対戦成績や,配球データの不足が挙げられる.既存研究では打者のストライク率や打者と投手との対戦成績等が変数として存在していたが,変数の明確な定義を設定されておらず,変数の作成をすることができなかった.実際の投球では捕手が打者の球種やコースの得意不得意,コースごとの打率,これまでの打席傾向などを考慮しながら,球種を選択している.既存研究でも打者との対戦傾向は変数重要度の上位に存在しているので,明確な定義を設定し,変数として加えることで精度の高いモデルが構築できると予想される.今後は新たな変数を導入し,実際の状況に近いモデルを構築する必要があると考えている.","excerpt_src":"はじめに"}];

const FACETS = [
  // or: true = ファセット内の複数選択を OR 判定 (単一値フィールドは AND だと常に0件になるため)
  { key: 'year',    label: '年度',   or: true },
  { key: 'dept',    label: '部門',   or: true },
  { key: 'award',   label: '受賞' },
  { key: 'methods', label: '手法' },
  { key: 'themes',  label: 'テーマ' },
  { key: 'data',    label: 'データ' },
];
const state = { q: '', sel: {} };  // sel[key] = Set

function valuesOf(rec, key) {
  if (key === 'year') return [rec.year + '年度'];
  if (key === 'dept') return [rec.dept];
  if (key === 'award') return rec.awards.length ? ['受賞作'] : [];
  return rec[key] || [];
}
function facetCounts(records) {
  const c = {};
  for (const f of FACETS) {
    c[f.key] = new Map();
    for (const r of records)
      for (const v of valuesOf(r, f.key))
        c[f.key].set(v, (c[f.key].get(v) || 0) + 1);
  }
  return c;
}
function match(rec) {
  for (const f of FACETS) {
    const sel = state.sel[f.key];
    if (sel && sel.size) {
      const vals = valuesOf(rec, f.key);
      const hit = f.or ? [...sel].some(s => vals.includes(s))
                       : [...sel].every(s => vals.includes(s));
      if (!hit) return false;
    }
  }
  if (state.q) {
    const hay = (rec.title + ' ' + rec.members + ' ' + rec.abstract + ' ' + (rec.excerpt || '') + ' ' +
                 rec.methods.join(' ') + ' ' + rec.themes.join(' ') + ' ' +
                 (rec.free_tags || []).join(' ')).toLowerCase();
    for (const w of state.q.toLowerCase().split(/\s+/).filter(Boolean))
      if (!hay.includes(w)) return false;
  }
  return true;
}
function esc(s) { return (s || '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function render() {
  const hits = DB.filter(match);
  const counts = facetCounts(hits);
  // サイドバー
  const sb = document.getElementById('sidebar');
  sb.innerHTML = FACETS.map(f => {
    const all = new Map();
    for (const r of DB) for (const v of valuesOf(r, f.key)) all.set(v, 0);
    for (const [v, n] of counts[f.key]) all.set(v, n);
    const items = [...all.entries()].sort((a, b) =>
      f.key === 'year' ? String(a[0]).localeCompare(String(b[0])) : b[1] - a[1]).map(([v, n]) => {
      const on = state.sel[f.key] && state.sel[f.key].has(v);
      return `<span class="tagbtn ${on ? 'on' : ''}" data-f="${f.key}" data-v="${esc(v)}">${esc(v)}<span class="n">${n}</span></span>`;
    }).join('');
    return `<div class="panel"><h2>${f.label}</h2>${items || '<span style="font-size:12px;color:var(--muted)">なし</span>'}</div>`;
  }).join('');
  // 選択中チップ
  const act = [];
  for (const f of FACETS)
    for (const v of state.sel[f.key] || [])
      act.push(`<span class="tagbtn" data-f="${f.key}" data-v="${esc(v)}">✕ ${esc(v)}</span>`);
  document.getElementById('active').innerHTML = act.join('');
  // 件数
  document.getElementById('stat').textContent = `${hits.length} 件 / 全 ${DB.length} 件`;
  // カード
  document.getElementById('list').innerHTML = hits.length ? hits.map(r => `
    <div class="card">
      <div class="top">
        <span class="dept">${esc(r.dept)}</span>
        ${r.awards.map(a => `<span class="award">🏆 ${esc(a)}</span>`).join('')}
        ${r.code ? `<span class="code">${esc(r.code)}</span>` : ''}
        <span class="code">${r.year}年度</span>
      </div>
      <h3>${esc(r.title) || '(タイトル情報なし)'}</h3>
      <div class="authors">${esc(r.members)}</div>
      ${r.excerpt
        ? `<div class="abst"><span class="srclabel">原文引用 (${esc(r.excerpt_src || '本文冒頭')}より)</span>${esc(r.excerpt)}</div>`
        : (r.abstract ? `<div class="abst"><span class="srclabel">参考要旨 (機械生成・未校閲)</span>${esc(r.abstract)}</div>` : '')}
      <div class="tags">
        ${r.methods.map(t => `<span class="tagbtn" data-f="methods" data-v="${esc(t)}">${esc(t)}</span>`).join('')}
        ${r.themes.map(t => `<span class="tagbtn" data-f="themes" data-v="${esc(t)}">${esc(t)}</span>`).join('')}
        ${r.data.map(t => `<span class="tagbtn" data-f="data" data-v="${esc(t)}">${esc(t)}</span>`).join('')}
        ${(r.free_tags || []).map(t => `<span class="tagbtn">${esc(t)}</span>`).join('')}
      </div>
    </div>`).join('') : '<div class="empty">条件に一致する研究がありません</div>';
}
document.addEventListener('click', e => {
  const el = e.target.closest('.tagbtn[data-f]');
  if (!el) return;
  const f = el.dataset.f, v = el.dataset.v;
  state.sel[f] = state.sel[f] || new Set();
  state.sel[f].has(v) ? state.sel[f].delete(v) : state.sel[f].add(v);
  render();
});
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
document.getElementById('reset').addEventListener('click', () => {
  state.q = ''; state.sel = {}; document.getElementById('q').value = ''; render();
});
render();
</script>
</body>
</html>
