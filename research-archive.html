瞬間を定量化し、スコアが高いほどシュート発生確率が上昇することを検証。スコアが大きいパスは4倍のシュート発生率上昇をもたらし、現場の「スイッチが入った」感覚とデータ分析を橋渡けする指標として機能。","methods":["指標開発","時系列解析","統計的検定"],"themes":["戦術分析","パス","トランジション"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["TTA","スイッチスコア"],"awards":["サッカー部門 特別賞 (データスタジアム賞)"],"text_insufficient":false,"excerpt":"サッカーは1 試合の中で攻守の切り替えが頻繁に起こるスポーツであり,ボールの奪取やロストだけでなく,ボール保持を続けながらも攻撃のテンポや狙いが大きく切り替わる局面が繰り返し現れる.実際の試合現場では,選手や指導者が「ここでスイッチが入った」「このパスで流れが変わった」といった表現を用いて,攻撃が一気に活性化した瞬間を示すことが多い.しかし,こうした「攻撃のスイッチ」がどのプレーによってどの程度生じたのかを客観的に定量化する指標はいまだ十分に整備されていない.本研究では,パスに焦点を当て,ボール保持を継続している攻撃の中で,個々のパスがそのスイッチにどの程度寄与したかを定量化する指標として「スイッチスコア(Switch-score)」を提案する.スイッチスコアには,パス位置への到達予想時間差とパススピードに関する二つの指標を用いる.一つは,守備者と受け手のパス位置への到達予想時間差(Time-to-Arrival advantage;TTA)である.これまでに,パスに対するプレッシャーを定量化する指標として,Spearman らは選手の現在位置や速度などからボール位置までの到達時間を近似するtime-to-intercept (TTI) を定義している[1].それを応用し,Bekkers らは, TTI モデルに基づいて各時点のプレス強度を定量化している[2].しかし,これらの研究のTTI はパス成功やボール支配といった確率的な量として用いられている. 本研究では,この到達時間の枠組みを応用し,選手の移動速度や加速度の上限を考慮した到達時間近似に基づいて,パスの受け手がパスを受ける地点において一番近い守備選手よりどれだけ先に到達できるかという時間差をTTA として定義し,その大小をパス単位の特徴量として直接評価する.もう一つは,パス開始から受け手に到達するまでのボールの移動速度に着目した指標であり,ボールがどれだけ速く運ばれ,相手守備の対応時間をどれだけ削っているかを表す.スイッチスコアは,これら二つの指標を統合したパス単位のスコアであり,値が大きいほど当該のパスが攻撃を一段ギアアップさせた「スイッチ」の度合いが強いものとして解釈する.スイッチスコアをJ 1リーグのデータに適用し,スコアの大きいパスほど,その直後や同一攻撃内でシュートや得点が生じやすいかを検証するとともに,具体的なプレー例を通じてスイッチスコアがスイッチが入った瞬間とどのように対応するかを示す.これにより,試合中のどのパスが攻撃の流れを変えたのかを,数値として扱えるようにすることを目指す.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_41","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるポジションチェンジが攻守の結果に与える影響の分析","members":"栗原柾由，山田亮介，島田尚(東京大学)","first_author":"栗原柾由","affiliation":"東京大学","code":"[口頭]サッカー5","abstract":"カイラリティの変化により同一チーム内の3選手による三角形の向き反転を検出し、ポジションチェンジを定量化。ポジションチェンジ量Sflipを面積で定義し、経路コストモデルの指標と組み合わせることで「誰がどこにいるか」を両面から評価。ポゼッション局面では攻撃側のポジションチェンジが結果向上に寄与し、守備側の不適切なポジション入れ替わりが失点につながることを実証。","methods":["統計的検定","因果推論","空間分析"],"themes":["戦術分析","チーム評価","ポジショニング"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["ポジションチェンジ","カイラリティ"],"awards":["サッカー部門 最優秀賞"],"text_insufficient":false,"excerpt":"サッカーは,ボールをゴールに入れるという目的のために,互いのチームの選手11 人がピッチ上を自由に動き回るスポーツである.チェスや将棋といったボードゲームなどと同様に,フィールド上に選手をどのように配置するかが非常に重要なゲームである.サッカーにおける選手配置は,「どこに選手が位置しているか(Where)」という空間的構造と,「誰がその位置を担うか(Who)」の情報の組み合わせである.特に近年のサッカーで戦術的に用いられることが多い,選手の位置を入れ換える“ポジションチェンジ”と呼ばれるプレーは,後者の側面が考慮される代表的な局面である.選手配置に関する既存研究は,主として「どこに選手が位置しているか」の側面に着目してきた.例えば,我々が以前提案した経路コストモデルでは,Pitch Control [1] に基づいて各選手が同質的に空間を支配するものと仮定し,個人差を考慮せずスペース支配の構造だけに基づいて配置を評価する指標Cmin を確立した[2, 3].一方,現実の競技では,同じ位置に誰が配置されるかによって局面の有利不利が変化する.特にポジションチェンジは,守備の撹乱や攻撃の成功に寄与すると経験的に語られているが,その影響を定量的に評価した研究は少ない.本研究の目的は,サッカーにおけるポジションチェンジを定量化し,攻守の結果に与える影響を明らかにすることである.","excerpt_src":"背景"},{"id":"2025_soccera_1_16","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"Expected possession valueを用いた理想ピッチ状況の生成","members":"牧浦龍之介，渡邉啓大，寒水孝司(東京理科大学)","first_author":"牧浦龍之介","affiliation":"東京理科大学","code":"[口頭]サッカー6","abstract":"本研究はExpected Possession Value（EPV）の最適化により、オフボール選手全員の理想的な動きを想定したピッチ状況を生成する手法を提案した。ピッチコントロールモデルとニューラルネットワークを用いてEPVを計算し、攻撃チームと守備チームが交互にEPVを最大化・最小化する最適化を行う。これにより、オフボール選手の動きを評価する指標に一貫したベースラインを提供することが可能になった。","methods":["ニューラルネットワーク","深層学習","機械学習","最適化"],"themes":["ポジショニング","スペース評価","選手評価","戦術分析","試合の流れ"],"data":["トラッキングデータ"],"free_tags":["Expected Possession Value","Pitch Control","オフボール評価"],"awards":["サッカー部門 入賞"],"text_insufficient":false,"excerpt":"近年サッカーにおいて,ボールに関わる選手の評価に加え,ボールを持たない状態(以下,オフボール)の選手の評価が行われてきた.オフボール選手の動きを評価する指標の一つとして,Space gain [1] がある.Space gainは各チームのピッチ上の影響度とスペースの価値から,ある時間内のスペース獲得を表す指標である.Space gainを用いて,オフボールの動きを評価する指標は複数提案されている.例えば,SG-xG [2] という指標は,「Space gain」と「シュートがゴールになる確率(ゴール期待値)」を組み合わせ,選手個人のゴールへの貢献を定量化した指標である.さらに,選手の動きの軌道予測による平均的な動きとの差分に基づく指標[3] も提案されている.しかし,[2] はベースラインが場面ごとに異なり一貫したものがなく,[3] はベースラインがデータの中の平均的な動きに設定されている.ベースラインは試合間で指標を比較するために必要である.しかし,ベースラインが平均的な動きであると,リーグ間やシーズン間で異なるベースラインが設定されてしまう.さらに,ベースラインからの最大の変化量が定義されないといった実務的な問題が生じる.これらの課題は,その場面における理想的な動きをベースラインとすることで解決できる.本研究では,特定の場面において,オフボール選手の理想的な動きを生成することを目的とする.具体的には,ピッチ状況から算出される潜在的な価値を最大化する動きを求め,場面を固定した際に価値が最大になるようなピッチ状況を生成する.潜在的な価値を求める指標として,Expected possesion value(以下,EPV)[4] を用いる.ある時点で守備チーム,攻撃チーム,守備チームの順でEPV を最適化することで,選手全員が理想的な動きをすることを想定した理想ピッチ状況を生成する.","excerpt_src":"はじめに"},{"id":"2025_soccera_1_85","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"マルコフ完全均衡下のマルチエージェント強化学習による全選手の行動評価","members":"井出憲次朗(名古屋大学)，染谷大河(東京大学)，川口康平(香港科技大学)，藤井慶輔(名古屋大学)","first_author":"井出憲次朗","affiliation":"名古屋大学","code":"[口頭]サッカー7","abstract":"サッカー選手間の戦術的相互作用を数理的にモデル化するため、動学ゲーム理論とマルコフ完全均衡（MPE）の概念を導入した強化学習フレームワークを提案した。従来の深層強化学習が陥る過学習を回避しつつ、各選手を意思決定エージェントとして明示的にモデル化することで、全選手・全時間・全行動に対する戦術的評価を実現した。実験結果として、既存指標xGとの相関が負から正に改善されたことを報告している。","methods":["強化学習","深層学習","機械学習","因果推論"],"themes":["選手評価","戦術分析","チーム評価","トランジション"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["xG"],"awards":["サッカー部門 最優秀賞"],"text_insufficient":false,"excerpt":"サッカーのような侵入型チームスポーツでは,22 人の選手が二次元のフィールド上で常に相互作用するため,状態空間は高次元で各次元は相互に関係している.初期のルールベースに基づく研究では,ボールへのアクセスや支配領域を推定するために,幾何学的または運動学的ルールを適用することで,この複雑さに対応していた[4].これらのモデルはコーチにとっては直感的であるが,シュート,プレッシャー,クロスなどの狭く定義された状況のみを対象とし,すべての選手のすべてのアクションを評価するように拡張することが難しい.近年,機械学習における多くの研究では,離散的なイベント[2] を予測したり,将来の軌道を予測する[7] ことで評価している.これらの方法は予測には強力であり,多くの実用的な分析タスクに役立つが,主に入力から結果へのパターンマッチングに基づく方法であり,各選手を報酬とポリシーを持つ自律的な意思決定エージェントとして明示的にモデル化していない.より最近の研究では,イベントとトラッキングデータから直接行動価値関数を推定するために,深層強化学習(DRL)が採用されている[6, 5].DRL は,生のイベントおよびトラッキングデータから行動価値関数を直接学習し,アクションの長期的な戦略的影響を捉え,予測を超えた反事実的な方策に基づく評価を可能にする.しかし, DRL が学習した価値関数や方策の解釈性は依然として課題であった.この解釈性の問題に対し,先行研究[3] において「Expandable Decision-Making States (EDMS)」が提案された.EDMS は,生の座標データに加え,「マークのプレッシャー」や「パスコース」,「スペーススコア」といった人間が解釈可能な戦術的概念を変数として組み込むことで,DRL モデルの解釈性を高めるアプローチである.しかし,既存のサッカーのDRL[6, 5, 3] については,チームまたは選手を個別にモデル化し,個々の選手の意思決定の相互作用をモデル化していなかった.そこで本研究では,DRL の枠組みを「選手間の意思決定の相互作用」を扱う動学ゲーム理論[1] を導入し,マルコフ完全均衡(MPE) に基づく選手の行動評価フレームワークを提案する.MPE は,全ての選手の方策が,他選手の方策に対して最適反応となっている均衡状態を記述するものであり,この仮定により他選手の方策を組合せ爆発にならずに考慮する動学ゲームとして価値関数が推定できる.主な貢献は以下の通りである.(1) 動学ゲーム理論を用いたサッカーの分析:選手間の戦略的相互作用をMPE の枠組みでモデル化し,均衡状態における最適方策を推定する.(2) 価値関数の解釈可能性向上:価値関数を特徴量の線形近似としてモデル化することで,深層学習のブラックボックス性を回避し,算出されたQ 値が報酬構造の内訳を説明可能な状態に保つ.","excerpt_src":"導入"},{"id":"2025_soccera_1_48","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"1対1ドリブルを支配するアタッカーとディフェンダーの行動原理","members":"山﨑壱晟，後藤大尭，乙黒康次郎，西森拓(明治大学)，白石允梓(広島市立大学)，成塚拓真(立正大学)","first_author":"山﨑壱晟","affiliation":"明治大学","code":"[口頭]サッカー8","abstract":"J1リーグのトラッキングデータから5000回以上の1対1ドリブルシーンを抽出し、直交ADモデルによる数理的解析を行った。ディフェンダーが相対速度を小さくする行動原理を仮定することで、実データの駆動方向分布を説明でき、サッカーの経験則を定量的に導き出す科学的アプローチを提示した。","methods":["シミュレーション","確率モデル"],"themes":["戦術分析","ドリブル","ポジショニング"],"data":["トラッキングデータ"],"free_tags":["物理モデル"],"awards":["サッカー部門 優秀賞"],"text_insufficient":false,"excerpt":"サッカーは, 味方が協力してボールを敵陣のゴールまで運ぶ競技であるが, 攻守が試合の中で連続的に切り替わるため, シュートやパスなどの「わかりやすい」プレーが注目されやすい.得点期待値やパス成功率が評価指標としてよく使われるのはそのためである.一方, 1 対1 におけるドリブルも試合で頻出する.そして, そこには, 数秒に及ぶ選手同士の「駆け引き」がある.ただし, ドリブル中に選手の位置も刻々と変化するため, 単純な統計量だけでその全容を捉えることは難しい.例えば, 1 対1 の守備においては, 「前を向いてボールを保持する者に対して無闇にボールを奪いに行ってはならない」というセオリーが知られている[1].つまり, 「相手に抜かれない」ことが重要であるが, 具体的にどのようなディフェンダーの動きが推奨され, 実践されているのか, という点は曖昧であり, 未だ解明されていない.選手のピッチ上での複雑なダイナミクスの解析には, 物理モデルが有効である.本研究では, 先行研究[2] をもとに, ゴールを目指すアタッカーとそれを阻止するディフェンダーの相互作用を記述した物理モデルを再構築し, 5000回以上の1 対1 のドリブルシーンにおける運動方程式のパラメータを推定する.そして, 提案モデルの挙動を数理的に解析し, 推定されたパラメータの分布と組み合わせることで, 無数にある選択肢から, 選手が何をどのように選択してプレーしているのかを明らかにする.本研究では, 物理モデルを全面的に活用することで, 1 対1 ドリブルの背後にあるプレーヤーの行動原理を解明することを目指す.そして, 経験則で語られてきたサッカーの「常識」を, データと数理モデルから定量的に導き出すという, 新たな科学的アプローチを提示する.","excerpt_src":"背景"},{"id":"2025_soccera_1_63","year":2025,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカー守備強度の定量化に向けたハイブリッド・ポテンシャル場と指標の提案","members":"保野友裕，大平徹(名古屋大学)","first_author":"保野友裕","affiliation":"名古屋大学","code":"[口頭]サッカー9","abstract":"物理ベースモデルと統計モデルを融合したハイブリッドポテンシャル場を構築し、攻撃選択肢の戦術的価値を統合した新指標Gtotal_pressを提案した。既存指標を上回る予測精度で守備成功・失敗を判別でき、予防的守備の価値を定量的に示す新たな知見を得た。","methods":["機械学習","シミュレーション","SHAP・説明可能AI","確率モデル"],"themes":["守備","ポジショニング","プレッシング"],"data":["トラッキングデータ"],"free_tags":["ポテンシャル場","xT"],"awards":["サッカー部門 優秀賞"],"text_insufficient":false,"excerpt":"サッカーにおいて, ボールを保持していない局面における組織的な守備アクションは, 試合の勝敗を決定づける重要な要素である. しかし, その評価は専門家の主観的判断に依存する部分が大きく, 客観的かつ定量的な評価手法は未だ確立されていない. 近年, トラッキングデータの普及と機械学習技術の発展により, 選手の位置や動きを客観的に把握することが可能となった. これにより, 守備者が空間に与える影響を「ポテンシャル場」として表現する試みが多くなされている. しかし, 既存のモデルには課題が残る. 物理ベースのモデルは理論的整合性が高い反面, 選手の個人差や複雑な戦術的意図を反映しきれない. 一方, 純粋な統計的モデルはデータへの適合性は高いが, 説明可能性に乏しく, データが希薄な状況では不安定になる. そこで本研究では, 物理的モデルによる理論的な妥当性と, 統計的モデルによるデータ適応性を組み合わせたハイブリッドな時空間ポテンシャル場を構築する. さらに, 守備の強度は「単にスペースを埋めているか」ではなく, 「攻撃側にとって有効な選択肢を制限できているか」で評価されるべきであるという観点から, 攻撃側の戦術的価値としてExpected Threat(xT)やExpected Goals(xG)を重みとして統合する. 最終的に提案する指標Gtotal press は, 守備チームが攻撃側に与える実質的な圧力(プレッシャー)を定量化するものであり, 本稿ではその構築手法と, 実データを用いた有効性の検証結果について報告する.","excerpt_src":"はじめに"},{"id":"2025_basketa_1_28","year":2025,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"階層的アプローチによるバスケットボール選手のパフォーマンス評価","members":"早川秀次郎，江頭健斗，山口光，田畑耕治(東京理科大学)","first_author":"早川秀次郎","affiliation":"東京理科大学","code":"P3-14","abstract":"本研究はボックススコアデータに対して主成分分析と正規線形混合効果モデルを適用し、チーム・シーズンの階層構造を考慮した選手評価指標 C スコアと HL スコアを構築した。チーム内での相対的貢献度と総合的パフォーマンス量を統合的に評価する枠組みを提示した。","methods":["階層モデル","統計的検定"],"themes":["選手評価","チーム評価"],"data":["公式成績データ"],"free_tags":["C スコア","HL スコア"],"awards":[],"text_insufficient":false,"excerpt":"バスケットボールにおける選手評価は,得点やアシストなど単一の指標に依存することが多く,チーム内での役割やシーズン全体の貢献度を十分に反映できないという課題がある.特に,同じチーム内で選手を公平に比較することは,戦術やポジションの違いにより困難である.こうした背景から,de Paula Oliveira and Newell [1] は,ボックススコアデータの重み付き主成分スコアに対して,正規線形混合効果モデルを用いてシーズンや選手の所属チームの影響を考慮した総合的な評価指標を提案した.この指標は,シーズン・チーム・選手の階層構造をモデル化することで,チーム内での貢献度をより正確に評価できるという特徴がある.しかし,彼らの手法にはスコア算出プロセスにおいて改善の余地がある.第一に,このスコアは全主成分を用いており,寄与率の低い下位成分まで含めることでスコアに含まれるノイズが増大し,評価の妥当性を損なう恐れがある.第二に,重み付けの方法である.固有値に基づく重み付けやベクトルの正規化が不十分な場合,各指標の寄与が不均質となり,指標としての妥当性が損なわれる懸念がある.本研究では,この手法に改善を施し,日本のB リーグのデータに提案手法を適用し,チーム内での選手評価を重視した総合的なパフォーマンス指標の構築を目的とする.","excerpt_src":"はじめに"},{"id":"2025_basketa_1_76","year":2025,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"Road to Victory 越谷アルファーズ 勝利への道","members":"中村亘，伊藤槙吾，田村璃星，伴地芳啓(早稲田大学)","first_author":"中村亘","affiliation":"早稲田大学","code":"P3-15","abstract":"2024-25シーズンにB1昇格した越谷アルファーズのデータ分析から、3P成功率への過度な依存、ディフェンスリバウンドのセンターへの偏在、リバウンド後のターンオーバー多発が課題であることを明らかにした。キャッチ&シュート型シューター、ウイングのリバウンド貢献、高いA/TO比のポイントガードの獲得が勝利への鍵となる。","methods":["クラスタリング","ロジスティック回帰","統計的検定"],"themes":["チーム評価","選手起用","戦術分析","勝敗要因","打撃"],"data":["イベントデータ","公式成績データ"],"free_tags":["NetRating","Four Factors"],"awards":[],"text_insufficient":false,"excerpt":"越谷アルファーズ(越谷)は,2024-25 SEASON において悲願であった B1 リーグ昇格を果たし,新たなステージでの挑戦を始めた.しかし,実際には B1 の壁は非常に高く,シーズンを通した勝率は 0.317 に留まり,東地区 6 位という厳しい結果となった.この結果は,B1 の強度の高さを示すとともに,現行の戦術構造や選手構成では安定的に勝利を獲得することが困難であったことを示唆していると考えられる.そこで本研究では,2024-25 SEASON の B1 リーグ戦データを用いた統計的分析を実施し,越谷アルファーズが勝利する上で必要であった戦略,選手を明らかにすることを目的とする.具体的には,Four Factors・裏 Four Factors を用いたクラスタリング分析,ロジスティック回帰分析,3P と DR の詳細分析,ターンオーバーに関してのパターンマイニングを実施し,越谷が強化すべき要素を発見する.","excerpt_src":"はじめに"},{"id":"2025_basketa_1_90","year":2025,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"バスケットボールにおける3pの重要性および選手分類とその評価","members":"萩谷俊旭，昼岡空知，安藤雅和(千葉工業大学)","first_author":"萩谷俊旭","affiliation":"千葉工業大学","code":"P3-16","abstract":"B.Leagueのデータから3P成功率と勝率の強い正相関を確認し、ロジスティック回帰分析でディフェンスリバウンドが最重要要因であることを明らかにした。機械学習による選手クラスタリングで6タイプの役割を分類し、強豪チームは「攻守兼備」の選手配置により効率的な勝利構造を構築していることを示した。","methods":["機械学習","ロジスティック回帰","クラスタリング"],"themes":["選手評価","シュート","守備","勝敗要因","選手起用"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年、バスケットボールにおけるデータ分析の重要性は飛躍的に高まっている。NBA では「3ポイントシュート(3P)の多投」と「高効率なシュートエリアの選択(モリーボール理論) 」が勝敗を分ける鍵として定着している。本研究では、国内プロリーグである B リーグ(B1・B2)の 2023-24 および 2024-25 シーズンの公式試合データを用い、これらの理論が日本国内リーグにおいても適用可能かを定量的に検証する。また、勝敗に直結する重要指標を特定し、それに基づいた機械学習による選手評価モデルを提案する。","excerpt_src":"はじめに"},{"id":"2025_basketa_1_102","year":2025,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"NetRating に基づくバスケットボール選手のスターティングラインナップと試合パフォーマンスの推定","members":"中村凉，山根慧，佐々木結葵，田子圭樹，姫野祐仁，山本知仁(金沢工業大学)","first_author":"中村凉","affiliation":"金沢工業大学","code":"P3-17","abstract":"プレイバイプレイデータから段階的に構築したデータパイプラインとCatBoostモデルにより、スターティングラインナップと試合前情報から試合NetRatingのばらつきの約2割を説明できることを示した。コーチング現場での量的意思決定支援の基盤として機能し、スターティング選択やラインナップ設計に活用可能である。","methods":["機械学習","勾配ブースティング","時系列解析"],"themes":["選手評価","選手起用","試合の流れ","戦術分析"],"data":["イベントデータ","公式成績データ"],"free_tags":["NetRating"],"awards":[],"text_insufficient":false,"excerpt":"バスケットボールにおいて,試合の勝敗は選手の能力だけでなく,コート上に同時に立つ5 人の選手の組み合わせが大きく影響する.特に試合開始時のスターティングメンバは,コーチが事前のスカウティングや戦略を踏まえた試合展開の最適な形であり,序盤,またはそれ以降の流れを左右する極めて重要な要素である.実際にはゲーム展開に応じて最適な形は変化するが,どのラインナップで試合に入るかは,その試合のパフォーマンスや選手のコンディション,そして勝敗にも一定の影響を与えていると考える.これらを測定する指標として,得点やリバウンドといった個人スタッツや,オフェンス・ディフェンス効率,Plus- Minus 系指標を用いた選手単位またはラインナップ単位の評価指標が多く用いられてきた.しかし多くの指標は個人スタッツがベースとなっており,試合開始時点のメンバーが試合結果にどの程度影響しているのかといった,スターティングラインナップが与える影響を評価することは十分に行われてこなかったと考える.コーチングの現場では対戦相手や得点などの状況に応じてスターティングラインナップをどう変化させるか,その意思決定を支える十分な証拠は限定的であると考えた.さらに試合中の多くのラインナップは出場時間が短いものが多く,すべて用いると指標の信頼性が低くなる.一方,スターティングラインナップは出場時間が長く,相手の主力メンバーと対戦するため,チームの純粋な実力を反映したデータ・モデルを得ることができる可能性がある.以上の背景から,本分析では過去の試合データに基づき,スターティングラインナップの組み合わせが発揮するパフォーマンスを予測し,そのラインナップの有効性を定量的に評価することを目的とし,分析を行う.","excerpt_src":"はじめに"},{"id":"2025_basketa_1_64","year":2025,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"重度な怪我とプレーの関係","members":"山下隆誠，山本義郎(東海大学)","first_author":"山下隆誠","affiliation":"東海大学","code":"P4-14","abstract":"本研究はインジュアリーリスト掲載選手のプレー特性を分析し、怪我とプレー行動の関係を明らかにした。交代頻度が高い長時間出場、得点能力への偏り、短時間出場といった条件が怪我リスクを高めることを示し、適切なプレータイムシェアと選手育成の必要性を提示した。","methods":["統計的検定","可視化"],"themes":["怪我・コンディション","選手評価","試合の流れ"],"data":["イベントデータ","公式成績データ"],"free_tags":["インジュアリーリスト"],"awards":[],"text_insufficient":false,"excerpt":"スポーツにおいて怪我は付き物である.しかし,競技レベル向上や選手生命の延長のためには怪我をしないことが重要である.今回は Bリーグインジュアリーリスト掲載選手を対象に怪我をしやすいプレーについて考察していく. 2目的本研究では 2025 年 11 月 10日にインジュアリーリストに掲載されていた選手を対象に研究を行う.インジュアリーリストとは選手が外傷,障害の診断を受け、その影響で離脱する際にロスター枠を開けるために申請を行い,ロスター外にすることが出来る制度である.登録から 30 日はチームに再登録出来ない.また,FIBA による国際バスケ移籍レポート[1]によると,試合数は他リーグ最多であり,シーズン中の離脱を予防することで競技レベルの向上が望める.世界2位のバスケットボールリーグを目指す B リーグにおいて怪我の予防は必須である.","excerpt_src":"はじめに"},{"id":"2025_basketa_1_77","year":2025,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"B リーグにおける観客動員数に影響を与える要因の分析","members":"jin chuhan，張昊宇，小泉和之(順天堂大学)","first_author":"jin chuhan","affiliation":"順天堂大学","code":"P4-15","abstract":"B1リーグの2023-24シーズンの720試合を対象に、観客収容率への影響要因をベータ回帰モデルで分析した。ホーム順位の向上、スター選手の出場、シーズン終盤の順位争い激化が有意な正の影響を与え、チーム強化とスター選手育成が観客動員増に有効であることが示された。","methods":["ベイズ統計","統計的検定","可視化"],"themes":["観客・ファン","経営・制度","チーム評価"],"data":["公式成績データ","外部データ併用"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年、プロスポーツにおける観客動員数の増加は、リーグ運営およびクラブ収益において極めて重要な指標となっている。特にB.LEAGUE では、2023-24 シーズンにおいてリーグ史上最高の年間動員数を記録するなど、バスケットボール市場の拡大が続いている。観客数はチケット収入のみならず、グッズ売上、スポンサー契約、放映権料など、多方面に経済的波及効果をもたらす。そのため、観客動員に影響を与える要因を明らかにすることは、クラブマーケティングやリーグ施策の立案において重要な課題である。これまでの研究では、野球やサッカーを対象とした観客数・スタジアム需要の分析が数多く行われており(例えば、[1] など)、試合日程や競技水準、スタジアム規模、チーム人気などが観客数に影響することが示されている。さらに、スタジアム入場需要研究のサーベイによれば、多くの研究は野球やサッカーといった既存のメジャースポーツに集中しており、その他の競技を対象とした研究は相対的に少ないとされている[2]。一方で、バスケットボールについてB.LEAGUE を対象とした観客需要研究は存在するものの、複数の要因を統合的に取り入れた体系的な観客収容率の分析は依然として限定的である。","excerpt_src":"はじめに"},{"id":"2025_chikoku_basket_1_suganuma","year":2025,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"バスケットボールにおける試合の流れの定量化と多面的選手評価システム","members":"二宮櫻輔，菅沼亮太，田承林，友成洸碧，大川剛直(神戸大学)","first_author":"二宮櫻輔","affiliation":"神戸大学","code":"P4-16","abstract":"プレイバイプレイデータから各イベントの勝敗への寄与度を最適化計算で定量化し、Momentum Creation Rate（MCR）指標を提案した。ポゼッション内のプレー連鎖と時間的切迫性を考慮することで、リバウンドやスティールといった非得点プレーを含む多面的な選手評価システムを構築した。","methods":["最適化","指標開発","可視化"],"themes":["試合の流れ","選手評価","チーム評価"],"data":["イベントデータ"],"free_tags":["MCR"],"awards":[],"text_insufficient":false,"excerpt":"バスケットボールは得点の変動が激しく,短い時間の中で試合の“流れ(モメンタム)”が大きく移り変わるスポーツである.現場においては「流れを掴む」「悪い流れを断ち切る」といった表現が用いられることからわかるように,流れは戦術判断や選手起用を左右する重要な概念である.しかし,その重要性が認識されている一方で,試合の流れはしばしば主観的・経験的に語られ,科学的・定量的な分析は十分に行われていない[4].また,従来の選手評価指標[1] は得点に依存しており,チーム全体のパフォーマンスや試合の流れに対して各選手がどのように貢献したのかを十分に捉えられていない.そこで本研究では,試合の流れを定量化するとともに,流れの獲得に貢献した選手の抽出を行うシステムの構築を目的とする.","excerpt_src":"はじめに"},{"id":"2025_basketa_1_82","year":2025,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"Areal Poisson 階層モデルを用いたショットチャートのチーム傾向比較","members":"山田和宏，藤井慶輔(名古屋大学)","first_author":"山田和宏","affiliation":"名古屋大学","code":"[口頭]バスケットボール1","abstract":"Areal Poisson階層モデルを用いて、B.Leagueのチームショットチャートからシーズン間相関とショット種別特異性を同時に推定するフレームワークを構築した。ポゼッション数で正規化されたチーム間公平比較と高い外挿予測性能を達成し、現場のスカウティングに活用可能な知見を提供する。","methods":["階層モデル","ベイズ統計","確率モデル","可視化"],"themes":["シュート","戦術分析","選手起用","ポジショニング"],"data":["イベントデータ"],"free_tags":["xG"],"awards":["バスケットボール部門 優秀賞"],"text_insufficient":false,"excerpt":"ゴール型スポーツにおいて, ショット(シュート)は得点に直接関係する最も重要なアクションの1 つである。殊にバスケットボールにおいては, その質や選手ごとの傾向を定量化・理解するために様々な手法が提案されてきた。例えば, [6] はトラッキングデータを用いたショット成否予測タスクのための機械学習モデルの出力に基づき, バスケ版xG とも呼べる期待ショットクオリティを算出している。また, [4, 2] はショットチャートデータ(フィールドゴールを打ったコート位置が記録されたデータ)を用いて,選手の空間的なショット選好の可視化・類型化を試みている。他にも, トラッキングデータ(選手・ボールの移動軌跡が記録されたデータ)を用いて選手のショット傾向を直観的・定量的に捉えるための手法を提案した研究[7] や, ラインナップ(同時に出場する選手5 人)におけるショット配分効率を定量化した研究[5] などが存在する。ショット空間分析の文脈では, 選手やチームごとの選好や傾向を明らかにし可視化することが重要なテーマである。個々の選手には好んで打つ位置が存在し[4, 2], またチーム戦略としてもどのエリアから重点的にショットを狙うかは大きく異なる。現場の観点では,チームが「どのエリアから, どのようなショットを」打ちやすいかを把握することが,守備のヘルプ原則やスクリーン対処等の戦略設計に直結する。選手別のヒートマップは一般的だが,試合中のプレーは個人技だけでなくチーム戦術にも駆動されるため,個々の選手のヒートマップだけでは不十分であり, チーム全体の空間的選好を, ショットの種類を考慮しつつ安定に推定・比較できるモデルが求められる。しかしながら, そのようなモデリング手法はまだ十分に検討されていない。そこで, 本研究はチームのショット傾向比較を可能にするモデリング手法を提案する。具体的には, B リーグにおけるコートのエリア毎に記録されたショットチャートデータを用いて, チームのショット発生率をポゼッション数で正規化したAreal Poisson 階層モデルで記述し, ショットの空間的選好とその持続性を同時に推定する枠組みを提示して, 外挿を含む定量評価実験によりその予測性能を検証した(現場で求められるのは「次の期間・次の相手」への予測であるため, 本研究は学習外データに対する外挿性能を主指標とする)。本研究の貢献は以下の3 点に要約される。1. チームレベルの離散空間モデリング:チーム単位で「発生率(レート)」を直接モデリングするAreal Poisson階層モデルを提案し,ポゼッション数をオフセットとしてチーム間の公平な比較を可能にした。2. シーズン間相関をもつ交互作用とショットタイプ特異性の同時表現:シーズン間の相関をもつチーム×エリア, チーム×サイド交互作用と,ショット種別ランダム傾きを併用し,それらの掛け算的な分解を可能にした。3. 外挿性能評価実験と可視化による洞察の提供:B リーグのデータを用いた外挿性能の評価実験では, 提案モデルが交互作用項とランダム傾きを含まないベースラインと比べて優れていることを実証し, 高い予測妥当性を確認した。可視化では, エリア別チーム間パーセンタイルやチーム間左右サイド選好比較によるスカウティングに直結する理解しやすい知見(ショットタイプ別エリア選好/左右の偏り)の提供を可能にした。","excerpt_src":"はじめに"},{"id":"2025_basketa_1_73","year":2025,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"ペイントエリア内の非合理的なシュート位置の可視化と得点期待値に基づくT字型ペイントの提案","members":"佐々木優斗，和田智仁，今泉拓(鹿屋体育大学)","first_author":"佐々木優斗","affiliation":"鹿屋体育大学","code":"[口頭]バスケットボール2","abstract":"バスケットボールのペイント内におけるシュート位置と得点期待値の不整合を分析し、リング中心の同心円状の高期待値分布に対し、現行の長方形ペイントが低期待値エリアへのシュートを誘発していることを明らかにした。T字型ペイントの導入により、チーム全体で1試合あたり0.5～0.8点の得点増加が期待される。","methods":["可視化","カーネル密度推定","統計的検定","シミュレーション"],"themes":["シュート","得点予測","ゴール期待値","戦術分析","選手評価"],"data":["イベントデータ","公式成績データ"],"free_tags":[],"awards":["バスケットボール部門 優秀賞"],"text_insufficient":false,"excerpt":"近年、バスケットボールにおける競技力向上のためには、データに基づく戦術立案やパフォーマンス分析が重要視されている。特に NBA におけるアナリティクスの発展を契機として、試合中の意思決定を数理的に支える取り組みが世界的に普及してきた。こうしたデータ活用が進む中で、チームがどの位置でシュートをするか (以下、シュート位置)にも大きな変化がみられるようになったことが知られている[1]。データ分析の成果を戦術に実践的に取り入れた代表例として、モーレイ (Daryl Morey)が2010 年代のヒューストン・ロケッツで構築した、いわゆる Morey Ball が挙げられる。Morey Ball は、得点期待値が高い「3P シュート」と「ゴール下のシュート」の割合を極端に高める戦略であり、この方針がチームの得点力を大きく向上させたと知られている[2]。この例は、データに基づくシュート位置の選択が、チームパフォーマンス向上に大きく影響を及ぼしたことを示している。Morey Ball の台頭以降も、データに基づくシュート位置の検討は進んでいる。現在では、ペイントエリア内 (以下、ペイント)のシュートが、特に期待得点の高いシュートとして位置づけられている。B. Leagueのシュートチャートを見ても、2P シュートはペイントに集中している。実際、2024–2025 シーズンの B1.Leagueデータを集計したところ、フィールドゴール全体に占める 2P シュートの割合が 58.3%であり、全 2P シュートの中で 82.6%がペイントから放たれたものである。このことから、ペイントは B. Leagueにおいても主要な得点源であり、シュートを積極的に打つべきエリアとなっていることが推測できる。1.2 アフォーダンスとしてのペイントエリアスポーツにおいては、ラインの引き方や空間の区切り方が選手の行動選択に大きな影響を与える。例えば、サッカーの 5 レーン攻撃では、ペナルティーエリアを基準にフィールドを縦 5 つのレーンに分割することで、選手は自身の動く方向を把握している[3]。テニスでも、センターラインを意図的にずらしたコートで練習することで、選手が自然とバックハンドを使用する状況が増える指導法が知られている[4]。これらはいずれも、空間の区切り方が選手の行動を誘発し、プレーの選択肢に影響することを示す事例である。このように、環境が特定の行為を自然と引き出す性質は、認知心理学においてアフォーダンスと呼ばれる[5]。バスケットボールにおけるペイントも、ラインによって明確に区切られ (しばしば色分けもされ)、選手にシュートを打つべき場所を分かりやすく誘導している点で、行動を促すアフォーダンスを有していると考えられる。1.3 目的と仮説本研究では、ペイントエリアが選手の行動を誘発するアフォーダンスとして機能している点に着目し、ペイントの形状と得点効率との関係を数理的に検討することを目的とする。特に、ペイントの形状が選手のシュート選択に与える影響を分析し、より合理的なペイントエリアのあり方を探る。日本バスケットボール協会の競技規則によれば、ペイントはサイドラインと平行に 5.8m、 エンドラインと平行に 4.9m の長方形として定められている。 しかし、リングが円形であることを踏まえると、シュート成功率が最も高くなる範囲が長方形であるとは考えにくい。むしろ、リングを中心とした距離に応じて成功確率が連続的に変化する方が自然であり、距離依存的な分布を示すと想定できる。したがって、現在の長方形のペイントが示す“有効的なシュートエリア”と、実際に成功率が高い空間分布との間には、形状的な乖離が存在する可能性がある。そこで本研究では、選手が実際に選択しているシュート位置と、その位置が持つ得点期待値との間に不整合が存在するという仮説を立てる。まず、シュート位置と得点期待値を可視化し、両者がどのような関係にあるかを明らかにする。さらに、不整合が確認された場合には、シュート位置を改善した際に得点数がどの程度向上し得るかを試算する。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_2","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"RE24を用いた上位球団のチーム力分析ー得点期待値に基づく得失点効率の指標化ー","members":"天久昂，森田誠純，佐藤浩志(明星大学)","first_author":"天久昂","affiliation":"明星大学","code":"P3-01","abstract":"RE24という得点期待値変動指標を用いて、パ・リーグの上位球団3チームの攻撃力と投手力を分析した。打者RE24、投手RE24、総合RE24を算出し、安定した得点創出と失点抑制の両立が勝利に不可欠であることを明らかにした研究である。","methods":["指標開発","統計的検定","可視化"],"themes":["選手評価","チーム評価","得点予測","投手起用"],"data":["イベントデータ"],"free_tags":["RE24"],"awards":[],"text_insufficient":false,"excerpt":"プロ野球のチーム力評価には得失点差やOPS、WHIPが用いられるものの、これらは「どの状況で得点・失点が生まれたか」を十分に考慮していない。選手の存在感はチャンスメイクや走者状況に応じた活躍に強く依存するため、状況を無視した指標では攻撃・投球の効率性を正確に捉えにくい。そこで本研究では、打者・投手が各プレーで得点期待値(RE)をどれだけ変動させたかを示す指標「RE24」を用い、チームの攻撃力と投手力を打者RE24、投手RE24、総合RE24 として、得点効率と失点抑止が上位進出にどう関与しているか状況依存的に分析する。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_10","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"NPBにおける日本人選手と外国人選手の年俸決定要因の比較分析","members":"露原秀斗，山口翔矢，阿部航大，羅升載，白井康之(大東文化大学)","first_author":"露原秀斗","affiliation":"大東文化大学","code":"P3-02","abstract":"2022～2024年のNPBデータから、日本人選手と外国人選手の年俸決定基準を比較分析した。日本人選手は出塁率などの継続的貢献を重視される一方、外国人選手は本塁打や打点などの即戦力的インパクトが高く評価されることを明らかにした。","methods":["回帰分析","統計的検定"],"themes":["選手評価","経営・制度","年俸・契約"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"本研究では、日本プロ野球(NPB)における外国人選手と日本人選手の年俸決定構造の違いを明らかにすることを目的とし、 2022〜2024 年の 3シーズンを対象に、投手・野手の主要パフォーマンス指標と年俸の関係性を比較分析した。投手については先発・中継ぎ・抑えに分類し、 QS 率、WHIP、奪三振率、与四死球率、平均球速などの指標を用いた。一方、野手については OPS、本塁打、長打率、出塁率、打率、打点など得点力と長打力の観点から分析を行った。分析の結果、外国人選手と日本人選手では、年俸に反映される評価基準に明確な差が存在することが示された。例えば、野手では、日本人選手は出塁率や OPSなどの「継続的貢献」を示す指標との相関が高く、とりわけ出塁能力が年俸に反映されている傾向が示された。一方、外国人選手は本塁打や打点といった「一撃のインパクト」を示す指標との相関が強く、短期間でチームに大きな結果をもたらす能力が契約評価に直結していた。特に打点では外国人選手の相関係数が高く、得点圏での勝負強さが高く評価されていることが明らかとなった。以上より、NPB における年俸決定には、選手の国籍によって異なる評価体系が存在し、日本人選手は長期的・安定的な貢献が、外国人選手は即戦力としての強いインパクトが重視される構造が確認された。本研究は、NPB における人材評価や契約戦略の理解を深める上で重要な示唆を提供するものである。なお、紙幅の都合により、本論文では野手の結果のみを記すこととする。1. はじめに日本の社会には、長年にわたり「年功序列」という考え方が根付いている。これは、勤続年数や経験を重ねることで評価や報酬が上がるという制度であり、多くの企業や組織で見られる特徴である。プロ野球の世界においても、同様の傾向が存在する可能性が指摘されている。実際に、経験(勤続年数)が年俸決定において重要な役割を果たしているという研究結果もあり、NPB においても「年功重視」の要素が依然として残っていることが示唆されている[1]。一方で、NPB には多くの外国人選手も所属しており、彼らは日本人選手とは異なる背景や評価基準のもとで契約を結んでいると考えられる。日本人選手は若くしてプロ入りする選手も多いが、外国人選手ではそのような例は少ない。また、日本人選手には守備や走塁、バントといったチームプレー的な貢献が求められる一方、外国人選手には主に打撃や長打力などの即戦力としての役割が期待される印象がある。このように、求められる役割や評価基準の違いが、年俸決定の仕組みにも影響を与えている可能性がある。さらに、外国人選手の給与は日本人選手より平均して 54.7%〜57.3%高いという結果も報告されている[2]。これらの点を踏まえると、 NPB において日本人選手と外国人選手では、年俸の決定要因やその重みづけが異なる可能性が高い。そこで本研究では、外国人選手と日本人選手それぞれの年俸に影響を与える要因を比較・分析し、その背景にある評価構造や文化的要因について考察することを目的とする。","excerpt_src":"概要"},{"id":"2025_chikoku_baseball_5_senba","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"ピッチクロック導入によりプレースタイル変更が求められる投球の要因について","members":"仙波圭梧，富本悠太，吉野波響，高良流平，齊藤史哲(青山学院大学)","first_author":"仙波圭梧","affiliation":"青山学院大学","code":"P3-03","abstract":"ランダムフォレストのMinimal Depth法を用いて、NPB2024シーズンのプレーデータからピッチクロック導入時に投球スタイル変更が求められるケースを分析した。走者が一塁にいるケース、イニング、走者が二塁のケースが重要要因であることを示し、国際試合対応への示唆を提供した。","methods":["機械学習"],"themes":["投球・配球","ルール変更","戦術分析"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年,野球競技において試合時間の長時間化および試合進行の停滞が顕著な課題として指摘されている.特にプロレベルでは,観客の娯楽選択肢の多様化に伴い,競技自体のテンポや視聴体験への改善要求が高まっている.現代のスポーツ観戦者は長尺コンテンツよりもテンポの良い短時間コンテンツを好む傾向があり,顧客満足度の向上に一部貢献していると考えられている.このような状況を受け,米国メジャーリーグベースボール(MLB)をはじめとする各国のリーグは,投球間隔を制御する「ピッチクロック(pitch clock)」の導入を進めてきた.日本における野球界では,社会人野球や一部の独立リーグで導入されており,徐々に広がりを見せているが,2025年時点においてNPB1 軍公式戦へのピッチクロック導入は見送られているのが現状である.ピッチクロック導入に関する議論は年々深まっており,将来的にNPB1 軍戦においても導入される可能性が徐々高まってきている.さらに,WBC などの国際大会では既に導入が決定していることから,我が国のプレゼンス維持する上でも対応が求められている.その一方で,投手・打者双方に固定的なリズム調整を要求する点から,選手のプレーパフォーマンスや戦術行動に対して多面的な影響を与えることが指摘されている.投手は状況に応じて投球間隔を柔軟に調整することで,疲労回復やフォームの微調整を行っていたが,ピッチクロック導入により猶予時間が制限されるため,局所的な疲労蓄積の問題が指摘されている.また,投手特有の「間」「ルーティーン」を利用したメンタルコントロールが制限され,パフォーマンスの低下も懸念されている.さらに,クロックの短縮に伴い,捕手とのサイン交換や戦略策定のプロセスが圧縮されることから,特に複雑な配球を特徴とする投手やへの影響や,ランナーや打者との駆け引きにも影響が大きい.本研究では,現状のNPB のプレー内容がピッチクロックのルールに照らし合わせることで,ピッチクロック導入後に現状からの投球間隔の変更が求められるケースを分析する.現状ではピッチクロックは導入されていないので,現状のプレーがピッチクロック抵触するか否かをプレイデータに基づいてモデル化する.これにより,現状のプレースタイルをそのまま維持できる選手やなんらかの対応が求められる選手についての知見獲得ならびに,対応が求められる状況に関する知見獲得を目指している.","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_31","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"XGBoost を用いた日本プロ野球における有利度算出モデルの構築","members":"信嶋凌，荒川哲至，仲田尚生，鈴木海友(東京理科大学)，小林正弘(東海大学)，松澤智史(東京理科大学)","first_author":"信嶋凌","affiliation":"東京理科大学","code":"P3-04","abstract":"XGBoostで一球ごとの得点予測モデルを構築し、攻撃側と守備側の有利度を定量化した。打者や投手の特性を反映した有利度の算出が可能となり、野球中継での活用が期待される新しい指標を提案した。","methods":["機械学習","勾配ブースティング","指標開発"],"themes":["戦術分析","得点予測","勝敗要因"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年,様々なスポーツでデータ解析が行われ,戦術の最適化やパフォーマンス向上に活かされている.野球においては統計学的に分析を行い,客観的な指標を用いて選手を評価するセイバーメトリクスなどが注目されている.こうした解析結果はチーム強化のみならず,中継等における視聴者向けの観戦指標としても普及している.しかし,多くの選手評価指標が打席ごとの結果を基に算出されており,一球ごとにフォーカスされていない.そのため,現在の日本プロ野球において「一球ごとに変化する攻撃側と守備側のどちらが有利であるか」を解析している研究は非常に少ない.野球をプレーする選手や監督,さらには,野球を視聴する人にとっても,一球ごと,カウントが変わるごとに,攻撃側がどれぐらい有利・不利な状況に変化したかを数値の変化で示すことは有用である.そこで,本研究では,大量のデータにも対応することができる機械学習を用いて,一球ごとの得点予測モデルを構築する.","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_42","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"ストライク投球の効果について","members":"阿部颯大，日名望留人，森裕一(岡山理科大学)","first_author":"阿部颯大","affiliation":"岡山理科大学","code":"P3-05","abstract":"対応分析とクラスター分析を用いてストライク投球の9つのゾーン別特徴を分析した。落ちる系を低めに投げることで空振りが多く、直球系と真ん中以上で被打率が高くなることを明らかにした。2024年NPB858試合160,810球を対象に投球戦略の効果を定量化した。","methods":["クラスタリング","可視化","統計的検定"],"themes":["投球・配球","戦術分析","打撃"],"data":["イベントデータ"],"free_tags":["被打率"],"awards":[],"text_insufficient":false,"excerpt":"野球では,外角低めに投球することが定石とされている。 たとえば,全投球におけるストライクゾーン別の被打率を図 1 に示す。これを見ると外角低めは被打率が 0.19 と確かに他のゾーンと比較して最も打たれていないことがわかる。 ここに着目すると, 投手は外角低めに投球することが 1 つの戦略と捉えることができる。しかし, この一般的なセオリーがどの球種タイプやどのイニングにおいても通じるのか,最新のデータを用いて検証する必要がある。そこで,本研究では,提供されたデータ( Data Stadium Inc.,2024)を基に,ストライク投球の 9 つのゾーン別の特徴や投球パターンの違い,イニングの進行による変化などを捉えることで,この定石および投球の仕方の効果について明らかにしていくことにする。内角真ん中外角高め 0.20 0.25 0.22真ん中 0.25 0.31 0.26低め 0.22 0.26 0.19図 1 全球種におけるストライクゾーン別の被打率内角・外角については,右バッター(対右),左バッター(対左) で左右の位置が対称になるが, ここでは, 合計して,内角を左に,外角を右に示している。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_53","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"ホームラン危険球をいかに回避するか ―ホームランリスクの可視化―","members":"宮本煌大，築山日向大，三木立風，山西涼太，中川満(大阪公立大学)","first_author":"宮本煌大","affiliation":"大阪公立大学","code":"P3-06","abstract":"LightGBMとSHAP分析を用いて、ホームラン級の危険なプレーを特定し、ホームラン回避の具体的な戦術要因を分析した。疲労、投球コース、配球シーケンスの3要素がホームラン回避に寄与し、高めのストライクゾーンが予想外の回避要因であることを明らかにした。","methods":["勾配ブースティング","SHAP・説明可能AI"],"themes":["投球・配球","勝敗要因","得点予測"],"data":["イベントデータ"],"free_tags":["ホームランリスク"],"awards":[],"text_insufficient":false,"excerpt":"野球において選手の評価を行う際、防御率や WHIP のようなさまざまな有効な指標が存在する。しかし、これらの指標は多くの場合、シーズン全体の結果を平均化したものに過ぎず、 「何が起こったか」は示せても、特定のプレーに内在する「なぜ(Why)」や「どのように(How) 」を説明するには不十分である。特に、ホームランという最も失点リスクの高いプレーにおいて、従来の指標は「運良く回避できた失投」と「戦術的に優れた投球」を区別することができない。そこで本研究では、この平均化された指標の限界を超えることを目的とする。まず、機械学習(第一段階モデル)を用いて、全プレーから「ホームラン級の危険なプレー」を高精度に特定する。次に、その「危険なプレー群(被弾TP/回避 FP)のみを対象とした第二段階モデルと SHAP 分析を用いて、なぜ実際に「ホームランになった(TP) 」のか、あるいは「ホームランを回避できた(FP) 」のかを分ける、具体的な戦術的要因を詳細に分析する。これにより、単なる結果論のリスク評価に留まらず、 「疲労」 「投球コース」 「配球シーケンス」といった投手が実行可能な要因がホームラン回避にどのように、なぜ寄与するのかを解明し、本質的な優れた投球を定義する。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_57","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"限定した得点期待値を用いたバントの有効性の分析","members":"笠原雅希，藤澤獅光，小串典子(明治学院大学)","first_author":"笠原雅希","affiliation":"明治学院大学","code":"P3-07","abstract":"当該打者と出塁中のランナーによる直接得点のみに限定した得点期待値を新たに定義し、バント戦術の有効性を試合状況別に分析した。バント率が高い状況で必ずしも得点期待値が高くないこと、イニング進行とともにバント効果が変化することを明らかにした。","methods":["指標開発","統計的検定"],"themes":["打順・采配","戦術分析","勝敗要因"],"data":["イベントデータ"],"free_tags":["得点期待値","バント成功率"],"awards":[],"text_insufficient":false,"excerpt":"近年、日本プロ野球においてもメジャーリーグで主流となりつつあるセイバーメトリクスの影響を受け、バントの有効性についての議論が多くある。バントはその打席からの得点期待値を下げるという報告が多くあり、例えばメジャーリーグにおけるバント率はレギュラーシーズンで0.7(%)、ポストシーズンで1.1(%) 程度である[1]。一方で、日本プロ野球では現在もバントは主要な戦術の一つとして非常に多く用いられている。本研究では、どんな場面でもバントを選択することが悪手なのか、状況によってバントが生かされる場面があるのかどうかを、工夫した得点期待値を用いて検討する。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_65","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"EMDと時系列クラスタリングを用いたプロ野球打者の「適応の軌跡」の可視化","members":"中村明日香，松井武留，後藤弘光(金沢学院大学)","first_author":"中村明日香","affiliation":"金沢学院大学","code":"P3-08","abstract":"Earth Mover's Distance（EMD）と時系列クラスタリングを用いて、打球方向分布の形状変化をグリッド行列として定量化し、プロ野球打者のシーズン中の動的適応を可視化した。村上宗隆と近藤健介を事例に、投手の攻め方と打者の対応パターンの時間推移を分析した。","methods":["クラスタリング","時系列解析","可視化"],"themes":["選手評価","戦術分析","試合の流れ"],"data":["イベントデータ"],"free_tags":["EMD","ホットゾーン"],"awards":[],"text_insufficient":false,"excerpt":"プロ野球の打撃は、約400 ミリ秒という極限的な時間制約下で行われる高度な知覚・運動課題である[1]。打者がシーズンを通して高いパフォーマンスを維持するためには、単なる技術だけでなく、絶えず変化する環境や対戦相手への「適応(Adaptation)」が不可欠となる。先行研究によれば、この適応は、投球ごとの軌道予測や動作修正といった微視的適応[2]、配球の読み合いなどの戦術的適応[3]、そしてシーズンを通した好不調や攻め方の変化に対する巨視的適応[4] という多層的なプロセスで構成される。しかし、従来の累積的な成績指標(打率、OPS 等)では、これらの動的な状態遷移プロセスを捉えることは困難であった。そこで本研究では、打者と投手の適応の様相を可視化するための新たな試みを行う。具体的には、投球コースと打撃結果を空間的に離散化した行列データとして捉え、分布形状の差異を定量化するEarth Mover’s Distance (EMD)を用いて、その時系列変化をクラスタリングにより構造化する。これにより、単なる成績数値の上下動だけでは捉えきれない、打者のホットゾーンの形状変化や投手の攻め方のシフトといった構造的な遷移を明らかにし、シーズンを通した選手の「適応の軌跡」を視覚的に評価可能なフレームワークを提案する。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_69","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"投手分類に基づく軟投派投手の効果的な投球戦略の分析","members":"新田脩人，小泉和之(順天堂大学)","first_author":"新田脩人","affiliation":"順天堂大学","code":"P3-09","abstract":"直球系平均球速に基づいて投手を軟投派・中間層・速球派に分類し、それぞれの投球特性と配球傾向を比較した。重回帰分析によってWHIPに影響する要因を分析し、軟投派はゴロ率を活用し、ストライク率向上と投球効率化がパフォーマンス改善の鍵であることを明らかにした。","methods":["機械学習","統計的検定"],"themes":["投手起用","戦術分析","育成・指導"],"data":["イベントデータ"],"free_tags":["軟投派","WHIP"],"awards":[],"text_insufficient":false,"excerpt":"近年の野球では投手の球速向上が目立っており、高校野球に着目すると、最高球速が140 km/hを超える投手は2016年夏の甲子園で9人であったのに対し、2025年夏の甲子園では23人とその傾向は顕著である。一方で、130 km/h に満たない直球と 80 km/h 台のカーブを主体とするような、いわゆる軟投派投手が強豪校を抑えるような状況や、はたまたプロ野球においても軟投派投手が一流の打者を抑えるというような状況も珍しくない。球速の高速化が進む現代野球において、球速がそれほど速くない投手がどのように打者を抑えているのかという点は、投手育成・スカウティングにおいて重要な示唆を持つと考えられる。本研究では、2024 年のプロ野球公式戦において一軍で登板した 349 名の投手を対象に、球速帯による投手分類を行い、投球結果や配球傾向、打球結果の特徴を比較することで、軟投派投手の特徴とその有効性の要因を明らかにすることを目的とする。","excerpt_src":"本文冒頭"},{"id":"2025_baseballa_1_71","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"中継ぎ投手の連投・酷使がパフォーマンスに与える影響","members":"池田篤人，河野浬空，久保諒汰，舛元拓，渡壁京子(大和大学)","first_author":"池田篤人","affiliation":"大和大学","code":"P3-10","abstract":"日本プロ野球の中継ぎ投手を対象に、連投がパフォーマンスに与える影響を分析した。FIPやNwOBAなどの指標を用いて短期的影響を検証し、ワイブル分布による生存時間解析により長期的な負荷蓄積と故障リスクをモデル化した結果、3連投以上で成績悪化が顕著であり、SSS指標により投手の脱落予測精度が87.5%に達することを示した。","methods":["統計的検定","生存時間解析","確率モデル"],"themes":["投手起用","怪我・コンディション","チーム評価"],"data":["イベントデータ"],"free_tags":["Season Stress Score"],"awards":[],"text_insufficient":false,"excerpt":"昨今、NPB(日本プロ野球)では、連続登板(以下、連投)が減少している傾向が顕著に見られる。この原因は、休息時間を取ることにより成績の悪化や怪我を防ぐためであると一般的に考えられている。また現代野球では先発投手が長いイニングを投げることが減り、終盤の重要な場面を任される中継ぎの価値が高まっている。登板数が増す一方、成績の悪化や怪我が心配される。そのような背景から、本研究は中継ぎの連投がパフォーマンスに与える影響を分析し、起用法の是非を考えることを目的とする。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_75","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"投球間隔が及ぼす打席結果への影響","members":"山崎優輝，後蒼太，山口輝，夏川浩明(大阪成蹊大学)","first_author":"山崎優輝","affiliation":"大阪成蹊大学","code":"P3-11","abstract":"NPBの投球データを用いて、投球間隔が打席結果に与える影響を分析した。投手個人の平均テンポからの乖離に注目し、ロジスティック回帰分析により投球間隔の短縮が制球力向上とストライク率向上に寄与することを定量化した結果、特に打者有利なカウントでの四球抑制に有効であることを示した。","methods":["ロジスティック回帰","統計的検定"],"themes":["投球・配球","打撃"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"日本プロ野球(NPB)において,投手の投球間隔は試合のペースや選手のパフォーマンスに関与する重要な要素である.近年,メジャーリーグ(MLB)ではピッチクロック制度が導入され,投球間隔の短縮による試合時間の短縮とゲームの活性化が企図されている. NPB においても同様の議論がなされる中,投球間隔の変化が具体的な打席結果にどのような影響を及ぼすかについて,実データを用いた分析を行い,その傾向について考察する.これまでの研究において,投球間隔がパフォーマンスに与える影響を定量的に検証した先行研究は限定的である.その中で参考文献 [1] の研究では,全体の投球間隔の中央値を基準として, 「速い・遅い」に二値化し,その影響を獲得塁数という指標で評価が行われていた.これに対し本分析では, 各投手の投球間隔の平均値を基準とし, 「速い・標準・遅い」の三段階に分類し,個々の投球テンポの乖離に着目する.以上の観点から本分析の目的は,提供された投球データを用い,投球間隔(IntervalSeconds)が打席結果に及ぼす影響を解明することにある.具体的には,投球間隔の分布や傾向を把握した上で,投球間隔の変動が打席結果に与える影響について統計的な検証を行う.","excerpt_src":"序論"},{"id":"2025_baseballa_1_87","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"セイバーメトリクスを用いたクローザーの評価","members":"田中一陽，安藤雅和(千葉工業大学)","first_author":"田中一陽","affiliation":"千葉工業大学","code":"P3-12","abstract":"抑え投手の総合的な評価指標の開発を目的に、FIPを改良し被本塁打の評価基準を調整した。投手が打たれやすい領域への本塁打と制球ずれを考慮することで、FIPよりも抑え投手の実績や役割を反映した評価指標を提案した。","methods":["指標開発"],"themes":["選手評価","投手起用","投球・配球"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"セイバーメトリクスとは、野球を客観的に分析するために、データや統計を用いて選手やチームの価値を評価する手法のことである。アメリカの統計分析団体「SABR(Society for American Baseball Research )」に由来しており、従来の“打率・打点・勝ち星”といった数字だけでは分からない「本当に勝利に貢献している選手を見抜く」ことを目的としている。セイバーメトリクスで重視される考え方は、2 つある。1 つ目は、 「勝利への貢献度」 を評価することである。たとえばホームランは得点につながりやすく、四球もアウトにならず出塁を増やす点で価値が高い。逆に打率が高くても、四球が少なく長打も少なければ価値は上がりにくいという考え方である。2 つ目は、運や味方の影響を排除することである。投手の 「勝ち星」 は味方の得点力にも左右されるため、個人能力とは言い切れない。そこで、三振・四球・被本塁打など、投手自身がコントロールしやすい指標を評価する手法が重視される。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_103","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"2022-2024年の中日と日本ハムの得点圏RE24からみる下位からの脱却と成績向上の要因分析","members":"中橋侑敬，齋藤裕(新潟大学)","first_author":"中橋侑敬","affiliation":"新潟大学","code":"P3-13","abstract":"中日と日本ハムの2チームを対象に、チーム別の得点期待値から正規化したRE24を用いて得点圏での選手貢献度を分析した。2024年の日本ハムの成績向上要因は、得点圏で打点を記録する能力の向上にあることを明らかにし、成績下位チームの施策課題を提示した。","methods":["可視化","指標開発"],"themes":["選手評価","得点予測","勝敗要因"],"data":["公式成績データ"],"free_tags":["RE24"],"awards":[],"text_insufficient":false,"excerpt":"中日ドラゴンズ(以後中日)と北海道日本ハムファイターズ(以後日本ハム)は、2022年と 2023年の2シーズンで両チームとも 2年連続リーグ最下位だったが、翌 2024 年シーズンでは、それぞれリーグ最下位とリーグ 2位といった対照的な成績であった(表1)。この 2 チームの得点に関する指標を比較することで、単なる勝ちの要因ではなく、成績下位のチームが上位になるための要因を模索する。得点に関するセイバーメトリクスの一つとして、選手ごとの得点への貢献度を数値化して攻撃時の選手の能力を表す RE24 がある1)。RE24 の算出にはリーグ全体で共通の得点期待値を用いる。そのため、RE24はリーグ全体における選手の貢献度を比較することに適している。しかし、 「成績」が結果であることから明らかなこととして、上位成績チームの選手は RE24が高く、成績下位チームの選手は RE24が低く産出される傾向が現れる(表6)。つまり、結果である成績のリークによって、チーム間の比較がしにくいという欠点がある。そこで、リーグ全体の得点期待値ではなく、チームごとの得点期待値を用いて正規化しチームの特徴をとらえた新たな RE24を提案し、選手の貢献度からチームの特徴を捉え、チーム間の比較を行う。また、走者が 2塁もしくは 3塁にいる「得点圏」と呼ばれる状況において得点期待値が高くなる傾向がみられる。得点圏のみを抽出して分析し、いわゆるチャンスや上振れに対するチームの特徴を捉える。本研究では、中日と日本ハムの 2 チームについて、チームごと年ごとで算出した得点圏での RE24からチームの特徴とその変化を観察し、成績下位チームから成績上位に飛躍するための要因を明らかにする。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_3","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"バントと右方向打球の得点期待値・配球傾向","members":"森田誠純，天久昂，佐藤浩志(明星大学)","first_author":"森田誠純","affiliation":"明星大学","code":"P4-01","abstract":"2022～2024年のプロ野球データから、バントと右方向打球の得点期待値と得点確率を比較分析した。二塁での状況では右方向打球が最も高い得点期待値を示し、バントは特定場面での有限な有効性を持つことを明らかにした。","methods":["統計的検定","可視化","指標開発"],"themes":["戦術分析","得点予測","打撃"],"data":["イベントデータ"],"free_tags":["RE"],"awards":[],"text_insufficient":false,"excerpt":"近年のプロ野球では、得点効率向上の観点からバント(犠打)の有効性が議論されている[1][2]。一方で、右方向への打球(以下、右方向打球)による進塁戦術も、走者を大きく進める手段として重要視されている。本研究では、バントと右方向打球の2 つの進塁戦術に着目し、得点期待値および1 点以上を獲得できる確率(得点確率)に加え、配球傾向の比較分析を行った。塁状況およびアウトカウント別に、全打席・バント・右方向打球の3 戦術について得点指標を算出し、さらに球種割合やコース分布、バント成功率などの配球傾向を可視化することで、各戦術の特徴を多角的に検討した。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_11","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"SHAP 分析による捕手の配球決定要因の可視化 ―出場機会の差に基づく比較―","members":"河村一輝，渡邊真治(大阪公立大学)","first_author":"河村一輝","affiliation":"大阪公立大学","code":"P4-02","abstract":"ランダムフォレストとSHAP分析を用いて、捕手5名の配球決定要因を可視化した。出場機会が多い正捕手はボールカウントを重視し、投球間隔が長い場面で変化球を要求する傾向が見られた。","methods":["機械学習","SHAP・説明可能AI"],"themes":["捕手・バッテリー","戦術分析"],"data":["イベントデータ"],"free_tags":["SHAP"],"awards":[],"text_insufficient":false,"excerpt":"野球における捕手は,試合状況の把握,投手のリード,打者の分析,試合全体の進行など多くの役割を担っている.特に配球は,投球結果やゲーム展開に影響を及ぼす極めて重要な要素であるが,監督やコーチの方針,投手・打者の調子など多くの要因が影響するため,客観的に捉えることが難しい.そのため,捕手の能力を指標化して評価することは非常に困難である.このような背景から,配球という観点で捕手の特徴を可視化する試みが行われている. 石橋らの研究[1]では,主要な5人の捕手の配球データを統計的に分析することで,捕手ごとの傾向や特徴を可視化できる可能性があると示されている.つまり,捕手がどの要因を重視した配球かを明らかにすることができる. しかし,この研究では「主要捕手」という限られた対象に焦点を当てており,出場機会の違いによって配球決定に差が生じるのかについては検討されていない.プロ野球では,守備面で高く評価され出場機会が多い捕手と出場機会が限られる捕手が存在する.出場機会が多い捕手が出場機会の少ない捕手と比べて配球決定においてどの特徴量を重視しているのかに違いがあるのか,これまで十分に検討されていない.これを可視化することは捕手の配球決定を理解するのにより効果的であると考える.そこで本研究では,チームの中で守備面で評価されスタメンで起用され続けている正捕手は,他の捕手と比較してどのような特徴を重視して配球を組み立てているかを検証する.","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_25","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"QAB とその連続性が得点確率に与える影響の考察","members":"豊島康平，鈴木秀男(慶應義塾大学)","first_author":"豊島康平","affiliation":"慶應義塾大学","code":"P4-03","abstract":"XGBoostを用いて、慶応大学の独自指標QAB（Quality At-Bat）と得点確率AUCの関係を分析した。QABの連続性が得点機会の累積に強く関与し、攻撃の「質」と「つながり」が得点創出を左右することを明らかにした。","methods":["機械学習","勾配ブースティング","指標開発"],"themes":["打撃","試合の流れ","得点予測"],"data":["イベントデータ"],"free_tags":["QAB"],"awards":[],"text_insufficient":false,"excerpt":"近年の野球は投高打低の傾向が顕著であり、 1 点を奪うことの難易度と価値は年々高まっている。 [7] 長打や一発に頼らず、いかに打線全体として機能し、粘りやつなぎによって得点機会を創出するかが、勝敗を左右する鍵となっている。このような現代野球の潮流の中で、慶應義塾大学硬式野球部が独自に導入している 「Quality At-Bat (QAB) 」は、単なる結果指標ではなく打席の質と連続性を評価する革新的な概念である。[2]QAB は、 安打、 四死球、 犠打、 犠飛、 進塁打、 強打 (A 打球)、 そして8 球以上の粘りを評価対象とし、打線のつながりやチームとしての攻撃力を定量的に把握することを目的としている。この QAB は、1 点をもぎ取るためのプロセスを重視する現代野球に適合した指標といえる。一方、セイバーメトリクスには打率・ OPS・wOBA といった「個々の打者の結果」を評価する指標が多く存在するが、打線全体の機能性を捉える指標はほとんど整備されていない。この点で、 QAB は攻撃のプロセスや連続性といった “つながり” を評価できる点に独自の価値がある。[1]本研究では、この QAB が実際に得点確率の上昇にどの程度寄与するかを明らかにすることを目的とする。具体的には、QAB 関連の特徴量を説明変数とし、実際の打席結果と各打席が三振に終わる反実仮想イニングとの比較から得られる得点確率 AUC を目的変数としてモデル化した。これにより、打線の質的要素が得点創出にどのように寄与するかを定量的に示すことを目指す。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_40","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"捕球位置の偏差に基づく投球戦略の分析","members":"大内遥那，小串典子(明治学院大学)","first_author":"大内遥那","affiliation":"明治学院大学","code":"P4-04","abstract":"捕手が構えた位置と実際の捕球位置の差（捕球偏差）に着目し、得点期待値と合わせて解析することで、バッテリーの投球傾向を明らかにした。日本プロ野球2022-2024年シーズンの全2,632試合761,489球を対象に、リード位置別・捕球偏差方向別の投球結果を可視化し、制球力と戦術意図の分離を実現した。","methods":["可視化","統計的検定"],"themes":["投球・配球","捕手・バッテリー","戦術分析"],"data":["イベントデータ"],"free_tags":["RE（得点期待値）","捕球偏差"],"awards":[],"text_insufficient":false,"excerpt":"野球において投球は攻防の中心であり、投手の制球力や投球内容は試合の展開を大きく左右する。試合前には打者の特性や試合状況に基づいてコースや球種を選択する「配球」が組み立てられる。一方で、試合中には投手の調子や打者の反応に応じて捕手が球種・コースを判断する「リード」が行われる。こうした事前の戦略と試合中の判断が組み合わさることで、最終的な投球コースが決定される。そこで本研究では、捕手が構えた位置と実際に捕球した位置の差、すなわち捕球位置の偏差−→∆r に着目する。−→∆rが大きな投球は、単なる制球ミスによるものに限らず、釣り球や見せ球といった意図的な投球を含む可能性がある。本稿では、捕球偏差と得点期待値を合わせて解析することで、単なる制球ミスでは無いバッテリーの投球傾向と投球結果を、捕球偏差を軸に読み取ることを目指す。","excerpt_src":"はじめに"},{"id":"2025_chikoku_baseball_1_imai","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"成績・配球スタイル・制球を統合したバッテリー相性評価指標の提案と阪神タイガースにおけるクラスタリング分析","members":"今井杏奈，矢可部寛太，友枝明保(関西大学)","first_author":"今井杏奈","affiliation":"関西大学","code":"P4-05","abstract":"阪神タイガースの2022年から2024年のデータを対象に、成績・配球スタイル・制球から総合相性スコアを定義し、K-means法によるクラスタリング分析を実施した。バッテリーを「好相性型」「相性不良型」「高効率型」「平均型」の4タイプに分類し、総合相性スコアと被打率の相関を確認することで、指標としての一貫性を検証した。","methods":["クラスタリング","指標開発","統計的検定"],"themes":["捕手・バッテリー","選手評価","チーム評価"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球において「バッテリーの相性」はしばしば議論されるが,多くの場合は印象論にとどまり,その実態がどの程度成績に影響しているかを定量的に示した研究は限られている.例えば[1] では,投手の制球力と捕手ごとの違いを明らかにしている.特に捕手によって制球の乱れ方が異なる点や,球種別,季節別でズレ方に傾向が存在する点は,バッテリー間に明確な差があることを示している.しかし,制球に限定した相性に着目しており被打率といった成績系の指標などには着目していない.そこで本研究では,阪神タイガースの2022 年から2024 年シーズンのデータを対象として, 1. 投手,捕手,年度ごとにバッテリーに「総合相性スコア」を定義し数値化する. 2. 1 で求めたスコアと実際の成績を比較することで,どのような傾向があるのか分析する. 3. バッテリーのタイプを,後述するresult score や, style score,その他の特徴量を用いてクラスタリングを行い,得られたクラスタごとにどのような特徴があるのかを分析する.ことを目的とした.","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_56","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"ファーストストライクのスイングとその有効性について","members":"小田治輝，橋本幹太，戎谷智也，清水和葉，加瀬稔弥，山本義郎(東海大学)","first_author":"小田治輝","affiliation":"東海大学","code":"P4-06","abstract":"クラスタリングを用いてファーストストライク時の打者を4つのカテゴリーに分類し、スイング有効性と打撃傾向の関係を明らかにした。ツーストライク時との比較を通じて、カウント進行に応じた最適なスイング戦略が打者のタイプに依存することを示した。","methods":["クラスタリング","可視化"],"themes":["打撃","選手評価","戦術分析"],"data":["イベントデータ"],"free_tags":["ファーストストライク"],"awards":[],"text_insufficient":false,"excerpt":"野球観戦をしていると,「初球から狙っていけ」という言葉を耳にすることが多い.しかし実際に初球を打って凡退したり,フライや併殺打になると「なぜ初球から打ったのか」といった批判が聞かれる.一方で,初球を見逃すと「なぜ打たないのか」という不満も出る.このように,初球を打つかどうかの判断は賛否が分かれやすいテーマであり,打者のアプローチを象徴する要素の一つである.また,初球に限らず,打席内で最初にストライクを取られたタイミング,すなわちファーストストライクに対してスイングするべきか否かという問題も,打者のタイプや戦術によって異なると考えられる.打者が早いカウント(0-0,0-1 など)で積極的にスイングするか,あるいは見極めてから勝負するかは,試合の流れを左右する重要な判断である.近年では,フルカウント時やツーストライク時の打撃傾向を分析した研究(酒折他 2023)など,カウントに注目した研究が行われているが,初球やファーストストライクのような“早いカウント”に焦点を当てた研究は多く存在しない.そこで本研究では,プロ野球の試合データを用いて,ファーストストライクにおける打者の傾向を分析し,さらにクラスタリング手法を用いて,ファーストストライクの有効性を明らかにし,各クラスターの特徴を調べる.","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_59","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"2023年に18年ぶりのリーグ優勝を果たした阪神タイガースは何が変わったのか?","members":"山田耕太郎(阿南工業高等専門学校創造技術工学科（一般教養）)，一ノ瀬元喜(静岡大学)","first_author":"山田耕太郎","affiliation":"阿南工業高等専門学校創造技術工学科（一般教養）","code":"P4-07","abstract":"阪神タイガースの2022-2024年3シーズン成績を比較分析し、2023年優勝達成の打撃面での変化を明らかにした。2023年は四球増加と見逃し率向上が特徴で、特に初球からのじっくりした対応とボール球の見極めが徹底されたことが優勝につながったことを示した。","methods":["統計的検定"],"themes":["チーム評価","勝敗要因","戦術分析"],"data":["公式成績データ"],"free_tags":["四球","見逃し率"],"awards":[],"text_insufficient":false,"excerpt":"阪神タイガースの2022 年から2024 年の成績は, 2022 年セ・リーグ3 位2023 年セ・リーグ優勝,日本一2024 年セ・リーグ2 位であった。この3 年間の中で特に大きな変化が生まれたのが2023 年の岡田彰布監督就任である。そして,その2023年に18 年ぶりのリーグ優勝,38 年ぶりの日本一に輝くこととなった。このとき,大きく変わった点として,四球の増加が挙げられていた[1]。この点に関しては,岡田監督が球団にお願いし,四球の年棒査定ポイントを上げてもらったという報道も出ていたくらいである[2]。表1 にはシーズンごとのチーム成績の一部を示しているが,実際に2022年から2023 年にかけて四球の数が約140 個増え,1.4 倍近くになっていることが見てとれる。また,実は2022 年から2023 年にかけて三振の数が増えており,逆に2023 年から2024 年にかけては減っている。このあたりはチームの成績と逆になっている印象もある。この点も興味深い点の1 つである。そこで,今回の発表では上記の内容も含めて2022 年から2023 年にかけて岡田監督が就任したことで何が変わっていったのかという点を中心に,データから紐解いていきたい。表1シーズンごとのチーム成績(打撃面)。カッコ内の数字はセ・リーグ内(6 チーム中)の順位。なお,三振は少ない方が上位としている。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_66","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"投球間隔が投手の成績指標に与える影響","members":"堀昂太郎，和田智仁，今泉拓(鹿屋体育大学)","first_author":"堀昂太郎","affiliation":"鹿屋体育大学","code":"P4-08","abstract":"投球時刻から絶対的投球間隔（API）と相対的投球間隔（RPI）を算出し、奪空振り率・被長打率・被打率への影響を分析した。APIが長いほど投手有利になることを示し、従来の投球間隔短縮による打者困惑戦略の有効性を統計的に検証した。","methods":["統計的検定","指標開発"],"themes":["投球・配球","投手起用","戦術分析"],"data":["イベントデータ"],"free_tags":["API","RPI"],"awards":["ポスター部門 奨励賞"],"text_insufficient":false,"excerpt":"野球とは間のスポーツである。この間の取り方は、戦術的にも心理的にも重要な要素とされている。例えば、バッテリーは、サイン交換で意図的に首を振るしぐさを増やすことで打者に思考を促す例が知られている[1]。中でも、投手は投球と投球の間隔以下、、 投球間隔と呼ぶ)を調整することで、間を戦術的に操作することが可能である。阪神タイガースなどで活躍した能見篤史投手はこの投球間隔を意図的に操作することで、打者を翻弄したというエピソードが知られている[2]。このエピソードからは、投球間隔が投手の成績に影響を与える可能性が推察される。しかし、投球間隔を算出できるデータセットは非常に限られており、投球間隔が投手の成績に与える影響を検討した文献はほとんど存在しない。そこで本研究では、本コンペティションのデータセットが投球間隔を算出可能であることに着目し、この影響について検討する。本コンペティションのデータセットには、投球されたボールが捕手のミットもしくは打者のバットに触れた瞬間の時刻以下、、play_time とする)が記録されている。本研究では、この play_time を基に 2 種類の投球間隔を算出する。1 つは連続する 2 球の play_timeの差分から求めるもので、これを絶対的投球間隔以 Absolute Pitch Interval: API)とする。2 点目は、 ある投球の API と 1 球前の API の差分を求めたもので、 相対的投球間隔以Relative Pitch Interval: RPI)とする。API は、投手固有の投球間隔の特徴を示し、RPI は投球ごとの投球間隔の変化を表す指標である。本研究では、API や RPI と投手の成績の関連を調査するが、これらを直接扱った先行研究がないため、著者の経験1に基づいて仮説を設定する。著者はこれまで API やRPI の違いが打者としての感覚に大きな影響を与える場1 著者は中学から大学まで主に打者として野球競技を行った。大学時面を多く経験してきた。例えば、API が極端に短い投手のストレートに対しては、準備時間が不足し、タイミングが合わせづらいために空振りすることが多かった。一方で、RPI が長い投手の場合は、球種やコースについて考えすぎてしまいミスショットを誘発しやすかった。このような経験から、下、の 2 つの仮説を設定した。1 つ目は、API は短い投球では、奪空振り率が上がる。2つ目は、RPI が長い投球は打者の思考を揺さぶり、被長打率や被打率を低、させるという仮説である。この仮説について、API と RPI を時間の長短に基づく群に分け、それぞれの群における投手の成績指標以奪空振り率・被長打率・被打率)を算出する。 これによりAPIおよび RPI が投手の成績指標に与える影響を検討する。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_70","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"相手投手タイプ別最適打順の分析：横浜DeNAベイスターズの事例","members":"毛塚遼，赤尾直大，田中響，福冨天斗，佐々木涼華，新谷幸弘(千葉工業大学)","first_author":"毛塚遼","affiliation":"千葉工業大学","code":"P4-09","abstract":"横浜DeNAベイスターズを対象に、投手を球速・制球・変化球割合で分類した3タイプ別に最適打順を探索した。ベイズ平滑化により打撃確率を推定し、遺伝的アルゴリズムとシミュレーションで得点期待値を最大化する打順を求めた結果、相手投手タイプに応じて打線の中位を大きく変えることで期待値を高められることを明らかにした。","methods":["ベイズ統計","機械学習","シミュレーション","最適化"],"themes":["打順・采配","打撃","選手評価","得点予測"],"data":["公式成績データ"],"free_tags":["遺伝的アルゴリズム"],"awards":[],"text_insufficient":false,"excerpt":"近年の日本プロ野球(以下,NPB)では、投手の技術向上や平均球速の増加,継投の細分化といった戦術面の進化により、投手有利(投高打低)の傾向が顕著になっている。NPB 公式統計[1]によれば、図 1 に示すとおりセントラル・リーグ(以下,セリーグ)では2018 年以降 6 年連続で 1 試合あたりの平均得点が減少傾向にある。同様に、パシフィック・リーグ (以下,パリーグ)でも 2019 年以降 5 年連続で 1 試合あたりの平均得点の減少傾向が続いている。このような状況では、限られた得点機会を効率的に創出し,それを活かすための打順戦略の重要性が一層高まっている。図 1 セ・パ両リーグにおける 1 試合平均得点の推移(2014 年から 2024 年)一方、従来の打順最適化に関する研究の多くは打者の打席結果のみを考慮しており、打者個々の能力に基づいて打順を決定しているに過ぎない。 しかし野球は、打者だけでなく相手投手の特性の影響も大きい競技であるため、相手投手のタイプに応じた最適打順を組むことが必要である。本研究では投手を球速が速い「速球派」、 制球が良い「技巧派」、変化球の投球割合が大きい「軟投派」の 3タイプに分類し、各投手のタイプに対してどのような打順が得点期待値を最大にするか検討する。具体的には、NPB 公式戦データを用いて打撃結果および盗塁結果の確率を推定し,シミュレーションと遺伝的アルゴリズムにより,相手投手タイプ別の最適打順を探索する。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_74","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"プロとアマチュアにおけるビッグイニング発生要因の比較：先頭打者への四球と単打に着目して","members":"桑原潤也，竹川耀，渡辺倫太朗，西村一真，今泉拓(鹿屋体育大学)","first_author":"桑原潤也","affiliation":"鹿屋体育大学","code":"P4-10","abstract":"NPB公式戦データと大学野球データを比較して、ビッグイニング発生のメカニズムを分析した。セイバーメトリクスの見解とは異なり、アマチュア野球では先頭打者への単打がビッグイニングを引き起こしやすく、その後の四球やエラーが連鎖的に発生することで大量得点につながることを明らかにした。","methods":["統計的検定","因果推論"],"themes":["勝敗要因","戦術分析","得点予測"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"セイバーメトリクスは、統計学的手法を用いて野球のプレーを定量的に分析する取り組みであり、近年ではメジャーリーグ以下、メジャー)や日本プロ野球以下、プロ野球)を中心に広く浸透してきた。 その発展により、「首位打者より長打率を重視すべきである」 「送りバントは得点効率を下げる」 といった従来の野球界における“常識”は再検証され、新たな戦術観が提示されている[1]。しかし、こうしたセイバーメトリクスの知見は主としてメジャーやプロ野球のデータを基盤としており、アマチュア野球に適用できるかについては慎重な検討を要する。アマチュア野球では、守備力・走塁力・投手の制球能力などに大きなばらつきが存在し、プロとは異なる競技環境が形成されているためである。実際、例えば送りバントは、プロの環境では多くの場合において得点期待値を下げるとされる一方、アマチュアのように選手間の実力差が大きい場合は、送りバントが数理統計的に合理的である可能性も指摘されている[1]。このように、プロとアマチュアでは、数理統計的な最適解が必ずしも一致しない可能性がある。1.2 四球を巡る議論の不一致野球指導の現場では、従来より「先頭打者への四球は失点やビッグイニングにつながりやすい」と考えられている。名監督して知られる野村克也氏は 「先頭打者への四球は 8 割が得点になる」と指導し[2]、星野仙一氏も先頭打者への四球に罰金を科すなど、厳しい方針を取っていたことが知られている[3]。このように、先頭打者に対する四球は危険な結果として位置づけられ、プロの実践的指導においても強く忌避されてきた。一方、セイバーメトリクスでは、メジャーおよびプロ野球のデータに基づき、先頭打者の四球は単打とほぼ同等の価値を持つとされており、失点への影響も大きく変わらないことが指摘されている[4][5]。さらに、四球が強く忌避される背景として、四球が失点につながった場面が印象に残りやすいという認知バイアスの影響を指摘する研究も存在する[6]。すなわち、先頭打者の四球を巡って、現場に根付いた指導観と統計的見解のあいだに明確な不一致が生じている。1.3 本研究の目的と仮説本研究は、アマチュア野球大学野球)の実試合データを用いて、 「先頭打者への四球はビッグイニングあるいは失点)につながりやすい」という野球指導の通念を、統計的に再検証することを目的とする。アマチュア野球では、投手の制球力のばらつきが大きく、四球が連続して発生しやすい環境が存在すると考えられる。そのため、セイバーメトリクスにおいて否定されてきた“先頭打者の四球は危険である”という指導観が、アマチュア環境ではむしろ合理的となる可能性がある。以上を踏まえ本研究では、アマチュア野球においては先頭打者への四球は単打よりも失点やビッグイニングにつながりやすいという仮説を設定する。具体的には、以下の 3 点についてプロとアマチュアのデータを算出し、両者の傾向に違いが見られるかを分析した。1 と 2 では仮説を直接検討し、3 ではさらなる分析としてビッグイニングが生まれる構造をプロとアマチュアで比較する。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_78","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"逆球と打撃結果の関連について","members":"倉田圭樹，和田智仁，今泉拓(鹿屋体育大学)","first_author":"倉田圭樹","affiliation":"鹿屋体育大学","code":"P4-11","abstract":"NPB公式戦データにおける逆球（目標と左右が逆のコース）を対象に、その特性と打撃結果への影響を検証した。カイ二乗検定により逆球と被安打・被長打の関連性は統計的に弱いことが示され、セイバーメトリクスのバッテリー意図は打撃結果に影響しないとの知見を支持する結果となった。","methods":["統計的検定"],"themes":["投球・配球","選手評価"],"data":["イベントデータ"],"free_tags":["逆球"],"awards":[],"text_insufficient":false,"excerpt":"野球において、投手は投球開始前に投球する球種とコースをあらかじめ決めて投球する。通常、球種とコースは捕手と共有され、投手は捕手の構えたミットを目標に投球する。しかし、プロの投手であっても捕手の構えた目標に投球できないことは少なくない。捕手が打者のアウトコースに構えたときに逆のインコースに投球してしまうなど、目標に対して左右が逆のコースへの投じられた球は「逆球」と表現される。投手の制球を評価する研究はこれまでに行われているが、投手が目標通りに投げられた投球に着目した研究が多く[1] [2]、 逆球のように目標通りに投げられない投球に対する研究はみあたらない。逆球は失投(目標通りでない投球)の一種であることから、打たれやすい投球と考えられることも多い。しかし、セイバーメトリクスの議論において投球の目標に関与する捕手のリードを定量化することは難しいとされる[3]。このことは捕手のリードの価値が低いことを示唆しており、また投手及び捕手のバッテリーの投球意図が打撃結果に影響しにくいことを示唆しているともいえる。これまで逆球を判別できるデータセットが提供されることはなく、逆球が打撃結果や投手成績に与える影響を検討した文献もほとんど存在しない。 そこで本研究では、本コンペティションのデータセットが逆球を判別可能であることに着目し、逆球に関する基礎的な統計データを算出し、逆球の特徴を提示すること、 また、逆球と被打、被長打との関連を検証することによって逆球が打撃結果や投手成績に与える影響を調査し、逆球の統計的な評価の価値を検討することとした。これらを通じて、逆球は打たれやすいとする俗説とセイバーメトリクスでのバッテリーの投球意図は打撃結果に影響しないという知見のどちらが支持されるのかを明らかにする。本研究は以下の流れで分析を行う。1. 逆球の投球数や割合など、基礎的な統計データを算出する。","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_101","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"試合状況に応じた球種予測モデルの作成","members":"宮迫駿斗，長谷川開，中野雅大，浅田浩一，渥美隼人(工学部　情報工学科)，山本知仁(金沢工業大学)","first_author":"宮迫駿斗","affiliation":"工学部　情報工学科","code":"P4-12","abstract":"NPBのプレーデータを用いて、CatBoostを用いた配球予測モデルを構築した。ベイズ平滑化と移動平均により特徴量を高度に処理し、時系列データのリークを厳密に排除した条件下で44.9%の正解率を達成し、配球決定における投打の利き手マッチアップが最大の決定要因であることを定量化した。","methods":["機械学習","勾配ブースティング","ベイズ統計"],"themes":["投球・配球","戦術分析"],"data":["イベントデータ"],"free_tags":["CatBoost"],"awards":[],"text_insufficient":false,"excerpt":"現代の野球において,データの活用はチームの勝敗を分ける決定的な要因となっている.特に配球の分析は,バッテリーの意思決定を理解し,打者が狙い球を絞る上で極めて重要である.実際の試合における一球は,イニング,点差,走者状況,打者の直近の調子,投手の疲労度,そして個々の選手が持つ固有の癖など,多次元的な要因が複雑に絡み合った結果として選択される.これらを統合的に扱い,次に投じられる球種を高精度に予測することは,野球の統計分析における主要な課題の一つである.本研究では,日本プロ野球の直近 3 シーズンにおける投球データを用い,試合の文脈と選手個人の特性を考慮した次投球予測モデルの構築を目的とした.本プロジェクトにおいて我々は,複雑な試合状況下において投手の配球はどの程度一般的な戦術に従い,どの程度個人の癖に依存するのかを定量化すること,そして時系列的な検証を通して実戦で運用する予測精度を担保できるかを検証することの二点を核心的な問いとして設定した.特に本稿では,データリークを厳密に排除した現実的な予測環境下において,機械学習モデルがどのような挙動を示すかに焦点を当てて報告する.","excerpt_src":"研究背景と目的"},{"id":"2025_baseballa_1_115","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"WPAとプレイによる野球の「流れ」のモデルの実装と戦評による評価","members":"安田悠矢，渡邊紀文(武蔵野大学)","first_author":"安田悠矢","affiliation":"武蔵野大学","code":"P4-13","abstract":"WPA（勝率変化量）とロジスティック回帰から得た流れモデル係数を統合して、試合状況を考慮した流れの定量化指標FlowWPAを提案した。2566試合のデータから構築し、戦評との整合性検証により、プレイの試合趨勢への寄与度を適切に評価できることを示した。","methods":["ロジスティック回帰","指標開発"],"themes":["試合の流れ","戦術分析","勝敗要因"],"data":["イベントデータ"],"free_tags":["WPA","FlowWPA"],"awards":[],"text_insufficient":false,"excerpt":"多くのスポーツにおいて, 「流れ」は試合を大きく左右する重要な要素である.「流れ」はさまざま定義づけをされているが,本研究では犬飼の流れの定義[1]から「試合中によって引き起こされる対戦者同士の実力以外での試合状況の優劣を表現した概念」と定義する.特に野球においては,一回の「流れ」の変動によって試合の勝敗が完全に決まることもある.このような「流れ」の変動の分析は,試合を決定づける状況となった場合に,新たな流れを生み出すための適切な戦術的判断や,勝利確率の向上に貢献できると考える. 本研究では,試合状況の変化とプレイから新たな「流れ」の定量化を行う.WPA(Win Probability Added)[2]とプレイによる「流れ」のモデルでのロジスティック回帰係数[3]を統合し,試合状況という文脈を考慮したプレイによる「流れ」のモデルを提案する.更に試合の戦評のデータを用いてモデルの精度を評価する.","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_17","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"日本プロ野球における役割の多様性を考慮したリリーフ投手の評価指標の提案","members":"吉田海翔，岩松歩武，寒水孝司(東京理科大学)","first_author":"吉田海翔","affiliation":"東京理科大学","code":"[口頭]野球1","abstract":"リリーフ投手の貢献を「貢献量」「貢献質」「貢献度」の3側面から定量化し、市場価値との関係から統合した総合評価指標を提案した。セーブやホールドの単純な記録では評価しきれない多様な役割を適切に評価できる指標を実現した。","methods":["指標開発","統計的検定","回帰分析"],"themes":["選手評価","投手起用"],"data":["イベントデータ"],"free_tags":["WPA"],"awards":["野球部門 奨励賞"],"text_insufficient":false,"excerpt":"現代の日本プロ野球において,試合の勝敗に与える影響は,先発投手だけでなくリリーフ投手も非常に大きい.リリーフ投手はリード時,ビハインド時,あるいは同点の重要な局面など,同一の投手であってもその起用場面は多岐にわたる.一方で,彼らへの評価は特定の指標が重視される傾向にある.事実,現在リリーフ投手に与えられるタイトルである「最優秀中継ぎ投手」と「最多セーブ投手」は,「ホールドポイント」数と「セーブ」数を基に決定されている.この偏重を是正するためには,多様な貢献の形態を持つリリーフ投手を適切に評価するための指標整備が急務である.「セーブ」や「ホールド」は,特定の試合状況[1][2] のみを評価対象としており,その貢献の難易度までは区別していない.例えば,「3 点リード・走者なし」で得た「1 ホールド」と,「1 点リード・無死満塁」のピンチを抑えて得た「1 ホールド」は,記録上は等価として扱われる.その結果,難易度の高い局面での貢献が過小評価される可能性がある.さらに,「セーブ」や「ホールド」の条件を満たす場面での登板機会が少ない投手の貢献は,これらの指標では定量的に捉えることが困難である.したがって,多様な貢献の形態を持つリリーフ投手の勝利に対する貢献を測る上で,「セーブ」や「ホールド」を総合指標としてそのまま用いることは十分でない.リリーフ投手に求められる多様な貢献をそれぞれ評価できるような評価指標が必要である.そこで本研究では,リリーフ投手の貢献を多角的に評価するため,「貢献量」「貢献質」「貢献度」という3 つの異なる側面から定量化を行い,これらを市場価値の観点から統合した総合評価指標を提案する.","excerpt_src":"はじめに"},{"id":"2025_chikoku_baseball_4_seki","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"高空間解像度の投球価値評価指標xRVの構築と分析","members":"関匠吾，林真寛，高橋慎汰，渡邊崚馬，安澤隼人(東北大学)","first_author":"関匠吾","affiliation":"東北大学","code":"[口頭]野球2","abstract":"XGBoostを用いた確率木モデルにより、投球座標とカウント、走者状況から各投球の期待得点価値xRVを推定する指標を構築した。状況に応じた投球価値の連続的な変化を可視化し、従来の離散的な集計では実現できなかった高空間解像度での配球評価を実現した。","methods":["機械学習","勾配ブースティング","指標開発"],"themes":["投球・配球","選手評価","戦術分析"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["xRV"],"awards":["野球部門 入賞"],"text_insufficient":false,"excerpt":"野球における投球の価値は、ボールが通過した物理的な座標だけで決まるものではない。同じ外角低めの直球であっても、カウントが0-0 なのか3-0 なのか、あるいは走者が塁上にいるか否かによって、その一球がどのようなリスクとリターンをもたらすかは劇的に変化する。したがって、真に有用な配球分析を行うためには、これらの複雑なコンテキストと投球位置情報を同時に考慮する必要がある。しかし、Attack Zone[1] のような、従来一般的であったストライクゾーンを分割して集計するグリッド分析のような統計的アプローチには、限界が存在する。分析の解像度を高めようと座標を細分化し、さらにカウントや打者の左右といった条件を掛け合わせていくと、各区画に含まれるサンプルサイズが指数関数的に減少してしまうからである。結果として、特定の状況下におけるピンポイントな投球位置の価値を、過去の平均値のみから評価することは統計的に不可能に近い状態となっていた。1.2モデルベースによる解決と本研究の目的この解像度とサンプルサイズのトレードオフを打破するのが、近年MLB で提唱されたLocation+ などのモデルベースアプローチである[2]。機械学習モデルは、投球結果を離散的な点の集計としてではなく、特徴量空間における連続的な確率分布として学習する。これにより、データが十分に存在しない座標や稀な状況下であっても、周辺データや類似状況からの学習に基づき、その地点の真の得点価値を補間・汎化して推定することが可能となる。そこで本研究では、この予測モデルの枠組みをNPBデータに適用し、状況に応じた一球ごとの価値を算出する指標「xRV (Expected Run Value)」を構築する。本研究の主たる目的は、状況別xRV マップの生成である。従来の集計では描けなかった、特定のカウント・走者状況における投球価値の連続的な変化を可視化することで、その瞬間に投手がどこへ投げるべきだったかという配球の最適解を、経験則ではなく定量的な根拠に基づいて提示することを目指す。","excerpt_src":"背景"},{"id":"2025_baseballa_1_15","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"日本プロ野球における球場による影響を考慮した守備能力の推定と評価指標","members":"渡邉啓大，牧浦龍之介，寒水孝司(東京理科大学)","first_author":"渡邉啓大","affiliation":"東京理科大学","code":"[口頭]野球3","abstract":"パークファクターを導入した階層ベイズモデルで、球場特性を除去した守備能力を評価した。提案モデルは従来手法と比べ評価のばらつきを大幅に減少させ、ロバスト性の高い守備評価指標を実現した。","methods":["ベイズ統計","階層モデル","カーネル密度推定"],"themes":["選手評価","守備","ポジショニング","球場要因"],"data":["イベントデータ"],"free_tags":["SAFE"],"awards":["野球部門 特別賞 (データスタジアム賞)"],"text_insufficient":false,"excerpt":"プロ野球において,選手の能力を客観的に評価することは,球団の運営上,重要な課題である.例えば,適正な年俸査定やチームの選手補強に不可欠である.選手の起用を適切に行うには,主観だけでなく客観的な選手評価が求められる.打撃や投球に関する評価指標は,投球には防御率は奪三振率,打撃は打率や,OPS などの代表的な指標に加え,多数の指標が存在する.しかし,守備に関する評価指標は種類が少なく,発展途上である.例えば,守備の名手を選出するゴールデングラブ賞も,明確な基準が存在しないのが現状である.Ultimate ZoneRating(UZR)などの守備能力の評価指標も存在するが,プレイ数の少ない選手の評価が難しく,球場による守備難易度の違いが反映されていない.そこで本研究では,球場ごとの特性が守備に与える影響を取り除いたもとで,選手個人の守備能力を推定するモデルを提案する.具体的には,Jensen ら[1] のモデルを基に,球場ごとの守備の難易度を定量化した指標をモデルに組み込む.これにより球場による守備の難易度の違いの影響を排除したもとで選手の守備能力を推定し評価できることが期待される.さらに,移籍等でホーム球場が変わった際のパフォーマンス予測,守備の起用方針の指針として利用できると期待される.","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_8","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"投手の属性を考慮したパフォーマンス低下の要因分析","members":"飯泉匠朗，山下遥(上智大学)","first_author":"飯泉匠朗","affiliation":"上智大学","code":"[口頭]野球4","abstract":"階層ベイズモデルを用いて、リリーフ投手の疲労とパフォーマンス低下の関係を投手属性別に分析した。年齢や体格、投球スタイルにより疲労の影響が異なることを明らかにし、データ駆動型の投手運用設計に寄与する知見を提供した。","methods":["ベイズ統計","階層モデル","統計的検定"],"themes":["投手起用","怪我・コンディション","選手評価"],"data":["イベントデータ"],"free_tags":[],"awards":["野球部門 最優秀賞"],"text_insufficient":false,"excerpt":"近年, NPB (日本野球機構)に所属する球団では投手の分業化が進行しており, 先発投手が長いイニングを担うケースは減少している. これに伴い, 1 試合で複数の投手を起用する運用が標準的となっている. 実際, 1980 年代では全体で 400 を超えていた先発投手の完投数が, 2025 年での全体の完投数は 88 と大きく減少している [1]. これにより,とりわけ中継ぎ投手の登板機会は増加し, 先発投手と比べて 1 日に短いイニングで投げる代わりに, 狭い間隔で何度も登板するスタイルが定着した. こうした投手の酷使や勤続疲労による傷害やパフォーマンスの低下, 選手寿命の短縮化などが中継ぎでは特に問題となっている. 事実, 2022年から 2023 年の 2 年間で連続 50 登板をした中継ぎ 11 選手のうち, 6 名が怪我や不調などにより 2024 年での登板数を 50 登板未満に落とし(海外移籍は除く), その中には防御率が大幅に悪化した選手も複数存在する. 決まった登板周期を持たないリリーフにとっては特に, シーズンを通してパフォーマンスを維持するために出場と休養の上手なやりくりが必要となる. そのような投手運用のためには, パフォーマンス低下の要因を把握することが重要となる.これまで多くの研究者によって投手の疲労によるパフォーマンスへの影響は調査されており, Bradbury and Forman では, とりわけ累積的負荷が成績へ悪影響を与えることが示唆されている [2]. 一方で, 投球疲労が投球動作・パフォーマンス・傷害などに負の影響があることを示している研究では, 疲労による動作の変化や傷害リスク, パフォーマンス低下の表れ方などには個人差があることが繰り返し述べられており [3], 投手の疲労とパフォーマンス低下の関係には投手の個別性の考慮が必要であることが指摘される. 例えば, 年齢が高い投手の方が回復が遅く休養による効果が大きい, 直球が多い投手と変化球が多い投手では投球動作の違いが投球による疲労に影響を与えているといった可能性が指摘される. それを踏まえると Bradbury and Forman では, 投球負荷に対する影響が全投手において共通の平均効果として示されており, 投手の属性による疲労の影響の差が考慮されていないことが問題点として挙げられる.そこで本研究では,「投手の疲労・休養とパフォーマンスの関係を定量的に明らかにすること」に加えて, 投手個人の属性を考慮できるモデルとして階層ベイズモデル [4] を活用することによって, 先行研究の限界であった「投手の属性を考慮した疲労・休養の効果の違いを明らかにすること」を目的とする.","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_26","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"投手・打者の分類とカーネル密度推定による外野手最適配置決定","members":"河又杏香，鈴木秀男(慶應義塾大学)","first_author":"河又杏香","affiliation":"慶應義塾大学","code":"[口頭]野球5","abstract":"k-means法で投手と打者を分類し、カーネル密度推定で打球位置分布を推定した。差分進化法で外野手3人の最適配置を決定し、打者の特性がポジショニングに大きく影響することを明らかにした。","methods":["クラスタリング","カーネル密度推定","最適化","機械学習"],"themes":["守備","ポジショニング","戦術分析","フォーメーション"],"data":["イベントデータ"],"free_tags":[],"awards":["野球部門 入賞"],"text_insufficient":false,"excerpt":"野球において,野手の守備シフトつまりポジショニングは他の技術と同等に非常に重要な要素である.特に外野手は広い外野を 3 人で守るため,いち早く打球に到達するために重要となる.近年では,特に MLB においてデータを用いた大胆な守備シフトが敷かれるなど,データを用いたポジショニングの決定が注目されている[1].しかし,MLB をはじめとするプロの世界では多くのデータの利用できる一方,アマチュアではデータを十分に取れないことが多いため,ポジショニングの判断が難しくなる.そこで,投手と打者それぞれの特徴の組み合わせから打球位置の分布を推定できれば,選手のデータが少なくてもポジショニングを決定できるという仮説を立てた.本研究では,この仮定のもと,投手 ・ 打者を分類し,その組み合わせごとに打球位置分布を推定し,打球に到達できる確率を最大化する外野手の最適配置を求める分析を行った.この分析を通じて,投手・打者の特性が最適配置に与える影響, 現場での意思決定の方法,各組み合わせに対する最適配置の特徴と有効性について明らかにする.","excerpt_src":"はじめに"},{"id":"2025_baseballa_1_61","year":2025,"dept":"野球部門","dept_detail":"野球部門","title":"Wasserstein Auto Encoderに基づく打球方向分布の予測分析","members":"鈴木碧月，王子越，荒木由布子(東北大学)","first_author":"鈴木碧月","affiliation":"東北大学","code":"[口頭]野球6","abstract":"Wasserstein Auto Encoder（WAE）を用いて、投手・打者のマッチアップにおいて複数の投球条件下での打球方向分布を予測した。von Misesカーネル密度推定と最適輸送理論を組み合わせることで、守備シフト最適化に応用し、捕球成功率が0.75から0.90に向上することを実証した。","methods":["深層学習","ニューラルネットワーク","最適化"],"themes":["守備","戦術分析","選手評価"],"data":["トラッキングデータ"],"free_tags":["WAE","守備シフト"],"awards":["野球部門 優秀賞"],"text_insufficient":false,"excerpt":"野球における打球方向の分析は,守備シフトの最適化を通じてチームの勝利に貢献するうえで極めて重要である.打球方向は,打者の打球傾向だけでなく,投手の球種・コース・高さといった投球条件にも大きく依存する.例えば,レフト方向への打球が多い打者に対してはレフト寄りの守備シフトが有効となり,速球中心の投手に対しては打者の振り遅れを考慮した逆方向寄りの守備シフトが有効となる場合がある.このように,過去の対戦データから「特定投手vs 特定打者」における打球方向傾向を把握することは,戦略的意思決定の基盤となる.このような傾向を捉えるために打球方向を確率分布として扱うことで,方向データの偏りや広がりを表現でき,選手の特性を統計的に捉えることができる.先行研究[1] では,説明変数・目的変数ともに確率分布である回帰モデル(Wasserstein regression [2])に基づき,A(投手) vs B(打者) における球種別の打球方向分布を予測した.しかし,確率分布が属するWasserstein 空間はベクトル空間ではないため,説明変数を複数に拡張できないという制約があった.このため,球種以外のコースや高さ,ランナー状況など,現実の打球方向に影響する複数の要因を同時に扱えない点が課題であった.そこで本研究では,この問題を解決するためWasserstein Auto Encoder(WAE)[3] を導入し,確率分布を潜在空間へ写像することで,ベクトル空間における多変量回帰へと問題を変換する.これにより,説明変数が確率分布で構成される場合でも,説明変数を複数に拡張して分析することができる.本研究の目的は,この枠組みにより,A(投手) vs B(打者) における球種・コース・高さ・ランナー有無といった複数の投球条件の影響を同時に考慮した打球方向分布の高精度な予測を実現し,その予測分布に基づく守備シフトの最適化を行う.本稿では,まず2 節でWasserstein Auto Encoder について,3 節で打球方向データによる分布の定義について理論を踏まえた説明を行う.次に,4 節で実際に適用したデータ分析の結果について説明し,5 節で分析結果を利用した守備シフトの最適化について提案を行う.そして最後に,6 節でまとめを述べる.","excerpt_src":"研究背景と目的"},{"id":"2024_espoa_1_60","year":2024,"dept":"eスポーツ部門","dept_detail":"eスポーツ部門","title":"ぷよぷよにおけるGTRの有用性","members":"石内柾翔，安藤雅和(千葉工業大学)","first_author":"石内柾翔","affiliation":"千葉工業大学","code":"P1-19","abstract":"ぷよぷよチャンピオンシップのSEASON1からSEASON5および2024年の試合から、GTR土台使用試合の勝率を分析した。GTRと他の土台の対戦では54%の勝率を示し、トップレイヤーの多くがこの土台を使用している。GTRの派生形による勝率差があり、選手ごとの特色が現れていることが示唆された。","methods":["統計的検定","指標開発"],"themes":["戦術分析","選手評価"],"data":["映像データ"],"free_tags":["GTR","土台"],"awards":[],"text_insufficient":false,"excerpt":"esports(エレクトロニック ・ スポーツ)はコンピュータゲーム、ビデオゲームを用いた対戦をスポーツ競技とするものであり,2022 年アジア大会の正式種目として採用され,国際オリンピック委員会もイベントの主催を始めるなど,世界中で注目されている. esports のジャンルとしては「スマブラ」など対戦型格闘系や 「マリオカート」 などレーシング系があるが,ここでは,パズル系のなかでも 「ぷよぷよ」 を取り上げることにする.この 「ぷよぷよ」 は落ち物パズルゲームの代表作で,1991 年に第 1 作発売後アーケード版 ・ メガドライブ版で人気に火が付き,コンシューマーの各機種へ移植され,関連作品もたくさん登場している.2018 年より発売元であるセガ公式の大会 「ぷよぷよチャンピオンシップ」 が開催されて,現在 30 名程度のプロ選手が対戦している.ぷよぷよのゲームルールに従って対戦する中で,どのように組むのが一番効率よく点数を稼げるのか.自身もプレイヤーとして興味があるため,取り組みたいと考えた.ぷよぷよについて調べていくうちに,「GTR」という土台にたどり着いた.この GTR は中級者からプロまで幅広く使う序盤のテンプレートである.このGTR について深堀をして,なぜ多くのプレイヤーがこの形を使うのか調べていきたいと考える.","excerpt_src":"はじめに"},{"id":"2024_espoa_1_69","year":2024,"dept":"eスポーツ部門","dept_detail":"eスポーツ部門","title":"積み方を考慮した盤面の評価指標","members":"南部和希，谷下祐斗，清水海里，西条友花，矢野ひなた，山本由和(徳島文理大学)","first_author":"南部和希","affiliation":"徳島文理大学","code":"P1-20","abstract":"ぷよぷよプロ選手の盤面を動画処理により解析し、連鎖の難易度を新たに提案した。HSV色空間を用いた色判別と連鎖形状の検出により、積み方の難易度、労力、そしておじゃまぷよを考慮した連鎖の難易度を計算した。困難な状況からの切り返しを定量化する指標が開発された。","methods":["画像認識・姿勢推定","指標開発","可視化"],"themes":["戦術分析","選手評価"],"data":["映像データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年は,スポーツデータの収集と分析が盛んになっている.例えば,NBA (National Basketball Association) では,Advanced stats が公開されている.これは,センサーやカメラによるトラッキングで取得したデータの分析結果である.これにより,チームに得点力はあるがミスによって攻守の切り替わりが多い,選手が獲得した得点は少ないがアシストやリバウンドで貢献していたのような,対戦成績では分からない情報を統計的に処理できるようになったと言われている[1][2].このような対戦成績だけでは分からない情報の活用をぷよぷよで行うために,盤面に注目した.本報告では,誰もが予想しないプレーを見せて,観客を魅了するぷよぷよプロ選手は, 困難な状況からの切り返しに対応するのが得意であるという仮説を考える.この仮説を検証するために,連鎖の難易度を作成した.これは,連鎖数や連鎖時間,色数,ぷよの積み方を利用した評価指標である.連鎖の難易度は,おじゃまぷよとぷよの積み方の難しさによって,どの程度連鎖を開始するのが難しかったのかを表す.この計算のために,動画処理の結果とJSONデータを使用した.動画処理によって,ぷよの積み方を数値化した.JSON データからは,連鎖の最大色数,連鎖の火力,連鎖数を用いた.","excerpt_src":"はじめに"},{"id":"2024_espoa_1_51","year":2024,"dept":"eスポーツ部門","dept_detail":"eスポーツ部門","title":"ぷよぷよにおける戦法と強さの解析","members":"山野辺咲季，瀬尾隆(東京理科大学)","first_author":"山野辺咲季","affiliation":"東京理科大学","code":"P2-17","abstract":"ぷよぷよプロ選手44名を対象に、k-means法によるクラスタリングとBradley-Terryモデルを用いて戦法タイプを分類した。質タイプ、量タイプ、ハイブリッドタイプの3つの戦法が特定され、ハイブリッドタイプが最も高い勝率を示した。選手単位での強さ比較では、勝率の高さと推定強さが必ずしも一致しないことが明らかになった。","methods":["クラスタリング","確率モデル"],"themes":["戦術分析","選手評価","勝敗要因"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"ぷよぷよとは積み上げられたぷよを消すことが基本的なルールのパズルゲームである.消すぷよの個数,色の数,連鎖数などによって得られる得点が変わり,得点が大きければ大きいほど相手に多大なダメージを与えることができる.いかに得点を高くするかは勝敗を分ける1つの要因と言えるだろう.E-sports としてのぷよぷよは,効率よくぷよを消すための深い戦略性や1 試合5 分から15 分というスピード感など他のスポーツにはない特徴があり,とても魅力的なゲームである.","excerpt_src":"はじめに"},{"id":"2024_espoa_1_84","year":2024,"dept":"eスポーツ部門","dept_detail":"eスポーツ部門","title":"クラスター分析を用いた連鎖による攻撃スタイルの変化","members":"遠藤尊，島田悠太，西川礼人，野中優冶，宮田茉夜，安藤雅和(千葉工業大学)","first_author":"遠藤尊","affiliation":"千葉工業大学","code":"P2-18","abstract":"ぷよぷよチャンピオンシップのシーズン2から6のデータを階層クラスター分析により、プロ選手の攻撃スタイルを分類した。優勝選手は小さな連鎖で相手にお邪魔を与え、相手の連鎖を阻止する戦術を採用していた。シーズンの進行により、プロ選手の戦い方が大きな連鎖から小さな連鎖への対処へ変化している傾向が示唆された。","methods":["クラスタリング","統計的検定"],"themes":["戦術分析","勝敗要因","試合の流れ"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年 e-sports が世界的に注目されている.特に注目されるのは「オリンピック e スポーツゲームズ(Olympic Esports Games, OEG) 」開催である.2023年シンガポールで開催され,2024 年 7 月 23 日に行われた国際オリンピック委員会 (IOC) 総会にて,2025年サウジアラビアで開催されることが正式に決定した.今後,オンラインで楽しめるエンターテインメントとしてe-sports は発展していくと考えられる.日本で古くから親しまれている e-sports である「ぷよぷよ」 はSEGA 公式のプロ選手がいるほどの盛り上がりを見せている.「ぷよぷよ」 には連鎖数などの定量的なデータが存在するので,これらをクラスター分析することで,攻撃スタイルの可視化を可能にし,試合に勝つためにプロがどのように攻撃スタイルを変えているのかをとらえられるのではないかと考えた.","excerpt_src":"はじめに"},{"id":"2024_espoa_1_38","year":2024,"dept":"eスポーツ部門","dept_detail":"eスポーツ部門","title":"ぷよぷよの先制攻撃における選手の攻撃意図と可視化","members":"朝野翠，髙橋直馬，田鍋敦希，飯塚巧馬，渕智哉，伴地芳啓(早稲田大学)","first_author":"朝野翠","affiliation":"早稲田大学","code":"[口頭]eSports1","abstract":"ぷよぷよの先制攻撃について、経過時間による攻撃意図を分析した。短時間試合では先制攻撃が試合終了に直結する傾向があり、選手は2連鎖で短期決着を意図していることが示唆された。盤面のリアルタイム解析により連鎖数やおじゃまぷよ数を表示する可視化システムを提案し、初心者でも選手の意図を理解しやすくなることを示した。","methods":["可視化","画像認識・姿勢推定"],"themes":["戦術分析","試合の流れ","選手評価"],"data":["映像データ"],"free_tags":[],"awards":["eスポーツ部門 優秀賞"],"text_insufficient":false,"excerpt":"対戦型アクションパズルゲームの「ぷよぷよ」では,試合時間が短く,スピード感のある選手間の攻防が行われる.この攻防には,連鎖をするタイミングや盤面形成が重要である.その中で,1 本毎に行われる一発目の,1 本を先制する攻撃(以下:先制攻撃)が行われた時に試合の流れが大きく左右されると見受けられる.先制攻撃が成功した時,試合の早期決着を引き寄せる一方で,攻撃の成否は,選手の心理状態や集中度に大きく影響を及ぼすこととなる.「ぷよぷよ」ではこうした選手の戦術の意図を読み取ることが観戦する上で重要となってくる.しかしながら,スポーツ観戦は観戦者側に,ゲーム内容に対する,ルール理解力,技術理解力,戦術理解力といった一定の観戦能力を求め,観戦能力が初心者であればゲーム内容への有効価値が見出せないことがわかっている[1].選手は連鎖を起こすための型を考えながら盤面を形成させている[2].そして,型の形成はプレー中,意図的な連鎖数を生み出すために用いられる.本研究では,選手がどのようなタイミングで意図した連鎖数を発火させているのかを検討する.中でも最初に攻撃が行われる時の選手の意思決定を理解することがまず初めに必要なことであると考える.そこで先制攻撃時に注目して,選手の一番初めの仕掛けを分析対象とし,その後初心者でもその仕掛けの意図を把握できるように支援するシステムを構築・提案することを本研究の目的とする.","excerpt_src":"はじめに"},{"id":"2024_espoa_1_32","year":2024,"dept":"eスポーツ部門","dept_detail":"eスポーツ部門","title":"ぷよぷよeスポーツにおける催促の有効性と戦術適用条件","members":"濱中祐人，芳仲一将，宿久洋(同志社大学)","first_author":"濱中祐人","affiliation":"同志社大学","code":"[口頭]eSports2","abstract":"ぷよぷよチャンピオンシップSEASON1からSEASON5の2640試合を対象に、催促戦術の有効性を因果推論により評価した。IPW法を用いた平均処置効果の推定により、催促を行った場合の勝率が6.54%高いことを示した。Causal Treeにより、先制率が高く対戦相手との相性が良い場合に催促が特に効果的であることが明らかになった。","methods":["因果推論","ロジスティック回帰","機械学習"],"themes":["戦術分析","試合の流れ","勝敗要因"],"data":["イベントデータ"],"free_tags":["催促"],"awards":["eスポーツ部門 最優秀賞"],"text_insufficient":false,"excerpt":"ぷよぷよは, 1991 年に発売以来, 老若男女に愛され続けている国民的落ち物アクションパズルゲームである. 2018年3 月にJeSU(日本e スポーツ連合)公認タイトルとなり, プロ選手が誕生した. これによりe スポーツシーンでの盛り上がりを見せ, 現在多数の競技大会が実施されている. e スポーツ大会においてプロ選手は様々な戦術を用いているが, その中でも有名な戦術の一つに「催促」がある.催促とは, 小規模な連鎖を打って相手に対処を強いることで, 相手の連鎖構築を妨ぎ, 試合の主導権を握ることを目的とした戦術である. この戦術は, 自分に有利な状況を作り出すため, ぷよぷよe スポーツ大会においてプロ選手によって頻繁に用いられている. しかしながら, その有効性は定量的に明らかになっていない. そこで本研究では, 条件付き平均処置効果を推定することにより, さまざまな条件下における催促が選手の勝率に与える影響を明らかにする.","excerpt_src":"はじめに"},{"id":"2024_baseballinfo_1_1","year":2024,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(野球)","title":"大卒ドラ1投手、救援のセ、先発のパ","members":"安達美紀，藤井りさ，田澤実(法政大学)","first_author":"安達美紀","affiliation":"法政大学","code":"I-01","abstract":"2014年から2022年のドラフト1位指名大卒投手の1年目成績をリーグ別に比較した作品。セ・リーグは中継ぎ・抑え投手の成績が良く、パ・リーグは先発投手の成績が良いことが視覚的に表現されている。ドットプロットを用いて統計データを可視化した。","methods":["可視化"],"themes":["投手起用","投球・配球"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2024_baseballinfo_1_70","year":2024,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(野球)","title":"野球とコトバ新聞","members":"赤穂羽奈，山本もも，渡部宙，山田泰行(順天堂大学)","first_author":"赤穂羽奈","affiliation":"順天堂大学","code":"I-02","abstract":"インフォグラフィック部門の作品で野球に関する情報を新聞形式で表現した。テキスト内容から具体的な分析内容は判断できない。","methods":["可視化"],"themes":["選手評価"],"data":["公式成績データ"],"free_tags":[],"awards":["インフォグラフィック部門 最優秀賞"],"text_insufficient":true,"excerpt":"","excerpt_src":null},{"id":"2024_soccerinfo_1_44","year":2024,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(サッカー)","title":"ゴール時の選手配置と移動経路の分析","members":"深町晃大，樫山武浩(大阪経済大学)","first_author":"深町晃大","affiliation":"大阪経済大学","code":"I-03","abstract":"インフォグラフィック部門で、サッカーゴール時における選手配置と移動経路を分析した作品である。","methods":["可視化"],"themes":["ゴール期待値","ポジショニング"],"data":["映像データ"],"free_tags":[],"awards":["インフォグラフィック部門 優秀賞"],"text_insufficient":true,"excerpt":"","excerpt_src":null},{"id":"2024_soccerinfo_1_87","year":2024,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(サッカー)","title":"クラブ内diversityから観るチーム戦略","members":"井上史菜，綾部有紗，村松加奈子，川俣実憂，石塚愛美，林邦好(京都女子大学)","first_author":"井上史菜","affiliation":"京都女子大学","code":"I-04","abstract":"大学卒業出身者の割合をダイバーシティとして定義した。Jリーグチームのダイバーシティが高いほど、チーム成績が良い傾向が見られ、パス成功数と攻守切り替え数が増加することが明らかになった。特に考え方・価値観の多様性がチーム内での組織プレー実現に寄与すると考えられた。","methods":["可視化","統計的検定"],"themes":["チーム評価","パス","選手起用"],"data":["イベントデータ"],"free_tags":["ダイバーシティ","人事構成"],"awards":["インフォグラフィック部門 優秀賞"],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2024_soccerinfo_1_94","year":2024,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(サッカー)","title":"多く走ればいいというわけではない","members":"廣瀬真由子，山本由和(徳島文理大学)","first_author":"廣瀬真由子","affiliation":"徳島文理大学","code":"I-05","abstract":"Jリーグの試合データから走行距離・スプリント回数・スルーパス回数を分析した。上位チームと下位チームの比較から、スプリント回数が少ない選手のスルーパス成功がチーム成績に影響することが示唆された。選手個人のポジションや役割に応じた効率的なプレー執行が重要であることが明らかになった。","methods":["可視化","統計的検定"],"themes":["戦術分析","パス","ポジショニング"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["走行距離","スルーパス"],"awards":[],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2024_soccera_1_11","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"Jリーグにおける環境要因とパフォーマンスとの関連","members":"中川太翔，小林龍生，白井康之(大東文化大学)","first_author":"中川太翔","affiliation":"大東文化大学","code":"P3-01","abstract":"本研究は、2023年シーズンのデータを用いて、気候条件がサッカー選手のパフォーマンスに与える影響を分析した。不快指数を指標として気温と湿度を統合し、走行距離やスプリント回数との相関を調べた。分析の結果、不快指数が高い時期にチームの走行距離とスプリント回数が減少する強い負の相関が確認された。","methods":["回帰分析","指標開発"],"themes":["勝敗要因","チーム評価"],"data":["公式成績データ","外部データ併用"],"free_tags":["気候変動","相関分析","環境要因"],"awards":[],"text_insufficient":false,"excerpt":"Jリーグにおいて、2026-2027シーズンから秋春制へのシーズン移行が正式に決定され、現在の2月から12月頃までのシーズンから、8月から5月までのシーズンへと大幅に変更となる。 秋春制では、夏場の試合が減ることによる選手のパフォーマンスの向上や欧州リーグとの移籍期間の一致などのメリットが示される一方で、寒冷地に本拠地を置くチームにとっては、試合運営への影響が懸念されている。 今年も地球温暖化により、危険な暑さが長く続き、試合で飲水タイムを設ける期間の延長措置やゲリラ雷雨による試合の中止などの変化があった。試合日の天候やスタジアムなどの環境は、選手のコンディションやパフォーマンスに影響すると考え、今回は気候が選手や試合結果に与える影響について分析した。 試合を行う環境が、試合での走行距離・スプリント回数や勝敗などパフォーマンスに影響があるかどうかの分析を不快指数を用いて行った。不快指数が高ければ高いほど、全体の走行距離やスプリント回数は減るという仮説を検証し、秋春制へのシーズン移行の影響について考察することが本研究の目的である。","excerpt_src":"はじめに"},{"id":"2024_soccera_1_17","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"攻撃パターンの言語化によるチーム特徴の可視化","members":"木山輝，氏原涼太，尼崎太樹(熊本大学)","first_author":"木山輝","affiliation":"熊本大学","code":"P3-02","abstract":"本研究は、TIME-LLMをベースに、サッカーの動的データとサッカー関連単語を用いて攻撃パターンを言語化するシステムを構築した。時系列トラッキングデータをテキスト表現に変換し、大規模言語モデルの推論能力を活用してシュート予測を行いながら攻撃特徴を抽出した。システムが約69%の単語で攻撃特徴を正しく抽出できたことが確認された。","methods":["深層学習","自然言語処理","LLM活用","可視化"],"themes":["戦術分析","ポジショニング","得点予測"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["テキスト速報"],"awards":[],"text_insufficient":false,"excerpt":"スポーツ分析は,データを収集,分析し,選手やチームのパフォーマンス向上に繋げる重要な手法となっている.サッカーでは,試合中に発生したアクションや選手,ボールの位置情報を含むトラッキングデータやイベントデータが活用され,試合の状況を可視化し,戦術的な判断を支援する.近年では,機械学習を用いたデータ分析により,試合の予測や選手のパフォーマンス分析[1] が行われることが増えており,特に深層学習を活用したアプローチが注目されている.データ分析に深層学習を用いる場合,判断根拠のブラックボックス化がしばしば問題になる.これにより,予測プロセスを人間が理解できなくなり,現場へのフィードバックが困難になる.一方,スポーツデータの深層学習において判断プロセスの可視化を目的とした研究も存在する[2].この研究は入力された特徴量の重要度を可視化し,それをモデルの判断根拠としている.本研究ではモデルがその攻撃の特徴をどのように理解しているかという部分に注目する.人間が「左サイドでドリブル突破し,中央にクロスを上げた」と聞くと,その攻撃の結末をある程度推測可能である.このような特徴表現をシステムから得ることが,本研究の最終的な目的であり,これにより主観によらない攻撃ハイライトの作成や対戦チームの攻撃特徴の言語化を行うことができると考える.本研究では,この目的に取り組むためにTIME-LLM[3]というモデルをベースにしてシステム構築を行った.このモデルでは入力時系列データをその時系列データを表現する単語と関連付けることで,言語的表現に変換し予測を行っている.提案システムではこの言語表現を取り出すことで,攻撃シーンの特徴を言語化することを目標としている.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_20","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"パッキングレートにおける新しい評価方法の提案","members":"川西諒太朗(大阪府立大学)，森田裕之(大坂公立大学)","first_author":"川西諒太朗","affiliation":"大阪府立大学","code":"P3-03","abstract":"パスの質を評価する指標「パッキングレート」の改善を提案した。パスで通過した相手選手との距離に基づく重みを導入することで、従来の指標より得点やチャンス創出との相関性が向上した。2023年度J1リーグの試合データにより提案手法の有効性を検証した。","methods":["指標開発","回帰分析","統計的検定"],"themes":["パス","戦術分析","ビルドアップ"],"data":["イベントデータ","公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにはさまざまな戦術があり、その中でパスを重要視する戦術が存在する。パスにはさまざまな種類があるが、一つに相手選手間を抜けるスルーパスというパスがある。このスルーパスを重視した、1本のパスで何人の相手選手を通過することができたかを計る [1]「パッキングレート」という指標が提案されている。パッキングレートとは、パスの出し手と受け手の間にいる相手選手の数(パスで通過した相手選手の数)と、パスの受け手の体の向きが攻めるゴール方向に左右 10度以内であるか否かに応じた重みを掛け合わせたポイントで評価を行う指標である。先行研究[1]ではパッキングレートと試合結果との間に有意な相関関係は得られていなかった。そこで、パッキングレートの評価方法を改善し、試合結果やその他攻撃に関する項目との間に、より強い相関関係を得ることを示す。","excerpt_src":"はじめに"},{"id":"2024_soccera_1_27","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"アタッカー・ディフェンダーモデルに基づくサッカーのプレー評価","members":"山崎壱晟，成塚拓真(立正大学)","first_author":"山崎壱晟","affiliation":"立正大学","code":"P3-04","abstract":"ボール保持選手とマーク相手選手の相互作用を記述するAttacker-Defenderモデルをパラメータ推定法の改良により適用した。運動方程式のパラメータから各選手のドリブルおよび守備スタイルを定量化し、選手の特徴的な動きを抽出した。","methods":["シミュレーション","最適化","指標開発"],"themes":["選手評価","ドリブル","守備"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーのドリブルにおけるアタッカーとディフェンダーの相互作用を記述するモデルとして,Attacker- Defender モデル(以下,AD モデル)が提案されている[1]. AD モデルは,ボール保持選手(以下,アタッカー)と最近接相手選手(以下,ディフェンダー)の間の最低限の相互作用だけを取り入れているにも関わらず,ドリブルの場面における両選手の軌道を高精度に再現することができる.また,モデルに含まれるパラメータは物理的な意味が明確であり,解釈性にも優れている.本研究では,AD モデルのパラメータ推定の手法を改良した上でモデルをJリーグのドリブルイベントに適用し,その有効性を検証する.また,先行研究で着目されていなかったパラメータ領域の解析やディフェンダーの解析を行い,モデルのパラメータに基づく特徴的な選手の抽出,および選手のプレースタイルの定量的な評価に取り組む.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_28","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーのパス回しに対するヘルムホルツ・ホッジ分解","members":"山本健(琉球大学)，山崎義弘(早稲田大学)，成塚拓真(立正大学)","first_author":"山本健","affiliation":"琉球大学","code":"P3-05","abstract":"有向・重み付きネットワークを勾配流と循環流に分解するヘルムホルツ・ホッジ分解をパスネットワークに適用した。各選手のポテンシャル値から攻守の流れ内における位置づけを定量化し、同一ポジションの選手間の役割の違いを検出した。","methods":["ネットワーク分析","空間分析"],"themes":["パス","ポジショニング","戦術分析"],"data":["イベントデータ","トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて,パス回しはボールを効率的に運び得点機会をつくるうえで基盤となる戦術である。1 本1 本のパスを選手と選手をつなぐリンクとみなすことにより,選手をノードとするネットワーク構造が得られる。このパスネットワークは自然で単純であることから,これまでに様々な分析が試みられてきた(たとえば[1])。パスは,ボールを出した選手から受けた選手へ,ボールの動きに対応した向きをもつ。よって,パスネットワークはリンクが向きをもつ有向ネットワークである。また,パスの回数をリンクの重みとみなすことができる。したがって,パスネットワークは試合の進展に応じて時間変化する有向・重み付きネットワークである。本研究では,有向・重み付きネットワークの構造を分析する手法であるヘルムホルツ・ホッジ(Helmholtz–Hodge) 分解をサッカーのパスネットワークに適用する。Helmholtz–Hodge 分解は,経済ネットワークにおけるモノやカネの流れ[2] や神経回路網における信号の伝播[3]などの分析に利用されている。著者の知る限り,スポーツの解析にこの手法を応用するのは初めての試みである。パスネットワークに対するHelmholtz–Hodge 分解により,チーム内のボールの流れに関して各選手の位置づけを定量的に与えることを目指す。","excerpt_src":"はじめに"},{"id":"2024_soccera_1_39","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"空間評価指標を用いたパスの評価とビルドアップの有効性について","members":"与座英之，細谷拓郎，山下隆誠，山本義郎(東海大学)","first_author":"与座英之","affiliation":"東海大学","code":"P3-06","abstract":"Pitch Control指標に基づく領域支配値を導出し、ビルドアップ中のパス成功確率を予測した。提案した空間指標を用いた回帰分析によって、従来の指標よりもパスの成否をより正確に説明し、試合の流れの可視化が可能になった。","methods":["空間分析","回帰分析","機械学習"],"themes":["パス","ビルドアップ","ポジショニング","スペース評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーは,各チームが戦術を用いてゴールを目指す.サッカーの戦術は,指導者独自の考え方によって指導される.また,この戦術は各指導者の主観や勝敗によって適否が評価される.さらに,サッカーには局面が存在し, Mart ́ın-Barrero and Mart ́ınez-Cabrera [1] によると,この局面は「組織的攻撃」,「守備から攻撃への切り替え」,「守備」,「攻撃から守備への切り替え」の4 つの局面に分けて考察されることが一般的である.木下他[2] はPitch Control 指標を用いて,攻撃と守備の局面が変わるトランジションの発生時を評価し,カウンターの経路コストモデルを提案した.つまり,「攻撃から守備への切り替え」およびその逆の局面を定量化するモデルを提案した.「組織的攻撃」は,自陣から味方との短いパスを構築し相手陣内に侵入する方法である.このパスはピッチ上で戦術的空間を各選手が活用できるように味方との距離とスペースを把握し,攻める必要がある.また,Paul Power et al. [3] は,サッカーにおけるパスは成否の2 値ではなく、連続的な値で測定する必要があると提言している.つまり,空間を利用したポジショニングとパスの有効性を定量化することができれば,サッカーのビルドアップにおける戦術的評価指標をつくることができる.そこで本研究では、「組織的攻撃」の場面を抽出し,Pitch Control 指標を用いてパスの評価を定量化し,選手のポジショニングとパスの有効性から,「組織的攻撃」の評価をすることを目的とした.","excerpt_src":"研究背景と目的"},{"id":"2024_soccera_1_40","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーの有効なコーナーキック戦術","members":"仲村翼，安井清一(東京理科大学)","first_author":"仲村翼","affiliation":"東京理科大学","code":"P3-07","abstract":"コーナーキックがシュートにつながる確率に影響する要因をロジスティック回帰で分析した。ボールスイング、攻撃人数、守備人数が有意な要因であることを明らかにし、コーナーキック戦術の最適化に関する知見を提供した。","methods":["ロジスティック回帰","統計的検定"],"themes":["セットプレー","シュート","戦術分析","得点予測"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"因果関係の研究は自然科学と社会科学の双方における基本的な研究テーマである.また,スポーツにおいても戦術が効果的であるかどうかなど因果関係は重要である.スポーツは目的が明確であり,時間が決められ,ルールが定義されている点は簡単に思える.しかし,スポーツではデータが試合から収集され,非実験的な状況であるため難しい.そこで,重要なのが選手のトラッキングデータの出現である.","excerpt_src":"序論"},{"id":"2024_soccera_1_47","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"LSTMによる攻撃起点を考慮したパスの攻撃シーケンス時系列分析","members":"益留琢磨，八木翔摩，宮川大樹，福嶋克茂，市川淳，一ノ瀬元喜(静岡大学)","first_author":"益留琢磨","affiliation":"静岡大学","code":"P3-08","abstract":"J1リーグ2022年度のデータを用いて各チーム個別のLSTMモデルを構築し、攻撃シーケンス単位でシュート確率を予測した。SHAPによる特徴量分析から攻撃初期段階のパスの重要性と、サイドバック等のDF選手の攻撃関与が重要であることを明らかにした。","methods":["深層学習","時系列解析","SHAP・説明可能AI"],"themes":["パス","戦術分析","選手評価","ビルドアップ","選手起用"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーで勝利を目指すためには,自チームおよび相手チームの詳細な分析は不可欠である.近年では,分析の重要性がより一層認識され,様々な分析方法やプレーの価値を測る指標が作られてきた.相手チームの戦術や攻撃の傾向を事前に分析し対策を講じることは,相手チームの連携を崩し,自チームに有利な状況を作り出す上で重要である.従来の分析は,特定のシュートがゴールになる可能性を評価した指標であるxG(Expected Goal)をはじめとする,ゴールに直結するプレーに注目することが主流であった[2].しかし,サッカーは得点だけで決まるものではない.得点に至るまでのプレーの質が試合の勝敗を大きく左右する要因となる.そこで,VAEP(Valuing Actions by Estimating Prob- abilities)[3] やxT(Expected Threat)[1] といった指標では,シュートやゴールだけでなく,パスやドリブルなども評価し攻撃価値や守備価値などをプレーごとに定量化しチームや選手単位で比較することを可能とした.しかし,これらの既存指標では1 プレー単位で得失点を予測し評価を行っているため,シュートにたどり着く直前のプレーに価値が与えられ,攻撃を組み立てた初期段階の選手には価値が与えられにくいという課題があった.本研究では,攻撃や戦術の中核を担う「パス」に注目する.提供されたJ 1リーグのデータを基に,一連の攻撃を1 つの攻撃シーケンスと定義付けする.各チームに対して個別にLSTM モデルを用いて,シュート確率を攻撃シーケンス単位で予測し, 攻撃を組み立てた初期段階の選手にも価値が与えられる手法を提案する.この手法により,一連の攻撃全体を捉えることでチームの攻撃スタイルや連携の特徴を捉えるとともに, 攻撃に関与した全選手を公平に評価する指標を作成し, それを用いてチームや選手単位で分析を行う.これにより,サッカーの戦術や戦略の組み立てにおける新たな知見を提供し,より高度なゲーム分析の実現を目指す.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_53","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"フォーメーションの違いがポケットの使用と攻撃スタッツに与える影響","members":"横山翔輝，三田唯翔，酒折文武(中央大学)","first_author":"横山翔輝","affiliation":"中央大学","code":"P3-09","abstract":"2022年・2023年J1リーグの30-34節データを用いてt検定によってフォーメーション別の攻撃スタッツを比較した。3バックと4バックの間でパスに関して有意差が見られ、ポケット使用やポゼッション率とフォーメーションの関係性は限定的であった。","methods":["統計的検定","回帰分析"],"themes":["フォーメーション","戦術分析","ポジショニング","選手起用","試合の流れ"],"data":["公式成績データ"],"free_tags":["ハーフスペース","ポケット"],"awards":[],"text_insufficient":false,"excerpt":"サッカーの主な戦術はカウンターサッカーとポゼッションサッカーの二つに分けることができる. 数年前までは多くのチームがポゼッション率にこだわらず縦に速いカウンターサッカーをしており,バルセロナやスペイン代表のようなポゼッションサッカーをするチームは少なかった. しかし近年ではヨーロッパのクラブチームをはじめとした多くのチームがハーフスペースやポケットを使いながらポゼッションサッカーをしている. 男子日本代表もそのチームの 1 つである. ここでハーフスペースとはピッチを縦に 5 分割したときの中央と外側のレーンの間のエリアのことを指し, 近年浸透している 5 レーン理論から来ている. その中でもペナルティエリア内のハーフスペースをポケットという.(図 1)ハーフスペースやポケットの有効性に関する研究として, 上林・森 [1] はハーフスペースとポケットを使いポゼッションサッカーをするチームの先駆けであるマンチェスターシティとその他のプレミアリーグ, チャンピオンズリーグのチームとでオフェンスシブスタッツを比較し, マンチェスターシティはハーフスペースとポケットに関係するスタッツで有意になることを示した. 当時のマンチェスターシティが他のチームと違う点はポゼッション率が圧倒的に高いこと, 使用するフォーメーションが特殊なことである. 通常の 4 バックとは違い守備時は 4 バック, 攻撃時は 3バックとなる可変システムを採用している.本研究では攻撃時のフォーメーションの違いで全体のス図 1 青: ハーフスペース, 赤: ポケットタッツやポケット内スタッツに差があるのか, またフォーメーションがポゼッション率と関係があるのか検証していく. 可変システムに関してはヨーロッパの強豪チームでも採用率が高くない高度な戦術であり, 世界的に見ても採用しているチームは珍しいため今回は可変システムをどのチームも採用していないとして,通常の 3 バックと 4 バックで比較していく.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_56","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおける攻撃成功要因の分析","members":"鬼頭勇輝，荒川哲至，仲田尚生，山口光，鈴木海友，松澤智史(東京理科大学)","first_author":"鬼頭勇輝","affiliation":"東京理科大学","code":"P3-10","abstract":"90試合分のデータを用いてCatBoostで攻撃成功/失敗の予測モデルを構築し、SHAPにより特徴量の重要度を分析した。ボールの位置座標変位が最も重要であり、ポジション別頻出エリアの選手数を新たな特徴量として導入することでモデル精度を向上させた。","methods":["機械学習","勾配ブースティング","SHAP・説明可能AI","可視化"],"themes":["戦術分析","ポジショニング","選手評価","ビルドアップ"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["攻撃成功要因"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて,ゴールは非常に重要なイベントであり,ゴールを予測するアプローチは数多く試みられてきた.しかしながら,ゴールは選手個人の技量や様々な運に近い要因も絡むため,ゴール自体を予測することは非常に困難である. そこで本研究はゴールだけでなく攻撃継続中でゴールする可能性の高いシチュエーションを攻撃成功と定めたときに高精度で攻撃成功or 失敗するかの2 値の予測を行うモデルを構築する. そして,モデルの精度を高めた上で,予測モデルの判断基準を調査し,攻撃成功に大きく寄与している要因を考察する.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_63","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"Jリーグにおけるゴールキックの傾向","members":"新谷奏太，鈴木天翔，廣津信義(順天堂大学)","first_author":"新谷奏太","affiliation":"順天堂大学","code":"P3-11","abstract":"2022/23シーズン30-34節のゴールキックデータを可視化し、ショートゴールキックとロングゴールキックの相手陣内侵入成功率を比較した。ショートゴールキック後の侵入成功率がロングゴールキック後と比べて20%以上高いことが明らかになった。","methods":["可視化","統計的検定"],"themes":["ビルドアップ","戦術分析","パス","選手起用","試合の流れ"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"J リーグにおいては、2019/20 年の競技規則改正により、第 13 条および第 16 条にて、“競技者がボールを触れられるのはボールがペナルティーエリアを出てから”という要件は削除された[1]. これに伴い、ゴールキック時に味方選手がペナルティーエリア内に入ってボールを受けられるようになり、自陣ゴール付近からゴールキックを始める場面が散見されるようになった。本研究では、ゴールキックから得点を獲得する場合について、自陣ゴール付近から攻撃を組み立てるのか、 大きくボールを蹴り出すのか、 どちらの方が多いのか傾向を把握することを試みた。","excerpt_src":"研究目的"},{"id":"2024_soccera_1_65","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"リッジ順位回帰に基づく調整済みプラス・マイナス指標を用いたJリーグの選手評価","members":"秋山仁志，江頭健斗，山口光(東京理科大学)，河原弘幸(明星大学)，山田凌大，田畑耕治(東京理科大学)","first_author":"秋山仁志","affiliation":"東京理科大学","code":"P3-12","abstract":"リッジ順位回帰を用いた調整済みプラス・マイナス指標を新たに提案し、攻撃と守備の側面から選手を評価した。従来のリッジ回帰と比較して外れ値の影響を軽減し、シーズン全体を通じた選手の貢献度をより公平に評価できることを示した。","methods":["回帰分析","機械学習","指標開発"],"themes":["選手評価","チーム評価","守備","勝敗要因"],"data":["イベントデータ","公式成績データ"],"free_tags":["攻撃成功要因"],"awards":[],"text_insufficient":false,"excerpt":"サッカーをはじめとするチームスポーツにおいて,オーナーや監督,チームスタッフが勝利に欠かせない選手を特定し,選手の獲得や引き留めに関する判断をする上で,選手のパフォーマンスを適切に評価することは重要な課題である.近年,欧州のサッカー界では移籍金の高騰が顕著であり,移籍市場で多額な資金の投資をして選手を獲得する事例が増えている.しかし,獲得した選手が期待されるパフォーマンスを発揮できずにチームを去っていくケースも少なくなく,こうした移籍後の失敗例はクラブの財政や長期的な戦略に悪影響を及ぼすことになる.選手を評価するにあたって,サッカーでは伝統的にゴールやアシストなどの直接的な成果が注目されがちだが, そのような既存のスタッツは一般的に成績上位のチームに所属する選手の方が優位に表れる傾向がある.上位のチームだけでなく,下位のチームに所属する選手もフラットに評価するために,「プラス・マイナス評価」と呼ばれる評価指標が主にバスケットボールやアイスホッケーで用いられている(例えば, Sill [1], Macdonald [2], Hvattum [3] を参照).サッカーでは選手交代回数の制限などに起因して多重共線性や外れ値が発生しやすく,従来のプラス・マイナス指標(例えば,Kharrat et al. [4]) では考慮する特徴量によっては一部の選手を過大評価してしまうという問題点が挙げられる.この問題に対処するために,本研究ではリッジ順位回帰(Turkmen and Ozturk [5]) に基づいて調整されたプラス・マイナス評価指標を提案する.さらに,複数の特徴量に対するプラス・マイナス評価指標を組み合わせた評価基準を用いることで選手のパフォーマンスを多面的に分析し,選手の価値を総合的に評価することを可能にする.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_66","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"トライアドに基づくJリーグチームの戦術的特徴の比較と可視化","members":"稲田樹，江頭健斗，山口光(東京理科大学)，河原弘幸(明星大学)，山田凌大，田畑耕治(東京理科大学)","first_author":"稲田樹","affiliation":"東京理科大学","code":"P3-13","abstract":"パスネットワークにおけるトライアドセンサスの分析により各チームのプレースタイルを特徴づけた。k-means法により5つのクラスタに分類し、ポゼッションスタイルとカウンター主体スタイルの違いを明らかにした。ランダム性の検定により約半数のチームのパスネットワークが非ランダムであることを検証した。","methods":["ネットワーク分析","クラスタリング","統計的検定","可視化"],"themes":["戦術分析","チーム評価","ポジショニング","パス","トランジション"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて,戦術や戦略は勝利に不可欠な要素である.1950 年代から1960 年代にイタリアで頻繁に使用されていた堅守速攻の戦術であるカテナチオや,パスをメインに試合を展開するプレースタイルであるティキタカに代表されるように,特徴的で強力な戦術には特定の呼び名がつけられ, それらの戦術を打破するための新たな戦術が常に生み出され続けている.Lago-Pe ̃nas and Dellal [1] では,それらの戦術や戦略を評価するために,ポジショニングやボールポゼッションの分析を行っている.Palazzo et al. [2] は,「トライアド
