」と呼ばれる三つ組,すなわち,3人の選手間のパス行動に注目することでチームの戦術や戦略を特徴づけるネットワーク分析を行っている.本研究では,Palazzo et al. [2] による分析手法をJ リーグに応用し,トライアドセンサスに着目して各チームのプレースタイルの分析・比較を行う.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_81","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおける選手間距離と再帰時間の統計分析","members":"泉朝貴，上江洲伊吹，山田健太(琉球大学)","first_author":"泉朝貴","affiliation":"琉球大学","code":"P3-14","abstract":"本研究は、選手間の距離が中央値に回帰する時間を分析し、その確率密度関数が指数分布で特徴づけられることを示した。2選手間の距離データから独立性の高い再帰時間パターンを約83%の確率で検出し、選手間の相互作用特性を明らかにした。","methods":["時系列解析","統計的検定"],"themes":["ポジショニング","チーム評価"],"data":["トラッキングデータ"],"free_tags":["再帰時間解析"],"awards":[],"text_insufficient":false,"excerpt":"サッカーは常に選手が動き続けるスポーツである. その中でもゴールキーパーを除くFW, MF, DF のポジションによっても動き方が異なる. 例えば, 攻撃時にFW, MFの選手は相手陣内に攻め込むために走るが, DF の選手はボールが敵選手に取られカウンターされることをケアするために自陣に残ることが多い. 逆に, 守備時はFW の選手1人をカウンターのために敵陣近くに留める戦術もある.このように選手ごと, ポジションごとにフィールドにいる敵味方22人の動きは戦術や状況によって様々である.ピッチ上の選手は一人一人役割をもって勝利を目指して動いており, 提供していただいたビッグデータから選手の行動を分析し, 選手がどのような動きをするのか,選手同士でどのような相互作用を生み出すのかを明らかにすることを我々のチームの目標とした. 今回の分析では, 2選手間の距離という最も基本的な量の一つに着目し,再帰時間の分析をした.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_83","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"コーナーキックにおける有効なボール供給位置の提案","members":"清田哲平，柴田和葉，田崎壮太郎，橋本拓海，溝上陽斗，安藤雅和(千葉工業大学)","first_author":"清田哲平","affiliation":"千葉工業大学","code":"P3-15","abstract":"本研究は、2023年シーズン20試合のコーナーキックデータを分析し、有効なボール供給位置を特定した。コートを7つのエリアに分割し、味方が先制してボールを獲得でき周囲に敵がいない確率が高いエリア4が最適なボール供給位置であることを示した。","methods":["空間分析","指標開発"],"themes":["セットプレー","ゴール期待値"],"data":["トラッキングデータ"],"free_tags":["コーナーキック分析"],"awards":[],"text_insufficient":false,"excerpt":"サッカーは,攻めと守りが早い展開で切り替わる,流れのスポーツである. その中で, 試合の流れが完全に止まり,試合運びを大きく左右する重要な要素となるのがセットプレーである.このセットプレーには,FK(フリーキック),CK(コーナーキック),PK (ペナルティキック)の 3 種類あるが,特に CK はサッカーの醍醐味であり,CK を蹴ったチームがシュートに繋げる確率は約 35%と,得点チャンスが非常に高いプレーの 1 つである.そもそも CK とは,守備側が最後に触れたボールの全体がゴールラインを超え,得点にならなかった場合に与えられる.キッカーは,コートの隅,コーナーエリアの中にボールを置き,静止しているボールを蹴る.相手チームの選手は,ボールが蹴られてインプレー,つまり試合がピッチ内で続行されている状態になるまで,少なくとも 9.15m(10 ヤード)離れる必要がある.また,相手チームのゴールに対して直接得点をすることも可能である. 1点の価値が大きいサッカーにおいて CK は重要なプレーであり,海外チームではセットプレー専属コーチがいるほどである.キッカーは必ず狙った位置にボールを蹴っているため,CK はどこにボールを供給するのが最も得点に繋がりやすいかという疑問が生じた.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_86","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカー選手の座標データに基づくタイプ分類と相性分析","members":"日根野谷麻央，今野圭祐，木内健太，福原義久(武蔵野大学)","first_author":"日根野谷麻央","affiliation":"武蔵野大学","code":"P3-16","abstract":"本研究は、既存のスタッツデータに選手の活動エリア情報を追加してK-means法でクラスタリングを実施し、選手タイプを分類した。共起行列分析により、攻撃面ではサイド・中央を問わず仕掛ける選手とスピード型選手の相性が良いことを示した。","methods":["クラスタリング","機械学習"],"themes":["選手評価","チーム評価"],"data":["トラッキングデータ"],"free_tags":["相性分析"],"awards":[],"text_insufficient":false,"excerpt":"現在サッカーにおける選手の評価は,得点数やアシスト数といった試合中の一部の結果に大きく依存して行われている.しかし,一選手が一試合の中でボールに関与している時間は数分程度と非常に限られており,試合時間の大部分はボールを持っていない状態である.サッカーにおける選手のボールを持っていない時の動きの重要性は唱えられているが,選手の分析を行う上で活用しきれていない.そこで,ボールを持っていない時の動きを活動エリアとして既存のスタッツデータに追加することで,選手一人一人を詳細に分析することが可能になると考えた.分析を行うため,時系列のプレーデータ(選手のボールタッチを 1 レコード単位としたデータ)を基に,従来の評価指標である,得点数やアシスト数などのスタッツデータを作成した.また,トラッキングデータを使用して選手の活動エリアをスタッツデータに追加した.多くの場合は,攻撃の時と守備の時とで選手の役割が変わるため,攻撃面と守備面に分けて,それぞれで作成したスタッツデータを用いて,プレースタイルの類似性に基づく選手の非階層的クラスタリングを行った.その後,選手同士の相性を分析するために,プレーの連続性から判断する共起分析を行う.本研究では,従来の評価指標で捉えられなかった選手のボールを持っていない時の動きを既存のスタッツデータを使用し,選手同士の相性を分析をすることで,チーム編成や戦術構築に貢献することを目標とする.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_93","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおける守備組織の統計的解析","members":"礒井庸充，青山和司，湯川諭(大阪大学)","first_author":"礒井庸充","affiliation":"大阪大学","code":"P3-17","abstract":"J リーグの試合データを用いて、ディフェンダー選手間距離の頻度分布を分析し、守備組織を統計的に評価した。ガウス分布と指数分布を組み合わせることで、守備組織の特性を定量化し、長さスケールの特徴を明らかにした。","methods":["統計的検定","空間分析"],"themes":["守備","ポジショニング","フォーメーション"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近代サッカーでは、チームの戦力を最大限活かすために戦術が重要視されている。戦術は、主にフォーメーションを基盤に構成され、選手は戦術に基づいて組織的に行動することが求められている。こうした背景のもと、本研究では組織的な守備組織に注目し、ディフェンダー (DF) 選手間距離に着目して統計的解析を行った。これにより守備組織を定量的に評価し、特徴的な長さスケールを調べることを目的とした。","excerpt_src":"はじめに"},{"id":"2024_soccera_1_2","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーのトラッキングデータを利用した2選手の関係性評価","members":"中湯悠人，白石修二(福岡大学)","first_author":"中湯悠人","affiliation":"福岡大学","code":"P4-01","abstract":"本研究は、トラッキングデータを用いてサッカー選手間の関係性を定量化する評価法を開発した。ボール保持者のサポート距離における最適な範囲を決定し、オフザボール時の動きを分析することで、2選手間の関係性を数値化した。関係性の良好さを可視化することで、スターティングメンバー決定や選手交代の判断を支援できると考えられる。","methods":["ネットワーク分析","指標開発","空間分析"],"themes":["選手評価","ポジショニング","チーム評価"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"私は、選手やコーチとして10 年以上サッカーに関わってきた。その中で、チームのパフォーマンスを向上させるために必要なことが何かを考えてきた。技術的に上手い選手を揃えることもチームのパフォーマンスの向上にはつながるが、プロチーム以外では理想的な選手をチームに連れてくることは現実的に難しい。そこで、現在のチームメンバーの中でパフォーマンスを向上させるために必要なものについて考えた。そして改善できる点として選手の関係性の部分に着目した。主観的な捉え方に頼るのではなく、目や結果には見えにくい部分を評価する方法を開発することで、よりチームとしてのパフォーマンスの向上に役立てたいと考えた。サッカーは11vs11 で試合が繰り広げられ、チーム全体で戦っていくからこそ、勝利に近づいていけるスポーツであるため、選手の関係性はとても重要な要素であると考える。例えば同じ年齢の選手や同じサイドのポジションの選手とはコミュニケーションを取りやすかったり、悩みを共有できやすかったりなど良好な関係性というのは目に見える部分では主観的に考察でき、雰囲気としても感じられることもある。しかし、そういった雰囲気の関係性ではなく、11 人全体の関係性を客観的に評価したいと考えた。そこで関係性という部分を数値化して評価しデータに基づいた判断ができるようにし、関係性の良し悪しを見える化していく。以下に選手の評価法を、2 つ紹介する。(1) VAEP(Valuing Actions by Estimating Probabil- ities)[1]サッカーにおける選手やアクションの価値を数値化するための手法の1 つ。試合中のすべてのアクション(パス、シュート、タックルなど)の影響を評価することを目的としたもの。単にゴールやアシストの数だけでなく、プレイヤーが試合の進行にどれだけ貢献したかを測定することができ、特にポジションや役割が異なる選手同士を比較する際に有用である。・利用メリット1. ポジションの違いを気にしない評価フォワードやミッドフィールダー、ディフェンダーなど、役割の異なる選手同士を公平に比較できる。","excerpt_src":"背景と目的"},{"id":"2024_soccera_1_8","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるプレースタイルに基づくポジティブ・トランジションを成立させる選手位置について","members":"前川温寛，宿久洋(同志社大学)","first_author":"前川温寛","affiliation":"同志社大学","code":"P4-02","abstract":"本研究は、複数のJ1リーグチームを対象に、プレースタイルごとに異なるポジティブ・トランジション成立要因を明らかにした。クラスタリングにより4つのプレースタイルに分類し、決定木分析によって各スタイルに適した選手位置を特定した。結果から、トランジション成立の要因はプレースタイルによって異なることが示唆された。","methods":["クラスタリング","統計的検定"],"themes":["トランジション","ポジショニング","戦術分析","チーム評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["決定木分析"],"awards":[],"text_insufficient":false,"excerpt":"林(2024) では,サッカーというスポーツは攻撃,攻撃から守備の切り替え(ネガティブ・トランジション) ,守備,守備から攻撃の切り替え(ポジティブ・トランジション) の4 局面が存在することが述べられている.そして村井ら(2023) によると,サッカーの試合から新たな知見を得るためには,これらの4 局面を区分した上でボールや選手の動きを解析することが求められると示唆されている.この4 局面の内,ポジティブ・トランジションを成立させる目的は,林(2024) によると,相手守備が整わないうちにボールを前に運びゴールを奪うことだと述べられている.実際に,Sgr`o et al. (2017) により,速攻やカウンターアタックのようなポジティブ・トランジションが生じたときの攻撃は,他の攻撃スタイルよりも得点の可能性が高いことが確認されている.そのため,サッカーの試合で得点を増やすためにポジティブ・トランジションを成立させる要因を明らかにすることが有効であると考えられる.ポジティブ・トランジション成立の要因として,既にJamil (2019) やForcher et al. (2022) によって,ボール奪取の位置や守備強度が明らかにされている.さらに,村井ら(2023) ではポジティブ・トランジション成立時における選手位置に着目し,最後尾の選手の位置が攻撃局面時のトランジションを成立させる説明要因であることが示されている.しかし,村井ら(2023) では解析対象が1チームのみであり,研究結果を解析対象以外のチームに当てはめられないことが課題として挙げられる.実際のサッカーチームはチームごとにそれぞれのプレースタイルを持ち, Fernandez-Navarro et al. (2016) によると,各チームのプレースタイルは試合中の選手の位置や動きに大きく影響することが示されている.そのため,ポジティブ・トランジションを成立させる選手位置もプレースタイルによって変化すると考えらる.従って,ポジティブ・トランジションの成立要因を明らかにする際に,チームのプレースタイルを考慮する必要がある.そこで本研究では,村井ら(2023) に基づき,複数のJリーグチームを対象にし,類似したプレースタイルごとにサッカーにおけるポジティブ・トランジション成立に対して選手の位置情報が与える影響を明らかにする.ここでの類似したプレースタイルとは,J リーグ(2024) とFootballLAB (2024) を参考にして「ラインブレイクラン」や「ハイブロック」などの数値指標を基に複数のJ リーグチームに対してクラスタリングを行い,分類されたクラスターのことを指す.本研究の目的は,選手の位置データを用いて,ポジティブ・トランジションが成立する要因となる具体的な選手位置を,類似したプレースタイルごとに明らかにすることである.これにより,チームの指導者は自チームのプレースタイルに適合したポジティブ・トランジションの成立数を増加させる戦術の構築が可能となる.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_12","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーのスペース評価に基づいた守備評価指数の導入","members":"森里空，阿部真人(同志社大学)","first_author":"森里空","affiliation":"同志社大学","code":"P4-03","abstract":"本研究は、Pitch Controlを用いて組織的守備力を定量化する守備評価指標V1とV2を提案した。V1はゴールへの経路を遮る支配度を、V2はパスコースを遮る支配度を表す。重回帰分析の結果、V1が失点数に有意な影響を与えることが明らかになり、ゴール経路を制限する守備配置の重要性が示唆された。","methods":["回帰分析","統計的検定","空間分析"],"themes":["守備","ポジショニング","チーム評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーとは,1チーム11 人で構成される2チームがピッチ上を駆け回り,計90 分のうちに得点を競うスポーツである.スポーツの中でも最も人気のあるスポーツの1つであり,世界で約2 億5 千万人,日本に目を向けても83万人がプレーしている.他のスポーツと比較したときのサッカーの特徴として,ゴールキーパー以外手が使えないこと,ピッチが105 m×68 m と大きいこと,22 人という大人数が参加していることなどが挙げられる.人工知能と機械学習の急速な発展などを背景に,野球やバスケットボールなど様々な分野のスポーツにおける分析が行われるようになってきたことに対し,これらの複雑性によりサッカーの研究が遅れていたが近年になってようやく分析が始まった[1].サッカーの研究で重要視されていることの1 つに選手の配置が挙げられる.一般に人が動くスピードより,ボールが動くスピードの方が速いため,ゴールを効率的に攻める・守るためにはゴールに近いスペースをより重視して支配することが勝利に近づく.そのためスペースの支配は,勝利の鍵を握ると言える.スペースを評価する方法としてボロノイ分割や2 次元正規分布に基づいた領域分割などさまざまな方法が存在する.この方法を応用した研究は,個人・組織を対象にしたシュートやパスといった攻撃に焦点を当てるものが数多く存在するものの,90 分を通した組織の守備に着目した研究は十分に行われているとは言えない[2, 3].本研究の目的は,チームとして組織的に守備ができているかを定量化することである.サッカーの守備は,相手に得点を許さないことを目的とし,選択肢の多い自由なプレーをさせないことが相手のボールを奪うことにつながる.そのため相手に直線的にゴールに進ませず,その上でパスコースを塞ぐことができたのであれば良い守備であるという仮説が立てられる.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_14","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"センターバックによる攻撃的な配球に対する決定木を用いた傾向解析","members":"青木実日，高沖啓太郎，阿部遥真，山口敦子(東京都市大学)","first_author":"青木実日","affiliation":"東京都市大学","code":"P4-04","abstract":"本研究は、センターバックからのパスが攻撃的であるか否かを判定する要因を決定木分析で明らかにした。パス先のx座標、受け手の周囲の敵数、パス受け手の移動距離などが重要な判定要因であることが判明した。結果から、攻撃的パスは受け手が高い位置にいるか、周囲に敵がない、あるいは充分な距離を移動できるスペースへの配球が有効であることが示唆された。","methods":["ロジスティック回帰","機械学習"],"themes":["戦術分析","選手評価"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["決定木分析","配球"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいてディフェンダー,特にセンターバックは,チームの守備の要として重要な役割を果たす.そのため,センターバックのプレイにおいては,守備的なパフォーマンスが評価されがちであるが,近年,攻撃においてもセンターバックのプレイの重要性が注目されつつある[1].そこで,本研究では,センターバックの攻撃における影響についてデータを解析する.まず,そもそも,センターバックが攻撃と関係していることを示すため,ペナルティエリアに侵入できた場合のうち,センターバックからの配球を始点として,そのままペナルティエリアに侵入した場合と,他のポジションを始点として,ペナルティエリアに侵入した場合を,予備実験として,比較した.その結果,約半数(1042/2493) の場合がセンターバックを始点としていることがわかった.つまり,センターバックが攻撃の始点として有効であることがこの予備実験で分かった.そこで,センターバックがどこにいるときに,どこに配球するのが攻撃として効果的であるかをデータから解析することとした.たとえば,センターバックを起点とするパスがペナルティエリア侵入までいくことができた場合と行けなかった場合,違いがあるのか.もしあるとすると,センターバックから攻撃に移る時にどのような基準で配給するのが効果的かをデータから示す.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_18","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"時系列マルチモーダルデータを用いたサッカー攻撃予測モデル性能評価","members":"時任穣士，尼崎太樹(熊本大学)","first_author":"時任穣士","affiliation":"熊本大学","code":"P4-05","abstract":"本研究は、トラッキングデータ、イベントデータ、実況データを統合した深層学習モデルを構築し、サッカー攻撃の包括的評価を実現した。Attention機構により各モダリティの重要度を可視化し、新たな評価スコア計算式を提案した。提案スコアは得点数やゴール期待値と高い正の相関を示し、攻撃パフォーマンスの評価に有用であることが示唆された。","methods":["深層学習","ニューラルネットワーク","機械学習","時系列解析"],"themes":["得点予測","戦術分析","選手評価","チーム評価"],"data":["トラッキングデータ","イベントデータ","外部データ併用"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"データ収集技術の発達により,さまざまなスポーツにおける試合中の動きを計測し,大量のデータを蓄積することが可能になった.スポーツ分野においては,試合における選手のパフォーマンスに関するデータの収集や分析が進んでいる.サッカーにおける主要なデータは以下の3 種類に分類される.1 つ目はトラッキングデータで,試合中の選手やボールの位置情報を記録したデータである.2 つ目はイベントデータで,試合中に起きたアクションとその時刻および位置などを記録したデータである.3 つ目は実況データで,試合中の重要なシーンをテキストで説明したデータである.これら3 種類のデータはその性質上,取得される時間間隔やデータの形式が異なる.そのため従来の規則的にサンプリングされた時系列データモデルでは直接扱うのが困難である.また最近のサッカーデータを用いた研究では,プレーの分析や評価だけでなく,現場の選手やコーチへの改善提案を目指した研究も進められている.例えば,Google DeepMind がプロクラブと協力して取り組んだCK における戦術提案AI の開発や逆強化学習による選手の意思決定を評価する研究などがある.そこで本研究では,マルチモーダルサッカーデータの統合を目的とした深層学習モデルを提案し,攻撃プレーの評価を行う.提案モデルでは,attention 機構を活用することで特徴量の重要度を可視化し,解釈性を向上させる.また,新たに評価値の算出式を提案し,従来の統計ベースやシュート予測による評価との比較を行い,その有用性を示す.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_25","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"隠れマルコフモデルを用いたサッカーにおけるビルドアップと守備戦術の分析","members":"杉浦昇太郎，山下遥(上智大学)","first_author":"杉浦昇太郎","affiliation":"上智大学","code":"P4-06","abstract":"ピッチを8つのエリアに分割し、エリア遷移とプレーの時系列データを隠れマルコフモデルによってモデル化した。ビルドアップと守備戦術の時間的パターンをパラメータ化することで、試合を通じたチーム戦術の特徴を定量的に抽出した。","methods":["隠れマルコフモデル","時系列解析","確率モデル"],"themes":["戦術分析","ビルドアップ","プレッシング"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいてチーム戦術は、試合の展開に大きな影響を与える。特に、自陣からどの様にビルドアップするのかやゴールに近い自陣エリアをどう守るかの自陣での戦術はゲーム展開において重要な意味を持つ。しかし、戦術を決定する戦術的要素のボールの位置やプレーの種類は、試合を通して目まぐるしく変化するため知識化が困難である、よってその判断は、指導者や選手の経験や感覚によって行われ、定量的な分析に基づく戦術の立案が求められている。このような背景からドイツブンデスリーガの試合トラッキングデータを用いた機械学習による守備の戦術原則の特定 [1]や、マシンビジョンアルゴリズムを用いた戦術的な位置と動きの軌跡の分析 [2]など様々な角度から戦術的要素や戦術自体を定量的に理解する研究が行われている。しかしエリアやプレーは時間の経過とともにその特徴やパターンが変化するため、過去のデータに基づいた分析が未来の状況に適用できず、自陣での攻撃の組み立てと守備の分析で確立された手法は存在していない。そこで本研究では、隠れマルコフモデルによる戦術分析を提案する。隠れマルコフモデルは、観測データの背後にある特徴やパターンを「隠れ状態」としてモデル化することで戦術的要素を定量化できるだけでなく、 「隠れ状態」が直前の状態に依存するマルコフ性を仮定しているため、プレーやエリアの遷移といった刻々と変化する時系列データの分析に適していると考えられる。このモデルに基づき、プレーエリアの遷移と選択されるプレーのパターンをモデル化し、試合を通じた自陣での戦術的傾向を明らかにする事を本研究の目的とする。","excerpt_src":"はじめに"},{"id":"2024_soccera_1_26","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるトランジションの効果推定","members":"戸塚周，小泉和之(順天堂大学)","first_author":"戸塚周","affiliation":"順天堂大学","code":"P4-07","abstract":"ボール喪失から攻守の切り替え後までの期待ポゼッション価値（EPV）の変化を分析し、トランジションの効果を定量化した。傾向スコアマッチングを用いることで、類似したシチュエーション下における純粋なトランジション効果の推定を試みた。","methods":["因果推論","統計的検定","確率モデル"],"themes":["トランジション","戦術分析","勝敗要因"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて絶えず発生するトランジション(攻守の切り替え)は、試合全体の勝敗を左右する重要な局面である。攻撃から守備、守備から攻撃への切り替えが迅速かつ効果的に行われることは、チームの戦術や選手のパフォーマンスを評価する上で欠かせない大切な要素となっている。ここでサッカーにおけるトランジションとは攻守の切り替えを指し、ボールを奪取した後の攻撃への移行(攻→守)や、ボールを失った後の守備への切り替え(守→攻)の瞬間を意味する。従来のサッカー分析では、ポゼッション率やシュート数、パス成功率といった集計指標が用いられることが多かったが、これらの指標では試合の文脈や個々のプレーの価値を客観的に評価することが難しい。近年、サッカーをはじめ多くのスポーツにおいてGPSやカメラにを用いて取得されるトラッキングデータや、プレーデータを活用した高度な分析が注目されている。その中で、J Fern ́andez et al.(2019)[1] では期待ポゼッション価値(Expected Possession Value, 以下EPV)を用いることで、選手やチームのプレーが試合にどのような影響を与えたかを定量的に評価することを可能にした。本研究ではトラッキングデータおよびプレーデータを活用し、EPVを算出しトランジションの効果推定を目指す。本研究の目的は、EPV を用いて選手のプレー価値を定量化し、トランジション前後のEPV の変化を「トランジション効果」として評価することである。これにより、トランジション時における選手やチームの戦術的な有効性を明らかにすることを目指す。また、この分析を通じて、トランジション効果が試合結果に与える影響を具体的に示すことを試みる。さらにトラッキングデータやプレーデータを用いることでサッカーと類似した別スポーツへも応用可能であると考えている。","excerpt_src":"はじめに"},{"id":"2024_soccera_1_35","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"選手間距離を考慮した動的ネットワークマーカーによる予兆検出","members":"佐久間貴彦，福崎竜之輔，冨樫歩大，川井貫太朗，佐野幸恵(筑波大学)","first_author":"佐久間貴彦","affiliation":"筑波大学","code":"P4-08","abstract":"選手のスピード時系列に基づく動的ネットワークマーカー理論を適用し、ゴール直前の戦況変化を予測した。選手間距離に基づくサブネットワークを構成することで、急激な状態変化の予兆検出が可能であることを示した。","methods":["ネットワーク分析","時系列解析","統計的検定"],"themes":["戦術分析","試合の流れ","ポジショニング"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["動的ネットワークマーカー"],"awards":[],"text_insufficient":false,"excerpt":"サッカーの戦況の変化を予測・分析する研究分野では,選手間の距離や位置関係に基づいてチームの守備や攻撃のフォーメーションを評価する手法が一般的である. 例えば, 成塚ら[1] はチームの平均座標に基づいて攻撃と守備のフォーメーションの違いを検証し, 奥富ら[2] は選手間の距離やスペースに注目して守備構造の頑健性を評価した. また, 神谷ら[3] は選手のトラッキングデータを用いて戦況変化の自動検出を試みている. これらの研究は主に選手の位置情報に着目しており, 選手のスピード(移動速度)に着目した戦況変化についての分析はほとんど行われていない. そこで竹内ら[4] は, 観測データから複雑システムの急激な状態変化を検出する動的ネットワークバイオマーカー理論に着想を得て, 選手のスピードのゆらぎを定量的に評価することで, サッカーの戦況変化の予兆を検出する手法を提案した.生体や社会システムといった多様な要素が相互に作用することで形成される複雑システムでは,時に急激な状態変化を引き起こす. 「動的ネットワークバイオマーカー(Dynamical Network Biomaker, DNB)」はシステムの数理的な構造に基づき, 生体が健康状態から疾病状態へと転移する直前の状態を検出する方法論である[5].これまで医学分野を中心に実データ解析[6] が行われてきたが, 生体以外のより一般のシステムにおいては「動的ネットワークマーカー(Dynamical Network Maker, DNM)」として,金融市場の変動検知[7], 高速道路の渋滞予測[8], インターネットアクセス変動予測[9] など多様なシステムへの応用が進められている. 竹内ら[4] は選手のスピードから試合状況の急激な変化, いわゆるピンチやチャンスの予兆をDNM により検出できる示唆を得たが, どのような選手をマーカーとして着目するかには課題が残った.そこで本研究では, 選手のスピードにより戦況変化の予兆を検出するうえで, 選手間のネットワークは位置関係により形成されると考えることで, DNM として選択するべき選手の特徴を明らかにすることを目的とする.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_46","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーの守備突破の瞬間を捉えるためのラインブレイク予測モデルの構築と分析","members":"八木翔摩，益留琢磨，宮川大樹，福嶋克茂，市川淳，一ノ瀬元喜(静岡大学)","first_author":"八木翔摩","affiliation":"静岡大学","code":"P4-09","abstract":"J1リーグ2023年シーズンのトラッキングデータとイベントデータを用い、XGBoostによるラインブレイク予測モデルを構築した。特徴量の重要度分析によって、パスの方向、選手の速度、ディフェンスラインのギャップがラインブレイク発生に重要であることを明らかにした。","methods":["機械学習","勾配ブースティング","SHAP・説明可能AI"],"themes":["守備","ポジショニング","戦術分析","スペース評価","トランジション"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":["ポスター部門 優秀賞"],"text_insufficient":false,"excerpt":"サッカーの試合において,攻撃時に相手のディフェンスラインを突破する「ラインブレイク」は,得点チャンスを生み出すために非常に重要な事象である.ラインブレイクが成功すると,キーパーと1 対1 の状況や,フリーでクロスを上げられる状況を作り出すことが可能となり,ゴールを狙うチャンスが大きく高まる.しかし,ラインブレイクの発生は瞬間的かつ複雑な要因に依存するため,その発生を予測したり分析したりすることは容易ではない.従来,ラインブレイクを含む試合中のプレーを分析するためには,試合映像を用いた主観的な評価が一般的であったが,近年の技術の進歩により,トラッキングデータを活用して,より客観的に選手やボールの動きを把握できるようになっている.これにより,得点予測に基づいて選手のプレーを評価するVAEP(Valuating Actins by Estimating Probabilities)[1] やそれを発展させ,全選手・ボールの位置座標を利用した,チームの守備を評価するVDEP(Valuating Defense by Estimating Probabilities) [2] といった手法が考案された.しかしこれらのモデルは得失点や有効攻撃などを予測しており,得点のチャンスにつながるラインブレイクについてはこれまで検討されてこなかった.そこで,本研究では,J1リーグ2023 年シーズンの試合データを用い,パスや選手の位置情報を基にして,ラインブレイクの発生確率を予測する機械学習モデルを構築する.具体的には,各選手の位置や速度,ディフェンスラインの位置関係など,多様な要因を特徴量としてモデルに入力し,それらがラインブレイクの発生にどう影響を与えるかを解析する.また,モデルによって抽出された重要な要因を通して,どのような試合状況や選手配置がラインブレイクを引き起こしやすいのかを明らかにすることを目指す.さらには,予測したラインブレイク確率と被シュート数や被クロス数との相関を見ることでチームの戦術的特徴を考察する.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_64","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーの途中出場選手に関する試合状況別のパフォーマンス評価","members":"藤岡輝，迫田智洋，小野真彦(広島大学)，大石峰暉(東北大学)，門田麗(広島大学)","first_author":"藤岡輝","affiliation":"広島大学","code":"P4-10","abstract":"82試合の682選手を対象に、試合状況別(勝利・敗北・同点)の途中出場選手のパフォーマンスをANOVAとTukeyの検定、重回帰分析で評価した。勝利時と敗北時で身体的パフォーマンスに統計的有意差が見られ、試合状況に応じた選手交代の重要性が示唆された。","methods":["統計的検定","回帰分析"],"themes":["選手起用","選手評価","試合の流れ","勝敗要因","怪我・コンディション"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーの試合において、選手交代は監督が試合に直接的な影響を与えることができる数少ない手段のうちの一つである。新型コロナウイルスの影響により、世界的に交代人数が3 人からフィールドプレーヤーの半分である5 人に増えた。J リーグにおいても、2020 年シーズンの途中よりこのルールが適用され、途中出場選手が試合に与える影響が大きくなったことで、途中出場選手に対する評価の重要性が増した。途中出場選手の評価は身体的、技術的パフォーマンスそれぞれについて、フル出場選手、途中交代選手との比較が行われている。例えば身体的パフォーマンス(選手の体力や身体能力に関連する要素) に関しては、[1] で途中出場選手のパフォーマンスがその他の選手に比べて高いことが示されており、タッチ数、シュート数などの技術的パフォーマンスにおいても同様であることが[2] で示されている。サッカーの試合では前半から後半にかけて身体的パフォーマンスが低下する([3]) ことを考慮すると、[1] や[2] で示されているように、途中出場選手がフル出場選手や途中交代選手よりも高い身体的パフォーマンスを発揮することは理にかなった結果であるといえる。しかし、試合状況によって「攻めるための交代」や「守るための交代」といった交代の目的が異なるにも関わらず、[1] や[2] ではこの点について考慮されてない。さらに、これらの先行研究では身体的および技術的パフォーマンスに関して、途中出場選手をフル出場選手、途中交代選手と比較しているが、途中出場選手間でこれらのパフォーマンスに違いがあるのかどうか、また、その違いが試合の結果にどう影響を与えるのかについては研究が行われていない。そのため、投入される際の試合状況を考慮した上で途中出場選手間のパフォーマンスを評価することが重要であると考えられる。したがって、本研究では以下の2 つの研究目的を設定する。1. 投入時の試合状況によって、途中出場選手の身体的、技術的パフォーマンスに違いがあるか明らかにする2. 途中出場選手の身体的、技術的パフォーマンスは試合の結果にどのような影響を与えるのか明らかにする1 つ目の研究目的から、試合状況別の途中出場選手の身体的、技術的パフォーマンスの傾向が分かり、2 つ目の研究目的から、試合状況別に試合の結果に影響を与える途中出場選手の身体的、技術的パフォーマンスが分かる。これらのことから、本研究により、試合状況に適した選手交代を行うための知見を得ることができる。","excerpt_src":"はじめに"},{"id":"2024_soccera_1_67","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"Jリーグデータを活用したゴール期待値予測モデルの改善と選手評価指標の提案","members":"片岡駿太，江頭健斗，山口光(東京理科大学)，河原弘幸(明星大学)，山田凌大，田畑耕治(東京理科大学)","first_author":"片岡駿太","affiliation":"東京理科大学","code":"P4-11","abstract":"ロジスティック回帰によってゴール期待値の予測モデルを構築し、GK・DF情報を反映した改善を行った。シュート効率指標を新たに提案し、ゴール難易度とシュート判断の両面から得点効率の観点で選手パフォーマンスを評価した。","methods":["ロジスティック回帰","機械学習","指標開発"],"themes":["ゴール期待値","選手評価","シュート","戦術分析"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["攻撃成功要因"],"awards":[],"text_insufficient":false,"excerpt":"サッカーは数少ない得点によって勝敗が決まるスポーツであり,1 得点の重要度が極めて高い.そのため,ゴール成功確率(ゴール期待値) を的確に予測することは,戦略の構築や選手評価において重要な意味を持つ.海外では, Kharrat et al. [1] などでゴール期待値に関する議論が行われている.一方,国内ではJ リーグにおける選手やチームを評価する指標として,Football LAB によるゴール期待値[2] を挙げることができる.ここでのゴール期待値とは,「あるシュートチャンスが得点に結びつく確率を0 ∼1 の範囲で表した指標」であり,値が1 に近いほどシュートが得点になりやすいことを表す. Football LAB ではゴール期待値の算出に勾配ブースティング決定木という機械学習手法を用いており,6 つの変数を使用している.本研究では,上記の6 つの変数以外も観測されている状況を考慮し,新たな変数を導入の上,ロジスティック回帰分析を用いて,より高精度なゴール期待値の予測を行う.また,従来の選手評価指標がシュート本数に大きく依存することを改善するために,算出したゴール期待値をもとに,得点効率の観点を組み込んだ選手評価指標を提案する.高精度なゴール期待値の予測と得点効率を考慮した選手評価指標により,チームでの選手選抜や日本代表のメンバー選定など,戦略的な選手起用への応用が可能と考えられる.実際の試合においては,リアルタイムでゴール期待値を算出することで,観客や視聴者向けの試合データ提供にも応用可能である.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_71","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカー試合のトラッキングデータに基づく「プレス」の強さを示す指標の提案","members":"小山知希，華山宣胤(尚美学園大学)","first_author":"小山知希","affiliation":"尚美学園大学","code":"P4-12","abstract":"本研究は、トラッキングデータから抽出した選手のゴール方向座標の歪度と尖度を説明変数とした判別分析により、プレスの強さを定量的に評価する指標を提案した。川崎フロンターレとアビスパ福岡の試合を対象に、判別得点とプレス強度の関連性を検証し、80%の判別的中率を得た。","methods":["指標開発","統計的検定"],"themes":["プレッシング","ポジショニング","戦術分析"],"data":["トラッキングデータ"],"free_tags":["プレス強度指標"],"awards":[],"text_insufficient":false,"excerpt":"1974 年のワールドカップで, ポジションに関係なくピッチ内を選手たちが全員で攻撃・守備で戦う「トータルフットボール」 と呼ばれる戦術を取ったオランダが準優勝してから半世紀が経とうとしている.このような全員サッカーは,その後,ACミランによる 「ハイプレス」 , バルセロナによる 「ポゼッションサッカー」へと進化し,現代のサッカー試合における攻撃戦術の主流となっている[1].このようなサッカー界の現状において,各選手の位置, すなわちフォーメーションから試合の趨勢を議論することが重要であろう.そして,そのために有用な観測データが,いわゆるトラッキングデータと呼ばれる「各選手の位置を短い間隔で観測したデータ」である.トラッキングデータの分析については,例えば公益社団法人日本プロサッカーリーグのホームページに掲載されている「トラッキングデータの活用 -走行距離/スプリント/急加速/裏抜け/ハイプレス-」という記事では,各チームの動きや走りに関する特色 (走行距離/スプリント回数, 急加速回数ランキング,裏抜け数ランキング,ハイプレス試行率ランキング)を紹介している[2].日本プロサッカーリーグのホームページに掲載されている記事では,主に個々の選手のプレーの分析結果が示されている.一方,データスタジアム株式会社が運営する Football LAB のホームページ記事「トラッキングから生まれる新データ 2. プレス及びプレッシング」 では, トラッキングデータから「プレス(敵がボールを持っている時に敵との距離を縮め、 プレッシャーをかけたりパスのコースを閉ざしたりすることを)」の状況を算出し, 図示したものを紹介している[3].図1:プレスの分類(出典:Football LAB)そして Football LAB は,図1に示した「各選手の位置データ」に基づいて 「ハイプレス」「ミドルプレス」「ロープレス」を定義/分類している. そして,図2に示すような 「試合平均プレス回数」 を算出し,各チームのプレスのかけ方の特徴を示している.図2:試合平均プレス回数(出典:Football LAB)このような「プレス分類」は各チームのフォーメーションの特徴を把握するための有用な指標であろう.しかしながら,Football LAB のホームページでは,次のような内容が述べられている.こういった種類分けは明確な共通ルールがないため分析をされる方によって異なる意見があるだろう。ひとまずこの記事においてはこう定義していると考えて頂きたい.そこで, 本研究では, フィールド上のゴール方向 (トラッキングデータではx軸方向)の各選手の位置に関する歪度と尖度を,チーム全体のプレスの程度を測る要素と考える.そして,シュートが放たれた場面において,トラッキングデータから得られる各選手のx軸方向の歪度と尖度を説明変とし,「どちらのチームがシュートを放ったか」 を目的変数とする判別分析を行う.そして,判別得点がプレスの強さの指標として有用であるかを検討する.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_73","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカー選手の速度割合を用いた勝敗要因の統計的検証","members":"越智咲來，呉屋耶真斗，知念玲弥，山田健太(琉球大学)","first_author":"越智咲來","affiliation":"琉球大学","code":"P4-13","abstract":"本研究は、J1リーグの試合データから各選手の移動速度を分類し、チーム全体のスプリント割合と勝敗の関連性を検証した。時速20km以上の走行割合が高いチームが勝利する傾向が統計的に有意であることを二項検定で確認した。","methods":["統計的検定","指標開発"],"themes":["勝敗要因","トランジション","チーム評価"],"data":["トラッキングデータ"],"free_tags":["HIRR"],"awards":[],"text_insufficient":false,"excerpt":"サッカーは, 選手の速度や瞬発力が試合の展開や結果を左右するスポーツである. フィールド上の選手たちは, 高速な動きと素早い判断で多様な戦術を実行する. たとえば, 攻撃時にはウィングが高速ドリブルでサイドを突破し, 相手ディフェンダーを抜いてゴール前に正確なクロスを送る.一方, 守備時にはミッドフィルダーやディフェンダーが素早く自陣に戻り, 高速のプレスで相手の攻撃を阻止する. このように, 選手の速度に基づく動きや連携は, 試合の流れや勝敗を大きく左右する重要な要素である.近年, サッカーにおける「インテンシティ」という言葉が注目を集めている. インテンシティとは, プレーの激しさや速さを示す指標であり, 選手の運動量やフィジカルコンディションを評価する際に用いられる. 特に日本代表チームでは, インテンシティのうち「HIRR(High Intensity Run Ratio)」という指標が重要視されている.HIRR は,フィールドプレーヤーの走行距離のうち, 時速20km 以上で走行した距離の割合を示すものであり, 選手個人の高強度の走行パフォーマンスを評価する指標である. 今回はこのHIRR を参考に, 時速20km 以上で走行した時間の割合を用いて分析を行うこととした.サッカーは個人競技ではなくチームスポーツであるため, 個々の選手のインテンシティがチーム全体のパフォーマンスや試合結果にどのように影響を及ぼすのかを理解することが重要である. そこで本分析では, 試合中におけるチーム全体の高強度の速度割合と勝利の関係を検証することを目的とする.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_77","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"攻撃時に受ける守備プレッシャーの違い：上位チームと下位チームにおける特徴の解明","members":"堀陽大，高輪一貴，辻悠吾，福田圭祐，山本知仁(金沢工業大学)","first_author":"堀陽大","affiliation":"金沢工業大学","code":"P4-14","abstract":"本研究は、シュート時およびトラップ時におけるアシスト選手とシュート選手の周囲DF選手数を定量的に評価した。J1リーグの上位チームと下位チームを比較した結果、シュート時に上位チームはDF選手を引き離す傾向が確認された。","methods":["空間分析","指標開発"],"themes":["プレッシング","ポジショニング","チーム評価","勝敗要因"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーは,11 人の選手が広大なピッチ上で連携し,戦略的に相手チームを攻略するスポーツである.このスポーツは,バスケットボールやバレーボールなど他のチームスポーツに比べ,ピッチが広く,選手数が多い点で戦略性が高く,ポジショニングの重要性が際立っている.特に,アシストの際に相手選手を引き付けるプレーは,シュート選手をフリーにし,得点の可能性を高める重要な役割を果たす.サッカーの攻撃(OF: Offense)の目的は,相手ゴールにボールを入れることである.そのためには,守備 (DF: Defense) の連携を崩し,シュート可能な位置までボールを運ぶ必要がある.ドリブルのみでゴールを狙う場合, DF の追走やキーパーの対応により得点が困難になることが多いため,アシストによるスペース創出が重要とされている.これまでの研究では,チームの連携度を運動指標で評価する試みが行われてきた[1].しかし,シュート選手やアシスト選手の周囲にいるDF 選手数に注目した研究はあまり行われていない.本研究では,シュート選手およびアシスト選手がDF 選手をどの程度引き付けているかを定量的に評価し,さらにJ1 リーグの上位チームと下位チームの特徴を比較することで,上位チームに必要な戦術的特性を明らかにすることを目的とする.本研究では,OF チームにとって得点が期待される最適な状況の1つとして,次のような仮説を立てた.仮説は,アシスト選手がDF 選手を引き付け,空いたスペースにパスを通し,オフボールの攻撃選手がそのスペースに侵入し,DF 選手を置き去りにする,または最小限のドリブルでゴールを決める.そして,この状況を上位チームほど作り出すことができていると考えた.本稿では,まず解析対象とするチームの選定について述べる.次に,解析対象とする選手・プレー動作・範囲について述べる.そして,解析結果と今後について述べる.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_90","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"有効的な戦術パターンの分析と手段について","members":"高祖慶太郎，渡部真光，山口颯大，森裕一(岡山理科大学)","first_author":"高祖慶太郎","affiliation":"岡山理科大学","code":"P4-15","abstract":"本研究は、2022、2023年の試合データからチームの攻撃方法をK-means法により3分類し、各戦術タイプと成績の関係を分析した。中央攻撃型が1位を獲得し、多くの得点を取りながら失点が少ない傾向が確認され、割り切った戦術の有効性が示唆された。","methods":["機械学習","指標開発"],"themes":["戦術分析","ポジショニング","勝敗要因"],"data":["イベントデータ"],"free_tags":["戦術パターン分類"],"awards":[],"text_insufficient":false,"excerpt":"四半世紀にわたり,マンチェスターU の監督として指揮を執り続けたアレックス・ファーガソンは,多くの名手とともに幾多のタイトルを手に入れてきたが,彼のチームには普遍的な特徴がある。まず,ファーガソン時代のマンチェスターU に代表される戦術の特徴はウイングの重用である。ライアン ・ ギグス,アンドレイ ・ カンチェルスキス,デイヴィッド ・ ベッカム,クリスティアーノ・ロナウドのような世界的に有名な選手を重用し,4-4-2 のポジションからウイングはスピードを生かして突破を図る。典型的な得点パターンは速攻の形からサイドにボールを預け,2 トップの一方がニアポストでクロスに合わせてフィニッシュに至る。以上が世界的に代表されるサイドアタックの戦術を重用するチームの例である。また,マンチェスターC の監督として指揮を執り続けるジョゼップ・グアルディオラは,2016 年から 8 年間でプレミアリーグにおいて 5 回もの優勝を誇るチームを率いているが,彼のチームにも普遍的な特徴がある。 「偽9 番」や「偽 SB」を重用して相手ディフェンダーの連結を離す中央攻撃である。サッカーはゴール型スポーツであり,比較的人数は多いことから,守備時に複数のラインができる。その複数のラインを崩すために組織的な攻撃を要し,中央攻撃を中心に変則的な戦略をとるのがグアルディオラの戦略である。以上が世界的に代表される中央攻撃の戦術を重用するチームの例である。いずれも利点, 欠点があるが, サイドアタック型か中央攻撃型かの違いがどう成績に影響するかを明らかにすることは,戦術立案に役立つことになる。そこで,データスタジアム株式会社より提供を受けた 2022 年と 2023 年の J1 リーグ95 試合分のデータを基に,戦術のタイプを分け,その分類から成績向上や効果的な戦略展開へつながる要因について考察する。","excerpt_src":"はじめに"},{"id":"2024_soccera_1_92","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"逆強化学習を用いたサッカー選手の行動評価","members":"小島悠介，金崎朝子(東京工業大学)","first_author":"小島悠介","affiliation":"東京工業大学","code":"P4-16","abstract":"本研究は、プロサッカー選手の行動データをMulti-Agent Adversarial Inverse Reinforcement Learningに適用可能な形式に整形した。Google Research Footballのシミュレーション環境で使用するため、イベントデータとトラッキングデータを統合し102次元の状態空間と18次元の行動空間に変換した。","methods":["強化学習","逆強化学習"],"themes":["選手評価","戦術分析"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"侵入型ゲームであるサッカーにおいて、選手の行動を適切に評価することは難しいとされている。ここでいう行動評価とは、例えば「選手A か選手B のどちらにパスをすることが最適か」、や、「ある局面においてどのエリアから攻撃を仕掛けるのが効果的か」などを定量的に評価することを指す。このような行動評価は、サッカーのプレーの質を向上させるためには欠かせない要素である。選手の行動評価に関する研究として、教師あり学習を用いて評価値を算出する手法[4] が提案されている。しかし、サッカーという複雑なスポーツにおいて、行動評価値の教師データを適切に定義することは困難であると想定される。そこで本研究では、行動評価値を教師データとして与える必要なく、選手の行動評価関数を推定可能な手法である、逆強化学習を行うためのデータ整形方法を提案する。さらに、時間の制約により本研究では取り組むことができなかった部分として、逆強化学習を用いた具体的な行動評価の実践についても今後の課題として挙げる。","excerpt_src":"はじめに"},{"id":"2024_soccera_1_96","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"不確かさを意識した期待値指標の取り扱いと考察","members":"王方成，染谷大河(東京大学)","first_author":"王方成","affiliation":"東京大学","code":"P4-17","abstract":"Expected Goal (xG) という期待値指標の統計的性質を分析し、統計分布を考慮した扱い方を提案した。ポアソン二項分布を用いて勝ち点期待値の関係性を明らかにし、統計分布を積極的に活用することの重要性を示唆した。","methods":["確率モデル","統計的検定","機械学習"],"themes":["ゴール期待値","勝敗要因","得点予測"],"data":["イベントデータ","外部データ併用"],"free_tags":[],"awards":["ポスター部門 優秀賞"],"text_insufficient":false,"excerpt":"近年の計測技術の発展により、サッカーの試合中に多くのプレーデータ、及びフィジカルデータが取得できるようになっている。その最たる例として、2022 年に開催されたカタールW 杯以降、FIFA 主催の大会のほとんどにおいて、すべての試合に対して50 ページ以上のPost Match Summary Report [1] が公開されており、各チームのパフォーマンスに関して非常に詳細なデータが利用可能になっている。このようなデータ利用の発展の中で、近年ではスタッツのみならず、Expected Goal (xG) やExpected Threat (xT) [2] と呼ばれるような、期待値で表現される指標も出現している。これらの値はシンプルなシュート数やゴール数などの指標よりも詳細な情報を有しており、試合の適切な分析に貢献することが期待される。しかしながら、これらの期待値指標には多くの誤用が存在する。本来こうした期待値は、統計分布を考慮して使用されるべき値であるが、多くの場合これらの前提は無視される。たとえば、典型的なxG の使用法は、一試合におけるxG の推移やxG の値を用いて試合の実質的なパフォーマンスと結果の差分について評価するものである(図1*1)。しかしながら、サッカーの試合においてゴールはレアイベントであり、実現されるゴール数は大きくばらつく。そのため、1 試合の対戦相手とのxG の差のみを評価しても有意義な考察を得ることは難しい。一方で、統計分布を意識すると、xG の変化による勝ち点期待値の変化など、積極的な考察を行うことができる。図1 xG の典型的な使用方法本研究では、xG を代表例とした期待値指標の不確かさを適切に扱うことで、より積極的な指標の活用が可能になることを示す。","excerpt_src":"導入"},{"id":"2024_soccera_1_97","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーを対象とした幾何学的分析システムの実現に関する研究","members":"藤田洸希，田中柊斗，石橋直樹(武蔵野大学)","first_author":"藤田洸希","affiliation":"武蔵野大学","code":"P4-18","abstract":"J リーグのデータを用いて、シュート角度値 (SDV) による幾何学的分析システムを開発した。ボールホルダー、ゴールキーパー、ディフェンダーの位置関係から、シュートの容易さ/困難さを定量化し、試合の流れにおける決定的なプレーを可視化できることを示した。","methods":["シミュレーション","可視化","空間分析"],"themes":["シュート","ゴール期待値","トランジション"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["シュート角値"],"awards":[],"text_insufficient":false,"excerpt":"サッカーを対象としたデータサイエンス応用が活況である[1]. 大別すると, 競技向上のためのパフォーマンスや戦術の分析[2], ならびに, 勝敗に直結するゴール確率の算出や勝敗予測[3] などが挙げられる. これらの分野ともに, 学術的な研究対象であると同時に, 産業での研究開発も活発に行われている.本報告書では, 時空間的な計量機能[4][5] が, 競技推移の分析に有効なのではないかという仮説にたち, サッカーを対象とした幾何学的分析システムについて述べる. 具体的には, シュート角値(SDV) の計算方式, ならびに, プロトタイプシステムの実現方式について述べる. SDV を用いた分析システムの利点は次の通りである. 第1 に, SDV は試合局面毎のシュート角の大きさを数値化しているため,その局面でのシュートの容易さ/困難さを求められる. 第2に, 試合全体からSDV を求めることで, 時系列分析が可能となり, 試合の流れの中で, ゴールに結びつく決定的なプレー(以下キープレー) を可視化することが可能となる. 第3 に, 本方式は純粋な幾何学的演算から構成されるため, 機械学習を用いた方式が暗黙的に有するバイアスの問題が生じない. 従って, データさえあれば, 時代や地域, ルール変更などがあった場合でも, 異なる試合間の比較が可能となる. さらに, これらはすべて座標から計算可能であるため,再現性がある. 第4 に, 計算が軽量であるため, リアルタイム処理が実現可能であると考えられ, 試合中にSDV をリアルタイム表示するなどの応用が実現可能となる点が挙げられる.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_22","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"プレーの質を数値化する指標に基づく動き出しの評価とその活用","members":"福田遥也(横浜市立大学)，小泉和之(順天堂大学)","first_author":"福田遥也","affiliation":"横浜市立大学","code":"[口頭]サッカー1","abstract":"ボール非保持時のプレーの質を評価するためにME（Moving Effect）およびDE（Decoy Effect）指標を提案した。期待シュート確率と期待パス成功確率を用いることで、動き出しのシチュエーション別評価と統計的因果推論に基づく純粋な効果推定が可能となった。","methods":["機械学習","因果推論","統計的検定"],"themes":["選手評価","ポジショニング","パス"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":["サッカー部門 優秀賞"],"text_insufficient":false,"excerpt":"シュートがゴールに入る確率を表すゴール期待値(xG,Expected Goals) の登場以降, アシスト期待値などの期待値指標の活用が広まり, プレーの質を評価することが可能となった. しかし, 選手単位やプレー単位を評価することができるのはシュートやアシストになりうるパスがほとんどであり, ドリブルや守備などのその他のプレーは評価対象となっていないことが多い. 例えば, サイドチェンジやDF からの縦パスのように, 直接アシストにはなりにくいが重要なパスを評価する指標はほとんどない. また, サッカーというスポーツでは, ほとんどの選手がボールが無いところでプレーしているが, そこでも常に相手選手との駆け引きやボールを貰えるところへの移動を繰り返しているため, ボールが無いところでのプレーも非常に重要である.そしてそのようなボールが無いところでのプレーは, 質だけでなく量の観点でも数字に残りにくく評価が難しい.そんな中で, 福田・小泉(2023) では, パスやドリブル, あるいはシュートブロックやGK のセービングのような様々なプレーの1 つ1 つを対象とした評価指標が提案された.しかし, それでもボールに対するプレーしか考慮されていない.その後, 福田・小泉(2024) で, パスの選択の評価方法が提案された. その中では, 味方選手全員をパサーにとっての選択肢として捉え, 実際にボールを貰えていない選手の選択肢としての質を数値化している. しかしこの研究では, あくまで評価対象はパサーであり, ボールを持っている選手の評価しか行われていない.そこで, 本研究では, ボールが無いところでのプレーの中でも, 攻撃側の選手がボールを貰おうと大きく位置を変える「動き出し」に着目して, その質を評価することを目的としている. その中で, 福田・小泉(2024) のアプローチを参考にし, ボールを持たない攻撃側選手をパスの選択肢として捉え, パスの質を評価する指標を活用する. そして, 自らがパサーにとっての良い選択肢となる動き出しだけでなく, 味方選手を良い選択肢にしようとする囮の動き出しを評価対象とするような指標の提案を行う.また, 本研究では統計的因果推論のアプローチを適用することで, 他の影響を取り除いた動き出しの効果の推定や,実際には観測できない動き出しをした場合を踏まえた評価を行うことも視野に入れている.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_23","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーの戦術的な意思決定分析のための解釈可能な低次元状態に基づく強化学習","members":"井出憲次朗(名古屋大学)，染谷大河(東京大学)，川口康平(香港科技大学)，藤井慶輔(名古屋大学)","first_author":"井出憲次朗","affiliation":"名古屋大学","code":"[口頭]サッカー2","abstract":"監督とのフィードバックに基づき、時空間データから解釈可能な低次元状態変数を定義し、深層強化学習を適用した。全選手の位置と動きを考慮しながら戦術的意思決定をモデル化し、従来のブラックボックス的な強化学習の解釈性を向上させた。","methods":["強化学習","ニューラルネットワーク","シミュレーション"],"themes":["戦術分析","ポジショニング","選手評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":["サッカー部門 入賞"],"text_insufficient":false,"excerpt":"サッカーの戦術を理解することは、監督、コーチ、アナリストにとって極めて重要である。しかし、サッカーなどのゴール型スポーツでは複数の選手が連続的に関わり合いながらプレーを行うため、試合全体をモデル化して分析することが難しい。これまでの研究では、幾何学方程式や運動方程式を用いた空間評価やボールまでの最短距離に基づく数理モデル[6, 1] が提案されているが、これらのモデルは計算コストが高いことが多く、専門家の知識との整合性が取れていない可能性がある。また、近年発展している強化学習アプローチ[5, 4] では、全選手の位置と速度を状態変数として扱っている。これらのモデルは試合全体をモデリング可能であるが、評価値の解釈可能性が低い。さらに、大規模なデータセットを必要とするが、スポーツデータセットの多くはライセンスビジネスであるため、利用可能なデータセットが限られた状況は今後も続くと考えられる[3]。一方、ルールベースモデルは、データ量の課題と専門家の知識との整合性の両方の課題に対処しているが、先行研究[2] では、得点確率の評価のみが行われていたり、行動を定義する際に全ての選手の状態を考慮していないなどの課題がある。そこで、本研究では、時空間データを用いた低次元のルールベース状態変数による強化学習モデルが、サッカーの戦術を効果的に捉え、理解できるかどうかを検討する。我々のアプローチでは、日本のサッカーチームの監督からのフィードバックを基に、サッカーを「各チーム11 人の選手が時間と空間を奪い合うゲーム」として捉え、状態変数を定義する。時空間エージェント状態の解釈可能な低次元モデリングをルールベースで行うことで、サッカー戦術における意思決定を理解することを目的とする。このアプローチにより、従来の強化学習モデル[4] が抱える評価値の解釈困難という課題を改善すると同時に、ルールベースモデル[2] では難しかった全選手の状態を考慮した意思決定のモデリングが可能となる。本研究の貢献は以下の通りである。(1)サッカーチームの監督との議論に基づき、解釈可能な低次元の状態変数を定義した点、及び(2)ルールベースモデルでは考慮されなかった全選手の意思決定を効果的にモデル化しつつ、従来のブラックボックス的な強化学習モデルでは困難だった戦術の解釈を可能にした点である。本研究により、監督やアナリストにとって、試合中や試合後の戦術評価、選手の意思決定の質向上、さらにはチーム全体のパフォーマンス向上に役立つ新たなツールを提供できることが期待される。","excerpt_src":"導入"},{"id":"2024_soccera_1_50","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるカウンター可能性を考慮した守備構造の評価","members":"鎌形創，田中健一(慶應義塾大学)","first_author":"鎌形創","affiliation":"慶應義塾大学","code":"[口頭]サッカー3","abstract":"優勢領域図とパス可能領域の解析によって、ゴール防止とカウンター可能性の二つの観点から守備構造を評価する指標を提案した。ロジスティック回帰によってシュート確率を推定し、パスインターセプト可能性を定量化した。","methods":["ロジスティック回帰","空間分析","可視化"],"themes":["守備","ポジショニング","トランジション","戦術分析","スペース評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":["サッカー部門 優秀賞"],"text_insufficient":false,"excerpt":"戦術が急速に発展している現代サッカーにおいて,チームごとの戦術を理解し対策を練ることは非常に重要である.本研究では,戦術分析に不可欠な選手の配置に着目し,守備構造を評価する.また,現代サッカーでは攻撃や守備という2 つの局面に加え,ポジティブトランジション(PT) と呼ばれる守備から攻撃への切り替えと,ネガティブトランジション(NT)と呼ばれる攻撃から守備への切り替えの局面を含めた,合計4 局面を複合的に考えることが主流となっている.守備構造の評価を行うにあたり,最大の目的である「ゴールを守る」という観点に加え,PT を考慮した「カウンターの可能性」という観点に立ち,2 つの観点から複合的に守備構造を評価する.「ゴールを守る」ことに関しては優勢領域図を用いてパスが可能な地点(セル)を求めたのち,そのようなセルの重み付き面積を求めて評価を行う.「カウンターの可能性」に関しては,パスのインターセプト可能性を考慮した評価を行う.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_68","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"エネルギー地形解析を用いたパスネットワークの特徴分析","members":"横山瑞季，市川淳(静岡大学)，阿部真人(同志社大学)，一ノ瀬元喜(静岡大学)","first_author":"横山瑞季","affiliation":"静岡大学","code":"[口頭]サッカー4","abstract":"本研究は、サッカーのパスネットワークをエネルギー地形解析により分析することで、チームの戦術的特徴を可視化した。J1リーグ2023年シーズンのイベントデータを用いて、川崎フロンターレとアビスパ福岡のパスネットワークパターンをエネルギー値で分類し、各チームの戦術的違いを定量化した。","methods":["ネットワーク分析","指標開発","可視化"],"themes":["パス","戦術分析","チーム評価"],"data":["イベントデータ"],"free_tags":["エネルギー地形"],"awards":["サッカー部門 入賞"],"text_insufficient":false,"excerpt":"サッカーは11 人対11 人で行うチームスポーツである.各選手にはフォーメーションとして緩い形で定められたポジションが存在するが,試合中の状況に応じて動的にその位置が入れ替わり,各選手の個性がその役割に影響を与える.さらに,サッカーのプレイにおいては,自チーム内の相互作用のみならず,相手選手との駆け引きや戦術的なやり取りといった複雑な相互作用も生じる.これらの相互作用は試合の戦術や展開,流れに応じてダイナミックに変化し,総じて複雑な相互作用の集合体となっている.このようなサッカーの構造とダイナミクスの解析は,複雑システムの研究対象として注目されてきた.特に近年では,ネットワーク科学の手法を用いてサッカーのパスネットワークを分析するアプローチが取られるようになってきた[1].これまでの研究では,複雑ネットワークで用いられる指標を活用し,サッカーのパスネットワークの構造とダイナミクスを理解しようとする試みが行われている[2, 4].しかし,ゲーム内で時々刻々と様々なパスが行われる中で,どのパスネットワークがそのチームの特徴を表す重要なものなのか,またどのパスネットワーク同士の遷移が生じやすいのかといった点はパスの単なる複雑な時系列データからは,その特徴を捉えることが困難だった.そこで本研究では,時系列に沿って構築したパスネットワークをエネルギー地形解析により分析することで,これらの特徴をうまく可視化し,各チームのパスの特徴を浮かび上がらせることを目的とする.","excerpt_src":"はじめに"},{"id":"2024_soccera_1_82","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおける経路コストモデルによる攻撃時の選手配置とフリーラン方向の評価","members":"木下慶悟，栗原柾由，林穂高，島田尚(東京大学)","first_author":"木下慶悟","affiliation":"東京大学","code":"[口頭]サッカー5","abstract":"本研究は、経路コストモデルにPitch Controlを適用して、攻撃時の選手配置を定量化する指標を開発した。J1リーグ2022、2023年シーズンの868シュートシーンを対象に、指標値とゴール脅威値の相関を検証し、2秒前の配置が攻撃成功に影響することを示した。","methods":["最適化","空間分析","シミュレーション"],"themes":["ポジショニング","ビルドアップ","戦術分析"],"data":["トラッキングデータ"],"free_tags":["経路コストモデル"],"awards":["サッカー部門 最優秀賞"],"text_insufficient":false,"excerpt":"サッカーはボールをゴールに入れるという目的のために,互いのチームの選手11 人がピッチ上を自由に動き回るスポーツである.より複雑性の高い戦争や,より身近で単純なチェスや将棋といったボードゲームなどと同様に,サッカーはピッチ上という空間に選手をどのように配置するかが非常に重要なゲームである.その配置の良さを定量化し評価することができるようになれば,指導者は選手やチームのパフォーマンスを改善することができる.選手は攻撃時にゴールを奪う,すなわち攻撃成功のための配置をとることが重要である一方で,もしボールを奪われた際に相手のカウンター攻撃,すなわち被カウンターを阻止するための配置をとることもまた重要である.攻撃を成功させる選手配置に関する先行研究が多数存在する[1][2] 中,我々は攻撃から守備へのトランジションの瞬間に焦点を当て,選手配置の評価を試みた.経路コストモデルを導入することにより,選手配置から被カウンターの結果を良く説明できることを示した[3].本研究の目的は,経路コストモデルを攻撃方向にも適用することで,提案した指標が攻撃成功と被カウンター阻止という2 つの観点のどちらにおいても使用可能な汎用的な指標であることを示すことである.さらに,提案した指標の変化に着目することで,全体の配置だけでなく個々の選手のフリーラン方向(ポジショニングの変化)の評価も行う.","excerpt_src":"背景"},{"id":"2024_soccera_1_7","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"ビルドアップ成功につながるオフボール選手のポジショニング評価","members":"廣瀬貞雄，染谷大河(東京大学)，河野理夏子(オーストラリア国立大学)，藤井慶輔(名古屋大学)","first_author":"廣瀬貞雄","affiliation":"東京大学","code":"[口頭]サッカー6","abstract":"本研究は、ビルドアップ局面における中継選手のポジショニング評価指標BUOPを提案した。Off-ball Scoring Opportunityの枠組みを発展させ、ビルドアップの成功条件を相手の陣形重心を超える位置でのパス受領と定義した。ルールベースと機械学習ベースの2つのモデルを構築し、提案手法がビルドアップの出来を表すバイパス数と同様の傾向を示すことを確認した。","methods":["機械学習","統計的検定","指標開発","空間分析"],"themes":["ビルドアップ","ポジショニング","選手評価","チーム評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":["サッカー部門 優秀賞"],"text_insufficient":false,"excerpt":"試合中の各プレーを記録したイベントデータや選手の位置情報を記録したトラッキングデータ、骨格データなど様々なデータが普及してきたことや分析手法が発展したことなどを背景に、サッカーにおいて選手の動きに対しての詳細な分析が広く行われるようになっている。サッカーの攻撃面の分析は、ボール保持者についての分析と、ボール非保持者についての分析に大きく分けることができる。前者については、典型的なパス成功率やドリブル成功数などのほかに、例えば得点につながる確率や成功難度を加味してパスの価値を評価する研究[3] がある。また、後者については、例えばオフボール得点機会(OBSO)と呼ばれるゴール前でボールを受ける選手の位置を評価する研究[4]がある。しかし、ゴール前よりもはるかに回数が多く、質の高い崩しを多数行うために必要不可欠なビルドアップの局面について、ビルドアップの成否はボール非保持者の位置に大きく依存しているのにも関わらず、特にボール非保持者の位置を評価する指標は提案されていない。図1 上部のように、ビルドアップにおいて、1 本のパスで高い位置にいる味方にボールを届けることが理想的であるが、往々にしてそのようなパスコースは相手選手によって遮られていることが多く、そのような場合には途中の選手を経由することで高い位置にいる味方にボールを届けることを目指す。このとき、DF ラインや中盤の選手は、まずは自分をマークする相手選手よりも高い位置でボールを受けることを目指すが、できなさそうであれば自陣ゴール側に移動し、自分を経由して前の選手にパスを出せるような位置をとることを目指すのが一般的である。この動きを怠ってしまうと、ボール保持者はパスの出しどころがなくなってしまい、確率の低いロングボールに頼らざるを得なくなる。このように、ビルドアップの局面においては中継する選手の位置が非常に重要である。そこで本研究では、ビルドアップ時のボール非保持者の位置を評価するBUOP(Building-Up Off-ball Posi- tioning)を提案する(図1)。OBSO[4] の枠組みを発展させることで、今まで評価されてこなかった、ビルドアッ図1本研究におけるビルドアップ成功の定義と、提案手法の構成図プの途中で中継して前線にボールをつなぐ選手の位置を評価する。それにより、ボール保持選手の判断の評価や、実際にはパスが出なかった選手の位置の評価などを行うことができる。実験の結果、BUOP が高い位置にパスを出した場合、次のパスで相手の陣形の重心よりも相手ゴール側にいる味方にパスを出すことに寄与する可能性が示唆された。さらに、シーズン全体で見てみると、ビルドアップの出来を表すバイパス数と同様の傾向を示すことが明らかとなった。","excerpt_src":"導入"},{"id":"2024_soccera_1_6","year":2024,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"Space gainとゴール期待値を同時に考慮したオフボール選手評価","members":"牧浦龍之介，篠崎智大(東京理科大学)","first_author":"牧浦龍之介","affiliation":"東京理科大学","code":"[口頭]サッカー7","abstract":"本研究は、オフボール選手のスペース獲得がゴール期待値増加に寄与する度合いを評価する指標SG-xGを提案した。Pitch controlモデルとSpace occupation gainを用いてスペース獲得を検出し、責任係数と連動係数によって攻撃選手個人が獲得したスペースの価値を算出した。提案指標により、ゴールに直結しないプレーの価値を定量的に評価することが可能になった。","methods":["機械学習","勾配ブースティング","空間分析","指標開発"],"themes":["選手評価","スペース評価","ゴール期待値"],"data":["トラッキングデータ"],"free_tags":[],"awards":["サッカー部門 奨励賞"],"text_insufficient":false,"excerpt":"ボールを持っていない状態(以下,オフボール)での動きは選手を評価するうえで重要である.オランダのサッカー選手ヨハン・クライフは「選手がボールを持っている時間は平均3 分であることは統計的に証明されている.つまり,最も重要なのは,ボールを持っていない87 分の間に何をするかということだ.それがいい選手かどうかを決めるんだ.」[1] と述べた.しかし,ゴール数やアシスト数などのように,選手評価指標の多くはボールを持ったときの動きを対象としている.これらの指標を用いて選手を評価するとオフボール選手のゴールに貢献する動きを過小評価する可能性がある.オフボールでの動きに基づいた選手評価指標として, Space gain [1] が提案されている.Space gain は,ピッチ上の影響度(Pitch control 値)とスペースの価値を算出し,ある時間内での価値のあるスペースの獲得度合い(Gain in time)を表す指標である.影響度は各選手の速度とボールからの距離によって平均と分散共分散行列が変化する二次元正規分布の確率密度関数に基づいて算出される.Gain in time が大きければより価値の高いスペースを獲得したことを表す.しかし,Space gain はチーム単位での指標であるため,選手個人がどれほどの価値のスペースを獲得したかを表さない.本研究では,スペースを失った守備選手に対してその責任の度合いを表す係数と,攻撃選手が守備選手を引き付けた度合いを表す係数を導入することで選手個人のスペース獲得量を算出する.Space gain のみでは,スペースを獲得したこと自体がチームの攻撃にどれだけ貢献しているかを直接評価することは難しい.そこで,スペースの価値に攻撃への貢献度を考慮する.攻撃への貢献度として,ゴール期待値を利用する.ゴール期待値は,シュートが打たれた際に算出される値であり,そのシュートがゴールとなる期待値である.スペースを獲得した価値をゴール期待値の上昇量とし,オフボール選手をゴール期待値の上昇量への寄与に基づいて評価する.","excerpt_src":"はじめに"},{"id":"2024_basketa_1_30","year":2024,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"クラッチタイムに着目したB リーグ選手の試合貢献度を評価する指標の提案","members":"熊谷赳琉，髙尾晃生，玉井貴大，山本遥登，宿久洋(同志社大学)","first_author":"熊谷赳琉","affiliation":"同志社大学","code":"P1-14","abstract":"B リーグのクラッチタイム (試合終盤 5 分以内かつ 5 点差以内) における選手評価指標を提案した。XGBoost で勝敗への寄与度を分析し、既存 EoCC の改良を行い、勝率との相関係数を 0.09 から 0.51 に向上させた新指標の有効性を検証した。","methods":["勾配ブースティング","SHAP・説明可能AI","指標開発"],"themes":["選手評価","試合の流れ"],"data":["イベントデータ"],"free_tags":[],"awards":["ポスター部門 最優秀賞"],"text_insufficient":false,"excerpt":"バスケットボール競技において,接戦を勝ち切ることは重要である.特に,接戦の中でも試合終盤で勝利に繋がるパフォーマンスが重要であると考えられる.接戦の試合終盤における選手の勝利に繋がるパフォーマンスを定量的に評価できれば,その知見を基に選手起用や戦術の最適化を図ることができ,接戦での勝利の可能性を高めることができると考えた. B リーグ公式戦の試合は,1 試合4 つのクォーターで構成され,各クォーター10 分間,計40 分間で行われる.また,バスケットボール競技ではクラッチタイムと呼ばれる試合終盤の接戦場面が存在する. Sarlis, V. ら(2024) は,クラッチタイムを第4 クォーター以降の5 点差以内かつ終盤3 分以内の状況と定義し,クラッチタイムにおける選手個人の評価指標として, Estimation of Clutch Competency(以下EoCC)を提案した.EoCC は,得点,アシスト,リバウンドなどの攻撃面の統計データと,スティール,ブロックなどの守備面の統計データ(以下,これら統計データを総称してスタッツという)を統合して算出される指標である.この指標はクラッチタイムにおける選手個人の試合貢献度を数値化することを可能にした.EoCC の有効性は,クラッチタイムに活躍した選手を順位付けする投票結果と比較されている.具体的には,EoCC の値が上位10 選手のうち7 選手が投票結果と一致し,高い整合性が確認されている.しかし,B リーグにおいて,EoCC による選手評価の結果とクラッチタイムに出場した試合のチーム勝率との間に整合性が確認されていない.バスケットボールはチームスポーツである.個人の活躍は最終的にチームの勝利に貢献することを考慮すると,この不整合は重要な課題であると考える.その要因として,EoCC が選手個人のスタッツのみに着目し,試合中の選手間の相互作用を考慮していない点が挙げられる.実際,ある選手の得点やアシストなどのパフォーマンスは,当該選手単独の能力のみならず,味方選手のプレーによる貢献にも依存する.したがって,クラッチタイムにおける選手の試合への貢献を適切に評価するためには,個人のスタッツに加えて,同時に出場している味方選手の影響も考慮する必要がある.本研究の目的は,B リーグにおいてクラッチタイムに出場する選手がチームの勝利にどの程度貢献しているかを定量的に評価し,勝率との整合性の高いクラッチタイムにおける選手評価指標を提案することである.以下の手順で分析を行う. 1. 基礎分析で当該選手個人のスタッツとそれ以外の出場している味方のスタッツが勝敗に及ぼす影響を明らかにする. 2. 既存EoCC の課題を踏まえ,新EoCC の提案を行う. 3. 提案する新EoCC の有効性を検証する. 4. 新EoCC を用いて,クラッチタイムにおけるチームのパフォーマンス評価の可能性を探る. 1 では,当該選手個人のスタッツと試合に出場している味方選手のスタッツが勝敗に及ぼす影響を分析し,試合の勝敗に影響する要因を明らかにする.2 以降では既存EoCC の改良が共通の目的である.2 では既存EoCC をB リーグに適用する際の課題を踏まえ,味方選手のプレーも考慮した新EoCC の提案を行う.3 では提案したEoCCが当該選手個人の試合貢献度を適切に評価できていることを確認する.4 では新EoCC を用いたチーム評価の可能性を探る.各分析の詳細は各節の冒頭で述べる.","excerpt_src":"はじめに"},{"id":"2024_basketa_1_59","year":2024,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"B リーグにおけるフリースローの成否の要因分析","members":"三浦友太朗，安藤雅和(千葉工業大学)","first_author":"三浦友太朗","affiliation":"千葉工業大学","code":"P1-15","abstract":"B リーグ 2 シーズンのフリースロー成功率を、クォーター別、ホーム/アウェイ別、チーム別、ポジション別に分析した。ポジション別分析でのみ有意差が認められ、フリースロー成功率と選手評価（被ファウル数）には関連性が見られた。","methods":["統計的検定"],"themes":["シュート","ポジショニング","選手評価"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"バスケットボールにおけるフリースローというのは試合中唯一相手からのディフェンスがない,シューターからすれば最高の状態で打てるプレーである.しかしどんなに上手な選手でもフリースローを100%決めることはできない.では実際プロの選手はどのくらいの成功率を誇るのだろうか.本研究では,元安陽一(2018)の研究をもとにフリースロー成功率と選手評価にどのような関係性があるか分析をおこなっていく.なお、 ここでいう選手評価というのは, 勝率にどれほど貢献しているのかということを示す.本研究の選手評価については,平均の被ファウル数の多さで判断していく. 被ファウル数が多い=1 試合のフリースロー試投数が多い,シュート機会が多く先行研究の内容から勝率に深く関わってくるという解釈ができる.そのため被ファウル数が多い選手ほど勝率に貢献し選手評価は高いといえる. 今回は, 全体の被ファウル数の平均より多いものを選手評価が高い,平均よりも低いものを選手評価が低いという判断基準でおこなっていく.","excerpt_src":"はじめに"},{"id":"2024_basketa_1_85","year":2024,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"選手のプレーと怪我の関連性について","members":"山下隆誠，与座英之，金子佑輔，山本義郎(東海大学)","first_author":"山下隆誠","affiliation":"東海大学","code":"P1-16","abstract":"Bリーグ2023-24シーズンのインジュアリーリスト登録選手と非登録選手のプレー内容を比較した。プレイバイプレイデータとボックススコアを用いて、ILL登録選手に乗りやすい選手の特徴を分析した結果、オフェンス貢献度が高い選手、ボールハンドラー、特定の出場時間帯の選手が怪我をしやすい傾向があることを明らかにした。","methods":["統計的検定","指標開発"],"themes":["選手評価","怪我・コンディション","試合の流れ"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"スポーツにおいて怪我はつきものである.特に選手生命を脅かす大きな怪我や今後の日常生活においても影響が出るような怪我もあり,コンタクトスポーツであるバスケットボールでは意図せず大怪我を負ってしまうケースは少なくない.さらに怪我によって選手契約に支障が出ることもある.しかし,ボディケアを大量に行っている選手であっても大きな怪我をすることはあり,全く行っていな選手が怪我をしない場合もある.今回はBリーグ 23-24シーズンにおいてインジュアリーリストに掲載された選手を対象にインジュアリーリストに載った選手と載っていない選手のプレーの違いについて見ていく. 2目的本研究ではインジュアリーリスト掲載選手に注目する.インジュアリーリスト掲載条件に 30日間リーグに登録できないとある.一週間に 2回試合があるとすると最低 8試合出場できない.これは B1リーグでは最低 60試合あるため凡そ 13%にあたる数字となっている.さらにチーム登録選手は B1,B2両方 10人から13人となっているため,一人長期離脱をするだけで大きな戦力ダウンとなる.またクラブ移籍などをする際に怪我歴のない選手かどうかというのも1つの指標となっている.海外挑戦という目標において怪我の有無は重要である.そこでインジュアリーリストに載った選手とそうではない選手を対象にプレーの違いをまとめることにより,その違いを明確化させることにより怪我のリスクを下げさせることが出来ると考える.","excerpt_src":"はじめに"},{"id":"2024_basketa_1_88","year":2024,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"バスケットボール試合におけるスターティングメンバーとベンチメンバーの影響分析","members":"門脇拓磨，宮本道子(長崎大学)","first_author":"門脇拓磨","affiliation":"長崎大学","code":"P1-17","abstract":"宇都宮ブレックスの2023-24シーズンの試合データにロジスティック回帰分析を適用し、試合結果に影響する要因を特定した。スターティングメンバーではトータルリバウンドとアシストがプラスの影響をもたらし、ベンチメンバーではアシストのみが有意であった。スターティングメンバーは試合主導、ベンチメンバーは試合補助の役割があると考えられた。","methods":["ロジスティック回帰"],"themes":["選手起用","チーム評価","戦術分析"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"バスケットボールは一般的に10分×4クオーターの合計40分の試合が行われ1チーム5人がコート上でプレーすることが可能であり、選手の交代は試合が止まったタイミングで行われ何度でも選手の交代が可能になっている。試合では攻撃と守備が交互に連続して入れ替わるテンポが比較的に素早いスポーツである。そのため、同じ選手が長い間コートに試合に出場してプレーを長く続けるのは困難であり、強度が高くなる試合ではなおさらのことである。そこでチームの選手層にもよるが、選手交代を行い、プレータイムを分散させ試合を進めていくことがほとんどである。そして今回はスターティングメンバーとベンチメンバーがどのように試合に影響を及ぼしているかを分析してそれぞれの役割と価値を示すことを目的とした。","excerpt_src":"はじめに"},{"id":"2024_basketa_1_3","year":2024,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"バスケットボールにおける焦りとポゼッション時間短縮の関係について","members":"小林莉緒，朝日弓未(東京理科大学)","first_author":"小林莉緒","affiliation":"東京理科大学","code":"P2-14","abstract":"バスケットボール試合における得点差や残り時間がポゼッション時間に与える影響を分析した。試合終盤で得点差が大きく離されている状況では、選手の焦りによってポゼッション時間が短縮される傾向が見られ、試合状況による心理的変化がパフォーマンスに影響することを示唆した。","methods":["統計的検定"],"themes":["試合の流れ","選手起用","怪我・コンディション"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"バスケットボールは、選手の心理状態や試合状況がプレイパフォーマンスに大きく影響を与えるスポーツであり、感情やプレイペースの調整は得点効率や試合の流れに直結する重要な要素とされている。中瀬(2017)[1]は、選手は良い流れと悪い流れを「継続性」と「強制性」という性質で捉え、感情が試合の流れの発生要因となることを指摘している。また、Zheng Cao(2015)[2]は、試合終盤や得点差が縮まるプレッシャーの大きな状況下では、パフォーマンスが低下する傾向があることを示唆している。一方で、試合状況に応じたプレイペースやオフェンスのテンポも、得点可否に影響を及ぼすことが報告されている。内山(2004)[3]は、オフェンスが「13 秒以内」に実行される速攻やアーリーオフェンスが試合結果に寄与するとしたが、大神(2014)[4]は、日本女子バスケットボールチームの分析から、ゆっくりとしたテンポが試合をコントロールし安定した得点を生む場合もあると述べている。さらに、Wang et al.(2024)[5]は、接戦の第4 クォーターにおけるテンポの選択がチームごとに異なり、戦術的な影響が勝敗に直結することを明らかにしている。図1のように、得点差が大きい・試合時間が残り少ない状況での選手の焦りがポゼッション時間を短縮するという点について先行研究では示されておらず、本研究ではこの点について検証する。プレッシャーによりミスが起こる過程を細分化し、ポゼッション時間の短縮を明らかにすることで、選手やコーチが状況に応じた最適な戦術を選択するための基盤を提供する。また、心理的要因を活用したメンタルサポートやコーチング手法の開発に貢献することも期待される。1.2 仮説武田(2019)[6]より、後半リードされている状況では,心の状態として「焦る」,技の状態として「点を取るしか考えられなくなってドリブルを中心とした個人プレーが多くなる」ことを参考に、試合終盤、得点差が離されている状況で選手の焦りが生じると仮定した。そのうえで、 「得点差が大きく離れた状況や試合終了が近づいている状況では、選手の焦りによりポゼッション時間は短縮する。」という仮説の検証を行った。","excerpt_src":"はじめに"},{"id":"2024_basketa_1_15","year":2024,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"NBAとB リーグのシュートに関する比較分析","members":"張皓輝，谷岡広樹(徳島大学)","first_author":"張皓輝","affiliation":"徳島大学","code":"P2-15","abstract":"NBA と B リーグの 2 シーズンのデータを用いて、シュート試投率と成功率を比較分析した。両リーグではシュート試投率に有意差がなかったが、成功率には有意差が見られ、特に 3 ポイントシュートの成功確率においてリーグ間の特性の違いが確認された。","methods":["回帰分析","統計的検定"],"themes":["シュート","戦術分析","勝敗要因"],"data":["イベントデータ","公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年,八村塁選手をはじめとした日本人選手がNBA で活躍することが増えてきた.また,2023 年には男子バスケットボール日本代表が,強豪国であるベネズエラやフィンランドに勝利し,48 年ぶりに自力での五輪出場の切符を手に入れた.五輪出場を決めた要因として,NBA でも活躍した田臥勇太選手や,日本代表の比江島慎選手は過去のインタビューで,B リーグが始まって以降,国内のレベルが全体的に上がっていることに加えて,3 ポイントシュートを徹底していたことを挙げている[1].実際,近年のNBA では3 ポイントシュートが増加し,3 ポイントシュートが勝敗に影響を与えていることもわかってきている[2].そこで本研究では,B リーグからNBA でも活躍できる選手をより多く輩出するために,NBA とB リーグのシュートを比較し,実際,どのような違いがあるかを明らかにする.","excerpt_src":"はじめに"},{"id":"2024_basketa_1_42","year":2024,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"B リーグにおけるクラッチタイムのトレンド及びパフォーマンスの可視化","members":"椎久翔太，市川淳(静岡大学)","first_author":"椎久翔太","affiliation":"静岡大学","code":"P2-16","abstract":"B リーグ 2023-24 シーズンのクラッチタイム分析を行い、eFG% と勝率の相関、チームの 3 ポイント戦術の傾向を可視化した。クラッチタイムでの 3 ポイント効率が勝利に関連することを示し、K-means クラスタリングにより選手のパフォーマンスタイプを分類した。","methods":["クラスタリング","可視化","統計的検定"],"themes":["試合の流れ","戦術分析","シュート"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"バスケットボールにおいて,試合終盤の接戦,すなわち「クラッチタイム」における選手およびチームのパフォーマンスは,試合の結果を決定する重要な要素とされている.クラッチタイムとは,試合終盤5 分以内において5 点差以内の局面のことを指す[1].この局面でのパフォーマンスに注目が集まるのは,クラッチタイムが試合の勝敗に直接的な影響を与えるためである.近年,日本においてもバスケットボールの関心は急速に高まっており,2024 年パリオリンピックでは,日本代表が強豪国と接戦を繰り広げた事例が見受けられる.具体的には,オリンピックの一戦において,日本代表は開催国フランスと延長戦までもつれ込む試合を展開し,試合終盤,残り16.4 秒で84-80 とリードしていたものの,最終的に94-90 で惜敗した.この試合では、ポイントガードの河村勇輝選手が29 得点を挙げる活躍を見せたが,クラッチタイムでの戦略や経験の差が勝敗を分ける結果となり,クラッチタイムにおける戦略の差が結果に反映された可能性がある[2].さらに,FIBA ワールドカップでは,日本代表がフィンランドに対し,4Q の勝負どころで河村勇輝選手の牽引により,98-88 で逆転勝利を収めた[3].こうした事例から,日本バスケットボールの競技力が向上し,クラッチタイムにおける戦術およびパフォーマンスの重要性が増していることが示唆される.本研究は,Bリーグのクラッチタイム分析を通じ,NBA データに偏重した既存研究のギャップを埋める.プレイバイプレイ分析により,単一のシュート確率等の単純な定量評価を超えた洞察を提供し,長期的なトレンドも見据えた分析を行い,日本バスケットボールに即した戦略的示唆を提案する.近年,バスケットボールにおけるクラッチタイムのパフォーマンスに関する研究が進展している.Sarilsr は, NBA の試合終盤におけるプレイヤーのパフォーマンスを定量化するため,独自の「クラッチ能力推定(EoCC)メトリクス」を導入し,これにより選手の試合終了間際の影響力を評価している[4].このようなクラッチパフォーマンスの分析は,選手の効率性やプレッシャー耐性への評価にも繋がり,試合の勝敗を左右する瞬間において重要な役割を果たすとされている.また,Oliver は,NBA ファイナルの試合データを用いてチーム戦略や選手貢献を詳細に分析し,バスケットボールの複雑な要素を定量化するための方法論を提示している[5].さらに,Jasinski らの研究では,試合スケジュールや休息がNBA チームのパフォーマンスに与える影響を分析している[6].この研究は,試合終盤における選手のスタミナや集中力がクラッチパフォーマンスに与える影響を示唆している.本研究では,試合展開で重要なクラッチタイムを中心にプレイバイプレイを定量的に分析し,B リーグ全体やチームごとの特徴を検討することを目的とする.","excerpt_src":"はじめに"},{"id":"2024_basketa_1_58","year":2024,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"Win-Lose Prediction in Team Sports and Player's Potential Assessment Beyond STATS","members":"山野邊敦史，清水泰隆(早稲田大学)","first_author":"山野邊敦史","affiliation":"早稲田大学","code":"[口頭]バスケ1","abstract":"バスケットボールを例に、確率過程モデルを用いてリアルタイムに試合の勝利確率を算出する方法を提案した。T-score 関数により試合の優勢度を定義し、既存スタッツに現れない潜在的に活躍する選手を抽出するための手法を示した。","methods":["確率モデル","時系列解析","シミュレーション"],"themes":["勝敗要因","選手評価","試合の流れ"],"data":["イベントデータ","公式成績データ"],"free_tags":[],"awards":["バスケットボール部門 優秀賞"],"text_insufficient":false,"excerpt":"本論文では,確率過程モデルを基に,各種チームスポーツにおいてリアルタイムに試合の優勢度を判定するための一般的方法を提案し,これを用いて既存のSTATS には現れないが潜在的には活躍している選手の抽出法を目指す.特にバスケットボールのデータを例に,試合の流れ,リアルタイムな勝利確率の算出,選手の潜在能力評価を行い,既存の評価手法との比較からその有用性を示す.","excerpt_src":"本文冒頭"},{"id":"2024_basketa_1_9","year":2024,"dept":"バスケットボール部門","dept_detail":"バスケットボール部門","title":"状態空間モデルに基づくバスケットボール選手の貢献度と相性の時間的変化の推定","members":"山田和宏，藤井慶輔(名古屋大学)","first_author":"山田和宏","affiliation":"名古屋大学","code":"[口頭]バスケ2","abstract":"B リーグの複数シーズンのデータを用いて、ベイズ的状態空間モデルにより、選手の貢献度と 2 選手ペアの相性の時間的変化を推定した。既存指標との相関検証により、提案モデルの妥当性を確認し、シーズン中の成長や調子の変化を捉えられることを示した。","methods":["機械学習","時系列解析","ベイズ統計"],"themes":["選手評価","チーム評価"],"data":["イベントデータ"],"free_tags":[],"awards":["バスケットボール部門 優秀賞"],"text_insufficient":false,"excerpt":"プロスポーツでは、選手の貢献度や相性を正しく評価することは重要な問題である。プロバスケットボールチームにおいて、それらを定量的に評価する指標は選手のスカウティングや年俸・契約年数の決定を行う場面のみならず、ロスターや出場ラインナップの編成を検討する際にも有益な情報となり得るほか、ファンの議論の活性化への寄与も期待される。近年では、バスケットボール選手やチームの定量評価は得点やアシストなどのベーシックスタッツだけでなく、Four Factors [6] に代表されるアドバンスドスタッツの活用が進んでいる。アドバンスドスタッツの中でも、オフェンス/ディフェンスの効率や貢献度を評価する際によく使用される指標として、100 ポゼッション当たりの得点数/失点数を表すORtg/DRtg とその差であるNetRtg や、出場時の得失点差を表すPlus-Minus が挙げられる。これらの指標は、ある1選手の出場時の値をそのまま用いると、同時に出場していた相手選手や味方選手の影響を受けるため、何らかの方法で調整を行うことが多い。例えば、Plus- Minus の代表的な派生指標であるRegularized Adjusted Plus-Minus (RAPM) [7] は、ある10 選手が同時に出場していた時間帯(スティントと呼ばれる)のPlus-Minus を、リッジ回帰により各選手の個別の貢献度に分解する。しかしながら、RAPM を含むほとんどの指標は選手個人の評価のみにフォーカスしたものであり、モデリング時に出場選手同士の相性を明示的に考慮せず、相性の効果を直接的に推定しない。この問題に対して、先行研究[8] はベイズモデリングにより選手貢献度と同時に2 選手の相性の効果を推定する手法を提案した。具体的には、National Basketball Association (NBA) の単年シーズンのデータを用いて、特定の2 選手ペアの効果(デュオ効果)を含めた説明変数間の相関が強いモデルのパラメータの事後分布を解析的に求め、安定かつ高速な評価値の算出を行った。しかし、この手法はシーズンを通して貢献度や相性の効果が一定であると仮定するため、それらの時間的変化を考慮しておらずシーズン中の成長や調子の良し悪しなどを捉えることが出来ない。別の先行研究[2] はシーズン中のある時点までの選手貢献度の評価を行っているものの、シーズン初期時点の評価は困難であった。そこで、本研究は状態空間モデルにより選手の貢献度や相性の時間的変化を考慮したモデリングを行う。選手・デュオ・ラインナップ・チームの効果の変動を捉えられるモデルを構築することで、より情報量の多い定量評価指標を作成可能にする。また、先行研究[8] の結果を基に事前分布を設定することで、膨大なパラメータに対して効率性・安定性の高い推定を行う。本研究では、選手相性の効果の時間的変化を考慮したモデルを初めて提案した。また、パラメータの信頼性を考慮した、ある短期間での定量評価指標を提案し、既存指標との関連からその妥当性が示唆された。","excerpt_src":"導入"},{"id":"2024_baseballa_1_4","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"接戦を制する能力の要因分析と再現性の検証","members":"長岡真和冬，関口良行(東京海洋大学)","first_author":"長岡真和冬","affiliation":"東京海洋大学","code":"P1-01","abstract":"NPBの過去3年間のデータを用いた相関分析とクラスタリングにより、勝ちパターン投手の失点率が僅差勝率と負相関を示し、先発投手失点率と得点数で実力が近いチーム間における僅差を制する要因が異なることが示唆された。","methods":["クラスタリング","統計的検定"],"themes":["勝敗要因","投手起用","投球・配球"],"data":["イベントデータ","公式成績データ"],"free_tags":["相関分析"],"awards":[],"text_insufficient":false,"excerpt":"本研究では、僅差に強いチームの特徴を見出すことを目的としている。各チームの年間成績から打撃・投手指標と、僅差に限定した勝率との相関を調べた結果、勝ちパターン投手の失点率との間に中程度の相関が見られた。その結果を踏まえて、さらに実力が近いチーム間の僅差での強さを比較した。具体的には、先発投手に限定した失点率と年間の得点数を年度別にz スコア化し、これらの二変数によるクラスタリングによって、実力が近いチームごとのクラスターを形成した。このクラスター内で再び各指標と僅差での強さを評価する指標とでの相関分析を実施した。その結果、クラスターごとに僅差を制するのに求められる能力が異なる可能性が示唆された。","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_13","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"打者能力と得点戦略の視点からみた送りバントの有効性の再評価","members":"猶江健心，高田理久，山口敦子(東京都市大学)","first_author":"猶江健心","affiliation":"東京都市大学","code":"P1-02","abstract":"ロジスティック回帰分析により、送りバントは得点期待値では有効でないが得点分散を低下させ、打者の打率が低く次打者の打率が高い場合に有効な戦術であること、状況に応じた使用が有効であることが明らかになった。","methods":["ロジスティック回帰","回帰分析"],"themes":["打順・采配","打撃","得点予測"],"data":["イベントデータ","公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球において「送りバント」は,試合の流れや得点戦略に影響を与える重要なプレーとして長年にわたり議論されてきた.特に,試合の重要な局面でランナーを進塁させる目的で用いられる送りバントは,戦術としての価値とリスクのバランスが多くの専門家の間で議論されてきている.近年では,セイバーメトリクスをはじめとするデータ解析技術の進歩により,送りバントの効果や有効性を定量的に評価する試みが増加し,否定的な結果が多く見られる[1].事実,予備解析として,送りバントの数が最も多いノーアウト一塁の状況で,そのイニングの得点の期待値をパ・リーグで計算したところ,送りバントをしなかった場合は0.78 点だが,した場合は0.73 点と僅かに下がる.その一方で,分散も下がるため,一塁ランナーがホームに帰る確率は送りバントをしなかった場合は0.283 だが,した場合は0.375 と上がることがわかった.つまり,状況を選んで使えば,送りバントが有効な場面がある可能性がある.そこで,本研究では,送りバントの戦術としての実効性を再評価するために,いくつかの環境要因,ランナーの状況と,打者や次の打者,さらにその次の打者の能力に着目して解析を行う.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_33","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"プロ野球における年俸評価要因の考察","members":"大澤紘人，鈴木秀男(慶應義塾大学)","first_author":"大澤紘人","affiliation":"慶應義塾大学","code":"P1-03","abstract":"定量的なセイバーメトリクス指標と定性的特徴量を組み合わせた重回帰分析により、年俸評価に本塁打、FA権、人気度、所属球団の経済力、守備指標が重要な要因であることが示唆された。","methods":["回帰分析","指標開発"],"themes":["選手評価","経営・制度","年俸・契約"],"data":["公式成績データ","外部データ併用"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"プロ野球では毎年年俸を決定するために契約更改が行われている.しかし,契約更改に対する選手の満足度が低いという現状がある.これには,選手側にとって,年俸の評価基準が不明瞭がために,不満を抱きやすいという背景がある[1]. 近年, セイバーメトリクス指標において統計的に野球を分析する潮流が見られ[2][3][4],年俸の評価基準もこれらを使って定量的に分析できると考えられる[5].また,「所属球団の資金力が高いと,選手に支払われる年俸も高くなりやすい」ことや「人気選手は球団への経済効果に大きく貢献し,年俸の評価にも好影響を与える」といった仮説を立てることで,定性的要因も含めて考慮に入れられる.これにより,年俸の評価軸をより正確に考察することができると考えられる.そこで本研究では,セイバーメトリクス指標などを定量的な特徴量,所属球団や人気度などを定性的な特徴量,推定年俸を目的変数とした回帰分析を行った.この分析を通じて,年俸評価要因を解明する.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_41","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"OERAモデルの改良とそれを用いた打順決定モデルの提案","members":"後藤亮太朗(大分大学)，小畑経史(追手門学院大学)，原恭彦(大分大学)","first_author":"後藤亮太朗","affiliation":"大分大学","code":"P1-04","abstract":"進塁規則を現実に即した確率に改良したOERAモデルを提案した。マルコフ連鎖とシミュレーションにより打順の1試合得点期待値を算出し、最適打順と最悪打順を特定してチーム成績との比較検証を実施した。","methods":["シミュレーション","確率モデル","最適化"],"themes":["打順・采配","チーム評価","戦術分析"],"data":["イベントデータ"],"free_tags":["マルコフ連鎖","OERA"],"awards":[],"text_insufficient":false,"excerpt":"打者の打撃能力を測る指標として打率や本塁打数などがあるが、それらの指標は打撃能力の一部のみしか評価することができない.そこで、Cover とKeilers [1] によってOERA (Offensive Earned Run Average) と呼ばれる総合打撃指標が提案された.OERA とは、1 人の打者が繰り返し打席に立った場合の1 試合(9 イニング) の得点期待値である.OERA を求めるための数理モデル、OERA モデルでは、野球のアウトカウントとランナーの位置から状態1 ∼25 を定義し、進塁の規則や打撃結果の種類を定め、打者の打撃成績から推定した確率を用いた25 次の推移確率行列を作成することで、モデル内で試合の展開を再現している(表1) .しかし、進塁の規則などは実際の試合に非常に近いとは言えず、現実の試合に即した値が算出できていないと考える.また、OERA では1 人の打者が繰り返し打席に立つという考え方をしているが、これを打順でも同様に考えることである打順の1 試合の得点期待値を求めることができ、その値を用いてその打順の提案と評価を行うことができるのではないかと考える.実際、打順の提案に関しては様々な研究がなされている[2, 3].しかしながら、状態推移のパターンやその確率は現実に即したものに変更したものは少ない.本研究では、現実の試合に即した評価値を算出するためのOERA モデルの改良とそれを用いた打順決定モデルの提案、そして実際の打線への本モデルの適用例の確認を行う.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_43","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"試合スケジュールと移動距離がチームの勝率に与える影響の分析","members":"谷津唯希，周娟(東京都市大学)","first_author":"谷津唯希","affiliation":"東京都市大学","code":"P1-05","abstract":"ロジスティック回帰分析により、ゲームタイプと移動距離がチームの勝率に及ぼす影響を検証した。ゲームタイプは統計的に有意な影響を示したが、移動距離の直接的な影響は統計的には有意でないことが示唆された。","methods":["ロジスティック回帰","統計的検定"],"themes":["勝敗要因","チーム評価","怪我・コンディション"],"data":["公式成績データ"],"free_tags":["スケジュール分析"],"awards":[],"text_insufficient":false,"excerpt":"日本プロ野球(NPB)では、近年のプレースタイルやトレーニングの高度化に伴い、選手に求められる身体的・生理的な負荷が増大している。シーズンを通じて143試合(2023年シーズン)という長い日程が組まれ、頻繁な移動や過密なスケジュールによって、選手の体力と集中力が大きく影響を受ける状況が生じていると考えられる。さらに、試合の増加に伴う疲労の蓄積がパフォーマンスに及ぼす影響も無視できない。特に、移動距離や連戦のスケジュール、ホーム・アウェイの差異といった要因は、選手の身体的負荷や回復に大きな影響を与えると考えられる。特に長距離移動を伴うアウェイ連戦や連日の試合によって生じる過密スケジュールは、疲労の蓄積やサーカディアンリズム(概日リズム)の乱れを招き、選手の睡眠の質を低下させ、十分な回復が得られない状況をもたらす可能性がある。こうした背景から、試合スケジュールの構成や移動の負荷がチームの勝率に与える影響についての研究が注目されている。本研究では、2021年から2023年のNPB試合データをもとに、移動距離、連戦シーケンス、およびホーム・アウェイの条件が勝率に及ぼす影響を分析する。各要因がNPBにおけるパフォーマンスにどのような影響を及ぼすかを明らかにし、選手のコンディショニングやチーム戦略への示唆を得ることを目的とする。","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_45","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"環境の変化が与える打者のパフォーマンスへの影響","members":"中島陽，樫山武浩(大阪経済大学)","first_author":"中島陽","affiliation":"大阪経済大学","code":"P1-06","abstract":"ロジスティック回帰により試合開始時間、屋内外環境、移動距離が打率と勝敗に与える影響を分析した。季節やホーム・アウェイでは傾向が見られたが、これら環境要因の総合的な影響は統計的には限定的であることが示された。","methods":["ロジスティック回帰"],"themes":["選手評価","打撃","怪我・コンディション"],"data":["公式成績データ"],"free_tags":["環境要因分析"],"awards":[],"text_insufficient":false,"excerpt":"近年、スポーツ分析の分野では、選手のパフォーマンスを予測する際に、環境的要因を考慮することが注目されている。特に、野球はスタジアムごとの特性が顕著に異なるスポーツであり、環境要因が選手のパフォーマンスに及ぼす影響を調査することは、選手の適応力を理解し、チーム戦略を最適化する上で重要となる[1]。日本のプロ野球は年間143 試合で構成され、主に同一チームとの3 連戦を1 カードとして、火曜日から日曜日に試合が開催されている。シーズン中、約70 試合はホームゲーム、残り約70 試合はビジターゲームとして行われる。特に、関東以外に本拠地を置く球団はシーズンの半分を地方遠征で過ごすため、試合前の移動距離が長くなる傾向にある。セ・リーグは新幹線、パ・リーグは新幹線と飛行機が一般的である。また、セ・リーグの本拠地は東京・横浜・名古屋・兵庫・広島と東海道新幹線沿線にあるため、移動の利便性に恵まれている。一方、パ・リーグは北海道から福岡まで幅広いため新幹線に加えて飛行機で移動することが多い。実際に、年間での移動距離は約3 万km というデータもあり、選手のコンディションに影響を及ぼす可能性が高いと言われている。以下は、主な球団の本拠地スタジアムと所在地である。• 巨人: 東京ドーム(東京都文京区)• DeNA: 横浜スタジアム(横浜市中区)• 阪神: 阪神甲子園球場(兵庫県西宮市)• 広島: MAZDA スタジアム(広島市南区)• 中日: ナゴヤドーム(名古屋市東区)• ヤクルト: 明治神宮球場(東京都新宿区)• 西武: メットライフドーム(埼玉県所沢市)• ソフトバンク: 福岡PayPay ドーム(福岡市中央区)• 楽天: 楽天生命パーク宮城(仙台市宮城野区)• ロッテ: ZOZO マリンスタジアム(千葉市美浜区)• 日本ハム: エスコンフィールドHOKKAIDO(北海道北広島市)• オリックス: 京セラドーム大阪(大阪市西区)本稿では、試合前の移動距離、スタジアムの変化、屋内から屋外・屋外から屋内、季節、ホーム・アウェイといった環境要因が、打者の打率、勝敗にどのような影響を与えるのかを分析することを目的とする。この分析を通じて、環境的要因が打率、勝敗に与える影響を明らかにし、選手やチームの戦略に役立てることを目指す。","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_48","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"リリーフ投手における外的要因によるパフォーマンスへの影響の視覚的分析","members":"松澤颯太，大屋光平，伊藤正彦(北海道情報大学)","first_author":"松澤颯太","affiliation":"北海道情報大学","code":"P1-07","abstract":"リリーフ投手の球速、制球力、奪三振率が登板間隔や得点差などの外的要因に応じて変動する傾向を回帰曲線で可視化した。登板間隔の適切な設定がパフォーマンス安定性と関連することが示唆され、投手ごとの特性に応じた起用法の重要性が示された。","methods":["可視化","時系列解析"],"themes":["選手評価","投手起用","怪我・コンディション"],"data":["イベントデータ"],"free_tags":["パフォーマンス管理"],"awards":[],"text_insufficient":false,"excerpt":"リリーフ投手の重要性は年々増しており、彼らの起用法やパフォーマンス管理がチームの勝敗に大きな影響を及ぼしているとされる。特に、メジャーリーグベースボール(MLB)におけるリリーフ投手の影響力について、Meyerson [1] は、効果的なリリーフ投手の起用は試合の戦況を左右する重要な要素であると指摘している。これにより、リリーフ投手の登板タイミング、状況に応じた起用方法の最適化がますます求められていることがわかる。野球におけるリリーフ投手のパフォーマンスは、試合の流れや勝敗に直接的な影響を与える重要な要素である。従来、登板間隔が投手の疲労度や球速の低下、制球力の変動に影響を与える可能性は指摘されてきたが、具体的な数値に基づく検証は不十分であった。気温、球数などの要因が投手のコンディションに与える影響の解析などは行われていたが[2]、リリーフ投手に関しては登板状況の違いがパフォーマンスに及ぼす影響については十分な検討がされていない。本研究の目的は、リリーフ投手のパフォーマンス指標として球速、制球力、奪三振率の3 つの要素に注目し、登板間隔や得点差、試合日といった外的要因に応じた変動を視覚的に明らかにすることである。これによりリリーフ投手のパフォーマンススコアの変動に関するデータに基づく新たな知見を提供することを目指している。本研究では、外的要因におけるリリーフ投手のパフォーマンス指標を可視化し、投手ごとに分析を行った。異なる登板状況におけるパフォーマンススコアの変動傾向に基づいて投手を複数のパターンに分類し、特徴を持つグループを明らかにした。","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_52","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"自チーム得点直後の先発投手の失点要因の分析","members":"加瀬稔弥，原田海透，山本義郎(東海大学)","first_author":"加瀬稔弥","affiliation":"東海大学","code":"P1-08","abstract":"クラスタリング手法により自チーム得点直後のイニングにおける先発投手の失点パターンを6つに分類した。分析結果から投手を「良い流れ」と「悪い流れ」に分類し、試合展開への影響要因を明確化した。","methods":["クラスタリング","次元削減"],"themes":["選手評価","投手起用","試合の流れ"],"data":["イベントデータ"],"free_tags":["流れ分析"],"awards":[],"text_insufficient":false,"excerpt":"野球の試合を観戦していると, 特に先発投手が序盤に安定せず失点する場面が多く見られる. なかでも, 自チームが得点した直後のイニングで失点をしたり, ランナーを溜めてピンチを招いたりする場面が目立つように感じる. このような状況が生じる原因として, ボールが先行してカウントが不利になる場合, ヒットを打たれてランナーを出す場合, あるいは味方のエラーによるランナーの出塁など, 投手によって様々なパターンが考えられる. 佐藤(2023)は, ヒットや四死球などの出塁が連続することで得点期待値がどのように変化するかを分析し, 1イニングにおける打席結果の順序が期待得点に大きな影響を与えることを明らかにしている. このような研究は, 野球における「流れ」が試合展開に及ぼす影響を示唆している. 野球における「流れ」の一つとして, 自チーム得点直後のイニングでの先発投手の失点が挙げられる. 自チームが得点した直後に失点を重ねると, 試合の 「流れ」 が悪化し, チームの敗因につながることが少なくない. また, 伊藤 ・ 宮本 (2018)は, 野球における「流れ」を試合状況および勝敗に影響するプレイの成功状況から形成される試合の優劣であると仮定し, これを数値的に算出するモデルを構築している. この研究により, 「流れ」 の可視化が可能となり, 試合展開の重要性が改めて示されている. さらに, 永田・水田(2019)は階層ベイズモデルを用いて, 攻撃要因, 守備要因, 試合環境要因の3つを説明変数とし, 大量得点や逆転を従属変数として設定することで 「流れ」 の定式化を試みた. その結果, チーム間で差が認められる要因とそうでない要因が明らかになり, 目に見えない 「流れ」 の定義化を可能とした. しかし, 自チームが得点した直後のイニングにおける研究は, 見当たらない. 得点直後のイニングでの失点に関する研究は少なく, その影響を探ることはこれまでの研究において十分に解明されていない. こうした背景から, 自チーム得点直後の先発投手の投球内容は極めて重要であると言える. 実際, テレビやラジオ中継では, 解説者が得点直後のイニングの重要性を指摘することが多く, ネット記事においても「流れを掴んだ」, 「流れをもたらした」といった表現が頻繁に見受けられる. そこで, 本研究では, 「流れ」の1つと考えられる自チーム得点直後の先発投手の失点要因として考えられる変数に着目し, クラスタリングを行い, クラスターごとの特徴について調べる.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_57","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"投手特徴による分類と打者相性を考慮した継投推薦手法の提案","members":"家田晴子，菊池みくり，濱口巧磨，佐藤彰洋(横浜市立大学)","first_author":"家田晴子","affiliation":"横浜市立大学","code":"P1-09","abstract":"2021年から2023年における日本プロ野球のデータを用いて、中継ぎ投手の球種傾向などの19の特徴量から階層的クラスタリングにより5つのクラスターに分類した。村上宗隆ら3選手を対象に、各クラスター内の投手との対戦成績をwOBAで比較した結果、打者によって苦手なピッチャータイプが異なることが明らかになった。","methods":["クラスタリング","統計的検定"],"themes":["選手評価","投手起用","捕手・バッテリー"],"data":["公式成績データ"],"free_tags":["相性分析"],"awards":[],"text_insufficient":false,"excerpt":"野球において、継投計画は失点数を左右する重要な因子である。特に近年は先発完投の傾向が薄れ、 中継ぎ投手による継投の重要性は増している。 境田らの研究[1]では、継投計画が失点数を大きく左右し試合の勝敗を分けてしまうことが述べられている。この研究では、MLB の試合データを用いて機械学習によって失点を予測するモデルを実装し、先発も含めた継投計画の最適化を図るシステムを提案している。しかしこの方法においてはデータ数が十分な投手でないと正確に予測しにくい。そこで、本研究は中継ぎ投手と打者の相性を考慮し起用する投手をデータから決定することを目的とする。はじめに投手のプレーデータをもとにクラスタリングを行い、中継ぎ投手をその特徴ごとに分類する。また、打者に対してどのクラスターに属する選手を起用するのが失点リスクを抑えられるか計算することで、投手と打者の相性を明確化する。この手法を用いることによって、対戦記録のない投手と打者であっても、所属するクラスターに属する他の投手との対戦記録から失点リスクを推測することができる。","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_62","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"日本プロ野球における守備シフトが得点能力に与える影響分析","members":"小笠原侑平，五島圭一(横浜国立大学)","first_author":"小笠原侑平","affiliation":"横浜国立大学","code":"P1-10","abstract":"2021年から2023年の日本プロ野球データに傾向スコア法とIPW法を適用し、守備シフトの因果効果を推定した。打席単位の分析ではシフトが得点能力を向上させ、打者単位の分析でも一部条件下で有効性が示唆されたが、総じて守備シフトの有効性は確認されなかった。","methods":["因果推論","統計的検定"],"themes":["守備","戦術分析","勝敗要因"],"data":["イベントデータ"],"free_tags":["守備シフト","傾向スコア"],"awards":[],"text_insufficient":false,"excerpt":"守備シフトは,試合展開を大きく左右する要素として現代野球において中心的な役割を担う重要な戦術である守備シフトとは,試合状況や相手打者にあわせて,通常の守備位置から選手の配置を変更することで,打球の捕球率を高める手法である例えば,メジャーリーグベースボール(MLB) の大谷翔平選手は打球を引っ張る傾向があることから,一二塁間に内野手を多く配置する対策がなされる場面が多く見られた.守備シフトは1870 年代からMLB で使われてきた古い戦術ではあるが,2000 年代に入り,「セイバーメトリクス」が普及し,打者ごとの傾向や打球方向を詳細に解析できるようになると,守備シフトはより広範囲に,そして戦略的に用いられるようになった[1]. しかしながら,この戦術が進化する一方で,ヒットが出にくくなるため,試合の展開が単調になりやすく,娯楽性が低下するという課題も浮上した.そのため,MLB では2023 年から極端な守備シフトを規制するルールが導入された.実際に,Markes et al.(2024) ではMLB では特に左打者に対して守備シフトが有効であったことを報告している[2].一方で,日本プロ野球(NPB) ではMLB のような極端な守備シフトを用いられていないことを理由にその規制するルールについて2024 年時点では導入が見送られた.表1 1 試合あたりの守備シフト実施回数NPB MLB 2021 0.46 22.86 2022 0.15 25.09 (出所) Baseball Savant より筆者作成表1 は守備シフト規制導入直前シーズンにおけるMLBとNPB の1 試合当たりの守備シフト回数を示しており, NPB における実施回数はMLB に比べて大幅に少ないことが分かる.しかしながら,将来的に国際的なルールの統一が進む中で,守備シフト規制の導入が議論される可能性は高く,その影響を定量的に評価することは重要な課題と言える.そこで,本研究ではNPB において守備シフトの適用が得点能力に与える影響について分析を行う.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_76","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"野球の試合展開を踏まえたハーフイニング予測モデルの構築","members":"宇佐美翔大，中野暁登，岩田侑己，大西隆之介，椎久翔太，市川淳(静岡大学)","first_author":"宇佐美翔大","affiliation":"静岡大学","code":"P1-11","abstract":"LSTMを用いて、過去のイニングのイベント発生回数から次のハーフイニングのプレーイベント発生回数を予測するモデルを構築した。通常のMSEに代わり重み付きMSEを損失関数として採用することで、頻繁に起こる事象と稀な事象の両方を予測可能にし、モデルの表現力を向上させた。","methods":["深層学習","ニューラルネットワーク","時系列解析"],"themes":["試合の流れ","勝敗要因","戦術分析"],"data":["イベントデータ"],"free_tags":["ハーフイニング予測"],"awards":[],"text_insufficient":false,"excerpt":"野球における戦略的な意思決定をする上で、試合展開を予測することは重要である。試合展開に関する表現として、「流れ」という言葉がしばしば用いられる。「良い流れが来ている」、「流れが悪い」といった表現は、野球ファンを含む多くの関係者にとって馴染み深いものだろう。しかし、この「流れ」の捉え方は個人の主観や経験に依存しているため、それから意思決定を行うことの妥当性には疑問がある。「流れ」の捉え方に関する主観的な説明から脱却し、客観的なデータに基づいた予測可能な試合展開を議論するための新たな視点を現場に提供することを本研究の意義とする。","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_79","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"得点効率を最大化する野球戦略のデータ分析","members":"鈴木叶大，津賀結菜，丸山瑛士，山田大樹，安井清一(東京理科大学)","first_author":"鈴木叶大","affiliation":"東京理科大学","code":"P1-12","abstract":"新たな指標「進塁スコア」を作成し、ランナーがいる状況での打者の進塁パターンを評価した。2021年から2023年のデータから進塁スコアとチーム総得点の相関係数は0.7から0.8となり、一三塁の状況を作り出せるチームが好成績を残すことが明らかになった。","methods":["カーネル密度推定","指標開発"],"themes":["打撃","得点予測","勝敗要因"],"data":["イベントデータ"],"free_tags":["進塁スコア"],"awards":[],"text_insufficient":false,"excerpt":"近年,スポーツ業界ではデータ分析技術の発展により,選手パフォーマンスの向上,戦略的意思決定の最適化,観客体験の強化など,多岐にわたる分野で進展がみられる.本研究では,野球における攻撃効率を定量的に評価するため,「進塁スコア」を新たに作成し,得点との相関分析を行うことを目的としている.特にランナーがいる状況下での打者の得点効率に関連する進塁パターンや,効果的なバッティング戦略をチームごとに比較することで,攻撃効率の向上に寄与する要因を多角的に評価する.","excerpt_src":"序論"},{"id":"2024_baseballa_1_95","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"打球方向に関連する要因:主成分分析による探索","members":"小野遥滋，矢野望夢，寺西蓮，古川恭治(久留米大学)","first_author":"小野遥滋","affiliation":"久留米大学","code":"P1-13","abstract":"2021年から2023年のデータから規定打席に2回以上到達した打者48名を対象に、投手利き手、球速、球種など打球方向への影響をベータ回帰で分析した。主成分分析で次元削減し、k-means法で打者を分類した結果、右打者は3クラスタ、左打者は2クラスタに分類され、各クラスタで異なる打球方向特性を持つことが明らかになった。","methods":["回帰分析","クラスタリング"],"themes":["打撃","ポジショニング","戦術分析"],"data":["イベントデータ"],"free_tags":["主成分分析"],"awards":[],"text_insufficient":false,"excerpt":"打者によって打球方向の特徴は大きく異なり,特に特徴的な打者に対しては専用の守備シフトを使用することで,試合内容や結果に大きな影響を与えることが知られている[1].打球方向には,打者の特徴や投手の特徴,投球戦術,ランナーやアウトカウントなどの試合状況など,様々な要因が影響を及ぼすと考えられる[2].各打者の打球方向の特徴を詳細に把握することで,守備側にとっては守備位置の調整や戦略の構築が可能となり,一方で打者側にとっては,自身の打球方向の特徴を理解することでフォームやタイミングの改善を図り,パフォーマンス向上に役立てることができる.また,チームにとっても,特定の状況と打球方向に関連した戦術的なニーズに応じた選手の選定や活用が可能となる.本研究の目的は,NPB(日本プロ野球) 内の主力打者における打球方向に影響を与える要因を探索し,各要因の影響度を定量的に評価することである.また,それらの結果を基に,打球方向の特徴に基づいた打者の分類を行い,打球方向戦略のさらなる最適化を目指す.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_5","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"野球における粘りの影響 ～試合結果と選手パフォーマンスへの貢献分析～","members":"荻山烈，朝日弓未(東京理科大学)","first_author":"荻山烈","affiliation":"東京理科大学","code":"P2-01","abstract":"プレー情報データを用いた分析により、打席内での粘りが投手交代を促進し得点期待値や勝率が上昇すること、同点時における粘りの影響がより大きいことが明らかになった。","methods":["回帰分析","統計的検定"],"themes":["投手起用","得点予測","投球・配球"],"data":["イベントデータ","公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球の成績指標には、データを統計的に分析する手法であるセイバーメトリクスがある。その中の 1つに、P/PA (Pitches per Plate Appearance)、すなわち「1 打席あたりの被投球数」を表す指標がある。P/PA の値が高いことは、選球眼の良さや粘り強さを示す一方、追い込まれる場面が増えるリスクも示唆している。P/PA に関する先行研究では、Sal Baxamusa (2007) が打撃成績と P/PA の間に明確な関連がないことを報告している。また、Rick Soisson (2018)は、メジャーリーグにおいて平均 P/PA が高いチームが必ずしもプレーオフに進出していないことが示されている。しかし、これらの研究は主に P/PA と個人の打撃成績、またはチームの最終成績に焦点を当てており、1 試合の中でチーム全体への影響を分析したものは少ない。また、Owen Watson (2014) は、球数制限が重要視される現代の野球において、粘りがチームの戦略として意識されているのであれば、それを定量化すべきだと述べている。以上を踏まえ、本研究では P/PA をはじめとする粘り※1 がチームに与える影響、特に投手交代や他の打者への影響に着目し、選手の貢献度を明らかにすることを目的とする。","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_10","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"新しい観点から見る投手における制球力の評価","members":"西脇諒，露原秀斗，山口翔矢，阿部航大，白井康之(大東文化大学)","first_author":"西脇諒","affiliation":"大東文化大学","code":"P2-02","abstract":"投球座標と捕手構え位置座標のユークリッド距離を用いた新たな制球力評価指標により、投手ごとに試合状況や捕手との相性による制球の有意な差が示され、バッテリー間の相性が制球に影響することが明らかになった。","methods":["空間分析","統計的検定"],"themes":["投球・配球","捕手・バッテリー"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"制球力は投手の力量を測る上で重要な指標である。 代表的な指標としてK/BB(奪三振/与四球)があるが、 優秀な投手でも三振を狙う投手もいればフライやゴロを狙う投手もいる。そのため、投手のタイプによって分子である奪三振の数が変化することから、 K/BB を用いて制球力を正確に測ることは難しい。この考えから、これとは異なる観点から投手の制球力を測ることが可能なのではないかとの推測のもと、本研究では提供されたデータを用いて、実際に投球された球がキャッチャーが構えた場所からどれくらい離れているかという観点で検証を行った。 投手によっては、ピンチの場面など試合状況に応じて制球の違いが出ると考えられる。 そこで、試合状況の中でも特に変化が出そうな打順・イニング ・ 月別 ・ ホームビジター ・ ランナー状況に条件を絞って検証を行った。加えて、投手だけでなく捕手の違いによっても変化が見られると考え、 検証を行った。その結果、 投手ごとに状況に応じた制球の違いが見られた。1. はじめに制球力が良い投手は、四死球が少なくテンポ良くかつ球数を抑えながら効率よくピッチングすることで、 試合の流れを引き寄せるイメージがある。しかしながら、優秀な投手でも試合状況によっては制球が乱れることで、バッテリー間の考えに変化が生じ、 配球にも変化が出ると考えられる。そのため、試合状況と配球傾向の両面において制球力の分析を行った。 新たな指標から各状況下における投手の制球力・バッテリー間の相性を明らかにすることが本研究の目的である。","excerpt_src":"概要"},{"id":"2024_baseballa_1_16","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"ロジスティック回帰モデルを用いたNPBとMLBの被打と失点の特性分析","members":"河原寛治，谷岡広樹(徳島大学)","first_author":"河原寛治","affiliation":"徳島大学","code":"P2-03","abstract":"NPBとMLBの1球データを用いたロジスティック回帰分析により、被打と失点の特性に違いがあり、失点予測モデルがNPBで0.844、MLBで0.887のAUCで高精度であり、両リーグの投手特性に差異があることが示唆された。","methods":["ロジスティック回帰","統計的検定"],"themes":["投球・配球","勝敗要因"],"data":["イベントデータ","公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年,NPB (Nippon Profesional Baseball) からMLB (Major League Baseball) に国籍を問わず挑戦する選手が増加している.大谷翔平選手やダルビッシュ有選手のように,NPB でもMLB でも活躍している選手はいるが,NPB では活躍したものの,MLB では活躍できていないケースもある.吉田正尚選手や田中将大選手がNPBとMLB には違いがあることを述べている[1] [2].そこで本研究では,投手の目線で,NPB とMLB における被打や失点の特徴の違いを明らかにするために,NPB とMLBの1 球データをもとに,1 打席ごとの投球内容とその結果について分析を行う.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_24","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"戦評テキストに基づいたプロ野球の試合時間に影響を及ぼす要因解析","members":"高澤峻平，原愛美里，阿部雅大，齊藤光汰，齊藤史哲(青山学院大学)","first_author":"高澤峻平","affiliation":"青山学院大学","code":"P2-04","abstract":"形態素解析、TF-IDF、NMF、ランダムフォレスト回帰により戦評テキストから抽出した特徴量を分析した結果、小刻みな得点、投手崩壊、接戦に伴う選手交代などの試合展開が試合時間に影響することが示唆された。","methods":["自然言語処理","機械学習","シミュレーション"],"themes":["試合の流れ","選手起用","戦術分析"],"data":["外部データ併用"],"free_tags":["戦評テキスト"],"awards":[],"text_insufficient":false,"excerpt":"近年の野球界では試合時間の短縮が求められている.試合が長引くことで試合終了時間が遅くなり,これに伴う様々な課題が指摘されている.終了時間が遅くなることで,観客の疲労や帰宅時の負担増,球場の運営上の問題,選手のコンディショニング管理などが挙げられる.特に,観客にとっての不利益はファンの獲得を考える上で重要な課題であるといえる.近年における若い世代においては短時間でよりスリリングな試合が求められる傾向にあり,試合時間が定められているサッカーやバスケットボールといった他のプロスポーツとのファン獲得の競争において試合短縮は不可欠といえる.こうした中で,MLB ではピッチクロックを導入することで投球間隔の時間が制限され始めており,NPB でもイニングインターバルや投手交代時の時間の制限が設けられるなどの様々な施策が講じられている.このような時間制限によって確実な試合短縮が望める一方で,これらの対策で削減できる時間の大きさは限界がある.野球における試合時間は試合の展開や采配の影響を大きく受けることから,これらの要因をデータに基づいて理解する必要があるといえる.そこで,本研究では試合毎に異なる展開の内容を解析することによって,試合時間に影響を及ぼす野球の要因の検出を試みる.試合の内容を表現するデータとして本研究では戦評データに着目した.戦評データは各試合に対して試合の内容を文書データとしてまとめたものであり,このデータからテキストマイニングにより特徴量を抽出できれば,その特徴量と試合時間の関連性の解析が可能になると考えられる.以上より,本研究では試合時間に対して影響を及ぼす要因を戦評のテキストデータから抽出することで試合時間と試合内容の関連性について分析する枠組みを提案する.実データの解析に提案法を適用することで提案法の挙動を確認しつつ,NPB における試合内容と試合時間の関連性について考察する.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_29","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"LightGBMを用いたスライダーによる三振奪取要因","members":"新垣快斗，竹本帆希，角岡篤志，原田稜大，宿久洋(同志社大学)","first_author":"新垣快斗","affiliation":"同志社大学","code":"P2-05","abstract":"LightGBMとSHAP値を用いた分析により、スライダーによる空振り三振奪取要因として最終球速度と直前の直球系投球が重要で、利き手の組み合わせにより最終球の高さの効果が異なることが明らかになった。","methods":["勾配ブースティング","クラスタリング","機械学習"],"themes":["投球・配球","戦術分析"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["奪三振"],"awards":[],"text_insufficient":false,"excerpt":"プロ野球において, 投手が最小失点で相手を抑えることは勝利を掴み取るための重要な要素である. 特に近年のプロ野球では, 1 試合あたりの平均得点が減少傾向にあり(表1), 最小失点に抑えることの重要性が高まっている. 最小失点に抑えるための要素の一つとして奪三振がある. 奪三振は味方の守備を介さずにアウトを取る方法であるため,味方の守備力やグラウンド状況など, 投手がコントロール不可能な事象の影響を受けない, 言わば究極的なアウトの取り方だと言える.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_36","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"機械学習を用いた栗山ジャパン投手選出の傾向とプレミア12との相違","members":"天久昂，志村隆太，白井悠悟，佐藤浩志(明星大学)","first_author":"天久昂","affiliation":"明星大学","code":"P2-06","abstract":"ランダムフォレストを用いて2022年投手成績から代表選出基準を特定した。奪三振数と速球最高速度が重要指標であることを明らかにし、WBC2023年選出とプレミア12選出の基準の相違を比較検討した。","methods":["機械学習","統計的検定"],"themes":["選手評価","投手起用","経営・制度"],"data":["公式成績データ"],"free_tags":["ランダムフォレスト"],"awards":[],"text_insufficient":false,"excerpt":"プロ野球における最高峰の国際大会といえば、World Baseball Classic(以下、WBC)である。2006 年3 月に16 か国が参加した第1 回大会を皮切りに、現在では世界20 の国と地域が参加する大規模な大会となり、日本国内外で高い注目を集めている。しかし、日本国内においてWBC に出場する選手の選出基準は依然として明確ではなく、メディアやSNS では選出基準に関する議論が絶えない状況である。本研究では、2023 年のWBC において出場した投手、辞退した投手、および選考試合に招集された投手(以下、これらを「代表選手」と表記し、該当投手は表1 に示す)を対象に、機械学習を用いて選出基準となる特徴量を特定し、その最小の組み合わせを明らかにする。また、2024 年に開催中のWBSC 世界野球プレミア12(以下、プレミア12)についても、上記で求めた選出基準を基に仮想的に「栗山ジャパン」を構築し、現在の代表選手と比較検討する。なお、メジャーリーグ所属選手については別途分析が必要と判断し、本研究の対象から除外する。","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_37","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"得点低下の探索的分析","members":"大平悠介，金子雄祐，出口和希，氏原なつき，中村亘，伴地芳啓(早稲田大学)","first_author":"大平悠介","affiliation":"早稲田大学","code":"P2-07","abstract":"2021年から2023年のNPB得点減少要因を統計検定により分析した。凡打割合増加と二塁打・本塁打減少が主因であり、特にゴロの守備範囲内への打球と強い打球フライの飛距離低下が得点低下をもたらしたことを明らかにした。","methods":["統計的検定","時系列解析"],"themes":["勝敗要因","打撃","得点予測"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["飛距離分析"],"awards":[],"text_insufficient":false,"excerpt":"2023 年の NPB における、1 試合平均得点は3.48 点であった。図 1 に 2 リーグ制が開始された1950 年から 2023年までの1 試合平均得点を示した。2018 年を境に得点が減少していることが分かる。図 1 1 試合平均得点得点が変化する要因は様々なことが考えられるが、大幅な変化をもたらす要因として、ボールの変更といった外的要因が挙げられる。過去の例を挙げる。1978 年から 1980 年の飛ぶボールミズノ社製のボールが他社製のボールよりも10 数メートル飛ぶ反発力が高いボールであり、同ボールを導入した球団の打率 ・ 本塁打数 ・ 得点数が大幅に増加した。このことが発覚した翌年の1981年に同ボールの使用を禁止し、本塁打の数が減少した[1]。2011 年と 2012 年の統一球問題2010 年までは球団ごとに異なるボールが使用されていたが、2011 年から12 球団全てでミズノ社製の低反発ゴム材を用いた統一球が採用された。 この変更により2010 年と比較して2011 年、2012 年では、 本塁打数が激減し、 得点数も大幅に減少した。統一球の反発力を検査したところ、反発係数の基準値(0.4134 - 0.4374)を下回っていることが判明した。2013 年には基準値を下回らないボールが採用され、本塁打数は2012 年より増加した[2]。上記の例以外にも、2001 年から2004 年にも飛ぶボールが採用されており、 実際に得点が増加している。 このように、 ボールの変更による得点の大幅な変化は、 たびたび発生する。近年は大幅な環境の変化がないが、得点が下がった要因として、ボールによる影響は噂されている。また、 得点が入り辛い、 いわゆる投高打低の環境は野球を観戦するファンにとって退屈である。この環境が長く続けば、ファンの野球離れを加速させる要因の1 つになると考えらる[3,4]。そこで本研究では、2021 年から2023 年にかけて得点が減少した要因を探索的に分析した。なお、 本研究で用いたデータは2024年度スポーツデータサイエンスコンペティションにて提供された2021 年から2023 年までのNPB 公式戦 ・ 交流戦の試合打撃データ、 選手データ、 プレー情報データを使用している。","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_54","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"救援投手を対象とした被出塁予測モデルの作成とSHAPによる要因分析","members":"西本渓吾，荒川哲至，鈴木海友(東京理科大学)，中川智之(明星大学)，小林正弘(東海大学)，松澤智史(東京理科大学)","first_author":"西本渓吾","affiliation":"東京理科大学","code":"P2-08","abstract":"勾配ブースティング手法によるLightGBMで救援投手の被出塁を予測し、SHAPにより特徴量の寄与度を分析した。対戦打者の出塁率と投手の直近成績の球速差が最も重要であり、投手の調子が被出塁に大きく影響することが明らかになった。","methods":["機械学習","勾配ブースティング","SHAP・説明可能AI"],"themes":["選手評価","投手起用"],"data":["イベントデータ"],"free_tags":["LightGBM"],"awards":[],"text_insufficient":false,"excerpt":"プロ野球の采配において,救援投手として起用する選手の選択は,試合終盤の展開を左右するため重要である.実際,2024 年プロ野球でリーグ優勝を達成した読売ジャイアンツ,福岡ソフトバンクホークスは救援防御率が各リーグ1 位である.本研究では,救援投手に注目した調子の評価を行う.先発投手の調子については直近の数試合の防御率やWHIP などで評価できる.一方,救援投手は登板数が多い性質上,先発投手より多くの選手を確保している.そのため,短い試合数で調子の良し悪しを見極め,調子が悪いと分かれば,2 軍選手との入れ替え等を検討すべきである.しかし,先発投手と異なり,直近数試合では投球回が少ないため,防御率やWHIP の評価が適切ではないと考えられる.そこで本研究では,機械学習モデルを用いて,直近の登板結果や選手の情報から,救援投手について次の登板での被出塁を予測するモデルを構築し,現在の調子を考察し,監督の采配を支援する.また,実装したモデルについて予測に有効な特徴量を発見し,各特徴量が登板結果に及ぼす影響を調べる.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_55","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"プロ野球順位予測モデル","members":"林知宏，川島優，菅澤翔之助(慶應義塾大学)","first_author":"林知宏","affiliation":"慶應義塾大学","code":"P2-09","abstract":"逐次更新型モデルとLSTMニューラルネットワークを組み合わせ、NPB各球団の成績と順位を予測する手法を提案した。期待得点と期待失点をシミュレーションにより算出し、チーム順位予測の実用性と課題を検証した。","methods":["深層学習","ニューラルネットワーク","シミュレーション"],"themes":["チーム評価","勝敗要因","得点予測"],"data":["公式成績データ"],"free_tags":["逐次更新"],"awards":[],"text_insufficient":false,"excerpt":"本研究では、逐次更新型データモデルを用いて、プロ野球の試合結果や順位を予測する。過去データと最新データを組み合わせ、打者・投手の成績を更新し、試合結果や順位を考える上で高精度の予測を実現する。2. はじめにa. 研究背景プロ野球における試合結果やシーズン成績の予測は、チームの戦略策定やファンの関心を高める上で極めて重要である。しかし、MLB と比べ NPB における先行研究は限られており、その希少性が際立っている。さらに、試合ごとの状況や選手成績を逐次的に更新し、動的に予測を行うモデルへの需要が高まっている。本研究では、2021 年・2022 年の試合データと 2023年の逐次的データを活用し、試合結果やチーム順位の予測を可能にするモデルを構築する。b. 研究目的本研究の目的は、選手およびチームの成績予測モデルを構築し、試合結果やチーム順位の予測を可能にするとともに、モデルの実用性と精度を検証する点にある。本研究は以下の 2 点を主たる目標として設定する。i. 2021 年および 2022 年の試合データを基に、2023 年の各試合での選手成績を予測する。ii. 各チームの勝敗や順位を推定し、実際の戦績と比較して、構築したモデルの有効性を検証する。","excerpt_src":"要旨"},{"id":"2024_baseballa_1_72","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"野球における，試合状況を考慮した守備指標 Defensive Value per Play の提案","members":"高橋快成，福原義久(武蔵野大学)","first_author":"高橋快成","affiliation":"武蔵野大学","code":"P2-10","abstract":"試合状況を考慮した新しい守備指標DVPを提案した。接戦率と得点期待値で状況の重要度を、打球の質と守備定位置からの距離で打球処理の難しさを評価し、これら4つの要素を組み合わせて計算する。2021年から2023年の3年間データにより、DVPは既存指標UZRとは異なる観点から選手を評価可能であることを示した。","methods":["指標開発","可視化"],"themes":["選手評価","守備","試合の流れ"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年,セイバーメトリクスにおける守備の評価は,主に UZR(Ultimate Zone Rating) が使用されている. UZR とは,ミッチェル・リクトマンによって提案された守備指標である [1].この守備指標はグラウンド上のどこで,どのような打球を処理したかで評価が行われている.言い換えると,UZR は,打球の処理の難しさを定量化することでその守備の価値を算出している.しかし,UZR ではイニング,点差などの試合状況の重要度を考慮できていない.したがって,UZR は大差の試合状況での守備のプレーと,僅差の試合状況でのプレーを同じ重みで評価してしまう.守備の技術のみを測りたいのであれば UZR で十分であるが,守備指標に試合状況を加味したい場合 UZR では不十分である.そこで本研究では,試合状況を考慮した守備指標, DVP(Defensive Value per Play) を提案する.DVP は,後述する接戦率や,得点期待値など, 「状況の重要度」を表現する値,そして,打球の質,守備定位置からの距離など, 「打球処理の難しさ」を表現する値を足し合わせる.そうすることで,試合状況を考慮した守備の価値を算出することができる.また,UZR は守備機会数を揃えて選手の比較が行われている.機会数による正規化は,打撃の評価で打席数を揃えるというように,よく行われる比較手段である.それにしたがい,3 年分の守備を累積し,守備機会数で平均をとる.算出される値は,その選手の守備に平均的にどれほどの価値があったのかを示す.","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_80","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"投手データから導く最適ポジション予測モデル","members":"信吉珠実，豊田秀樹(早稲田大学)","first_author":"信吉珠実","affiliation":"早稲田大学","code":"P2-11","abstract":"投手の34種類の特徴量を用いて因子分析を実施し5つの因子に要約した。その因子得点に対してマハラノビス距離を用いたk-means法を適用した結果、投手を3つのクラスターに分類し、各クラスターが先発投手、抑え投手、その他のタイプを示すことが明らかになった。","methods":["クラスタリング"],"themes":["選手評価","投手起用","チーム評価"],"data":["公式成績データ"],"free_tags":["因子分析"],"awards":[],"text_insufficient":false,"excerpt":"野球における投手陣のポジショニング(先発・中継ぎ・抑え)は、チームの勝敗を大きく左右する重要な要素である。しかし、現在の多くのチームでは、これらの役割分担が監督やコーチの経験や直感に依存しているケースが多く、選手の特性や適性が十分に考慮されていない場合がある。林(2011)[1] によると、投手の役割には、先発投手が長いイニングを投げ切るスタミナと多彩な球種を求められる一方で、抑え投手には短いイニングで強力なパフォーマンスを発揮する能力が必要とされる。また、中継ぎ投手はピンチの場面で柔軟に対応する力が重視されることが指摘されている。これらの役割に適した投手の選定が十分に行われていないことが、起用方法の課題として挙げられる。たとえば、6 回以降にスタミナ切れを起こす投手が先発として起用され続ける一方、短いイニングで安定したパフォーマンスを発揮する投手の中継ぎ適性が見過ごされることが挙げられる。また、中継ぎから先発への転向においては、スタミナや多彩な球種が求められるため、変更が失敗に終わるリスクも存在する。こうした課題を解決するためには、投手の特性を数値的に表現し、科学的で客観的な判断基準を構築することが求められる。本研究では、役割ごとの特性を定量化し、データに基づいてポジション適性を評価することで、選手の特性を最大限に活用する仕組みを構築することを目的とする。具体的には、投手の特徴量を設計し、これをもとにデータ分析を行い、クラスター分析により投手の特性ごとに分類を行う。本研究を通じて、選手が最適なポジションで起用される仕組みを実現し、パフォーマンスの向上とチーム戦略の合理化を目指すこととする。","excerpt_src":"背景と目的"},{"id":"2024_baseballa_1_89","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"「左利き投手は右利き打者に対して有利」","members":"西野碧天，藤井雅矢，額田一誠，森裕一(岡山理科大学)","first_author":"西野碧天","affiliation":"岡山理科大学","code":"P2-12","abstract":"2021年から2023年の日本プロ野球データを用いて利き腕の相性について分析した。OPS、出塁率、得点期待値から、右利き打者が左利き投手に対して必ずしも不利ではなく、むしろ有利な場合があることが明らかになった。得点圏の有無による分析から、相性の良い代打を出すことが有効であることが示唆された。","methods":["統計的検定"],"themes":["選手評価","打撃","打順・采配"],"data":["公式成績データ"],"free_tags":["利き腕相性"],"awards":[],"text_insufficient":false,"excerpt":"野球では,打者と投手の利き腕の相性が試合の展開に大きな影響を与えると広く認識されている。特に 「右利き打者に対して左利き投手が有利」 という説は長らく定説とされてきた。 しかし,この一般的なセオリーが本当にデータで裏付けられるのか,最新のデータを用いて検証する必要がある。たとえば,OPS (長打率と出塁率を足したもので,総合的な打撃力を評価する指標)とチーム順位の関係を見てみると図 1 のように,長打率や出塁率を上げることが順位を上げることにつながる可能性が見て取れる。ここに着目すると,攻撃面では相手投手にとって苦手な利き腕の選手を出すこと,守備面では相手打者にとって苦手な利き腕の投手を出すことが 1 つの戦略と捉えることができる。本研究では, 提供されたデータ (Data Stadium Inc.2021~2023)をもとに,代打かどうか,先発かどうか,得点圏にランナーがいるかどうか,上位打線か下位打線かの各観点から,利き腕の影響について考察をする。","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_98","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"野球における球団の得点率を考慮した「流れ」の研究","members":"柴田耕太朗，林元婷，奥創平，城嶋実彩乃，米田亮吾，宮本道子(長崎大学)","first_author":"柴田耕太朗","affiliation":"長崎大学","code":"P2-13","abstract":"本研究では、セイバーメトリクスの手法を用いて、野球における試合の「流れ」を定量化するモデルを構築した。2024年度のプロ野球データを用いて、12球団ごとに試合状況による「流れ」とプレイによる「流れ」を計算し、イニングごとに可視化した。試合の流れの比と得点状況が同じような動きを示すことから、流れが試合の優劣を反映する要素であることが示唆された。","methods":["回帰分析","ロジスティック回帰","確率モデル","シミュレーション"],"themes":["試合の流れ","勝敗要因","選手起用","得点予測"],"data":["イベントデータ"],"free_tags":["セイバーメトリクス","WPA"],"awards":[],"text_insufficient":false,"excerpt":"近年、プロ野球においてデータの活用が進んでおり、関心が高まっている。特に、メジャーリーグのオークランド・アスレチックスの成功を機に野球において最も注目を集めている分析手法がセイバーメトリクスだ(鳥越ら、2014)。セイバーメトリクスとは、データを用いて統計学的に分析を行い、従来の指標だけでは表すことができない選手の能力を読みとることで、チームの戦略や経営などに用いる手法や考え方である。セイバーメトリクスでは、野球を「27個のアウトを取るまで終わらない競技」と定義し、野手であれば出塁率が高く得点期待値を向上させる選手、投手であればアウトを取ることができ、得点期待値を下げてくれる選手が「良い選手」であるとされる。上記のような選手を評価するための指標は、従来の指標と比較してより詳細で正確な情報を提供するため、選手の能力評価において重要である。また、「流れ」とは、野球だけでなく多くの競技で用いられるスポーツ用語であり、意味合いとしては、試合の「形勢」や「展開」という言葉が近いのではないかと考えられるが、状況によって様々な意味で用いられており、明確に定義するのは難しい。小島(2023)では、セイバーメトリクスの指標の一つである「WPA」を参考に、試合状況による「流れ」とプレイによる「流れ」を定義し、野球における「流れ」のモデルを作成することで、データから「流れ」を可視化していた。モデルを実際の試合に当てはめると、流れの比の変化と同じように得点が入っていたことや、 得点状況は変化していないにもかかわらず、負けているチームに流れが傾くなどから、ある程度の「流れ」の可視化ができていた。本研究では、小島(2023)の研究を参考に、プロ野球における「流れ」をデータから求めていく。","excerpt_src":"はじめに"},{"id":"2024_baseballa_1_31","year":2024,"dept":"野球部門","dept_detail":"野球部門","title":"投手のシーズンを通じたパフォーマンス要因分析","members":"宇原瑞萩，宿久洋(同志社大学)","first_author":"宇原瑞萩","affiliation":"同志社大学","code":"[口頭]野球1","abstract":"段階反応モデルと多項ロジスティック回帰を用いた分析により、先発投手はシーズン間で変化球割合の増加がパフォーマンス向上に寄与し、リリーフ投手は最高球速と奪三振の増加が重要であることが示唆された。","methods":["ロジスティック回帰","機械学習"],"themes":["投手起用","勝敗要因","怪我・コンディション"],"data":["公式成績データ","イベントデータ"],"free_tags":[],"awards":["野球部門 入賞"],"text_insufficient":false,"excerpt":"近年,日本プロ野球機構(NPB)では,「先発」「中継ぎ」「抑え」と投手の分業制が一般的になっている[5].実際, NPB 全体の完投数は2012 年の131 から2021 年の50 へと大幅に減少している.過去には先発投手が完投するのが一般的であり,連日投球する例も多かった.1961 年の権藤博(中日ドラゴンズ)はその象徴であり,シーズン429 回1/3 を投球,44 先発中32 試合で完投した.しかし,このような酷使により権藤は5 年で投手としてのキャリアを終えることとなった.こうした事例が契機となり,投手分業制が広がった.投手分業制が一般的になった近年では,リリーフ投手の酷使が問題視されている.例えば,2007 年の久保田智之(阪神タイガース)はシーズン90 試合に登板し,防御率1.75 の成績を残したものの,その後成績は低下し,怪我の影響もあって33 歳で引退した.このような事例から,一部の球団ではリリーフ投手の登板制限を行うようになっているが,それでも複数年ブルペンを支えた投手が突然成績不振や怪我で離脱するケースが後を絶たない.その度に,「投手を酷使させすぎた」や「勤続疲労が影響している」などと指摘されている.これまでの投手の疲労に関する研究では,投球数と疲労には相関があり,投球数は投手のパフォーマンスに即時的・累積的影響を与え,特に累積的影響が大きいことが示されている[3].しかし,これらの研究の多くは1 シーズン内に限定されており,勤続疲労が翌シーズンの投球パフォーマンスに与える影響については十分に解明されていない.また投球パフォーマンスには,勤続疲労の他にも選手の年齢や打者による対策などの要因も影響していると考えられる[2].また,近年NPB ではフリーエージェント制度や現役ドラフト制度の導入による選手移籍の活性化が進んでいる.移籍が増加する中で,翌シーズンの選手のパフォーマンスを予測することは,選手契約やトレード
