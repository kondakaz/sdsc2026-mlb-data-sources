日本一に輝いた阪神タイガースは12 球団最多の494 の四球数を相手から奪っている.岡田彰布監督は, 2004 年から2008 年までの第1 次監督時代から「四球はヒット1 本と同じ」と言い続け,ボール球を見極めることの大切さを訴えてきた[1].過去の研究によれば,四球におけるランナーの生還率は単打よりも高いこと[2] や,試合の勝利チームは奪った四球数が多いこと[3] が報告されている.また,守備側の視点では相手の安打以外の出塁が失点に絡む場合がある点も報告されている[4].これらの結果から,岡田監督が上記で重要性を指摘するように四球が勝利につながっている可能性がある.四球と勝利の関連を検討することで,戦略的なゲームプランの策定に役立つと考えられ,最終的にはチーム成績の向上に貢献することが期待される.さらに四球の価値が明確になり,その情報が活用されれば,チームの戦略的な意思決定のサポートが実現し,将来的には選手の貢献を正確に評価できる可能性がある.","excerpt_src":"背景"},{"id":"2023_baseballa_1_78","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"0ボール2ストライクと追い込んだ時のボール球は有効か","members":"幸田大智，幸野谷俊介，松下颯真，安井清一(東京理科大学)","first_author":"幸田大智","affiliation":"東京理科大学","code":"P1-09","abstract":"2022年のNPB全143試合における0ボール2ストライク後の投球と打者の最終結果の関係を統計的検定で分析した。独立性の検定の結果、3球目の投球（ストライク/ボール）と最終結果に有意な関連性は認められなかった。0ボール2ストライク時のセオリーとされるボール投げに優劣がないことが判明した。","methods":["統計的検定","指標開発"],"themes":["投球・配球","勝敗要因"],"data":["イベントデータ"],"free_tags":["カウント","コース評価"],"awards":[],"text_insufficient":false,"excerpt":"野球界の定説で「0ボール 2 ストライクに追い込んだ後,1ボール外すのがセオリー」とされている.この理由が正しいのかどうかを明らかにするためにこのテーマを選んだ.このセオリーについて,[1]金田正一氏と桑田真澄氏が本音で語っていた.桑田氏は,ベンチから「今季は2ストライクに追い込んだら、必ずボールを投げろ」と指示が出されていたことがあったという.さらに,打たれたら罰金という制度もあったため,当時の選手はベンチからの指示に従っていた.しかし,メジャーでは,そもそも「ボール球を投げろ」というサインが存在しないという.ボールを投げるというのは,日本球界ならではの習慣であることが考えられる.また,[2]プロ野球の阪神タイガースでは,一時期0ボール2ストライクになると必ず1球外すというルールみたいなものが存在していた.2018 年 8 月 24 日の読売ジャイアンツ対阪神タイガースの試合であるシーンがあった.3 回裏 2 アウト 1 塁という場面で0ボール2ストライクと追い込んだ.阪神の梅野選手(捕手)はベンチをみて,その後,アウトコースに大きくボールを要求した.結果としてその打席は長打を打たれた.次に 6 回裏 2 アウトランナー無しで0ボール 2 ストライクとなったが,これも梅野選手はアウトコースに大きく外すボールを要求した.これは,阪神の首脳陣の考えではないかと憶測だと考えられる.阪神だけではなく,他のチームでもよくあるとされている.他には,[3]2020 年 10 月 28 日の DeNAベイスターズ対巨人戦で解説を務めた野村弘樹氏が,0ボール 2 ストライクから 3 球目に 1 球外す巨人の先発・高橋優貴,捕手・大城卓三のバッテリーに言及していた.0-4 の初回二死二塁から伊藤光に対し,2 ストライクと簡単に追い込んだあと,外したボールをファウルにされた.野村氏は「0 ボール 2 ストライクから外しましたよね.外す理由がわからないです」と苦言を呈した.調べてみると,多くの記事が見つかった.このように,日本プロ野球界では,0ボール 2 ストライクから 1 球外すというセオリーが浸透している現状がある.この理論が有効なのかを検証しようと考えた.","excerpt_src":"背景"},{"id":"2023_baseballa_1_88","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"有効な配球について","members":"長久保海斗，西川哲夫(武蔵野大学)","first_author":"長久保海斗","affiliation":"武蔵野大学","code":"P1-10","abstract":"2020～2022年のNPB全試合データを用いて、打席最後の球種・コースと打撃指標の関係、および最後2球の球種組合せの効果を分析した。落ちる系球種特にフォークの有効性、外角低めの有効性、直球からフォークへの配球の優位性が明らかになった。配球の組み合わせが打撃成績に大きく影響することが実証された。","methods":["回帰分析","統計的検定","指標開発"],"themes":["投球・配球","打撃","戦術分析"],"data":["イベントデータ"],"free_tags":["ピッチトンネル"],"awards":[],"text_insufficient":false,"excerpt":"野球において、打者を打ち取るためには、配球が非常に重要である。これまで、配球については、球種とコースの打撃成績への影響に関して、様々な分析が行われてきた。例えば、投球コースと、打率、 本塁打数、三振数との関係を調べ、外角低めが最も打たれにくいことを示唆した研究がある[1]。また、球種とコースの組合せの効果を議論しているサイトもある[2]。しかし、打撃成績への影響は、1 球の球種とコースだけで決まるものではなく、連続したボールの配球の組み合わせに、強い影響を受けるものだと考えられる。文献[3]での、同じ球種を連投することの影響についての分析や、文献[4]での、ピッチトンネル(複数の球種を近い軌道から変化させることによって、打者の見極めを困難にする)の有効性について分析がされていたが、配球の正解を探し出すことを目的とした、システマティックな検討は、調べた範囲では見当たらなかった。ここでは、連続したボールの配球の組合せと打撃指標との関係を明らかにすることを目的として、配球の種類をできるだけ細かく分けて、システマティックな検討を行った。それによって、従来言われている配球の組合せの効果についてのセオリー(仮説、例えば、直球後のムービングの有効性など)が正しいのか、正しいとすれば、どの程度有効なのかといった疑問に答えると共に、さらに新しい仮設も提示していきたい。","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_97","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"主成分分析を用いた横浜DeNAベイスターズがランクアップした要因分析","members":"本上和磨，安藤雅和(千葉工業大学)","first_author":"本上和磨","affiliation":"千葉工業大学","code":"P1-11","abstract":"2020～2022年の横浜ベイスターズのチーム成績データを用いて主成分分析を実施し、打撃・投球・守備3領域での変化を分析した。22年度のBクラスからAクラスへの昇格は投手力と守備力の向上が主要因であり、打撃力は高いが長打力低下が今後の課題であることが明らかになった。","methods":["次元削減"],"themes":["チーム評価","選手評価","勝敗要因"],"data":["公式成績データ"],"free_tags":["主成分分析"],"awards":[],"text_insufficient":false,"excerpt":"本上和磨・千葉工業大学社会システム科学部金融・経営リスク科学科安藤雅和・千葉工業大学社会システム科学部金融・経営リスク科学科〒275-0016 千葉県習志野市津田沼 2-17-1, TEL:047-478-4314 E-mail:masakazu.ando@p.chibakoudai.jp横浜DeNAベイスターズ(以下、ベイスターズとよぶ)のリーグ優勝は,過去2回(1960年,1998年)にとどまっており,その2度目の優勝から24年たった現在もリーグ優勝できていない.2000年以降にリーグ優勝できていないのは,両リーグの中でベイスターズのみである.なぜベイスターズは優勝できないのか.それは,ベイスターズが長い間,Bクラス(4位~6位)にいるからではないのかと考えた.実際に2000年からの22年間の順位を見てみると,ベイスターズはBクラスが16回と多く, Aクラスであってもほとんどが3位で,19年と22年だけ2位であった.さらに他のチームの順位結果をみると,基本的にAクラスの数が多いほど優勝している回数が多いことがわかった.この結果から,ベイスターズは,まずはBクラスからAクラスに昇格し,さらにAクラスをキープできるチームにするべきと考えた.これはAクラスに安定すれば,優勝のチャンスが出てくると考えたからである.","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_102","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"野球の指標を用いた野球選手(投手)の理想的な条件とは?","members":"栗林優稀，朝日弓未(東京理科大学)","first_author":"栗林優稀","affiliation":"東京理科大学","code":"P1-12","abstract":"2020～2022年のNPB試合データから決定木分析を用いて、先発投手と救援投手の役割別にチーム勝利への理想的条件を抽出した。先発投手は単打5本以下・二塁打2本以下・四球2個以下が条件で、実際のパフォーマンスとの比較から約52%の精度で勝利に繋がることが確認された。","methods":["機械学習","指標開発"],"themes":["投手起用","選手評価","勝敗要因"],"data":["イベントデータ"],"free_tags":["WAR","決定木分析"],"awards":[],"text_insufficient":false,"excerpt":"今年のプロ野球シーズンは、阪神タイガースが日本シリーズを制し 38 年ぶりの日本一で幕を閉じた。今年の阪神タイガースは年俸改革を行っており、“四球の数”の指標を年俸に組み込むことによって前年比 126%に増加し、それが日本一に繋がる一因になったと考える。そこで野球選手の評価方法に興味を抱き、実際に調べてみると打者・投手統一で評価できる”WAR”という算出式が主流であることがわかった。しかし”WAR”は球団によって評価基準が異なっていて、具体的定義が存在しないことが評価への曖昧さを生んでいる。そこで具体的な評価方法などが存在すれば、選手は具体的な目標設定の参考にできるし、球団は選手の評価を忖度無しで数値的に行うことができる。加えてチームの勝利が選手の評価に反映されるので、本研究では“チームの勝利において理想的な選手の条件とは何か?”という点に着眼点を置いた。実際に野球選手の評価方法についての先行研究をしていく中で、打者の評価に関する論文が非常に多く、投手の評価に関する論文が少なく感じ、実際に試合でも注目されているのは打者であると感じた。そこで今回は野球選手の中でも“投手”に視点を当てて研究を進めていくことにした。","excerpt_src":"研究背景"},{"id":"2023_baseballa_1_12","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"コロナ禍におけるプロ野球の観客数と成績の変化についての分析","members":"関谷兼司郎，石井一夫(公立諏訪東京理科大学)","first_author":"関谷兼司郎","affiliation":"公立諏訪東京理科大学","code":"P2-02","abstract":"2020 年初め、中国の武漢で発生した新型コロナウイ\nルスは、世界中に多くの影響を及ぼし、日本でも、緊\n急事態宣言や外出自粛など日常生活に大きな変化が生\nじた。プロ野球でも新型コロナウイルスの影響を受\nけ、3 カ月遅れての開幕や無観客試合など特に 2020 年\nシーズンは異例なシーズンとなった。そこで、観客数という項目に着目し、観客の有無に\nよって、選手の成績にどのような違いがあるかについ\nて分析。","methods":["回帰分析","統計的検定"],"themes":["観客・ファン","投球・配球","打撃","球場要因"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"2020 年初め、中国の武漢で発生した新型コロナウイルスは、世界中に多くの影響を及ぼし、日本でも、緊急事態宣言や外出自粛など日常生活に大きな変化が生じた。プロ野球でも新型コロナウイルスの影響を受け、3 カ月遅れての開幕や無観客試合など特に 2020 年シーズンは異例なシーズンとなった。そこで、観客数という項目に着目し、観客の有無によって、選手の成績にどのような違いがあるかについて分析を行うことにした。","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_19","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"NPB データを用いた失点予測モデルの構築と評価","members":"赤山瑛基，唐内涼汰，土屋心也，樫山武浩(大阪経済大学)","first_author":"赤山瑛基","affiliation":"大阪経済大学","code":"P2-03","abstract":"近年、スポーツの場面において、様々なデータが収集さ\nれ、その活用が図られている。野球界でも、データの活用\nが進められており[1]、投手のフォームのデータを収集する\nことで正しい体の使い方の習得を支援したり、投手の球を\n計測することで球速や回転数の向上を図る取り組みが行わ\nれている。各選手の能力の向上だけではなく、試合全体の采配にも\nデータは活用されている。","methods":["最適化","勾配ブースティング","深層学習","時系列解析"],"themes":["投球・配球","打撃","選手評価","打順・采配","勝敗要因"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年、スポーツの場面において、様々なデータが収集され、その活用が図られている。野球界でも、データの活用が進められており[1]、投手のフォームのデータを収集することで正しい体の使い方の習得を支援したり、投手の球を計測することで球速や回転数の向上を図る取り組みが行われている。各選手の能力の向上だけではなく、試合全体の采配にもデータは活用されている。たとえば、打者の打球の傾向を分析することで、守備シフトや投手の配球の最適化が図られている。このように、データが持つ意味は色々あり、野球界ではデータの重要性が増している。それを受けて、過去の試合データや現在の試合の観測データを用いた研究が行われている。境田ら[2] は、MLB の試合データをもとに、1球ごとの失点予測モデルを構築し、予測結果に基づいて継投計画の最適化を図っている。この中では、少ないデータの量でも、質が高ければ予測の精度が向上するという知見が報告されている。吉本ら[3] は、隠れマルコフモデルを用いて、イニングに獲得する得点の予測モデルを提案している。提案手法では、選手の心理的状況に基づいた状態遷移モデルを構築する。そして、構築モデル内の遷移確率を分析した結果、選手の心理的要因が予測点数に影響し、心理的要因が良い状況の時のほうが試合結果にもよい影響を与えることを報告している。高石ら[4] は、深層学習を用いて、野球の試合局面を予測するシステムを提案している。提案モデルは、投手、捕手と打者のそれぞれの試合中の行動を予測するものであり、古典的な統計手法よりも高い予測精度を達成している。本研究では、これまでの監督やコーチの経験則ではなく、データを活用した客観的かつ効率的な継投タイミングの意思決定の支援を目的として、日本プロ野球(NPB) の試合データを用いて将来イニングにおける投手の失点予測モデルを構築する。そして、予測精度の観点から構築モデルの有効性を検証する。","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_27","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"四球後と 3-0 後の配球傾向","members":"古池克圭，西脇諒，白井康之(大東文化大学)","first_author":"古池克圭","affiliation":"大東文化大学","code":"P2-04","abstract":"無駄な四球を出すと失点につながるイメージがあ\nる。そのため、四球後の初球やスリーボール・ノー\nストライクの次の配球はストライクでカウントを有\n利に進めたいという考えがバッテリー間に生じる。そのため、全体と打順、点差、ランナーの状況を\n単体と複合の二面から分析を行った。","methods":["指標開発","統計的検定"],"themes":["投球・配球","打順・采配","守備","打撃","走塁・盗塁"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"投手にとって四球は単打と同様か、状況によってはそれ以上に無駄なものである。さらに四球を出したことにより、心理的にもストライクを投げたいといった思いに駆られると考えた。その考えから、四球を出すことによって次の打者の初球に変化が生じるのではないかという思いから、本研究では、提供されたデータを用いて検証を行った。加えて、心理的にもストライクを投げたいと思うスリーボール・ノーストライクでの配球の変化も検証した。配球は状況によって大きく異なってくると考えられる。その中でも、配球は打順や点差、ランナーの状況から検証を行った。その結果、ランナー状況や選手によって配球に変化が見られた。1.はじめに無駄な四球を出すと失点につながるイメージがある。そのため、四球後の初球やスリーボール・ノーストライクの次の配球はストライクでカウントを有利に進めたいという考えがバッテリー間に生じる。そのため、全体と打順、点差、ランナーの状況を単体と複合の二面から分析を行った。四球後の初球とスリーボール・ノーストライクの次の配球はストレートが多くなるのではないかという仮説を検証することが本研究の目的である。","excerpt_src":"概要"},{"id":"2023_baseballa_1_40","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"投球座標と捕手の構えた位置のずれによる打撃結果への影響","members":"白川貴一，関庸一(群馬大学)","first_author":"白川貴一","affiliation":"群馬大学","code":"P2-05","abstract":"投手のコントロールを数値化し、投球座標と捕手の構えた位置のずれが打撃結果に与える影響を分析した。ロジスティック回帰モデルを構築して、コントロールのずれが安打を許す割合に大きく影響することを明らかにした。","methods":["ロジスティック回帰","可視化"],"themes":["投球・配球","打撃","選手評価"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年,プロ野球では150km はおろか160km を超える直球を投げる投手が続々と現れてきている.千葉ロッテの佐々木朗希投手やオリックスの山本由伸投手などをはじめとした160km 超えの速球を投げる投手が注目を集める中,阪神の西勇輝投手やヤクルトの石川雅規投手などスピードボールはなくてもコントロールや投球術を駆使して活躍する投手もいる.年々球速が上がっていくこのプロ野球界でどのようにして生き残れていたのか.様々な要因が考えられるが,150km を超えるような直球が投げられなくても,コントロールが良ければ打者を抑えられるのではないかと考え,コントロールに関する分析を行った.投手のコントロールを評価する指標として四死球率やWHIP*1などが用いられる.これらは,意図したところへ投げれていなくても打者が打ち損じたり,味方の守備が好守をしたりなど投手以外の要因も影響してしまう.こういった,投手以外の要因による影響を少なくすることで対戦相手やチームメートの強さなどが関係なく,投手の評価ができるのではないかと考える.投手以外の要因効果をなくして投手の評価をすることで,チームの編成をする際,活躍を期待できる投手を見定めることが可能になると考えた.本研究では,実際に投手が投げた位置とキャッチャーが構えた位置を比較してコントロールのズレを数値化する.コントロールのズレが打撃結果に大きく影響していると考え,ズレを数値化した.数値化したズレによって打撃結果にどのような影響があるのかを分析することで,コントロールの重要性を可視化する.また,安打になりやすい要因を調べるための回帰モデルを,2 項分布を使用した一般化線形モデルのロジスティック回帰を用いて作成する.","excerpt_src":"研究目的"},{"id":"2023_baseballa_1_44","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"故意四球の損益分岐点に関する研究","members":"亘智貴，那須祐太，石原正彦(金沢工業大学)","first_author":"亘智貴","affiliation":"金沢工業大学","code":"P2-06","abstract":"得点期待値を用いて、OPS.900超えの選手に対する故意四球の有効性を検証した。故意四球の実行は2アウト2塁の状況のみで得点期待値の減少が見込め、その他の状況では効果が限定的であることを示した。","methods":["シミュレーション"],"themes":["戦術分析","得点予測","打順・采配"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年のセイバーメトリクスの普及によって、野球の戦術の価値を定量的に評価することができるようになった。データによる定量的な戦術の評価は、これまで正しいと思われていた野球の定説を覆すなど、野球界に大きなインパクトを与えている。セイバーメトリクスの普及による大きな変化の具体例のひとつが”出塁率の重視”である。ビル・ジェームズ氏の分析によって、打率などの指標よりも出塁率が得点への相関が高いことが明らかになり[1]、野球界における出塁率の注目度は大幅に上昇した。出塁率の重視が与えた影響は攻撃面だけではない。守備の作戦である故意四球への定説も大きく変わることなった。そもそも故意四球とは、守備側が相手打者に対して故意に死球を与える守備の作戦である。故意四球の目的は、強打者との勝負を避けることや、空いている塁を埋めて守備の効率化を図ることによって失点を最小限に抑えることである。しかし、故意四球は作戦の特性上、無条件に相手への出塁を許すことになる。相手に出塁を許すことは出塁率と得点の相関が高いこと、そして得点期待値の観点から見ても、失点を最小限に抑えるという目的を果たすことができないように思える。また、蛭川氏によって行われた王貞治に対して故意四球を行った場合の有効性の検証[2]においても、故意四球が有効となる状況は 1 点を守り抜く必要がある試合後半など限られた状況のみであることが分かっている。このように昨今では、出塁率の向上が得点増加に繋がることが明らかになり、多くの場合で故意四球への有効性が否定されている。しかし、日本のプロ野球では未だに故意四球が行われている。そこで、本研究では、得点期待値を用いて日本のプロ野球で行われた故意四球の有効性の検証を行う。","excerpt_src":"背景"},{"id":"2023_baseballa_1_58","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"プロ野球におけるビッグイニングが起こる要因の検討","members":"佐藤温大，寒水孝司(東京理科大学)","first_author":"佐藤温大","affiliation":"東京理科大学","code":"P2-07","abstract":"ビッグイニングの要因を分析するため、打席結果の順序をバイグラムで表現し、ポアソン回帰を適用した。連続出塁の順序が得点期待値に影響することを示し、連続アウトが連続ヒットよりも得点期待値を低下させることを明らかにした。","methods":["自然言語処理"],"themes":["試合の流れ","得点予測"],"data":["イベントデータ"],"free_tags":["ポアソン回帰"],"awards":[],"text_insufficient":false,"excerpt":"野球観戦において観客が盛り上がる瞬間の1 つに得点が入るシーンが挙げられる.特に,ビッグイニングは点が入るシーンが多いだけでなく,試合展開を大きく動かすことから観客の興奮度を上げる.2023 年の日本シリーズにおいても,日本一に輝いた阪神タイガースが数回にわたりビッグイニングを演出し,大きな盛り上がりを見せた.事前にビッグイニングが起こることが予測できれば,観戦がより楽しくなると考えた.ビッグイニングが起こるためには,1 イニングの間に得点を大量に得る必要がある.1 イニングの得点期待値を上げる要因としてヒット,四死球, エラーによる出塁がある[1].しかし,連続出塁のような打席結果の順序が得点期待値にどのように影響するかについては十分に検討されていない.得点期待値とは,そのイニングに入る得点の見込みを示す指標である.得点が期待できる打席結果の順序を把握することは,野球観戦における応援のボルテージを上げる一助になると考える.たとえば,「この打席結果の順序でランナーが出たら得点期待値が高いからより盛り上がるチャンステーマを使用する」といった新しい観客の応援方法の提案が期待できる.本研究では,ヒットや四死球などの出塁の連続が得点期待値にどのように関連しているかを調べることで,ビックイニングが起こる要因を検討する.連続ヒットや連続四死球のように連続出塁が起こる際に大量の得点が入るのではないかという仮説を立てた.たとえば,「ヒット→ヒット→ヒット→アウト→アウト→アウト」と「ヒット→アウト→ヒット→アウト→ヒット→アウト」では同じヒット数だが1 イニングの連続出塁の数が異なる.このとき,連続出塁の数が多い方が得点期待値が大きいのではないかと考えた.連続出塁を考慮するために,1イニングの打席結果の順序を文章,打席結果を単語とみなし,自然言語処理の方法を用いて,打席結果の順序を要因に組み込む.具体的には,単語の連続を表す,バイグラムを用いて連続する2 つの要素の組み合わせとした.バイグラムを説明変数としてポアソン回帰を行い,ビッグイニングが起こる要因を検討する.その結果から,得点が期待できる要因を観客に示し,野球観戦の興奮度を高めることを目的とする.","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_76","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"打者を抑えるために必要な投手の特徴量についての研究","members":"河原寛治，谷岡広樹(徳島大学)","first_author":"河原寛治","affiliation":"徳島大学","code":"P2-08","abstract":"スピアマンの順位相関を用いて投手の特徴と安打・失点の関連を分析した。安打を抑えるにはストライクゾーンに投げすぎないことが重要で、失点を抑えるにはランナー状況を考慮した投球が必要であることを明らかにした。","methods":["統計的検定"],"themes":["投球・配球","投手起用","選手評価"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球というスポーツは点を取られなければ試合に負けないスポーツである.つまり,投手が打者を抑える能力が必ずチームの勝敗に影響を与えることは自明である.ビル・ジェームスが提唱したセイバーメトリクスでは,ピタゴラス勝率[1] と呼ばれる勝率予想の式も提案されており,相手の得点をより少なくすることで勝率の向上が期待できる.そこで,本研究では打点や打点につながる安打を打たれない投手の特徴を分析する.","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_82","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"キャッチャーが要求するコースの重要性","members":"荻山烈，瀬戸一樹，朝日弓未(東京理科大学)","first_author":"荻山烈","affiliation":"東京理科大学","code":"P2-09","abstract":"2022年NPBパシフィックリーグのストレート投球約4.9万件を対象に、キャッチャーの要求コースと実投球位置のズレが被打率に与える影響を分析した。ユークリッド距離と座標分析の結果、要求コースに投球された場合に被打率が低くなることが実証され、リードにおけるコース要求の重要性が確認された。","methods":["空間分析","統計的検定","指標開発"],"themes":["投手起用","捕手・バッテリー","打撃"],"data":["イベントデータ"],"free_tags":["リード","フレーミング"],"awards":[],"text_insufficient":false,"excerpt":"野球のキャッチャーは扇の要と呼ばれ非常に重要なポジションである。特にピッチャーは、基本的にキャッチャーの指示に従い投球をするため、 キャッチャーの能力がピッチャーの成績を左右すると考えられる。 プロ野球では選手の公式記録の他にセイバーメトリクス指標という選手を評価するための指標が存在するのだが、 キャッチャーの守備を正確に評価できる指標は存在しない。 現在存在する守備指標は打球処理に対するものがほとんどで、 投手のリード力やきわどい球をストライクに見せるフレーミングの能力などキャッチャーの中心となる要素が考慮されていないからである。そのため、 今後キャッチャーを正確に評価するためにはリードやフレーミングの重要性を明らかにしたうえで、それらを評価するためのキャッチャーの評価軸を作っていく必要がある。リードにおいても様々な要素があるが、 本研究ではリードの重要性について明らかにする第一歩としてキャッチャーの要求するコース(ミットを構える位置) に着目して、その観点からリードの重要性について明らかにする。","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_90","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"ノーアウトランナー1塁での最適な作戦とは?","members":"池田蒼，朝日弓未(東京理科大学)","first_author":"池田蒼","affiliation":"東京理科大学","code":"P2-10","abstract":"2022年セ・リーグの0死1塁時データから、犠打・打撃・盗塁の得点期待値を計算し、走力指標Spdと打力指標wRC+を導入して最適作戦を分析した。Spd3.0以上で盗塁、wRC+90以上で打撃が最適であり、それ以外は犠打が有効な戦術であることが判定された。","methods":["指標開発","シミュレーション"],"themes":["打順・采配","走塁・盗塁","選手評価"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"以前の日本の野球において、0死 1塁になったらとりあえず送りバントをして 1死 2塁という状況を作るという風潮があった。従来、送りバントは重要な戦術として位置づけられていた。2005~2007年の甲子園大会 160試合のデータを調べると、無死 1塁で送りバントという戦法を選んだのは68.9%にも及ぶが、2016~2017年の甲子園大会 129試合のデータによると、無死 1塁で送りバントという戦法を選んだのは50.2%しかなかった[1]。10年前までは「無死で走者が 1塁に出れば送りバント」と考えてよかったが、それが 10年間で約 20%も減少したことになる。この流れは NPBでも同様である。送りバントをすることで、その目的を果たした、もしくは目的以上に達したという結果を成功と考えると、その割合はだいたい 80%くらいになる。しかし、それに対し、安打を狙った強攻策の場合、打率はよくて「3割」の 30%、四死球を入れた場合の出塁率としても 40%くらいなので、送りバントという戦法の成功率は非常に高いと言える。送りバントではなく、打撃をする強攻策は大量点につながることもあるが、失敗も多い。反面、送りバントは 1点を取りに行く手堅い戦法となっており、1点を取るために有効な手段であるということがよく言われている。2023年度の NPB全体の 0死 1塁の得点期待値と得点割合は 0.696、36.0%であり、1死 2塁の得点期待値と得点割合は 0.578、36.3%となっている。ここでいう得点期待値とは、塁上の走者やアウト数の状況を2 4パターンに分類し、その状況から同一イニング中(3アウトとなるまで)に獲得できる平均的な得点のことであり、得点割合とは、あるアウトカウント、走者状況の出現後、イニングが終了するまで 1点以上取れる割合である[2]。このように、得点期待値のみに着目すると、1死 2塁よりも 0死 1塁の方が得点期待値が高く、送りバントをする必要がないように思える。しかし、野球の得点の仕方がベースボール型であり、双六のような仕組みのため、 「ゴールにより近いところにいたほうが有利」と考える監督が多いのも事実である。得点期待値の観点以外にも注目してみると果たして 0死 1塁の時の最適な作戦とはいったいどのような作戦であるのだろうか。また、従来の研究では、打者や走者を考慮に入れた研究は存在しない。今回では、打者や走者の指標を考慮に入れたうえで 0死 1塁での最適な作戦を分析していく。","excerpt_src":"研究目的"},{"id":"2023_baseballa_1_100","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"凸包を用いた広島東洋カープの外野手の守備範囲の可視化とそこから読み取れる選手の特徴","members":"二階堂航大，織田心壱，細谷歩夢，住岡慶太，森脇政泰(広島大学附属高等学校)","first_author":"二階堂航大","affiliation":"広島大学附属高等学校","code":"P2-11","abstract":"2021～2022年のカープ外野手フライ捕球位置データから凸包アルゴリズムを用いて守備範囲を図形化し可視化した。各選手の守備範囲面積をランキング化することで、選手ごとの守備能力を比較分析した。センターポジション選手がより広い守備範囲を持つ傾向が確認された。","methods":["可視化","空間分析"],"themes":["守備","選手評価","ポジショニング"],"data":["トラッキングデータ"],"free_tags":["凸包アルゴリズム"],"awards":[],"text_insufficient":false,"excerpt":"凸包を用いた広島東洋カープの外野手の守備範囲の可視化とそこから読み取れる選手の特徴I.研究背景・目的野球は日本では人気のあるスポーツである.ただ,野球と言われると「投げる」,「打つ」の二つの動作ばかりイメージしてしまう人も多いのではないか.もちろんこれらも重要だが,野球は「守る」スポーツでもある.守ることを野球では守備と言うが,守備はその1つのプレーでチームを救い観客を魅了する.守備の強いチームはそれだけ失点する確率を下げることができる.では私たちの住む広島に本拠地を置くプロ野球球団『広島東洋カープ』(以下,カープとする)は現状果たして守備の強いチームなのだろうか.何をもって守備が強いというかは人それぞれかもしれないが分かりやすいのは,どんなところにボールが飛んできてもキャッチしてアウトにできる,つまり守備範囲(守備者が守ることができる範囲)が広いということだろう.そこで,近年の急激なスポーツのデータ分析技術の進歩によって野球の守備においても「セイバーメトリクス」(Society American Baseball Research+metrics)と呼ばれる,野球を数字でデータ分析し統計学的根拠を加えて選手を評価する手法が用いられ始めたため,その中の様々な守備指標,例えばUZR(Ultimate Zone Rating)という,守備でどれだけの失点を防いだかを表す数値などから選手の守備範囲をある程度評価することができる.しかし,これらの指標は同じ守備位置の平均的選手と比べて算出しているものなので,あくまで相対評価に過ぎないということ,また,指標が数字であるため実際にどのくらいの守備範囲なのかイメージしづらいということが問題点として挙げられる.そこで本研究ではカープの各外野手の守備力(守備範囲)を比較し評価することを目的とし,カープの外野手(内野手及び捕手は本研究の方法では分析が困難なため)のそれぞれの守備範囲を図形で表すことで可視化し,視覚的に選手の特徴を評価した. II.方法1.守備範囲の定義受け取ったデータのうち,『プレー情報データ』に「打球位置座標X」及び「打球位置座標Y」,また「打球落下位置座標X」及び「打球落下位置座標Y」という項目があった.ホームベースを原点としたx-y平面を設定し,センター方向をy軸,その垂直方向をx軸と定義した.また他の点の座標などに関しては『野球データ説明書_2023年度スポーツデータサイエンスコンペティション』内にある「プレー情報データ(play_info_yyy y.csv)の打球位置に関する仕様」に従った.図1. 打球位置座標のモデル(引用元:”野球データ説明書_2023年度スポーツデータサイエンスコンペティション「プレー情報データ(p lay_info_yyyy.csv)の打球位置に関する仕様」”)打球が外野に向かった場合,ボールがグラウンド上に落下した位置を座標として表したものが打球落下位置座標X及びYであり,その後外野手がボールをキャッチした位置を同じく座標で表したものが打球位置座標X及びYである.もし外野手がフライ性の打球をグラウンド上にバウンドする前に捕球した場合,打球が落下した位置と打球を捕球した位置が同じ座標となるため,データ上では代表して打球位置座標のみ書かれており,打球落下位置座標は空白となっていた.本研究ではこの外野フライの捕球位置に注目して,カープの各外野手が公式戦でフライを捕球した位置座標のデータをすべて収集し,数学ソフトウェア『GeoGebra』を用いて,アプリ内にある座標平面を今回のデータのx-y平面と仮定した上で,収集したすべての座標データを点でプロットした.二階堂航大,織田心壱,細谷歩夢,住岡慶太・広島大学附属高等学校森脇政泰・広島大学附属高等学校〒734-0005 広島市南区翠1-1-1 TEL: 082-251-0192,E-mail: m-moriwaki@hiroshima-u.ac.jp次に数学における《凸包アルゴリズム》の考え方を用いて,プロットした点を含むような凹みの無い最小の集合図形を作った.以上の過程より,各選手の図形の内部及び線上に飛んできた打球についてはバウンドする前に選手が捕球をしてアウトにできるとみなし,本研究ではこの図形をその外野手の守備範囲と定義した.","excerpt_src":"本文冒頭"},{"id":"2023_baseballa_1_51","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"野球における「流れ」の研究","members":"小島天翔，奥村優樹，宮本道子(長崎大学)","first_author":"小島天翔","affiliation":"長崎大学","code":"[口頭]野球1","abstract":"プロ野球の試合における「流れ」をデータから数値化するモデルを構築した。試合状況による「流れ」とプレイによる「流れ」を組み合わせることで、イニングごとの流れを可視化し試合成績との関連を示した。","methods":["時系列解析","ロジスティック回帰","可視化"],"themes":["試合の流れ","勝敗要因"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年、 プロ野球においてデータの活用が進んでおり、関心が高まっている。特に、野球において最も注目を集めている分析手法がセイバーメトリクスだ (鳥越規夫ら、2014)。セイバーメトリクスとは、データを用いて統計学的に分析を行い、 従来の指標だけでは表すことができない選手の能力を読みとることで、 チームの戦略や経営などに用いる手法や考え方である。 セイバーメトリクスが注目されるようになった経緯として、メジャーリーグのオークランド・アスレチックスの成功例がある。 1990年代に成績が低迷していたアスレチックスがセイバーメトリクスを積極的に採用し、従来のでは評価が高くないが、 セイバーメトリクスの基準では評価の高くなる選手を低年俸で獲得することで、選手の年俸を抑えながら2000年から2003年の間に3度の地区優勝を達成するなどチーム力の強化に成功した。このことで、セイバーメトリクスは一気に話題になったのである。セイバーメトリクスでは、野球を 「27個のアウトを取るまで終わらない競技」と定義し、 野手であれば出塁率が高く得点期待値を向上させる選手、投手であればアウトを取ることができ、得点期待値を下げてくれる選手が「良い選手」であるとされる。 上記のような選手を評価するためのセイバーメトリクスの代表的な指標としては、 「オンベース率(OBP)」、「長打率(SLG)」、「OPS(オンベース率+長打率)」、 「走塁防御点数 (DRS) 」、 「WPA (どれだけ勝利確率を増減させたか)」などがある。これらの指標は、 従来の指標と比較してより詳細で正確な情報を提供するため、 選手の能力評価において重要である。本研究では、セイバーメトリクスの指標の一つである「WPA」を参考に、プロ野球の試合における「流れ」の研究を行った。「流れ」とは、野球だけでなく多くの競技で用いられるスポーツ用語であり、 意味合いとしては、試合の「形勢」や「展開」という言葉が近いのではないかと考えられるが、 状況によって様々な意味で用いられており、 明確に定義するのは難しい。","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_34","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"送りバント戦術の得点確率に対する因果メカニズムの検討","members":"田村彰汰，篠崎智大(東京理科大学)","first_author":"田村彰汰","affiliation":"東京理科大学","code":"[口頭]野球2","abstract":"送りバント戦術が得点確率に与える因果的影響を傾向スコアマッチングと媒介分析により検討した。交絡因子を調整したマッチング後のデータでは送りバント戦術が得点確率を1.1倍に増やすが、媒介分析の結果から塁状態の変化が主な効果であることが示唆された。","methods":["因果推論","ロジスティック回帰","統計的検定"],"themes":["戦術分析","得点予測","打順・采配"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年スポーツ界では,試合データの取得が盛んに行われるようになり,作戦や戦術の評価がデータを用いてできるようになりつつある[1].特に野球はセイバーメトリクスの発展により,選手のパフォーマンスやプレーにおける価値を,勝利や得失点への貢献度の大きさに基づいて評価できるようになった[2].野球の戦略には,有効性の検証が十分になされていないものも多く,解説者,チーム関係者,野球ファンなどの間でも意見が割れる戦術もいくつか存在する.代表的なものとして,送りバント戦術がある.送りバント戦術がとりうる状況はいくつかあり,よく知られているものは,無死1塁の状況において打者がバントを行って,アウトになる代わりにランナーを2 塁に進めるというものである.従来,「無死1 塁では送りバントがセオリー」[3] や「バントは重要な作戦で不可欠な技術」[4] のように送りバントは重要な戦術として位置づけられていた.ところが,セイバーメトリクスの観点では,送りバントは多くの場面で有効な戦術とは言えないことがわかってきている[5].日本経済新聞では「実は手堅くない送りバント 「損益分岐点」は打率1 割」[6] といったコラムを書かれているなど,送りバント戦術の有効性については賛否が分かれてきている.このように戦術の良し悪しが指摘される背景には,戦術評価のデータ分析には様々なバイアスが含まれているという課題がある.例えば,戦術を取る前後のアウトカウントと塁状態から得点期待値や得点確率の変化を,単純比較をもとに解釈している場合が多いが,これらの比較は,バイアスを含んだ議論になっている可能性がある.そこで本研究では,送りバント戦術をとったか否かが得点に与える影響を,交絡因子によるバイアスを取り除いたうえで推定することを目指す.具体的には,統計的因果推論の手法を適用し,2 群間の交絡を取り除いた上で,送りバント戦術が得点期待値および得点確率に与える因果的な影響を定性・定量の両面から解析した結果を前半で報告する.野球における戦術評価を因果推論の枠組みで行った研究は,中村(2017) らのCovariate Balancing Propensity Score を用いたスクイズ作戦の有効性の解析[8] や,中原(2022) らの反実仮想シミュレーションを用いたチーム打撃戦略の効果検証[9] のようにいくつか行われている.本研究においても,送りバント戦術でそのフレームワークを適用することを考える.一方で,これらの解析は戦術ー得点間の因果メカニズムの解析には不十分であると考える.例えば,無死1 塁における送りバント戦術であれば,ヒット1 本で得点が入る「塁状態をつくること」が戦術の意図として考えられる.そこで本研究では,戦術をとったことによる塁状態の変化が得点におよぼす影響と,戦術をとるという行為それ自体が得点におよぼす影響に分解することで,送りバント戦術が得点に与える影響の因果的なメカニズムの解明も目指す.","excerpt_src":"研究背景"},{"id":"2023_baseballa_1_43","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"野球におけるスターティングメンバーの選出に有用な出塁予測モデルの構築と評価","members":"荒川哲至，江頭健斗，鈴木海友(東京理科大学)，藤澤健吾(山口東京理科大学)，中川智之(明星大学)，松澤智史(東京理科大学)","first_author":"荒川哲至","affiliation":"東京理科大学","code":"[口頭]野球3","abstract":"LightGBMを用いて試合ごとの出塁予測モデルを構築し、打者の調子と相性の両方が出塁に影響することを示した。調子の影響が相性よりも大きく、特にボール球の見極めが重要であることを明らかにした。","methods":["機械学習","勾配ブースティング","SHAP・説明可能AI"],"themes":["選手起用","打順・采配","得点予測"],"data":["公式成績データ"],"free_tags":[],"awards":["野球部門 優秀賞"],"text_insufficient":false,"excerpt":"野球において,出塁することは得点を取るために重要な要因の1 つである.そのため,特に起用される選手が試合ごとに変わるポジションにおいて,監督は出塁する可能性が高い選手を起用する必要がある.しかし,調子が良い選手を起用すべきか,相手と相性が良い選手を起用すべきか悩ましい問題である.そこで本研究では,LightGBM [1] を用いて試合ごとの出塁予測モデルを構築する.","excerpt_src":"はじめに"},{"id":"2023_baseballa_1_16","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"打者の待ち球種・コースを考慮したスイング傾向のSEM 分析と打ち取り方への応用","members":"萩原飛鳥，中村和幸(明治大学)","first_author":"萩原飛鳥","affiliation":"明治大学","code":"[口頭]野球5","abstract":"プロ野球において、打者が球種の判別をする位置はホー\nムベースから7 メートル前後であると言われている。ピッ\nチャーマウンドからホームベースまでの距離が18.44 メー\nトルなので、投手がボールを投げてから11 メートル進む\n間にスイングの有無やバットの軌道を決める必要がある。2023 年シーズンの平均球速が約144 キロであることを用\nいて時間に直すと、投手と打者は0.275 秒間の勝負をして\nい。","methods":["機械学習","統計的検定"],"themes":["打撃","投球・配球","勝敗要因"],"data":["公式成績データ"],"free_tags":[],"awards":["野球部門 学部生奨励賞"],"text_insufficient":false,"excerpt":"プロ野球において、打者が球種の判別をする位置はホームベースから7 メートル前後であると言われている。ピッチャーマウンドからホームベースまでの距離が18.44 メートルなので、投手がボールを投げてから11 メートル進む間にスイングの有無やバットの軌道を決める必要がある。2023 年シーズンの平均球速が約144 キロであることを用いて時間に直すと、投手と打者は0.275 秒間の勝負をしていることになる。一方猪飼ら[1] や浅見ら[2] によれば、脳が反応して行動するには一流選手でも0.3 秒以上かかる。これをプロ野球の世界に適用すれば、ボールを投げてから反応しては間に合わないということになる。ではどのように反応しているのか。これは無意識のうちにボールが来る位置を脳が予測し、そのコースに来た球を打つのに必要な筋肉にあらかじめ指令を出している。つまり打者にとって配球を読むことが非常に重要であると言えると同時に、その“狙い球”を外せれば空振りや真に当たる確率を減らせるということになる。野村[3] や古田[4]においても、球種にヤマを張ったりコースや打球方向で絞るという。以上のことから本研究では、プロ野球の配球に注目して分析し、打者の意図を反応やシチュエーションから“狙い”や、絞り方から“選手の状態”を読み解き、打ち取りやすい配球を解明することを目的とする。そのために構造方程式モデリング(SEM)を用いて配球・コースと打者の反応の関係を表したモデルをデータに基づいて構築する。","excerpt_src":"研究背景と目的"},{"id":"2023_baseballa_1_26","year":2023,"dept":"野球部門","dept_detail":"野球部門","title":"日本プロ野球における球種と投手成績による先発投手の分類","members":"奥田守，寒水孝司(東京理科大学)","first_author":"奥田守","affiliation":"東京理科大学","code":"[口頭]野球6","abstract":"本研究は日本プロ野球における球種と投手成績による先発投手の分類に関する分析である。","methods":["クラスタリング","指標開発"],"themes":["投球・配球","選手評価","捕手・バッテリー","球場要因"],"data":["公式成績データ"],"free_tags":[],"awards":["野球部門 最優秀賞"],"text_insufficient":false,"excerpt":"日本プロ野球において,先発投手の防御率はチームの勝敗に強く関連している.防御率が低い先発投手が多ければ,チーム勝率が高くなる.そのため,先発投手にとって防御率を低下させることは大きな課題であり,その要因を検討することは重要である.しかし,全投手に共通の要因があるとは限らず,むしろ異なる要因がある可能性が高い.したがって,防御率を低下させるためには投手ごとに球種の特徴を考慮する必要がある.表1 に3 名の投手の2022年における防御率,ストレートの球速と空振り率を示す.","excerpt_src":"はじめに"},{"id":"2022_espoa_1_50","year":2022,"dept":"eスポーツ部門","dept_detail":"eスポーツ部門","title":"ぷよぷよDXー「ぷよぷよ」における土台と連鎖の可視化システムー","members":"藤田海渡，平井一史，一桝喬也，秋葉礁，吉田直樹，西川哲夫(武蔵野大学)","first_author":"藤田海渡","affiliation":"武蔵野大学","code":"P2-02","abstract":"ぷよぷよのプロ試合動画から盤面配置情報を画像処理で抽出し、土台と連鎖を検出するシステムを構築した。HSVヒストグラムを用いたぷよ同定ルールを確立し、12種類の土台を検出可能にすることで、土台の場所による勝率差や選手の戦術パターンを分析した。","methods":["画像認識・姿勢推定","可視化","統計的検定"],"themes":[],"data":["映像データ"],"free_tags":["土台検出","盤面分析"],"awards":["ポスター部門 最優秀賞"],"text_insufficient":false,"excerpt":"E-sports は、競技としての進化に伴い、専門的知識や技術の必要性が高まっている。2018年に「ぷよぷよE- sports」がリリースされ、今ではプロの大会が実施されている。ぷよぷよは、ルール上難しいゲームでありプロの大会では、視聴者に戦術や技術を理解できない人が多くいると考えられる。これはぷよぷよの普及にとり望ましくない。ぷよぷよの分かり難さを解消するため、我々は昨年度の本コンペにおいてゲーム状況の可視化を試みた。ゲーム中の連鎖数やおじゃま数が勝利確率に強く影響することを見だし、ゲーム中の連鎖状況や勝利確率を可視化する方法を提案した[1]。今回は、昨年使用しなかった盤面の映像情報を加えることで、土台が及ぼす連鎖や勝利への影響を明らかにすることを目指した。また有効な可視化方法の開発を行った。","excerpt_src":"はじめに"},{"id":"2022_espoa_1_40","year":2022,"dept":"eスポーツ部門","dept_detail":"eスポーツ部門","title":"ゲームの流れの可視化による演出の提案","members":"南部和希，西森大純，森純平，天藤颯哉，谷下祐斗，山本由和(徳島文理大学)","first_author":"南部和希","affiliation":"徳島文理大学","code":"[口頭]esports1","abstract":"ぷよぷよのゲーム中にリアルタイム勝敗予測を行うシステムを提案した。ランダムフォレストで重要変数を抽出し、ロジスティック回帰モデルで勝敗予測を実施した結果、正解率0.57を達成し、勝敗確率をゲージで可視化する演出を実装した。","methods":["ロジスティック回帰","機械学習","可視化"],"themes":[],"data":["イベントデータ"],"free_tags":["ぷよぷよ","リアルタイム勝敗予測"],"awards":[],"text_insufficient":false,"excerpt":"昨今,ゲームがスポーツ化したe-sports が盛んになってきている.その流れにより,初めてゲームに触れるような初心者もe-sports 文化に触れると考える.彼らがゲームや大会の雰囲気を楽しみ,興味が湧けば,そのゲームで遊んだり,関連動画を見始めたりする.その結果,ゲームのプレイ人口増加に繋がると言える.ゲームコンテンツでは,このような初心者がコンテンツの維持,拡大に欠かせないと言われている.初心者の人口を増やすためには,ゲームを見た人に興味を抱いてもらうことが重要である.ゲーム状況を捉えやすく,楽しめるような演出やシステムがあると,ゲームに興味を持ちやすくなり,プレイ人口や視聴者の増加に貢献すると考える.例えば,インターネットで閲覧できるぷよぷよの対戦動画は,楽しく視聴できるが,初心者には,対戦状況を確認することは困難である.それは次の3 つの理由によると考える.それは,「ゲームの流れが分かりにくい」,「ゲームの展開が早い」,「対戦時間が短い」である.そこで,本報告では,ゲーム中にリアルタイムで勝敗予測を行い,その結果の演出を提案する.このために,提供されたデータの前処理を行い,ランダムフォレストの結果を参考にして,勝敗に影響する変数を調べた.それらを説明変数としてロジスティック回帰モデルを構築した.このモデルを使って,ゲーム中にリアルタイムで勝敗予測を行い,流れの演出に利用する.","excerpt_src":"はじめに"},{"id":"2022_espoa_1_23","year":2022,"dept":"eスポーツ部門","dept_detail":"eスポーツ部門","title":"敵対的生成ネットワークによる「ぷよぷよ」の特定小連鎖盤面の生成","members":"大平悠介，伊藤真大，三家礼子(早稲田大学)","first_author":"大平悠介","affiliation":"早稲田大学","code":"[口頭]esports2","abstract":"ReACGANを用いてぷよぷよの2〜5連鎖盤面を生成した。Discriminatorの事前学習を行い、生成盤面の連鎖数精度検証を実施した結果、連鎖数別で様々な盤面生成の可能性が示唆されたが、ルール準拠精度については今後の改善が課題となった。","methods":["生成モデル","深層学習","機械学習"],"themes":[],"data":[],"free_tags":["GAN","敵対的生成ネットワーク","盤面生成"],"awards":["eスポーツ部門 優秀賞"],"text_insufficient":false,"excerpt":"近年,深層学習を用いたゲームAI の開発が進んでいる.対戦型アクションパズルゲームである「ぷよぷよ」でも盤面情報を用いて深層学習によるAI の開発が行われるようになった[1]. しかしながら,一定の精度を持ったAI の開発には多くのデータが要求される.「ぷよぷよ」においては盤面情報である.データ量が少ない場合,データ拡張を行うが,「ぷよぷよ」の盤面においては,ぷよ色の入れ替えや左右反転などがデータ拡張の手法として挙げられる.しかしながら,これらのデータ拡張の手法では,ほぼ同様な盤面が生成されることになるため,データの多様性が失われる可能性がある.そこで,敵対的生成ネットワーク[2](Generative Ad- versarial Nets, GAN)によるデータ拡張がしばしば用いられる[3][4].GAN とは,生成器(Generator)と判別器(Discriminator)の2 つのニューラルネットワークを競わせるように学習させることが特徴の生成モデルである. Generator が入力データの偽物を生成し,Discriminatorが入力データの真偽を判定する.これらの操作を繰り返す事で生成データを本物の入力データに近づけていくという学習方法である.しかしながら,データ拡張に使用するためにはデータとしての一定の精度が求められる.特に,「ぷよぷよ」には,連鎖数という定量的な数値が存在するため,連鎖を考慮した盤面を生成する必要がある.そこで本研究では,2 連鎖から5 連鎖までの少ない連鎖数を生成対象とし,それぞれの連鎖が発火する瞬間の盤面をGAN により生成し,その精度を検証することを目的とする.","excerpt_src":"はじめに"},{"id":"2022_baseballinfo_1_48","year":2022,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(野球)","title":"二死満塁での投球位置と勝負の行方","members":"上田太一，千原渉，中村美唯，中村文音，小宮夢叶，田澤実(法政大学)","first_author":"上田太一","affiliation":"法政大学","code":"I-01","abstract":"2019年から2021年のプロ野球における二死満塁での投球データを分析したインフォグラフィック。勝負がついた投球はアウトコースに集中する傾向を発見し、投球位置と勝敗の関係を可視化した。","methods":["可視化","統計的検定"],"themes":["投球・配球","勝敗要因"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2022_baseballinfo_1_63","year":2022,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(野球)","title":"投手の投球データ分析","members":"中野優華，渡部宙，山田泰行(順天堂大学)","first_author":"中野優華","affiliation":"順天堂大学","code":"I-02","abstract":"投手の平均球速、投球球種、被安打率などのデータを可視化分析した。","methods":["可視化"],"themes":["投手起用","打撃"],"data":["イベントデータ"],"free_tags":[],"awards":["インフォグラフィック部門 最優秀賞"],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2022_soccerinfo_1_33","year":2022,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(サッカー)","title":"サッカー選手の統計比較分析","members":"竹中海登，小田翼，辻爽太，廣津信義(順天堂大学)","first_author":"竹中海登","affiliation":"順天堂大学","code":"I-03","abstract":"複数の選手の年齢、身体寸法、シュート成功率、パス数、ドリブル回数などの統計情報を比較分析した。","methods":["可視化"],"themes":["選手評価"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2022_soccerinfo_1_37","year":2022,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(サッカー)","title":"ペナルティーエリア付近での決定機演出要因分析","members":"三田寺倫希，白井康之(大東文化大学)","first_author":"三田寺倫希","affiliation":"大東文化大学","code":"I-04","abstract":"ペナルティーエリア付近でのトラップミス、パスミス、ドリブル失敗がシュートを打たれる確率（決定機演出率）を分析した。","methods":["可視化"],"themes":["ゴール期待値","スペース評価"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2022_judoinfo_1_61","year":2022,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(柔道)","title":"柔道ワールドカップ2021の一本勝ちを徹底分析","members":"柘植航太，渡部宙，山田泰行(順天堂大学)","first_author":"柘植航太","affiliation":"順天堂大学","code":"I-05","abstract":"2021年柔道ワールドカップの一本勝ちを決定木分析で分析し、横四方固めが最多（16.7%）であることを明らかにした。","methods":["機械学習","可視化"],"themes":["選手評価"],"data":["公式成績データ"],"free_tags":["一本勝ち"],"awards":["インフォグラフィック部門 優秀賞"],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2022_espoinfo_1_45","year":2022,"dept":"インフォグラフィック部門","dept_detail":"インフォグラフィック部門(eスポーツ)","title":"ぷよぷよにおける全消し戦略の勝敗影響分析","members":"西澤悠華，八巻陽菜，竹内光悦(実践女子大学)","first_author":"西澤悠華","affiliation":"実践女子大学","code":"I-06","abstract":"eスポーツゲーム「ぷよぷよ」の全消し実行の有無が勝率に与える影響を分析した。全3601ゲーム中369ゲーム（10.2%）で全消しが起こった。","methods":["可視化","統計的検定"],"themes":["試合の流れ"],"data":["公式成績データ"],"free_tags":["全消し","ぷよぷよ"],"awards":["インフォグラフィック部門 学部生奨励賞"],"text_insufficient":false,"excerpt":"","excerpt_src":null},{"id":"2022_soccera_1_5","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーのトラッキングデータに基づく得点機会と得点要因の考察","members":"武田健生，姫野哲人(滋賀大学)","first_author":"武田健生","affiliation":"滋賀大学","code":"P2-03","abstract":"J1リーグ2020年のシュート場面において、シュート前10秒間の選手・ボール動きを分析した。ロジスティック回帰とランダムフォレストにより、ボールの総移動距離とシュート位置がシュート成功に最も重要な要因であることを明らかにした。","methods":["ロジスティック回帰","機械学習","時系列解析"],"themes":["得点予測","シュート","勝敗要因"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年のサッカーは、ポゼッションサッカーと呼ばれる、的確に味方同士でパスをつなぎ、ボールを所持することで試合を支配し優位に進めようとする戦術が主流となっている。では何故ポゼッションサッカーが流行しているのか、何故カウンターサッカーと呼ばれる、相手からボールを奪い、一気に前線にパスをして、ゴールを狙う戦術は衰退しているのか。これらの疑問をサッカーというスポーツにおいて最も重要な場面である「得点機会」 に注目し、分析を行った。 表1に示したサッカーの魅力についてのアンケートにおいても、ゴールが最も注目されている。表 1 サッカーの魅力に関するアンケート(複数回答可)(何でも調査団、2013)順位サッカーの魅力割合1 位ゴール 33% 2 位試合のスピード感 30% 3 位選手の高い技術 27%そこで、本研究では「得点機会」(ゴール場面)について分析することとし、特に以下の2つについて分析することにした。","excerpt_src":"はじめに"},{"id":"2022_soccera_1_7","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"スプリント回数に注目したチームの特徴分析","members":"与座英之，山本義郎(東海大学)","first_author":"与座英之","affiliation":"東海大学","code":"P2-04","abstract":"J1リーグ2020・2021年トラッキングデータを用いて、チームのスプリント回数と走行距離、ボール支配率によるクラスター分析を実施した。階層的クラスタリングにより、走力型、守備型、カウンター型、ボール保持型など異なる戦術的特徴を持つチームを分類した。","methods":["クラスタリング","統計的検定"],"themes":["チーム評価","戦術分析","ポジショニング"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて, プレイする選手には, 必ずボールに触れている時間(以下オンザボール) とボール触れていない時間(以下オフザボール) が存在する.サッカーでは1 人の選手が1 試合にオンザボールの状態になっている時間は多い選手で2~3 分と言われている.[1] 1 試合は約90 分で行われるので, オンザボールの時間よりもオフザボールの時間の方が30 倍あることになる. したがってオフザボールの動きによって, 得点を取ることが重要視されている. オフザボールの動きがシュートシーンを作るうえで重要な要素であることは久保島ら[2] によって明らかとなっている. オフザボール, オンザボールに共通する代表的な動きとしてスプリントがあげられる. 本研究ではこのスプリントを中心にチームの特徴, 得点との関係を調べることを目的にした.","excerpt_src":"はじめに"},{"id":"2022_soccera_1_15","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"ベイズ推定を用いた得点力の評価手法","members":"河原寛治，谷岡広樹(徳島大学)","first_author":"河原寛治","affiliation":"徳島大学","code":"P2-06","abstract":"J1リーグ2020・2021年データを用いてチームの得点力を分析した。シュート数、得点数など複数アクションと年間総得点の相関を検討し、ベイズ推定によって5試合分の統計データから年間総得点を予測可能であることを示した。","methods":["ベイズ統計","回帰分析"],"themes":["得点予測","チーム評価","勝敗要因"],"data":["公式成績データ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"本報告書は,2022 年度スポーツデータサイエンスコンペティションで公開された2020 年のJ1 リーグ第19 節から第23 節までの45 試合と,2021 年のJ1 リーグ第34 節から第38 節までの50 試合のサッカーデータを対象に,各チームの得点力について分析し,ベイズ推定[3] を用いて予測可能な範囲について推定した.","excerpt_src":"はじめに"},{"id":"2022_soccera_1_19","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"フィールドプレイヤーの疲労モデル","members":"林修平(大阪市立大学)，中川満(大阪公立大学)","first_author":"林修平","affiliation":"大阪市立大学","code":"P2-07","abstract":"J1リーグの選手位置情報データを用いてフィールドプレイヤーの疲労モデルを構築した。ラッソ回帰により、総走行距離、高強度走行距離、瞬間的な疲労指標がショートパス成功に与える影響を分析し、疲労がパフォーマンスに及ぼす効果を定量化した。","methods":["回帰分析","機械学習"],"themes":["選手評価","怪我・コンディション","打撃"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーというスポーツにおいて選手の疲労を管理することの重要性は年々高まっている。今回提供されたような選手の位置情報だけでなく、自チームの選手の心拍数をリアルタイムに管理するための製品が導入され、選手の疲労度を把握することが行われている。特に近年ではコロナ禍の影響もあり、選手の交代枠が3 人から 5 人に拡大された。年々インテンシティが高まり選手への身体的負荷が増大する中で、選手の疲労を的確に把握しながら、適切な交代策を講じることが重要視されている。そこで今回は、 提供された選手の位置情報を活用し、選手の疲労モデルの作成を試みた。今回提供されたデータは、心拍数のような自チームの選手のみにとどまらず試合に出場しているすべての選手についての位置情報を取得することができる。対戦相手の疲労状況についてもリアルタイムで分析を行い、交代策に反映されるようなケースを想定して分析を行った。2,分析手法今回はフィールドプレイヤーについての疲労モデルを作成するために、ラッソ回帰を行い、50 分割の交差検証(CV)において MSE を最小化するモデルを選択した。50 分割したのは、推定値の不安定性が起こる可能性を考慮し、 MSE のばらつきをより正確に反映したかったからである。被説明変数としては、フィールドプレイヤーのパフォーマンスを表す指標としてショートパス (37m 以下)が成功したか否かの二値変数を採用した。説明変数の候補としては、以下の 4 つに大別する。1試合を通じた疲労を示す変数○TD (Total Distance):ショートパスを試みた時点までの総走行距離。○HID (High Intensity Distance):ショートパスを試みた時点までの 14km/h 以上での総走行距離。○VHID (Very High Intensity Distance):ショートパスを試みた時点までの 19km/h 以上での総走行距離。2ショートパスを試みる時点における瞬間的な疲労を示す変数○TD_10:ショートパスを試みる直前 10 秒間のTD の移動平均。○TD_30:ショートパスを試みる直前 30 秒間のTD の移動平均。○TD_60:ショートパスを試みる直前 60 秒間のTD の移動平均。○HID_10:ショートパスを試みる直前 10 秒間のHID の移動平均。○HID_30:ショートパスを試みる直前 30 秒間のHID の移動平均。○HID_60:ショートパスを試みる直前 60 秒間のHID の移動平均。○VHID_10 : ショートパスを試みる直前 10 秒間のVHID の移動平均。○VHID_30 : ショートパスを試みる直前 30 秒間のVHID の移動平均。○VHID_60 : ショートパスを試みる直前 60 秒間のVHID の移動平均。3普段の試合との強度の違いを示す変数○TD_Difference:ショートパスを試みた時間における当該試合の TD とその年の全試合の TD の平均との差。○HID_Difference:ショートパスを試みた時間における当該試合の HID とその年の全試合のHID の平均との差。○VHID_Difference:ショートパスを試みた時間における当該試合の VHID とその年の全試合のVHID の平均との差。4制御すべきその他の変数○Speed:ショートパスを試みた瞬間の選手の移動速度。○ShortpassAccuracy:それぞれの選手のその年の全試合を通じたショートパスの成功率。○ポジションダミー:FW_Dummy、MF_Dummy、DF_Dummy の 3 種類のダミー変数。分析用のデータは、提供された play、player、trackingの 2 年分を使用した。","excerpt_src":"本文冒頭"},{"id":"2022_soccera_1_21","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"「ゲーム終盤」における得失点とプレーの変化","members":"澤井荘一郎，伴地芳啓，三家礼子(早稲田大学)","first_author":"澤井荘一郎","affiliation":"早稲田大学","code":"P2-08","abstract":"J1リーグ95試合を対象に、ゲーム終盤（後半最後15分）の得失点とプレーの変化を分析した。統計的検定により、終盤ではシュート数、ドリブル数が増加し、パス成功率が低下することを示し、チーム分類によるプレー比較を実施した。","methods":["統計的検定","クラスタリング"],"themes":["試合の流れ","勝敗要因","戦術分析"],"data":["イベントデータ","トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"2022 年の J リーグYBCルヴァンカップの決勝でセレッソ大阪は後半 90 分の段階で1点リードしていたが,後半アディショナルタイムにサンフレッチェ広島に 2 点を決められ優勝を逃した. セレッソ大阪は2022 年にサンフレッチェ広島と 4 回対戦したが,そのうち 3 試合が終盤に逆転され敗北している. また,今年 J2 降格が決定した清水エスパルスが,後半アディショナルタイムの失点により獲得できなかった勝点が12 と多く,降格の大きな要因となった. これらの 2 チームは実況・解説などでしばしば「ゲームの締め方に課題がある」と言われる.このようにサッカーは終盤にとった点が試合を決めることが多くある. また,先行研究[1]によると終盤は点数が増加する傾向がある. 点数増加の要因としては守備側の体力の低下や,集中力の欠如,攻撃側の積極的選手起用,戦術変更などが考えられる.本研究では J1 リーグにおける「ゲーム終盤」に着目し,得失点やプレーを分析,時間で変化する要素を検討する. また,終盤の得点が多いチーム,少ないチーム,失点の多いチーム,少ないチームで分類し,時間で変化する要素において分類間での比較を行う. 本研究の目的は(1)時間で変化する要素を分析することで,終盤とそれ以外の時間帯におけるプレーを可視化すること,(2)終盤で得点,失点が増減したチームと他アクションとの結びつきを見つけることである.本研究の構成は以下のとおりである. まず,第 2 章で「ゲーム終盤」の得点,失点について分析を行い,第3 章で前後半ごとのアディショナルタイムの長さについて述べる. 第 4 章は「ゲーム終盤」のアクション数分析を,第 5 章でチーム分類ごとのアクション数比較を行う. そして第 6 章で本研究の結論を述べる. 2 「ゲーム終盤」の得点, 失点分析本研究では,J1 リーグで行われた計 95 試合(2020 年度 9 試合 5 節分,2021 年度10 試合 5 節分)を分析対象とする. 分析対象のデータではオウンゴールを含めないゴール数が 236 である. 図 2.1 に 15 分ごとのゴール数を示す. ここでは,アディショナルタイムは前の15 分に含んでいる(前半アディショナルタイムは 45に含んでいる).最後 15 分と他の時間帯について z 検定を行った.図 2.1 より,最後 15 分は他の 15 分よりゴール数が多く,その差は有意な差が認められた(z: 5.48 >1.64).この分析では 45 分,90 分にアディショナルタイムによる時間増加分が含まれているが,45 分には他とほとんど差がないのに対して,90 分は明確に増加している. よって終盤はより点数が入りやすい時間であると言える.","excerpt_src":"序論"},{"id":"2022_soccera_1_27","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"タイプ別に見たJ リーグFW の能力評価","members":"高橋涼，野元幹太，後藤順哉(中央大学)","first_author":"高橋涼","affiliation":"中央大学","code":"P2-09","abstract":"身長・走行距離・スプリント速度により分類したFW4タイプについて、トラッキングデータを用いてシュート関与の特性を分析した。特に身長が小さく瞬発力の高いタイプが、クロスからのシュートで優れたポジショニングを示し、最終ラインとの距離を活用した得点機会創出を実現していた。","methods":["次元削減","可視化","統計的検定"],"themes":["選手評価","打撃","ポジショニング"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"と目的近年、日本サッカーにおいて得点力不足を嘆くチームを良く目にする。実際に日本のプロサッカーリーグであるJ リーグと海外のリーグを比べてみると、2021 年シーズンのJ リーグ総得点数は920 点であるが、同じ試合数のイングランドのプレミアリーグでは2021-2022シーズンの総得点数は1071 点であった。J リーグは得点が少ないことが分かる。本研究ではこの得点力不足という課題に対し、J リーグで現に得点の多い選手に目を向けて複数の視点からその人の特徴を掴み、課題解決に踏み出すことを目的とする。","excerpt_src":"研究の背景"},{"id":"2022_soccera_1_28","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"プレッシングスタイル分類に基づく J1リーグの守備戦術の変移とハイプレス戦術の分析","members":"長﨑健太朗，小林潤子，松澤智史(東京理科大学)，小林正弘(東海大学)，藤澤健吾(東京理科大学)","first_author":"長﨑健太朗","affiliation":"東京理科大学","code":"P2-10","abstract":"2020年と2021年のJ1リーグのプレッシングスタイルを主成分分析とクラスター分析により分類し、守備戦術の変移を調査した。ハイプレス型戦術を採用するチームが好成績を残す傾向を確認し、プレス耐性が高い選手の特性を分析した。","methods":["クラスタリング","ネットワーク分析"],"themes":["戦術分析","プレッシング","守備"],"data":["イベントデータ"],"free_tags":["主成分分析"],"awards":["ポスター部門 優秀賞"],"text_insufficient":false,"excerpt":"サッカーは攻撃,守備という2 局面に分けられることも多いが,攻撃をビルドアップとフィニッシュワーク,守備をプレッシングとブロックに分け,全体として4 局面に分けるという考え方も存在する.ビルドアップは自陣近くでの攻撃,フィニッシュワークは敵陣近くでの攻撃,プレッシングはビルドアップに対する守備,ブロックはフィニッシュワークに対する守備である.攻撃フェーズの中でもフィニッシュワークは個人技によるところが大きく,フィニッシュワークに対する守備であるブロックにはチームの特徴が出にくいことが予想されるため,本研究では,守備の中でもブロックの部分を排除し,プレッシングのみについて考える.チームの戦術が試合結果や試合内容にどのような影響を与えるかという研究は近年注目されている.例えば, Kong et al.[1] では,主成分分析とクラスター分析を用いてチームのプレースタイルが最終的な総合順位に与える影響について分析を行っている.他にも,Fernandez- Navarro et al.[2] では,サッカー戦術に影響を与えるパフォーマンス指標をいくつか設定し,それに対して因子分析を行うことで,どういった因子がどのようにチームのプレースタイルに影響を及ぼすかについての分析を行っている.さらに,守備戦術のみに着目した研究として,ディフェンシブトランジションの成功要因の特定に関する研究(Casal et al.[3])等が行われており,得点に直結する部分である攻撃戦術だけでなく,守備戦術にも関心が集まっている.また,Vogelbein et al.[4] では,ドイツブンデスリーガ2010/2011 シーズンにおいて,上位チームほどボールポゼッション回復に要する時間が短いことが報告されるなど,ハイプレス戦術の有用性が示唆されている.すでに欧州のトップリーグではハイプレスが有効な戦術として浸透しており,ハイプレスへの対応力を表す,プレス耐性の高い選手の分析(Shiuan [5])も進んでいる.本研究では,まずJ1 リーグの守備戦術のトレンドを調査するために,2022 年度スポーツデータサイエンスコンペティションにおいて貸与された2020,2021 年度のJ1リーグのデータを用いてプレッシングスタイルに基づいたクラスタリングを行い,2020 年,2021 年の傾向の変移を調査する.J1 リーグのプレス強度に対する見解・分析(Miyamoto and Kaneki [6])などは以前から多々あるが, J1 リーグのプレス耐性に関する研究は皆無であるため,本研究ではさらにプレス耐性について,特にプレス耐性が高い選手をピックアップし,分析結果・考察をまとめる.","excerpt_src":"はじめに"},{"id":"2022_soccera_1_31","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"J1リーグにおけるスタッツ上の最強ボランチは誰か","members":"中田大地，小川颯之介，古田佑一朗，鈴木天翔，廣津信義(順天堂大学)","first_author":"中田大地","affiliation":"順天堂大学","code":"P2-11","abstract":"2021年と2022年のJ1リーグでボランチ選手の各種パフォーマンス指標に基づき統計的採点により最も優れたボランチ選手を特定した。両年度の上位選手の比較から、攻守において安定したスタッツを記録する選手が高く評価されることを確認した。","methods":["統計的検定","指標開発"],"themes":["選手評価","ポジショニング"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"今回の解析では貸与されたデータをもとに、スタッツ上の最も優れたボランチのプレイヤーは誰なのかについて検討を行った。","excerpt_src":"はじめに"},{"id":"2022_soccera_1_42","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"コロナ収束後のJ1リーグの観客動員数を増やすには","members":"石井似奈，三谷駿輔，朝日弓未(東京理科大学)","first_author":"石井似奈","affiliation":"東京理科大学","code":"P2-14","abstract":"コロナ禍からの回復期におけるJ1リーグの観客動員数の変動要因を重回帰分析により調査した。チケット価格・移動距離・スタジアムキャパシティが重要な説明変数であることを明らかにし、2005年以前の過去研究との比較からコロナ禍での生活習慣変化の影響を分析した。","methods":["回帰分析"],"themes":["経営・制度","観客・ファン"],"data":["外部データ併用"],"free_tags":["相関分析"],"awards":[],"text_insufficient":false,"excerpt":"J1 リーグは 2000 年以降長期的に平均観客動員数が停滞している。 また、 コロナ禍において様々な制限や生活習慣の変化に伴い、観客動員数は大幅に減った。 しかし、 緊急事態宣言や蔓延防止措置が解除されると、 徐々に従来の平均観客動員数に戻りつつある。 しかし、 長期的に見て、平均観客動員数を従来と同じ水準以上に増やすにはどうしていけばいいのかを知る必要がある。観客動員数の減少、 増加の要因を知る為には、 観客動員数を予測する説明変数モデルを作ることが有効である。河合慎祐・平田竹男が行った先行研究「J リーグの観客数に影響を与える要因に関する研究」では、観客動員数の 5 割程度を説明できる説明変数モデルを導くことが出来た。 この先行研究では1993 年から 2005 年の J1 リーグの全試合のデータを使い、2005 年以前の観客動員数の説明変数モデルを作っている。これらのことから、本研究ではコロナ収束後の観客動員数を増やす方法を見つける為に二つの目標を目指す。目標をそれぞれ A.B と設定する。一つ目の目標 A が、2005 年以前のデータを用いた河合慎祐・平田竹男の先行研究の説明変数モデルに用いられた説明変数を従属変数、コロナ収束後の観客動員数を目的変数として重回帰分析を行う。 それにより、 コロナ収束後の観客動員数の要因が 2005 年以前の観客動員数の要因と比べどの様に変化しているかを知ること。また、本研究では「コロナ収束後」を全国的に緊急事態宣言・蔓延防止措置が解除された 2021 年 10 月以降と定義し、 観客動員数の要因を調べるデータも2021 年度10 月以降の試合から最終戦までと限定している。二つ目の目標 B が河合と平田により導き出された説明変数に加えてコロナ禍による制限や生活習慣の変化を踏まえた説明変数モデルを加えることで、 コロナ収束後の観客動員数を十分に説明できる説明変数モデルを新たに作ることだ。コロナ禍で J1 リーグの観戦に対して大きな影響を与えたことがタオルや旗の使用許可やアルコール飲料の販売制限などガイドラインによる制限である。 また、 生活習慣の面でいうとステイホームによるオンライン観戦の普及などである。 これらのことから、 先行研究で導き出された既存の説明変数に新たに、 「ガイドラインのゆるみ」 「テレビ放送の有無」 を加えた。 また、2021 年10 月以降の試合では雨が降った試合が 1 試合しかなかった為、 先行研究で用いられていた既存の説明変数 「雨」を無くした。","excerpt_src":"研究背景と目的"},{"id":"2022_soccera_1_52","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"トラッキングデータによるプレー難易度の推定","members":"橘川和司(横浜市立大学)，小泉和之(順天堂大学)","first_author":"橘川和司","affiliation":"横浜市立大学","code":"P2-16","abstract":"ガウス混合回帰を用いて選手の行動可能領域を予測し、ボールホルダーに対するプレッシャーの度合いを定量化することでプレー難易度を推定する手法を提案した。難易度を考慮した選手のプレー精度評価を実現した。","methods":["ベイズ統計","機械学習","シミュレーション"],"themes":["選手評価","ポジショニング"],"data":["トラッキングデータ"],"free_tags":[],"awards":["ポスター部門 優秀賞"],"text_insufficient":false,"excerpt":"近年のサッカー界では戦術の重要度が高くなっている。戦術の重要度が増すにつれて技術の発達とともにサッカー界でもデータの活用が注目されている。試合のデータの分析やトレーニングデータの分析, 選手の獲得をする際のデータ活用等様々である。そんな中でも本研究では「試合における選手のプレー精度の比較」という点に着目する。図1ディフェンダーの選手のパスの成功に関するスタッツ.上の図1 は2021 年のj1 リーグでのとある試合におけるディフェンダーの選手のパスにまつわる能力を比較した表である。この図1 からは純粋なパスの成功率を見ることができる。しかし, 例えば図1 にある小池選手の10 回のパスが全て誰からもプレッシャーを受けておらず, プロであればミスが許されないパスであった場合どうだろうか。このように既存のスタッツだけでは選手の評価を誤ってしまう場合がある。また, 監督やコーチは日々選手に対して思考を巡らせていることが考えられる。しかし, 優秀な選手を見逃してしまうこともあるのではないかと私は考えた。そして, そのようなことを避けるために定量的な数値で選手の比較ができることは重要な要素なのではないかと考えた。以上の理由から本研究では「試合における選手のプレー精度の比較」を行うためにトラッキングデータからプレー難易度を推定することを目的とした。プレー難易度を推定できれば, 難易度が高い状況で各々の選手がどれくらい精度が高いプレーができているかで選手の能力比較が可能だと考えた。2, 先行研究。3, 使用した技術の解説。4,実験における状況の解説。5,2 つの提案手法。6, 今後の課題と改善。という流れで進めていく。","excerpt_src":"本文冒頭"},{"id":"2022_soccera_1_54","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"先制点を取られたチームが追いつくためには","members":"古川修多，溝口由人，矢ケ崎樂，安藤雅和(千葉工業大学)","first_author":"古川修多","affiliation":"千葉工業大学","code":"P2-17","abstract":"J1リーグの試合データから先制点を取られたチームが同点に追いつくための有効な戦術を検証した。クロス数とボールタッチ数の増加が統計的に有意な効果を持つことを確認し、追い付いた試合の1/3でクロスからの得点が観測された。","methods":["統計的検定","時系列解析"],"themes":["勝敗要因","戦術分析","得点予測"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーの特性として、得点が入りづらい点があげられる。1試合、1チーム当たりの得点数は大抵0~2点。はたまた4点を超えるような試合は極めて少ない。そのようなスポーツでは、先制点がとても重要となってくる。実際、2018,2019年のJ1リーグで先制点を取ったチームの勝率は約69%。先制点を取ったチームが勝敗においていかに優位に立てるかがわかる。しかし、先制点を取られても、同点に追いつく又は逆転をする試合ももちろん存在する。そこで我々は、先制点を取られ不利な状況に陥ったチームが、試合を振り出しに戻すにはどのような戦術を取るべきであるかを研究することにした。","excerpt_src":"はじめに"},{"id":"2022_soccera_1_59","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカー試合中の選手交代が走パフォーマンスに及ぼす波及効果の解析：2020新ルールに伴う効果的な選手交代の最適化支援","members":"廣末存果，玉置亘，荻野心，石原夏季，吉田愛理，綾部誠也(岡山県立大学)","first_author":"廣末存果","affiliation":"岡山県立大学","code":"P2-19","abstract":"選手交代人数の上限が3名から5名に拡大された2020年ルール下での走パフォーマンスの変化を分析した。交代人数が多いほど試合中の走パフォーマンスが向上すること、および交代出場選手が高い平均速度を示すことを確認した。","methods":["統計的検定"],"themes":["選手起用","怪我・コンディション"],"data":["トラッキングデータ"],"free_tags":["分散分析"],"awards":[],"text_insufficient":false,"excerpt":"サッカーは,1チームの人数が11人とされ,1名のGKと10名のフィールドプレイヤーで行われる競技である.FIFA(国際サッカー連盟)は,Covid-19感染拡大に伴う措置としてのルール改正として,2020年シーズンから選手交代の人数を変更した.試合中の選手交代の人数上限は,従来の3名から2020年から5名に拡大された.このルールは,2022年に永続的な変更なることが示された.すなわち,このルール変更により,サッカーは,試合中に約半数の選手を交代できることになった. サッカーの選手交代は,怪我や疲労などの身体的な理由と試合状況に応じた戦術的理由に区分できる.すなわち,交代選手数の上限拡大により,90分間を通じたスピーディーな試合展開,選手のコンディション管理や怪我欠場の予防,また,90分間の中での多様な戦術の実践,試合状況に応じた作戦変更などの効果を期待できる.すなわち,選手交代の効果を最大限に高めることがサッカーの競技力向上に貢献でき,この度の交代人数の拡大により監督の采配(ペンチワーク)の持つ役割が大きくなったと言える.","excerpt_src":"はじめに"},{"id":"2022_soccera_1_62","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"セレッソ大阪における試合走行距離に起因する要因","members":"西尾育観，山路学(長崎総合科学大学)","first_author":"西尾育観","affiliation":"長崎総合科学大学","code":"P2-20","abstract":"セレッソ大阪の2021年シーズンのデータを用いて、試合の総走行距離に影響を与えるプレー要因を重回帰分析により特定した。スプリント回数・ブロック・こぼれ球奪取が走行距離の増加に貢献し、ポジション別の特性差を明らかにした。","methods":["回帰分析"],"themes":["選手評価","怪我・コンディション"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいて、走力は欠かすことのできない要素であると言える。 指導者の中には、 相手に走り負けないことを重視し持久力を中心にトレーニングを行うこともある。サッカーにおける走力には、1 試合を走り続けるための持久力や、トップスピードに持っていくための瞬発力や方向転換能力など多岐にわたるが、本研究では、 試合ごとの総走行距離に着目した。 多く走る選手は試合にどのような貢献をしているのかを検討していく。","excerpt_src":"はじめに"},{"id":"2022_soccera_1_66","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"Wasserstein距離を用いたK-means法によるフォーメーションの自動検知","members":"髙澤祐槻，安藤瞭(東京大学)","first_author":"髙澤祐槻","affiliation":"東京大学","code":"[口頭]サッカー1","abstract":"Wasserstein距離を用いたK-means法により、トラッキングデータから選手配置をクラスタリングすることでフォーメーションを自動検知する手法を提案した。従来の予想フォーメーションとの相関検証により、提案手法の妥当性を確認した。","methods":["機械学習","クラスタリング","最適化"],"themes":["戦術分析","フォーメーション"],"data":["トラッキングデータ"],"free_tags":[],"awards":["サッカー部門 最優秀賞"],"text_insufficient":false,"excerpt":"サッカーにおいて,フォーメーションを用いた戦術の議論は盛んである.フォーメーションは選手の並び方を数列で表すことが通常であり,例えば,「4-4-2」と言った場合,ディフェンダー(DF),ミッドフィルダー(MF), フォワード(FW) がそれぞれ4,4,2 人並ぶ選手の配置を示す.一方,実際のサッカーの試合では想定された形が常時維持されることはない.特に現代サッカーでは,攻撃時か守備時かや,時間帯・点差などに応じて試合中にフォーメーションが変化することがある.また,同一のフォーメーションにおいても,プレス戦術などの種類によって細かい配置は大きく変化しうる.そのような場合,単一の「フォーメーション」によって戦術を捉えることは難しいと考えられる.本研究では,まず試合中の各瞬間における選手の配置全体の平均を求め,またその手法を用いて配置のクラスタリングを行う.これは,各選手に対し平均位置を求める単純な手法と異なり,チーム全体の形の平均を捉えることができる.また,完全にデータからフォーメーションをクラスターに分割していることから,従来の先入観にとらわれずに試合の分析を行うことができると期待される.本稿では,まず2 節で用いるデータの分析手順と適用する手法の概略を述べる.続いて3 節でFr ́echet 平均, K-means 法についての理論的背景を簡潔に述べた後,4 節で実際のクラスタリング結果について議論する.最後に5節でまとめを行う.","excerpt_src":"はじめに"},{"id":"2022_soccera_1_8","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"シュート予測モデルを用いた相手ゴール付近におけるスローインの攻撃有効性検証","members":"黒木進，林拓未，百武弘登(広島市立大学)","first_author":"黒木進","affiliation":"広島市立大学","code":"[口頭]サッカー2","abstract":"J1リーグ2021年34～37節のデータを用いてシュート予測モデルを構築し、スローインの有効性を検証した。XGBoostによるモデルより、ロングスローはシュートに結びつきやすい一方、失敗時には相手攻撃に転換するリスクが高いことを示した。","methods":["機械学習","勾配ブースティング"],"themes":["戦術分析","セットプレー","得点予測"],"data":["イベントデータ","トラッキングデータ"],"free_tags":["スローイン"],"awards":[],"text_insufficient":false,"excerpt":"スポーツは IT の発展とともに,多くのデータを利用することが可能で,サッカーにおいては特に欧州を中心にチーム強化 (for teams) のためにデータを利用することが必要不可欠になっている.本研究では,データスタジアム社が提供したボールタッチデータおよびトラッキングデータを用い,プレーしたチームが将来,シュートまでたどり着くかどうかを予測するモデルを構築し,相手ゴール付近でのスローインとシュートの関係を検証する.","excerpt_src":"はじめに"},{"id":"2022_soccera_1_3","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"ゴール期待値を用いた評価指標作成とその活用","members":"福田遥也(横浜市立大学)，小泉和之(順天堂大学)","first_author":"福田遥也","affiliation":"横浜市立大学","code":"[口頭]サッカー3","abstract":"ゴール期待値とその関連指標を定義し、これらを用いた選手・チーム評価手法を提案する。J1リーグの2020・2021年データを用いてランダムフォレストとロジスティック回帰モデルで指標を算出し、実際の選手・チーム評価に応用した。","methods":["ロジスティック回帰","機械学習","指標開発","可視化"],"themes":["選手評価","チーム評価","シュート","得点予測"],"data":["イベントデータ","トラッキングデータ"],"free_tags":[],"awards":["サッカー部門 優秀賞"],"text_insufficient":false,"excerpt":"サッカーは得点が簡単に入るスポーツではない. それゆえに, 1つ1つのゴールが人々を一喜一憂させ, ゴールに最も注目が集まる. そんなサッカーの試合中継において,3 年ほど前から,「ゴール期待値(Expected Goals)」という言葉が用いられるようになった. ゴール期待値はxG と表記され, 放ったシュートがゴールに入る確率をモデルによって算出したもので, メディアを中心に既に広く浸透している指標である. 今では, 試合が終われば, 得点数とゴール期待値の合計が比較され, 試合結果に対する議論が生まれる. FW(フォワード) のパフォーマンスを評価するのであれば,得点数とゴール期待値の合計が並べられる. シュートに対するデータサイエンス的なアプローチは, シュート自体やゴール数に対する評価の考え方を大きく変えたのである.そして, 次なるものとしてアシスト期待値が既にopta*1などのデータサイトで扱われており, 広まってきているが,それを用いてもパスまでしか評価できない. サッカーにはドリブルもあれば, 守備者もいる. 攻撃アクションはもちろん, 守備アクションに対しても, データによる客観的な評価を行える指標が必要になってくると考えられる.本研究は, ゴール期待値のアプローチを参考にし, シュート以外の項目に対する指標を作成し, 選手評価で活用することを目的としている.","excerpt_src":"はじめに"},{"id":"2022_soccera_1_9","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるボールの位置を考慮した選手とチームのボール保持時間分布の解析","members":"上江洲清哉(琉球大学)，成塚拓真(立正大学)，香川渓一郎，山崎義弘(早稲田大学)，山本健(琉球大学)","first_author":"上江洲清哉","affiliation":"琉球大学","code":"[口頭]サッカー5","abstract":"J1リーグ2020・2021年のトラッキングデータおよびプレーデータを用いてボール保持時間分布を解析した。選手個別のボール保持時間はガンマ分布に従い、複数選手による保持時間は混合幾何分布で表現されることを理論的に検証した。","methods":["時系列解析","確率モデル"],"themes":["ポジショニング","戦術分析","試合の流れ"],"data":["トラッキングデータ","イベントデータ"],"free_tags":["統計分析"],"awards":[],"text_insufficient":false,"excerpt":"サッカーにおいてボールの保持・支配は重要な要素であるが,高いボール支配率が必ずしも勝利に直結するわけではない。たとえば,2022 FIFA ワールドカップの日本対スペイン戦(現地時間2022 年12 月1 日)では,勝利を収めた日本のボール支配率は17.7% であった(この支配率はワールドカップの歴代の勝利チームの中で最低値である)[1]。選手やチーム単位で効果的な攻撃をおこなうには,ボール保持というイベントの特性を理解することが必要であると示唆される。ボール支配率は試合全体の各チームのボール保持から求められる量である。ボール保持をより細かくみると,一方のチームが連続してボールを保持する時間(チームのボール保持時間)に分解できる。さらに,チームのボール保持時間は各選手のボール保持時間に切り分けることができる。選手のボール保持時間の確率密度関数をf1(t), チームのボール保持時間の確率密度関数をfteam(t) と表す。これら2 種類のボール保持時間の関係を求めるために,1 回のチームのボール保持イベントを,イベント中にボールを保持した延べ人数n ごとに分解して考える。","excerpt_src":"はじめに"},{"id":"2022_soccera_1_51","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"選手の相対的位置と能力値を考慮した守備評価モデルの提案","members":"平山颯太，若林大起，大原剛三(青山学院大学)","first_author":"平山颯太","affiliation":"青山学院大学","code":"[口頭]サッカー6","abstract":"機械学習モデルを用いた守備評価指標の構築において、選手間の相対的位置関係を尖度・歪度により、選手能力をパス成功率・タックル成功率により定量化し、より適切な守備評価値の算出を実現した。","methods":["機械学習","勾配ブースティング","統計的検定"],"themes":["選手評価","守備"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"サッカーは他のチームスポーツに比べて平均得点数が少ないため,守備が重要であると言われている[1].そのため,守備の分析はチーム強化に欠かせない要因の1つであり,ボール保有時間などの統計情報を用いた研究が行われている[2].しかし,統計情報のみでは,複数の選手が相互に関係する守備を適切に評価するには限界がある.そこで,Toda ら[3] は,機械学習モデルを用いて選手のアクションおよび全選手とボールの位置情報からボール奪取確率と有効攻撃確率を推定し,それらを用いて,Valuating Defense by Estimating Probabilitie(VDEP)と呼ぶ守備評価指標を定義している.しかし,この指標では,選手間の相対的な位置関係や選手の能力値は考慮されていない.そこで本研究では,Toda らの研究と同様にボール奪取確率と有効攻撃確率から守備評価値を算出する際に,選手間の相対的な位置関係を考慮するために,偏りと密集度を表す統計量である尖度と歪度を参考にした選手位置尖度と選手位置歪度を特徴量に加える.また,選手の能力値を考慮するために,各選手のパス成功率とタックル成功率をパスとタックルというイベントの有無に対する重みとして用いる.一方,本研究で提案する手法では,Toda らの研究とは異なり,ボール奪取確率と有効攻撃確率は単一の予測モデルで推定する.実際の試合データに対して提案手法を適用した結果,選手間の偏りや密集度,選手の能力値を用いることで,予測モデルの精度が向上し,より適切に守備評価値の算出が可能になったことを確認した.","excerpt_src":"はじめに"},{"id":"2022_soccera_1_20","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"サッカーにおけるシュート期待数による選手の評価と特徴分析","members":"榎本賢，出口和希，金子雄祐，伴地芳啓，三家礼子(早稲田大学)","first_author":"榎本賢","affiliation":"早稲田大学","code":"[口頭]サッカー7","abstract":"J1リーグのプレーデータとトラッキングデータを用いてシュート期待数を算出し、実際のシュート数と比較することで選手を評価した。機械学習モデルにより、シュート生産性が高い選手はより広い距離からシュートを打ち、ドリブルを活用した積極的なプレーを特徴とすることを明らかにした。","methods":["機械学習","勾配ブースティング","指標開発"],"themes":["選手評価","シュート","打撃"],"data":["イベントデータ","トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"日本サッカーにおいて,「日本人選手はなぜシュートを打たないのか?」 という問題は言い古されたテーマであるが, いまだ根本的な解決はされていない. 実際に,プレミアリーグ(イングランドのプロサッカー1 部リーグ)と J1 リーグ(日本のプロサッカー1 部リーグ)のシュート数とゴール数を比較すると,J1 リーグはプレミアリーグより 1 試合当たりのシュート数が 5~9 本程度少ないことが分かる(表 1)[1][2].またシュート数とゴール数との関係を見ると, 日本サッカーは高いゴール率が特徴的でそれが長所であるともいえるが,それでもシュート数が少ないためか,やはりゴール数に関してもプレミアリーグが上回っていることが多い.日本人選手がシュートに消極的なのは,シュートを外すリスクを異常に恐れる日本人のメンタル的特性や,出来るだけパスを繋いでシュートを打つコンビネーション練習が育成年代の土台となっていることが要因として考えられている. こうした背景から,しばしば日本は世界に通用するストライカーが生まれにくい土壌であると言われたり, 日本のサッカーはシュートが少なく点も入らない退屈なスポーツだという偏見が存在したりもする.本研究では,J1 リーグにおけるシュート場面に着目し,まず選手が試合中にどれほどの数のシュートを打つことが期待されたかを表すシュート期待数の算出について検討する. 次に, シュート期待数と実際のシュート数を比較して選手を評価し, シュートチャンスを活かしている選手とそうでない選手のシュート場面の違いについて考察する.本研究の目的は,(1)シュートチャンスを活かしている選手を評価すること,(2)シュートチャンスを活かしている選手とそうでない選手の特徴を分析することである.","excerpt_src":"はじめに"},{"id":"2022_soccera_1_11","year":2022,"dept":"サッカー部門","dept_detail":"サッカー部門","title":"最小到達時間に基づくサッカーのパス回しとポジショニング分析","members":"坂本郁也(中央大学)，香川渓一郎(早稲田大学)，山本健(琉球大学)，山崎義弘(早稲田大学)，成塚拓真(立正大学)","first_author":"坂本郁也","affiliation":"中央大学","code":"[口頭]サッカー9","abstract":"J1リーグ2020・2021年データを用いて、最小到達時間に基づくスペース評価の枠組みを適用した。パス回しのモチーフ分析により戦術的特徴を抽出し、選手のポジショニング分析によってポジション別の守備的・攻撃的特性を定量化した。","methods":["ネットワーク分析","クラスタリング","空間分析"],"themes":["戦術分析","ポジショニング","スペース評価","選手評価"],"data":["トラッキングデータ","イベントデータ"],"free_tags":[],"awards":["サッカー部門 優秀賞"],"text_insufficient":false,"excerpt":"サッカーにおけるスペースの定量化にはボロノイ領域やその拡張である優勢領域[1] が広く用いられてきた.しかし,優勢領域のようにフィールドの分割に基づく手法は領域内部が一様に扱われるため,最近はフィールドを連続変数で重み付けする手法が発展している.これまでに提案されている代表的な重み付け手法としては,パス確率[2],選手の影響度[3],得点期待値[4] などが挙げられる.これらを用いると,オフザボールのプレイについても定量的な試合分析が可能になる.一方,我々も同様の問題意識の下,最小到達時間に基づくスペース評価の枠組みを提案した[5].この枠組みの特徴は,選手からの到達時間を基にフィールド上の各位置を重み付けする点であり,優勢領域の自然な拡張となっている.本枠組みについてこれまでに行った研究は,2 チームの最小到達時間に基づく安全度・空白度の提案とパス解析への応用,最小到達時間を計算するための運動モデルの提案[6] であり,実際の試合分析への応用は進んでいない.そこで本研究では,最小到達時間に基づくスペース評価の枠組み[5] を用いて,(I) パス回しのモチーフ分析,および,(II) 選手のポジショニング分析を行う.","excerpt_src":"はじめに"},{"id":"2022_judoa_1_32","year":2022,"dept":"柔道部門","dept_detail":"柔道部門","title":"柔道世界選手権で先に反則をした選手の勝敗について","members":"武藤大樹，岡庭聖也，小山愛莉，山口颯斗，中村陽南，廣津信義(順天堂大学)","first_author":"武藤大樹","affiliation":"順天堂大学","code":"P1-01","abstract":"2018年から2021年の世界選手権データを分析し、先に反則を取られた選手の勝敗傾向を調査した。全試合の約3割で反則がなく、反則があった試合では先に反則をした選手が約35%の確率で勝利するという結果から、反則と勝敗の関連性を検証した。","methods":["統計的検定","可視化"],"themes":["勝敗要因","ルール変更"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"日本統計学会スポーツデータサイエンス分科会,情報・システム研究気候統計数理研究所が主催する,第 11回スポーツデータサイエンスコンペティションにおいて,公益財団法人全日本柔道連盟・科学研究部より貸与されたデータを用いて,2018 年度, 2019年度,2021年度の世界選手権のデータを抽出し,反則行為が試合結果にどのように影響を与えるのかについて検討を行った.本稿では,解析手段とその結果を報告する.","excerpt_src":"はじめに"},{"id":"2022_judoa_1_60","year":2022,"dept":"柔道部門","dept_detail":"柔道部門","title":"時間を考慮した視認性の高い優劣判定システムの考案","members":"大塚功太郎，長谷川弘貴，関くるみ，丹野康世(筑波大学)，浮田嵩祐(九州工業大学)，矢田和善(筑波大学)","first_author":"大塚功太郎","affiliation":"筑波大学","code":"P1-02","abstract":"柔道試合の優劣判定の分かりやすさを向上させるため、時間加重スコアを考慮した分析を行った。ロジスティック回帰、LSTM、時間における重み付けスコアの三つの手法を用いて勝敗予測を行い、時間考慮により正解率は0.852に向上した。","methods":["ロジスティック回帰","ニューラルネットワーク","統計的検定","可視化"],"themes":["試合の流れ","勝敗要因"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"2020 年度におけるサッカーの競技人口が約92 万人,バスケの競技人口が約60 万人だったことに対し,柔道の競技人口は約14 万人と,国技であるのに関わらず,他のスポーツと比べると少ないことが分かる[1].今回私たちの班は柔道の競技人口が少ない理由として,勝敗・優劣判定が分かりにくいことが1 つの原因と考察した.そこで今回は試合を通して,一般の人が見ても一目で分かる優劣判定システムの提案を行う.","excerpt_src":"はじめに"},{"id":"2022_judoa_1_64","year":2022,"dept":"柔道部門","dept_detail":"柔道部門","title":"柔道試合における選手の「振り回され度」に基づく優勢/劣勢指標の提案","members":"坂本奨馬，今井桜，友野珠緒，華山宣胤(尚美学園大学)","first_author":"坂本奨馬","affiliation":"尚美学園大学","code":"[口頭]柔道1","abstract":"柔道試合における選手の立ち位置の移動距離に移動方向の変化を乗じた「振り回され度」を定義した。2021年世界柔道選手権の9試合を分析した結果、勝者の振り回され度の平均値は0.68で分散が小さく、この値からの偏差により試合中の優劣を判定する指標を提案した。","methods":["統計的検定","空間分析","可視化"],"themes":["選手評価","試合の流れ","勝敗要因"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"筆者らは,2021 世界柔道選手権ブダペスト大会・男子 66 キロ級の試合動画の観察から,「負けた選手は,対戦相手に引きずられ振り回された結果,バランスを崩して投げられる」または「技を繰り出すことが出来ずに反則を取られる」ことが多いように感じた.そこで,本研究では,柔道の試合における各選手の立ち位置の移動距離に移動方向の変化(角変の絶対値)を乗じた値を各選手が対戦相手に振り回された程度(振り回され度)を表す指標と考え,振り回され度と試合の勝敗について議論する. また,振り回され度を用いて,試合中の優勢/劣勢を示す方法について提案する.試合における各選手の立ち位置の移動距離と移動方向に関するデータは,(公財)全日本柔道連盟・科学研究部より提供された 2021 世界柔道選手権ブダペスト大会・男子 66 キロ級の試合動画から各選手の足の位置を観測することによって収集する.男子 66 キロ級を選んだ理由は,筆者らの男性とほぼ同じ体重であることから,体の動かし方について想像し易いと考えたためである.各選手の足の位置に関するデータは,遠近法に基づいて畳面にグリッドラインを引き,目視によって足位置を,1 秒間隔で測定することにより収集した(第2節) .柔道では試合時間が長くなると疲労により選手の動きが変化する.つまり,短い試合と長い試合では選手の動き方が異なるのである.しかし本研究では,同じ条件の下での選手の動きを観察したいため,試合時間の比較的短い 9 試合に注目しデータの収集を行った.そして得られた各選手の足位置データから,各選手の立ち位置の移動距離に移動方向の変化(角変化の絶対値)を乗じた「振り回され度」を算出し,各試合の平均値を算出した(第3節).算出された各選手の「振り回され度」の各試合での平均値を観察すると,筆者らが動画を観察して得た感想を同様に, 「振り回され度」 が小さい選手が勝利しているように思われた.そこで,対応のある一対の標本に対する t 検定を行ったところ,P 値(片側)≒0.15 であった.この結果からは,勝敗における「振り回され度」の影響を有意と認めることは出来ないものの,ある程度「振り回され度」により勝敗を予測することが出来る, つまり, 「振り回され度」が小さい方が勝利する可能性が高いと言えるのではないかと思われた(第4節) .「振り回され度」に対する t 検定の結果は,P 値の値が十分に小さくなかったが,ある程度「振り回され度」が小さい方が勝利する確率が高いことが示唆された.しかし筆者らは,オリンピックでの試合後のインタビューなどで「十分に動けたため勝利できた」といった談話を聞いたことがあるように思い,このような結論は尤もらしくないと思った.そこで,各試合の「振り回され度」の平均を再度検討したところ,勝利した選手の「振り回され度」は,負けた選手のものに比べて,バラツキが小さいことが分かった. つまり,「振り回され度」には勝利に結びつく理想値があるのではないかと思われた.そこで,本研究の結論として, 「振り回され度」 には勝利に結びつく理想値の推定値を示し,その理想値へどれだけ接近しているかを示す指標を,試合における優勢/劣勢を示す指標として提案する(第5節).","excerpt_src":"はじめに"},{"id":"2022_judoa_1_26","year":2022,"dept":"柔道部門","dept_detail":"柔道部門","title":"柔道における試合状況の可視化と選手の実力の定量化指標の提案","members":"番井涼太，川村陸哉，与座英之，大河内菜月，山本義郎(東海大学)","first_author":"番井涼太","affiliation":"東海大学","code":"[口頭]柔道2","abstract":"Elo-ratingの手法を柔道に適用して選手の実力を定量的に評価するレーティングシステムを提案した。2016年から2021年の66kg級データを用いてK=16、H=400の最適パラメータを決定し、ロジスティック回帰モデルにより従来の加算方式と比較して実力評価精度を向上させた。","methods":["ロジスティック回帰","統計的検定","可視化"],"themes":["選手評価","チーム評価","勝敗要因"],"data":["公式成績データ"],"free_tags":["Elo-rating","レーティング手法"],"awards":[],"text_insufficient":false,"excerpt":"スポーツにおいて, 試合結果に基づき, 選手・チーム間の序列を定めるランキング制度は, 大会への参加基準やシード対象選手(チーム) の選定基準になるなど, 適切な設計が要求される事項である. 国際柔道連盟(IJF) は他のメジャースポーツ同様に, ポイント制を導入することで競技者同士の実力を客観的に評価することを目的に2009 年1月からランキング制度を導入している. IJF ランキングは,オリンピック, 世界選手権, ワールドマスターズ(出場資格は世界ランキング上位36 名のみ), グランドスラム, グランプリ, 大陸選手権など, 代表的な国際大会の成績をもとにランキングを決定している. 表1 に得られるランキングポイントを示すが, 獲得ポイントの妥当性については検討の余地がある. また, ポイントが加算される方式のため, 出場する大会が多い選手のランキングは高くなる.本研究では, 柔道において適切なレーティング手法を検討し, 選手の実力の評価方法と, 試合の分類方法を提案する. 具体的には, ある時点で各力士にその実力を表す一つのパラメータ(レーティングと呼ぶ) を想定し, その差がロジスティック回帰モデルを通して勝率を予測するモデルを柔道選手の実力評価に利用することを提案する. 同様の手法は, バレーボール[1] をはじめとした様々な競技・大会で世界ランキングで正確に実力を評価していることがすでに報告されている. この手法を柔道競技に対しても適応することが本研究の目的である. また, 選手の実力の定義方法と, それに基づいた試合の分類についても報告する. 対戦相手の実力差がある試合とない試合で比較した際に, 試合内容に特徴が現れるかも検討する.","excerpt_src":"はじめに"},{"id":"2022_judoa_1_34","year":2022,"dept":"柔道部門","dept_detail":"柔道部門","title":"Video object segmentationを用いた柔道試合動画での姿勢推定と組み手時の姿勢分析への応用","members":"盛拓矢，志茂衛，北島栄司，宮田龍太(琉球大学)","first_author":"盛拓矢","affiliation":"琉球大学","code":"[口頭]柔道3","abstract":"Video object segmentationを前処理として用いることで柔道試合動画における姿勢推定の精度を向上させた。Detectron2によるVOS初期マスク生成、XMemによる領域追従、3次元姿勢推定モデルの適用により、組み手時の両選手の体勢を可視化することができた。","methods":["画像認識・姿勢推定","深層学習","可視化"],"themes":["選手評価","守備"],"data":["映像データ"],"free_tags":["姿勢推定","セグメンテーション"],"awards":[],"text_insufficient":false,"excerpt":"近年,動画に映る人物の肩や腰といった関節の位置をマーカーレスに取得するAI である姿勢推定モデルをスポーツの動作分析に導入する事例が増えている.この技術により,試合中の選手の各瞬間の動きを動画のみから詳細に記録できるため,これまでの感覚的な指導から脱却し,データに基づいた客観的なアドバイスを行うことで選手の上達効率化に繋がると期待されている.第11 回スポーツデータ解析コンペティション· 卓球部門で仲宗根ら(2022)[1] は,姿勢推定モデルをT リーグの試合動画に適用することで選手のドライブ打法のスイング軌跡を3D で可視化し,返球成功時と失敗時での違いを明らかにした.姿勢推定モデルは,動画に単体かつ直立で映っている人物の関節座標は取得しやすいが,相手の襟と袖を握る組み手が基本姿勢である柔道の試合動画では,腕の長さよりも少し近い距離で両選手が重なって映るため,導入が困難であった.第11 回スポーツデータ解析コンペティション·柔道部門で最優秀賞を獲得した鷲見ら(2022)[2] は,柔道の試合動画に従来の姿勢推定モデルを適用すると,基本的に直立で姿勢の良い審判の関節情報を検出してしまい,彼らが着目したい選手の関節座標が適確に取得できなかったため,姿勢推定モデルの使用を断念し,固技に入ったときに選手が織り成す「全体の形状」を物体検出モデルで捉える方針に切り替えたと経緯報告した.本研究では柔道の試合動画にも姿勢推定モデルを適用可能にするべく,試行錯誤を重ねた末に,video object segmentation(VOS)を前処理に使う着想に至った.VOSは動画に映った特定の物体の領域を囲む画像認識技術で,これにより選手のみ表示(観客や審判の映り込みを削除)できるため,姿勢推定モデルが選手に着目しやすくなるのではないかと考えた.柔道の試合動画にVOS 適用後,各関節の上下左右方向に加えて奥行き方向の座標も取得できる3 次元の姿勢推定モデルを適用すると,各選手の試合中の動きを従来よりも詳細に捉えらえることを確認した.さらに提案手法の応用として,試合で技ありと判定された足技をかける/かけられる直前の両選手の組み手の体勢を可視化した.","excerpt_src":"はじめに"},{"id":"2022_judoa_1_22","year":2022,"dept":"柔道部門","dept_detail":"柔道部門","title":"柔道における消極的指導の判定時間の推定とそれに基づいた優勢度合いの可視化","members":"鷲見輝久，伴地芳啓，三家礼子(早稲田大学)","first_author":"鷲見輝久","affiliation":"早稲田大学","code":"[口頭]柔道4","abstract":"消極的指導の判定時間を推定し、優勢度合いを定量的に表現する手法を検討した。ダイナミックタイムワーピングとベイズ最適化を用いて特定審判の判定時間を20秒と推定し、各アクションの重みを最適化することで、柔道試合の優劣を可視化することが可能になった。","methods":["ベイズ統計","可視化"],"themes":["選手評価","試合の流れ","勝敗要因"],"data":["映像データ"],"free_tags":["消極的指導","審判判定","ダイナミックタイムワーピング"],"awards":["柔道部門 最優秀賞"],"text_insufficient":false,"excerpt":"柔道の試合中継には、一目見ただけではどちらの選手が優勢かの判断がつきづらいという課題がある。類似した課題のあるコンテンツとして将棋が挙げられるが、動画配信サービスABEMAで配信されている将棋中継番組「将棋チャンネル」ではこの課題を解決するために、2019年12月から機械学習による盤面分析システム「SHOGI AI」を用いて盤面から両プレイヤーの勝率を算出し、それを図1.1のように中継の画面上に表示させる取り組みを開始したところ、新たな視聴者層の獲得に繋がり視聴者数の向上に成功した[1]。 本分析ではこの将棋の前例に習い、柔道のエンターテインメント性の向上を目的として、優勢度合いを定量的に表すことを目指す。具体的には、柔道における優勢を「積極的に攻めている状態」と定義した上で「消極的指導」という反則に着目し、消極的と判定されたプレーとの類似度が低い一連のプレーを「積極的」とする。しかし、試合映像からでは審判がどのタイミングからのプレーを消極的としたかがわからないため、本分析ではまず特定の審判が何秒間のプレーで消極的指導を判定しているのかを推定し、その時間内のプレーとそれら以外のプレーの距離が最大になるように各アクションの重さを最適化する。そして、最適化した重みで表した消極的なプレーと試合中のプレーの類似度を求めることで優勢度合いの表現を試みる。 また、本分析では試合中の選手の一連の行動を「プレー」とし、その中で技をかけたりする行為や組み合っているなどの状態のことを「アクション」と呼ぶことにする。","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_1","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"タイブレークにおける戦術:いつ送りバントをすべきか, すべきでないか?","members":"寒河江大葵，松本晃太郎，古川恭治(久留米大学)","first_author":"寒河江大葵","affiliation":"久留米大学","code":"P1-03","abstract":"NPB 2019-2021年のプレイ情報を基に、タイブレーク時の送りバント戦術の効果を評価した。クリーンアップ以外の打者では送りバントが得点期待値を上昇させるのに対し、クリーンアップ打者では下降傾向を示し、状況と打者の打力によって戦術の有効性が異なることを明らかにした。","methods":["ロジスティック回帰","統計的検定","シミュレーション"],"themes":["戦術分析","得点予測","打順・采配","投手起用"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球は戦術の選択が重要視されるスポーツである.セイバーメトリクスでは, 過去のデータからアウトカウントやランナー状況に条件づけた残りイニングでの得点期待値(run potential table [1]) などを求めることで, 戦術の統計学的な評価が行われてきた[2] [3] .本研究は, 戦術選択が最も重要となる, 試合終盤で得点が拮抗した状況に焦点を当てる.終盤での最適戦術に注目する背景として, 近年の野球において新しく導入されたタイブレークがある.タイブレークとは, ある一定回以上の延長戦において, 得点が入りやすい状況から各イニングを始めるルールで, 高校野球ではすでに導入され, 試合時間の短縮などに効果を出している.アメリカ・メジャーリーグでもシーズン中のタイブレークが既に部分的に導入されており, 近い将来, 日本プロ野球(NPB) でも導入が考えられる.しかし, タイブレークを含めた試合終盤での最適な戦術がこれまでセイバーメトリクスの視点で議論されたことはあまりない.タイブレークでは, 0 アウト1-2 塁, または, 0 アウト2塁から半イニングを開始することが多い.そのような状況での攻撃側選択肢として, まず, 送りバントが考えられる.一般に送りバントは, 成功したとしても, アウトカウントが増え得点期待値が下がるため, 効率的でないとされる一方, 得点確率は上がるため, 試合終盤で同点時など, 統計学的に正当化される場合もある[4].しかし, タイブレークのように互いに得点期待値が高い状況から攻撃開始する場合, 送りバントの有効性は一概に明らかではなく, 得点差や, 先攻か後攻か, などに加え, 打者の打撃力や投手との相性など他の様々な要因にも依存すると考えられる.本研究は, NPB 過去3 年間のプレイ情報を基に, 同点や僅差での試合終盤における戦術の有効性の評価を攻撃側の視点から行う.具体的には, タイブレークで想定される特定の状況での送りバントの有効性を評価する.さらに, 送りバントの効果が, 打順や投球カウントなど他の条件で異なるかどうかを調べた上で, 攻撃側が得点期待値や勝利確率を高めるために, どのような状況でどのような戦術をとるべきか検討する.本研究から得られる知見は, 国際試合や将来的なNPB シーズンでのタイブレーク時を含む僅差での試合終盤における戦術選択に関する有益な情報となることが期待される.","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_2","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"投手を見る捕手と打者を見る捕手の相違","members":"金子晴希，佐藤浩志(明星大学)","first_author":"金子晴希","affiliation":"明星大学","code":"P1-04","abstract":"2020-2021年の菅野投手と小林・大城両捕手の配球傾向を分析した。小林選手は投手の調子も考慮した配球を行い、大城選手は打者データを重視した配球をしており、各選手の配球戦略と打者抑制効果の関連性が示された。","methods":["可視化","統計的検定"],"themes":["投球・配球","捕手・バッテリー","選手評価"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年のプロ野球では捕手を固定せず、併用されるケースが非常に多くなってきている。2020 年から2021 年シーズンの計263 試合に対して一人の捕手が200 試合以上スタメンで出たチームは福岡ソフトバンクホークス、埼玉西武ライオンズ、阪神タイガースである。捕手併用を行う球団は投手と相性の良い捕手を専属的な役割で起用するチームや対戦相手を見て捕手を併用する球団がある。本研究では後者の球団に焦点を当てる。同じ投手でも捕手併用によって配球の組み立て方に相違があると推測しその分析を行う。本研究では、データスタジアム株式会社様より提供された2020 年度及び2021 年度の投球捕手構え位置座標データと球種名データを使用し、捕手の構えた位置や球種から配球にどのような傾向があるのかを分析する。本研究で扱う捕手は読売ジャイアンツ所属の小林誠司選手(以後:小林選手)、大城卓三選手(以後:大城選手) とし、投手も読売ジャイアンツ所属の菅野智之投手(以後:菅野投手) として分析を行う。","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_4","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"日本プロ野球において、送りバントは本当に無意味な戦術なのか","members":"北澤拓実，石原正彦(金沢工業大学)","first_author":"北澤拓実","affiliation":"金沢工業大学","code":"P1-05","abstract":"2021年シーズンのデータから送りバント前後の投手変化を分析した。先発投手に対しては定説通り送りバントは無意味だが、7回・8回の中継ぎ・抑え投手に対しては投手が力み甘い球を増やすため有効な戦術であることを検証した。","methods":["統計的検定","指標開発"],"themes":["戦術分析","投手起用"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"昨今、 スポーツ界では、 データを用いた戦術や選手起用が当たり前となっている。 その中で、 野球でもセイバーメトリクスという分析手法が浸透し、従来の野球の定説が覆るようになってきている。このセイバーメトリクスでは、送りバントは無意味なものだとされているが、日本ではいまだに送りバントが戦術として多用されている。 このことに対して、 見ているファンは送りバントに否定的な意見を持つことも多く、現場と見る側にギャップが生じている。 そこで、 送りバントを重宝する理由、送りバントが有効な戦術となる場面を明確にすることで送りバントという戦術の価値がどこで発揮されるかがわかると思い、分析をすることとした。送りバントは普通に打つよりも得点期待値を下げると多くの研究 ・ 論文によって証明されているが、 日本ではいまだに作戦として送りバントが使われている。 実際に『確率過程としての野球分析: 「送りバント」は有効な戦術か』(1)という論文において、送りバントの有効性について検証していたが、2004 年のデータでは送りバントをすることによって得点見込みが、 0.93 点から 0.71 点へと減少し、送りバントをすることで普通に打つよりも得点期待値が下がると結論していた。 ただ、いまだに送りバントが使われているのは、送りバントをすることによる状況の変化を期待してのことだと思うので、 その要因を探っていく。 本分析終了後には、 送りバント前後の投手の変化を明確にし、送りバントがすべての場面で意味がない戦術ではなく、有効な戦術となる場面があるのかを検証する。","excerpt_src":"背景と目的"},{"id":"2022_baseballa_1_6","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"投手と打者の成績区分ごとの配球位置の傾向に関する視覚的分析","members":"辻野涼介，豊田響希，伊藤正彦(北海道情報大学)","first_author":"辻野涼介","affiliation":"北海道情報大学","code":"P1-06","abstract":"2020-2021年のデータを用いてクオリティスタート達成率と打率・長打率により投手と打者を分類し、成績区分ごとの配球傾向をヒートマップで可視化した。上位投手は下位投手より精密な配球をしており、タイプごとの配球差は限定的であることが明らかになった。","methods":["可視化","クラスタリング","機械学習"],"themes":["投球・配球","選手評価","戦術分析"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球において、配球が投手の成績にどれくらい影響があるか、あるいは、バッテリーが打者ごとにどれくらい配球を変えているのかを理解することは重要である。今回特に、成績の良い投手と悪い投手でどれくらい配球の傾向に違いがでるのか、あるいは、バッテリーは打率や長打率が高い選手とそうでない選手に対してどれくらい配球の傾向を変えているのかに着目した。本論文では、まず、投手をクオリティスタート達成率に基づいて分類している。次に、打者を打率と長打率に基づいて4 つのタイプに分類している。そのうえでそれぞれの分類ごとの配球の傾向の違いを可視化し分析を行った。なお、本論文では、配球を各投球ごとのキャッチャーの構え位置と球種に限定し分析している。","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_10","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"コロナ禍における「ホームアドバンテージ」はあるのか","members":"松村拡紀，荒井貫汰，酒折文武(中央大学)","first_author":"松村拡紀","affiliation":"中央大学","code":"P1-07","abstract":"2019-2021年の試合データを無観客から満員まで段階別に分析した。観客数の多寡にかかわらずホームチームの勝率がアウェイを上回り、ホームアドバンテージが維持されていることを確認した。引き分けの増加は延長短縮に伴う投手起用戦略の変化が要因であった。","methods":["統計的検定"],"themes":["勝敗要因","ルール変更"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"スポーツにおいて,「ホームアドバンテージ」という現象がある.これは,ホームチーム,すなわち試合を実施する場所が本拠地であるチームの方がアウェイチームより有利であるという考えである.ホームで試合が開催される時は,観客も選手も「勝利」をより期待することになるのではないだろうか.ホームチームが有利になる要因は様々なことが考えられる.サッカーでのホームアドバンテージについては Jackson(2021)で述べられている.その要因としてスタジアムの環境と観客の声援が挙げられている.また小中(2020)のようなさらに詳しい検証も行われている.野球においてもホームアドバンテージがあると言われており,コロナの無観客などの影響がどのように現れるかを今回検証することにした.そこで本研究では,コロナ禍におけるプロ野球の観衆の人数・応援によるチームの勝率に差はあったのか,またチームの戦略やプレースタイルに変化があったのかを探る.本稿の構成は以下の通りである. 2 節では用いるデータについて, 次に 3 節では集計結果と追加研究について, そして 4 節では考察と今後の課題について述べる.","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_13","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"打者のリスク回避的・愛好的行動について","members":"荻野秀爾，岸下大樹(東京理科大学)","first_author":"荻野秀爾","affiliation":"東京理科大学","code":"P1-08","abstract":"2021年の打者スイング率データから.300打率付近でのスイング行動の変異を分析した。得点圏でのスイング率が通常時と変わらないことから、打者が個人成績を優先する傾向があり、.300を一つの目標指標として意識していることが示唆された。","methods":["統計的検定"],"themes":["打撃","選手評価"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"先行研究である Yashiki and Nakazono (2020)においては、2016 年の 2018 年のデータを用いることで、打率とスイング率の比較を行いリスク回避的行動について分析を行っている。しかし、近年の ops や warなどの異なる指標の普及などに伴い、打者の行動は変化しているかもしれない。本研究は、同様の手法を用いて、彼らの結果が現在もなおロバストであるかについて、2021 年のデータを用いた分析により研究する。加えて、Yashiki and Nakazono (2020)では行われていないより詳細な分析として、「.300 を目指す目的」、 「得点圏の打席における.300 や個人成績の意識」においても 2021 年のデータを用いて研究を行った。","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_14","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"ニューラルネットワークを用いたカウントを投手有利にする球の推定","members":"武田収司，齊藤淳一，廣瀬善大(明治大学)","first_author":"武田収司","affiliation":"明治大学","code":"P1-09","abstract":"2019-2021年の約77万球を対象にニューラルネットワークを構築し、カウント・コース別に投手が投げるストライク確率の高い球を推定した。決め球の効果を検証でき、対戦打者が配球予測を立てやすくなる基礎が構築された。","methods":["ニューラルネットワーク","深層学習"],"themes":["投球・配球","得点予測","戦術分析"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"野球は9 人対9 人及び審判を含めて行う対戦ゲームである。そして、相手より1 点でも多くとることができれば勝利だ。投手としては、目の前にいる打者を抑えなければいけない。打者としては、1 点を取るために投手から打たなければならない。投手対打者という場面を切り取ると1 対1 の対戦ゲームとなる。打者を打ち取るためには、相手が打てないようなボールを投げることが最善策である。一般的に投手が打たれない自信を持って投げているボールは決め球と呼ばれている。決め球の中でも打者から空振りを取る球と、打者が見逃しをしてストライクを取る球は投手にとってとても有利である。打者にボールをコンタクトされてしまうということは、確実に1 点を失う本塁打を打たれる可能性が存在するからである。機械学習の中で、ニューラルネットワーク(以降NN) は主に分析する対象の予測をすることに使われ、スポーツに限らず様々な分野で学習の手助けをしている。野球というスポーツをする上で必ず発生する投手と打者の対戦様式を入力と出力と捉え、投手が対戦する前に持つ情報を入力変数に、打者のスイングおよびコンタクトを組み合わせた状況を出力変数に置き換え予測させるようにする。","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_16","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"選手差を考慮したノーヒットノーラン達成の予測","members":"工藤大吾，元山貴雄，作村建紀(法政大学)","first_author":"工藤大吾","affiliation":"法政大学","code":"P1-10","abstract":"2019-2021年の投手別データをベイズ統計で分析し、投手特性からノーヒットノーラン継続打席数を幾何分布で予測した。投手差を考慮したモデルにより、実際に達成した投手と未達成の有力投手の相対的な能力差が定量化された。","methods":["ベイズ統計","階層モデル","確率モデル"],"themes":["得点予測","選手評価"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"先発投手が相手チームに安打も得点も一切許さずに勝利することをノーヒットノーランという.プロ野球における2000 年から2021 年の達成者は15 人ほどで,毎年達成者が1 人出るかどうかの非常にまれな事象である.ところが,2022 年のシーズンではセリーグ,パリーグ合わせて5人の達成者が出たことで注目を集めている.これについて多くの専門家は投手のレベルが向上したこと,特にストレートの球速や落ちるボールのキレが向上したことが要因だとしている.しかし,達成した投手が必ずしもスピードボールを投げるわけではないことや,フォークボールを決め球としているわけではないことから,十分に説明できているとは言えない.そのため,ノーヒットノーランの可能性を定量的に評価できれば,投手のさらなる能力の向上に寄与できる.また,投手ごとのノーヒットノーランの可能性がわかれば,ファンに対して新たなエンターテインメント性を提供できるようになる.そこで,本研究ではノーヒットノーラン達成の可能性を統計的に分析することを目的とする.この目的のために,登板の中で投手が初めて安打,もしくは得点を許すまでの打席数を「ノーヒットノーラン継続打席数」と新たに定義する.1 打席目でヒットを打たれた場合,その登板でのデータは0 になる.過去にノーヒットノーランを達成したかどうかの2 値変数として扱うよりも投手の特徴を柔軟にとらえることができる.これに関して確率分布を仮定し,選手ごとに能力や達成の可能性を評価する.","excerpt_src":"序論"},{"id":"2022_baseballa_1_24","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"野球における新しい打者評価指標の提案","members":"葛原元，鈴木秀男(慶應義塾大学)","first_author":"葛原元","affiliation":"慶應義塾大学","code":"P1-11","abstract":"Ridge回帰を用いて四死球、単打、二塁打、三塁打、本塁打の得点貢献度を計算し、野球レベル別の打者評価指標を開発した。プロ野球、高校野球、少年野球の3つのレベルで係数が異なることから、野球レベルに合わせた打者評価指標が必要であることが示唆された。","methods":["回帰分析","統計的検定","指標開発"],"themes":["選手評価","打撃","勝敗要因"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"近年、野球界では選手をセイバーメトリクスで評価するようになってきている。セイバーメトリクスとは野球を数字でデータ分析し、統計学的根拠を加えて選手の評価・戦術を考える手法である。セイバーメトリクスにより様々な指標が生まれプロ野球などで使われているが、一般人が導出するには難しく高度なものが多い。また、プロ野球のレベルに合わせた指標が多く少年野球や高校野球などの野球のレベルで正しく選手を評価できるかわからない。ここで本研究では、簡単に導出することができ、野球レベルを反映させた打者評価指標を提案する。","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_35","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"投球のぶれを考慮した投球戦術の提案","members":"寺村知夏，後藤順哉(中央大学)","first_author":"寺村知夏","affiliation":"中央大学","code":"P1-13","abstract":"階層クラスタリングと非階層クラスタリングにより打者を分類し、条件付確率を用いて投球戦術を提案した。投手の投球精度と打者のコース別打率を組み合わせることで、最適な投球位置と球種の選択方法を定量化した。","methods":["クラスタリング","確率モデル","可視化"],"themes":["投球・配球","戦術分析","打撃"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"本研究では、スポーツデータ解析コンぺティションから提供された2019 年~2021 年までの3 年間のシーズンにおける日本プロ野球リーグの投球毎の結果データから打者の相対的特性をクラスタリング分析によって選手を分類し、打者の特性によって良い投球戦術の提案を導くことを目指し、条件付確率を用いて考えていく。","excerpt_src":"要旨"},{"id":"2022_baseballa_1_36","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"守備範囲の時系列的変化から見るペナントレースのゆくえ","members":"齋藤岳，古池克圭，白井康之(大東文化大学)","first_author":"齋藤岳","affiliation":"大東文化大学","code":"P1-14","abstract":"打球位置座標を用いて守備範囲を可視化し、2019年～2021年における内野手の守備範囲の年別変化を分析した。順位が大きく変動した時期に守備範囲の広さが変化した選手が見られ、守備力がチーム成績と関連していることが示唆された。","methods":["可視化","時系列解析","統計的検定"],"themes":["守備","勝敗要因","チーム評価"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"2022 シーズン、セントラル・リーグで圧倒的な力を見せつけた東京ヤクルトスワローズ。 2019、2020シーズンは最下位であったが、2021 年シーズンでは、首位に輝いた。一方、2019、2020 シーズンに首位を飾った読売巨人は、2021 シーズンは 3 位、2022 シーズンではB クラスの4 位という結果に終わった。チームの強さは、打力や投手力によるものであるというのが一般的には周知されている。しかしながら、実は守備力からもチームの強さを推し量ることができるのではないかという思いから、本研究では、提供されたデータを用いて検証を行った。野球における守備の「上手さ」は非常に抽象的な判断基準であり、主観的な要素も大きい。その中でも守備範囲、どんな試合環境にも対応できる力は一つ大きな基準になると考えられる。そこで、守備範囲の分析のほか、守備範囲の年別の変化、試合環境による相違の3 点から検証を行った。その結果、順位変動の分岐点で守備範囲が広がっている選手や狭まっている選手、人工芝の球場と土の球場といった試合環境によって守備範囲に影響がある選手も見られた。1. はじめに野球というスポーツは点数を取られなければ負けることがないことが特徴のひとつであり、また面白い点でもある。プロ野球のリーグ戦において基本的には優勝したチームはその年に一番負け数が少なく、最下位のチームの負け数が一番多い。負けないこと、つまり点数を取られないためには守備能力の高さが必要になってくる。そのため 3 年間優勝したチームの主力選手の守備範囲がチームの守備能力を総合的に判断できると思い守備範囲、守備範囲の年度別の変化、試合環境による相違の3点から分析を行った。優勝した時とできなかった時で守備範囲に差が出てくるのではないかという仮説を検証することが本研究の目的である。","excerpt_src":"概要"},{"id":"2022_baseballa_1_41","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"2018年～2021年 試合データから見たホームアドバンテージの要因","members":"圓谷誠，三谷駿輔，朝日弓未(東京理科大学)","first_author":"圓谷誠","affiliation":"東京理科大学","code":"P1-15","abstract":"ロジスティック回帰分析、相関分析、ウィルコクソン検定、t検定を用いてホームアドバンテージの要因を検証した。観衆因子とルール因子は有意な影響が見られず、習熟度因子がホームアドバンテージに影響していることが統計的に明らかになった。","methods":["ロジスティック回帰","統計的検定","可視化"],"themes":["勝敗要因","チーム評価","球場要因"],"data":["公式成績データ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"現在、日本プロ野球は 1934 年にベーブ・ルースな米大リーグ選抜チームと試合を行うために作られた全日本チームなどを起源として、88 周年を迎えるとされている。また、1936 年に東京巨人、大阪タイガース、名古屋、東京セネタース、阪急、大東京、名古屋金鯱の 7 球団により日本職業野球連盟が設立された。それ以降、何度か名称変更されたのち、1950 年に今の名称である日本野球機構になった。この1950 年以降、各チームの成績が記録され、公式ホームページ[10]に記載されている。ホームアドバンテージに関する研究は、1970 年代半ばから欧米で実証的な研究が行われるようになった。1992 年に Courneya&Carron によって行われた研究では、野球、アメリカンフットボール、バスケットボール、サッカー、アイスホッケーなどのプロリーグ戦の結果からホームアドバンテージの存在が実証された。その一方で、ホームアドバンテージの原因として、観衆因子、ルール因子、習熟因子、移動因子が挙げられていたが、原因について、その詳細は明らかになっていなかった。日本のプロスポーツにおけるホームアドバンテージの研究では 2013 年に瀧上氏が日本プロ野球の2005 年から 2010 年の試合データを基にホームアドバンテージの存在またその要因について研究を行ったが、先程と同様にホームアドバンテージの存在が実証された一方で、その要因について決定的な手掛かりは得られなかった。要因の手がかりを得られない原因として、これらの研究では要因ごとに条件を絞り、勝率のみを比較した分析を行っていたことが考えられる。野球というスポーツは試合において 5 点を取ったとしても、6 点を取られれば負けてしまう。一方、1 点を取り、0 点に抑えれば勝ててしまう。このように勝敗という、結果だけを見た分析ではホームアドバンテージの要因を明らかにすることは難しいと考えられる。また全体を通し、先行研究では 2018 年以降に日本プロ野球のデータを用いたホームアドバンテージの研究が少なかった。その中で、最近のものでは 2022 年に森氏が「観客の有無による試合結果への影響」[5]という観衆因子の研究をされていた。この研究では、分散分析や回帰分析などを用いて、観客の有無と試合への影響を分析していたが、結果としては影響がないという結果になっていた。分析内容としては、観客数を有無でダミー変数にしていた。その為、観客数が 1 人でも 1 万人でも同じとして扱われていた。そういった部分から、より詳細に研究を行う余地があったと考えられる。以上のことから、本研究では 2018 年~2021 年という比較的新しい試合のデータを用いて勝敗だけではなく攻守の指標を用いることや、観衆因子ではキャパシティを考慮し、満席率を用いることなどで、ホームアドバンテージの要因をより詳細に研究を行う。2 1-2 研究背景現在、日本プロ野球には 12 球団が所属しており、東京ヤクルトスワローズ(以下、 「ヤクルト」 )、横浜 DeNA ベイスターズ(以下、 「横浜」 )、阪神タイガース(以下、 「阪神」 )、読売ジャイアンツ(以下、 「巨人」 )、広島東洋カープ(以下、 「広島」 )、中日ドラゴンズ(以下、 「中日」 )以上6 球団からなるセントラル・リーグ(以下、 「セ・リーグ」 )と、オリックス・バファローズ(以下、 「オリックス」 )、福岡ソフトバンクホークス(以下、 「ソフトバンク」 )、埼玉西武ライオンズ(以下、 「西武」 )、東北楽天ゴールデンイーグルス(以下、 「楽天」 )、千葉ロッテマリーンズ(以下、 「ロッテ」 )、北海道日本ハムファイターズ(日本ハム)以上 6 球団からなるパシフィック・リーグ(以下、 「パ・リーグ」 )の2 リーグ制で年 143 試合の公式戦を通じたペナントレース(リーグ戦)を行っている。その中で、各球団はリーグ優勝を目指している。また球団の主な収入源は観客動員から得るチケット収入、テレビ放送等から得る放映権収入、グッズ販売から得るグッズ販売収入、スポンサー収入があり、チケット収入は観客動員数によって収入が増減するため球団にとって非常に重要である。その中で基礎集計をしていく中で以下のことが分かっている。図 1.1 は 2018-2019 年の各球団のリーグ勝率とホーム球場での満席率(入場者数/球場キャパシティ)の散布図になり、図 1.2 は 2018-2021 年におけるセ・リーグ、パ・リーグ両リーグのリーグ勝率とホーム勝率の散布図だ。詳しくは第 2 章の基礎集計の中で説明をするが、勝率の高さが集客に影響を与えている可能性が考えられること。リーグ勝率が高いチームは、それに伴いホーム勝率も高い傾向にあることが分かる。以上のことから勝利と集客を求める球団にとってホームアドバンテージを活かすことは、その両者に影響を与えるため、とても重要であると考えられる。一方、日本プロ野球のデータを扱ったホームアドバンテージにおける研究は過去にも行われているが、ホームアドバンテージの有意性は勝率などから示されているが、『要因の影響について決定的な手掛かりは得られなかった』[1]など、その詳細は明らかになっていない。3図 1.1 2018-2019 年勝率×満席率散布図図 1.2 2018 年~2021 年両リーグ勝率散布図1-3 研究目的研究背景より、セ・リーグ、パ・リーグ問わず日本プロ野球に所属する12 球団にとってホームアドバンテージを活かすことは、勝利と収入という 2 つの求めているものを満たすことに繋がることが分かった。 その為、 本研究ではホームアドバンテージの要因を明らかに4することで、 ホーム環境とアウェイ環境の違いを明確にし、 その特徴からホーム勝率、 アウェイ勝率向上に向けた提案を日本プロ野球に所属する 12 球団に対して行う。そして、研究背景より勝率向上から観客動員数も向上させることで、チケット収入を伸ばすことにも繋げていく。本研究の目的は、 まずホームアドバンテージの要因を明らかにすることであり、 次にそこから日本プロ野球に所属する 12 球団に対し勝率向上に向けた提案を行い、勝率向上させることである。5 1-4 研究内容本研究では以下の 3 つの仮説を基に研究を行う。仮説I:観衆因子がホームアドバンテージに影響を与えている仮説II:ルール因子がホームアドバンテージに影響を与えている仮説III:習熟度因子がホームアドバンテージに影響を与えている仮説Iの観衆因子とは球場内の観衆の密度、そこから生まれる熱量が選手のパフォーマンスや戦績に影響を与えているという仮説である。 仮説IIのルール因子とは、 日本プロ野球の試合ではホームチームが先攻後攻の後攻というルールがある。この先攻後攻があるメジャーなスポーツは野球やソフトボールに限られる。 その為、 このルールによって生まれる先攻後攻の違いが、選手のパフォーマンスや戦績に影響を与えているという仮説が仮説IIのルール因子である。","excerpt_src":"序論"},{"id":"2022_baseballa_1_56","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"いつツーシームを投げれば効率よくアウトカウントを稼げるか","members":"益田大輝，山田隆行(島根大学)","first_author":"益田大輝","affiliation":"島根大学","code":"P1-17","abstract":"10球種の投球結果から各指標を比較し、ロジスティック回帰分析でツーシームの効果を分析した。ツーシームはゴロ率が高く併殺率が最も高い球種であり、カウント少なく、ボール先行の状況での投球が最も効果的であることが明らかになった。","methods":["ロジスティック回帰","統計的検定","確率モデル"],"themes":["投球・配球","投手起用","戦術分析"],"data":["イベントデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"現在, 数多くの変化球がプロ野球で投げられている. その中で, ストレート系変化球と呼ばれる変化球は, 変化量は大きくないものの, その他の変化球と変わらない頻度で投げられている. 今回は, その中でツーシームに注目した. メジャーリーグで活躍している大谷翔平選手は, ツーシームを投げ始めてからストレートの被打率が減少した. この結果は, ツーシームを効果的に投げることができた一例である. しかし, 配球を考えるうえで, 様々な要素が絡んでくるため, 必ずしもツーシームを効果的に投げることができるとは限らない. 要素としては, 相手打者の能力, 投手の調子, 投球環境, 捕手の経験値など考えられる. 本研究では,(1)変化球の投球結果からツーシームの特徴を分析し,アウトカウントにつながる要因を見出す.さらに,(2)カウント・ランナー状況がツーシームの打率に与える影響を分析し,適切なツーシームの配球を提示する.","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_58","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"ピッチャーのコントロールの可視化","members":"畠山義也，鈴木淳斗，小川健太，本多泰理(東洋大学)","first_author":"畠山義也","affiliation":"東洋大学","code":"P1-18","abstract":"捕手の構える位置と投手が投げた位置の関係からコントロール評価指標を開発した。提案した新指標は投球数に依存しない独立な指標として機能し、従来指標と異なる視点からコントロール能力を評価することができた。","methods":["可視化","指標開発","統計的検定"],"themes":["投球・配球","投手起用","選手評価"],"data":["トラッキングデータ"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"当学部では,3年次にデータサイエンスに関する演習科目があり,関心がある対象を分析することができる.当チームは,日本のプロ野球に関心があるメンバから成り,特に投手のコントロールに関心を持ったことから,配球と投手のコントロールに関する可視化を行うこととした.","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_29","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"NTFを用いた球種と投手成績による先発投手の分類","members":"奥田守，寒水孝司(東京理科大学)","first_author":"奥田守","affiliation":"東京理科大学","code":"[口頭]野球1","abstract":"非負値テンソル因子分解により、先発投手を球種と投手成績の関係性から三振型、凡打型、複合型に分類した。2019年から2021年の3年間で投手のタイプが変化する事例も確認され、年度による投手評価の変化が定量的に捉えられた。","methods":["クラスタリング","次元削減","機械学習"],"themes":["投手起用","投球・配球","選手評価"],"data":["イベントデータ"],"free_tags":["テンソル因子分解"],"awards":[],"text_insufficient":false,"excerpt":"近年,日本プロ野球界では,投手の成績が著しく向上し,打者が安打を放つことが難しい「投高打低」の状態にある[1].実際2019 年からはセ・パ両リーグの先発投手の平均防御率が低下し続けている.「投高打低」の要因として,投手の体格の変化や投球フォームの改善による球速の上昇,投球したボールの解析による効率的な練習が,それぞれ投手の能力の向上に寄与しているためだと考えられる.特に,後者に関しては,変化球の質の向上に大きな影響を及ぼしている.変化球には,変化する方向とは別に空振りを狙ったり,凡打を狙ったりと様々なタイプが存在する.例えば,フォークボールは縦の変化量が大きく,一般的に空振りを狙うタイプの変化球(空振り型)である一方,シュートやカットボールは球速が速く,変化量は小さいため,一般的に芯を外して凡打を狙うタイプの変化球(凡打型)である.投手も変化球と同様に,空振りを取り,奪三振が多いタイプの投手(三振型)や,凡打を打たせてアウトを量産するタイプの投手(凡打型)など,様々なタイプが存在する.しかし,この投手のタイプは変化球に寄与しているものなのか,あるいは投手自身にその特徴があるのかは現在明らかになっていない.そこで本研究では,成績に基づく投手のタイプ(三振型or 凡打型)と球種のタイプ(空振り型or 凡打型)の関連をこれら2 つの特徴を同時に考えることで,投手を分類することを目的とする.この目的のためには,投手× 球種×結果の3 つ組について解析する必要がある.3 つ組によって値が定義されるデータに関しては,既存の行列型データに対する方法を用いることは適切ではない.そこで,本研究では多次元の配列であるテンソルを用いることで3 次のデータの表現を可能とした.ここで扱うデータが非負であること,また分類にはスパース性が求められることから,分析手法として非負値テンソル因子分解(NTF)を用いることで,様々な要因の多項関係を明らかにすることができる[2].この手法は,購買行動分析や観光行動分析など,多くの分野で適用されている[3, 4].また,分類ごとに線形回帰分析を適用し,自責点との関連の検証を行った.","excerpt_src":"はじめに"},{"id":"2022_baseballa_1_47","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"カウント推移に着目したフルカウント時の打撃アプローチの変化分析","members":"村田直大，安井清一(東京理科大学)","first_author":"村田直大","affiliation":"東京理科大学","code":"[口頭]野球2","abstract":"行動経済学の損失回避性理論を用いて、フルカウント到達前のカウント推移によって打撃アプローチが異なることを母比率の差の検定で検証した。3-1からのフルカウントと2-2からのフルカウントでスイング率に有意な差が見られ、心理状態がカウント推移に依存していることが示唆された。","methods":["統計的検定","確率モデル","機械学習"],"themes":["打撃","戦術分析","勝敗要因"],"data":["イベントデータ"],"free_tags":[],"awards":["野球部門 最優秀賞"],"text_insufficient":false,"excerpt":"野球において, 「投手有利のカウント」, 「打者有利のカウント」という言葉をよく耳にする。ストライクが先行すれば投手有利, ボールが先行すれば打者有利になると考えられており, NPB の 2021 年のカウント別成績を見てもカウントによる有利不利は顕著に表れている(表 1)。表 1 カウント別の成績これは, ストライクが増えることで, 投手はボール球を有効活用できるようになり, ボールが増えることで, 打者は自分の狙いの球を待つ余裕ができるようになることが要因として挙げられる。つまり, ストライク先行かボール先行かによって状況は全く別のものとなり, 投手としてはいかにストライク先行で打者を追い込むかが鍵となる。カウントによって有利不利が明確である中, 唯一の例外が 3-2(3 ボール 2 ストライク), つまりフルカウントである。成績を見ても, 打率, 長打率は平均を下回っているが, 出塁率は平均を大きく上回っている。その要因として, フルカウントが投手も打者も追い込まれているという意味で他と比べて特殊なカウントである点が挙げられる。このように, カウント別の成績に注目することで,投手と打者の関係性を把握することができる。打席内では 1 球ごとに有利不利が変わり, 戦略や心理状態に大きな差を及ぼす。実際, 打者の心理状態が打撃に変化を与えていることが明らかになっている。Yashiki(2020)らによると, 打者が打席内において,行動を心理的な側面から分析する行動経済学の理論の1 つである損失回避性に沿った行動をとっていることが明らかとなった[1]。NPB において打者が打率 3 割を境界に 3 割以上を利益, 3 割未満を損失と認知しており, 損失を回避するための打撃アプローチをとるとされている。損失回避性とは人間が損失を避けようとする思考の習性であり, 利益から得られる満足より損失による苦痛を 2.25 倍感じることが明らかになっている(図 1) [2]。 そのため, 人間は利益がある時はその利益を失わないように行動し, 損失がある時はその損失を埋めるためにリスクがあっても利益になる行動をするとされている。図 1 損失回避性B-S 打率出塁率長打率0-0 .330 .332 .531 1-0 .330 .325 .568 2-0 .346 .363 .600 3-0 .409 .944 .774 0-1 .307 .309 .445 1-1 .314 .314 .488 2-1 .325 .328 .528 3-1 .342 .726 .603 0-2 .140 .146 .182 1-2 .163 .170 .221 2-2 .187 .192 .265 3-2 .225 .463 .332 .245 .311 .374このように, 野球ではあらゆる要因が選手の戦術や心理状態に大きな影響を与えるにもかかわらず, カウントという括りで注目されるのはカウント別の成績であり, そのカウントに至るまでの流れ, つまりカウント推移への注目度は低い。そこで, カウント推移ごとの性質を分析し, 違いを発見できれば戦術の組み立てに役立つ情報を提供できると考えられる。本研究ではカウントによって対応を変えていく打者にフォーカスを当て, カウント推移が打撃アプローチに与える影響を調査する。行動経済学の観点を踏まえることで, カウント推移が打者に及ぼす心理状態とそれに伴う行動変化を明らかにする。先述したフルカウントでは, 投手と打者の両方が追い込まれており, ファウルを除いて投げた球が打席結果となる, いわゆる結果球になることから行動がデータとして反映されやすいといえる。つまり, 行動経済学の観点において,心理状態が最もデータとして反映されるカウントと言い換えることができる。以上の点からフルカウントに着目して検証を行った。本稿の構成は以下の通りである。第 2 章では行動経済学の観点から, フルカウントに関して立てた2 つの仮説を述べる。第 3 章では, 仮説を実際に検証し, 結果及び考察を行う。第 4 章では結論と今後の課題を提示する。","excerpt_src":"序論"},{"id":"2022_baseballa_1_18","year":2022,"dept":"野球部門","dept_detail":"野球部門","title":"プロ野球選手の環境変化を想定したコンディション要因の解析","members":"夏見光太郎，三橋諒大，吉羽優樹，齊藤史哲(千葉工業大学)","first_author":"夏見光太郎","affiliation":"千葉工業大学","code":"[口頭]野球3","abstract":"2019-2021年の気象・移動・登板データとニューラルネットワークを用いて、投手のコンディション変化に影響する要因を分析した。球数、移動距離、不快指数、湿度が球速に有意な影響を与えており、選手起用における環境要因の考慮が重要であることを示した。","methods":["ニューラルネットワーク","機械学習"],"themes":["怪我・コンディション","選手起用","投手起用"],"data":["外部データ併用"],"free_tags":[],"awards":[],"text_insufficient":false,"excerpt":"昨今,セイバーメトリクスとよばれる野球に関する統計学を用いた分析と指標に基づいた野球に関する研究が盛んに行われている.こうした中で,近年のNPB では選手の怪我防止やシーズンを通した高いパフォーマンスの維持などの理由から,選手の分業や負担軽減が重視される傾向がある.実際に先発投手の完投数は2005 年以降では2006年の148 をピークに減少傾向であり,2019 年では25 まで減っている.中継ぎ投手でも連戦連投は回避される場面も多く,野手でも試合展開に応じて早めに選手を交代し休ませて翌日以降の試合に備える起用も増えている.これらの現状から,パフォーマンスに影響するコンディションを考慮した選手起用が重要になりつつある. 2022 年の東北楽天ゴールデンイーグルスの月別の成績を例に挙げると,3 月・4 月の序盤は16 勝6 敗1 分で勝率.727 と大きく勝ち越しているが,逆に6 月から8 月では29 勝38 敗1 分で勝率.426 と全ての月で負け越しており,シーズン後半に失速した形となっている.このチー
